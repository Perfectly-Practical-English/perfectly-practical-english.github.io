<script>
/* ================================
   SECTION / HEADER ISOLATION ENGINE
   ================================ */

(function (global) {
  let RAW_TEXT = "";
  let sections = [];
  let activeIndex = -1;

  function parseSections(raw) {
    if (!raw || typeof raw !== "string") return [];
    const chunks = raw.split(/\n(?=~+)/);
    return chunks
      .map(chunk => chunk.trim())
      .filter(chunk => chunk.startsWith("~"))
      .map(chunk => {
        const lines = chunk.split("\n");
        const name = lines.shift().replace(/^~+/, "").trim();
        const text = lines.join("\n").trim();
        return { name, text };
      });
  }

  function loadRawText(rawText) {
    RAW_TEXT = rawText;
    sections = parseSections(RAW_TEXT);
    activeIndex = sections.length ? 0 : -1;
    return sections.slice();
  }

  function getSections() {
    return sections.slice();
  }

  function selectSection(index) {
    if (index < 0 || index >= sections.length) return null;
    activeIndex = index;
    notifyChange();
    return getActiveSection();
  }

  function getActiveSection() {
    if (activeIndex === -1) return null;
    return {
      index: activeIndex,
      name: sections[activeIndex].name,
      text: sections[activeIndex].text
    };
  }

  function notifyChange() {
    if (typeof window !== "undefined") {
      window.dispatchEvent(
        new CustomEvent("sectionchange", {
          detail: getActiveSection()
        })
      );
    }
  }

  global.SectionEngine = {
    loadRawText,
    getSections,
    selectSection,
    getActiveSection
  };
})(window);
</script>

<script>
/* ================================
   KALEIDOSCOPE GAME LOGIC & DROPDOWN
   ================================ */

SectionEngine.loadRawText(rawVocabText);
const sections = SectionEngine.getSections();

let currentSectionName = 'No Section';
let wordList = [];
const vocabList = [];
const remainingWords = new Set();
let totalVocabCount = 0;
let correctWordsCount = 0;
let gameStarted = false;

const canvas = document.getElementById('kaleidoscope');
const ctx = canvas.getContext('2d');
let w = canvas.width = window.innerWidth;
let h = canvas.height = window.innerHeight;
let cx = w / 2, cy = h / 2;

const hotspot = document.getElementById('centerHotspot');
const controls = document.getElementById('controls');
const closeBtn = document.getElementById('closeControls');

hotspot.addEventListener('click', () => controls.classList.toggle('visible'));
closeBtn.addEventListener('click', () => controls.classList.remove('visible'));

let slices = +document.getElementById('slices').value;
let speed = +document.getElementById('speed').value;
let beadSize = +document.getElementById('size').value;
let density = +document.getElementById('density').value;
let zoom = +document.getElementById('zoom').value;

const slicesValue = document.getElementById('slicesValue');
const speedValue = document.getElementById('speedValue');
const sizeValue = document.getElementById('sizeValue');
const densityValue = document.getElementById('densityValue');
const zoomValue = document.getElementById('zoomValue');

document.getElementById('slices').addEventListener('input', e => {
  slices = +e.target.value;
  slicesValue.textContent = slices;
  generateBeads();
});
document.getElementById('speed').addEventListener('input', e => {
  speed = +e.target.value;
  speedValue.textContent = speed.toFixed(4);
});
document.getElementById('size').addEventListener('input', e => {
  beadSize = +e.target.value;
  sizeValue.textContent = beadSize;
  generateBeads();
});
document.getElementById('density').addEventListener('input', e => {
  density = +e.target.value;
  densityValue.textContent = density;
  generateBeads();
});
document.getElementById('zoom').addEventListener('input', e => {
  zoom = +e.target.value;
  zoomValue.textContent = zoom.toFixed(2);
});

function parseSectionVocab(sectionText) {
  return sectionText
    .split("\n")
    .map(line => {
      const match = line.match(/•\s*([^\s–<]+)/);
      return match ? { word: match[1] } : null;
    })
    .filter(Boolean);
}

let currentColorScheme = 'rainbow';
function generateColorScheme(scheme) {
  const colors = {
    rainbow: ['#FF0000','#FF7F00','#FFFF00','#00FF00','#0000FF','#4B0082','#8B00FF'],
    cool: ['#ADD8E6','#20B2AA','#00CED1','#4682B4','#5F9EA0'],
    warm: ['#FF6347','#FF4500','#FFD700','#FF8C00','#FF1493'],
    pastel: ['#FFD1DC','#B0E0E6','#F5B7B1','#FFEB3B','#C3E8B2']
  };
  return colors[scheme] || colors.rainbow;
}

document.getElementById('colorScheme').addEventListener('change', e => {
  currentColorScheme = e.target.value;
  generateBeads();
});

let beads = [];
let globalAngle = 0;

function generateBeads() {
    const shapes = Array.from(remainingWords);
    if (!shapes.length) {
        beads = [];
        return;
    }

    const colors = generateColorScheme(currentColorScheme);
    beads = [];
    const remainingRatio = shapes.length / (vocabList.length || 1);

    for (let i = 0; i < density; i++) {
        beads.push({
            r: Math.random() * Math.min(w,h) * 0.45,
            theta: Math.random() * (Math.PI*2 / slices),
            angleOffset: Math.random() * Math.PI*2,
            speed: 0.0005 + (0.003 - 0.0005) * Math.pow(remainingRatio, 3),
            size: 6 + (beadSize + 20 - 6) * (1 - Math.pow(remainingRatio, 2)),
            color: colors[Math.floor(Math.random()*colors.length)],
            shape: shapes[Math.floor(Math.random()*shapes.length)],
            alpha: 0.4 + Math.random()*0.4
        });
    }
}

function drawBead(b) {
    const x = b.r * Math.cos(b.theta + b.angleOffset);
    const y = b.r * Math.sin(b.theta + b.angleOffset);

    ctx.save();
    ctx.globalAlpha = b.alpha;
    ctx.font = `${b.size}px sans-serif`;
    ctx.fillStyle = b.color;
    ctx.shadowColor = b.color;
    ctx.shadowBlur = Math.min(b.size * 0.25, 5);
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(b.shape, x, y);
    ctx.restore();
}

function animate() {
    ctx.fillStyle = "rgba(0,0,0,0.08)";
    ctx.fillRect(0,0,w,h);

    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(zoom, zoom);
    ctx.rotate(globalAngle);

    const sliceAngle = (Math.PI*2)/slices;

    beads.forEach(b => {
        b.angleOffset += b.speed;
        for (let i=0;i<slices;i++){
            ctx.save();
            ctx.rotate(sliceAngle*i);
            if (i%2) ctx.scale(1,-1);
            drawBead(b);
            ctx.restore();
        }
    });

    ctx.restore();
    globalAngle += speed;
    requestAnimationFrame(animate);
}

animate();

window.addEventListener("resize", ()=>{
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
    cx = w/2;
    cy = h/2;
    generateBeads();
});

const wordInput = document.getElementById('wordInput');
wordInput.addEventListener('input', () => {
    if (!gameStarted) return;
    const typed = wordInput.value.trim().toLowerCase();
    if (remainingWords.has(typed)) {
        remainingWords.delete(typed);
        correctWordsCount++;
        wordInput.value = '';
        beads = beads.filter(b => b.shape.toLowerCase() !== typed);

        if (remainingWords.size === 0) {
            alert('Section cleared!');
        }
    }
});

/* ================================
   DROPDOWN MODAL LOGIC (AUTO-START)
================================ */

const btn = document.getElementById("sectionSelectorBtn");
const modalRoot = document.getElementById("sectionModalRoot");
const modalBackdrop = document.getElementById("sectionModalBackdrop");
const modalClose = document.getElementById("sectionModalClose");
const listContainer = document.getElementById("sectionListContainer");
const shapeOptionsDiv = document.getElementById('shapeOptions');

let selectedModalIndex = -1;

function openModal() {
  listContainer.innerHTML = "";
  if (sections.length === 0) {
    listContainer.innerHTML = "<div style='padding:10px; text-align:center; color:#666;'>No categories found.</div>";
  } else {
    sections.forEach((sec, index) => {
      const item = document.createElement("div");
      item.className = "section-item" + (selectedModalIndex === index ? " selected" : "");
      item.textContent = sec.name;
      item.addEventListener("click", () => {
        document.querySelectorAll('.section-item').forEach(i => i.classList.remove('selected'));
        item.classList.add("selected");
        selectedModalIndex = index;

        currentSectionName = sec.name;
        btn.textContent = sec.name;
        closeModal();
        prepareSection(index);
      });
      listContainer.appendChild(item);
    });
  }
  modalRoot.style.display = "block";
}

function closeModal() {
  modalRoot.style.display = "none";
}

if (btn) btn.addEventListener("click", openModal);
if (modalClose) modalClose.addEventListener("click", closeModal);
if (modalBackdrop) modalBackdrop.addEventListener("click", closeModal);

window.addEventListener("DOMContentLoaded", () => {
  currentSectionName = "No Section";
  btn.textContent = "Topics";
});

let selectedSectionIndex = -1;

function prepareSection(index) {
  selectedSectionIndex = index;
  const section = SectionEngine.selectSection(index);
  if (!section) return;

  const words = parseSectionVocab(section.text);

  vocabList.length = 0;
  remainingWords.clear();

  words.forEach(w => {
    vocabList.push(w);
    remainingWords.add(w.word.toLowerCase());
  });
  totalVocabCount = vocabList.length;
  correctWordsCount = 0;

  shapeOptionsDiv.innerHTML = "";
  vocabList.forEach(vocab => {
    const label = document.createElement("label");
    const input = document.createElement("input");
    input.type = "checkbox";
    input.className = "shapeOption";
    input.value = vocab.word;
    input.checked = true;
    label.appendChild(input);
    label.appendChild(document.createTextNode(vocab.word));
    shapeOptionsDiv.appendChild(label);
  });

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = "black";
  ctx.fillRect(0, 0, w, h);
  generateBeads();

  gameStarted = true;
  wordInput.disabled = false;
  wordInput.focus();
  scoreboardContainer.textContent = '';
  scoreButtons.style.display = 'none';
}

/* ================================
   SUBMIT FLOW
   ================================ */

const submitBtn = document.getElementById('submitBtn');
const scoreboardContainer = document.getElementById('scoreboardContainer');
const scoreButtons = document.getElementById('scoreButtons');
const copyBtn = document.getElementById('copyBtn');
const downloadTxtBtn = document.getElementById('downloadTxtBtn');
const downloadPngBtn = document.getElementById('downloadPngBtn');

function getScoreboardFilename(extension) {
  if (scoreboardContainer && scoreboardContainer.textContent.trim()) {
    let firstLine = scoreboardContainer.textContent.split('\n')[0];
    let baseName = firstLine
      .replace(/\|/g, '_')
      .replace(/\s+/g, '_')
      .replace(/[:\/]/g, '-');
    return baseName + '.' + extension;
  }
  return 'scoreboard.' + extension;
}

function submitResults() {
  if (selectedSectionIndex === -1) {
    alert('Topics');
    return;
  }

  const now = new Date();
  const pad = n => n.toString().padStart(2,'0');

  const dateStr = `${pad(now.getDate())}/${pad(now.getMonth()+1)}/${now.getFullYear()}`;
  const timeStr = `${pad(now.getHours())}:${pad(now.getMinutes())}`;

  const total = totalVocabCount || 1;
  const pct = Math.round((correctWordsCount / total) * 100);
  const pctStr = pct + '%';

  let currentFile = window.location.pathname.split('/').pop() || 'unknown.html';
  currentFile = currentFile.split('?')[0].split('#')[0];
  const filenameWithoutExt = currentFile.replace(/\.[^/.]+$/, "");

  const idVal = document.getElementById('studentId')?.value.trim() || 'Guest';
  const resolvedName = window.resolveStudentNameFromId ? window.resolveStudentNameFromId(idVal) : (idVal ? "Guest" : "Guest");

  const scoreLine = `${filenameWithoutExt}|${currentSectionName}|${resolvedName}|${idVal}|${dateStr}|${timeStr}|${correctWordsCount}/${total}|${pctStr}`;

  scoreboardContainer.textContent = scoreLine;
  scoreButtons.style.display = 'flex';

  if (window.saveResult) {
    window.saveResult(scoreLine);
  }
}

function copyScoreboard(){
  if(!scoreboardContainer.textContent) return;
  navigator.clipboard.writeText(scoreboardContainer.textContent).then(()=>{ alert("Scoreboard copied to clipboard."); });
}

function downloadScoreText(){
  if(!scoreboardContainer.textContent) return;
  const downloadFileName = getScoreboardFilename('txt');
  const blob = new Blob([scoreboardContainer.textContent],{type:"text/plain"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = downloadFileName;
  document.body.appendChild(a);
  a.click();
  setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); }, 100);
}

async function downloadScorePng(){
  if(!scoreboardContainer.textContent) return;
  try{
    if(!window.html2canvas) await loadHtml2Canvas();
    const canvas = await window.html2canvas(scoreboardContainer,{backgroundColor:null});
    canvas.toBlob(blob => {
      const downloadFileName = getScoreboardFilename('png');
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = downloadFileName;
      document.body.appendChild(a);
      a.click();
      setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); }, 100);
    });
  }catch(e){ alert('Error generating image: '+e.message); }
}

function loadHtml2Canvas(){
  return new Promise((res,rej)=>{
    const script = document.createElement('script');
    script.src = 'https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js';
    script.onload = res;
    script.onerror = () => rej(new Error('Failed to load html2canvas'));
    document.head.appendChild(script);
  });
}

submitBtn.addEventListener('click', submitResults);
copyBtn.addEventListener('click', copyScoreboard);
downloadTxtBtn.addEventListener('click', downloadScoreText);
downloadPngBtn.addEventListener('click', downloadScorePng);

</script>

<script>
(function(){
const RAW_TEXT = `
How to use this page...
• Enter your ID number into the ID field — Auto: Your name will automatically populate if registered, and entering your ID unlocks score tracking.
• Click the Select a section button to choose a vocabulary category from the pop-up menu.
• Click the Instructions button anytime to view the gameplay guide.
• Click the center of the kaleidoscope to open settings and customize the display.
• Type the vocabulary words correctly into the input bar as they appear in the kaleidoscope animation to clear them.
• Click Submit to view your final score and percentage — Auto: Your results are compiled into a scoreboard record and logged automatically to the database.
• Use the Copy, Text, or PNG buttons to download or copy your score record.
`;

function parseRawInstructions(text){
  const lines = text.split("\n").map(l => l.trim()).filter(Boolean);
  const html = [];
  lines.forEach(line => {
    if(line === "---"){
      html.push(`<hr>`);
      return;
    }
    if(/^\d+\./.test(line)){
      html.push(`<p>${line}</p>`);
      return;
    }
    if(!/[.!?:]$/.test(line)){
      html.push(`<h3>${line}</h3>`);
      return;
    }
    html.push(`<p>${line}</p>`);

<script>
/* ================================
   SECTION / HEADER ISOLATION ENGINE
   ================================ */

(function (global) {
  let RAW_TEXT = "";
  let sections = [];
  let activeIndex = -1;

  function parseSections(raw) {
    if (!raw || typeof raw !== "string") return [];
    const chunks = raw.split(/\n(?=~+)/);
    return chunks
      .map(chunk => chunk.trim())
      .filter(chunk => chunk.startsWith("~"))
      .map(chunk => {
        const lines = chunk.split("\n");
        const name = lines.shift().replace(/^~+/, "").trim();
        const text = lines.join("\n").trim();
        return { name, text };
      });
  }

  function loadRawText(rawText) {
    RAW_TEXT = rawText;
    sections = parseSections(RAW_TEXT);
    activeIndex = sections.length ? 0 : -1;
    return sections.slice();
  }

  function getSections() {
    return sections.slice();
  }

  function selectSection(index) {
    if (index < 0 || index >= sections.length) return null;
    activeIndex = index;
    notifyChange();
    return getActiveSection();
  }

  function getActiveSection() {
    if (activeIndex === -1) return null;
    return {
      index: activeIndex,
      name: sections[activeIndex].name,
      text: sections[activeIndex].text
    };
  }

  function notifyChange() {
    if (typeof window !== "undefined") {
      window.dispatchEvent(
        new CustomEvent("sectionchange", {
          detail: getActiveSection()
        })
      );
    }
  }

  global.SectionEngine = {
    loadRawText,
    getSections,
    selectSection,
    getActiveSection
  };
})(window);
</script>

<script>
/* ================================

   ================================ */

SectionEngine.loadRawText(rawVocabText);
const sections = SectionEngine.getSections();

let currentSectionName = 'No Section';
let wordList = [];
const vocabList = [];
const remainingWords = new Set();
let totalVocabCount = 0;
let correctWordsCount = 0;
let gameStarted = false;

const canvas = document.getElementById('kaleidoscope');
const ctx = canvas.getContext('2d');
let w = canvas.width = window.innerWidth;
let h = canvas.height = window.innerHeight;
let cx = w / 2, cy = h / 2;

const hotspot = document.getElementById('centerHotspot');
const controls = document.getElementById('controls');
const closeBtn = document.getElementById('closeControls');

hotspot.addEventListener('click', () => controls.classList.toggle('visible'));
closeBtn.addEventListener('click', () => controls.classList.remove('visible'));

let slices = +document.getElementById('slices').value;
let speed = +document.getElementById('speed').value;
let beadSize = +document.getElementById('size').value;
let density = +document.getElementById('density').value;
let zoom = +document.getElementById('zoom').value;

const slicesValue = document.getElementById('slicesValue');
const speedValue = document.getElementById('speedValue');
const sizeValue = document.getElementById('sizeValue');
const densityValue = document.getElementById('densityValue');
const zoomValue = document.getElementById('zoomValue');

document.getElementById('slices').addEventListener('input', e => {
  slices = +e.target.value;
  slicesValue.textContent = slices;
  generateBeads();
});
document.getElementById('speed').addEventListener('input', e => {
  speed = +e.target.value;
  speedValue.textContent = speed.toFixed(4);
});
document.getElementById('size').addEventListener('input', e => {
  beadSize = +e.target.value;
  sizeValue.textContent = beadSize;
  generateBeads();
});
document.getElementById('density').addEventListener('input', e => {
  density = +e.target.value;
  densityValue.textContent = density;
  generateBeads();
});
document.getElementById('zoom').addEventListener('input', e => {
  zoom = +e.target.value;
  zoomValue.textContent = zoom.toFixed(2);
});

function parseSectionVocab(sectionText) {
  return sectionText
    .split("\n")
    .map(line => {
      const match = line.match(/•\s*([^\s–<]+)/);
      return match ? { word: match[1] } : null;
    })
    .filter(Boolean);
}

let currentColorScheme = 'rainbow';
function generateColorScheme(scheme) {
  const colors = {
    rainbow: ['#FF0000','#FF7F00','#FFFF00','#00FF00','#0000FF','#4B0082','#8B00FF'],
    cool: ['#ADD8E6','#20B2AA','#00CED1','#4682B4','#5F9EA0'],
    warm: ['#FF6347','#FF4500','#FFD700','#FF8C00','#FF1493'],
    pastel: ['#FFD1DC','#B0E0E6','#F5B7B1','#FFEB3B','#C3E8B2']
  };
  return colors[scheme] || colors.rainbow;
}

document.getElementById('colorScheme').addEventListener('change', e => {
  currentColorScheme = e.target.value;
  generateBeads();
});

let beads = [];
let globalAngle = 0;

function generateBeads() {
    const shapes = Array.from(remainingWords);
    if (!shapes.length) {
        beads = [];
        return;
    }

    const colors = generateColorScheme(currentColorScheme);
    beads = [];
    const remainingRatio = shapes.length / (vocabList.length || 1);

    for (let i = 0; i < density; i++) {
        beads.push({
            r: Math.random() * Math.min(w,h) * 0.45,
            theta: Math.random() * (Math.PI*2 / slices),
            angleOffset: Math.random() * Math.PI*2,
            speed: 0.0005 + (0.003 - 0.0005) * Math.pow(remainingRatio, 3),
            size: 6 + (beadSize + 20 - 6) * (1 - Math.pow(remainingRatio, 2)),
            color: colors[Math.floor(Math.random()*colors.length)],
            shape: shapes[Math.floor(Math.random()*shapes.length)],
            alpha: 0.4 + Math.random()*0.4
        });
    }
}

function drawBead(b) {
    const x = b.r * Math.cos(b.theta + b.angleOffset);
    const y = b.r * Math.sin(b.theta + b.angleOffset);

    ctx.save();
    ctx.globalAlpha = b.alpha;
    ctx.font = `${b.size}px sans-serif`;
    ctx.fillStyle = b.color;
    ctx.shadowColor = b.color;
    ctx.shadowBlur = Math.min(b.size * 0.25, 5);
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(b.shape, x, y);
    ctx.restore();
}

function animate() {
    ctx.fillStyle = "rgba(0,0,0,0.08)";
    ctx.fillRect(0,0,w,h);

    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(zoom, zoom);
    ctx.rotate(globalAngle);

    const sliceAngle = (Math.PI*2)/slices;

    beads.forEach(b => {
        b.angleOffset += b.speed;
        for (let i=0;i<slices;i++){
            ctx.save();
            ctx.rotate(sliceAngle*i);
            if (i%2) ctx.scale(1,-1);
            drawBead(b);
            ctx.restore();
        }
    });

    ctx.restore();
    globalAngle += speed;
    requestAnimationFrame(animate);
}

animate();

window.addEventListener("resize", ()=>{
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
    cx = w/2;
    cy = h/2;
    generateBeads();
});

const wordInput = document.getElementById('wordInput');
wordInput.addEventListener('input', () => {
    if (!gameStarted) return;
    const typed = wordInput.value.trim().toLowerCase();
    if (remainingWords.has(typed)) {
        remainingWords.delete(typed);
        correctWordsCount++;
        wordInput.value = '';
        beads = beads.filter(b => b.shape.toLowerCase() !== typed);

        if (remainingWords.size === 0) {
            alert('Section cleared!');
        }
    }
});

let selectedModalIndex = -1;

function openModal() {
  listContainer.innerHTML = "";
  if (sections.length === 0) {
    listContainer.innerHTML = "<div style='padding:10px; text-align:center; color:#666;'>No categories found.</div>";
  } else {
    sections.forEach((sec, index) => {
      const item = document.createElement("div");
      item.className = "section-item" + (selectedModalIndex === index ? " selected" : "");
      item.textContent = sec.name;
      item.addEventListener("click", () => {
        document.querySelectorAll('.section-item').forEach(i => i.classList.remove('selected'));
        item.classList.add("selected");
        selectedModalIndex = index;

        currentSectionName = sec.name;
        btn.textContent = sec.name;
        closeModal();
        prepareSection(index);
      });
      listContainer.appendChild(item);
    });
  }
  modalRoot.style.display = "block";
}

function closeModal() {
  modalRoot.style.display = "none";
}

if (btn) btn.addEventListener("click", openModal);
if (modalClose) modalClose.addEventListener("click", closeModal);
if (modalBackdrop) modalBackdrop.addEventListener("click", closeModal);

window.addEventListener("DOMContentLoaded", () => {
  currentSectionName = "No Section";
  btn.textContent = "Topics";
});

let selectedSectionIndex = -1;

function prepareSection(index) {
  selectedSectionIndex = index;
  const section = SectionEngine.selectSection(index);
  if (!section) return;

  const words = parseSectionVocab(section.text);

  vocabList.length = 0;
  remainingWords.clear();

  words.forEach(w => {
    vocabList.push(w);
    remainingWords.add(w.word.toLowerCase());
  });
  totalVocabCount = vocabList.length;
  correctWordsCount = 0;

  shapeOptionsDiv.innerHTML = "";
  vocabList.forEach(vocab => {
    const label = document.createElement("label");
    const input = document.createElement("input");
    input.type = "checkbox";
    input.className = "shapeOption";
    input.value = vocab.word;
    input.checked = true;
    label.appendChild(input);
    label.appendChild(document.createTextNode(vocab.word));
    shapeOptionsDiv.appendChild(label);
  });

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = "black";
  ctx.fillRect(0, 0, w, h);
  generateBeads();

  gameStarted = true;
  wordInput.disabled = false;
  wordInput.focus();
  scoreboardContainer.textContent = '';
  scoreButtons.style.display = 'none';
}

  const now = new Date();
  const pad = n => n.toString().padStart(2,'0');

  const dateStr = `${pad(now.getDate())}/${pad(now.getMonth()+1)}/${now.getFullYear()}`;
  const timeStr = `${pad(now.getHours())}:${pad(now.getMinutes())}`;

  const total = totalVocabCount || 1;
  const pct = Math.round((correctWordsCount / total) * 100);
  const pctStr = pct + '%';

  let currentFile = window.location.pathname.split('/').pop() || 'unknown.html';
  currentFile = currentFile.split('?')[0].split('#')[0];
  const filenameWithoutExt = currentFile.replace(/\.[^/.]+$/, "");

  const idVal = document.getElementById('studentId')?.value.trim() || 'Guest';
  const resolvedName = window.resolveStudentNameFromId ? window.resolveStudentNameFromId(idVal) : (idVal ? "Guest" : "Guest");

  const scoreLine = `${filenameWithoutExt}|${currentSectionName}|${resolvedName}|${idVal}|${dateStr}|${timeStr}|${correctWordsCount}/${total}|${pctStr}`;

  scoreboardContainer.textContent = scoreLine;
  scoreButtons.style.display = 'flex';

  if (window.saveResult) {
    window.saveResult(scoreLine);
  }
}

function copyScoreboard(){
  if(!scoreboardContainer.textContent) return;
  navigator.clipboard.writeText(scoreboardContainer.textContent).then(()=>{ alert("Scoreboard copied to clipboard."); });
}

function downloadScoreText(){
  if(!scoreboardContainer.textContent) return;
  const downloadFileName = getScoreboardFilename('txt');
  const blob = new Blob([scoreboardContainer.textContent],{type:"text/plain"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = downloadFileName;
  document.body.appendChild(a);
  a.click();
  setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); }, 100);
}

async function downloadScorePng(){
  if(!scoreboardContainer.textContent) return;
  try{
    if(!window.html2canvas) await loadHtml2Canvas();
    const canvas = await window.html2canvas(scoreboardContainer,{backgroundColor:null});
    canvas.toBlob(blob => {
      const downloadFileName = getScoreboardFilename('png');
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = downloadFileName;
      document.body.appendChild(a);
      a.click();
      setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); }, 100);
    });
  }catch(e){ alert('Error generating image: '+e.message); }
}

function loadHtml2Canvas(){
  return new Promise((res,rej)=>{
    const script = document.createElement('script');
    script.src = 'https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js';
    script.onload = res;
    script.onerror = () => rej(new Error('Failed to load html2canvas'));
    document.head.appendChild(script);
  });
}

submitBtn.addEventListener('click', submitResults);
copyBtn.addEventListener('click', copyScoreboard);
downloadTxtBtn.addEventListener('click', downloadScoreText);
downloadPngBtn.addEventListener('click', downloadScorePng);

function parseRawInstructions(text){
  const lines = text.split("\n").map(l => l.trim()).filter(Boolean);
  const html = [];
  lines.forEach(line => {
    if(line === "---"){
      html.push(`<hr>`);
      return;
    }
    if(/^\d+\./.test(line)){
      html.push(`<p>${line}</p>`);
      return;
    }
    if(!/[.!?:]$/.test(line)){
      html.push(`<h3>${line}</h3>`);
      return;
    }
    html.push(`<p>${line}</p>`);
  });
  return html.join("");
}
