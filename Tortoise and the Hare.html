<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Badly Illustrated: The Tortoise and the Hare</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; 
    padding: 0;
    width: 100%;
    height: 100%;
    background: #e9e1c8; 
    color: #211d19;
    font-family: "Courier New", monospace;
    overflow: hidden !important;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .frame {
    position: relative;
    width: 100%;
    height: 100%;
    max-width: 100%;
    max-height: 100%;
    aspect-ratio: 1 / 1;
    background: #e9e1c8;
    overflow: hidden;
  }
  canvas { 
    display: block; 
    width: 100%; 
    height: 100%; 
    object-fit: contain;
  }
</style>
</head>
<body>

  <div class="frame">
    <canvas id="scene" width="500" height="500"
      aria-label="A looping, hand-drawn cartoon of the tortoise and the hare race"></canvas>
  </div>

<script>
(() => {
  const canvas = document.getElementById("scene");
  const ctx = canvas.getContext("2d");

  const W = 500, H = 500;
  const duration = 18000;
  let start = performance.now();
  let raf = 0;

  function line(points, width=5, color="#211d19") {
    ctx.beginPath();
    ctx.moveTo(points[0][0], points[0][1]);
    for (let i=1; i<points.length; i++) {
      const [x,y] = points[i];
      const [px,py] = points[i-1];
      const mx=(px+x)/2, my=(py+y)/2;
      ctx.quadraticCurveTo(px,py,mx,my);
    }
    const last=points[points.length-1];
    ctx.lineTo(last[0],last[1]);
    ctx.lineWidth=width;
    ctx.strokeStyle=color;
    ctx.lineCap="round";
    ctx.lineJoin="round";
    ctx.stroke();
  }

  function scribbleText(text, x, y, size, angle=0) {
    ctx.save();
    ctx.translate(x,y);
    ctx.rotate(angle);
    ctx.font=`900 ${size}px "Courier New", monospace`;
    ctx.lineWidth=2;
    ctx.strokeStyle="#211d19";
    ctx.fillStyle="#211d19";
    ctx.strokeText(text,0,0);
    ctx.fillText(text,0,0);
    ctx.restore();
  }

  function wobbleEllipse(x,y,rx,ry,fill,seed=0) {
    ctx.save();
    ctx.translate(x,y);
    ctx.beginPath();
    for(let i=0;i<=24;i++) {
      const a=i/24*Math.PI*2;
      const wobble=1+0.035*Math.sin(i*2.7+seed)+0.018*Math.cos(i*4.1+seed);
      const px=Math.cos(a)*rx*wobble;
      const py=Math.sin(a)*ry*wobble;
      if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
    }
    ctx.closePath();
    ctx.fillStyle=fill;
    ctx.fill();
    ctx.lineWidth=5;
    ctx.strokeStyle="#211d19";
    ctx.lineJoin="round";
    ctx.stroke();
    ctx.restore();
  }

  function background(t) {
    ctx.fillStyle="#e9e1c8";
    ctx.fillRect(0,0,W,H);

    wobbleEllipse(395,86,31,29,"#f4df4c",2);
    line([[365,48],[355,38]],4);
    line([[425,50],[437,39]],4);
    line([[430,91],[445,94]],4);

    line([[48,104],[57,88],[76,91],[85,76],[104,87],[119,89],[124,103],[48,104]],5,"#fff9e9");
    line([[48,104],[57,88],[76,91],[85,76],[104,87],[119,89],[124,103],[48,104]],3);
    line([[205,73],[215,61],[231,64],[241,53],[256,66],[270,66],[275,78],[205,73]],4,"#fff9e9");
    line([[205,73],[215,61],[231,64],[241,53],[256,66],[270,66],[275,78],[205,73]],2);

    ctx.beginPath();
    ctx.moveTo(0,260);
    ctx.quadraticCurveTo(65,210,126,250);
    ctx.quadraticCurveTo(190,192,263,248);
    ctx.quadraticCurveTo(344,206,500,245);
    ctx.lineTo(500,500); ctx.lineTo(0,500); ctx.closePath();
    ctx.fillStyle="#a9bc70"; ctx.fill();
    line([[0,260],[65,210],[126,250],[190,192],[263,248],[344,206],[500,245]],5);

    ctx.beginPath();
    ctx.moveTo(0,330);
    ctx.quadraticCurveTo(210,306,500,337);
    ctx.lineTo(500,500); ctx.lineTo(0,500); ctx.closePath();
    ctx.fillStyle="#c98a55"; ctx.fill();
    line([[0,330],[115,320],[220,323],[350,325],[500,337]],5);
    line([[0,412],[100,407]],3,"#e8bd86");
    line([[210,445],[265,442]],3,"#e8bd86");
    line([[360,390],[424,398]],3,"#e8bd86");

    for(const [x,y,tilt] of [[32,352,-8],[87,449,7],[172,365,-5],[286,465,9],[337,352,-10],[457,445,6]]) {
      line([[x,y],[x-4+tilt,y-13],[x+tilt,y-5]],3,"#326a32");
    }

    line([[432,220],[429,341]],7);
    ctx.beginPath();
    ctx.moveTo(432,222); ctx.lineTo(477,230); ctx.lineTo(463,249); ctx.lineTo(432,244);
    ctx.closePath(); ctx.fillStyle="#f6e64b"; ctx.fill();
    line([[432,222],[477,230],[463,249],[432,244],[432,222]],4);
    scribbleText("FINISH",434,239,10,-.08);

    const g=ctx.createRadialGradient(250,245,125,250,245,350);
    g.addColorStop(0,"rgba(35,27,20,0)");
    g.addColorStop(.72,"rgba(35,27,20,0.025)");
    g.addColorStop(1,"rgba(35,27,20,0.32)");
    ctx.fillStyle=g;
    ctx.fillRect(0,0,W,H);

    line([[15,19],[88,15],[151,18]],2,"rgba(33,29,25,.35)");
    line([[486,35],[481,111]],2,"rgba(33,29,25,.35)");
    line([[24,475],[96,481]],2,"rgba(33,29,25,.35)");
  }

  function drawHare(x,y,mode,t) {
    ctx.save();
    ctx.translate(x,y);
    const running=mode==="run";
    const sleeping=mode==="sleep";
    const panic=mode==="panic";
    const bob=running ? Math.abs(Math.sin(t*0.035))*9 : Math.sin(t*.006)*2;
    ctx.translate(0,-bob);
    if(sleeping) ctx.rotate(1.15);
    if(panic) ctx.rotate(Math.sin(t*.05)*.18-.18);

    line([[-4,-51],[-15,-91],[-8,-104],[-1,-88],[3,-56]],7);
    line([[5,-52],[19,-83],[32,-87],[24,-72],[12,-52]],7,"#fffaf0");
    line([[-4,-51],[-15,-91],[-8,-104],[-1,-88],[3,-56]],4);
    line([[5,-52],[19,-83],[32,-87],[24,-72],[12,-52]],4);

    wobbleEllipse(0,-31,22,27,"#fffaf0",t*.001);
    wobbleEllipse(17,-57,22,19,"#fffaf0",t*.002+2);

    wobbleEllipse(24,-61,3.4,4,"#211d19",1);
    line([[28,-51],[34,-49],[30,-46]],3);
    ctx.fillStyle="#fff";
    ctx.fillRect(27,-49,5,7);
    line([[27,-49],[32,-49],[32,-42],[27,-42],[27,-49]],2);

    line([[-10,-34],[-25,-24],[-31,-28]],5);
    line([[11,-35],[26,-29],[30,-34]],5);

    const swing=running||panic ? Math.sin(t*.05)*17 : 0;
    line([[-8,-12],[-12+swing,-1],[ -18+swing,2]],7);
    line([[8,-12],[12-swing,-1],[18-swing,2]],7);

    if(sleeping) {
      scribbleText("Z",34,-81,22,-.15);
      scribbleText("z",54,-98,16,.12);
    }
    if(panic) {
      line([[22,-87],[26,-94]],3);
      line([[32,-83],[39,-88]],3);
      wobbleEllipse(39,-64,2,3,"#4aa8ef",3);
    }
    ctx.restore();
  }

  function drawTortoise(x,y,t,win=false) {
    ctx.save();
    ctx.translate(x,y);
    const step=Math.sin(t*.018)*4;
    const victorious=win ? Math.sin(t*.025)*.12 : 0;
    ctx.rotate(victorious);

    wobbleEllipse(-2,-21,31,24,"#218b43",t*.001+4);
    line([[-15,-39],[-12,-21],[-15,-5]],3);
    line([[1,-43],[3,-23],[0,-3]],3);
    line([[-27,-24],[-4,-25],[25,-21]],3);

    wobbleEllipse(27,-20,15,12,"#8ee35a",2);
    wobbleEllipse(32,-25,3,4,"#211d19",1);
    line([[34,-15],[40,-17],[37,-13]],3);

    const step1=Math.sin(t*.018)*5;
    line([[-20,-7],[-24+step1,1],[-29+step1,2]],6,"#8ee35a");
    line([[14,-6],[17-step1,2],[23-step1,2]],6,"#8ee35a");
    line([[-9,-5],[-9-step1,3],[-14-step1,4]],6,"#8ee35a");

    if(win) {
      line([[26,-45],[22,-55]],3);
      line([[36,-44],[42,-52]],3);
      scribbleText("?!",42,-40,15,.1);
    }
    ctx.restore();
  }

  function draw(t) {
    background(t);

    const phase=t/duration;
    let hx, tx, hareMode="run";
    if(phase<.14) {
      const p=phase/.14;
      hx=65+p*280; tx=35+p*45;
    } else if(phase<.31) {
      const p=(phase-.14)/.17;
      hx=345-p*8; tx=80+p*65; hareMode="sleep";
    } else if(phase<.57) {
      const p=(phase-.31)/.26;
      hx=337; tx=145+p*145; hareMode="sleep";
    } else if(phase<.82) {
      const p=(phase-.57)/.25;
      hx=337+p*95; tx=290+p*90; hareMode="panic";
    } else {
      hx=432; tx=380+Math.min(1,(phase-.82)/.18)*52;
      hareMode="panic";
    }

    drawTortoise(tx,385,t,phase>.91);
    drawHare(hx,382,hareMode,t);

    if(phase>.82 && phase<.91) {
      const sx=450, sy=302;
      line([[sx,sy-17],[sx+3,sy-5],[sx+15,sy-11],[sx+8,sy+1],
            [sx+19,sy+8],[sx+5,sy+9],[sx+2,sy+22],[sx-4,sy+9],
            [sx-17,sy+13],[sx-8,sy+2],[sx-17,sy-6],[sx-4,sy-5],
            [sx,sy-17]],4,"#f6e64b");
    }

    if(phase>.31 && phase<.57) {
      scribbleText("zzzz...",70,164,20,-.06);
    }
  }

  function frame(now) {
    const t = (now - start) % duration;
    draw(t);
    raf = requestAnimationFrame(frame);
  }

  function resizeCanvas() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const rect = canvas.getBoundingClientRect();
    canvas.width = Math.round(rect.width * dpr);
    canvas.height = Math.round(rect.height * dpr);
    ctx.setTransform(canvas.width / W, 0, 0, canvas.height / H, 0, 0);
    draw(((performance.now() - start) % duration));
  }
  
  window.addEventListener("resize", resizeCanvas);
  resizeCanvas();
  raf = requestAnimationFrame(frame);
})();
</script>
</body>
</html>
