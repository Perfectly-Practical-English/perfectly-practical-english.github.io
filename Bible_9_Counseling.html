<script>
(function() {
  'use strict';

  // 1. Inject Styles for Media Viewer Button
  if (!document.getElementById('pureMediaStyles')) {
    const style = document.createElement('style');
    style.id = 'pureMediaStyles';
    style.textContent = `
      .media-view-btn {
        height: 28px;
        padding: 0 10px;
        font-family: inherit;
        font-size: 13px;
        font-weight: 500;
        background: #f1f5f9;
        color: #2563eb;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        white-space: nowrap;
        margin-left: 8px;
      }
      .media-view-btn:hover {
        background: #e2e8f0;
      }
    `;
    document.head.appendChild(style);
  }

  // Listen to section load events to keep index synchronized globally
  window.addEventListener('textSectionLoaded', () => {
    if (window.SCRAMBLE_SECTIONS && window.currentQuizSectionName) {
      const idx = window.SCRAMBLE_SECTIONS.findIndex(s => s.name === window.currentQuizSectionName);
      if (idx >= 0) {
        window.selectedSectionIndex = idx;
        sessionStorage.setItem('mediaSectionIndex', idx);
      }
    }
  });

  // Track clicks on section tiles to update index instantly
  document.addEventListener('click', function(e) {
    const tile = e.target.closest('.section-item');
    if (tile) {
      const container = document.getElementById('sectionListContainer');
      if (container) {
        const items = Array.from(container.querySelectorAll('.section-item'));
        const idx = items.indexOf(tile);
        if (idx >= 0) {
          window.selectedSectionIndex = idx;
          sessionStorage.setItem('mediaSectionIndex', idx);
        }
      }
    }
  }, true);

  // 2. Open Media Logic using synchronized index lookup
  async function openMedia() {
    const modalRoot = document.getElementById('mediaModalRoot');
    const contentArea = document.getElementById('media-modal-body');
    if (!modalRoot || !contentArea) {
      alert("Media modal container elements not found.");
      return;
    }

    contentArea.innerHTML = '<p style="font-size: var(--size-small); color: #666;">Loading asset...</p>';
    modalRoot.classList.add('active');

    // Determine correct index using global template data and fallbacks
    let idx = 0;
    if (window.SCRAMBLE_SECTIONS && window.currentQuizSectionName) {
      const foundIdx = window.SCRAMBLE_SECTIONS.findIndex(s => s.name === window.currentQuizSectionName);
      if (foundIdx >= 0) idx = foundIdx;
    } else if (typeof window.selectedSectionIndex !== 'undefined' && window.selectedSectionIndex >= 0) {
      idx = Number(window.selectedSectionIndex);
    } else if (sessionStorage.getItem('mediaSectionIndex') !== null) {
      idx = Number(sessionStorage.getItem('mediaSectionIndex'));
    }

    const rawScript = document.getElementById('mediaRawText');
    if (!rawScript) {
      contentArea.innerHTML = '<p style="color: red;">Error: #mediaRawText block not found.</p>';
      return;
    }

    const lines = rawScript.textContent.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
    const filename = lines[idx] || lines[0];

    if (!filename) {
      contentArea.innerHTML = `<p style="color: #666;">No media file mapped for section index ${idx}.</p>`;
      return;
    }

    contentArea.innerHTML = '';
    const fileUrl = `./${filename}`;
    const ext = filename.split('.').pop().toLowerCase();

    if (['jpg', 'jpeg', 'png', 'gif', 'webp'].includes(ext)) {
      const img = document.createElement('img');
      img.src = fileUrl;
      contentArea.appendChild(img);
    } else if (['mp4', 'webm', 'ogg'].includes(ext)) {
      const video = document.createElement('video');
      video.src = fileUrl;
      video.controls = true;
      video.autoplay = true;
      contentArea.appendChild(video);
    } else if (ext === 'html') {
      const iframe = document.createElement('iframe');
      iframe.src = fileUrl;
      contentArea.appendChild(iframe);
    } else if (ext === 'txt') {
      try {
        const res = await fetch(fileUrl);
        const text = await res.text();
        const pre = document.createElement('pre');
        pre.textContent = text;
        pre.style.fontFamily = 'monospace';
        pre.style.whiteSpace = 'pre-wrap';
        contentArea.appendChild(pre);
      } catch (err) {
        contentArea.innerHTML = `<p style="color: red;">Could not load text file: ${filename}</p>`;
      }
    } else {
      contentArea.innerHTML = `<p>Unsupported file format: ${ext}</p>`;
    }
  }

  // 3. Button Injection into top-bar-row-1
  function initButton() {
    const row1 = document.querySelector('.top-bar-row-1');
    if (row1 && !row1.querySelector('.media-view-btn')) {
      const btn = document.createElement('button');
      btn.className = 'media-view-btn';
      btn.type = 'button';
      btn.textContent = 'Media';
      btn.addEventListener('click', openMedia);
      row1.appendChild(btn);
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initButton);
  } else {
    initButton();
  }

  setTimeout(initButton, 500);
  setTimeout(initButton, 1500);
})();
</script>

<script>
/* =========================================================
   STANDALONE MEDIA TOGGLE CONFIGURATION
   Set to `false` to block the media button and script entirely.
   ========================================================= */
window.ENABLE_MEDIA = false; 

(function() {
    'use strict';
    
    // If disabled, intercept and disable the media function execution
    if (window.ENABLE_MEDIA === false) {
        // Prevent any external call to openMedia from doing anything
        window.openMedia = function() { console.log("Media is disabled."); };
        
        // Ensure CSS hides or doesn't inject the button
        const blockStyle = document.createElement('style');
        blockStyle.textContent = '.media-view-btn { display: none !important; }';
        document.head.appendChild(blockStyle);
        
        return; // Exit early so the button injection code never runs
    }
})();
</script>

<script>
(function() {
    'use strict';

    window.addEventListener('DOMContentLoaded', () => {
        // Brief timeout to ensure SCRAMBLE_SECTIONS is fully parsed and populated
        setTimeout(() => {
            if (window.SCRAMBLE_SECTIONS && window.SCRAMBLE_SECTIONS.length === 1) {
                const section = window.SCRAMBLE_SECTIONS[0];
                if (!section) return;

                // Set global state variables
                window.selectedSectionIndex = 0;
                window.currentQuizSectionText = section.text || '';
                window.currentQuizSectionName = section.name || '';

                // Load the single section into the viewer and lock/parse its quiz
                if (typeof window.loadSectionWithLockedQuiz === 'function') {
                    window.loadSectionWithLockedQuiz(section.text);
                } else if (typeof window.loadSectionByIndex === 'function') {
                    window.loadSectionByIndex(0);
                }

                // Insert section title at the top of the editable text zone
                const editableZone = document.getElementById('editableTextZone') || document.getElementById('teleEdit');
                if (editableZone && !editableZone.querySelector('.section-title')) {
                    const titleDiv = document.createElement('div');
                    titleDiv.className = 'section-title';
                    titleDiv.textContent = section.name;
                    editableZone.insertBefore(titleDiv, editableZone.firstChild);
                }

                // Refresh character counts, sentence counts, and overlays
                if (typeof window.updateTextOverlay === 'function') {
                    window.updateTextOverlay();
                } else if (typeof window.updateOverlay === 'function') {
                    window.updateOverlay();
                }

                // Update the section selector button text to reflect the single section name
                const sectionBtn = document.getElementById('sectionSelectorBtn');
                if (sectionBtn) {
                    sectionBtn.textContent = section.name;
                }

                console.log('Single section auto-loaded successfully:', section.name);
            }
        }, 100);
    });
})();
</script>
