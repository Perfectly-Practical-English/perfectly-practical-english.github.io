<!DOCTYPE html>

<style>
:root {
  --bg: #f7fdfb;
  --blue: #1976d2;
  --blue-hover: #1565c0;
  --input-border-blue: #cfe2f7;
  --section-item-default: #eaf6ff;
  --section-item-hover: #d0e8ff;
  --font-main: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}

* {
  box-sizing: border-box;
}

html,
body {
  width: 100%;
  min-height: 100%;
  margin: 0;
}

html {
  overflow-x: hidden;
  overflow-y: scroll;
  scrollbar-width: none;
  -ms-overflow-style: none;
}

body {
  font-family: var(--font-main);
  padding: 0 15px;
  background: var(--bg);
  color: #222;
  line-height: 1.5;
  overflow-x: hidden;
  overflow-y: auto;
  scrollbar-width: none;
  -ms-overflow-style: none;
}

*::-webkit-scrollbar {
  display: none !important;
  width: 0 !important;
  height: 0 !important;
}

h1 {
  color: var(--blue);
  font-family: var(--font-main);
  font-size: 28px;
  font-weight: 700;
  margin-bottom: 0.3em;
  margin-left: 0.3em;
}

p {
  color: #333;
  margin-left: 0.6em;
}

a {
  color: var(--blue);
  text-decoration: none;
}

a:hover,
a:focus {
  text-decoration: underline;
}

.section {
  margin-bottom: 1.2em;
}

/* Section heading buttons */
.collapsible {
  width: 100%;
  min-width: 0;
  display: block;
  font-family: var(--font-main);
  font-size: 1.1em;
  font-weight: 600;
  text-align: left;
  cursor: pointer;
  user-select: none;
  padding: 9px 12px;
  margin-bottom: 0;
  color: var(--blue);
  background: linear-gradient(145deg, #ffffff, var(--section-item-default));
  border: 1px solid var(--input-border-blue);
  border-radius: 6px;
  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
  transition: background 0.12s, border-color 0.12s;
}

.collapsible:hover {
  background: linear-gradient(145deg, #ffffff, var(--section-item-hover));
  border-color: var(--blue);
}

.collapsible:focus-visible,
.content a:focus-visible {
  outline: 3px solid var(--blue);
  outline-offset: 2px;
}

.collapsible::before {
  content: "+ ";
}

.collapsible.active::before {
  content: "− ";
}

/* Collapsible file-button grid */
.content {
  display: none;
  margin-top: 0;
  padding: 7px 0 0 10px;
  grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
  gap: 6px;
  min-width: 0;
}

.content.open {
  display: grid;
}

/* File buttons */
.content a {
  display: flex;
  align-items: center;
  justify-content: center;
  min-width: 0;
  width: 100%;
  min-height: 30px;
  padding: 5px 6px;
  border: 1px solid var(--input-border-blue);
  border-radius: 6px;
  background: linear-gradient(145deg, #ffffff, var(--section-item-default));
  color: var(--blue);
  font-family: var(--font-main);
  font-size: 11px;
  font-weight: 400;
  line-height: 1.3;
  text-align: center;
  text-decoration: none;
  overflow-wrap: anywhere;
  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
  transition: background 0.12s, border-color 0.12s, color 0.12s;
}

.content a:hover,
.content a:focus {
  background: linear-gradient(145deg, #ffffff, var(--section-item-hover));
  border-color: var(--blue);
  color: var(--blue-hover);
  text-decoration: none;
}

/* QR code */
#qrBox {
  width: 220px;
  max-width: 75%;
  margin: 2em auto 4em auto;
  text-align: center;
}

#qrBox img {
  width: 100%;
  display: block;
  margin-bottom: 0.5em;
  filter:
    drop-shadow(0 0 6px rgba(0,0,0,0.9))
    drop-shadow(0 0 14px rgba(0,0,0,0.7))
    drop-shadow(0 0 28px rgba(0,0,0,0.5));
}

.hotspot-info {
  font-size: 10px;
  color: #555;
  margin-left: 0.6em;
}

/* Footer */
footer {
  position: fixed;
  bottom: 10px;
  left: 0;
  width: 100%;
  background: var(--bg);
  border-top: 1px solid var(--input-border-blue);
  text-align: left;
  z-index: 5;
  padding: 5px 0;
}

footer p {
  margin: 0 0 0 20px;
  font-size: 10px;
  color: #666 !important;
  font-style: normal;
}

/* Bottom-right corner image */
#david-corner {
  position: fixed;
  right: 15px;
  bottom: 0;
  width: 20vw;
  max-width: 320px;
  min-width: 140px;
  height: auto;
  pointer-events: none;
  user-select: none;
  z-index: 4;
}

#david-corner img {
  display: block;
  width: 100%;
  height: auto;
}

/* Green border retained */
#greenBorder {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  border: 10px solid #39FF14;
  box-sizing: border-box;
  z-index: 2147483647;
  pointer-events: none;
}

/* Standard mobile portrait screens */
@media (max-width: 600px) {
  body {
    font-size: 16px;
    padding: 0 9px;
    line-height: 1.45;
  }

  h1 {
    font-size: 24px;
    line-height: 1.2;
    margin: 12px 4px 10px;
  }

  body > p {
    margin: 0 4px 16px;
    font-size: 14px;
    overflow-wrap: anywhere;
  }

  .section {
    margin-bottom: 10px;
  }

  .collapsible {
    min-height: 44px;
    padding: 9px 10px;
    font-size: 16px;
    line-height: 1.3;
    border-radius: 6px;
    touch-action: manipulation;
  }

  /* Two columns on ordinary phones */
  .content {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 6px;
    padding: 7px 0 2px;
  }

  .content a {
    min-height: 42px;
    padding: 7px 5px;
    font-size: 13px;
    line-height: 1.3;
    white-space: normal;
    overflow: visible;
    overflow-wrap: anywhere;
    word-break: normal;
    text-overflow: clip;
    border-radius: 6px;
    -webkit-tap-highlight-color: rgba(25, 118, 210, 0.2);
  }

  #qrBox {
    width: 190px;
    max-width: 80%;
    margin: 28px auto 20px;
  }

  .hotspot-info {
    font-size: 11px;
    line-height: 1.6;
    overflow-wrap: anywhere;
  }

  /* Footer returns to normal page flow */
  footer {
    position: static;
    width: 100%;
    margin-top: 20px;
    padding: 10px 5px;
  }

  footer p {
    margin: 0;
    font-size: 11px;
    line-height: 1.5;
    overflow-wrap: anywhere;
  }

  /* Corner image no longer floats over the buttons */
  #david-corner {
    position: static;
    width: 100px;
    min-width: 0;
    max-width: 30%;
    margin: 10px 5px 12px auto;
  }

  #greenBorder {
    border-width: 5px;
  }
}

/* Very narrow phones */
@media (max-width: 350px) {
  body {
    padding-left: 7px;
    padding-right: 7px;
  }

  h1 {
    font-size: 21px;
  }

  .content {
    gap: 5px;
  }

  .content a {
    font-size: 12px;
    padding: 6px 3px;
  }

  .collapsible {
    font-size: 15px;
  }
}

const SECTIONS = [
  { title: "Vocabulary Flash Cards and Games", prefixes: ["V_"] },
  { title: "Grammar Lessons", prefixes: ["RG_"] },

  { title: "Useful Tips", prefixes: ["RT_"] },
  { title: "Thai Language", prefixes: ["T_", "TT_"] },
  { title: "Bible Study", prefixes: ["Bible_"] },
  { title: "Resources and Administration", prefixes: ["RA_", "A_", "ART_"] },
  { title: "Rogue Writers Gallery", prefixes: ["RR_"] }
];

function getFileNumber(filename) {
  const match = filename.match(/^[A-Za-z]+_(\d+)/);
  return match ? Number(match[1]) : Number.MAX_SAFE_INTEGER;
}

function sortFiles(files) {
  return [...files].sort((a, b) => {
    const numberDifference = getFileNumber(a) - getFileNumber(b);
    if (numberDifference !== 0) return numberDifference;
    return a.localeCompare(b, undefined, { numeric: true, sensitivity: "base" });
  });
}

function getDisplayName(filename) {
  const match = filename.match(/^[A-Za-z]+_(\d+)/);
  const number = match ? Number(match[1]) : "";
  const name = filename
    .replace(/\.html?$/i, "")
    .replace(/^[A-Za-z]+_\d+[_-]?/, "")
    .replace(/_/g, " ")
    .trim();
  return number ? `${number}. ${name}` : name;
}

function getSectionForFile(filename) {
  return SECTIONS.find(section =>
    section.prefixes.some(prefix => filename.startsWith(prefix))
  );
}

function renderIndex() {
  const root = document.getElementById("indexSections");
  root.replaceChildren();

  SECTIONS.forEach(section => {
    const files = sortFiles(
      INTERNAL_FILES.filter(filename => getSectionForFile(filename) === section)
    );

    if (files.length === 0) return;

    const sectionDiv = document.createElement("div");
    sectionDiv.className = "section";

    const heading = document.createElement("button");
    heading.type = "button";
    heading.className = "collapsible";
    heading.textContent = section.title;
    heading.setAttribute("aria-expanded", "false");

    const content = document.createElement("div");
    content.className = "content";

    files.forEach(filename => {
      const link = document.createElement("a");
      link.href = filename;
      link.textContent = getDisplayName(filename);
      link.title = filename;
      link.target = "_self";
      content.appendChild(link);
    });

    heading.addEventListener("click", () => {
      const isOpen = heading.classList.toggle("active");
      content.classList.toggle("open", isOpen);
      heading.setAttribute("aria-expanded", String(isOpen));
    });

    sectionDiv.appendChild(heading);
    sectionDiv.appendChild(content);
    root.appendChild(sectionDiv);
  });
}

renderIndex();
