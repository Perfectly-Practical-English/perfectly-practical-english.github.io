<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>My Personal Profile Writing Lesson</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        background: #111;
        font-family: Arial, Helvetica, sans-serif;
        height: 100vh;
        height: 100dvh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
    }

    #slide-container {
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }

    img {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
        border-radius: 0;
        transition: opacity 0.4s ease;
    }

    #controls {
        position: fixed;
        bottom: max(15px, env(safe-area-inset-bottom));
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 10px;
        background: rgba(0, 0, 0, 0.6);
        padding: 8px 15px;
        border-radius: 30px;
        backdrop-filter: blur(5px);
        z-index: 1000;
    }

    button {
        font-size: 16px;
        padding: 8px 14px;
        border: none;
        border-radius: 20px;
        cursor: pointer;
        background: rgba(255, 255, 255, 0.9);
        color: #333;
        white-space: nowrap;
    }

    button:hover {
        background: #fff;
    }

    #counter {
        color: white;
        font-size: 16px;
        min-width: 60px;
        text-align: center;
    }

    #title {
        position: fixed;
        top: max(15px, env(safe-area-inset-top));
        left: 50%;
        transform: translateX(-50%);
        color: white;
        font-size: 20px;
        font-weight: bold;
        z-index: 1000;
        background: rgba(0, 0, 0, 0.5);
        padding: 5px 15px;
        border-radius: 15px;
        backdrop-filter: blur(5px);
        pointer-events: none;
    }

    .fade {
        opacity: 0;
    }

    /* Mobile landscape adjustments */
    @media (max-height: 500px) {
        #controls {
            padding: 5px 10px;
            gap: 6px;
        }
        button {
            font-size: 14px;
            padding: 6px 10px;
        }
        #counter {
            font-size: 14px;
            min-width: 50px;
        }
    }
</style>
</head>

<body>

<div id="title">My Personal Profile Writing Lesson</div>

<div id="slide-container">
    <img id="slide" alt="Lesson Slide">
</div>

<div id="controls">
    <button onclick="previousSlide()">◀ Prev</button>

    <div id="counter">
        1 / 4
    </div>

    <button onclick="nextSlide()">Next ▶</button>

    <button onclick="toggleFullScreen()">⛶ Full</button>
</div>


<script>

const images = `
ChatGPT Image Aug 8, 2026, 09_53_48 PM.jpg
Gemini_Generated_Image_mf5g36mf5g36mf5g.jfif
ChatGPT Image Aug 8, 2026, 09_53_48 PM.png
a394bf4d-dfee-4771-aa9e-1a8d01127de1-0.jpg
Gemini_Generated_Image_mf5g36mf5g36mf5g.jfif
Gemini_Generated_Image_2o91q52o91q52o91.jfif
`
.trim()
.split("\n")
.map(name => name.trim());

let current = 0;

const slide = document.getElementById("slide");
const counter = document.getElementById("counter");


function showSlide(index) {

    slide.classList.add("fade");

    setTimeout(() => {

        current = index;

        slide.src = images[current];

        counter.textContent =
            (current + 1) + " / " + images.length;

        slide.classList.remove("fade");

    }, 200);
}


function nextSlide() {

    let next = current + 1;

    if (next >= images.length) {
        next = 0;
    }

    showSlide(next);
}


function previousSlide() {

    let prev = current - 1;

    if (prev < 0) {
        prev = images.length - 1;
    }

    showSlide(prev);
}


// Keyboard controls
document.addEventListener("keydown", function(event){

    if(event.key === "ArrowRight" || event.key === " ") {
        nextSlide();
    }

    if(event.key === "ArrowLeft") {
        previousSlide();
    }

});


// Full screen classroom mode
function toggleFullScreen(){

    if (!document.fullscreenElement){

        document.documentElement.requestFullscreen();

    } else {

        document.exitFullscreen();

    }

}

showSlide(0);

</script>

<script>
// ===== Auto Advance Add-on =====

const AUTO_INTERVAL = 8000; // 8 seconds
let autoTimer = null;
let autoRunning = false;

// Create the button automatically
const autoBtn = document.createElement("button");
autoBtn.textContent = "▶ Auto";
autoBtn.onclick = toggleAutoAdvance;

// Insert before the Full Screen button
const controls = document.getElementById("controls");
controls.insertBefore(autoBtn, controls.lastElementChild);

function toggleAutoAdvance() {

    if (autoRunning) {

        clearInterval(autoTimer);
        autoTimer = null;
        autoRunning = false;
        autoBtn.textContent = "▶ Auto";

    } else {

        autoRunning = true;
        autoBtn.textContent = "⏸ Stop";

        autoTimer = setInterval(() => {
            nextSlide();
        }, AUTO_INTERVAL);

    }
}
</script>

</body>
</html>
