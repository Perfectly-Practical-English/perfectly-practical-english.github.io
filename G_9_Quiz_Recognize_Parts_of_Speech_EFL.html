async function resolveRaw(source) {
  if (typeof source === "string" && !source.includes("\n")) {
    try {

  }
  return source;
}

(async function initQuiz() {
  const rawExercises = await resolveRaw(rawExercisesSource);

  function parseRawExerciseSections(raw) {
    const sections = [];
    let current = null;
    raw.split(/\r?\n/).forEach(line => {
      const text = line.trim();
      if (!text) return;
      if (text[0] === "~") {
        current = { name: text.slice(1).trim(), exercises: [] };
        sections.push(current);
        return;
      }
      if (current) current.exercises.push(text);
    });
    return sections;
  }

  window.RAW_SECTIONS = parseRawExerciseSections(rawExercises);

  const btn = document.getElementById("sectionSelectorBtn");
  const modalRoot = document.getElementById("sectionModalRoot");
  const modalBackdrop = document.getElementById("sectionModalBackdrop");
  const modalClose = document.getElementById("sectionModalClose");
  const listContainer = document.getElementById("sectionListContainer");

  function openModal() {
    listContainer.innerHTML = "";
    if (window.RAW_SECTIONS.length === 0) {
      listContainer.innerHTML = "<div style='padding:10px; text-align:center; color:#666;'>No categories found.</div>";
    } else {
      window.RAW_SECTIONS.forEach((sec, idx) => {
        const item = document.createElement("div");
        item.className = "section-item";
        item.textContent = sec.name;
        item.addEventListener("click", () => {
          window.SCRAMBLE_INDEX = idx;
          btn.textContent = sec.name;
          closeModal();
          window.startPOSSection();
        });
        listContainer.appendChild(item);
      });
    }
    modalRoot.style.display = "block";
  }

  function closeModal() {
    modalRoot.style.display = "none";
  }

  if (btn) btn.addEventListener("click", openModal);
  if (modalClose) modalClose.addEventListener("click", closeModal);
  if (modalBackdrop) modalBackdrop.addEventListener("click", closeModal);

  window.addEventListener("DOMContentLoaded", () => {
    btn.textContent = "Topics";
  });

  function parseExercise(exerciseText, index) {
    let prompt = `${index}.`;
    let sentence = exerciseText;

    if (exerciseText.includes(' - ')) {
      const parts = exerciseText.split(' - ');
      prompt = `${index}. ${parts[0]}`;
      sentence = parts.slice(1).join(' - ');
    }

    if (!sentence) sentence = exerciseText;

    const tokens = sentence.match(/\|\s*[^|]+\s*\||\s+|[A-Za-z0-9']+|[.,!?;]/g) || [];

    const parsedSentence = tokens.map(token => {
      if (token.startsWith('|') && token.endsWith('|')) {
        const clean = token.slice(1, -1);
        return `<span class="word" data-correct="true">${clean}</span>`;
      }
      return token.trim() ? `<span>${token}</span>` : token;
    }).join('');

    return `${prompt} ${parsedSentence}`;
  }

  function renderExercises() {
    const exercisesContainer = document.getElementById('exercises');
    if (!window.quizExercises || window.quizExercises.length === 0) {
      exercisesContainer.innerHTML = "";
      return;
    }

    exercisesContainer.innerHTML = "";
    const section = window.RAW_SECTIONS[window.SCRAMBLE_INDEX];
    if (!section) return;

    const header = document.createElement('div');
    header.className = 'section-header';
    header.textContent = section.name;
    header.style.fontWeight = 'bold';
    header.style.marginBottom = '8px';
    header.style.color = '#1976d2';
    exercisesContainer.appendChild(header);

    window.quizExercises.forEach((exercise, index) => {
      const parsedExercise = parseExercise(exercise, index + 1);
      const exerciseContainer = document.createElement('div');
      exerciseContainer.classList.add('exercise-container');

      const sentence = document.createElement('div');
      sentence.classList.add('sentence');
      sentence.innerHTML = parsedExercise;

      exerciseContainer.appendChild(sentence);
      exercisesContainer.appendChild(exerciseContainer);
    });

    document.querySelectorAll('.word').forEach(word => {
      word.addEventListener('click', handleWordClick);
    });
  }

  window.startPOSSection = function () {
    const section = window.RAW_SECTIONS?.[window.SCRAMBLE_INDEX];
    if (!section) return;

    window.quizExercises = section.exercises;
    window.currentExerciseIndex = 0;
    window.score = 0;

    renderExercises();

    window.correctAnswers = 0;
    window.scoreSubmitted = false;
    window.pipedWordsCount = document.querySelectorAll('#exercises .word[data-correct="true"]').length;
  };

  function handleWordClick(event) {
    const word = event.target;
    if (window.scoreSubmitted) return;
    if (!word.classList.contains('word')) return;
    word.classList.toggle('selected-word');
  }

  function getScoreboardFilename(extension) {
    const resultEl = document.getElementById('result');
    if (resultEl && resultEl.textContent.trim()) {
      let firstLine = resultEl.textContent.split('\n')[0];
      let baseName = firstLine
        .replace(/\|/g, '_')
        .replace(/\s+/g, '_')
        .replace(/[:\/]/g, '-');
      return baseName + '.' + extension;
    }
    return 'scoreboard.' + extension;
  }

  // Submission & Student Matching
  const idInput = document.getElementById('id');
  const submitBtn = document.getElementById('grammarsubmit');

  submitBtn.addEventListener('click', function () {
    if (window.SCRAMBLE_INDEX === undefined || window.RAW_SECTIONS[window.SCRAMBLE_INDEX] == null) {
      alert('Please select a section first.');
      return;
    }

    const id = idInput.value.trim();
    const studentName = window.resolveStudentNameFromId(id);
    const resolvedId = id || 'Guest';

    const totalPiped = document.querySelectorAll('#exercises .word[data-correct="true"]').length;
    const selectedCorrect = document.querySelectorAll('#exercises .word[data-correct="true"].selected-word').length;

    window.correctAnswers = selectedCorrect;
    window.pipedWordsCount = totalPiped;
    window.scoreSubmitted = true;

    const pct = totalPiped > 0 ? Math.round((selectedCorrect / totalPiped) * 100) : 0;
    const pctStr = pct + '%';

    const now = new Date();
    const pad = n => n.toString().padStart(2,'0');
    const dateStr = `${pad(now.getDate())}/${pad(now.getMonth()+1)}/${now.getFullYear()}`;
    const timeStr = `${pad(now.getHours())}:${pad(now.getMinutes())}`;

    const rawFilename = window.location.pathname.split('/').pop() || "G_Recognize_Parts_of_Speech_EFL.html";
    const filenameWithoutExt = rawFilename.replace(/\.[^/.]+$/, "");
    const sectionName = window.RAW_SECTIONS[window.SCRAMBLE_INDEX]?.name || 'Parts of Speech';

    const resultText = `${filenameWithoutExt}|${sectionName}|${studentName}|${resolvedId}|${dateStr}|${timeStr}|${selectedCorrect}/${totalPiped}|${pctStr}`;

    document.getElementById('result').textContent = resultText;
    document.getElementById('scoreboardContainer').style.display = 'block';
    document.getElementById('scoreboardBtns').style.display = 'flex';

    if (window.saveResult) {
      window.saveResult(resultText);
    }
  });

  document.getElementById('grammarCopyBtn').addEventListener('click', () => {
    navigator.clipboard.writeText(document.getElementById('result').textContent).then(() => alert('Score copied to clipboard!'));
  });

  document.getElementById('grammarDownloadTxtBtn').addEventListener('click', () => {
    const downloadFileName = getScoreboardFilename('txt');
    const textContent = document.getElementById('result').textContent;
    const blob = new Blob([textContent], { type: 'text/plain' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = downloadFileName;
    link.click();
    URL.revokeObjectURL(link.href);
  });

  document.getElementById('grammarDownloadPngBtn').addEventListener('click', () => {
    const downloadFileName = getScoreboardFilename('png');
    const resultEl = document.getElementById('result');

    const wrapper = document.createElement('div');
    wrapper.style.background = '#ffffff';
    wrapper.style.padding = '10px';
    wrapper.style.display = 'inline-block';
    wrapper.style.fontFamily = getComputedStyle(resultEl).fontFamily;
    wrapper.style.fontSize = getComputedStyle(resultEl).fontSize;
    wrapper.style.color = getComputedStyle(resultEl).color;

    const clone = resultEl.cloneNode(true);
    wrapper.appendChild(clone);
    document.body.appendChild(wrapper);

    html2canvas(wrapper, { backgroundColor: '#ffffff' }).then(canvas => {
      const link = document.createElement('a');
      link.href = canvas.toDataURL('image/png');
      link.download = downloadFileName;
      link.click();
      document.body.removeChild(wrapper);
    });
  });
})();
</script>

    if(/^\d+\./.test(line)){ html.push(`<p>${line}</p>`); return; }

    const resultText = `${filenameWithoutExt}|${sectionName}|${studentName}|${resolvedId}|${dateStr}|${timeStr}|${selectedCorrect}/${totalPiped}|${pctStr}`;

    document.getElementById('result').textContent = resultText;
    document.getElementById('scoreboardContainer').style.display = 'block';
    document.getElementById('scoreboardBtns').style.display = 'flex';

    if (window.saveResult) {
      window.saveResult(resultText);
    }
  });

  document.getElementById('grammarCopyBtn').addEventListener('click', () => {
    navigator.clipboard.writeText(document.getElementById('result').textContent).then(() => alert('Score copied to clipboard!'));
  });

  document.getElementById('grammarDownloadTxtBtn').addEventListener('click', () => {
    const downloadFileName = getScoreboardFilename('txt');
    const textContent = document.getElementById('result').textContent;
    const blob = new Blob([textContent], { type: 'text/plain' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = downloadFileName;
    link.click();
    URL.revokeObjectURL(link.href);
  });

  document.getElementById('grammarDownloadPngBtn').addEventListener('click', () => {
    const downloadFileName = getScoreboardFilename('png');
    const resultEl = document.getElementById('result');

    const wrapper = document.createElement('div');
    wrapper.style.background = '#ffffff';
    wrapper.style.padding = '10px';
    wrapper.style.display = 'inline-block';
    wrapper.style.fontFamily = getComputedStyle(resultEl).fontFamily;
    wrapper.style.fontSize = getComputedStyle(resultEl).fontSize;
    wrapper.style.color = getComputedStyle(resultEl).color;

    const clone = resultEl.cloneNode(true);
    wrapper.appendChild(clone);
    document.body.appendChild(wrapper);

    html2canvas(wrapper, { backgroundColor: '#ffffff' }).then(canvas => {
      const link = document.createElement('a');
      link.href = canvas.toDataURL('image/png');
      link.download = downloadFileName;
      link.click();
      document.body.removeChild(wrapper);
    });
  });
})();
</script>

<script>
(function(){
const RAW_TEXT = `
How to use this file...
• Enter your ID number into the ID field — Auto: Your name will automatically populate if registered, and entering your ID unlocks score tracking.
• Click the Select a section button to choose a grammar category from the pop-up menu.
• Click the Instructions button anytime to view the gameplay guide.
• Click on the target words within the sentences that belong to the specified part of speech to select or deselect them.
• Click Submit to view your final score and percentage — Auto: Your results are compiled into a scoreboard record and logged automatically to the database.
• Use the Copy, TXT, or PNG buttons to download or copy your score record.`;

function parseRawInstructions(text){
  const lines = text.split("\n").map(l => l.trim()).filter(Boolean);
  const html = [];
  lines.forEach(line => {
    if(line === "---"){ html.push(`<hr>`); return; }
    if(/^\d+\./.test(line)){ html.push(`<p>${line}</p>`); return; }
    if(!/[.!?:]$/.test(line)){ html.push(`<h3>${line}</h3>`); return; }
    html.push(`<p>${line}</p>`);
  });
  return html.join("");
}

const instructionsContent = document.getElementById("instructionsContent");
if(instructionsContent) {
  instructionsContent.innerHTML = parseRawInstructions(RAW_TEXT);
  instructionsContent.addEventListener("wheel", e=>{ e.stopPropagation(); },{passive:false});
  instructionsContent.addEventListener("touchmove", e=>{ e.stopPropagation(); },{passive:false});
}

const root = document.getElementById("instructionsRoot");
const btn = document.getElementById("instructionsBtn");

function openModal(){
  if(root) root.style.display="block";
  document.body.style.overflow="hidden";
  document.documentElement.style.overflow="hidden";
}

function closeModal(){
  if(root) root.style.display="none";
  document.body.style.overflow="";
  document.documentElement.style.overflow="";
}

if(btn) btn.onclick = openModal;
const backBtn = document.getElementById("instructionsBack");
if(backBtn) backBtn.onclick = closeModal;
const backdrop = document.getElementById("instructionsBackdrop");
if(backdrop) backdrop.onclick = closeModal;
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeModal(); });
})();
</script>
