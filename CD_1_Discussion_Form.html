/* SECTION DATA & DROPDOWN MODAL LOGIC */
const sectionData = [
  { name: "General Discussion" },
  { name: "Questions & Help" },
  { name: "Project Ideas" },
  { name: "Feedback" }
];

let currentSectionName = 'General Discussion';

const btn = document.getElementById("sectionSelectorBtn");

function openModal() {

function closeModal() {

/* STUDENT NAME MATCHING SCRIPT HOOKED TO REGISTRY */
function getStudentName(id) {
  return window.resolveStudentNameFromId ? window.resolveStudentNameFromId(id) : ("Student_" + (id ? id.trim() : ""));
}

/* ELEMENTS */
const thread = document.getElementById("thread");
const idInput = document.getElementById("idInput");
const msgInput = document.getElementById("messageInput");

const speechToggleBtn = document.getElementById("speechToggleBtn");
const copyBtn = document.getElementById("copyBtn");
const downloadBtn = document.getElementById("downloadBtn");
const postBtn = document.getElementById("postBtn");

/* DATA STRING GENERATOR */
function generateDataString() {
  let filename = window.location.pathname.split('/').pop() || 'CDF_Discussion_Form';
  filename = filename.replace(/\.[^/.]+$/, "");
  
  const studentId = idInput.value.trim() || '-';
  const studentName = getStudentName(studentId);
  
  const message = msgInput.value.trim();
  const words = message ? message.split(/\s+/) : [];
  const first3Words = words.slice(0, 3).join(' ') || '(no text)';
  
  const now = new Date();
  const datePart = now.toISOString().slice(0, 10);
  const hours = String(now.getHours()).padStart(2, '0');
  const minutes = String(now.getMinutes()).padStart(2, '0');
  const militaryTime = `${hours}${minutes}`;
  
  const headerLine = `${filename}|${studentName}|${studentId}|${first3Words}|${datePart} ${militaryTime}`;
  const fullText = msgInput.value;

  return `${headerLine}\n${fullText}`;
}

/* COPY BUTTON LOGIC */
copyBtn.onclick = () => {
  const dataStr = generateDataString();
  navigator.clipboard.writeText(dataStr).then(() => {}).catch(err => {});
};

/* DOWNLOAD TXT FILE BUTTON LOGIC */
downloadBtn.onclick = () => {
  let filename = window.location.pathname.split('/').pop() || 'CDF_Discussion_Form';
  filename = filename.replace(/\.[^/.]+$/, "");

  const studentId = idInput.value.trim() || '-';
  const studentName = getStudentName(studentId);
  
  const message = msgInput.value.trim();
  const words = message ? message.split(/\s+/) : [];
  const first3Words = words.slice(0, 3).join(' ') || 'no_text';
  
  const now = new Date();
  const datePart = now.toISOString().slice(0, 10);
  const hours = String(now.getHours()).padStart(2, '0');
  const minutes = String(now.getMinutes()).padStart(2, '0');
  const militaryTime = `${hours}${minutes}`;
  
  const dataStr = generateDataString();
  const rawHeaderForFilename = `${filename}|${studentName}|${studentId}|${first3Words}|${datePart} ${militaryTime}`;
  const customDownloadName = rawHeaderForFilename.replace(/[| ]+/g, '_') + '.txt';

  const blob = new Blob([dataStr], { type: "text/plain;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = customDownloadName;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
};

/* OPEN-SOURCE LOCAL TRANSCRIPT FORMATTER (NO KEYS, NO APIS) */
function formatTranscriptLocally(rawText) {
  if (!rawText.trim()) return rawText;
  
  let text = rawText.trim().replace(/\s+/g, ' ');
  
  // Capitalize standalone "i" to "I"
  text = text.replace(/\b(i)\b/g, 'I');
  
  // Capitalize first letter of the string
  text = text.charAt(0).toUpperCase() + text.slice(1);
  
  // Capitalize letter following a sentence-ending punctuation mark if present
  text = text.replace(/([.?!]\s+)([a-z])/g, (match, p1, p2) => p1 + p2.toUpperCase());
  
  // If there's no ending punctuation, add a period cleanly
  if (!/[.?!]$/.test(text)) {
    text += '.';
  }
  
  return text;
}

/* SPEECH RECOGNITION TOGGLE */
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
const recognition = new SpeechRecognition();

recognition.continuous = true;
recognition.interimResults = true;
recognition.lang = "en-US";

let isRecording = false;

recognition.onresult = (event) => {
  let transcript = "";
  for (let i = 0; i < event.results.length; i++) {
    transcript += event.results[i][0].transcript;
  }
  msgInput.value = transcript;
};

recognition.onerror = (e) => {
  isRecording = false;
  speechToggleBtn.textContent = "Start Speech";
};

recognition.onend = () => {
  isRecording = false;
  speechToggleBtn.textContent = "Start Speech";
  
  if (msgInput.value.trim()) {
    msgInput.value = formatTranscriptLocally(msgInput.value);
  }
};

speechToggleBtn.onclick = () => {
  if (!isRecording) {
    try {
      recognition.start();
      isRecording = true;
      speechToggleBtn.textContent = "Stop Speech";
    } catch (e) {
      console.error(e);
    }
  } else {
    recognition.stop();
  }
};

/* THREAD RENDER */
function renderPost(p) {
  const div = document.createElement("div");
  div.className = "post";
  const sectionLabel = p.section ? `[${p.section}] ` : "";
  div.innerHTML = `
    <div class="postHeader">
      <span class="postName">${sectionLabel}${p.name} (${p.student_id})</span>
      <span>${p.time}</span>
    </div>
    <div class="postBody">${p.message}</div>
  `;
  thread.appendChild(div);
  thread.scrollTop = thread.scrollHeight;
}

/* TIME */
function timeStamp() {
  return new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
}

/* POST → SUPABASE */
postBtn.onclick = async () => {
  const studentId = idInput.value.trim();
  const studentName = getStudentName(studentId);
  const payload = {
    name: studentName,
    student_id: studentId || "-",
    section: currentSectionName,
    time: timeStamp(),
    message: msgInput.value || ""
  };

  if (!payload.message.trim()) return;

  const { error } = await supabaseClient
    .from("instant_input")
    .insert({
      entry: payload
    });

  if (!error) {
    msgInput.value = "";
  }
};

/* LOAD THREAD & REALTIME */
async function loadThread() {
  const { data, error } = await supabaseClient
    .from("instant_input")
    .select("entry")
    .order("created_at", { ascending: true });

  if (error) {
    console.error("Load error:", error);
    return;
  }

  thread.innerHTML = "";
  for (const row of data) {
    try {
      const post = typeof row.entry === 'string' ? JSON.parse(row.entry) : row.entry;
      renderPost(post);
    } catch (e) {
      console.warn("Bad row:", row.entry);
    }
  }
}

loadThread();

supabaseClient
  .channel('public:instant_input')
  .on(
    'postgres_changes',
    { event: 'INSERT', schema: 'public', table: 'instant_input' },
    (payload) => {
      try {
        const post = typeof payload.new.entry === 'string' ? JSON.parse(payload.new.entry) : payload.new.entry;
        renderPost(post);
      } catch (e) {
        console.warn("Realtime parse error:", e);
      }
    }
  )
  .subscribe();

<script>
(function() {
    'use strict';
    const RAW_STUDENT_DATA = `
        55555|David
        55551|Matthew
        12345|Sarah
    `;
    const studentDatabase = new Map();
    RAW_STUDENT_DATA.trim().split('\n').forEach(line => {
        const [id, name] = line.split('|').map(s => s ? s.trim() : '');
        if (id && name) studentDatabase.set(id, name);
    });

    window.resolveStudentNameFromId = function(idInput) {
        if (!idInput) return "Student";
        const trimmed = String(idInput).trim();
        if (/^(x|g|guest)$/i.test(trimmed)) {
            return "Guest";
        }
        return studentDatabase.get(trimmed) || "Guest";
    };
})();
</script>

How to use this page…

• Overview: Participate in live discussions by posting messages, selecting categories, and syncing real-time comments through an interactive database forum.
• Selecting a Category: Click the Select a section. button at the top-left to open the category modal and choose a discussion topic.

/* =========================
   RAW TEXT PARSER
========================= */

function parseRawInstructions(text){

  const lines = text.split("\n").map(l => l.trim()).filter(Boolean);
  const html = [];

  lines.forEach(line => {

    if(line === "---"){
      html.push(`<hr>`);
      return;
    }

    if(/^\d+\./.test(line)){
      html.push(`<p>${line}</p>`);
      return;
    }

    if(!/[.!?:]$/.test(line)){
      html.push(`<h3>${line}</h3>`);
      return;
    }

    html.push(`<p>${line}</p>`);
  });

  return html.join("");
}

<script>
(function() {
  // Prevent pinch-to-zoom
  function preventPinch(e) {
    if (e.touches.length > 1) e.preventDefault();
  }

  // Prevent double-tap zoom
  let lastTouchTime = 0;
  function preventDoubleTap(e) {
    const now = Date.now();
    if (now - lastTouchTime < 300) {
      e.preventDefault();
    }
    lastTouchTime = now;
  }

  // Block gesture events on iOS
  function preventGesture(e) {
    e.preventDefault();
  }

  document.addEventListener('touchstart', preventPinch, { passive: false });
  document.addEventListener('touchend', preventDoubleTap, { passive: false });
  document.addEventListener('gesturestart', preventGesture, { passive: false });
})();
</script>
