<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Focus Pages</title>

<style>

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    height:100%;
    overflow:hidden;
    font-family:Arial,sans-serif;
    background:black !important;
}
/* ==========================
   MAIN LAYOUT
========================== */

#main{
    display:flex;
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 48px; /* 24px tilesBar + 24px scriptBar */
}
/* ==========================
   LEFT COLUMN
========================== */

#leftColumn{
    width:90px;
    min-width:90px;
    background:black !important;
    border-right:1px solid #999;
    display:flex;
    flex-direction:column;
    justify-content:flex-start;
    position: relative;
}

/* ==========================
   RIGHT COLUMN
========================== */

#rightColumn{
    width:90px;
    min-width:90px;
    background:black !important;
    border-left:1px solid #999;
    display:flex;
    flex-direction:column;
    justify-content:flex-start;
    position: relative;
}

#clearBoardBtn,
#clearBoardBtnRight{
    height:24px;
    font-size:10px;
    border:none;
    border-bottom:1px solid #999;
    cursor:pointer;
}

/* ==========================
   UNIT FOLDERS & FLYOUTS
========================== */
.unitFolderContainer {
    position: static;
    width: 100%;
}

.unitFolderBtn {
    width: 100%;
    height: 22px;
    font-size: 9px;
    background: black;
    color: white;
    border: none;
    border-bottom: 1px solid #333;
    cursor: pointer;
    text-align: center;
}

.unitFolderBtn:hover {
    background: #fdfdfd !important;
    color: #111 !important;
}

.spreadFlyout {
    display: none;
    position: absolute;
    left: 90px;
    top: 0;
    width: 140px;
    max-height: calc(100vh - 124px);
    background: black;
    border: 1px solid #555;
    z-index: 20000;
    overflow-y: auto;
    box-shadow: 2px 2px 10px rgba(0,0,0,0.8);
}

#rightColumn .spreadFlyout {
    left: auto;
    right: 90px;
}

.spreadFlyout.active {
    display: flex;
    flex-direction: column;
}

.spreadFlyoutItem {
    padding: 6px 8px;
    font-size: 10px;
    color: white;
    background: black;
    border-bottom: 1px solid #222;
    cursor: pointer;
    text-align: center;
    white-space: nowrap;
}

.spreadFlyoutItem:hover {
    background: #4a90e2 !important;
    color: white !important;
}

/* Unit Grid Layout Container (2 columns) */
.unitGrid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 1px;
    background: #333;
    padding: 1px;
}

/* ==========================
   VIEWER
========================== */

#viewer{
    flex:1;
    overflow:hidden;
    background:black;
    position:relative;
    cursor: move;
    touch-action:none;
}

#spread{
    position:absolute;
    top:0;
    left:0;
    height:100%;
    white-space:nowrap;
    font-size:0;
}

/* ==========================
   PAGES
========================== */

.imagePanel{
    display:inline-block;
    height:100%;
}

.imgWrap{
    width:100%;
    height:100%;
    overflow:hidden;
    position:relative;
    display:flex;
    justify-content:center;
    align-items:center;
}

.pageImage{
    display:block;
    height:100%;
    max-height:100%;
    width:auto;
    object-fit:contain;
    pointer-events: none;
}
.leftPage{
    left:0;
    width:100%;
    clip-path: none;
}

.rightPage{
    left:0;
    width:100%;
    clip-path: none;
}
/* ==========================
   TILES
========================== */

#tilesBar {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 24px;
    height: 8px; /* Loads closed */
    display: flex;
    flex-direction: column;
    border-top: 1px solid #555;
    background: #222; /* Instantly paints the grey bar on first frame */
    z-index: 9998;
    box-sizing: border-box;
    overflow: hidden; /* Keeps the tiles hidden until dragged open */
}
#tiles{
    flex: 1;
    background: black !important;
    display: flex;
    flex-wrap: wrap;
    gap: 2px;
    padding: 4px;
    overflow-y: auto;
    overflow-x: hidden;
    align-content: flex-start;
    justify-content: flex-start;
}
.tile{
    min-width:8ch;
    height:14px;
    line-height:14px;
    font-size:9px;
    padding:0 4px;
    margin:0;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    background:#E8D8B5;
    border:1px solid #B99F6B;
    color:#222;
    cursor:pointer;
    white-space:nowrap;
    user-select:none;
}

.tile.selected{
    background:#4a90e2 !important;
    border-color:#2f6fb7;
    color:white !important;
}

/* Designated Prefix Tile Colors */
.tile[data-prefix="~I"] {
    background: #e74c3c !important;
    border-color: #c0392b !important;
    color: white !important;
}

/* Emoji (~E) -> Orange */
.tile[data-prefix="~E"] {
    background: #e67e22 !important;
    border-color: #d35400 !important;
    color: white !important;
}

.tile[data-prefix="~SP"] {
    background: #2ecc71 !important;
    border-color: #27ae60 !important;
    color: white !important;
}

/* Sound Effects (~SX) -> Green */
.tile[data-prefix="~SX"] {
    background: #2ecc71 !important;
    border-color: #27ae60 !important;
    color: white !important;
}

#tilesResizeBar{
    height: 8px;
    width: 100%;
    background: #999;
    cursor: ns-resize;
    flex-shrink: 0;
    z-index: 10001;
}/* ==========================
   DRAGGABLES
========================== */

.draggable {
    position: absolute;
    z-index: 9999;
    cursor: move;
    user-select: none;
    -webkit-user-drag: none;
    touch-action: none;
    transition: none !important;
    animation: none !important;
    filter: none !important;
    transform: none !important;
}

.overlayPng {
    position: absolute;
    width: 140px;
    height: auto;
    background: transparent !important;
    border: none !important;
    padding: 0 !important;
    margin: 0 !important;
    display: block;
    pointer-events: auto;
    object-fit: contain;
}

img {
    -webkit-user-drag: none;
    -webkit-touch-callout: none;
}

#viewer, #spread, .imagePanel, .imgWrap {
    user-select: none;
    -webkit-user-select: none;
    -ms-user-select: none;
}

#deleteBtn,
#deleteBtnRight {
    width:100%;
    height:24px;
    font-size:10px;
    border:none;
    border-bottom:1px solid #999;
    cursor:pointer;
    background:black;
    color:white;
}

#scriptBar{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    height:24px;
    display:flex;
    flex-direction:row;
    align-items:stretch;
    border-top:1px solid #999;
    background:black;
    z-index:10000;
}

#scriptResizeBar{
    position:absolute;
    top:-8px;
    left:0;
    width:100%;
    height:8px;
    background:#999;
    cursor:ns-resize;
    z-index:10001;
}

#worksheetScript{
    flex:1;
    height:22px;
    resize:none;
    overflow:auto;
    font:10px Consolas,monospace;
    white-space:pre;
    border:none;
    outline:none;
    background: black !important;
    color: white !important;
    scrollbar-width:none;
}

#worksheetScript::-webkit-scrollbar{
    display:none;
}

#downloadTxtBtn{
    width:32px;
    height:22px;
    font-size:10px;
    border:none;
    border-left:1px solid #999;
    background:black;
    color:white;
    cursor:pointer;
    padding:0;
}

#downloadTxtBtn:hover{
    background:#333;
}

#scriptBar.expanded{
    height:220px;
}

#scriptBar.expanded #worksheetScript{
    height:218px;
}

/* ==========================
   BREAK MODAL (2.25x Sized)
========================== */

#breakModal{
    position: absolute;
    width: 585px;
    height: 405px;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    background: #000;
    border-radius: 33.75px;
    color: white;
    z-index: 50000;
    display: none;
    box-shadow: 0 0 67.5px rgba(0,0,0,.6);
    backdrop-filter: blur(4px);
    cursor: move;
    user-select: none;
}
#breakContent{
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
}

#breakContent h1{
    font-size: 72px;
    margin: 0;
    text-shadow: 0 0 45px black;
}

#breakTimer{
    margin-top: 11.25px;
    font-size: 76.5px;
    color: orange;
    text-shadow: 0 0 33.75px black;
}

#breakStart{
    margin-top: 45px;
    transform: translateY(-33.75px);
    padding: 18px 40.5px;
    border: none;
    border-radius: 18px;
    background: orange;
    font-weight: bold;
    font-size: 27px;
    cursor: pointer;
}

.breakControls{
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 27px;
    margin-top: 11.25px;
}

.breakArrow{
    display: flex;
    align-items: center;
    justify-content: center;
    color: orange;
    font-size: 54px;
    cursor: pointer;
    user-select: none;
    height: 90px;
    transform: translateY(-11.25px);
}

.breakControls button{
    margin: 0;
    padding: 18px 22.5px;
    font-size: 27px;
    border: none;
    border-radius: 13.5px;
    background: orange;
    cursor: pointer;
    font-weight: bold;
}

.breakControls button:hover{
    background: #ffb347;
}

.breakArrow:hover{
    color: #ffb347;
}
.spinnerAssembly{
    position: absolute;
    z-index: 5001;
    pointer-events: none;
}

.spinnerButton{
    width: 100%;
    height: 24px;
    font-size: 10px;
    font-family: Arial, sans-serif;
    border: none;
    border-bottom: 1px solid #999;
    background: black;
    color: white;
    cursor: pointer;
    padding: 0;
    pointer-events: auto;
}
#tallymanLeftBtn,
#tallymanRightBtn{
    height:24px;
    width:100%;
    font-size:10px;
    border:none;
    border-bottom:1px solid #999;
    cursor:pointer;
    background:black;
    color:white;
}

#leftColumn *,
#rightColumn * {
    outline: none !important;
    box-shadow: none !important;
}

#leftColumn,
#rightColumn {
    background: black !important;
}

#leftColumn button,
#rightColumn button,
#leftColumn input,
#rightColumn input,
#leftColumn select,
#rightColumn select {
    background: black !important;
    color: white !important;
    border: none !important;
    outline: none !important;
    box-shadow: none !important;
}

#leftColumn button:hover,
#rightColumn button:hover {
    background: #fdfdfd !important;
    color: #111 !important;
}

#leftBtn,
#rightBtn {
    width: 100%;
    height: 24px;
    font-size: 10px;
    border: none;
    border-bottom: 1px solid #999;
    cursor: pointer;
    background: black;
    color: white;
    padding: 0;
}

#loadAnswerBtn, #loadAnswerBtnRight {
    height: 24px;
    width: 100%;
    font-size: 10px;
    border: none;
    border-bottom: 1px solid #999;
    cursor: pointer;
    background-color: black;
    color: white;
}
#loadAnswerBtn:hover, #loadAnswerBtnRight:hover {
    background-color: #333;
}


.tile.mp3Tile {
    background: #4a90e2;
    color: black !important;
}

.tile.soundTile.soundSX {
    background: #4caf50;
    color: black !important;
}

/* Force all tiles, including image and audio titles/text, to be black */
#tiles .tile,
#tiles .tile *,
#tiles .mp3Tile,
#tiles .soundTile,
#tiles .imageTile,
#tiles .emojiTile,
.tile,
.mp3Tile,
.soundTile,
.imageTile,
.emojiTile {
    color: black !important;
}

/* Emoji Tiles (~E) -> White */
.tile.emojiTile[data-prefix="~E"],
.tile[data-prefix="~E"] {
    background: white !important;
    border-color: grey !important;
    color: black !important;
}

/* Image Tiles (~I) -> Pastel Orange */
.tile.imageTile[data-prefix="~I"],
.tile[data-prefix="~I"] {
    background: #f8c471 !important;
    border-color: #f39c12 !important;
    color: black !important;
}

/* Audio Tiles (~P) -> Pastel Green */
.tile[data-prefix="~P"] {
    background: #a9dfbf !important;
    border-color: #52be80 !important;
    color: black !important;
}



/* Audio Path Tiles (~SP) -> Green */
.tile[data-prefix="~SP"] {
    background: #2ecc71 !important;
    border-color: #27ae60 !important;
    color: white !important;
}
/* Sound Effects (~SX) -> Dark Green */
.tile[data-prefix="~SX"],
.tile.soundTile.soundSX {
background: #76d7c4 !important;
    border-color: #45b39d !important;
    color: white !important;
}


/* Purple Note Tile and Modal Styling */
.tile.noteTile {
    background-color: #800080 !important;
    color: white !important;
    border-color: #5e005e !important;
}
.tile.noteTile:hover {
    background-color: #9c1c9c !important;
}
#noteModal {
    position: absolute;
    z-index: 9999;
    top: 150px;
    left: 150px;
    background: #ffffff;
    border: 2px solid #800080;
    padding: 8px;
    border-radius: 12px;
    box-shadow: 0 4px 12px rgba(128,0,128,0.25);
    width: 320px;
    font-family: sans-serif;
    display: none;
    resize: both;
    overflow: hidden;
}
#noteModalHeader {
    display: flex;
    justify-content: space-between;
    align-items: center;
    cursor: move;
    background: #800080;
    color: white;
    padding: 4px 8px;
    border-radius: 6px;
    font-weight: bold;
    font-size: 13px;
    margin-bottom: 6px;
}
#noteModalBody {
    width: 100%;
    height: 120px;
    font-size: 13px;
    font-family: sans-serif;
    border: 1px solid #ddd;
    padding: 6px;
    outline: none;
    resize: none;
    box-sizing: border-box;
    color: #333;
    line-height: 1.4;
    white-space: pre-wrap;
}

/* Hide scrollbars globally for all textareas and scrollable containers while keeping scroll active */
textarea::-webkit-scrollbar,
div::-webkit-scrollbar {
    display: none !important;
}

textarea,
div {
    -ms-overflow-style: none !important;  /* IE and Edge */
    scrollbar-width: none !important;     /* Firefox */
}


/* --- Inset Control Buttons & Borderless Vignette Panels --- */

/* --- Borderless packed vertical modal panels (200px wide, locked under top controls) --- */
/* --- Borderless packed vertical modal panels --- */
/* ==========================
   VIGNETTE MODAL PANELS & DRAG HANDLE
========================== */

.vignette-modal-panel {
  display: none;
  position: fixed;
  width: 200px;
  top: 25px;
  /* bottom: 48px; Removed so height is controlled strictly by content */
  background: #000;
  border: 1px solid #444;
  z-index: 2147483646;
  flex-direction: column;
  overflow: hidden;
  box-shadow: 0 8px 24px rgba(0,0,0,0.5);
  border-radius: 6px;
  box-sizing: border-box;
}

.vignette-modal-panel.open {
  display: flex;
}
/* Left Panel positioning */
#vignetteLeftModal {
  left: 90px;               /* Sits immediately to the right of #leftColumn (90px wide) */
}

/* Right Panel positioning - Locked flush against the left edge of #rightColumn (90px wide) */
#vignetteRightModal {
  right: 90px;              /* Matches the exact width of #rightColumn */
  left: auto !important;    /* Prevents any script from overriding */
}

/* Distinct Drag Title Bar for precise control */
.vignette-drag-handle {
  height: 24px;
  background: #1a1a1a;
  color: #fff;
  cursor: grab;
  width: 100%;
  flex-shrink: 0;
  border-bottom: 1px solid #444;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: Arial, sans-serif;
  font-size: 10px;
  font-weight: bold;
  letter-spacing: 1px;
  touch-action: none;
  user-select: none;
}
.vignette-drag-handle:active {
  cursor: grabbing;
  background: #333;
}

/* Zero padding, zero margin packed scroll container */
.vignette-scroll-box {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 0;
  margin: 0;
  display: flex;
  flex-direction: column;
  gap: 0;
  scrollbar-width: none;
}

.vignette-scroll-box::-webkit-scrollbar {
  display: none;
}

/* Packed 200px by 200px iframe items with zero borders/margins */
.vignette-card {
  width: 200px;
  height: 200px;
  min-width: 200px;
  min-height: 200px;
  margin: 0;
  padding: 0;
  border: none;
  background: #000;
  display: block;
  position: relative;
  flex-shrink: 0;
}

.vignette-card iframe {
  width: 200px;
  height: 200px;
  border: none;
  margin: 0;
  padding: 0;
  transform: none;          /* No scaling needed; full 200px size */
  pointer-events: auto;     /* Enables direct interaction */
}


</style>
</head>

<script>
/* ==========================
   BREAK TIMER MODAL & LOGIC
========================== */

let breakInterval = null;
let breakRemaining = 300;

function openBreakModal(){
    const modal = document.getElementById("breakModal");
    if (!modal) return;

    if(modal.style.display === "block"){
        modal.style.display = "none";
        clearInterval(breakInterval);
        breakInterval = null;
        return;
    }

    modal.style.display = "block";
    startBreak();
}

function renderBreak(){
    let m = Math.floor(breakRemaining / 60);
    let s = String(breakRemaining % 60).padStart(2, "0");
    const timerEl = document.getElementById("breakTimer");
    if (timerEl) timerEl.textContent = `${m}:${s}`;
}

function adjustBreakTime(amount){
    if(breakRemaining <= 0){
        startBreak(amount);
    } else {
        breakRemaining += amount;
        renderBreak();
    }

    if(typeof restartMusicAfterExtension === "function"){
        restartMusicAfterExtension();
    }
}

function startBreak(duration = 300){
    clearInterval(breakInterval);
    breakRemaining = duration;
    renderBreak();

    breakInterval = setInterval(() => {
        breakRemaining--;
        renderBreak();

        if(breakRemaining <= 0){
            clearInterval(breakInterval);
            breakInterval = null;
            const timerEl = document.getElementById("breakTimer");
            if (timerEl) timerEl.textContent = "Time's up!";
            breakRemaining = 0;
        }
    }, 1000);
}

document.addEventListener("DOMContentLoaded", () => {
    const breakStartBtn = document.getElementById("breakStart");
    if (breakStartBtn) {
        breakStartBtn.onclick = (e) => {
            e.stopPropagation();
            startBreak();
        };
    }

    const breakPlusBtn = document.getElementById("breakPlus");
    if (breakPlusBtn) {
        breakPlusBtn.onclick = (e) => {
            e.stopPropagation();
            adjustBreakTime(60);
        };
    }

    const breakMinusBtn = document.getElementById("breakMinus");
    if (breakMinusBtn) {
        breakMinusBtn.onclick = (e) => {
            e.stopPropagation();
            adjustBreakTime(-60);
        };
    }
});



/* ==========================================================
   CLEAN TALLYMAN-STYLE DRAGGABLE BREAK MODAL
========================================================== */

(function(){
    let modal = document.getElementById("breakModal");
    if (!modal) return;

    let isDragging = false;
    let startX = 0;
    let startY = 0;
    let initialized = false;

    modal.addEventListener("mousedown", e => {
        // If clicking buttons or arrows, let them do their job and do NOT drag
        if (e.target.closest('button') || e.target.closest('.breakArrow')) {
            return;
        }

        // Convert initial centering transform into absolute pixels on first grab
        if (!initialized) {
            const rect = modal.getBoundingClientRect();
            modal.style.transform = "none";
            modal.style.left = rect.left + "px";
            modal.style.top = rect.top + "px";
            modal.style.right = "auto";
            modal.style.bottom = "auto";
            initialized = true;
        }

        isDragging = true;
        startX = e.clientX - modal.offsetLeft;
        startY = e.clientY - modal.offsetTop;

        // Stop event from bleeding through to background/spinner elements
        e.stopPropagation();
        e.preventDefault();
    });

    document.addEventListener("mousemove", e => {
        if (!isDragging) return;

        // Smooth direct coordinate updating just like Tallyman
        window.requestAnimationFrame(() => {
            modal.style.left = (e.clientX - startX) + "px";
            modal.style.top = (e.clientY - startY) + "px";
        });

        e.stopPropagation();
    });

    document.addEventListener("mouseup", e => {
        if (isDragging) {
            isDragging = false;
            e.stopPropagation();
        }
    });
})();
</script>

    }

        }
        else{

            startBreakMusic();

        }


        oldOpenBreakModal();

    };

        startBreakMusic;


    window.stopBreakMusic =
        stopBreakMusic;

})();

// Automatically generate dynamic page pairs from raw file lists
function generateSpreads(fileList) {
    let focusFiles = [];
    let actImgFiles = [];

    fileList.forEach(file => {
        const upper = file.toUpperCase();
        
        // Filter out standalone placeholder blanks from appearing on their own
        if (upper === "WHITE_BLANK.JPG" || upper === "BLACK_BLANK.JPG") {
            return;
        }

        // Catch ACT or IMG files regardless of parentheses or prefix structure
        if (upper.startsWith("ACT") || upper.startsWith("IMG")) {
            actImgFiles.push(file);
        // Catch the new Unit format alongside any leftover Focus/parenthesis formats
        } else if (upper.startsWith("UNIT_") || upper.startsWith("FOCUS") || upper.includes("(")) {
            focusFiles.push(file);
        }
    });

    let pairs = [];

    // Pair regular sequential files into spreads of 2
    for (let i = 0; i < focusFiles.length; i += 2) {
        if (i + 1 < focusFiles.length) {
            pairs.push([focusFiles[i], focusFiles[i + 1]]);
        } else {
            pairs.push([focusFiles[i], "WHITE_BLANK.jpg"]);
        }
    }

    // Pair ACT or IMG files automatically according to naming indicator (+BLACK / +WHITE)
    actImgFiles.forEach(file => {
        let blankChoice = "WHITE_BLANK.jpg";
        if (file.toUpperCase().includes("+BLACK") || file.toUpperCase().includes("BLACK")) {
            blankChoice = "BLACK_BLANK.jpg";
        }
        pairs.push([file, blankChoice]);
    });

    return pairs;
}

        const flyout = document.createElement("div");
        flyout.className = "spreadFlyout";

        const unitSpreads = generateSpreads(rawUnitFiles[unitName]);
        unitSpreads.forEach(([leftFile, rightFile]) => {
            const spreadItem = document.createElement("div");
            spreadItem.className = "spreadFlyoutItem";
            
            const cleanLeft = leftFile.replace(/\.[^/.]+$/, "");
            const cleanRight = rightFile.replace(/\.[^/.]+$/, "");
            spreadItem.textContent = `${cleanLeft} - ${cleanRight}`;
            
            spreadItem.onclick = (e) => {
                e.stopPropagation();
                loadSpread(`${unitName}/${leftFile}`, `${unitName}/${rightFile}`);
                document.querySelectorAll(".spreadFlyout").forEach(f => f.classList.remove("active"));
            };
            flyout.appendChild(spreadItem);
        });

folderBtn.onclick = (e) => {
            e.stopPropagation();
            const isOpen = flyout.classList.contains("active");
            document.querySelectorAll(".spreadFlyout").forEach(f => f.classList.remove("active"));
            if (!isOpen) {
                // Aligned precisely flush with the top of the clicked unit button
                flyout.style.top = folderBtn.offsetTop + "px";
                flyout.classList.add("active");
            }
        };

        folderWrapper.appendChild(folderBtn);
        folderWrapper.appendChild(flyout);
        container.appendChild(folderWrapper);
    });
}

    select.addEventListener("change", function(){
        viewerScale = Number(this.value);
        zoomSelects.forEach(s => s.value = this.value);
        updateTransform();
    });
});

function updateTransform(){
    if (!spread) return;
    spread.style.transform = `translate(${panX}px, ${panY}px) scale(${viewerScale})`;
    spread.style.transformOrigin = "0 0";
}

if (viewer) {
    viewer.addEventListener("pointerdown", (e) => {
        if(e.target.classList.contains("draggable")) return;
        if(placeMode) return;
        if(panLocked) return;
        if(e.button !== 0) return;

        isPanning = true;
        lastX = e.clientX;
        lastY = e.clientY;
        viewer.setPointerCapture(e.pointerId);
    });

    viewer.addEventListener("pointermove", (e) => {
        if (panLocked) return;
        if (!isPanning) return;

        const dx = e.clientX - lastX;
        const dy = e.clientY - lastY;

        panX += dx;
        panY += dy;

        lastX = e.clientX;
        lastY = e.clientY;

        if (spread) {
            const rect = viewer.getBoundingClientRect();
            const contentW = spread.offsetWidth * viewerScale;
            const contentH = spread.offsetHeight * viewerScale;
            const viewW = rect.width;
            const viewH = rect.height;

            if (contentW <= viewW) {
                panX = (viewW - contentW) / 2;
            } else {
                panX = Math.max(viewW - contentW, Math.min(0, panX));
            }

            if (contentH <= viewH) {
                panY = (viewH - contentH) / 2;
            } else {
                panY = Math.max(viewH - contentH, Math.min(0, panY));
            }
        }

        updateTransform();
    }, true);

viewer.addEventListener("wheel", function(e){
    if(panLocked) return;
    e.preventDefault();

    panX -= e.deltaX;
    panY -= e.deltaY;

    if (spread) {
        const rect = viewer.getBoundingClientRect();
        const contentW = spread.offsetWidth * viewerScale;
        const contentH = spread.offsetHeight * viewerScale;
        const viewW = rect.width;
        const viewH = rect.height;

        // Horizontal boundaries
        if (contentW <= viewW) {
            panX = (viewW - contentW) / 2;
        } else {
            panX = Math.max(
                viewW - contentW,
                Math.min(0, panX)
            );
        }

        // Vertical boundaries
        if (contentH <= viewH) {
            panY = (viewH - contentH) / 2;
        } else {
            panY = Math.max(
                viewH - contentH,
                Math.min(0, panY)
            );
        }
    }

    updateTransform();
}, { passive: false });;

    viewer.addEventListener("pointerup", (e) => {
        isPanning = false;
        if (e.pointerId) {
            try { viewer.releasePointerCapture(e.pointerId); } catch(err) {}
        }
    });
}
</script>

<script>
/* ======================================================
   UNIFIED WORKSHEET & TILE ENGINE (Sequential Order & Emoji Fix)
====================================================== */

window.placeMode = window.placeMode || null;
window.selectedEl = window.selectedEl || null;

// Global audio element for ~S toggle playback
let globalSoundPlayer = null;

function getSoundPlayer() {
    if (!globalSoundPlayer) {
        globalSoundPlayer = document.createElement("audio");
        globalSoundPlayer.id = "soundPlayer";
        globalSoundPlayer.style.display = "none";
        document.body.appendChild(globalSoundPlayer);
    }
    return globalSoundPlayer;
}

// Unlock audio on first user action
let audioUnlocked = false;
function unlockAudio() {
    audioUnlocked = true;
    document.removeEventListener("pointerdown", unlockAudio);
    document.removeEventListener("keydown", unlockAudio);
}
document.addEventListener("pointerdown", unlockAudio, { once: true });
document.addEventListener("keydown", unlockAudio, { once: true });


/* ==========================
   MAIN BUILD FUNCTION (Sequential)
========================== */

function buildAllTiles() {
    const tileArea = document.getElementById("tiles");
    if (!tileArea) return;

    tileArea.innerHTML = ""; // Clear existing tiles

    const rawInput = document.getElementById("worksheetScript");
    if (!rawInput || !rawInput.value) return;

    let fullText = rawInput.value;
    let lines = fullText.split(/\r?\n/);

    // 1. Find and extract any "Unit ..." line so we can force it to the top
    let unitLineIndex = -1;
    let unitLineText = "";
    
    for (let i = 0; i < lines.length; i++) {
        let l = lines[i].trim();
        if (/^unit\s*\d+/i.test(l) && !l.startsWith("~") && !l.includes("-")) {
            unitLineText = l;
            unitLineIndex = i;
            break;
        }
    }

    // If found, remove it from its current position so we can place it first
    if (unitLineIndex !== -1) {
        lines.splice(unitLineIndex, 1);
    }

    // Helper function to render a single line into a tile
    function renderLineToTile(rawLine) {
        let line = rawLine.trim();
        if (!line) return;

// 1. HANDLE EXTERNAL MP3 FILES (~SP)
        if (/^~SP/i.test(line)) {
            let cleanLine = line.replace(/^~SP/i, "").trim();
            if (cleanLine.startsWith(".")) {
                cleanLine = "P" + cleanLine;
            } else if (/^\d/.test(cleanLine)) {
                cleanLine = "P." + cleanLine;
            }
            cleanLine = cleanLine.replace(/^[-–—]\s*/, "").trim();
            
            let match = cleanLine.match(/^(.+?)\s*[-–—]\s*(.+?\.mp3)\s*$/i);
            let label = match ? match[1].trim() : cleanLine.replace(/\.[^.]+$/, "");
            let file = match ? match[2].trim() : cleanLine;

            const tile = document.createElement("div");
            tile.className = "tile mp3Tile";
            tile.setAttribute("data-prefix", "~SP");
            tile.textContent = label;
            tile.onclick = function() {
                let audioPath = file;
                if (/^[A-Z]:\\/i.test(audioPath)) {
                    audioPath = "file:///" + audioPath.replace(/\\/g, "/");
                }
                window.open(audioPath);
            };
            tileArea.appendChild(tile);
            return;
        }

        // 2. HANDLE INTERNAL TOGGLE-TO-STOP SOUND FILES (~S, ~SX, etc.)
        if (/^~S[A-Za-z0-9]*/i.test(line)) {
            let prefixMatch = line.match(/^~([A-Za-z0-9]+)/i);
            let extractedPrefix = prefixMatch ? "~" + prefixMatch[1].toUpperCase() : "~S";

            let cleanLine = line.replace(/^~S[A-Za-z0-9]*/i, "").trim();
            cleanLine = cleanLine.replace(/^[-–—]\s*/, "").trim();
            
            let buttonMatch = cleanLine.match(/^(.+?)\s*[-–—]\s*(.+?\.(?:mp3|wav|ogg|m4a))\s*$/i);
            
            let label, file;
            if (buttonMatch) {
                label = buttonMatch[1].trim();
                file = buttonMatch[2].trim();
            } else {
                file = cleanLine;
                label = file.replace(/\.[^.]+$/, "");
            }

            const tile = document.createElement("button");
            tile.type = "button";
            tile.className = "tile soundTile";
            tile.setAttribute("data-prefix", extractedPrefix);
            tile.textContent = label;

            tile.onclick = function() {
                const player = getSoundPlayer();

                if (tile.classList.contains("selected") && !player.paused) {
                    player.pause();
                    player.currentTime = 0;
                    tile.classList.remove("selected");
                    return;
                }

                document.querySelectorAll(".soundTile.selected").forEach(t => {
                    t.classList.remove("selected");
                });

                tile.classList.add("selected");

                let audioPath = file;
                if (/^[A-Z]:\\/i.test(audioPath)) {
                    audioPath = "file:///" + audioPath.replace(/\\/g, "/");
                }

                player.pause();
                player.currentTime = 0;
                player.src = audioPath;
                player.load();
                player.play().catch(err => console.log("Sound play error:", err));
            };

            tileArea.appendChild(tile);
            return;
        }

        // 3. HANDLE EMOJI INPUTS (~E)
        if (/^~E/i.test(line)) {
            let cleanLine = line.replace(/^~E/i, "").trim();
            cleanLine = cleanLine.replace(/^[-–—]\s*/, "").trim();

            let emojiMatch = cleanLine.match(/^(.+?)\s*=\s*(\d+(?:px|em|rem)?)$/);
            let emojiChar = emojiMatch ? emojiMatch[1].trim() : cleanLine.split("=")[0].trim();
            let sizeVal = emojiMatch ? emojiMatch[2].trim() : "32px";
            if (/^\d+$/.test(sizeVal)) sizeVal += "px";

            const tile = document.createElement("div");
            tile.className = "tile emojiTile";
            tile.setAttribute("data-prefix", "~E");
            tile.textContent = emojiChar;

            tile.onclick = function() {
                document.querySelectorAll("#tiles .tile").forEach(t => t.classList.remove("selected"));
                tile.classList.add("selected");
                window.placeMode = { 
                    type: "emoji", 
                    value: emojiChar, 
                    size: sizeVal 
                };
                window.selectedEl = null;
            };

            tileArea.appendChild(tile);
            return;
        }

// Handle generic leading tilde tags for text/images if present
        let prefixTag = "";
        if (line.startsWith("~")) {
            // If it's a page reference like ~P.52, only remove the tilde '~', leave 'P.52'
            if (/^~P\./i.test(line)) {
                line = line.replace(/^~/, "").trim();
            } else {
                let matchTag = line.match(/^~([A-Za-z0-9]+)/);
                if (matchTag) prefixTag = "~" + matchTag[1].toUpperCase();
                line = line.replace(/^~[A-Za-z0-9]*/i, "").trim();
            }
        }

        // 4. HANDLE IMAGE INPUTS (~I, ~IA, etc.)
        let imageMatch = line.match(/^([A-Za-z0-9]+)?\s*[-–—]\s*(.+\.(png|jpg|jpeg))$/i);
        if (imageMatch) {
            let filename = imageMatch[2].trim();
            let label = filename.replace(/\.(png|jpg|jpeg)$/i, "").trim();

            const tile = document.createElement("div");
            tile.className = "tile imageTile";
            tile.setAttribute("data-prefix", prefixTag || "~I");
            tile.textContent = label;

            tile.onclick = function() {
                document.querySelectorAll("#tiles .tile").forEach(t => t.classList.remove("selected"));
                tile.classList.add("selected");
                window.placeMode = { type: "image", value: filename };
                window.selectedEl = null;
            };

            tileArea.appendChild(tile);
            return;
        }

        // 5. HANDLE STANDARD TEXT INPUTS (Label before dash, value after dash)
        let dashMatch = line.match(/^(.+?)\s*[-–—]\s*(.+)$/);
        if (dashMatch) {
            let label = dashMatch[1].trim();
            let value = dashMatch[2].trim();

            const tile = document.createElement("div");
            let prefixClass = prefixTag ? " tile-" + prefixTag.replace("~", "").toLowerCase() : "";
            tile.className = "tile" + prefixClass;
            if (prefixTag) tile.setAttribute("data-prefix", prefixTag);
            tile.textContent = label;

            tile.onclick = function() {
                document.querySelectorAll("#tiles .tile").forEach(t => t.classList.remove("selected"));
                tile.classList.add("selected");
                window.placeMode = { type: "text", value: value };
                window.selectedEl = null;
            };

            tileArea.appendChild(tile);
            return;
        }
    }

    // 2. Render the Unit header first if it was found
    if (unitLineText) {
        const tile = document.createElement("div");
        tile.className = "tile headerTile";
        tile.textContent = unitLineText;

        tile.onclick = function() {
            document.querySelectorAll("#tiles .tile").forEach(t => t.classList.remove("selected"));
            tile.classList.add("selected");
            window.placeMode = { type: "text", value: unitLineText };
            window.selectedEl = null;
        };

        tileArea.appendChild(tile);
    }

    // 3. Process Note blocks and sequential lines in their exact relative order
    let inNoteBlock = false;
    let currentNoteLines = [];

    lines.forEach(rawLine => {
        let line = rawLine.trim();

        // Check if we are starting a ~Note block
        if (/^~Note/i.test(line)) {
            if (inNoteBlock && currentNoteLines.length > 0) {
                renderNoteTile(currentNoteLines.join("\n"));
                currentNoteLines = [];
            }
            inNoteBlock = true;
            currentNoteLines.push(line);
            return;
        }

        if (inNoteBlock && line.startsWith("~")) {
            renderNoteTile(currentNoteLines.join("\n"));
            currentNoteLines = [];
            inNoteBlock = false;
        }

        if (inNoteBlock) {
            if (line) currentNoteLines.push(line);
            return;
        }

        renderLineToTile(rawLine);
    });

    if (inNoteBlock && currentNoteLines.length > 0) {
        renderNoteTile(currentNoteLines.join("\n"));
    }

    function renderNoteTile(noteBodyText) {
        let noteContent = "~Note: " + noteBodyText.replace(/^~Note:?\s*/i, "").trim();
        let displayLines = noteBodyText.replace(/^~Note:?\s*/i, "").trim().split(/\r?\n/);
        let label = displayLines[0] ? displayLines[0].trim() : "Note";
        if (label.startsWith("-")) label = label.replace(/^[-–—]\s*/, "").trim();
        if (label.length > 30) label = label.substring(0, 27) + "...";

        const tile = document.createElement("div");
        tile.className = "tile noteTile";
        tile.setAttribute("data-prefix", "~Note");
        tile.textContent = label || "Note";

        tile.onclick = function() {
            document.querySelectorAll("#tiles .tile").forEach(t => t.classList.remove("selected"));
            tile.classList.add("selected");
            if (window.openNoteModal) {
                window.openNoteModal(noteContent);
            }
        };

        tileArea.appendChild(tile);
    }
}/* ==========================
   AUTO-LOAD & LIVE INPUT LISTENERS
========================== */

document.addEventListener("DOMContentLoaded", () => {
    const worksheetInput = document.getElementById("worksheetScript");
    if (worksheetInput) {
        buildAllTiles();
        worksheetInput.addEventListener("input", buildAllTiles);
    }
});


/* ==========================
   PLACE ON SPREAD
========================== */

if (typeof viewer !== "undefined" && viewer) {
    viewer.addEventListener("pointerdown", function(e){
        const target = e.target;

        if (target.classList.contains("draggable")) {
            e.stopPropagation();
            window.selectedEl = target;
            window.placeMode = null;
            return;
        }

        if (!window.placeMode) return;

        const rect = spread.getBoundingClientRect();
        const x = (e.clientX - rect.left) / viewerScale;
        const y = (e.clientY - rect.top) / viewerScale;

        let obj;
        if (window.placeMode.type === "image") {
            obj = document.createElement("img");
            obj.src = window.placeMode.value;
            obj.className = "draggable overlayPng";
            obj.style.width = "140px";
        } else if (window.placeMode.type === "emoji") {
            obj = document.createElement("div");
            obj.className = "draggable emojiOverlay";
            obj.textContent = window.placeMode.value;
            obj.style.background = "transparent";
            obj.style.border = "none";
            obj.style.boxShadow = "none";
            obj.style.outline = "none";
            obj.style.fontSize = window.placeMode.size;
            obj.style.display = "inline-block";
            obj.style.lineHeight = "1";
            obj.style.padding = "0";
            obj.style.margin = "0";
            obj.style.userSelect = "none";
        } else {
            obj = document.createElement("div");
            obj.className = "draggable tile tileAnchor placedTile";
            obj.textContent = window.placeMode.value;
        }

        obj.style.left = x + "px";
        obj.style.top = y + "px";
        spread.appendChild(obj);
        enableDragging(obj);

        window.selectedEl = obj;
        window.placeMode = null;
    });
}


/* ==========================
   DRAGGING
========================== */

function enableDragging(el){
    el.addEventListener("pointerdown", function(e){
        e.stopPropagation();
        window.selectedEl = el;

        const rect = spread.getBoundingClientRect();
        const offsetX = (e.clientX - rect.left) / viewerScale - parseFloat(el.style.left);
        const offsetY = (e.clientY - rect.top) / viewerScale - parseFloat(el.style.top);

        function move(ev){
            el.style.left = ((ev.clientX - rect.left) / viewerScale - offsetX) + "px";
            el.style.top = ((ev.clientY - rect.top) / viewerScale - offsetY) + "px";
        }

        function up(){
            window.removeEventListener("pointermove", move);
            window.removeEventListener("pointerup", up);
        }

        window.addEventListener("pointermove", move);
        window.addEventListener("pointerup", up);
    });
}
</script>

        const studentPrefix = (!isSpinnerOpen && studentName && studentName !== "Student") ? studentName + " - " : "";

        if (pAnswers.length === 0) {
            bodyEl.value = studentPrefix + "None found";
        } else {
            const fullText = pAnswers[currentIndex] || "";
            const firstLine = fullText.split("\n")[0].trim();
            let dashIndex = firstLine.indexOf(" - ");
            if (dashIndex === -1) dashIndex = firstLine.indexOf(" — ");
            
            const identifier = dashIndex !== -1 ? firstLine.substring(0, dashIndex).trim() : firstLine;
            const answerPart = dashIndex !== -1 ? fullText.substring(dashIndex + 3).trim() : "";

            if (!answerRevealed) {
                bodyEl.value = studentPrefix + identifier;
                if (clearBtn) clearBtn.style.backgroundColor = "red";
            } else {
                // Keep the exercise reference and add/append the answer to it
                const revealedText = answerPart ? `${identifier} - ${answerPart}` : fullText;
                bodyEl.value = studentPrefix + revealedText;
                if (clearBtn) clearBtn.style.backgroundColor = "green";
            }
        }        
        if (currentWidth) modal.style.width = currentWidth;
        if (currentHeight) modal.style.height = currentHeight;

    window.setGlobalStudent = function(name, color) {

            return; // Block completely while spinning

        if (typeof originalSetGlobalStudent === 'function') {
            originalSetGlobalStudent(name, color);
        }
        updatePModalDisplay();
    };

    // Periodically force an update the exact moment Wheel.spinning becomes false
    let wasSpinning = false;
    setInterval(() => {
        if (window.Wheel) {
            if (window.Wheel.spinning) {
                wasSpinning = true;
            } else if (wasSpinning && !window.Wheel.spinning) {
                wasSpinning = false;
                updatePModalDisplay(); // Refresh display immediately when the spinner stops
            }
        }
    }, 50);

    // Input listener to strip student prefix before saving edits back
    document.getElementById('pModalBody').addEventListener('input', (e) => {
        if (pAnswers.length > 0 && answerRevealed) {
            let val = e.target.value;
            const studentTile = document.querySelector('.studentTile');
            const studentName = (window.Wheel && window.Wheel.currentName) || (studentTile ? studentTile.textContent.trim() : "") || "";
            const studentPrefix = studentName && studentName !== "Student" ? studentName + " - " : "";
            
            if (studentPrefix && val.startsWith(studentPrefix)) {
                val = val.substring(studentPrefix.length);
            }
            pAnswers[currentIndex] = val;
        }
    });

    document.getElementById('pNextBtn').addEventListener('click', (e) => {
        e.stopPropagation();
        if (pAnswers.length === 0) return;
        currentIndex = (currentIndex + 1) % pAnswers.length;
        answerRevealed = false;
        updatePModalDisplay();
        
        const wheelOverlay = document.getElementById("studentWheelOverlay");
        if (wheelOverlay && wheelOverlay.style.display === "flex" &&
            typeof window.spinWheel === "function" &&
            !window.__suppressAnswerSpinner) {
            window.spinWheel();
        }    
    });

    document.getElementById('pPrevBtn').addEventListener('click', (e) => {
        e.stopPropagation();
        if (pAnswers.length === 0) return;
        currentIndex = (currentIndex - 1 + pAnswers.length) % pAnswers.length;
        answerRevealed = false;
        updatePModalDisplay();
    });

    document.getElementById('pSquareClearBtn').addEventListener('click', (e) => {
        e.stopPropagation();
        if (pAnswers.length === 0) return;
        answerRevealed = !answerRevealed;
        updatePModalDisplay();
    });

    let isDragging = false, startX, startY;
    const modal = document.getElementById('pAnswerModal');

    function startDrag(clientX, clientY, target) {
        if (target.tagName === 'BUTTON' || target.tagName === 'TEXTAREA') return;
        isDragging = true;
        startX = clientX - modal.offsetLeft;
        startY = clientY - modal.offsetTop;
    }

    function onDrag(clientX, clientY) {
        if (!isDragging) return;
        modal.style.left = `${clientX - startX}px`;
        modal.style.top = `${clientY - startY}px`;
    }

    function stopDrag() {
        isDragging = false;
    }

    modal.addEventListener('mousedown', (e) => {
        startDrag(e.clientX, e.clientY, e.target);
    });
    document.addEventListener('mousemove', (e) => onDrag(e.clientX, e.clientY));
    document.addEventListener('mouseup', stopDrag);

    modal.addEventListener('touchstart', (e) => {
        if (e.target.tagName === 'BUTTON' || e.target.tagName === 'TEXTAREA') return;
        if (e.touches.length === 1) {
            startDrag(e.touches[0].clientX, e.touches[0].clientY, e.target);
            e.preventDefault();
        }
    }, { passive: false });

    document.addEventListener('touchmove', (e) => {
        if (isDragging && e.touches.length === 1) {
            onDrag(e.touches[0].clientX, e.touches[0].clientY);
            e.preventDefault();
        }
    }, { passive: false });

    document.addEventListener('touchend', stopDrag);
})();

(function(){

const btn = document.getElementById("downloadTxtBtn");
const field = document.getElementById("worksheetScript");
const txtLoader = document.getElementById("txtLoader");

// Track the filename whenever a file is selected via the "Browse" button
if (txtLoader) {
    txtLoader.addEventListener("change", function(){
        const file = this.files[0];
        if (file) {
            window.lastUploadedFilename = file.name;
        }
    });
}

if(!btn || !field) return;

btn.onclick = function(){
    const blob = new Blob(
        [field.value],
        {type:"text/plain;charset=utf-8"}
    );

    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);

    // Generate International Date (YYYY-MM-DD) and Military Time (HHMM)
    const now = new Date();
    const year = now.getFullYear();
    const month = String(now.getMonth() + 1).padStart(2, "0");
    const day = String(now.getDate()).padStart(2, "0");
    const internationalDate = `${year}-${month}-${day}`;

    const hours = String(now.getHours()).padStart(2, "0");
    const minutes = String(now.getMinutes()).padStart(2, "0");
    const militaryTime = `${hours}${minutes}`;

    // Determine the base name from the browsed file, or fallback to "Worksheet"
    let baseName = "Worksheet";
    if (window.lastUploadedFilename) {
        // Removes the file extension (.txt) so it doesn't duplicate
        baseName = window.lastUploadedFilename.replace(/\.[^/.]+$/, "");
    }

    // Set the final formatted filename
    a.download = `${baseName}_${internationalDate}_${militaryTime}.txt`;

    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);

    URL.revokeObjectURL(a.href);
};

const studentColors = {
    Blue:"#93c5fd",
    Green:"#86efac",
    Orange:"#fdba74",
    Red:"#fca5a5"
};

function parseStudents(raw){
    const blocks = raw.split(/(?=~)/g);
    const result={};
    blocks.forEach(block=>{
        block=block.trim();
        if(!block.startsWith("~")) return;
        const lines = block.split("\n").map(x=>x.trim()).filter(Boolean);
        const className = lines[0].replace(/^~/, "").split("-")[0].trim();
        result[className]=[];
        for(let i=1;i<lines.length;i++){
            const parts = lines[i].split(/\s+/);
            const team = parts.shift();
            const name = parts.join(" ");
            result[className].push({
                name:name,
                team:team,
                color:studentColors[team] || "#ddd"
            });
        }
    });
    return result;
}

const studentData = parseStudents(RAW_TEXT);
const classSelectors = document.querySelectorAll(".classSelect");
const studentTiles = document.querySelectorAll(".studentTile");

let colorQueues = {};
let currentColor = 0;
const colorOrder = ["Blue", "Green", "Orange", "Red"];

function shuffle(array){
    return [...array].sort(()=>Math.random()-0.5);
}

function loadClass(className){
    colorQueues = {};
    colorOrder.forEach(color=>{
        if (studentData[className]) {
            colorQueues[color] = shuffle(
                studentData[className].filter(s=>s.team===color)
            );
        } else {
            colorQueues[color] = [];
        }
    });
    currentColor = 0;
}

/* CENTRALIZED SYNCHRONIZED STUDENT UPDATER */
window.setGlobalStudent = function(studentName, studentColor) {
    // 1. Update Student Tiles
    studentTiles.forEach(tile=>{
        tile.textContent = studentName;
        tile.style.background = studentColor;
        tile.style.color = "#111";
    });

    // 2. Update Grab Dot / Student Tab
    const grabDot = document.getElementById("pGrabDot");
    if (grabDot) {
        grabDot.textContent = studentName;
        grabDot.style.setProperty("background-color", studentColor, "important");
        grabDot.style.setProperty("color", "#111", "important");
    }

    // 3. Update Tallyman Tile
    const tmTile = document.getElementById("tmTile");
    if (tmTile) {
        tmTile.textContent = studentName;
        tmTile.style.background = studentColor;
        tmTile.style.color = "#111";
    }

    // 4. Update Wheel State if present
    if (typeof Wheel !== "undefined") {
        Wheel.currentName = studentName;
        if (Wheel.overlay && Wheel.overlay.style.display === "flex") {
            if (typeof drawWheel === "function") drawWheel();
        }
    }
};

function nextStudent(){
    const className = classSelectors[0] ? classSelectors[0].value : "";
    if (!className || !studentData[className]) return;

    const color = colorOrder[currentColor];
    if(!colorQueues[color] || colorQueues[color].length===0){
        colorQueues[color] = shuffle(
            studentData[className].filter(s=>s.team===color)
        );
    }

    const student = colorQueues[color].shift();
    if (student) {
        window.setGlobalStudent(student.name, student.color);
    }

    currentColor = (currentColor+1) % colorOrder.length;
}

Object.keys(studentData).forEach(className=>{
    classSelectors.forEach(select=>{
        const option = document.createElement("option");
        option.value = className;
        option.textContent = className;
        select.appendChild(option);
    });
});

classSelectors.forEach(select=>{
    select.addEventListener("change", function(){
        classSelectors.forEach(other=>{
            other.value = this.value;
        });
        loadClass(this.value);
        nextStudent();
        if(window.updateWheelClass){
            window.updateWheelClass();
        }
    });
});

studentTiles.forEach(tile=>{
    tile.onclick = function(e){
        e.stopPropagation();
        const wheelOverlay = document.getElementById("studentWheelOverlay");
        if (wheelOverlay && wheelOverlay.style.display === "flex" && typeof spinWheel === "function") {
            spinWheel();
        } else {
            nextStudent();
        }
    };
});if(classSelectors.length){
    classSelectors.forEach(select => {
        select.selectedIndex = 0; // Keeps it on the default "Class" option
    });
}
window.nextStudent = nextStudent;

    Wheel.panel=document.createElement("div");
    Wheel.panel.id="studentWheelPanel";

    Wheel.canvas=document.createElement("canvas");
    Wheel.canvas.id="studentWheelCanvas";

    Wheel.size = parseInt(
        getComputedStyle(document.documentElement)
            .getPropertyValue("--wheel-size")
    );

    Wheel.radius = Wheel.size / 2 - 10;
    const extraSpace = 40;

Wheel.canvas.width = Wheel.size + extraSpace;
    Wheel.canvas.height = Wheel.size + extraSpace;
    Wheel.ctx = Wheel.canvas.getContext("2d");
    Wheel.panel.appendChild(Wheel.canvas);
    Wheel.overlay.appendChild(Wheel.panel);
    document.body.appendChild(Wheel.overlay);

    // Dynamically make transparent corners click-through and non-draggable
    Wheel.panel.style.pointerEvents = "auto";
    Wheel.panel.addEventListener("pointermove", (e) => {
        if (dragging) return;
        const canvasRect = Wheel.canvas.getBoundingClientRect();
        const cx = canvasRect.left + canvasRect.width / 2;
        const cy = canvasRect.top + canvasRect.height / 2;
        const dx = e.clientX - cx;
        const dy = e.clientY - cy;
        const dist = Math.sqrt(dx * dx + dy * dy);
        const radius = (canvasRect.width / 2) - 10;

        if (dist <= radius) {
            Wheel.canvas.style.pointerEvents = "auto";
        } else {
            Wheel.canvas.style.pointerEvents = "none";
        }
    });

    let dragging=false;
    let ox=0;
    let oy=0;

    Wheel.canvas.addEventListener("pointerdown", e=>{
        const canvasRect = Wheel.canvas.getBoundingClientRect();
        const cx = canvasRect.width / 2;
        const cy = canvasRect.height / 2;
        const localX = e.clientX - canvasRect.left;
        const localY = e.clientY - canvasRect.top;
        const dx = localX - cx;
        const dy = localY - cy;

        // If clicking the brass center hub (radius 28), bypass drag so click-to-spin takes over
        if(Math.sqrt(dx * dx + dy * dy) <= 28){
            return; 
        }

        dragging=true;
        const rect = Wheel.panel.getBoundingClientRect();
        ox = e.clientX - rect.left;
        oy = e.clientY - rect.top;
        e.preventDefault();
    });

    document.addEventListener("pointermove", e=>{
        if(!dragging) return;
        Wheel.panel.style.setProperty("position", "fixed", "important");
        Wheel.panel.style.setProperty("left", (e.clientX - ox) + "px", "important");
        Wheel.panel.style.setProperty("top", (e.clientY - oy) + "px", "important");
        Wheel.panel.style.setProperty("bottom", "auto", "important");
        Wheel.panel.style.setProperty("right", "auto", "important");
        Wheel.panel.style.setProperty("transform", "none", "important");
    });

    document.addEventListener("pointerup", e=>{
        if(dragging){
            dragging=false;
        }
    });
}

function loadWheelStudents(){
    const className = document.querySelector(".classSelect").value;
    if(!className || !studentData[className]){
        Wheel.students = [
            { name: "Blue", color: studentColors["Blue"] },
            { name: "Green", color: studentColors["Green"] },
            { name: "Orange", color: studentColors["Orange"] },
            { name: "Red", color: studentColors["Red"] }
        ];
        return;
    }

    Wheel.students = studentData[className].map(s => ({...s}));
    const colorGroups = {};
    Wheel.students.forEach(student=>{
        const color = student.color || "#ddd";
        if(!colorGroups[color]) colorGroups[color] = [];
        colorGroups[color].push(student);
    });

    const groups = Object.values(colorGroups);
    Wheel.students = [];
    let lastColor = null;

    while(groups.some(g => g.length)){
        groups.sort((a,b)=>b.length-a.length);
        let selected = groups.find(g => g.length && (g[0].color || "#ddd") !== lastColor);
        if(!selected) selected = groups.find(g=>g.length);
        const student = selected.shift();
        Wheel.students.push(student);
        lastColor = student.color || "#ddd";
    }

    const tile = document.querySelector(".studentTile");
    if(tile){
        Wheel.currentName = tile.textContent.trim();
    }
}

function drawWheel(){
    const ctx = Wheel.ctx;
    ctx.setTransform(1,0,0,1,0,0);
    ctx.globalAlpha = 1;
    ctx.shadowColor = "transparent";
    ctx.shadowBlur = 0;
    ctx.clearRect(0, 0, Wheel.canvas.width, Wheel.canvas.height);

    const extraSpace = 40;
    const cx = (Wheel.size/2) + extraSpace/2;
    const cy = (Wheel.size/2) + extraSpace/2;

    ctx.save();
    const students=Wheel.students;
    if(!students.length) return;

    const slice = Math.PI*2/students.length;

    students.forEach((s,i)=>{
        const start = Wheel.angle + i * slice;
        const end = start + slice;

        ctx.beginPath();
        ctx.moveTo(cx,cy);
        ctx.arc(cx, cy, Wheel.radius, start, end);
        ctx.closePath();

        ctx.fillStyle = s.color || "#ddd";
        ctx.fill();

        ctx.strokeStyle = "#000";
        ctx.lineWidth = 0.25;
        ctx.stroke();

        const mid = (start + end) / 2;
        ctx.save();
        const labelRadius = Wheel.radius - 15; 
        ctx.translate(cx + Math.cos(mid) * labelRadius, cy + Math.sin(mid) * labelRadius);
        ctx.rotate(mid + Math.PI);
        ctx.fillStyle = "#111";
        ctx.font = (Wheel.size * 0.045) + "px Arial";
        ctx.textAlign = "left";
        ctx.textBaseline = "middle";
        ctx.fillText(s.name, 0, 0);
        ctx.restore();
    });

    ctx.restore();

    ctx.save();
    const rimWidth = 10;
    const rimGradient = ctx.createRadialGradient(cx, cy, Wheel.radius - rimWidth, cx, cy, Wheel.radius + 5);
    rimGradient.addColorStop(0, "#5c3900");
    rimGradient.addColorStop(0.25, "#d8a62a");
    rimGradient.addColorStop(0.45, "#fff2a6");
    rimGradient.addColorStop(0.65, "#c58a16");
    rimGradient.addColorStop(0.85, "#8b5a05");
    rimGradient.addColorStop(1, "#3b2400");

    ctx.beginPath();
    ctx.arc(cx, cy, Wheel.radius, 0, Math.PI * 2);
    ctx.strokeStyle = rimGradient;
    ctx.lineWidth = rimWidth;
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(cx, cy, Wheel.radius - rimWidth/2, 0, Math.PI * 2);
    ctx.strokeStyle = "rgba(255,240,150,0.8)";
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.restore();

// pointer (Moved down by 5px: changed 35->40 and 18->23)
    ctx.beginPath();
    ctx.moveTo(cx, 40);
    ctx.lineTo(cx - 10, 23);
    ctx.lineTo(cx + 10, 23);
    ctx.closePath();
    ctx.fillStyle = "red";
    ctx.fill();

// hub
    const hubX = cx;
    const hubY = cy;
    ctx.save();
    ctx.beginPath();
    ctx.arc(hubX + 2, hubY + 4, 22, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(0,0,0,0.35)";
    ctx.fill();

    const brass = ctx.createRadialGradient(hubX - 6, hubY - 8, 2, hubX, hubY, 24);
    brass.addColorStop(0, "#fff2a6");
    brass.addColorStop(0.15, "#ffd34e");
    brass.addColorStop(0.35, "#c58a16");
    brass.addColorStop(0.65, "#8b5a05");
    brass.addColorStop(0.85, "#d8a62a");
    brass.addColorStop(1, "#5c3900");

    ctx.beginPath();
    ctx.arc(hubX, hubY, 22, 0, Math.PI * 2);
    ctx.fillStyle = brass;
    ctx.fill();

    ctx.beginPath();
    ctx.arc(hubX, hubY, 22, 0, Math.PI * 2);
    ctx.strokeStyle = "#5a3500";
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(hubX, hubY, 15, 0, Math.PI * 2);
    ctx.strokeStyle = "rgba(255,240,150,0.8)";
    ctx.lineWidth = 1.8;
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(hubX - 5, hubY - 6, 5, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(255,255,220,0.55)";
    ctx.fill();
    ctx.restore();
}
function spinWheel(){
    if(Wheel.spinning) return;
    Wheel.spinning = true;

    if(window.startSpinnerSound) startSpinnerSound();
    loadWheelStudents();

    if(!Wheel.students.length){
        Wheel.spinning = false;
        if(window.stopSpinnerSound) stopSpinnerSound();
        return;
    }

    let start = performance.now();
    let startAngle = Wheel.angle;
    const slice = (Math.PI * 2) / Wheel.students.length;

    const className = document.querySelector(".classSelect").value;
    if (className && studentData[className]) {
        if(typeof window.nextStudent === "function"){
            window.nextStudent();
        }
        const tile = document.querySelector(".studentTile");
        if(tile){
            Wheel.currentName = tile.textContent.trim();
        }
    } else {
        if (window.appController) {
            window.appController.nextColor();
            Wheel.currentName = window.appController.getActiveColor();
        } else {
            Wheel.currentName = "Blue";
        }
    }

    const targetIndex = Wheel.students.findIndex(s => s.name === Wheel.currentName);
    if(targetIndex < 0){
        Wheel.spinning = false;
        if(window.stopSpinnerSound) stopSpinnerSound();
        return;
    }

    const studentAngle = (targetIndex * slice) + (slice / 2);
    const pointerAngle = -Math.PI / 2;
    let offset = pointerAngle - studentAngle - startAngle;
    offset = ((offset % (Math.PI * 2)) + (Math.PI * 2)) % (Math.PI * 2);
    const minimumTurns = 7;
    let target = startAngle + (minimumTurns * Math.PI * 2) + offset;

    function animate(now){
        let p = (now - start) / Wheel.duration;
        if(p > 1) p = 1;
        let ease = 1 - Math.pow(1 - p, 5);
        Wheel.angle = startAngle + (target - startAngle) * ease;
        drawWheel();

if(p < 1){
            requestAnimationFrame(animate);
        } else {
            // Stop sound and prepare the hand-off override
            if(window.stopSpinnerSound) stopSpinnerSound();
            loadWheelStudents();
            drawWheel();

            const landingStudent = Wheel.students[targetIndex];
            if (landingStudent && typeof window.pushStudentHandOff === "function") {
                window.pendingWinnerOverride = { name: landingStudent.name, color: landingStudent.color };
            }
            
            Wheel.spinning = false;
            if (typeof window.pushStudentHandOff === "function") {
                window.pushStudentHandOff();
            }
        }
    }
    requestAnimationFrame(animate);
}

function showWheel(){
    createWheel();
    Wheel.overlay.style.display="flex";
    loadWheelStudents();

    const className = document.querySelector(".classSelect").value;
    if (className && studentData[className]) {
        const tile = document.querySelector(".studentTile");
        const tileName = tile ? tile.textContent.trim() : "";
        if(tileName && tileName !== "Student" && Wheel.students.some(s => s.name === tileName)){
            Wheel.currentName = tileName;
        } else if(Wheel.students.length > 0){
            Wheel.currentName = Wheel.students[0].name;
        }
    } else {
        Wheel.currentName = null;
    }

    const targetIndex = Wheel.students.findIndex(s => s.name === Wheel.currentName);
    if(targetIndex >= 0 && Wheel.students.length){
        const slice = (Math.PI * 2) / Wheel.students.length;
        const studentCenter = (targetIndex * slice) + (slice / 2);
        Wheel.angle = (-Math.PI / 2) - studentCenter;
    }
    drawWheel();
}

function updateWheelClass() {
    if(Wheel.overlay && Wheel.overlay.style.display === "flex"){
        loadWheelStudents();
        const className = document.querySelector(".classSelect").value;
        if (className && studentData[className] && Wheel.students.length > 0) {
            const tile = document.querySelector(".studentTile");
            const tileName = tile ? tile.textContent.trim() : "";
            if(tileName && tileName !== "Student" && Wheel.students.some(s => s.name === tileName)){
                Wheel.currentName = tileName;
            } else {
                Wheel.currentName = Wheel.students[0].name;
            }
            const targetIndex = Wheel.students.findIndex(s => s.name === Wheel.currentName);
            if(targetIndex >= 0){
                const slice = (Math.PI * 2) / Wheel.students.length;
                const studentCenter = (targetIndex * slice) + (slice / 2);
                Wheel.angle = (-Math.PI / 2) - studentCenter;
            }
        }
        drawWheel();
    }
}
window.updateWheelClass = updateWheelClass;

function hideWheel(){
    if(Wheel.overlay){
        Wheel.overlay.style.display="none";
    }
}

function toggleSpinner(){
    if(Wheel.overlay && Wheel.overlay.style.display === "flex"){
        hideWheel();
    } else {
        showWheel();
    }
}

const leftSpinner = document.getElementById("spinnerBtn");
if(leftSpinner) leftSpinner.onclick = toggleSpinner;

const rightSpinner = document.getElementById("spinnerBtnRight");
if(rightSpinner) rightSpinner.onclick = toggleSpinner;

window.spinWheel = spinWheel;
window.hideWheel = hideWheel;

document.addEventListener("click", function(e){
    if(!Wheel.overlay || Wheel.overlay.style.display !== "flex") return;
    if(e.target !== Wheel.canvas) return;

    const canvasRect = Wheel.canvas.getBoundingClientRect();
    const extraSpace = 40;
    const cx = (Wheel.size / 2) + extraSpace / 2;
    const cy = (Wheel.size / 2) + extraSpace / 2;

    const scaleX = Wheel.canvas.width / canvasRect.width;
    const scaleY = Wheel.canvas.height / canvasRect.height;
    const internalX = (e.clientX - canvasRect.left) * scaleX;
    const internalY = (e.clientY - canvasRect.top) * scaleY;
    const dx = internalX - cx;
    const dy = internalY - cy;

    if(Math.sqrt(dx * dx + dy * dy) <= 28){
        e.stopImmediatePropagation();
        e.preventDefault();
        spinWheel();
    }
}, true);

})();

        spinnerSound.play().catch(err => { isPlaying = false; });

        if (!isPlaying) return;
        isPlaying = false;
        spinnerSound.pause();
        spinnerSound.currentTime = 0;
    }

    window.startSpinnerSound = startSpinnerSound;
    window.stopSpinnerSound = stopSpinnerSound;

});const tmScores = { Blue:0, Green:0, Orange:0, Red:0 };

<script>
(function(){

"use strict";

/*==================================================
  TALLYMAN SMOOTH DRAG
  (Maintains smooth window dragging without any purple overlays)
==================================================*/

/* Fix window dragging jitter by using requestAnimationFrame and direct transform/style management */
function initSmoothDrag() {
  const win = document.getElementById("tmWindow");
  const handle = document.getElementById("tmDrag");

  if (!win || !handle) return;

  let dragging = false;
  let startX = 0, startY = 0;
  let initialLeft = 0, initialTop = 0;

  handle.addEventListener("mousedown", (e) => {
    dragging = true;
    startX = e.clientX;
    startY = e.clientY;

    const rect = win.getBoundingClientRect();
    initialLeft = rect.left;
    initialTop = rect.top;

    win.style.right = "auto";
    win.style.bottom = "auto";
    win.style.left = initialLeft + "px";
    win.style.top = initialTop + "px";

    e.preventDefault();
  });

  document.addEventListener("mousemove", (e) => {
    if (!dragging) return;

    const dx = e.clientX - startX;
    const dy = e.clientY - startY;

    window.requestAnimationFrame(() => {
      win.style.left = (initialLeft + dx) + "px";
      win.style.top = (initialTop + dy) + "px";
    });
  });

  document.addEventListener("mouseup", () => {
    dragging = false;
  });
}

// Initialize smooth dragging once DOM is ready
if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", initSmoothDrag);
} else {
  setTimeout(initSmoothDrag, 100);
}

console.log("Standalone Smooth Drag Script Loaded");

})();
</script>

<script>
/* ==========================================
   TALLYMAN DOWNLOAD & UPLOAD FEATURE (FIXED & WORKING)
========================================== */
(function() {
    "use strict";

    // 1. Inject styling for the Tallyman bottom download and upload toolbar
    const style = document.createElement("style");
    style.innerHTML = `
        #tmBottomControlsRow {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 4px;

            border-radius: 4px;

        }

            background-color: #f0f0f0;
        }
    `;
    document.head.appendChild(style);

    // 2. Format international date (YYYY-MM-DD) and military time with seconds (HHMMSS)
    function getTimestampString() {
        const now = new Date();
        const year = now.getFullYear();
        const month = String(now.getMonth() + 1).padStart(2, "0");
        const day = String(now.getDate()).padStart(2, "0");
        const dateStr = `${year}-${month}-${day}`;

        const hours = String(now.getHours()).padStart(2, "0");
        const minutes = String(now.getMinutes()).padStart(2, "0");
        const seconds = String(now.getSeconds()).padStart(2, "0");
        const timeStr = `${hours}${minutes}${seconds}`;

        return { dateStr, timeStr };
    }

    // 3. Initialize and inject the buttons into the bottom of the Tallyman window
    function initTallymanBottomIO() {
        const tmPanel = document.getElementById("tmPanel");
        if (!tmPanel || document.getElementById("tmBottomControlsRow")) return;

        // Create control row container placed at the bottom of the panel
        const bottomControlsRow = document.createElement("div");
        bottomControlsRow.id = "tmBottomControlsRow";

        // Download Button
        const downloadBtn = document.createElement("button");
        downloadBtn.id = "tmDownloadBtn";
        downloadBtn.className = "tm-action-btn";
        downloadBtn.textContent = "Download";
        downloadBtn.title = "Download Team Scores";

        // Hidden File Input for Uploading
        const fileInput = document.createElement("input");
        fileInput.type = "file";
        fileInput.id = "tmFileInput";
        fileInput.accept = ".txt";
        fileInput.style.display = "none";

        // Upload / Update Button
        const uploadBtn = document.createElement("button");
        uploadBtn.id = "tmUploadBtn";
        uploadBtn.className = "tm-action-btn";
        uploadBtn.textContent = "Upload";
        uploadBtn.title = "Upload Team Scores to Continue Competition";

        bottomControlsRow.appendChild(downloadBtn);
        bottomControlsRow.appendChild(uploadBtn);
        bottomControlsRow.appendChild(fileInput);

        // Append to the bottom of tmPanel
        tmPanel.appendChild(bottomControlsRow);

        // --- DOWNLOAD LOGIC ---
        downloadBtn.addEventListener("click", (e) => {
            e.stopPropagation();

            let activeClass = "11.1";
            const classSelect = document.querySelector(".classSelect");
            if (classSelect && classSelect.value && classSelect.value !== "Class") {
                activeClass = classSelect.value;
            }

            const { dateStr, timeStr } = getTimestampString();
            const filename = `Team_Scores_${activeClass}_${dateStr}_${timeStr}.txt`;

            // Read scores live directly from the Tallyman DOM elements
            let fileContent = "";
            const blueEl = document.getElementById("tmScoreBlue");
            const greenEl = document.getElementById("tmScoreGreen");
            const orangeEl = document.getElementById("tmScoreOrange");
            const redEl = document.getElementById("tmScoreRed");

            if (blueEl && greenEl && orangeEl && redEl) {
                fileContent = `Blue:${blueEl.textContent.trim()}\nGreen:${greenEl.textContent.trim()}\nOrange:${orangeEl.textContent.trim()}\nRed:${redEl.textContent.trim()}`;
            } else if (typeof Tallyman !== "undefined" && Tallyman.scores) {
                fileContent = Object.entries(Tallyman.scores)
                    .map(([team, score]) => `${team}:${score}`)
                    .join("\n");
            } else {
                fileContent = "Blue:0\nGreen:0\nOrange:0\nRed:0";
            }

            const blob = new Blob([fileContent], { type: "text/plain;charset=utf-8" });
            const a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(a.href);
        });

        // --- UPLOAD LOGIC ---
        uploadBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            fileInput.value = ""; 
            fileInput.click();
        });

        fileInput.addEventListener("change", (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (event) => {
                const text = event.target.result.trim();
                const lines = text.split(/\r?\n/);

                if (typeof tmResetScores === "function") {
                    tmResetScores();
                }

                lines.forEach(line => {
                    const parts = line.split(":");
                    if (parts.length === 2) {
                        const team = parts[0].trim();
                        const targetScore = parseInt(parts[1].trim(), 10) || 0;

                        for (let i = 0; i < targetScore; i++) {
                            if (typeof tmAddTally === "function") {
                                tmAddTally(team);
                            }
                        }
                    }
                });
            };
            reader.readAsText(file);
        });
    }

    if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", initTallymanBottomIO);
    } else {
        initTallymanBottomIO();
    }

    const observer = new MutationObserver(initTallymanBottomIO);
    observer.observe(document.body, { childList: true, subtree: true });
})();
</script>
