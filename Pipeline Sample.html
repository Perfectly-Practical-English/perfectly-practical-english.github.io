on, at, in, before, after, since, until, during, for, now, yesterday, today, tomorrow, later, then, when, while, once

- Addition ➕ – words that add ideas together
and, also, too, with, plus, as well as, not only...but also, both...and

- Cause / Effect 🔗 – words that show a reason or result
because, so, since, because of, due to, as a result, therefore, that’s why

- Comparison / Similarity / Difference ⚖️ – words that compare things
like, as, as...as, than, similar to, different from, more than, less than, the most, just as...so, whereas, in contrast to

- Contrast / Opposition 🎭 – words that show differences
but, although, though, even though, however, yet, still, despite, instead, whereas, while, on the other hand

- Frequency 〰️ – words that tell how often something happens
always, usually, often, sometimes, occasionally, rarely, never, every day, once a week, hardly ever, from time to time

- Possibility / Certainty 🎲 – words that show how possible or sure something is
maybe, probably, possibly, must, might, may, could, can, definitely, certainly

- Advice / Obligation / Permission ☝️ – words that tell rules or give guidance
must, must not, have to, don’t have to, should, ought to, had better, can, cannot, may, could

- Manner 🎭 – words that tell how something is done
quickly, slowly, carefully, easily, well, badly, with, by, in a...way, as

- Place / Location 📍 – words that tell where something is
in, on, at, under, above, between, near, next to, here, there, everywhere, anywhere

- Condition 🌧️ – words that show something depends on something else
if, unless, in case, on condition that

- Emphasis / Focus 🎯 – words that make something stronger or more important
only, just, even, especially, mainly, particularly

- Questions (Interrogatives) ❓ – words used to ask questions
how, when, where, why

- Relative Words 👨‍👩‍👧‍👦 – words that connect ideas about time, place, reason, or manner
when, where, why, how

- Direction / Movement 🧭 – words that show movement or direction
to, from, toward, away from, up, down, forward, back

- Affirmative and Negative ✔️❌ – words that show yes or no
yes, no
`.trim();

    const SCRAMBLE_SECTIONS = RAW_FACTS_TEXT.split(/(?=\n~)/).map(section => {

            updateFactDisplay();
            dropdownEl.style.display = "none";
        });
        dropdownEl.appendChild(item);
    });

    updateFactDisplay();

    // 3. Safe Containment Helper
    const killEverything = (e) => {
        e.stopImmediatePropagation();
        e.stopPropagation();
    };

    const blockerEvents = ["mousedown", "mouseup", "pointerdown", "pointerup", "touchstart", "touchend", "click"];
    blockerEvents.forEach(eventType => {
        modalWin.addEventListener(eventType, (e) => {
            if (
                e.target.closest('#tallySevenElevenCloseBtn') ||
                e.target.closest('#tallySevenElevenHeaderBtn') ||
                e.target.closest('.tally-seven-eleven-nav-btn') ||

            if (dropdownEl.style.display === "block") {

            killEverything(e);

    function alignAndOverlaySevenEleven() {
        // Use the exact same layout calculation used by the spinner/Tallyman stack, 
        // offset to sit directly above the jokes modal stack:
        const spinnerLeft = 872.5;
        const spinnerWidth = 370;
        const spinnerBottom = 315;
        const modalWidth = 235;

        // Exact horizontal center matching the stack
        const centeredLeft = spinnerLeft + (spinnerWidth - modalWidth) / 2 + 5;
        
        // Positioned vertically right above the main component stack
        const stackTop = (spinnerBottom + 10) - 275 -10; 

        modalWin.style.setProperty("left", centeredLeft + "px", "important");
        modalWin.style.setProperty("top", stackTop + "px", "important");
        modalWin.style.setProperty("right", "auto", "important");
        modalWin.style.setProperty("bottom", "auto", "important");
        modalWin.style.setProperty("display", "block", "important");
        modalWin.style.setProperty("z-index", "2147483647", "important");
    }    // 6. Isolated Drag Support
    function initModalDrag(target, handle) {
        let dragging = false;
        let ox = 0, oy = 0;

        handle.addEventListener("mousedown", function(e) {
            killEverything(e);
            dropdownEl.style.display = "none";
            dragging = true;
            ox = e.clientX - target.offsetLeft;
            oy = e.clientY - target.offsetTop;
        }, { capture: true, passive: false });

        handle.addEventListener("touchstart", function(e) {
            if (e.touches.length === 1) {
                killEverything(e);
                dropdownEl.style.display = "none";
                dragging = true;
                ox = e.touches[0].clientX - target.offsetLeft;
                oy = e.touches[0].clientY - target.offsetTop;
            }
        }, { capture: true, passive: false });

        document.addEventListener("mousemove", function(e) {
            if (!dragging) return;
            killEverything(e);
            target.style.left = (e.clientX - ox) + "px";
            target.style.top = (e.clientY - oy) + "px";
        }, { capture: true, passive: false });

        document.addEventListener("touchmove", function(e) {
            if (!dragging || e.touches.length !== 1) return;
            killEverything(e);
            target.style.left = (e.touches[0].clientX - ox) + "px";
            target.style.top = (e.touches[0].clientY - oy) + "px";
        }, { capture: true, passive: false });

        document.addEventListener("mouseup", function(e) {
            if (dragging) {
                killEverything(e);
                dragging = false;
            }
        }, { capture: true, passive: false });

        document.addEventListener("touchend", function(e) {
            if (dragging) {
                killEverything(e);
                dragging = false;
            }
        }, { capture: true, passive: false });
    }
    initModalDrag(modalWin, document.getElementById("tallySevenElevenDragHandle"));

            } else {

            const btnRight = document.createElement("button");
            btnRight.id = "sevenElevenRightBtn";
            btnRight.className = "seven-eleven-control-btn";
            btnRight.textContent = "7-11";
            btnRight.addEventListener("click", toggleSevenElevenModal, { capture: true });

            const jokeRightBtn = document.getElementById("jokeRightBtn");
            if (jokeRightBtn) {
                rightColumn.insertBefore(btnRight, jokeRightBtn);
            } else {
                rightColumn.appendChild(btnRight);
            }
        }
    }

if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", () => {
            injectSevenElevenButtons();
            setTimeout(() => {
                injectSevenElevenButtons();
                alignAndOverlaySevenEleven();
            }, 100);
        });
    } else {
        injectSevenElevenButtons();
        setTimeout(() => {
            injectSevenElevenButtons();
            alignAndOverlaySevenEleven();
        }, 100);
    }


})();

    function initModalDrag(target, handle) {

        let dragging = false;
        let ox = 0, oy = 0;

        handle.addEventListener("mousedown", function(e) {

            killEverything(e);

            dragging = true;
            ox = e.clientX - target.offsetLeft;
            oy = e.clientY - target.offsetTop;

        }, { capture: true, passive: false });

        handle.addEventListener("touchstart", function(e) {

            if (e.touches.length === 1) {

                killEverything(e);

                dragging = true;
                ox = e.touches[0].clientX - target.offsetLeft;
                oy = e.touches[0].clientY - target.offsetTop;
            }

        }, { capture: true, passive: false });

        document.addEventListener("mousemove", function(e) {

            if (!dragging) return;

            killEverything(e);

            target.style.left = (e.clientX - ox) + "px";
            target.style.top = (e.clientY - oy) + "px";

        }, { capture: true, passive: false });

        document.addEventListener("touchmove", function(e) {

            if (!dragging || e.touches.length !== 1) return;

            killEverything(e);

            target.style.left = (e.touches[0].clientX - ox) + "px";
            target.style.top = (e.touches[0].clientY - oy) + "px";

        }, { capture: true, passive: false });

        document.addEventListener("mouseup", function(e) {

            if (dragging) {
                killEverything(e);
                dragging = false;
            }

        }, { capture: true, passive: false });

        document.addEventListener("touchend", function(e) {

            if (dragging) {
                killEverything(e);
                dragging = false;
            }

        }, { capture: true, passive: false });

            btnLeft.className = "joke-control-btn";
            btnLeft.textContent = "Jokes";
            btnLeft.onclick = toggleJokeModal;

            leftColumn.appendChild(btnLeft);

        if (rightColumn && !document.getElementById("jokeRightBtn")) {

            const btnRight = document.createElement("button");

            btnRight.id = "jokeRightBtn";
            btnRight.className = "joke-control-btn";
            btnRight.textContent = "Jokes";
            btnRight.onclick = toggleJokeModal;

            rightColumn.appendChild(btnRight);
        }
    }

    if (document.readyState === "loading") {

        document.addEventListener("DOMContentLoaded", injectJokeButtons);

    } else {

        injectJokeButtons();
    }

})();

            font-family: Arial, sans-serif;
            border: none;
            border-bottom: 1px solid #999;
            background: #d97706;
            color: #fff;
            cursor: pointer;
            text-align: center;
            padding: 0;
        }
        .parchmentFactsLaunch:hover {
            background: #fdfdfd !important;
            color: #111 !important;
        }
    `;
    document.head.appendChild(parchmentStyle);

    const parchmentWindow = document.createElement("div");
    parchmentWindow.id = "parchmentFactsWindow";
    parchmentWindow.innerHTML = `
        <div id="parchmentFactsPanel">
            <div id="parchmentFactsDrag"></div>
            <div class="parchmentFactsTop">
                <button id="parchmentFactsHeader" type="button">Select a section</button>
                <button id="parchmentFactsClose" type="button" title="Close">✕</button>
            </div>
            <div id="parchmentFactsDropdown"></div>
            <div id="parchmentFactsContent">
                <div id="parchmentFactsDisplay"></div>
                <div id="parchmentFactsControls">
                    <button class="parchmentFactsNav" id="parchmentFactsPrev" type="button">◀</button>
                    <button class="parchmentFactsNav" id="parchmentFactsNext" type="button">▶</button>
                </div>
            </div>
        </div>
    `;
    document.body.appendChild(parchmentWindow);

    const parchmentDropdown = parchmentWindow.querySelector("#parchmentFactsDropdown");
    const parchmentDisplay = parchmentWindow.querySelector("#parchmentFactsDisplay");
    const parchmentHeader = parchmentWindow.querySelector("#parchmentFactsHeader");

    function parchmentStop(e) {
        e.stopImmediatePropagation();
        e.stopPropagation();
    }

    function parchmentUpdate() {
        if (parchmentCurrentIndex < 0) {
            parchmentDisplay.textContent = "";
            parchmentHeader.textContent = "Select a section";
            parchmentHeader.title = "Select a section";
            return;
        }

        const currentSection = PARCHMENT_SECTIONS[parchmentCurrentIndex];
        let cleanName = (currentSection.name || "").replace(/^~/, '').trim();
        let cleanText = (currentSection.text || "").replace(/^~/, '').trim();

        parchmentDisplay.textContent = cleanText;
        parchmentHeader.textContent = cleanName;
        parchmentHeader.title = cleanName;
    }

    PARCHMENT_SECTIONS.forEach((section, index) => {
        const item = document.createElement("div");
        item.className = "parchmentFactsItem";
        let cleanDropdownName = (section.name || "").replace(/^~/, '').trim();
        item.textContent = cleanDropdownName;
        item.addEventListener("click", function(e) {
            parchmentStop(e);
            parchmentCurrentIndex = index;
            parchmentUpdate();
            parchmentDropdown.style.display = "none";
        }, true);
        parchmentDropdown.appendChild(item);
    });

    const parchmentProtectedEvents = [
        "mousedown", "mouseup", "pointerdown", "pointerup",
        "touchstart", "touchend", "click"
    ];

    parchmentProtectedEvents.forEach(type => {
        parchmentWindow.addEventListener(type, function(e) {
            if (
                e.target.closest("#parchmentFactsClose") ||
                e.target.closest("#parchmentFactsHeader") ||
                e.target.closest(".parchmentFactsNav") ||
                e.target.closest("#parchmentFactsDrag") ||
                e.target.closest("#parchmentFactsDropdown")
            ) {
                return;
            }

            if (parchmentDropdown.style.display === "block") {
                parchmentDropdown.style.display = "none";
            }
            parchmentStop(e);
        }, { capture: true, passive: false });
    });

    parchmentHeader.addEventListener("click", function(e) {
        parchmentStop(e);
        parchmentDropdown.style.display =
            parchmentDropdown.style.display === "block" ? "none" : "block";
    }, true);

    parchmentWindow.querySelector("#parchmentFactsPrev").addEventListener("click", function(e) {
        parchmentStop(e);
        parchmentDropdown.style.display = "none";
        parchmentCurrentIndex = parchmentCurrentIndex < 0
            ? PARCHMENT_SECTIONS.length - 1
            : (parchmentCurrentIndex - 1 + PARCHMENT_SECTIONS.length) % PARCHMENT_SECTIONS.length;
        parchmentUpdate();
    }, true);

    parchmentWindow.querySelector("#parchmentFactsNext").addEventListener("click", function(e) {
        parchmentStop(e);
        parchmentDropdown.style.display = "none";
        parchmentCurrentIndex = parchmentCurrentIndex < 0
            ? 0
            : (parchmentCurrentIndex + 1) % PARCHMENT_SECTIONS.length;
        parchmentUpdate();
    }, true);

    function parchmentPosition() {
        parchmentWindow.style.setProperty("left", PARCHMENT_POSITION.left + "px", "important");
        parchmentWindow.style.setProperty("top", PARCHMENT_POSITION.top + "px", "important");
        parchmentWindow.style.setProperty("right", "auto", "important");
        parchmentWindow.style.setProperty("bottom", "auto", "important");
        parchmentWindow.style.setProperty("z-index", "2147483645", "important");
        parchmentWindow.style.setProperty("display", "block", "important");
    }

    // Independent drag handling
    (function() {
        const handle = parchmentWindow.querySelector("#parchmentFactsDrag");
        let dragging = false;
        let offsetX = 0;
        let offsetY = 0;

        handle.addEventListener("mousedown", function(e) {
            parchmentStop(e);
            parchmentDropdown.style.display = "none";
            dragging = true;
            offsetX = e.clientX - parchmentWindow.offsetLeft;
            offsetY = e.clientY - parchmentWindow.offsetTop;
        }, true);

        handle.addEventListener("touchstart", function(e) {
            if (e.touches.length !== 1) return;
            parchmentStop(e);
            parchmentDropdown.style.display = "none";
            dragging = true;
            offsetX = e.touches[0].clientX - parchmentWindow.offsetLeft;
            offsetY = e.touches[0].clientY - parchmentWindow.offsetTop;
        }, { capture: true, passive: false });

        document.addEventListener("mousemove", function(e) {
            if (!dragging) return;
            parchmentStop(e);
            parchmentWindow.style.left = (e.clientX - offsetX) + "px";
            parchmentWindow.style.top = (e.clientY - offsetY) + "px";
        }, true);

        document.addEventListener("touchmove", function(e) {
            if (!dragging || e.touches.length !== 1) return;
            parchmentStop(e);
            parchmentWindow.style.left = (e.touches[0].clientX - offsetX) + "px";
            parchmentWindow.style.top = (e.touches[0].clientY - offsetY) + "px";
        }, { capture: true, passive: false });

        document.addEventListener("mouseup", function(e) {
            if (!dragging) return;
            parchmentStop(e);
            dragging = false;
        }, true);

        document.addEventListener("touchend", function(e) {
            if (!dragging) return;
            parchmentStop(e);
            dragging = false;
        }, true);
    })();

    parchmentWindow.querySelector("#parchmentFactsClose").addEventListener("click", function(e) {
        parchmentStop(e);
        parchmentDropdown.style.display = "none";
        parchmentWindow.style.setProperty("display", "none", "important");
    }, true);

    function parchmentInjectButtons() {
        const left = document.getElementById("leftColumn");
        const right = document.getElementById("rightColumn");

        function toggleParchment(e) {
            parchmentStop(e);
            if (getComputedStyle(parchmentWindow).display === "none") {
                parchmentPosition();
            } else {
                parchmentDropdown.style.display = "none";
                parchmentWindow.style.setProperty("display", "none", "important");
            }
        }

        if (left && !document.getElementById("parchmentFactsLeftBtn")) {
            const btn = document.createElement("button");
            btn.id = "parchmentFactsLeftBtn";
            btn.className = "parchmentFactsLaunch";
            btn.type = "button";
            btn.textContent = "Parchment Facts";
            btn.addEventListener("click", toggleParchment, true);
            const anchor = document.getElementById("jokeLeftBtn");
            if (anchor) left.insertBefore(btn, anchor);
            else left.appendChild(btn);
        }

        if (right && !document.getElementById("parchmentFactsRightBtn")) {
            const btn = document.createElement("button");
            btn.id = "parchmentFactsRightBtn";
            btn.className = "parchmentFactsLaunch";
            btn.type = "button";
            btn.textContent = "Parchment Facts";
            btn.addEventListener("click", toggleParchment, true);
            const anchor = document.getElementById("jokeRightBtn");
            if (anchor) right.insertBefore(btn, anchor);
            else right.appendChild(btn);
        }
    }

    function parchmentStartOnLoad() {
        parchmentInjectButtons();
        parchmentPosition();
    }

    if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", parchmentStartOnLoad);
    } else {
        parchmentStartOnLoad();
    }

    setTimeout(parchmentStartOnLoad, 250);

// --- UNIVERSAL SPINNER BLOCKER (WITH DROPDOWN FIX) ---
    const modalWin = parchmentWindow;
    
    const killEverything = (e) => {
        e.stopImmediatePropagation();
        e.stopPropagation();
    };

    const blockerEvents = ["mousedown", "mouseup", "pointerdown", "pointerup", "touchstart", "touchend", "click"];
    blockerEvents.forEach(eventType => {
        modalWin.addEventListener(eventType, (e) => {
            if (
                e.target.closest('#parchmentFactsClose') ||
                e.target.closest('#parchmentFactsHeader') ||
                e.target.closest('.parchmentFactsNav') ||
                e.target.closest('#parchmentFactsDrag') ||
                e.target.closest('#parchmentFactsDropdown') ||
                e.target.closest('.parchmentFactsItem') ||
                e.target.closest('button') ||
                e.target.closest('input')
            ) {
                return; // Let dropdown items, headers, and buttons work normally
            }
            killEverything(e);
        }, { capture: true, passive: false });
    });

})();
</script>


<script>
/* ==========================================
   STANDALONE SPINNER AUDIO CLOSING FIX
========================================== */
(function() {
    "use strict";

    document.addEventListener("DOMContentLoaded", () => {
        const spinnerButtons = document.querySelectorAll("#spinnerBtn, #spinnerBtnRight, .spinnerButton");

        spinnerButtons.forEach(btn => {
            btn.addEventListener("click", (e) => {
                const overlay = document.getElementById("studentWheelOverlay");
                // If the wheel is currently open, clicking this button means we are closing it.
                // Force stop the sound immediately and suppress any triggers.
                if (overlay && window.getComputedStyle(overlay).display === "flex") {
                    if (typeof window.stopSpinnerSound === "function") {
                        window.stopSpinnerSound();
                    }
                }
            }, true); // Use capture phase to intercept before toggle state changes
        });
    });
})();
</script>
