<script>
(function() {
  let modalOpen = false;

  const modalContainer = document.getElementById("jellyBeanModalContainer");
  const jarWrapper = document.getElementById("jbJarWrapper");
  const jarContainer = document.getElementById("jbJarContainer");
  const beanCanvas = document.getElementById("jbBeanCanvas");
  const ctx = beanCanvas.getContext("2d");

  const scoreDisplay = document.getElementById("jbScoreDisplay");
  const mouthHotspot = document.getElementById("jbMouthHotspot");
  const jarLid = document.getElementById("jbJarLid");
  const lidHitbox = document.getElementById("jbLidHitbox");

  const saveButton = document.getElementById("jbSaveButton");
  const browseButton = document.getElementById("jbBrowseButton");
  const fileInput = document.getElementById("jbFileInput");
  const classSelect = document.getElementById("jbClassSelect");

  const MAX_BEANS = 50;
  const BEAN_RADIUS = 20.9;

  const jarBounds = { left: 135, right: 385, top: 175, bottom: 645 };

  beanCanvas.width = 520;
  beanCanvas.height = 760;

  let beans = [];
  let score = 0;

  const BEAN_COLORS = [
    { fill: "#E74C3C" },
    { fill: "#F1C40F" },
    { fill: "#E84393" },
    { fill: "#2ECC71" },
    { fill: "#9B59B6" },
    { fill: "#E67E22" },
    { fill: "#3498DB" }
  ];

  function randomBeanColor() {
    return BEAN_COLORS[Math.floor(Math.random() * BEAN_COLORS.length)];
  }

  function updateScore() {
    scoreDisplay.textContent = score;
  }

  function toggleModal() {
    modalOpen = !modalOpen;
    modalContainer.style.display = modalOpen ? "block" : "none";
  }

  function getTargetPosition(index) {
    const maxCols = 6;
    const col = index % maxCols;
    const row = Math.floor(index / maxCols);

    const availableWidth = (jarBounds.right - 10) - (jarBounds.left + 10) - (BEAN_RADIUS * 2);
    const colSpacing = availableWidth / (maxCols - 1);

    const baseTargetX = (jarBounds.left + 10) + BEAN_RADIUS + (col * colSpacing);
    const baseFloor = (jarBounds.bottom - 5) + 15;
    const baseTargetY = baseFloor - BEAN_RADIUS - (row * (BEAN_RADIUS * 1.3));

    const jarCenterX = (jarBounds.left + jarBounds.right) / 2;
    const distanceFromCenter = Math.abs(baseTargetX - jarCenterX);
    const maxDistanceFromCenter = (jarBounds.right - jarBounds.left) / 2;
    const edgeCurveFactor = Math.min(1, distanceFromCenter / maxDistanceFromCenter);
    const edgeLift = (row === 0) ? (edgeCurveFactor * 8) : 0;

    const jitterX = Math.sin(index * 12.9898) * 12;
    const jitterY = Math.cos(index * 78.233) * 6;

    return { 
      targetX: baseTargetX + jitterX, 
      targetY: (baseTargetY - edgeLift) + jitterY 
    };
  }

  function createBean() {
    if (score >= MAX_BEANS) return;

    const { targetX, targetY } = getTargetPosition(beans.length);
    const angleJitter = (Math.sin(beans.length * 43.11) * 0.6) + ((Math.random() - 0.5) * 0.4);

    const bean = {
      x: targetX,
      y: targetY,
      targetX: targetX,
      targetY: targetY,
      angle: angleJitter,
      color: randomBeanColor(),
      alpha: 1,
      removing: false
    };

    beans.push(bean);
    score++;
    updateScore();
  }

  function removeBean() {
    if (score <= 0) return;

    let selectedBean = null;
    for (let i = beans.length - 1; i >= 0; i--) {
      if (!beans[i].removing) {
        selectedBean = beans[i];
        break;
      }
    }

    if (!selectedBean) return;

    selectedBean.removing = true;
    selectedBean.alpha = 1;

    score--;
    updateScore();

    let activeIdx = 0;
    for (const bean of beans) {
      if (!bean.removing) {
        const { targetX, targetY } = getTargetPosition(activeIdx);
        bean.targetX = targetX;
        bean.targetY = targetY;
        bean.x = targetX;
        bean.y = targetY;
        activeIdx++;
      }
    }
  }

  function updateBeans() {
    beans = beans.filter(b => !b.removing);
  }

  function drawBeans() {
    ctx.clearRect(0, 0, beanCanvas.width, beanCanvas.height);

    for (const bean of beans) {
      ctx.save();
      ctx.globalAlpha = Math.max(0, bean.alpha);
      ctx.translate(bean.x, bean.y);
      ctx.rotate(bean.angle);

      ctx.beginPath();
      ctx.moveTo(-19, -6);
      ctx.bezierCurveTo(-24, -22, 19, -25, 24, -6);
      ctx.bezierCurveTo(28, 11, -4, 25, -19, 15);
      ctx.bezierCurveTo(-26, 9, -24, 0, -19, -6);
      ctx.closePath();

      ctx.fillStyle = bean.color.fill;
      ctx.fill();

      ctx.strokeStyle = "rgba(0, 0, 0, 0.12)";
      ctx.lineWidth = 1.5;
      ctx.stroke();

      ctx.beginPath();
      ctx.ellipse(-5, -9, 9, 3.5, Math.PI / 4, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(255, 255, 255, 0.65)";
      ctx.fill();

      ctx.restore();
    }
  }

  let lidDragging = false;
  let lidOffsetX = 0;
  let lidOffsetY = 0;
  let currentLidX = 0;
  let currentLidY = 27.5;
  let targetLidX = 0;
  let targetLidY = 27.5;

  lidHitbox.addEventListener("pointerdown", (event) => {
    event.stopPropagation();
    lidDragging = true;
    lidHitbox.setPointerCapture(event.pointerId);

    const containerRect = jarContainer.getBoundingClientRect();
    const lidRect = jarLid.getBoundingClientRect();
    
    lidOffsetX = event.clientX - lidRect.left;
    lidOffsetY = event.clientY - lidRect.top;
    
    targetLidX = lidRect.left - containerRect.left;
    targetLidY = lidRect.top - containerRect.top;
  });

  lidHitbox.addEventListener("pointermove", (event) => {
    if (!lidDragging) return;
    event.stopPropagation();
    const containerRect = jarContainer.getBoundingClientRect();
    targetLidX = event.clientX - containerRect.left - lidOffsetX;
    targetLidY = event.clientY - containerRect.top - lidOffsetY;
  });

  const stopLidDrag = (event) => {
    if (lidDragging) {
      lidDragging = false;
      try { lidHitbox.releasePointerCapture(event.pointerId); } catch (e) {}
    }
  };
  lidHitbox.addEventListener("pointerup", stopLidDrag);
  lidHitbox.addEventListener("pointercancel", stopLidDrag);

  function animate() {
    if (modalOpen) {
      currentLidX += (targetLidX - currentLidX) * 0.25;
      currentLidY += (targetLidY - currentLidY) * 0.25;

      jarLid.style.left = currentLidX + "px";
      jarLid.style.top = currentLidY + "px";
      jarLid.style.margin = "0";

      lidHitbox.style.left = currentLidX + "px";
      lidHitbox.style.top = currentLidY + "px";
      lidHitbox.style.margin = "0";

      updateBeans();
      drawBeans();
    }
    requestAnimationFrame(animate);
  }

  function getDateString() {
    const today = new Date();
    const year = today.getFullYear();
    const month = String(today.getMonth() + 1).padStart(2, "0");
    const day = String(today.getDate()).padStart(2, "0");
    return `${year}-${month}-${day}`;
  }

  saveButton.addEventListener("pointerdown", async (e) => {
    e.stopPropagation();
    const selectedClass = classSelect.value;
    const filename = `${selectedClass}_${getDateString()}.txt`;
    const content = score.toString();

    try {
      const folderHandle = await window.showDirectoryPicker({ mode: "readwrite" });
      const fileHandle = await folderHandle.getFileHandle(filename, { create: true });
      const writable = await fileHandle.createWritable();
      await writable.write(content);
      await writable.close();
      alert(`Saved: ${filename}`);
    } catch (error) {
      if (error.name !== "AbortError") {
        console.error("Save failed:", error);
        alert("Could not save the file.");
      }
    }
  });

  browseButton.addEventListener("pointerdown", (e) => {
    e.stopPropagation();
    fileInput.click();
  });

  fileInput.addEventListener("change", (event) => {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = (e) => {
      const loadedScore = parseInt(e.target.result.trim());
      if (isNaN(loadedScore) || loadedScore < 0) {
        alert("Invalid score file.");
        return;
      }
      beans = [];
      score = 0;
      updateScore();
      const amountToLoad = Math.min(loadedScore, MAX_BEANS);
      for (let i = 0; i < amountToLoad; i++) {
        createBean();
      }
    };
    reader.readAsText(file);
  });

  function makeModalDraggable(el) {
    el.onpointerdown = (e) => {
      if (e.target.closest('#jbControls') || e.target.closest('#jbLidHitbox') || e.target.closest('#jbJarLid') || e.target.closest('#jbScoreDisplay') || e.target.closest('#jbMouthHotspot')) {
        return;
      }

      const rect = el.getBoundingClientRect();
      if (el.style.transform.includes("translate")) {
        el.style.transform = "none";
        el.style.left = rect.left + "px";
        el.style.top = rect.top + "px";
      }

      const startX = e.clientX;
      const startY = e.clientY;
      const initialLeft = el.offsetLeft;
      const initialTop = el.offsetTop;

      document.onpointermove = (ev) => {
        const deltaX = ev.clientX - startX;
        const deltaY = ev.clientY - startY;
        el.style.left = (initialLeft + deltaX) + "px";
        el.style.top = (initialTop + deltaY) + "px";
      };

      document.onpointerup = () => {
        document.onpointermove = null;
        document.onpointerup = null;
      };
    };
  }

  document.addEventListener("DOMContentLoaded", () => {
    let leftBtn = document.getElementById("leftBtn");
    let rightBtn = document.getElementById("rightBtn");

    if (leftBtn) leftBtn.textContent = "Jelly Beans";
    if (rightBtn) rightBtn.textContent = "Jelly Beans";

    if (leftBtn) leftBtn.onclick = (e) => { e.stopPropagation(); toggleModal(); };
    if (rightBtn) rightBtn.onclick = (e) => { e.stopPropagation(); toggleModal(); };

    mouthHotspot.addEventListener("pointerdown", (e) => {
      e.stopPropagation();
      createBean();
    });

    scoreDisplay.addEventListener("pointerdown", (e) => {
      e.stopPropagation();
      removeBean();
    });

    makeModalDraggable(jarWrapper);
    updateScore();
    animate();
  });
})();
</script>

<!-- ==========================================================
     STANDALONE NEUTRAL GREY FALLING BEAN SYSTEM
========================================================== -->
<script>
(function() {
  window.addEventListener("DOMContentLoaded", () => {
    const jarContainer = document.getElementById("jbJarContainer");
    const beanCanvas = document.getElementById("jbBeanCanvas");
    const scoreDisplay = document.getElementById("jbScoreDisplay");
    
    if (!jarContainer || !beanCanvas || !scoreDisplay) return;

    const blurCanvas = document.createElement("canvas");
    blurCanvas.id = "jbBlurCanvas";
    blurCanvas.width = 520;
    blurCanvas.height = 760;
    blurCanvas.style.cssText = "position:absolute; inset:0; width:100%; height:100%; pointer-events:none; z-index:4;";
    
    beanCanvas.style.zIndex = "3";
    jarContainer.appendChild(blurCanvas);
    const blurCtx = blurCanvas.getContext("2d");

    let impressionisticTrails = [];
    let lastKnownScore = parseInt(scoreDisplay.textContent) || 0;

    const jarBounds = { left: 135, right: 385, top: 175, bottom: 645 };
    const BEAN_RADIUS = 20.9;
    const maxCols = 6;
    const NEUTRAL_GREY = "#95A5A6";

    function getBeanCoordinates(scoreIndex) {
      const targetIndex = Math.max(0, scoreIndex);
      const col = targetIndex % maxCols;
      const row = Math.floor(targetIndex / maxCols);

      const availableWidth = (jarBounds.right - 10) - (jarBounds.left + 10) - (BEAN_RADIUS * 2);
      const colSpacing = availableWidth / (maxCols - 1);
      const baseTargetX = (jarBounds.left + 10) + BEAN_RADIUS + (col * colSpacing);
      const baseFloor = (jarBounds.bottom - 5) + 15;
      const baseTargetY = baseFloor - BEAN_RADIUS - (row * (BEAN_RADIUS * 1.3));

      const jarCenterX = (jarBounds.left + jarBounds.right) / 2;
      const edgeCurveFactor = Math.min(1, Math.abs(baseTargetX - jarCenterX) / ((jarBounds.right - jarBounds.left) / 2));
      const edgeLift = (row === 0) ? (edgeCurveFactor * 8) : 0;

      return {
        x: baseTargetX + (Math.sin(targetIndex * 12.9898) * 12),
        y: (baseTargetY - edgeLift) + (Math.cos(targetIndex * 78.233) * 6)
      };
    }

    const observer = new MutationObserver(() => {
      const currentScore = parseInt(scoreDisplay.textContent) || 0;
      if (currentScore === lastKnownScore) return;

      const centerX = (jarBounds.left + jarBounds.right) / 2;
      const startY = jarBounds.top - 15;
      
      const targetScoreIndex = currentScore > lastKnownScore ? currentScore - 1 : currentScore;
      const targetCoord = getBeanCoordinates(targetScoreIndex);
      const endY = targetCoord.y;

      if (currentScore > lastKnownScore) {
        impressionisticTrails.push({
          x: centerX,
          y: startY,
          targetY: endY,
          color: NEUTRAL_GREY,
          alpha: 0.35,
          life: 1.0,
          decay: 0.015
        });
      } else if (currentScore < lastKnownScore) {
        impressionisticTrails.push({
          x: centerX,
          y: endY,
          targetY: startY,
          color: NEUTRAL_GREY,
          alpha: 0.35,
          life: 1.0,
          decay: 0.015
        });
      }

      lastKnownScore = currentScore;
    });

    observer.observe(scoreDisplay, { childList: true, characterData: true, subtree: true });

    function renderBlurTrails() {
      blurCtx.clearRect(0, 0, blurCanvas.width, blurCanvas.height);

      for (let i = impressionisticTrails.length - 1; i >= 0; i--) {
        let trail = impressionisticTrails[i];
        trail.y += (trail.targetY - trail.y) * 0.12;
        trail.life -= trail.decay;

        if (trail.life <= 0 || Math.abs(trail.targetY - trail.y) < 1) {
          impressionisticTrails.splice(i, 1);
          continue;
        }

        blurCtx.save();
        blurCtx.globalAlpha = trail.alpha * trail.life;
        blurCtx.shadowColor = trail.color;
        blurCtx.shadowBlur = 35;
        blurCtx.translate(trail.x, trail.y);

        blurCtx.beginPath();
        blurCtx.moveTo(-19, -6);
        blurCtx.bezierCurveTo(-24, -22, 19, -25, 24, -6);
        blurCtx.bezierCurveTo(28, 11, -4, 25, -19, 15);










        blurCtx.bezierCurveTo(-26, 9, -24, 0, -19, -6);
        blurCtx.closePath();

        blurCtx.fillStyle = trail.color;
        blurCtx.fill();

        blurCtx.restore();
      }

      requestAnimationFrame(renderBlurTrails);
    }

    renderBlurTrails();
  });
})();
</script>

<script>
/* ==========================================================
   STANDALONE SCRIPT: AUTO-SYNC JELLY BEAN JAR TO ACTIVE CLASS
   Syncs #jbClassSelect whenever the jar opens or main class changes.
========================================================== */
(function() {
    "use strict";

    document.addEventListener("DOMContentLoaded", () => {
        const modalContainer = document.getElementById("jellyBeanModalContainer");
        const jbClassSelect = document.getElementById("jbClassSelect");

        if (!modalContainer || !jbClassSelect) return;

        // Function to perform the sync
        function syncClass() {
            const activeClassSelect = document.querySelector(".classSelect");
            if (activeClassSelect && activeClassSelect.value && activeClassSelect.value !== "Class" && activeClassSelect.value !== "") {
                const matchingOption = Array.from(jbClassSelect.options).find(opt => opt.value === activeClassSelect.value);
                if (matchingOption) {
                    jbClassSelect.value = activeClassSelect.value;
                }
            }
        }

        // Sync instantly the moment the Jelly Bean modal container opens (display becomes block)
        const observer = new MutationObserver((mutations) => {
            mutations.forEach((mutation) => {
                if (mutation.attributeName === "style") {
                    if (modalContainer.style.display === "block") {
                        syncClass();
                    }
                }
            });
        });

        observer.observe(modalContainer, { attributes: true });

        // Also keep them synced if the class changes while the jar is already open
        document.addEventListener("change", (e) => {
            if (e.target && e.target.classList.contains("classSelect")) {
                syncClass();
            }
        });
    });
})();
</script>







<script>
/* ==========================================================
   QR & HS HOTSPOT CONTROLS
   TOP-LAYER VERSION
   Above 7-11 Modal and Dropdown
   235 x 235 px | Rounded | Draggable
========================================================== */

document.addEventListener("DOMContentLoaded", () => {

    const viewer = document.getElementById("viewer");
    if (!viewer) return;

    const HOTSPOT_SIZE = 235;


    /* ======================================================
       REMOVE / CLOSE HOTSPOTS
    ====================================================== */

    function closeHotspots() {

        const qrExisting = document.querySelector(".qrHotspotImg");
        const hsExisting = document.querySelector(".hsHotspotImg");

        [qrExisting, hsExisting].forEach(img => {
            if (!img) return;

            if (typeof selectedEl !== "undefined" &&
                selectedEl === img) {
                selectedEl = null;
            }

            if (img.matches(":popover-open")) {
                img.hidePopover();
            }

            img.remove();
        });
    }


    /* ======================================================
       POSITION HOTSPOT RELATIVE TO VIEWER
    ====================================================== */

    function positionHotspot(img) {

        const rect = viewer.getBoundingClientRect();

        const left = rect.right - HOTSPOT_SIZE - 10;
        const top = rect.top + 40;

        img.style.left = left + "px";
        img.style.top = top + "px";
    }


    /* ======================================================
       CREATE TOP-LAYER HOTSPOT
    ====================================================== */

    function createHotspot(src, className) {

        const img = document.createElement("img");

        img.src = src;
        img.className = `draggable overlayPng ${className}`;

        // Use the browser's top layer.
        img.setAttribute("popover", "manual");

        img.style.position = "fixed";
        img.style.width = HOTSPOT_SIZE + "px";
        img.style.height = HOTSPOT_SIZE + "px";
        img.style.objectFit = "contain";
        img.style.zIndex = "2147483647";
        img.style.setProperty("z-index", "2147483647", "important");

        img.style.borderRadius = "18px";
        img.style.overflow = "hidden";
        img.style.boxShadow = "3px 15px 30px 10px rgba(0,0,0,0.8)";

        img.style.margin = "0";
        img.style.padding = "0";
        img.style.border = "none";
        img.style.background = "transparent";

        img.style.maxWidth = "none";
        img.style.maxHeight = "none";
        img.style.touchAction = "none";
        img.style.cursor = "move";

        img.style.inset = "auto";

        // Calculate its initial position.
        positionHotspot(img);

        // Append directly to the document.
        document.body.appendChild(img);

        // Enter the browser's top layer.
        if (typeof img.showPopover === "function") {
            try {
                img.showPopover();
            } catch (err) {
                console.warn("Could not enter top layer:", err);
            }
        }

        // Keep it above ordinary page stacking contexts.
        img.style.setProperty("z-index", "2147483647", "important");

        if (typeof selectedEl !== "undefined") {
            selectedEl = img;
        }

        // Enable independent dragging.
        enableHotspotDragging(img);

        return img;
    }


    /* ======================================================
       INDEPENDENT MOUSE / TOUCH DRAGGING
    ====================================================== */

    function enableHotspotDragging(img) {

        let dragging = false;
        let offsetX = 0;
        let offsetY = 0;

        img.addEventListener("pointerdown", function(e) {

            e.stopPropagation();

            if (e.button !== undefined && e.button !== 0) return;

            dragging = true;

            const rect = img.getBoundingClientRect();

            offsetX = e.clientX - rect.left;
            offsetY = e.clientY - rect.top;

            img.style.cursor = "grabbing";

            if (typeof selectedEl !== "undefined") {
                selectedEl = img;
            }

            try {
                img.setPointerCapture(e.pointerId);
            } catch (err) {}

        });

        img.addEventListener("pointermove", function(e) {

            if (!dragging) return;

            e.stopPropagation();

            img.style.left = (e.clientX - offsetX) + "px";
            img.style.top = (e.clientY - offsetY) + "px";

        });

        function stopDragging(e) {

            if (!dragging) return;

            dragging = false;
            img.style.cursor = "move";

            if (e) e.stopPropagation();
        }

        img.addEventListener("pointerup", stopDragging);
        img.addEventListener("pointercancel", stopDragging);
        img.addEventListener("lostpointercapture", stopDragging);
    }


    /* ======================================================
       QR HOTSPOT
    ====================================================== */

    window.toggleQrHotspot = function() {

        const existing = document.querySelector(".qrHotspotImg");

        if (existing) {

            closeHotspots();
            return;
        }

        closeHotspots();

        createHotspot(
            "PerfectlyPracticalEnglish.app.png",
            "qrHotspotImg"
        );
    };


    /* ======================================================
       HS HOTSPOT
    ====================================================== */

    window.toggleHsHotspot = function() {

        const existing = document.querySelector(".hsHotspotImg");

        if (existing) {

            closeHotspots();
            return;
        }

        closeHotspots();

        createHotspot(
            "IEP32_FL3_PALME2746_0!92V2x8.png",
            "hsHotspotImg"
        );
    };


    /* ======================================================
       EXISTING LEFT / RIGHT BUTTONS
    ====================================================== */

    const hsLeftBtn = document.getElementById("hsLeftBtn");
    const hsRightBtn = document.getElementById("hsRightBtn");

    if (hsLeftBtn) {
        hsLeftBtn.onclick = window.toggleHsHotspot;
    }

    if (hsRightBtn) {
        hsRightBtn.onclick = window.toggleHsHotspot;
    }


    /* ======================================================
       CLICK OUTSIDE HOTSPOT = CLOSE
    ====================================================== */

    document.addEventListener("pointerdown", (e) => {

        if (
            e.target === viewer ||
            e.target.id === "spread" ||
            e.target.id === "centerBar" ||
            e.target.classList.contains("pageImage")
        ) {
            closeHotspots();
        }

    });

});
</script>

<script>

(function() {

    // 2. Synchronize student name and team colors to the grab handle
    function updateStudentTab() {
        const grabDot = document.getElementById('pGrabDot');
        if (!grabDot) return;

        // Get the current student directly from the wheel data.
        // Wheel.students contains { name, team, color } for each student.
        if (window.Wheel && window.Wheel.currentName) {
            const currentStudent = Array.isArray(window.Wheel.students)
                ? window.Wheel.students.find(

                )

            grabDot.textContent = window.Wheel.currentName;

            if (currentStudent && currentStudent.color) {
                grabDot.style.setProperty(
                    'background-color',
                    currentStudent.color,
                    'important'
                );
                grabDot.style.setProperty(
                    'color',
                    '#111',
                    'important'
                );
            }

            return;
        }

        const studentTile = document.querySelector(
            '.studentTile, .selected-student, [data-student], .active-student, .student-item.active'
        );

        const studentSelect = document.querySelector(
            'select.studentSelect, select[name*="student"], select.student-picker'
        );

        let name = null;
        let bgColor = "#E8D8B5";

        if (studentTile) {
            name = studentTile.textContent.trim();
            bgColor =
                studentTile.style.background ||
                studentTile.style.backgroundColor ||
                bgColor;
        } else if (studentSelect && studentSelect.selectedIndex >= 0) {
            name = studentSelect.options[studentSelect.selectedIndex].text.trim();
        }

        if (name) {
            grabDot.textContent = name;

            grabDot.style.setProperty(
                'background-color',
                bgColor,
                'important'
            );

            grabDot.style.setProperty(
                'color',
                '#111',
                'important'
            );
        }
    }

    // 3. Advance the student queue AND force the wheel display/animation state to update
function triggerNamePicker() {
        const wheelOverlay = document.getElementById("studentWheelOverlay");
        if (wheelOverlay && wheelOverlay.style.display === "flex" && typeof spinWheel === "function") {
            spinWheel();
            return;
        }

        let advanced = false;

        // A. Direct programmatic queue advancement
        if (typeof window.nextStudent === 'function') {
            window.nextStudent();
            advanced = true;
        } else if (window.Wheel && typeof window.Wheel.next === 'function') {
            window.Wheel.next();
            advanced = true;
        }

        // B. Cycle through student tiles/rows to update column highlighting
        const studentTiles = Array.from(
            document.querySelectorAll(
                '.studentTile, .student-item, [data-student-id], .picker-student'
            )
        );

        if (studentTiles.length > 0) {
            const activeIndex = studentTiles.findIndex(
                el =>
                    el.classList.contains('active') ||
                    el.classList.contains('selected')
            );

            let nextIndex =
                (activeIndex >= 0)
                    ? (activeIndex + 1) % studentTiles.length
                    : 0;
            
            studentTiles[nextIndex].click();
            advanced = true;
        }

        // C. Fallback dropdown index rotation
        if (!advanced) {
            const studentSelect = document.querySelector(
                'select.studentSelect, select[name*="student"], select.student-picker'
            );

            if (studentSelect && studentSelect.options.length > 0) {
                studentSelect.selectedIndex =
                    (studentSelect.selectedIndex + 1) %
                    studentSelect.options.length;

                studentSelect.dispatchEvent(
                    new Event('change', { bubbles: true })
                );

                advanced = true;
            }
        }

        // D. Force the wheel display / render methods to update their visual slice/pointer if available
        if (window.Wheel && typeof window.Wheel.draw === 'function') {
            window.Wheel.draw();
        } else if (window.Wheel && typeof window.Wheel.update === 'function') {
            window.Wheel.update();
        } else if (typeof window.renderWheel === 'function') {
            window.renderWheel();
        }

        setTimeout(updateStudentTab, 150);
    }

// 4. Broadly intercept clicks on up/down arrows, chevrons, and answer navigation
document.addEventListener('click', function(e) {
// EXCLUDE MODALS FROM THE GLOBAL SPINNER INTERCEPTOR
    if (e.target.closest('#pGrabDot')) return;
    if (e.target.closest('#breakModal')) return;
    if (e.target.closest('#tallyJokeModalWindow')) return;
    if (e.target.closest('#tallySevenElevenModalWindow')) return; // <-- Added this line

        const target = e.target.closest(
            'button, a, [role="button"], div, span, svg, path'
        );

        if (!target) return;

        // HARD BLOCK: Never trigger spinner or name picker from Tallyman or its I/O buttons
        if (target.closest("#tmWindow") || target.closest("#tmBottomControlsRow") || target.id === "tmDownloadBtn" || target.id === "tmUploadBtn" || target.id === "tmFileInput") {
            return;
        }

        // STRICT WHITELIST CHECK: Only allow explicit spinner buttons or the red answer down button to trigger it
        const isApprovedTrigger = 
            target.id === "spinnerBtn" || 
            target.id === "spinnerBtnRight" || 
            target.id === "studentWheelCanvas" ||
            target.classList.contains("spinnerButton") ||
            target.classList.contains("studentTile") ||
            target.id === "pNextBtn" || 
            (target.closest("#pAnswerModal") && target.id === "pNextBtn");

        if (!isApprovedTrigger) {
            // Also evaluate general arrows only if they are not part of forbidden areas
            const text = target.textContent || '';
            const idClass = (
                (target.id || '') + ' ' + 
                (target.className && typeof target.className === 'string'
                    ? target.className
                    : '') + ' ' + 
                (target.getAttribute('aria-label') || '') + ' ' + 
                (target.getAttribute('title') || '') + ' ' +
                (target.parentElement ? target.parentElement.className : '')
            ).toLowerCase();

            const isArrowAction = 
                idClass.includes('up') || 
                idClass.includes('down') || 
                idClass.includes('chevron') || 
                idClass.includes('arrow') || 
                idClass.includes('next') || 
                idClass.includes('prev') || 
                idClass.includes('inc') || 
                idClass.includes('dec') ||
                text.includes('▲') || text.includes('▼') || 
                text.includes('↑') || text.includes('↓') ||
                text.includes('∧') || text.includes('∨');

            if (!isArrowAction) return;
        }

        triggerNamePicker();
    }, true);
    // 5. Continuous background sync to keep the grab bar tab updated
    setInterval(updateStudentTab, 400);

})();
</script>

function parseRawInstructions(text){

  const lines = text.split("\n").map(l => l.trim()).filter(Boolean);

  // Prevent double-tap zoom
  let lastTouchTime = 0;
  function preventDoubleTap(e) {
    const now = Date.now();
    if (now - lastTouchTime < 300) {
      e.preventDefault();
    }
    lastTouchTime = now;

  // Block gesture events on iOS
  function preventGesture(e) {

  }

  document.addEventListener('touchstart', preventPinch, { passive: false });

})();

    const CONFETTI_COLORS = [

    ];

    function createParticles() {
        particles = [];
        const particleCount = 300;

        for (let i = 0; i < particleCount; i++) {
            particles.push({
                x: Math.random() * canvas.width,
                y: -10 - (Math.random() * (canvas.height * 0.5)),
                vx: (Math.random() - 0.5) * 6,
                vy: Math.random() * 3 + 2,
                size: Math.random() * 8 + 5,
                color: CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)],
                rotation: Math.random() * Math.PI * 2,

                fadeSpeed: 0.015 + (Math.random() * 0.02)

        }

    const fireworkAudio = new Audio(FIREWORK_SOUND_SRC);
    fireworkAudio.preload = "auto";

    const canvas = document.createElement("canvas");
    canvas.id = "fireworksCelebrationCanvas";
    canvas.style.cssText = `
        position: fixed;

    document.body.appendChild(canvas);
    const ctx = canvas.getContext("2d");

    let fireworks = [];

    let animationFrameId = null;

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    /* ==========================================
       2. FIREWORKS & SPARK ENGINE
    ========================================== */
    const FIREWORK_COLORS = [
        "#ff4757", "#2ed573", "#1e90ff", "#ffa502", 
        "#9b59b6", "#ff6b81", "#7bed9f", "#70a1ff", "#eccc68"
    ];

    class FireworkRocket {
        constructor() {
            this.x = Math.random() * (canvas.width * 0.8) + (canvas.width * 0.1);
            this.y = canvas.height;
            this.targetY = Math.random() * (canvas.height * 0.5) + (canvas.height * 0.1); // Explodes in upper half
            this.speed = Math.random() * 4 + 8;
            this.angle = -Math.PI / 2 + (Math.random() - 0.5) * 0.2;
            this.vx = Math.cos(this.angle) * this.speed;
            this.vy = Math.sin(this.angle) * this.speed;
            this.color = FIREWORK_COLORS[Math.floor(Math.random() * FIREWORK_COLORS.length)];
            this.exploded = false;
        }

        update() {
            this.x += this.vx;
            this.y += this.vy;
            this.vy += 0.15; // Gravity slowing the rocket up

            if (this.vy >= 0 || this.y <= this.targetY) {
                this.exploded = true;
                this.burst();
            }
        }

        draw() {
            ctx.save();
            ctx.fillStyle = this.color;
            ctx.beginPath();
            ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);

            ctx.restore();

        burst() {
            const sparkCount = 70; // Particles per firework burst
            for (let i = 0; i < sparkCount; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 6 + 2;
                sparks.push({
                    x: this.x,
                    y: this.y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    color: this.color,
                    size: Math.random() * 3 + 2,
                    opacity: 1,
                    decay: Math.random() * 0.015 + 0.01,
                    gravity: 0.08,
                    drag: 0.96
                });

        }

    function launchFireworks() {
        fireworks = [];
        sparks = [];
        // Launch 4 sequential firework rockets
        for (let i = 0; i < 4; i++) {
            setTimeout(() => {
                fireworks.push(new FireworkRocket());
            }, i * 250); // Staggered launches
        }
    }

    function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Flash white window overlay briefly on trigger
        if (overlayAlpha > 0) {
            ctx.fillStyle = `rgba(255, 255, 255, ${overlayAlpha})`;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            overlayAlpha -= 0.06;
        }

        // Update & Draw Rockets
        fireworks.forEach(fw => {
            if (!fw.exploded) {
                fw.update();
                fw.draw();
            }
        });
        fireworks = fireworks.filter(fw => !fw.exploded);

        // Update & Draw Sparks
        sparks.forEach(s => {
            s.vx *= s.drag;
            s.vy += s.gravity;
            s.x += s.vx;
            s.y += s.vy;
            s.opacity -= s.decay;

            ctx.save();
            ctx.globalAlpha = Math.max(0, s.opacity);
            ctx.fillStyle = s.color;
            ctx.beginPath();
            ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        });

        sparks = sparks.filter(s => s.opacity > 0);

        if (fireworks.length > 0 || sparks.length > 0 || overlayAlpha > 0) {
            animationFrameId = requestAnimationFrame(render);
        } else {
            canvas.style.display = "none";
            cancelAnimationFrame(animationFrameId);
            animationFrameId = null;
        }
    }

    function triggerFireworks() {
        fireworkAudio.currentTime = 0;
        fireworkAudio.play().catch(() => {});

        overlayAlpha = 0.2;
        canvas.style.display = "block";
        launchFireworks();

        if (animationFrameId) cancelAnimationFrame(animationFrameId);
        render();
    }

    const buttonStyle = document.createElement("style");
    buttonStyle.textContent = `

    }
    `;
    document.head.appendChild(buttonStyle);

    function injectFireworksButtons() {

        if (leftColumn && !document.getElementById("fireworksLeftBtn")) {
            const btnLeft = document.createElement("button");
            btnLeft.id = "fireworksLeftBtn";
            btnLeft.className = "fireworks-celebration-btn";
            btnLeft.textContent = "Fireworks";
            btnLeft.onclick = triggerFireworks;
            leftColumn.appendChild(btnLeft);
        }

        if (rightColumn && !document.getElementById("fireworksRightBtn")) {
            const btnRight = document.createElement("button");
            btnRight.id = "fireworksRightBtn";
            btnRight.className = "fireworks-celebration-btn";
            btnRight.textContent = "Fireworks";
            btnRight.onclick = triggerFireworks;

    }

    if (document.readyState === "loading") {

        injectFireworksButtons();

})();

<script>
/* ==========================================
   SMOOTH SHIELDS & PRECISE LAYER ORDER
   (Red Grab Dot > Answer Unit > Spinner > Tally Shields)
========================================== */
(function () {
    "use strict";

    let shields = [];
    let rafId = null;

    function getSpinnerOverlay() {
        return document.getElementById("studentWheelOverlay");
    }

    function isSpinnerOpen() {
        const overlay = getSpinnerOverlay();
        return overlay && overlay.style.display === "flex";
    }

    function manageShields() {
        const open = isSpinnerOpen();

        if (open) {
            // 1. Force Spinner Overlay underneath the Answer Unit
            const spinner = getSpinnerOverlay();
            if (spinner) {
                spinner.style.setProperty("z-index", "100000", "important");
            }

            // 2. Ensure Answer Modal sits above the spinner
            const answerModal = document.getElementById("pAnswerModal");
            if (answerModal) {
                answerModal.style.setProperty("position", "absolute", "important");
                answerModal.style.setProperty("z-index", "100001", "important");
            }

            // 3. Tally shields base z-index (under spinner and answer unit)
            const targetZ = 99999;

            if (shields.length === 0) {
                // Create shields on open
                const targets = document.querySelectorAll(".studentTile, #tmTile, #pGrabDot");

                targets.forEach(el => {
                    const rect = el.getBoundingClientRect();
                    if (rect.width === 0 || rect.height === 0) return;

                    const computed = window.getComputedStyle(el);
                    const shield = document.createElement("div");

                    shield.style.position = "fixed";
                    shield.style.left = rect.left + "px";
                    shield.style.top = rect.top + "px";
                    shield.style.width = rect.width + "px";
                    shield.style.height = rect.height + "px";
                    shield.style.pointerEvents = "none"; // Click-through
                    shield.style.display = "flex";
                    shield.style.alignItems = "center";
                    shield.style.justifyContent = "center";
                    shield.style.boxSizing = "border-box";
                    shield.style.borderRadius = computed.borderRadius;

                    // Apply specific styling and z-index per element type
                    if (el.id === "tmTile") {
                        shield.style.background = "#2563eb";
                        shield.style.border = "1px solid #ffffff";
                        shield.style.color = "#ffffff";
                        shield.style.fontFamily = "Arial, sans-serif";
                        shield.style.fontSize = "11px";
                        shield.style.fontWeight = "bold";
                        shield.textContent = "Spin";
                        shield.style.zIndex = targetZ;
                    } else if (el.classList.contains("studentTile")) {
                        shield.style.background = "#000000";
                        shield.style.border = "1px solid #ffffff";
                        shield.style.color = "#ffffff";
                        shield.style.fontFamily = "Arial, sans-serif";
                        shield.style.fontSize = "9px";
                        shield.style.fontWeight = "bold";
                        shield.textContent = "Spin";
                        shield.style.zIndex = targetZ;
                    } 

                    document.body.appendChild(shield);
                    shields.push({ element: shield, target: el });
                });
            } else {
                // Update positions smoothly every frame while open
                shields.forEach(item => {
                    const rect = item.target.getBoundingClientRect();
                    if (rect.width > 0 && rect.height > 0) {
                        item.element.style.left = rect.left + "px";
                        item.element.style.top = rect.top + "px";
                        item.element.style.width = rect.width + "px";
                        item.element.style.height = rect.height + "px";
                        
                        // Maintain respective z-indices on update
                        if (item.target.id === "pGrabDot") {
                            item.element.style.zIndex = "100002";
                        } else {
                            item.element.style.zIndex = targetZ;
                        }
                    }
                });
            }
        } else if (!open && shields.length > 0) {
            // Remove covers instantly when the spinner closes
            shields.forEach(item => item.element.remove());
            shields = [];
        }

        // Keep the loop running continuously
        rafId = requestAnimationFrame(manageShields);
    }

    // Start the smooth animation loop
    rafId = requestAnimationFrame(manageShields);

})();
</script>

            if (activeName && typeof studentData !== 'undefined') {
                const className = document.querySelector(".classSelect") ? document.querySelector(".classSelect").value : "";
                if (className && studentData[className]) {
                    const found = studentData[className].find(s => s.name === activeName);
                    if (found && found.team) team = found.team;
                }
            }
        }

        if (typeof window.tmAddTally === 'function') {
            window.tmAddTally(team);
        } else {
            const teamTallies = document.querySelector(`.tmTallies[data-team="${team}"]`);
            if (teamTallies) teamTallies.click();
        }
    }

    // Trigger Fireworks Feature and synch pop sounds per burst
    function triggerFireworksCelebration() {
        const fireworksBtn = document.getElementById('fireworksLeftBtn') || document.getElementById('fireworksRightBtn');
        if (fireworksBtn) {
            fireworksBtn.click();
        } else if (typeof window.triggerFireworks === 'function') {
            window.triggerFireworks();
        }

        for (let i = 0; i < 4; i++) {
            setTimeout(() => {
                if (typeof window.playDigitalFireworkPop === 'function') {
                    window.playDigitalFireworkPop();
                }
            }, 250 + (i * 250));
        }
    }

    // Monitor visibility and layout flipping continuously
    function monitorModalState() {
        const modal = document.getElementById('pAnswerModal');
        const checkBtn = document.getElementById('answerCheckBtn');
        
        if (!modal) return;
        setupAnswerButton();
        updateButtonPosition();

        const isVisible = window.getComputedStyle(modal).display !== 'none';
        if (checkBtn) {
            checkBtn.style.display = isVisible ? 'flex' : 'none';
        }
    }

    setInterval(monitorModalState, 100);

})();
</script>

<script>
/* ==========================================================
   STANDALONE TXT UNIT & FILENAME FLYOUT LOADER
   Uses the existing Playlist visual style.
   One-time folder permission; subsequent selection via flyouts.
========================================================== */
(function() {
    "use strict";

    const UNIT_NAMES = [
        "Unit_1", "Unit_2", "Unit_3", "Unit_4",
        "Unit_5", "Unit_6", "Unit_7", "Unit_8"
    ];

    const DB_NAME = "PPE_TxtFolderAccess";
    const STORE_NAME = "folderHandles";

    let rootHandle = null;
    let handleReady = null;

    const style = document.createElement("style");
    style.textContent = `
        .txtUnitGridFlyout {
            display: none;
            position: fixed;
            width: 180px;
            background: #333;
            border: 1px solid #555;
            z-index: 9999998;
            grid-template-columns: repeat(2, 1fr);
            gap: 1px;
            padding: 1px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.9);
        }

        .txtUnitGridFlyout.active {
            display: grid;
        }

        .txtFlyoutContainer {
            position: relative;
            width: 100%;
        }

        .txtSubFlyout {
            display: none;
            position: fixed;
            width: 210px;
            max-height: 250px;
            background: black;
            border: 1px solid #555;
            z-index: 9999999;
            overflow-y: auto;
            flex-direction: column;
            box-shadow: 0 5px 25px rgba(0,0,0,0.9);
        }

        .txtSubFlyout.active {
            display: flex;
        }
    `;
    document.head.appendChild(style);


    /* --------------------------------------------------
       SAVE AND RETRIEVE THE FOLDER PERMISSION
    -------------------------------------------------- */

    function openDatabase() {
        return new Promise((resolve, reject) => {
            const request = indexedDB.open(DB_NAME, 1);

            request.onupgradeneeded = function() {
                const db = request.result;

                if (!db.objectStoreNames.contains(STORE_NAME)) {
                    db.createObjectStore(STORE_NAME);
                }
            };

            request.onsuccess = () => resolve(request.result);
            request.onerror = () => reject(request.error);
        });
    }

    async function saveFolderHandle(handle) {
        const db = await openDatabase();

        return new Promise((resolve, reject) => {
            const transaction = db.transaction(STORE_NAME, "readwrite");
            transaction.objectStore(STORE_NAME).put(handle, "rootFolder");

            transaction.oncomplete = () => {
                db.close();
                resolve();
            };

            transaction.onerror = () => {
                db.close();
                reject(transaction.error);
            };
        });
    }

    async function retrieveFolderHandle() {
        const db = await openDatabase();

        return new Promise((resolve, reject) => {
            const transaction = db.transaction(STORE_NAME, "readonly");
            const request = transaction.objectStore(STORE_NAME).get("rootFolder");

            request.onsuccess = () => {
                const handle = request.result || null;
                db.close();
                resolve(handle);
            };

            request.onerror = () => {
                db.close();
                reject(request.error);
            };
        });
    }


    /* --------------------------------------------------
       INITIALISE SAVED FOLDER HANDLE
    -------------------------------------------------- */

    handleReady = retrieveFolderHandle()
        .then(handle => {
            rootHandle = handle;
            return handle;
        })
        .catch(error => {
            console.warn("TXT folder handle could not be retrieved:", error);
            return null;
        });


    /* --------------------------------------------------
       GET FOLDER ACCESS
    -------------------------------------------------- */

    async function getFolderAccess() {

        if (!window.showDirectoryPicker || !window.indexedDB) {
            alert(
                "TXT flyout access requires a browser supporting " +
                "the File System Access API and IndexedDB. " +
                "Please use a supported version of Chrome or Edge."
            );
            return false;
        }

        await handleReady;

        // First use: select Focus_Book_Pages once.
        if (!rootHandle) {
            try {
                rootHandle = await window.showDirectoryPicker({
                    id: "PPE_Focus_Book_Pages",
                    mode: "read"
                });

                await saveFolderHandle(rootHandle);

            } catch (error) {
                if (error.name !== "AbortError") {
                    console.error("TXT folder selection error:", error);
                    alert("The TXT folder could not be accessed.");
                }
                return false;
            }
        }

        // Check permission for the previously selected folder.
        try {
            let permission = await rootHandle.queryPermission({
                mode: "read"
            });

            if (permission !== "granted") {
                permission = await rootHandle.requestPermission({
                    mode: "read"
                });
            }

            if (permission !== "granted") {
                alert(
                    "Folder access was not granted. " +
                    "Please allow access and try again."
                );
                return false;
            }

            return true;

        } catch (error) {
            console.error("TXT folder permission error:", error);
            alert("Folder access is no longer available. Please try again.");
            return false;
        }
    }


    /* --------------------------------------------------
       CLOSE TXT FLYOUTS
    -------------------------------------------------- */

    function closeTxtFlyouts() {
        document.querySelectorAll(
            ".txtUnitGridFlyout, .txtSubFlyout"
        ).forEach(flyout => {
            flyout.classList.remove("active");
        });
    }


    /* --------------------------------------------------
       LOAD THE SELECTED TXT FILE
    -------------------------------------------------- */

    async function loadTxtFile(fileHandle) {
        try {
            const file = await fileHandle.getFile();
            const text = await file.text();

            const worksheetScript =
                document.getElementById("worksheetScript");

            if (!worksheetScript) return;

            // Disarm the automatic demo preload.
            window.hasUserLoadedFile = true;

            // Preserve filename for export tracking.
            window.lastUploadedFilename = file.name;

            // Load the selected text.
            worksheetScript.value = text;

            // Rebuild workspace tiles.
            if (typeof window.buildAllTiles === "function") {
                window.buildAllTiles();
            } else {
                worksheetScript.dispatchEvent(
                    new Event("input", { bubbles: true })
                );
            }

            // Refresh Answer Assembly.
            if (typeof window.parsePAnswers === "function") {
                window.parsePAnswers();
            }

            closeTxtFlyouts();

        } catch (error) {
            console.error("TXT file loading error:", error);
            alert("The selected TXT file could not be loaded.");
        }
    }


    /* --------------------------------------------------
       BUILD THE TWO-LEVEL UNIT / FILENAME FLYOUTS
    -------------------------------------------------- */

    function setupTxtFlyout(buttonId, columnId) {

        const button = document.getElementById(buttonId);
        if (!button) return;

        const mainFlyout = document.createElement("div");
        mainFlyout.className = "txtUnitGridFlyout";

        document.body.appendChild(mainFlyout);

        UNIT_NAMES.forEach(unitName => {

            const unitWrapper = document.createElement("div");
            unitWrapper.className = "txtFlyoutContainer";

            const unitButton = document.createElement("button");
            unitButton.className = "unitFolderBtn";
            unitButton.type = "button";
            unitButton.textContent = unitName.replace("_", " ");

            const subFlyout = document.createElement("div");
            subFlyout.className = "txtSubFlyout";

            document.body.appendChild(subFlyout);

            unitButton.onclick = async function(e) {
                e.stopPropagation();

                const wasOpen = subFlyout.classList.contains("active");

                document.querySelectorAll(".txtSubFlyout").forEach(f => {
                    f.classList.remove("active");
                });

                if (wasOpen) return;

                subFlyout.innerHTML = "";

                try {
                    const unitFolder =
                        await rootHandle.getDirectoryHandle(unitName);

                    const txtFiles = [];

                    for await (const [filename, fileHandle]
                        of unitFolder.entries()) {

                        if (
                            fileHandle.kind === "file" &&
                            filename.toLowerCase().endsWith(".txt")
                        ) {
                            txtFiles.push({
                                name: filename,
                                handle: fileHandle
                            });
                        }
                    }

                    txtFiles.sort((a, b) =>
                        a.name.localeCompare(
                            b.name,
                            undefined,
                            { numeric: true, sensitivity: "base" }
                        )
                    );

                    if (txtFiles.length === 0) {
                        const emptyItem = document.createElement("div");
                        emptyItem.className = "spreadFlyoutItem";
                        emptyItem.textContent = "No TXT files";
                        subFlyout.appendChild(emptyItem);
                    }

                    txtFiles.forEach(file => {
                        const item = document.createElement("div");
                        item.className = "spreadFlyoutItem";
                        item.textContent = file.name;

                        item.onclick = function(ev) {
                            ev.stopPropagation();
                            loadTxtFile(file.handle);
                        };

                        subFlyout.appendChild(item);
                    });

                } catch (error) {
                    console.warn("Could not read " + unitName, error);

                    const errorItem = document.createElement("div");
                    errorItem.className = "spreadFlyoutItem";
                    errorItem.textContent = "Folder unavailable";
                    subFlyout.appendChild(errorItem);
                }

                const rect = unitButton.getBoundingClientRect();

                subFlyout.style.top = rect.top + "px";

                if (columnId === "rightColumn") {
                    subFlyout.style.left = (rect.left - 210) + "px";
                } else {
                    subFlyout.style.left = rect.right + "px";
                }

                subFlyout.classList.add("active");
            };

            unitWrapper.appendChild(unitButton);
            mainFlyout.appendChild(unitWrapper);
        });


        // TXT Files button opens the Unit flyout.
        // Assigning onclick also replaces the old legacy
        // file-picker click handler.

        button.onclick = async function(e) {
            e.stopPropagation();

            const wasOpen = mainFlyout.classList.contains("active");

            closeTxtFlyouts();

            if (wasOpen) return;

            const accessGranted = await getFolderAccess();

            if (!accessGranted) return;

            const rect = button.getBoundingClientRect();

            mainFlyout.style.top = rect.top + "px";

            if (columnId === "rightColumn") {
                mainFlyout.style.left = (rect.left - 180) + "px";
            } else {
                mainFlyout.style.left = rect.right + "px";
            }

            mainFlyout.classList.add("active");
        };
    }


    /* --------------------------------------------------
       SET UP BOTH CONTROL COLUMNS
    -------------------------------------------------- */

    document.addEventListener("DOMContentLoaded", function() {

        setupTxtFlyout("loadTxtBtn", "leftColumn");
        setupTxtFlyout("loadTxtBtnRight", "rightColumn");

    });


    // Clicking elsewhere closes the TXT flyouts.
    // Clicks inside the flyouts are stopped above.

    document.addEventListener("click", function() {
        closeTxtFlyouts();
    });

})();
</script>

<script>
/* ==========================================================
   STANDALONE PATCH: RESTRICT SPINNER & QUEUE TO NEXT ARROW ONLY (FLIP-AWARE)
   Ensures only the active next/down button triggers spinning, even when flipped.
========================================================== */
(function() {
    "use strict";

    let lastClickedInsideAnswerModal = false;
    let isClickingNextBtn = false;

    // Helper to determine if the target element is the active next/down button (handles flipped states)
    function isActualNextButton(target) {
        const nextBtn = document.getElementById("pNextBtn");
        if (!nextBtn) return false;

        // Check direct match or if click is inside the next button
        if (target === nextBtn || nextBtn.contains(target)) return true;

        return false;
    }

    // Track when a click originates inside the answer modal
    document.addEventListener("pointerdown", (e) => {
        const answerModal = document.getElementById("pAnswerModal");

        if (answerModal && answerModal.contains(e.target)) {
            lastClickedInsideAnswerModal = true;
            isClickingNextBtn = isActualNextButton(e.target);
        } else {
            lastClickedInsideAnswerModal = false;
            isClickingNextBtn = false;
        }
    }, true);

    document.addEventListener("click", (e) => {
        const answerModal = document.getElementById("pAnswerModal");

        if (answerModal && answerModal.contains(e.target)) {
            lastClickedInsideAnswerModal = true;
            isClickingNextBtn = isActualNextButton(e.target) && e.isTrusted;
        }
    }, true);
    // Reset flags immediately after the click cycle completes
    document.addEventListener("click", () => {
        setTimeout(() => {
            lastClickedInsideAnswerModal = false;
            isClickingNextBtn = false;
        }, 50);
    });

    // Safely wrap window.nextStudent to block accidental triggers when flipped or clicking other elements
    const originalNextStudent = window.nextStudent;
    if (originalNextStudent) {
        window.nextStudent = function() {
            if (window.__suppressAnswerSpinner ||
                (lastClickedInsideAnswerModal && !isClickingNextBtn)) {
                return; // Block student advancement when spinner suppression is active
            }
            return originalNextStudent.apply(this, arguments);
        };
    }

    // Safely wrap window.spinWheel to block accidental wheel spins
    const originalSpinWheel = window.spinWheel;
    if (originalSpinWheel) {
        window.spinWheel = function() {
            if (window.__suppressAnswerSpinner ||
                (lastClickedInsideAnswerModal && !isClickingNextBtn)) {
                return; // Block wheel spinning when suppression is active
            }
            return originalSpinWheel.apply(this, arguments);
        };
    }
})();
</script>

<script>
/* ==========================================================
   STANDALONE ISOLATED STUDENT NAME INJECTION MODULE
   - Injects student name into #pModalBody when spinner is closed/inactive.
   - Suppresses name injection while spinner is open or spinning.
========================================================== */
(function() {
    "use strict";

    function isSpinnerActiveOrVisible() {
        const overlay = document.getElementById("studentWheelOverlay");
        const isVisible = overlay && window.getComputedStyle(overlay).display === "flex";
        const isSpinning = window.Wheel && window.Wheel.spinning;
        return isVisible || isSpinning;
    }

    // Continuously monitor and sync the student name into the answer area when safe
    setInterval(() => {
        const modal = document.getElementById("pAnswerModal");
        const bodyEl = document.getElementById("pModalBody");
        
        // Only run if the answer modal is currently open and visible
        if (!modal || modal.style.display === "none" || !bodyEl) return;

        // Skip if the spinner is open, visible, or actively spinning
        if (isSpinnerActiveOrVisible()) return;

        // Fetch current student from the control column tile
        const studentTile = document.querySelector(".studentTile");
        const studentName = (window.Wheel && window.Wheel.currentName) || (studentTile ? studentTile.textContent.trim() : "") || "";
        const studentPrefix = studentName && studentName !== "Student" ? studentName + " - " : "";

        if (!studentPrefix) return;

        let currentVal = bodyEl.value;

        // Check if the prefix is already correct/present
        if (currentVal.startsWith(studentPrefix)) return;

        // Strip any stale or old student prefix if it exists, keeping the pure answer text
        let cleanAnswer = currentVal;
        // If there's a dash pattern, assume anything before the first " - " or " — " is an old name prefix
        const firstLine = currentVal.split("\n")[0];
        let dashIndex = firstLine.indexOf(" - ");
        if (dashIndex === -1) dashIndex = firstLine.indexOf(" — ");
        
        // Simple heuristic: if a dash exists and it looks like a prefix, clean it up
        // (We can check against known student names or just strip the first segment before " - ")
        if (dashIndex !== -1 && dashIndex < 25) { 
            // Only strip if it matches typical naming conventions, or let's target safe re-application
            // Alternatively, let's look at what's after the prefix:
            // If the user hasn't modified it, we can prepend cleanly.
        }

        // To prevent looping or clobbering user edits, we only apply if the current value 
        // doesn't already contain the correct prefix. Let's do a clean check:
        // If it contains a dash, let's see if we can safely replace the prefix part.
        let parts = currentVal.split(/ [-—] /);
        if (parts.length > 1 && (parts[0].length < 20)) {
            // There is likely an existing prefix. Let's extract the actual answer body:
            parts.shift(); // remove old prefix
            cleanAnswer = parts.join(" - ");
        }

        // Apply the fresh student prefix from the control column
        bodyEl.value = studentPrefix + cleanAnswer;

    }, 100);
})();

    const originalCards = [];

    function makeCard(url, duplicate) {
      const card = document.createElement("a");
      card.href = url;
      card.target = "_blank";
      card.className = "vignette-card";
      card.title = "Click to play full game";

      if (duplicate) {
        card.setAttribute("aria-hidden", "true");

      const iframe = document.createElement("iframe");
      iframe.src = url;
      iframe.loading = "lazy";
      iframe.title = url;
      card.appendChild(iframe);

      return card;

    // First complete set.
    VIGNETTE_GAMES.forEach(url => {
      const card = makeCard(url, false);
      originalCards.push(card);
      scrollBox.appendChild(card);
    });

    // Second identical set for seamless looping.
    VIGNETTE_GAMES.forEach(url => {
      scrollBox.appendChild(makeCard(url, true));
    });

    modal.appendChild(scrollBox);

// Dragging.
    let dragging = false;
    let moved = false;
    let startX = 0;
    let startY = 0;
    let initialLeft = 0;
    let initialTop = 0;
    let latestX = 0;
    let latestY = 0;
    let rafId = null;

    dragHandle.addEventListener("pointerdown", e => {
      dragging = true;
      moved = false;
      startX = e.clientX;
      startY = e.clientY;
      dragHandle.setPointerCapture(e.pointerId);

      document.addEventListener("pointermove", onMove);
      document.addEventListener("pointerup", onUp);
      document.addEventListener("pointercancel", onUp);

      e.preventDefault();
      e.stopPropagation();
    });

    function onMove(e) {
      if (!dragging) return;
      latestX = e.clientX;
      latestY = e.clientY;

      if (!rafId) {
        rafId = requestAnimationFrame(() => {
          const dx = latestX - startX;
          const dy = latestY - startY;

          if (!moved && (Math.abs(dx) > 2 || Math.abs(dy) > 2)) {
            moved = true;
            const rect = modal.getBoundingClientRect();

            modal.style.setProperty("left", rect.left + "px", "important");
            modal.style.setProperty("top", rect.top + "px", "important");
            modal.style.setProperty("right", "auto", "important");
            modal.style.setProperty("bottom", "auto", "important");

            initialLeft = rect.left;
            initialTop = rect.top;
          }

          if (moved) {
            modal.style.setProperty("left", (initialLeft + (latestX - startX)) + "px", "important");
            modal.style.setProperty("top", (initialTop + (latestY - startY)) + "px", "important");
          }
          rafId = null;
        });
      }
    }

    function onUp(e) {
      if (!dragging) return;
      dragging = false;
      moved = false;
      if (rafId) {
        cancelAnimationFrame(rafId);
        rafId = null;
      }
      try {
        dragHandle.releasePointerCapture(e.pointerId);
      } catch (err) {}
      document.removeEventListener("pointermove", onMove);
      document.removeEventListener("pointerup", onUp);
      document.removeEventListener("pointercancel", onUp);
    }
    // Measure one original set, including any actual card spacing.
    function getLoopHeight() {
      if (!originalCards.length) return 0;

      const first = originalCards[0].getBoundingClientRect();
      const last =
        originalCards[originalCards.length - 1].getBoundingClientRect();

      return last.bottom - first.top;
    }

    let timer = null;

    function stopScrolling() {
      if (timer !== null) {
        clearInterval(timer);
        timer = null;
      }
    }

    function startScrolling() {
      if (timer !== null || VIGNETTE_GAMES.length < 2) return;

      timer = setInterval(() => {
        if (!modal.classList.contains("open")) {
          stopScrolling();
          return;
        }

        if (modal.matches(":hover")) return;

        const loopHeight = getLoopHeight();
        if (loopHeight <= 0) return;

        scrollBox.scrollTop += SCROLL_SPEED;

        // Reset exactly at the start of the duplicate set.
        if (scrollBox.scrollTop >= loopHeight) {
          scrollBox.scrollTop -= loopHeight;
        }
      }, 30);
    }

    const observer = new MutationObserver(() => {
      if (modal.classList.contains("open")) {
        startScrolling();
      } else {
        stopScrolling();
        scrollBox.scrollTop = 0;

        ["left", "right", "top", "bottom"].forEach(prop => {
          modal.style.removeProperty(prop);
        });
      }
    });

    observer.observe(modal, {
      attributes: true,
      attributeFilter: ["class"]
    });

    document.body.appendChild(modal);
    return modal;
  }

  function initDualBuzzerVignettes() {

                transform: scale(0.95);

        `;
        document.head.appendChild(style);

    // 2. Dedicated Audio Player Helper
    let answerAudioPlayer = null;

    function getAnswerAudioPlayer() {
        if (!answerAudioPlayer) {
            answerAudioPlayer = document.createElement("audio");
            answerAudioPlayer.style.display = "none";
            document.body.appendChild(answerAudioPlayer);
        }
        return answerAudioPlayer;
    }

    // 3. Extract Audio Path/Filename from Current Answer
    function findAudioForCurrentAnswer() {
        const bodyEl = document.getElementById("pModalBody");
        if (!bodyEl) return null;

        const currentText = bodyEl.value || "";
        const audioMatch = currentText.match(
            /([a-zA-Z0-9_\-\.\/\\]+\.(?:mp3|wav|m4a|ogg))/i
        );

        if (audioMatch) {
            return audioMatch[1];
        }

        return null;
    }

    // 4. Parse BOTH ~P and ~SP Sequentially
    //    Send Results to the ORIGINAL Answer Assembly
    window.parsePAnswers = function() {

        const scriptArea = document.getElementById("worksheetScript");

        if (!scriptArea) {
            if (typeof window.setPAnswerBlocks === "function") {
                window.setPAnswerBlocks([]);
            }
            return;
        }

        const lines = scriptArea.value.split("\n");

        // IMPORTANT: Use a separate local array.
        // The original Answer Assembly owns the real pAnswers array.
        const parsedBlocks = [];

        let currentBlock = [];
        let capturing = false;

        lines.forEach(line => {

            let trimmed = line.trim();

            const isPTag = /^~P/i.test(trimmed);
            const isSPTag = /^~SP/i.test(trimmed);

            if (isPTag || isSPTag) {

                if (capturing && currentBlock.length > 0) {
                    parsedBlocks.push(currentBlock.join("\n").trim());
                    currentBlock = [];
                }

                capturing = true;

                if (isPTag) {
                    let content = trimmed.substring(2).trim();

                    if (content.startsWith(".")) {
                        content = content.substring(1).trim();
                    }

                    currentBlock.push("P. " + content);

                } else if (isSPTag) {
                    let content = trimmed.substring(3).trim();

                    if (content.startsWith(".")) {
                        content = content.substring(1).trim();
                    }

                    currentBlock.push(content);
                }

            } else if (capturing) {

                if (trimmed.startsWith("~")) {

                    capturing = false;

                    if (currentBlock.length > 0) {
                        parsedBlocks.push(currentBlock.join("\n").trim());
                        currentBlock = [];
                    }

                    const newIsP = /^~P/i.test(trimmed);
                    const newIsSP = /^~SP/i.test(trimmed);

                    if (newIsP || newIsSP) {

                        capturing = true;

                        if (newIsP) {
                            let content = trimmed.substring(2).trim();

                            if (content.startsWith(".")) {
                                content = content.substring(1).trim();
                            }

                            currentBlock.push("P. " + content);

                        } else if (newIsSP) {
                            let content = trimmed.substring(3).trim();

                            if (content.startsWith(".")) {
                                content = content.substring(1).trim();
                            }

                            currentBlock.push(content);
                        }
                    }

                } else {
                    currentBlock.push(line);
                }
            }
        });

        // Add the final answer block
        if (capturing && currentBlock.length > 0) {
            parsedBlocks.push(currentBlock.join("\n").trim());
        }

        // IMPORTANT: Pass the results to the REAL Answer Assembly
        if (typeof window.setPAnswerBlocks === "function") {
            window.setPAnswerBlocks(parsedBlocks);
        } else {
            console.warn(
                "Answer Assembly bridge not found. Add window.setPAnswerBlocks to the original Answer Assembly script."
            );
        }
    };

    // 5. Initialize and Position the Play Button
    //    To the Left of the Black Arrow Buttons
    function initAnswerPlayButton() {

        const blackPrevBtn = document.getElementById("pBlackPrevBtn");
        const blackNextBtn = document.getElementById("pBlackNextBtn");

        if (!blackPrevBtn && !blackNextBtn) return;

        let playBtn = document.getElementById("pAnswerPlayBtn");

        if (!playBtn) {

            playBtn = document.createElement("button");
            playBtn.id = "pAnswerPlayBtn";
            playBtn.className = "p-play-btn";
            playBtn.title = "Play referenced audio file";
            playBtn.innerHTML = "&#9658;";

            playBtn.addEventListener("click", (e) => {

                e.stopPropagation();
                e.stopImmediatePropagation();

                const audioFile = findAudioForCurrentAnswer();

                if (!audioFile) {
                    alert("No audio file referenced in this answer entry.");
                    return;
                }

                let audioPath = audioFile;

                if (/^[A-Z]:\\/i.test(audioPath)) {
                    audioPath = "file:///" + audioPath.replace(/\\/g, "/");
                }

                const player = getAnswerAudioPlayer();

                if (!player.paused && player.src.includes(audioFile)) {
                    player.pause();
                    playBtn.style.background = "#2563eb";
                    return;
                }

                player.src = audioPath;
                player.load();

                player.play()
                    .then(() => {
                        playBtn.style.background = "#10b981";
                    })
                    .catch(err => {
                        console.log("Audio playback error, opening external path:", err);
                        window.open(audioPath, "_blank");
                    });

                player.onended = () => {
                    playBtn.style.background = "#2563eb";
                };

            }, true);
        }

        const targetAnchor = blackPrevBtn || blackNextBtn;

        if (targetAnchor) {

            const pairContainer =
                targetAnchor.closest(".p-arrow-pair") || targetAnchor.parentNode;

            if (playBtn.parentNode !== pairContainer) {
                pairContainer.insertBefore(playBtn, targetAnchor);
            }

            const audioFile = findAudioForCurrentAnswer();

            playBtn.style.display = audioFile ? "inline-flex" : "none";
        }
    }

    // 6. Refresh Parser and Play Button on External File Updates
    const worksheetScript = document.getElementById("worksheetScript");

    if (worksheetScript) {

        worksheetScript.addEventListener("input", () => {

            if (typeof window.parsePAnswers === "function") {
                window.parsePAnswers();
            }

            initAnswerPlayButton();
        });
    }

    // 7. Initial Setup
    if (document.readyState === "loading") {

        document.addEventListener("DOMContentLoaded", () => {

            if (typeof window.parsePAnswers === "function") {
                window.parsePAnswers();
            }

            initAnswerPlayButton();
        });

    } else {

        if (typeof window.parsePAnswers === "function") {
            window.parsePAnswers();
        }

        initAnswerPlayButton();
    }

    // 8. Watch for Answer Assembly Changes
    const observer = new MutationObserver(() => {
        initAnswerPlayButton();
    });

    observer.observe(document.body, {
        childList: true,
        subtree: true,
        characterData: true
    });

    setInterval(initAnswerPlayButton, 200);

})();
</script>
