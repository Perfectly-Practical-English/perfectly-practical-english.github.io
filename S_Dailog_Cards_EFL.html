let topicsA = {};
let topicsB = {};
let activeListsA = {}; 
let activeListsB = {}; 
let currentTopicKey = "";
let currentIndexTop = 0;
let currentIndexBottom = 0;

let isRandomMode = false; 

function parseRawData(text, targetObj) {
  const chunks = text.split(/\n(?=~+)/);
  chunks.forEach(chunk => {
    const lines = chunk.trim().split("\n");
    if (lines.length === 0) return;
    const headerLine = lines.shift().trim();
    if (headerLine.startsWith("~")) {
      const topicName = headerLine.replace(/^~+/, "").trim();
      const prompts = lines
        .map(l => l.replace(/^[•*-]\s*/, "").trim())
        .filter(Boolean);
      targetObj[topicName] = prompts;
    }
  });
}

parseRawData(rawDataA, topicsA);
parseRawData(rawDataB, topicsB);

function shuffleArray(array) {
  let arr = [...array];
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function prepareActiveLists() {
  activeListsA = {};
  activeListsB = {};
  
  Object.keys(topicsA).forEach(topic => {
    if (isRandomMode) {
      activeListsA[topic] = shuffleArray(topicsA[topic]);
    } else {
      activeListsA[topic] = [...topicsA[topic]];
    }
  });

  Object.keys(topicsB).forEach(topic => {
    if (isRandomMode) {
      activeListsB[topic] = shuffleArray(topicsB[topic]);
    } else {
      activeListsB[topic] = [...topicsB[topic]];
    }
  });
}

prepareActiveLists();

const topicSelect = document.getElementById("topic-select");
Object.keys(topicsA).forEach(topic => {
  const option = document.createElement("option");
  option.value = topic;
  option.textContent = topic;
  topicSelect.appendChild(option);
});

const promptTop = document.getElementById("prompt-top");
const promptBottom = document.getElementById("prompt-bottom");
const counterTop = document.querySelector(".counter-top");
const counterBottom = document.querySelector(".counter-bottom");
const modeToggleBtn = document.getElementById("mode-toggle");

function updateModeButtonUI() {
  if (isRandomMode) {
    modeToggleBtn.textContent = "Order: Randomized";
    modeToggleBtn.classList.add("active");
  } else {
    modeToggleBtn.textContent = "Order: Sequential";
    modeToggleBtn.classList.remove("active");
  }
}
updateModeButtonUI();

function updateDisplays() {
  if (!currentTopicKey) return;
  
  const listA = activeListsA[currentTopicKey];
  const listB = activeListsB[currentTopicKey];

  if (listA) {
    promptTop.textContent = listA[currentIndexTop] || "End of list.";
    counterTop.textContent = `${currentIndexTop + 1} / ${listA.length}`;
  }

  if (listB) {
    promptBottom.textContent = listB[currentIndexBottom] || "End of list.";
    counterBottom.textContent = `${currentIndexBottom + 1} / ${listB.length}`;
  }
}

topicSelect.addEventListener("change", (e) => {
  currentTopicKey = e.target.value;
  currentIndexTop = 0;
  currentIndexBottom = 0;
  if (!currentTopicKey) {
    promptTop.textContent = "Select a topic to begin.";
    promptBottom.textContent = "Select a topic to begin.";
    counterTop.textContent = "1 / 1";
    counterBottom.textContent = "1 / 1";
    return;
  }
  updateDisplays();
});

modeToggleBtn.addEventListener("click", () => {
  isRandomMode = !isRandomMode;
  updateModeButtonUI();
  prepareActiveLists();
  currentIndexTop = 0;
  currentIndexBottom = 0;
  if (currentTopicKey) {
    updateDisplays();
  }
});

document.getElementById("next-top").addEventListener("click", () => {
  if (!currentTopicKey) return;
  const listA = activeListsA[currentTopicKey];
  if (currentIndexTop < listA.length - 1) {
    currentIndexTop++;
  } else {
    currentIndexTop = 0; 
  }
  updateDisplays();
});

document.getElementById("next-bottom").addEventListener("click", () => {
  if (!currentTopicKey) return;
  const listB = activeListsB[currentTopicKey];
  if (currentIndexBottom < listB.length - 1) {
    currentIndexBottom++;
  } else {
    currentIndexBottom = 0; 
  }
  updateDisplays();
});
