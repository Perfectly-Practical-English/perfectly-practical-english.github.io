<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Focus Pages</title>

<style>

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    height:100%;
    overflow:hidden;
    font-family:Arial,sans-serif;
    background:#d0d0d0;
}

/* ==========================
   MAIN LAYOUT
========================== */

#main{
    display:flex;
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 124px;
}

/* ==========================
   LEFT COLUMN
========================== */

#leftColumn{
    width:90px;
    min-width:90px;
    background:black !important;
    border-right:1px solid #999;
    display:flex;
    flex-direction:column;
    justify-content:flex-start;
    position: relative;
}

/* ==========================
   RIGHT COLUMN
========================== */

#rightColumn{
    width:90px;
    min-width:90px;
    background:black !important;
    border-left:1px solid #999;
    display:flex;
    flex-direction:column;
    justify-content:flex-start;
    position: relative;
}

#clearBoardBtn,
#clearBoardBtnRight{
    height:24px;
    font-size:10px;
    border:none;
    border-bottom:1px solid #999;
    cursor:pointer;
}

/* ==========================
   UNIT FOLDERS & FLYOUTS
========================== */
.unitFolderContainer {
    position: static;
    width: 100%;
}

.unitFolderBtn {
    width: 100%;
    height: 22px;
    font-size: 9px;
    background: black;
    color: white;
    border: none;
    border-bottom: 1px solid #333;
    cursor: pointer;
    text-align: center;
}

.unitFolderBtn:hover {
    background: #fdfdfd !important;
    color: #111 !important;
}

.spreadFlyout {
    display: none;
    position: absolute;
    left: 90px;
    top: 0;
    width: 140px;
    max-height: calc(100vh - 124px);
    background: black;
    border: 1px solid #555;
    z-index: 20000;
    overflow-y: auto;
    box-shadow: 2px 2px 10px rgba(0,0,0,0.8);
}

#rightColumn .spreadFlyout {
    left: auto;
    right: 90px;
}

.spreadFlyout.active {
    display: flex;
    flex-direction: column;
}

.spreadFlyoutItem {
    padding: 6px 8px;
    font-size: 10px;
    color: white;
    background: black;
    border-bottom: 1px solid #222;
    cursor: pointer;
    text-align: center;
    white-space: nowrap;
}

.spreadFlyoutItem:hover {
    background: #4a90e2 !important;
    color: white !important;
}

/* Unit Grid Layout Container (2 columns) */
.unitGrid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 1px;
    background: #333;
    padding: 1px;
}

/* ==========================
   VIEWER
========================== */

#viewer{
    flex:1;
    overflow:hidden;
    background:black;
    position:relative;
    cursor: move;
    touch-action:none;
}

#spread{
    position:absolute;
    top:0;
    left:0;
    height:100%;
    white-space:nowrap;
    font-size:0;
}

/* ==========================
   PAGES
========================== */

.imagePanel{
    display:inline-block;
    height:100%;
}

.imgWrap{
    width:100%;
    height:100%;
    overflow:hidden;
    position:relative;
}

.pageImage{
    display:block;
    height:100%;
    width:auto;
    pointer-events: none;
}

.leftPage{
    left:0;
    width:100%;
    clip-path: none;
}

.rightPage{
    left:0;
    width:100%;
    clip-path: none;
}
/* ==========================
   TILES
========================== */

#tilesBar{
    position: fixed;
    left: 0;
    right: 0;
    bottom: 24px;
    height: 100px;
    display: flex;
    flex-direction: column;
    border-top: 1px solid #999;
    background: black;
    z-index: 9998;
    box-sizing: border-box;
}

#tiles{
    flex:1;
    height:100%;
    background:black !important;
    display:flex;
    flex-wrap:wrap;
    gap:2px;
    padding:1px;
    overflow:auto;
    align-content:flex-start;
    justify-content:flex-start;
}

.tile{
    min-width:8ch;
    height:14px;
    line-height:14px;
    font-size:9px;
    padding:0 4px;
    margin:0;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    background:#E8D8B5;
    border:1px solid #B99F6B;
    color:#222;
    cursor:pointer;
    white-space:nowrap;
    user-select:none;
}

.tile.selected{
    background:#4a90e2 !important;
    border-color:#2f6fb7;
    color:white !important;
}

/* Designated Prefix Tile Colors */
.tile[data-prefix="~I"] {
    background: #e74c3c !important;
    border-color: #c0392b !important;
    color: white !important;
}

/* Emoji (~E) -> Orange */
.tile[data-prefix="~E"] {
    background: #e67e22 !important;
    border-color: #d35400 !important;
    color: white !important;
}

.tile[data-prefix="~SP"] {
    background: #2ecc71 !important;
    border-color: #27ae60 !important;
    color: white !important;
}

/* Sound Effects (~SX) -> Green */
.tile[data-prefix="~SX"] {
    background: #2ecc71 !important;
    border-color: #27ae60 !important;
    color: white !important;
}

#tilesResizeBar{
    height:8px;
    width:100%;
    background:#999;
    cursor:ns-resize;
    flex-shrink:0;
}

/* ==========================
   DRAGGABLES
========================== */

.draggable {
    position: absolute;
    z-index: 9999;
    cursor: move;
    user-select: none;
    -webkit-user-drag: none;
    touch-action: none;
    transition: none !important;
    animation: none !important;
    filter: none !important;
    transform: none !important;
}

.overlayPng {
    position: absolute;
    width: 140px;
    height: auto;
    background: transparent !important;
    border: none !important;
    padding: 0 !important;
    margin: 0 !important;
    display: block;
    pointer-events: auto;
    object-fit: contain;
}

img {
    -webkit-user-drag: none;
    -webkit-touch-callout: none;
}

#viewer, #spread, .imagePanel, .imgWrap {
    user-select: none;
    -webkit-user-select: none;
    -ms-user-select: none;
}

#deleteBtn,
#deleteBtnRight {
    width:100%;
    height:24px;
    font-size:10px;
    border:none;
    border-bottom:1px solid #999;
    cursor:pointer;
    background:black;
    color:white;
}

#scriptBar{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    height:24px;
    display:flex;
    flex-direction:row;
    align-items:stretch;
    border-top:1px solid #999;
    background:black;
    z-index:10000;
}

#scriptResizeBar{
    position:absolute;
    top:-8px;
    left:0;
    width:100%;
    height:8px;
    background:#999;
    cursor:ns-resize;
    z-index:10001;
}

#worksheetScript{
    flex:1;
    height:22px;
    resize:none;
    overflow:auto;
    font:10px Consolas,monospace;
    white-space:pre;
    border:none;
    outline:none;
    background: black !important;
    color: white !important;
    scrollbar-width:none;
}

#worksheetScript::-webkit-scrollbar{
    display:none;
}

#downloadTxtBtn{
    width:32px;
    height:22px;
    font-size:10px;
    border:none;
    border-left:1px solid #999;
    background:black;
    color:white;
    cursor:pointer;
    padding:0;
}

#downloadTxtBtn:hover{
    background:#333;
}

#scriptBar.expanded{
    height:220px;
}

#scriptBar.expanded #worksheetScript{
    height:218px;
}/* ==========================
   BREAK MODAL
========================== */

#breakModal{
    position:absolute;
    width:260px;
    height:180px;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    background:#000;
    border-radius:15px;
    color:white;
    z-index:50000;
    display:none;
    box-shadow: 0 0 30px rgba(0,0,0,.6);
    backdrop-filter:blur(4px);
    cursor:move;
    user-select:none;
}

#breakContent{
    height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
}

#breakContent h1{
    font-size:32px;

}

#breakTimer{
    margin-top:5px;

}

#breakStart{
    margin-top:20px;
    transform:translateY(-15px);
    padding:8px 18px;
    border:none;
    border-radius:8px;
    background:orange;
    font-weight:bold;
    cursor:pointer;
}

.breakControls{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    margin-top:5px;
}

.breakArrow{
    display:flex;
    align-items:center;
    justify-content:center;
    color:orange;
    font-size:24px;
    cursor:pointer;
    user-select:none;
    height:40px;
    transform:translateY(-5px);
}

.breakControls button{

    border-radius:6px;
    background:orange;
    cursor:pointer;
    font-weight:bold;
}

.breakControls button:hover{

}

.breakArrow:hover{

}

.spinnerButton{

</style>

<script>

/* ==========================
   MINI TIMER STANDALONE
========================== */

(function(){

const style = document.createElement("style");

style.textContent = `

#miniTimer{

    position:fixed;

    top:2px;

    right:92px;

    width:80px;

    height:20px;

    background:#ff9900;

    border:1px solid #cc6600;

    border-radius:4px;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:10px;

    font-weight:bold;

    color:black;

    z-index:100000;

    user-select:none;

    font-family:Arial,sans-serif;

}


#miniTimer span{

    cursor:pointer;

    font-size:12px;

    line-height:20px;

    padding:0 3px;

}


#miniTimerTime{

    min-width:25px;

    text-align:center;

}

`;

document.head.appendChild(style);



const timer = document.createElement("div");

timer.id="miniTimer";


timer.innerHTML=`

<span id="miniDown">▼</span>

<span id="miniTimerTime">00:00</span>

<span id="miniUp">▲</span>

`;


document.body.appendChild(timer);



let seconds = 0;

let interval = null;



const display =
document.getElementById("miniTimerTime");



let audioCtx = null;



function initAudio(){

    if(!audioCtx){

        audioCtx =
        new (window.AudioContext || window.webkitAudioContext)();

    }


    if(audioCtx.state === "suspended"){

        audioCtx.resume();

    }

}



/* ==========================
   UPDATE DISPLAY
========================== */

function update(){

    let m=Math.floor(seconds/60);

    let s=seconds%60;


    display.textContent =
    String(m).padStart(2,"0")
    +":"
    +String(s).padStart(2,"0");

}



/* ==========================
   ELECTRONIC BUZZER
========================== */

function playBuzzer(){

    if(!audioCtx)
        return;


    const osc =
    audioCtx.createOscillator();


    const gain =
    audioCtx.createGain();


    osc.type="square";

    osc.frequency.value=900;


    gain.gain.setValueAtTime(
        0.3,
        audioCtx.currentTime
    );


    gain.gain.exponentialRampToValueAtTime(
        0.001,
        audioCtx.currentTime + 0.8
    );


    osc.connect(gain);

    gain.connect(audioCtx.destination);


    osc.start();

    osc.stop(
        audioCtx.currentTime + 0.8
    );

}



/* ==========================
   START COUNTDOWN
========================== */

function start(){

    if(interval)
        clearInterval(interval);


    interval=setInterval(()=>{


        seconds--;

        update();


        if(seconds<=0){


            clearInterval(interval);

            interval=null;


            seconds=0;

            update();


            playBuzzer();


        }


    },1000);

}



/* ==========================
   CONTROLS
========================== */


document.getElementById("miniUp")
.onclick=function(){

    initAudio();


    seconds+=60;


    update();


    start();

};



document.getElementById("miniDown")
.onclick=function(){

    initAudio();


    seconds-=60;


    if(seconds<0)
        seconds=0;


    update();


    if(seconds>0)
        start();

};



update();



})();

</script>

 Init

/*------------------------------------------
 Launcher
------------------------------------------*/

function initLauncher(id){

    const sel=document.getElementById(id);

    if(!sel) return;

    sel.selectedIndex=0;

    sel.addEventListener("change",()=>{

        switch(sel.value){

            case "iframe":
                window.open(
                    LOCAL_URL,
                    "_blank"
                );
                break;

            case "online":
                window.open(
                    ONLINE_URL,
                    "_blank"
                );
                break;

        }

        sel.selectedIndex=0;

    });

}

})();

<script>

/* ==========================
   BREAK TIMER MODAL
========================== */


let breakInterval=null;
let breakRemaining=300;


function openBreakModal(){

    const modal = document.getElementById("breakModal");


    if(modal.style.display === "block"){

        // hide modal
        modal.style.display = "none";

        // optionally stop timer
        clearInterval(breakInterval);
        breakInterval = null;

        return;
    }


    // show modal
    modal.style.display = "block";

    startBreak();

}

function renderBreak(){

    let m=Math.floor(breakRemaining/60);

    let s=String(breakRemaining%60)
        .padStart(2,"0");

    document.getElementById("breakTimer")
        .textContent=`${m}:${s}`;

}

function adjustBreakTime(amount){

    /*
       If timer is finished,
       start a new countdown.
    */

    if(breakRemaining <= 0){

        startBreak(amount);

    }
    else{

        /*
           Add time to current countdown.
        */

        breakRemaining += amount;

        renderBreak();

    }


    /*
       Restart audio whenever + button is clicked.
    */

    if(typeof restartMusicAfterExtension === "function"){

        restartMusicAfterExtension();

    }

}



function startBreak(duration=300){

    clearInterval(breakInterval);


    /*
       Start new countdown duration.
       Works after Time's up.
    */

    breakRemaining = duration;

    renderBreak();


    breakInterval = setInterval(()=>{

        breakRemaining--;

        renderBreak();


        if(breakRemaining <= 0){

            clearInterval(breakInterval);

            breakInterval = null;


            document
            .getElementById("breakTimer")
            .textContent = "Time's up!";


            /*
               Keep value at zero so
               next + click starts a new break.
            */

            breakRemaining = 0;

        }

    },1000);

}

document
.getElementById("breakStart")
.onclick=()=>startBreak();

document
.getElementById("breakPlus")
.onclick=()=>adjustBreakTime(60);


document
.getElementById("breakMinus")
.onclick=()=>adjustBreakTime(-60);



/* ==========================
   DRAGGABLE BREAK MODAL
========================== */

(function(){

let modal=document.getElementById("breakModal");

let dragging=false;

let offsetX=0;
let offsetY=0;


modal.addEventListener("mousedown",e=>{

    dragging=true;

    offsetX=e.clientX-modal.offsetLeft;
    offsetY=e.clientY-modal.offsetTop;

});


document.addEventListener("mousemove",e=>{

    if(!dragging)return;


    modal.style.left=
        (e.clientX-offsetX)+"px";


    modal.style.top=
        (e.clientY-offsetY)+"px";


    modal.style.transform="none";

});


document.addEventListener("mouseup",()=>{

    dragging=false;

});


})();

</script>

        });


        watchBreakTimer();

    }



    function startBreakMusic(){

        if(!breakMusic.paused){
            return;
        }


        playMusicFromStart();

    }



    function restartBreakMusic(){

        /*
           Restart button
        */

        playMusicFromStart();

    }



    function restartMusicAfterExtension(){

        /*
           Up button:
           Timer has already been increased elsewhere.
           We only restart audio.
        */

        playMusicFromStart();

    }



    function stopBreakMusic(){

        breakMusic.pause();

        breakMusic.currentTime = 0;


        clearInterval(musicTimer);

        musicTimer = null;

    }



    function watchBreakTimer(){

        clearInterval(musicTimer);


        musicTimer = setInterval(()=>{


            if(
                typeof breakRemaining !== "undefined" &&
                breakRemaining <= 0
            ){

                stopBreakMusic();

            }


        },500);

    }



    /*
       Existing Break modal connection
    */

    const oldOpenBreakModal =
        window.openBreakModal;


    window.openBreakModal = function(){


        const modal =
            document.getElementById("breakModal");


        if(
            modal &&
            modal.style.display === "block"
        ){

            stopBreakMusic();

        }
        else{

            startBreakMusic();

        }


        oldOpenBreakModal();

    };



    /*
       Global controls
    */

    window.startBreakMusic =
        startBreakMusic;


    window.stopBreakMusic =
        stopBreakMusic;


    window.restartBreakMusic =
        restartBreakMusic;


    window.restartMusicAfterExtension =
        restartMusicAfterExtension;



})();
</script>

// Automatically generate dynamic page pairs from raw file lists
function generateSpreads(fileList) {
    let focusFiles = [];
    let actImgFiles = [];

    fileList.forEach(file => {
        const upper = file.toUpperCase();
        
        // Filter out standalone placeholder blanks from appearing on their own
        if (upper === "WHITE_BLANK.JPG" || upper === "BLACK_BLANK.JPG") {
            return;
        }

        // Catch ACT or IMG files regardless of parentheses or prefix structure
        if (upper.startsWith("ACT") || upper.startsWith("IMG")) {
            actImgFiles.push(file);
        } else if (upper.startsWith("FOCUS") || upper.includes("(")) {
            focusFiles.push(file);
        }
    });

    let pairs = [];

    // Pair regular sequential files into spreads of 2
    for (let i = 0; i < focusFiles.length; i += 2) {
        if (i + 1 < focusFiles.length) {
            pairs.push([focusFiles[i], focusFiles[i + 1]]);
        } else {
            pairs.push([focusFiles[i], "WHITE_BLANK.jpg"]);
        }
    }

    // Pair ACT or IMG files automatically according to naming indicator (+BLACK / +WHITE)
    actImgFiles.forEach(file => {
        let blankChoice = "WHITE_BLANK.jpg";
        if (file.toUpperCase().includes("+BLACK") || file.toUpperCase().includes("BLACK")) {
            blankChoice = "BLACK_BLANK.jpg";
        }
        pairs.push([file, blankChoice]);
    });

    return pairs;
}

/* ==========================
   FEATURE 5: ZOOM, PAN & CAMERA CLAMPING
========================== */

let viewerScale = 1;
let panX = 0;
let panY = 0;
let panLocked = false;
let isPanning = false;
let lastX = 0;
let lastY = 0;

window.spread = document.getElementById("spread");
const viewer = document.getElementById("viewer");

const zoomSelects = document.querySelectorAll("#zoomSelect, #zoomSelectRight, .zoomSelect");

zoomSelects.forEach(select => {
    select.addEventListener("change", function(){
        viewerScale = Number(this.value);
        zoomSelects.forEach(s => s.value = this.value);
        updateTransform();
    });
});

function updateTransform(){
    if (!spread) return;
    spread.style.transform = `translate(${panX}px, ${panY}px) scale(${viewerScale})`;
    spread.style.transformOrigin = "0 0";
}

if (viewer) {
    viewer.addEventListener("pointerdown", (e) => {
        if(e.target.classList.contains("draggable")) return;
        if(placeMode) return;
        if(panLocked) return;
        if(e.button !== 0) return;

        isPanning = true;
        lastX = e.clientX;
        lastY = e.clientY;
        viewer.setPointerCapture(e.pointerId);
    });

    viewer.addEventListener("pointermove", (e) => {
        if (panLocked) return;
        if (!isPanning) return;

        const dx = e.clientX - lastX;
        const dy = e.clientY - lastY;

        panX += dx;
        panY += dy;

        lastX = e.clientX;
        lastY = e.clientY;

        if (spread) {
            const rect = viewer.getBoundingClientRect();
            const contentW = spread.offsetWidth * viewerScale;
            const contentH = spread.offsetHeight * viewerScale;
            const viewW = rect.width;
            const viewH = rect.height;

            if (contentW <= viewW) {
                panX = (viewW - contentW) / 2;
            } else {
                panX = Math.max(viewW - contentW, Math.min(0, panX));
            }

            if (contentH <= viewH) {
                panY = (viewH - contentH) / 2;
            } else {
                panY = Math.max(viewH - contentH, Math.min(0, panY));
            }
        }

        updateTransform();
    }, true);

viewer.addEventListener("wheel", function(e){
    if(panLocked) return;
    e.preventDefault();

    panX -= e.deltaX;
    panY -= e.deltaY;

    if (spread) {
        const rect = viewer.getBoundingClientRect();
        const contentW = spread.offsetWidth * viewerScale;
        const contentH = spread.offsetHeight * viewerScale;
        const viewW = rect.width;
        const viewH = rect.height;

        // Horizontal boundaries
        if (contentW <= viewW) {
            panX = (viewW - contentW) / 2;
        } else {
            panX = Math.max(
                viewW - contentW,
                Math.min(0, panX)
            );
        }

        // Vertical boundaries
        if (contentH <= viewH) {
            panY = (viewH - contentH) / 2;
        } else {
            panY = Math.max(
                viewH - contentH,
                Math.min(0, panY)
            );
        }
    }

    updateTransform();
}, { passive: false });;

    viewer.addEventListener("pointerup", (e) => {
        isPanning = false;
        if (e.pointerId) {
            try { viewer.releasePointerCapture(e.pointerId); } catch(err) {}
        }
    });
}

<script>
/* ======================================================
   UNIFIED WORKSHEET & TILE ENGINE (Sequential Order & Emoji Fix)
====================================================== */

window.placeMode = window.placeMode || null;
window.selectedEl = window.selectedEl || null;

// Global audio element for ~S toggle playback
let globalSoundPlayer = null;

function getSoundPlayer() {
    if (!globalSoundPlayer) {
        globalSoundPlayer = document.createElement("audio");
        globalSoundPlayer.id = "soundPlayer";
        globalSoundPlayer.style.display = "none";
        document.body.appendChild(globalSoundPlayer);
    }
    return globalSoundPlayer;
}

// Unlock audio on first user action
let audioUnlocked = false;
function unlockAudio() {
    audioUnlocked = true;
    document.removeEventListener("pointerdown", unlockAudio);
    document.removeEventListener("keydown", unlockAudio);
}
document.addEventListener("pointerdown", unlockAudio, { once: true });
document.addEventListener("keydown", unlockAudio, { once: true });


/* ==========================
   MAIN BUILD FUNCTION (Sequential)
========================== */

function buildAllTiles() {
    const tileArea = document.getElementById("tiles");
    if (!tileArea) return;

    tileArea.innerHTML = ""; // Clear existing tiles

    const rawInput = document.getElementById("worksheetScript");
    if (!rawInput || !rawInput.value) return;

    const lines = rawInput.value.split(/\r?\n/);

    lines.forEach(rawLine => {
        let line = rawLine.trim();
        if (!line) return; // Skip empty lines

        // 1. HANDLE EXTERNAL MP3 FILES (~SP) -> Opens in Windows player
        if (/^~SP/i.test(line)) {
            let cleanLine = line.replace(/^~SP/i, "").trim();
            cleanLine = cleanLine.replace(/^[-–—]\s*/, "").trim();
            
            let match = cleanLine.match(/^(.+?)\s*[-–—]\s*(.+?\.mp3)\s*$/i);
            let label = match ? match[1].trim() : cleanLine.replace(/\.[^.]+$/, "");
            let file = match ? match[2].trim() : cleanLine;

            const tile = document.createElement("div");
            tile.className = "tile mp3Tile";
            tile.setAttribute("data-prefix", "~SP");
            tile.textContent = label;
            tile.onclick = function() {
                let audioPath = file;
                if (/^[A-Z]:\\/i.test(audioPath)) {
                    audioPath = "file:///" + audioPath.replace(/\\/g, "/");
                }
                window.open(audioPath);
            };
            tileArea.appendChild(tile);
            return;
        }

        // 2. HANDLE INTERNAL TOGGLE-TO-STOP SOUND FILES (~S, ~SX, ~SA, ~SB, etc.)
        if (/^~S[A-Za-z0-9]*/i.test(line)) {
            let prefixMatch = line.match(/^~([A-Za-z0-9]+)/i);
            let extractedPrefix = prefixMatch ? "~" + prefixMatch[1].toUpperCase() : "~S";

            let cleanLine = line.replace(/^~S[A-Za-z0-9]*/i, "").trim();
            cleanLine = cleanLine.replace(/^[-–—]\s*/, "").trim();
            
            let buttonMatch = cleanLine.match(/^(.+?)\s*[-–—]\s*(.+?\.(?:mp3|wav|ogg|m4a))\s*$/i);
            
            let label, file;
            if (buttonMatch) {
                label = buttonMatch[1].trim();
                file = buttonMatch[2].trim();
            } else {
                file = cleanLine;
                label = file.replace(/\.[^.]+$/, "");
            }

            const tile = document.createElement("button");
            tile.type = "button";
            tile.className = "tile soundTile";
            tile.setAttribute("data-prefix", extractedPrefix);
            tile.textContent = label;

            tile.onclick = function() {
                const player = getSoundPlayer();

                if (tile.classList.contains("selected") && !player.paused) {
                    player.pause();
                    player.currentTime = 0;
                    tile.classList.remove("selected");
                    return;
                }

                document.querySelectorAll(".soundTile.selected").forEach(t => {
                    t.classList.remove("selected");
                });

                tile.classList.add("selected");

                let audioPath = file;
                if (/^[A-Z]:\\/i.test(audioPath)) {
                    audioPath = "file:///" + audioPath.replace(/\\/g, "/");
                }

                player.pause();
                player.currentTime = 0;
                player.src = audioPath;
                player.load();
                player.play().catch(err => console.log("Sound play error:", err));
            };

            tileArea.appendChild(tile);
            return;
        }

        // 3. HANDLE EMOJI INPUTS (~E - Emoji = size, e.g. ~E ⭐️ = 32px)
        if (/^~E/i.test(line)) {
            let cleanLine = line.replace(/^~E/i, "").trim();
            cleanLine = cleanLine.replace(/^[-–—]\s*/, "").trim();

            let emojiMatch = cleanLine.match(/^(.+?)\s*=\s*(\d+(?:px|em|rem)?)$/);
            let emojiChar = emojiMatch ? emojiMatch[1].trim() : cleanLine.split("=")[0].trim();
            let sizeVal = emojiMatch ? emojiMatch[2].trim() : "32px";
            if (/^\d+$/.test(sizeVal)) sizeVal += "px";

            const tile = document.createElement("div");
            tile.className = "tile emojiTile";
            tile.setAttribute("data-prefix", "~E");
            tile.textContent = emojiChar;

            tile.onclick = function() {
                document.querySelectorAll("#tiles .tile").forEach(t => t.classList.remove("selected"));
                tile.classList.add("selected");
                window.placeMode = { 
                    type: "emoji", 
                    value: emojiChar, 
                    size: sizeVal 
                };
                window.selectedEl = null;
            };

            tileArea.appendChild(tile);
            return;
        }

        // Handle generic leading tilde tags for text/images if present
        let prefixTag = "";
        if (line.startsWith("~")) {
            let matchTag = line.match(/^~([A-Za-z0-9]+)/);
            if (matchTag) prefixTag = "~" + matchTag[1].toUpperCase();
            line = line.replace(/^~[A-Za-z0-9]*/i, "").trim();
        }

        // 4. HANDLE IMAGE INPUTS (~I, ~IA, etc.)
        let imageMatch = line.match(/^([A-Za-z0-9]+)?\s*[-–—]\s*(.+\.(png|jpg|jpeg))$/i);
        if (imageMatch) {
            let filename = imageMatch[2].trim();
            let label = filename.replace(/\.(png|jpg|jpeg)$/i, "").trim();

            const tile = document.createElement("div");
            tile.className = "tile imageTile";
            tile.setAttribute("data-prefix", prefixTag || "~I");
            tile.textContent = label;

            tile.onclick = function() {
                document.querySelectorAll("#tiles .tile").forEach(t => t.classList.remove("selected"));
                tile.classList.add("selected");
                window.placeMode = { type: "image", value: filename };
                window.selectedEl = null;
            };

            tileArea.appendChild(tile);
            return;
        }

        // 5. HANDLE STANDARD TEXT INPUTS (Label before dash, value after dash)
        let dashMatch = line.match(/^(.+?)\s*[-–—]\s*(.+)$/);
        if (dashMatch) {
            let label = dashMatch[1].trim();
            let value = dashMatch[2].trim();

            const tile = document.createElement("div");
            let prefixClass = prefixTag ? " tile-" + prefixTag.replace("~", "").toLowerCase() : "";
            tile.className = "tile" + prefixClass;
            if (prefixTag) tile.setAttribute("data-prefix", prefixTag);
            tile.textContent = label;

            tile.onclick = function() {
                document.querySelectorAll("#tiles .tile").forEach(t => t.classList.remove("selected"));
                tile.classList.add("selected");
                window.placeMode = { type: "text", value: value };
                window.selectedEl = null;
            };

            tileArea.appendChild(tile);
            return;
        }

        // 6. FALLBACK FOR PLAIN TEXT LINES (No dash)
        if (line) {
            const tile = document.createElement("div");
            tile.className = "tile";
            tile.textContent = line;

            tile.onclick = function() {
                document.querySelectorAll("#tiles .tile").forEach(t => t.classList.remove("selected"));
                tile.classList.add("selected");
                window.placeMode = { type: "text", value: line };
                window.selectedEl = null;
            };

            tileArea.appendChild(tile);
        }
    });
}


/* ==========================
   AUTO-LOAD & LIVE INPUT LISTENERS
========================== */

document.addEventListener("DOMContentLoaded", () => {
    const worksheetInput = document.getElementById("worksheetScript");
    if (worksheetInput) {
        buildAllTiles();
        worksheetInput.addEventListener("input", buildAllTiles);
    }
});


/* ==========================
   PLACE ON SPREAD
========================== */

if (typeof viewer !== "undefined" && viewer) {
    viewer.addEventListener("pointerdown", function(e){
        const target = e.target;

        if (target.classList.contains("draggable")) {
            e.stopPropagation();
            window.selectedEl = target;
            window.placeMode = null;
            return;
        }

        if (!window.placeMode) return;

        const rect = spread.getBoundingClientRect();
        const x = (e.clientX - rect.left) / viewerScale;
        const y = (e.clientY - rect.top) / viewerScale;

        let obj;
        if (window.placeMode.type === "image") {
            obj = document.createElement("img");
            obj.src = window.placeMode.value;
            obj.className = "draggable overlayPng";
            obj.style.width = "140px";
        } else if (window.placeMode.type === "emoji") {
            obj = document.createElement("div");
            obj.className = "draggable emojiOverlay";
            obj.textContent = window.placeMode.value;
            obj.style.background = "transparent";
            obj.style.border = "none";
            obj.style.boxShadow = "none";
            obj.style.outline = "none";
            obj.style.fontSize = window.placeMode.size;
            obj.style.display = "inline-block";
            obj.style.lineHeight = "1";
            obj.style.padding = "0";
            obj.style.margin = "0";
            obj.style.userSelect = "none";
        } else {
            obj = document.createElement("div");
            obj.className = "draggable tile tileAnchor placedTile";
            obj.textContent = window.placeMode.value;
        }

        obj.style.left = x + "px";
        obj.style.top = y + "px";
        spread.appendChild(obj);
        enableDragging(obj);

        window.selectedEl = obj;
        window.placeMode = null;
    });
}


/* ==========================
   DRAGGING
========================== */

function enableDragging(el){
    el.addEventListener("pointerdown", function(e){
        e.stopPropagation();
        window.selectedEl = el;

        const rect = spread.getBoundingClientRect();
        const offsetX = (e.clientX - rect.left) / viewerScale - parseFloat(el.style.left);
        const offsetY = (e.clientY - rect.top) / viewerScale - parseFloat(el.style.top);

        function move(ev){
            el.style.left = ((ev.clientX - rect.left) / viewerScale - offsetX) + "px";
            el.style.top = ((ev.clientY - rect.top) / viewerScale - offsetY) + "px";
        }

        function up(){
            window.removeEventListener("pointermove", move);
            window.removeEventListener("pointerup", up);
        }

        window.addEventListener("pointermove", move);
        window.addEventListener("pointerup", up);
    });
}
</script>

    );

                    node.classList.contains("draggable")

                }


            });


        });

    observer.observe(
        spread,
        {

        }
    );


}

<script>

        }
        .p-modal-btn {
            background: transparent;
            border: none;
            padding: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            color: red;
        }
        .p-modal-btn:hover {
            background: rgba(255, 0, 0, 0.05);
            border-radius: 50%;
        }
        /* Red toggle arrow outside the white area */
        #pToggleArrow {
            background: transparent;
            border: none;
            color: red;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            padding: 0 4px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        #pToggleArrow:hover {
            opacity: 0.8;
        }
        /* Red grab handle dot */
#pGrabDot {
            position: relative;
            z-index: 10000;
            width: 28px;
            height: 28px;
            background-color: transparent;
            border-radius: 50%;
            cursor: grab;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            margin: 0 4px;
        }
        #pGrabDot::after {
            content: '';
            width: 8px;
            height: 8px;
            background-color: red;
            border-radius: 50%;
            display: block;
        }
        #pGrabDot:active {
            cursor: grabbing;
        }    `;
    document.head.appendChild(style);

    // 2. Inject HTML Markup for the Unified Modal with the Toggle Arrow initially on the left and the red grab dot on the right
    const modalHTML = `
        <div id="pAnswerModal" style="display: none;" tabindex="0">
            <button id="pToggleArrow" title="Toggle Position">&#9664</button>
            <div id="pModalContentRow">
                <button id="pPrevBtn" class="p-modal-btn" title="Back">&#9664;</button>
                <div id="pModalBody">Loading...</div>
                <button id="pNextBtn" class="p-modal-btn" title="Next">&#9654;</button>
            </div>
            <div id="pGrabDot" title="Grab Handle"></div>
        </div>
    `;
    const div = document.createElement('div');
    div.innerHTML = modalHTML;
    
    // Append the modal directly inside your spread display container so it scrolls naturally with it
    const spreadContainer = document.querySelector('#displayArea') || document.body;
    if (spreadContainer !== document.body && getComputedStyle(spreadContainer).position === 'static') {
        spreadContainer.style.position = 'relative';
    }
    spreadContainer.appendChild(div);

    // 3. Attach click handlers to the Answer buttons already present in the HTML structure
    function setupTriggerButtons() {
        const btnIds = ['loadAnswerBtn', 'loadAnswerBtnRight'];
        
        btnIds.forEach(id => {
            const triggerBtn = document.getElementById(id);
            if (triggerBtn && !triggerBtn.hasAttribute('data-modal-bound')) {
                triggerBtn.setAttribute('data-modal-bound', 'true');
                triggerBtn.addEventListener('click', () => {
                    parsePAnswers();
                    const modal = document.getElementById('pAnswerModal');
                    modal.style.display = 'inline-flex';
                    modal.focus();
                });
            }
        });
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', setupTriggerButtons);
    } else {
        setupTriggerButtons();
    }

    const observer = new MutationObserver(setupTriggerButtons);
    observer.observe(document.body, { childList: true, subtree: true });

    // 4. State & Logic Handler
    let pAnswers = [];
    let currentIndex = 0; 

    function parsePAnswers() {
        const scriptArea = document.getElementById('worksheetScript');
        if (!scriptArea) {
            pAnswers = [];
            return;
        }
        const lines = scriptArea.value.split('\n');
        pAnswers = [];
        
        lines.forEach(line => {
            let trimmed = line.trim();
            if (trimmed.startsWith('~P')) {
                let content = trimmed.substring(2).trim();
                if (content.startsWith('.')) {
                    content = content.substring(1).trim();
                }
                let answerContent = "P. " + content;
                
                let wrappedContent = answerContent.match(/.{1,50}/g).join('\u200B');
                pAnswers.push(wrappedContent);
            }
        });
        currentIndex = 0;
        updatePModalDisplay();
    }

    function updatePModalDisplay() {
        const bodyEl = document.getElementById('pModalBody');
        
        if (pAnswers.length === 0) {
            bodyEl.textContent = "None found";
            return;
        }
        
        bodyEl.textContent = pAnswers[currentIndex];
    }

    // Navigation triggers
    document.getElementById('pNextBtn').addEventListener('click', (e) => {
        e.stopPropagation();
        if (pAnswers.length === 0) return;
        currentIndex = (currentIndex + 1) % pAnswers.length;
        updatePModalDisplay();
    });

    document.getElementById('pPrevBtn').addEventListener('click', (e) => {
        e.stopPropagation();
        if (pAnswers.length === 0) return;
        currentIndex = (currentIndex - 1 + pAnswers.length) % pAnswers.length;
        updatePModalDisplay();
    });

    // Toggle Arrow functionality (also toggles grab handle opposite to it)
    const modal = document.getElementById('pAnswerModal');
    const toggleArrow = document.getElementById('pToggleArrow');
    const contentRow = document.getElementById('pModalContentRow');
    const grabDot = document.getElementById('pGrabDot');

toggleArrow.addEventListener('click', (e) => {
        e.stopPropagation();
        if (toggleArrow.textContent.includes('◄')) {
            // Move toggle arrow to the right, grab dot to the left
            toggleArrow.textContent = '►';
            toggleArrow.style.marginLeft = '4px';
            toggleArrow.style.marginRight = '0';
            grabDot.style.marginLeft = '0';
            grabDot.style.marginRight = '14px';
            
            modal.insertBefore(grabDot, toggleArrow);
            modal.appendChild(toggleArrow);
        } else {
            // Move toggle arrow to the left, grab dot to the right
            toggleArrow.textContent = '◄';
            toggleArrow.style.marginLeft = '0';
            toggleArrow.style.marginRight = '4px';
            grabDot.style.marginLeft = '14px';
            grabDot.style.marginRight = '0';
            
            modal.insertBefore(toggleArrow, contentRow);
            modal.appendChild(grabDot);
        }
    });

    // 5. Clear functionality integration
    document.addEventListener('click', (e) => {
        if (e.target.matches('#clearBtn, .clear-btn, [id*="clear"], [class*="clear"]')) {
            if (modal) modal.style.display = 'none';
            pAnswers = [];
            currentIndex = 0;
        }
    });

    // 6. Make the Entire Modal Draggable (Mouse + Touch Support & Blank Text on Move) + Red Dot Inert Drag Support
    let isDragging = false, startX, startY;

    function startDrag(clientX, clientY, target) {
        if (target.tagName === 'BUTTON') return;
        isDragging = true;
        startX = clientX - modal.offsetLeft;
        startY = clientY - modal.offsetTop;
        
        // Blank out text when moving starts, EXCEPT if dragged via the red dot handle
        if (target !== grabDot) {
            const bodyEl = document.getElementById('pModalBody');
            if (bodyEl) bodyEl.textContent = "";
        }
    }

    function onDrag(clientX, clientY) {
        if (!isDragging) return;
        modal.style.left = `${clientX - startX}px`;
        modal.style.top = `${clientY - startY}px`;
    }

    function stopDrag() {
        isDragging = false;
    }

    // Mouse Events
    modal.addEventListener('mousedown', (e) => {
        startDrag(e.clientX, e.clientY, e.target);
        e.preventDefault();
    });
    document.addEventListener('mousemove', (e) => onDrag(e.clientX, e.clientY));
    document.addEventListener('mouseup', stopDrag);

    // Touch Events
    modal.addEventListener('touchstart', (e) => {
        if (e.target.tagName === 'BUTTON') return;
        if (e.touches.length === 1) {
            startDrag(e.touches[0].clientX, e.touches[0].clientY, e.target);
            e.preventDefault();
        }
    }, { passive: false });

    document.addEventListener('touchmove', (e) => {
        if (isDragging && e.touches.length === 1) {
            onDrag(e.touches[0].clientX, e.touches[0].clientY);
            e.preventDefault();
        }
    }, { passive: false });

    document.addEventListener('touchend', stopDrag);

    // 7. Delete / Backspace Key Removal functionality
    window.addEventListener('keydown', (e) => {
        if (e.key === 'Delete' || e.key === 'Backspace') {
            if (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'TEXTAREA') return;
            if (modal && getComputedStyle(modal).display !== 'none') {
                modal.style.display = 'none';
                pAnswers = [];
                currentIndex = 0;
            }
        }
    });
})();
</script>

});

<script>
/* ==========================
   APP CONTROLLER / BRIDGE
========================== */
(function() {
    class AppController {
        constructor() {
            this.colorQueue = ["Blue", "Green", "Orange", "Red"];
            this.currentColorIndex = 0;
            this.initListeners();
        }

        isColorOnlyMode() {
            const classSelect = document.querySelector(".classSelect");
            return !classSelect || !classSelect.value || (typeof studentData !== "undefined" && !studentData[classSelect.value]);
        }

        getActiveColor() {
            return this.colorQueue[this.currentColorIndex];
        }

        nextColor() {
            this.currentColorIndex = (this.currentColorIndex + 1) % this.colorQueue.length;
            this.syncAll();
        }

        syncAll() {
            const colorOnly = this.isColorOnlyMode();
            const tmTile = document.getElementById("tmTile");

            if (tmTile) {
                if (colorOnly) {
                    const activeColor = this.getActiveColor();
                    tmTile.textContent = activeColor;
                    if (typeof studentColors !== "undefined" && studentColors[activeColor]) {
                        tmTile.style.background = studentColors[activeColor];
                        tmTile.style.color = "#111";
                    }
                } else {
                    if (typeof updateTmTileFromApp === "function") {
                        updateTmTileFromApp();
                    }
                }
            }

            if (colorOnly && typeof Wheel !== "undefined" && Wheel.setActiveColor) {
                Wheel.setActiveColor(this.getActiveColor());
            }
        }

        initListeners() {
            document.addEventListener("change", (e) => {
                if (e.target && e.target.classList.contains("classSelect")) {
                    this.syncAll();
                }
            });
        }
    }

    window.appController = new AppController();
})();
</script>

/* PARSE DATA */

function parseStudents(raw){


    const blocks =
    raw.split(/(?=~)/g);


    const result={};


    blocks.forEach(block=>{


        block=block.trim();


        if(!block.startsWith("~"))
            return;


        const lines =
        block.split("\n")
        .map(x=>x.trim())
        .filter(Boolean);



        const className =
        lines[0]
        .replace("~","")
        .trim();



        result[className]=[];



        for(let i=1;i<lines.length;i++){


            const parts =
            lines[i].split(/\s+/);



            const team =
            parts.shift();



            const name =
            parts.join(" ");



result[className].push({

    name:name,

    team:team,

    color:studentColors[team]

});

        }


    });


    return result;

}



const studentData =

const colorOrder = [
    "Blue",
    "Green",
    "Orange",
    "Red"
];
function shuffle(array){

    return [...array]
    .sort(()=>Math.random()-0.5);

}

function loadClass(className){

    colorQueues = {};

    colorOrder.forEach(color=>{

        colorQueues[color] =
            shuffle(
                studentData[className]
                .filter(s=>s.team===color)
            );

    });

    currentColor = 0;

}


/* NEXT STUDENT */

function nextStudent(){

    const className =
        classSelectors[0].value;

    const color =
        colorOrder[currentColor];

    if(colorQueues[color].length===0){

        colorQueues[color] =
            shuffle(
                studentData[className]
                .filter(s=>s.team===color)
            );

    }

    const student =
        colorQueues[color].shift();

    studentTiles.forEach(tile=>{

        tile.textContent =
            student.name;

        tile.style.background =
            student.color;

    });

    currentColor =
        (currentColor+1) %
        colorOrder.length;

}

/* BUILD DROPDOWNS */

Object.keys(studentData)
.forEach(className=>{


    classSelectors.forEach(select=>{


        const option =
        document.createElement("option");


        option.value =
        className;


        option.textContent =
        className;


        select.appendChild(option);


    });


});



/* SYNC CLASS SELECTORS */

classSelectors.forEach(select=>{


    select.addEventListener(
    "change",
    function(){


        classSelectors.forEach(other=>{

            other.value =
            this.value;

        });



loadClass(
            this.value
        );


        nextStudent();

        // Immediately update the wheel if it's open
        if(window.updateWheelClass){
            window.updateWheelClass();
        }

    });


});



/* CLICK STUDENT TILE */

studentTiles.forEach(tile=>{


    tile.onclick=function(){

        nextStudent();

    };


});



/* START */

if(classSelectors.length){


    loadClass(
        classSelectors[0].value
    );


    nextStudent();


}

<script>

(function(){

const Wheel={

    overlay:null,
    panel:null,
    canvas:null,
    ctx:null,

    students:[],
    angle:0,

    currentName:null,

    spinning:false,
    queuedName:null,
    size:0,
    radius:0,
    duration:2000
};
/* ==========================
   CREATE WHEEL
========================== */

function createWheel(){

    if(Wheel.overlay) return;


    const style=document.createElement("style");

    style.textContent=`

:root{
--wheel-size:350px;
}

#studentWheelOverlay{

position:fixed;
inset:0;

display:none;

align-items:center;
justify-content:center;

background:transparent;

pointer-events:none !important;

z-index:100002;

}


#studentWheelPanel{

position:relative;

width:calc(var(--wheel-size) + 120px);
height:calc(var(--wheel-size) + 120px);

cursor:default;

pointer-events:none !important;

    touch-action:none;


display:flex;
align-items:center;
justify-content:center;

}
#studentWheelCanvas{

display:block;

width:var(--wheel-size);
height:var(--wheel-size);

transform:none;

background:transparent;

pointer-events:auto !important;
cursor:pointer;

clip-path: circle(50% at center);

}
`;

document.head.appendChild(style);



Wheel.overlay=document.createElement("div");

Wheel.overlay.id="studentWheelOverlay";



Wheel.panel=document.createElement("div");

Wheel.panel.id="studentWheelPanel";



Wheel.canvas=document.createElement("canvas");

Wheel.canvas.id="studentWheelCanvas";

Wheel.size = parseInt(
    getComputedStyle(document.documentElement)
        .getPropertyValue("--wheel-size")
);

Wheel.radius = Wheel.size / 2 - 10;

const extraSpace = 40;

Wheel.canvas.width = Wheel.size + extraSpace;
Wheel.canvas.height = Wheel.size + extraSpace;
Wheel.ctx =
Wheel.canvas.getContext("2d");
Wheel.panel.appendChild(Wheel.canvas);

Wheel.overlay.appendChild(Wheel.panel);

document.body.appendChild(Wheel.overlay);



/* drag wheel */

let dragging=false;
let ox=0;
let oy=0;


Wheel.canvas.addEventListener("pointerdown",e=>{

    const canvasRect = Wheel.canvas.getBoundingClientRect();
    const extraSpace = 40;
    const cx = (Wheel.size / 2) + extraSpace / 2;
    const cy = (Wheel.size / 2) + extraSpace / 2;
    const scaleX = Wheel.canvas.width / canvasRect.width;
    const scaleY = Wheel.canvas.height / canvasRect.height;
    const internalX = (e.clientX - canvasRect.left) * scaleX;
    const internalY = (e.clientY - canvasRect.top) * scaleY;
    const dx = internalX - cx;
    const dy = internalY - cy;

    // If clicking the center hub, let the click handler handle it instead of dragging
    if(Math.sqrt(dx * dx + dy * dy) <= 28){
        return; 
    }

    // RESTRICT DRAGGING: Only allow drag if clicking directly on the red pointer at the top
    const distFromTopPointer = Math.sqrt(Math.pow(internalX - cx, 2) + Math.pow(internalY - 26, 2));
    if(distFromTopPointer > 15){
        return; // Clicked transparent background or pizza slice, ignore drag so it passes through
    }

    dragging=true;

    const r=Wheel.panel.getBoundingClientRect();

    ox=e.clientX-r.left;
    oy=e.clientY-r.top;

    Wheel.canvas.setPointerCapture(e.pointerId);

});


Wheel.canvas.addEventListener("pointermove",e=>{

if(!dragging)return;


Wheel.panel.style.position="fixed";

Wheel.panel.style.left=
(e.clientX-ox)+"px";

Wheel.panel.style.top=
(e.clientY-oy)+"px";


Wheel.panel.style.transform="none";


});


Wheel.canvas.addEventListener("pointerup",e=>{

dragging=false;
try { Wheel.canvas.releasePointerCapture(e.pointerId); } catch(err) {}

});


/* Overlay is now click-through.
   Spinner button opens/closes it. */

}



/* ==========================
   LOAD STUDENTS
========================== */

function loadWheelStudents(){

    const className =
        document.querySelector(".classSelect").value;

    // Fallback to color-only spinner blocks if no class is selected
    if(!className || !studentData[className]){
        Wheel.students = [
            { name: "Blue", color: studentColors["Blue"] },
            { name: "Green", color: studentColors["Green"] },
            { name: "Orange", color: studentColors["Orange"] },
            { name: "Red", color: studentColors["Red"] }
        ];
        return;
    }


    Wheel.students =
        studentData[className].map(s => ({...s}));

    /*
        Rearrange students so identical colors
        are spread apart whenever possible.
    */

    const colorGroups = {};

    Wheel.students.forEach(student=>{

        const color = student.color || "#ddd";

        if(!colorGroups[color]){
            colorGroups[color] = [];
        }

        colorGroups[color].push(student);

    });


    const groups = Object.values(colorGroups);


    Wheel.students = [];

    let lastColor = null;


    while(groups.some(g => g.length)){

        // Find the largest remaining group
        groups.sort((a,b)=>b.length-a.length);


        let selected =
            groups.find(g =>
                g.length &&
                (g[0].color || "#ddd") !== lastColor
            );


        // If no different color exists, use whatever remains
        if(!selected){
            selected =
                groups.find(g=>g.length);
        }


        const student =
            selected.shift();


        Wheel.students.push(student);

        lastColor =
            student.color || "#ddd";

    }


    const tile =
        document.querySelector(".studentTile");


    if(tile){

        Wheel.currentName =
            tile.textContent.trim();

    }

}
/* ==========================
   DRAW
========================== */
function drawWheel(){

const ctx = Wheel.ctx;

/* COMPLETE CANVAS RESET */
ctx.setTransform(1,0,0,1,0,0);

ctx.globalAlpha = 1;

ctx.shadowColor = "transparent";
ctx.shadowBlur = 0;
ctx.shadowOffsetX = 0;
ctx.shadowOffsetY = 0;

ctx.clearRect(
    0,
    0,
    Wheel.canvas.width,
    Wheel.canvas.height
);
const extraSpace = 40;

const cx = (Wheel.size/2) + extraSpace/2;
const cy = (Wheel.size/2) + extraSpace/2;

ctx.save();

ctx.shadowColor = "transparent";
ctx.shadowBlur = 0;

const students=Wheel.students;


if(!students.length)return;


const slice=
Math.PI*2/students.length;



students.forEach((s,i)=>{


const start=
Wheel.angle+i*slice;


const end=start+slice;


ctx.beginPath();

ctx.moveTo(cx,cy);

ctx.arc(
cx,
cy,
Wheel.radius,
start,
end
);

ctx.closePath();


ctx.fillStyle =
    s.color || "#ddd";

ctx.fill();


ctx.strokeStyle="#000";

ctx.lineWidth=.25;

ctx.stroke();



const mid=(start+end)/2;


ctx.save();


/* Move the label closer to the rim */

const labelRadius = Wheel.radius - 15; 

// first letter 25px from crust
ctx.translate(

    cx + Math.cos(mid) * labelRadius,

    cy + Math.sin(mid) * labelRadius

);

/* Keep the text vertical relative to its slice */

ctx.rotate(mid + Math.PI);


ctx.fillStyle="#111";

ctx.font = (Wheel.size * 0.035) + "px Arial";
ctx.textAlign="left";

ctx.textBaseline="middle";


ctx.fillText(
    s.name,
    0,
    0
);

ctx.restore();


});

ctx.restore();



/* Soft slice seams */

const fuzzySlice =
    (Math.PI * 2) / Wheel.students.length;


ctx.shadowColor = "rgba(0,0,0,0.35)";
ctx.shadowBlur = 3;

ctx.strokeStyle = "rgba(60,40,15,0.35)";
ctx.lineWidth = 1;


Wheel.students.forEach((s,i)=>{

    const seamAngle =
        Wheel.angle + i * fuzzySlice;


    ctx.beginPath();

    ctx.moveTo(cx,cy);

    ctx.lineTo(
        cx + Math.cos(seamAngle) * Wheel.radius,
        cy + Math.sin(seamAngle) * Wheel.radius
    );

    ctx.stroke();

});


ctx.restore();


/* ==========================
   BRASS METALLIC OUTER RIM
========================== */

ctx.save();

const rimWidth = 10;

const rimGradient = ctx.createRadialGradient(
    cx,
    cy,
    Wheel.radius - rimWidth,
    cx,
    cy,
    Wheel.radius + 5
);

rimGradient.addColorStop(0, "#5c3900");
rimGradient.addColorStop(0.25, "#d8a62a");
rimGradient.addColorStop(0.45, "#fff2a6");
rimGradient.addColorStop(0.65, "#c58a16");
rimGradient.addColorStop(0.85, "#8b5a05");
rimGradient.addColorStop(1, "#3b2400");


ctx.beginPath();

ctx.arc(
    cx,
    cy,
    Wheel.radius,
    0,
    Math.PI * 2
);

ctx.strokeStyle = rimGradient;
ctx.lineWidth = rimWidth;

ctx.stroke();


/* Fine highlight edge */

ctx.beginPath();

ctx.arc(
    cx,
    cy,
    Wheel.radius - rimWidth/2,
    0,
    Math.PI * 2
);

ctx.strokeStyle = "rgba(255,240,150,0.8)";
ctx.lineWidth = 1;

ctx.stroke();


ctx.restore();





/* ==========================
   FUZZY WHEEL FINISHING PASS
========================== */

ctx.save();

ctx.globalAlpha = 1;

/* Soft outer perimeter */

ctx.beginPath();

ctx.arc(
    cx,
    cy,
    Wheel.radius + 3,
    0,
    Math.PI * 2
);

ctx.strokeStyle = "rgba(40,25,5,0.45)";
ctx.lineWidth = 8;
ctx.shadowColor = "rgba(40,25,5,0.65)";
ctx.shadowBlur = 12;

ctx.stroke();


/* Brass glow around rim */

ctx.beginPath();

ctx.arc(
    cx,
    cy,
    Wheel.radius,
    0,
    Math.PI * 2
);

ctx.strokeStyle = "rgba(255,190,50,0.5)";
ctx.lineWidth = 5;
ctx.shadowColor = "rgba(255,190,50,0.8)";
ctx.shadowBlur = 8;

ctx.stroke();

/* pointer */

ctx.beginPath();

ctx.moveTo(cx,35);

ctx.lineTo(cx-10,18);

ctx.lineTo(cx+10,18);

ctx.closePath();

ctx.fillStyle="red";

ctx.fill();


/* Brass cone hub */

const hubX = cx;
const hubY = cy;

ctx.save();

/* Shadow under cone */
ctx.beginPath();
ctx.arc(
    hubX + 3,
    hubY + 5,
    28,
    0,
    Math.PI * 2
);

ctx.fillStyle = "rgba(0,0,0,0.35)";
ctx.fill();


/* Cone body - radial metallic brass */
const brass = ctx.createRadialGradient(
    hubX - 8,
    hubY - 10,
    3,
    hubX,
    hubY,
    30
);

brass.addColorStop(0, "#fff2a6");   // bright brass reflection
brass.addColorStop(0.15, "#ffd34e");
brass.addColorStop(0.35, "#c58a16");
brass.addColorStop(0.65, "#8b5a05");
brass.addColorStop(0.85, "#d8a62a");
brass.addColorStop(1, "#5c3900");


ctx.beginPath();

ctx.arc(
    hubX,
    hubY,
    28,
    0,
    Math.PI * 2
);

ctx.fillStyle = brass;
ctx.fill();


/* Cone rim */
ctx.beginPath();

ctx.arc(
    hubX,
    hubY,
    28,
    0,
    Math.PI * 2
);

ctx.strokeStyle = "#5a3500";
ctx.lineWidth = 2;
ctx.stroke();


/* Top bevel ring */
ctx.beginPath();

ctx.arc(
    hubX,
    hubY,
    20,
    0,
    Math.PI * 2
);

ctx.strokeStyle = "rgba(255,240,150,0.8)";
ctx.lineWidth = 2;
ctx.stroke();


/* Center shine */
ctx.beginPath();

ctx.arc(
    hubX - 7,
    hubY - 8,
    7,
    0,
    Math.PI * 2
);

ctx.fillStyle = "rgba(255,255,220,0.55)";
ctx.fill();


ctx.restore();




}



/* ==========================
   SPIN
========================== */

function spinWheel(){


if(Wheel.spinning){

    return;

}

Wheel.spinning=true;

if(window.startSpinnerSound){
    startSpinnerSound();
}
loadWheelStudents();


if(!Wheel.students.length){

Wheel.spinning=false;
if(window.stopSpinnerSound) stopSpinnerSound();

return;

}



let start=
performance.now();


let startAngle=
Wheel.angle;



const slice =
    (Math.PI * 2) / Wheel.students.length;


const className = document.querySelector(".classSelect").value;

// Only trigger student advancement logic if a class is selected
if (className && studentData[className]) {
    const mainGenBtn = document.querySelector("#randomBtn, .random-btn, [data-random-student], #generateBtn, .studentTile");
    if(mainGenBtn && typeof mainGenBtn.click === "function" && !mainGenBtn.classList.contains("studentTile")){
        mainGenBtn.click();
    } else if(typeof window.nextStudent === "function"){
        window.nextStudent();
    }

    const tile = document.querySelector(".studentTile");
    if(tile){
        Wheel.currentName = tile.textContent.trim();
    }
} else {
    // If no class is selected, rely on appController state
    if (window.appController) {
        window.appController.nextColor();
        Wheel.currentName = window.appController.getActiveColor();
    } else {
        Wheel.currentName = "Blue";
    }
}
/*
   Aim the CENTER of the student's slice
   at the pointer.
*/

const targetIndex =
    Wheel.students.findIndex(
        s => s.name === Wheel.currentName
    );


if(targetIndex < 0){

    Wheel.spinning=false;
    if(window.stopSpinnerSound) stopSpinnerSound();
    return;

}


const studentAngle =
    (targetIndex * slice) +
    (slice / 2);

const pointerAngle =
    -Math.PI / 2;

/* Angle needed to line the student's slice up
   with the pointer. */
let offset =
    pointerAngle - studentAngle - startAngle;

/* Keep it positive so we never spin backwards. */
offset =
    ((offset % (Math.PI * 2)) + (Math.PI * 2)) %
    (Math.PI * 2);

/* Always spin at least 3 complete turns first. */
const minimumTurns = 7;

let target =
    startAngle +
    (minimumTurns * Math.PI * 2) +
    offset;
function animate(now){


let p=
(now-start)/Wheel.duration;


if(p>1)p=1;


let ease=
1-Math.pow(1-p,5);


Wheel.angle=
startAngle+
(target-startAngle)*ease;


drawWheel();



if(p<1){

requestAnimationFrame(animate);

}

else{

Wheel.spinning=false;

if(window.stopSpinnerSound){
    stopSpinnerSound();
}

/* Advance to the same student
   the wheel just landed on */

loadWheelStudents();

drawWheel();

}
}


requestAnimationFrame(animate);


}


/* ==========================
   SHOW / HIDE
========================== */

function showWheel(){

    createWheel();

    Wheel.overlay.style.display="flex";


const className = document.querySelector(".classSelect").value;

    loadWheelStudents();

    if (className && studentData[className]) {
        const tile = document.querySelector(".studentTile");
        const tileName = tile ? tile.textContent.trim() : "";
        
        // If tile has a valid student name from this class, use it; otherwise default to the first student in the loaded wheel array
        if(tileName && tileName !== "Student" && Wheel.students.some(s => s.name === tileName)){
            Wheel.currentName = tileName;
        } else if(Wheel.students.length > 0){
            Wheel.currentName = Wheel.students[0].name;
        }
    } else {
        Wheel.currentName = null;
    }


    /*
        Align current student with pointer
        when wheel opens.
    */

    const targetIndex =
        Wheel.students.findIndex(
            s => s.name === Wheel.currentName
        );


    if(targetIndex >= 0 && Wheel.students.length){

        const slice =
            (Math.PI * 2) / Wheel.students.length;


        const studentCenter =
            (targetIndex * slice) + (slice / 2);


        /*
            Pointer is at top (-90 degrees)
        */

        Wheel.angle =
            (-Math.PI / 2) - studentCenter;

    }


    drawWheel();

}
function updateWheelClass() {
    if(Wheel.overlay && Wheel.overlay.style.display === "flex"){
        const className = document.querySelector(".classSelect").value;
        loadWheelStudents();
        
        // When class changes while wheel is open, align it to the current tile/first student of that class
        if (className && studentData[className] && Wheel.students.length > 0) {
            const tile = document.querySelector(".studentTile");
            const tileName = tile ? tile.textContent.trim() : "";
            
            if(tileName && tileName !== "Student" && Wheel.students.some(s => s.name === tileName)){
                Wheel.currentName = tileName;
            } else {
                Wheel.currentName = Wheel.students[0].name;
            }
            
            // Recalculate pointer angle to match the new student
            const targetIndex = Wheel.students.findIndex(s => s.name === Wheel.currentName);
            if(targetIndex >= 0){
                const slice = (Math.PI * 2) / Wheel.students.length;
                const studentCenter = (targetIndex * slice) + (slice / 2);
                Wheel.angle = (-Math.PI / 2) - studentCenter;
            }
        }
        drawWheel();
    }
}window.updateWheelClass = updateWheelClass;

function hideWheel(){

if(Wheel.overlay){

Wheel.overlay.style.display="none";

}

}


/* ==========================
   BUTTON
========================== */


function toggleSpinner(){

    if(
        Wheel.overlay &&

    ){

}

/* ---------------------------------------
   BRASS HUB CENTER CLICK HOTSPOT
--------------------------------------- */

document.addEventListener("click", function(e){
    if(!Wheel.overlay || Wheel.overlay.style.display !== "flex") return;
    if(e.target !== Wheel.canvas) return;

    const canvasRect = Wheel.canvas.getBoundingClientRect();
    const extraSpace = 40;
    const cx = (Wheel.size / 2) + extraSpace / 2;
    const cy = (Wheel.size / 2) + extraSpace / 2;

    const scaleX = Wheel.canvas.width / canvasRect.width;
    const scaleY = Wheel.canvas.height / canvasRect.height;
    const internalX = (e.clientX - canvasRect.left) * scaleX;
    const internalY = (e.clientY - canvasRect.top) * scaleY;

    const dx = internalX - cx;
    const dy = internalY - cy;

    // Center hub radius is 28px
    if(Math.sqrt(dx * dx + dy * dy) <= 28){
        e.stopImmediatePropagation();
        e.preventDefault();
        spinWheel();
    }
}, true);

const tmTile =

const tmDefaultColors = {

  Blue:"#93c5fd",

  Green:"#86efac",

  Orange:"#fdba74",

  Red:"#fca5a5"

};


function isColorDark(colorStr){

  if(!colorStr)
    return false;


  const rgb =
    colorStr.match(/\d+/g);


  if(
    !rgb ||
    rgb.length<3
  ){

    return false;

  }


  const brightness =
    (
      Number(rgb[0])*299 +
      Number(rgb[1])*587 +
      Number(rgb[2])*114
    ) / 1000;


  return brightness<125;

}


/*==================================================
  CLASS / COLOR-ONLY DETECTION
==================================================*/

function tmGetClass(){

  const select =
    document.querySelector(
      ".classSelect"
    );


  return select
    ? select.value.trim()
    : "";

}


function tmIsColorOnly(){

  const className =
    tmGetClass();

  if(!className)
    return true;


  if(
    typeof studentData==="undefined"
  ){

    return true;

  }


  return !studentData[className];

}


/*==================================================
  APPLY COLOR TO TALLYMAN TILE
==================================================*/

function tmApplyColor(
  colorName,
  colorValue
){

  if(!colorName)
    return;


  colorName =
    colorName.charAt(0).toUpperCase() +
    colorName.slice(1).toLowerCase();


  const bg =
    colorValue ||
    tmDefaultColors[colorName];


  tmTile.textContent =
    colorName;


  if(bg){

    tmTile.style.background =
      bg;

    tmTile.style.color =
      isColorDark(bg)
      ? "#ffffff"
      : "#111111";

  }

}


/*==================================================
  CONVERT RGB TO HEX
==================================================*/

function tmRgbToHex(r,g,b){

  return "#" +
    [r,g,b]
      .map(
        n =>
          Number(n)
            .toString(16)
            .padStart(2,"0")
      )
      .join("");

}


/*==================================================
  FIND TEAM COLOR FROM PIXEL
==================================================*/

function tmNearestTeamColor(
  r,
  g,
  b
){

  let bestName=null;

  let bestDistance=Infinity;


  Object.keys(tmDefaultColors)
  .forEach(
    name=>{

      const temp =
        document.createElement(
          "div"
        );


      temp.style.backgroundColor =
        tmDefaultColors[name];


      document.body.appendChild(
        temp
      );


      const rgb =
        getComputedStyle(
          temp
        )
        .backgroundColor
        .match(/\d+/g);


      temp.remove();


      if(!rgb)
        return;


      const dr =
        r-Number(rgb[0]);

      const dg =
        g-Number(rgb[1]);

      const db =
        b-Number(rgb[2]);


      const distance =
        dr*dr +
        dg*dg +
        db*db;


      if(distance<bestDistance){

        bestDistance=distance;

        bestName=name;

      }

    }
  );


  return bestName;

}


/*==================================================
  READ COLOR CURRENTLY UNDER SPINNER POINTER
==================================================*/

function tmReadSpinnerColor(){

  const canvas =
    document.getElementById(
      "studentWheelCanvas"
    );


  if(!canvas)
    return null;


  const ctx =
    canvas.getContext(
      "2d",
      {
        willReadFrequently:true
      }
    );


  if(!ctx)
    return null;


  const extraSpace=40;

  const cx =
    (350/2) +
    extraSpace/2;

  const cy =
    (350/2) +
    extraSpace/2;


  const sampleX =
    Math.round(cx);

  const sampleY =
    Math.round(cy-70);


  try{

    const pixel =
      ctx.getImageData(
        sampleX,
        sampleY,
        1,
        1
      )
      .data;


    if(!pixel || pixel.length<3)
      return null;


    const r=pixel[0];
    const g=pixel[1];
    const b=pixel[2];


    const max =
      Math.max(r,g,b);

    const min =
      Math.min(r,g,b);


    if(
      max<80 ||
      max-min<15
    ){

      return null;

    }


    return {
      name:
        tmNearestTeamColor(
          r,
          g,
          b
        ),

      color:
        tmRgbToHex(
          r,
          g,
          b
        )

    };

  }
  catch(e){

    return null;

  }

}

          tmTile.style.color = isColorDark(bg) ? "#ffffff" : "#111111";

      bg==="rgba(0, 0, 0, 0)" ||

    if(
      bg &&

      bg!=="transparent"

      tmTile.style.color =

}

/*==================================================
  WRAP SPINWHEEL
==================================================*/

function hookSpinner(){

  if(
    typeof window.spinWheel!=="function"
  ){

    return false;

  }


  if(
    window.spinWheel.__tallymanWrapped
  ){

    return true;

  }


  const originalSpinWheel =
    window.spinWheel;


  const wrappedSpinWheel =
    function(){

      const result =
        originalSpinWheel.apply(
          this,
          arguments
        );


      scheduleSpinnerSync();


      return result;

    };


  wrappedSpinWheel.__tallymanWrapped=true;


  window.spinWheel =
    wrappedSpinWheel;


  return true;

}


if(!hookSpinner()){

  let attempts=0;


  const spinnerHookTimer =
    setInterval(
      function(){

        attempts++;


        if(hookSpinner()){

          clearInterval(
            spinnerHookTimer
          );

        }


        if(attempts>=50){

          clearInterval(
            spinnerHookTimer
          );

const tmScores={

  Blue:0,
  Green:0,
  Orange:0,
  Red:0

};


/*==================================================
  ADD TALLY
==================================================*/

function tmAddTally(team){

  tmScores[team]++;


  const area =
    document.querySelector(
      '.tmTallies[data-team="'+team+'"]'
    );


  if(!area)
    return;


  let groups =
    area.querySelectorAll(
      ".tmGroup"
    );


  let group =
    groups[groups.length-1];


  if(
    !group ||
    Number(group.dataset.count)>=5
  ){

    group =
      document.createElement(
        "div"
      );

    group.className=
      "tmGroup";

    group.dataset.count=0;

    area.appendChild(
      group
    );

  }


  let count =
    Number(group.dataset.count);


  if(count<4){

    const stick =
      document.createElement(
        "div"
      );

    stick.className=
      "tmStick";

    group.appendChild(
      stick
    );

  }


  count++;


  if(count===5){

    const svg =
      document.createElementNS(
        "http://www.w3.org/2000/svg",
        "svg"
      );


    svg.setAttribute(
      "viewBox",
      "0 0 20 20"
    );


    svg.innerHTML=`
<line
  x1="1"
  y1="1"
  x2="19"
  y2="19"
  stroke="#111"
  stroke-width="2.5"
  stroke-linecap="round"
/>
`;


    group.appendChild(
      svg
    );

  }


  group.dataset.count=
    count;


  document.getElementById(
    "tmScore"+team
  ).textContent=
    tmScores[team];

}


/*==================================================
  DELETE TALLY
==================================================*/

function tmDeleteTally(team){

  if(
    tmScores[team]===0
  ){

    return;

  }


  tmScores[team]--;


  const area =
    document.querySelector(
      '.tmTallies[data-team="'+team+'"]'
    );


  if(!area)
    return;


  const groups =
    area.querySelectorAll(
      ".tmGroup"
    );


  if(!groups.length)
    return;


  const group =
    groups[groups.length-1];


  let count =
    Number(
      group.dataset.count
    );


  if(count===5){

    const svg =
      group.querySelector(
        "svg"
      );


    if(svg)
      svg.remove();

  }
  else{

    const sticks =
      group.querySelectorAll(
        ".tmStick"
      );


    if(sticks.length){

      sticks[
        sticks.length-1
      ].remove();

    }

  }


  count--;


  group.dataset.count=
    count;


  if(count===0){

    group.remove();

  }


  document.getElementById(
    "tmScore"+team
  ).textContent=
    tmScores[team];

}


/*==================================================
  RESET SCORES
==================================================*/

function tmResetScores(){

  Object.keys(
    tmScores
  )
  .forEach(
    team=>{

      tmScores[team]=0;


      document.getElementById(
        "tmScore"+team
      ).textContent=0;


      const area =
        document.querySelector(
          '.tmTallies[data-team="'+team+'"]'
        );


      if(area)
        area.innerHTML="";

    }
  );

}


/*==================================================

==================================================*/

document
.querySelectorAll(".tmTallies")
.forEach(

        tmAddTally(

document

        e.stopPropagation();

        tmDeleteTally(
          btn.dataset.team
        );

      }
    );

  }
);


/*==================================================

window.tmAddTally =
