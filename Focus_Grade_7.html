<script>
(function() {
  let modalOpen = false;

  const modalContainer = document.getElementById("jellyBeanModalContainer");
  const jarWrapper = document.getElementById("jbJarWrapper");
  const jarContainer = document.getElementById("jbJarContainer");
  const beanCanvas = document.getElementById("jbBeanCanvas");
  const ctx = beanCanvas.getContext("2d");

  const scoreDisplay = document.getElementById("jbScoreDisplay");
  const mouthHotspot = document.getElementById("jbMouthHotspot");
  const jarLid = document.getElementById("jbJarLid");
  const lidHitbox = document.getElementById("jbLidHitbox");

  const saveButton = document.getElementById("jbSaveButton");
  const browseButton = document.getElementById("jbBrowseButton");
  const fileInput = document.getElementById("jbFileInput");
  const classSelect = document.getElementById("jbClassSelect");

  const MAX_BEANS = 50;
  const BEAN_RADIUS = 20.9;

  const jarBounds = {
    left: 135,
    right: 385,
    top: 175,
    bottom: 645
  };

  beanCanvas.width = 520;
  beanCanvas.height = 760;

  let beans = [];
  let score = 0;

  const BEAN_COLORS = [
    { fill: "#E74C3C" },
    { fill: "#F1C40F" },
    { fill: "#E84393" },
    { fill: "#2ECC71" },
    { fill: "#9B59B6" },
    { fill: "#E67E22" },
    { fill: "#3498DB" }
  ];

  function randomBeanColor() {
    return BEAN_COLORS[Math.floor(Math.random() * BEAN_COLORS.length)];
  }

  function updateScore() {
    scoreDisplay.textContent = score;
  }

  function toggleModal() {
    modalOpen = !modalOpen;
    modalContainer.style.display = modalOpen ? "block" : "none";
  }

  function getTargetPosition(index) {
    const maxCols = 6;
    const col = index % maxCols;
    const row = Math.floor(index / maxCols);

    const availableWidth = (jarBounds.right - 10) - (jarBounds.left + 10) - (BEAN_RADIUS * 2);
    const colSpacing = availableWidth / (maxCols - 1);

    const baseTargetX = (jarBounds.left + 10) + BEAN_RADIUS + (col * colSpacing);
    const baseFloor = (jarBounds.bottom - 5) + 15;
    const baseTargetY = baseFloor - BEAN_RADIUS - (row * (BEAN_RADIUS * 1.3));

    const jarCenterX = (jarBounds.left + jarBounds.right) / 2;
    const distanceFromCenter = Math.abs(baseTargetX - jarCenterX);
    const maxDistanceFromCenter = (jarBounds.right - jarBounds.left) / 2;
    const edgeCurveFactor = Math.min(1, distanceFromCenter / maxDistanceFromCenter);
    const edgeLift = (row === 0) ? (edgeCurveFactor * 8) : 0;

    const jitterX = Math.sin(index * 12.9898) * 12;
    const jitterY = Math.cos(index * 78.233) * 6;

    return { 
      targetX: baseTargetX + jitterX, 
      targetY: (baseTargetY - edgeLift) + jitterY 
    };
  }

  function createBean() {
    if (score >= MAX_BEANS) return;

    const { targetX, targetY } = getTargetPosition(beans.length);
    const angleJitter = (Math.sin(beans.length * 43.11) * 0.6) + ((Math.random() - 0.5) * 0.4);

    const bean = {
      x: targetX,
      y: targetY,
      targetX: targetX,
      targetY: targetY,
      angle: angleJitter,
      color: randomBeanColor(),
      alpha: 1,
      removing: false
    };

    beans.push(bean);
    score++;
    updateScore();
  }

  function removeBean() {
    if (score <= 0) return;

    let selectedBean = null;
    for (let i = beans.length - 1; i >= 0; i--) {
      if (!beans[i].removing) {
        selectedBean = beans[i];
        break;
      }
    }

    if (!selectedBean) return;

    selectedBean.removing = true;
    selectedBean.alpha = 1;

    score--;
    updateScore();

    let activeIdx = 0;
    for (const bean of beans) {
      if (!bean.removing) {
        const { targetX, targetY } = getTargetPosition(activeIdx);
        bean.targetX = targetX;
        bean.targetY = targetY;
        bean.x = targetX;
        bean.y = targetY;
        activeIdx++;
      }
    }
  }

  function updateBeans() {
    beans = beans.filter(b => !b.removing);
  }

  function drawBeans() {
    ctx.clearRect(0, 0, beanCanvas.width, beanCanvas.height);

    for (const bean of beans) {
      ctx.save();
      ctx.globalAlpha = Math.max(0, bean.alpha);
      ctx.translate(bean.x, bean.y);
      ctx.rotate(bean.angle);

      ctx.beginPath();
      ctx.moveTo(-19, -6);
      ctx.bezierCurveTo(-24, -22, 19, -25, 24, -6);
      ctx.bezierCurveTo(28, 11, -4, 25, -19, 15);
      ctx.bezierCurveTo(-26, 9, -24, 0, -19, -6);
      ctx.closePath();

      ctx.fillStyle = bean.color.fill;
      ctx.fill();

      ctx.strokeStyle = "rgba(0, 0, 0, 0.12)";
      ctx.lineWidth = 1.5;
      ctx.stroke();

      ctx.beginPath();
      ctx.ellipse(-5, -9, 9, 3.5, Math.PI / 4, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(255, 255, 255, 0.65)";
      ctx.fill();

      ctx.restore();
    }
  }

  // --- Lid Dragging Logic ---
  let lidDragging = false;
  let lidOffsetX = 0;
  let lidOffsetY = 0;
  let currentLidX = 0;
  let currentLidY = 27.5;
  let targetLidX = 0;
  let targetLidY = 27.5;

  lidHitbox.addEventListener("pointerdown", (event) => {
    event.stopPropagation();
    lidDragging = true;
    lidHitbox.setPointerCapture(event.pointerId);

    const containerRect = jarContainer.getBoundingClientRect();
    const lidRect = jarLid.getBoundingClientRect();
    
    lidOffsetX = event.clientX - lidRect.left;
    lidOffsetY = event.clientY - lidRect.top;
    
    targetLidX = lidRect.left - containerRect.left;
    targetLidY = lidRect.top - containerRect.top;
  });

  lidHitbox.addEventListener("pointermove", (event) => {
    if (!lidDragging) return;
    event.stopPropagation();
    const containerRect = jarContainer.getBoundingClientRect();
    targetLidX = event.clientX - containerRect.left - lidOffsetX;
    targetLidY = event.clientY - containerRect.top - lidOffsetY;
  });

  const stopLidDrag = (event) => {
    if (lidDragging) {
      lidDragging = false;
      try { lidHitbox.releasePointerCapture(event.pointerId); } catch (e) {}
    }
  };
  lidHitbox.addEventListener("pointerup", stopLidDrag);
  lidHitbox.addEventListener("pointercancel", stopLidDrag);

  function animate() {
    if (modalOpen) {
      currentLidX += (targetLidX - currentLidX) * 0.25;
      currentLidY += (targetLidY - currentLidY) * 0.25;

      jarLid.style.left = currentLidX + "px";
      jarLid.style.top = currentLidY + "px";
      jarLid.style.margin = "0";

      lidHitbox.style.left = currentLidX + "px";
      lidHitbox.style.top = currentLidY + "px";
      lidHitbox.style.margin = "0";

      updateBeans();
      drawBeans();
    }
    requestAnimationFrame(animate);
  }

  function getDateString() {
    const today = new Date();
    const year = today.getFullYear();
    const month = String(today.getMonth() + 1).padStart(2, "0");
    const day = String(today.getDate()).padStart(2, "0");
    return `${year}-${month}-${day}`;
  }

  saveButton.addEventListener("pointerdown", (e) => {
    e.stopPropagation();
    const selectedClass = classSelect.value;
    const filename = `${selectedClass}_${getDateString()}.txt`;
    const blob = new Blob([score.toString()], { type: "text/plain" });

    const downloadLink = document.createElement("a");
    downloadLink.href = URL.createObjectURL(blob);
    downloadLink.download = filename;
    document.body.appendChild(downloadLink);
    downloadLink.click();
    document.body.removeChild(downloadLink);
    URL.revokeObjectURL(downloadLink.href);
  });

  browseButton.addEventListener("pointerdown", (e) => {
    e.stopPropagation();
    fileInput.click();
  });

  fileInput.addEventListener("change", (event) => {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = (e) => {
      const loadedScore = parseInt(e.target.result.trim());
      if (isNaN(loadedScore) || loadedScore < 0) {
        alert("Invalid score file.");
        return;
      }

      beans = [];
      score = 0;
      updateScore();

      const amountToLoad = Math.min(loadedScore, MAX_BEANS);
      for (let i = 0; i < amountToLoad; i++) {
        createBean();
      }
    };
    reader.readAsText(file);
  });

  // Standard Natural Modal Dragging (No transforms used)
  function makeModalDraggable(el) {
    el.onpointerdown = (e) => {
      if (e.target.closest('#jbControls') || e.target.closest('#jbLidHitbox') || e.target.closest('#jbJarLid') || e.target.closest('#jbScoreDisplay') || e.target.closest('#jbMouthHotspot')) {
        return;
      }

      const rect = el.getBoundingClientRect();
      if (el.style.transform.includes("translate")) {
        el.style.transform = "none";
        el.style.left = rect.left + "px";
        el.style.top = rect.top + "px";
      }

      const startX = e.clientX;
      const startY = e.clientY;
      const initialLeft = el.offsetLeft;
      const initialTop = el.offsetTop;

      document.onpointermove = (ev) => {
        const deltaX = ev.clientX - startX;
        const deltaY = ev.clientY - startY;
        el.style.left = (initialLeft + deltaX) + "px";
        el.style.top = (initialTop + deltaY) + "px";
      };

      document.onpointerup = () => {
        document.onpointermove = null;
        document.onpointerup = null;
      };
    };
  }

  document.addEventListener("DOMContentLoaded", () => {
    let leftBtn = document.getElementById("leftBtn");
    let rightBtn = document.getElementById("rightBtn");

    if (!leftBtn) {
      leftBtn = document.createElement("button");
      leftBtn.id = "leftBtn";
      leftBtn.textContent = "Jelly Beans";
      leftBtn.style.cssText = "position:fixed; left:10px; top:50%; transform:translateY(-50%); z-index:49999; padding:10px 14px; cursor:pointer;";
      document.body.appendChild(leftBtn);
    } else {
      leftBtn.textContent = "Jelly Beans";
    }

    if (!rightBtn) {
      rightBtn = document.createElement("button");
      rightBtn.id = "rightBtn";
      rightBtn.textContent = "Jelly Beans";
      rightBtn.style.cssText = "position:fixed; right:10px; top:50%; transform:translateY(-50%); z-index:49999; padding:10px 14px; cursor:pointer;";
      document.body.appendChild(rightBtn);
    } else {
      rightBtn.textContent = "Jelly Beans";
    }

    leftBtn.onclick = (e) => {
      e.stopPropagation();
      toggleModal();
    };

    rightBtn.onclick = (e) => {
      e.stopPropagation();
      toggleModal();
    };

    mouthHotspot.addEventListener("pointerdown", (e) => {
      e.stopPropagation();
      createBean();
    });

    scoreDisplay.addEventListener("pointerdown", (e) => {
      e.stopPropagation();
      removeBean();
    });

    makeModalDraggable(jarWrapper);
    updateScore();
    animate();
  });
})();
</script>

<!-- ==========================================================
     STANDALONE NEUTRAL GREY FALLING BEAN SYSTEM
     A blurred bean shape that drops in a neutral grey tone
========================================================== -->
<script>
(function() {
  window.addEventListener("DOMContentLoaded", () => {
    const jarContainer = document.getElementById("jbJarContainer");
    const beanCanvas = document.getElementById("jbBeanCanvas");
    const scoreDisplay = document.getElementById("jbScoreDisplay");
    
    if (!jarContainer || !beanCanvas || !scoreDisplay) return;

    // 1. Create standalone cosmetic blur canvas positioned right behind the beans (z-index: 4)
    const blurCanvas = document.createElement("canvas");
    blurCanvas.id = "jbBlurCanvas";
    blurCanvas.width = 520;
    blurCanvas.height = 760;
    blurCanvas.style.cssText = "position:absolute; inset:0; width:100%; height:100%; pointer-events:none; z-index:4;";
    
    beanCanvas.style.zIndex = "3";
    jarContainer.appendChild(blurCanvas);
    const blurCtx = blurCanvas.getContext("2d");

    let impressionisticTrails = [];
    let lastKnownScore = parseInt(scoreDisplay.textContent) || 0;

    const jarBounds = { left: 135, right: 385, top: 175, bottom: 645 };
    const BEAN_RADIUS = 20.9;
    const maxCols = 6;
    
    // Fallback neutral grey color for the dropping bean
    const NEUTRAL_GREY = "#95A5A6";

    function getBeanCoordinates(scoreIndex) {
      const targetIndex = Math.max(0, scoreIndex);
      const col = targetIndex % maxCols;
      const row = Math.floor(targetIndex / maxCols);

      const availableWidth = (jarBounds.right - 10) - (jarBounds.left + 10) - (BEAN_RADIUS * 2);
      const colSpacing = availableWidth / (maxCols - 1);
      const baseTargetX = (jarBounds.left + 10) + BEAN_RADIUS + (col * colSpacing);
      const baseFloor = (jarBounds.bottom - 5) + 15;
      const baseTargetY = baseFloor - BEAN_RADIUS - (row * (BEAN_RADIUS * 1.3));

      const jarCenterX = (jarBounds.left + jarBounds.right) / 2;
      const edgeCurveFactor = Math.min(1, Math.abs(baseTargetX - jarCenterX) / ((jarBounds.right - jarBounds.left) / 2));
      const edgeLift = (row === 0) ? (edgeCurveFactor * 8) : 0;

      return {
        x: baseTargetX + (Math.sin(targetIndex * 12.9898) * 12),
        y: (baseTargetY - edgeLift) + (Math.cos(targetIndex * 78.233) * 6)
      };
    }

    // 2. Monitor score changes and use neutral grey for the falling/rising bean trail
    const observer = new MutationObserver(() => {
      const currentScore = parseInt(scoreDisplay.textContent) || 0;
      if (currentScore === lastKnownScore) return;

      const centerX = (jarBounds.left + jarBounds.right) / 2;
      const startY = jarBounds.top - 15;
      
      const targetScoreIndex = currentScore > lastKnownScore ? currentScore - 1 : currentScore;
      const targetCoord = getBeanCoordinates(targetScoreIndex);
      const endY = targetCoord.y;

      if (currentScore > lastKnownScore) {
        impressionisticTrails.push({
          x: centerX,
          y: startY,
          targetY: endY,
          color: NEUTRAL_GREY,
          alpha: 0.35,
          life: 1.0,
          decay: 0.015
        });
      } else if (currentScore < lastKnownScore) {
        impressionisticTrails.push({
          x: centerX,
          y: endY,
          targetY: startY,
          color: NEUTRAL_GREY,
          alpha: 0.35,
          life: 1.0,
          decay: 0.015
        });
      }

      lastKnownScore = currentScore;
    });

    observer.observe(scoreDisplay, { childList: true, characterData: true, subtree: true });

    // 3. Render the neutral grey blurred bean trail right behind the main beans layer
    function renderBlurTrails() {
      blurCtx.clearRect(0, 0, blurCanvas.width, blurCanvas.height);

      for (let i = impressionisticTrails.length - 1; i >= 0; i--) {
        let trail = impressionisticTrails[i];
        
        trail.y += (trail.targetY - trail.y) * 0.12;
        trail.life -= trail.decay;

        if (trail.life <= 0 || Math.abs(trail.targetY - trail.y) < 1) {
          impressionisticTrails.splice(i, 1);
          continue;
        }

        blurCtx.save();
        blurCtx.globalAlpha = trail.alpha * trail.life;
        
        blurCtx.shadowColor = trail.color;
        blurCtx.shadowBlur = 35;
        
        blurCtx.translate(trail.x, trail.y);

        blurCtx.beginPath();
        blurCtx.moveTo(-19, -6);
        blurCtx.bezierCurveTo(-24, -22, 19, -25, 24, -6);
        blurCtx.bezierCurveTo(28, 11, -4, 25, -19, 15);
        blurCtx.bezierCurveTo(-26, 9, -24, 0, -19, -6);
        blurCtx.closePath();

        blurCtx.fillStyle = trail.color;
        blurCtx.fill();

        blurCtx.restore();
      }

      requestAnimationFrame(renderBlurTrails);
    }

    renderBlurTrails();
  });
})();
</script>

<script>
(function(){

"use strict";

/*==================================================
  TALLYMAN SMOOTH DRAG & OVERLAY FIX
  VERSION 1.4 (Eliminates Jittering during Drag & Syncs Overlays)
==================================================*/

const style = document.createElement("style");
style.textContent = `
.standalone-purple-overlay {
  position: fixed !important;
  background: #9333ea !important;
  border: 2px solid #a855f7 !important;
  border-radius: 4px !important;
  pointer-events: auto !important;
  cursor: pointer !important;
  z-index: 999999 !important;

  justify-content: center !important;
  color: #ffffff !important;
  font-weight: 700 !important;
  font-size: 11px !important;
  box-shadow: 0 0 10px #9333ea !important;
  transition: background 0.2s !important;
}

.standalone-purple-overlay:hover {
  background: #7e22ce !important;
}
`;
document.head.appendChild(style);

function manageStandaloneOverlays() {
  const overlay = document.getElementById("studentWheelOverlay");
  const spinnerActive = overlay && overlay.style.display === "flex";

  const win = document.getElementById("tmWindow");
  const existingTmOverlay = document.getElementById("standaloneTmStudentOverlay");
  const existingLeftOverlay = document.getElementById("standaloneLeftColOverlay");
  const existingRightOverlay = document.getElementById("standaloneRightColOverlay");

  if (spinnerActive && win && win.classList.contains("tmOpen")) {
    // 1. Cover over the student button inside the Tallyman modal
    const tmTile = document.getElementById("tmTile");
    if (tmTile && !existingTmOverlay) {
      const tmOv = document.createElement("div");
      tmOv.id = "standaloneTmStudentOverlay";
      tmOv.className = "standalone-purple-overlay";
      tmOv.textContent = "SPIN";
      
      const rect = tmTile.getBoundingClientRect();
      tmOv.style.left = rect.left + "px";
      tmOv.style.top = rect.top + "px";
      tmOv.style.width = rect.width + "px";
      tmOv.style.height = rect.height + "px";
      document.body.appendChild(tmOv);

      tmOv.addEventListener("click", (e) => {
        e.stopPropagation();
        if (window.appController && typeof window.appController.nextColor === "function") {
          window.appController.nextColor();
        }
        if (typeof window.spinWheel === "function") {
          window.spinWheel();
        }
      });
    } else if (existingTmOverlay && tmTile) {
      const rect = tmTile.getBoundingClientRect();
      existingTmOverlay.style.left = rect.left + "px";
      existingTmOverlay.style.top = rect.top + "px";
      existingTmOverlay.style.width = rect.width + "px";
      existingTmOverlay.style.height = rect.height + "px";
    }

    // Helper to find student name elements in control columns
    const findStudentNameElement = (selectorList) => {
      for (const sel of selectorList) {
        const el = document.querySelector(sel);
        if (el) return el;
      }
      return null;
    };

    // 2. Cover over the student name element in the left control column area
    const leftStudentEl = findStudentNameElement([
      ".left-control-panel .studentTile", ".leftColumn .studentTile", "#leftColumn .studentTile",
      ".left-control-panel #studentDisplay", ".leftColumn #studentDisplay", "#leftColumn #studentDisplay",
      ".left-control-panel [data-active-student]", ".leftColumn [data-active-student]",
      ".studentTile", "#studentDisplay"
    ]);

    if (leftStudentEl && !existingLeftOverlay) {
      const leftOv = document.createElement("div");
      leftOv.id = "standaloneLeftColOverlay";
      leftOv.className = "standalone-purple-overlay";
      leftOv.textContent = "SPIN";

      const rect = leftStudentEl.getBoundingClientRect();
      leftOv.style.left = rect.left + "px";
      leftOv.style.top = rect.top + "px";
      leftOv.style.width = rect.width + "px";
      leftOv.style.height = rect.height + "px";
      document.body.appendChild(leftOv);

      leftOv.addEventListener("click", (e) => {
        e.stopPropagation();
        leftStudentEl.click();
      });
    } else if (existingLeftOverlay && leftStudentEl) {
      const rect = leftStudentEl.getBoundingClientRect();
      existingLeftOverlay.style.left = rect.left + "px";
      existingLeftOverlay.style.top = rect.top + "px";
      existingLeftOverlay.style.width = rect.width + "px";
      existingLeftOverlay.style.height = rect.height + "px";
    }

    // 3. Cover over the student name element in the right control column area
    const rightStudentEl = findStudentNameElement([
      ".right-control-panel .studentTile", ".rightColumn .studentTile", "#rightColumn .studentTile",
      ".right-control-panel #studentDisplay", ".rightColumn #studentDisplay", "#rightColumn #studentDisplay",
      ".right-control-panel [data-active-student]", ".rightColumn [data-active-student]"
    ]);

    if (rightStudentEl && !existingRightOverlay) {
      const rightOv = document.createElement("div");
      rightOv.id = "standaloneRightColOverlay";
      rightOv.className = "standalone-purple-overlay";
      rightOv.textContent = "SPIN";

      const rect = rightStudentEl.getBoundingClientRect();
      rightOv.style.left = rect.left + "px";
      rightOv.style.top = rect.top + "px";
      rightOv.style.width = rect.width + "px";
      rightOv.style.height = rect.height + "px";
      document.body.appendChild(rightOv);

      rightOv.addEventListener("click", (e) => {
        e.stopPropagation();
        rightStudentEl.click();
      });
    } else if (existingRightOverlay && rightStudentEl) {
      const rect = rightStudentEl.getBoundingClientRect();
      existingRightOverlay.style.left = rect.left + "px";
      existingRightOverlay.style.top = rect.top + "px";
      existingRightOverlay.style.width = rect.width + "px";
      existingRightOverlay.style.height = rect.height + "px";
    }

  } else {
    if (existingTmOverlay) existingTmOverlay.remove();
    if (existingLeftOverlay) existingLeftOverlay.remove();
    if (existingRightOverlay) existingRightOverlay.remove();
  }
}

/* Fix window dragging jitter by using requestAnimationFrame and direct transform/style management */
function initSmoothDrag() {
  const win = document.getElementById("tmWindow");
  const handle = document.getElementById("tmDrag");

  if (!win || !handle) return;

  let dragging = false;
  let startX = 0, startY = 0;
  let initialLeft = 0, initialTop = 0;

  handle.addEventListener("mousedown", (e) => {
    dragging = true;
    startX = e.clientX;
    startY = e.clientY;

    const rect = win.getBoundingClientRect();
    initialLeft = rect.left;
    initialTop = rect.top;

    win.style.right = "auto";
    win.style.bottom = "auto";
    win.style.left = initialLeft + "px";
    win.style.top = initialTop + "px";

    e.preventDefault();
  });

  document.addEventListener("mousemove", (e) => {
    if (!dragging) return;

    const dx = e.clientX - startX;
    const dy = e.clientY - startY;

    window.requestAnimationFrame(() => {
      win.style.left = (initialLeft + dx) + "px";
      win.style.top = (initialTop + dy) + "px";
      manageStandaloneOverlays();
    });
  });

  document.addEventListener("mouseup", () => {
    dragging = false;
  });
}

// Initialize smooth dragging once DOM is ready
if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", initSmoothDrag);
} else {
  setTimeout(initSmoothDrag, 100);
}

setInterval(manageStandaloneOverlays, 50);

console.log("Standalone Smooth Drag & Overlay Script Loaded");

})();
</script>

<script>
/* ==========================================================
   QR & HS HOTSPOT CONTROLS
   Consolidated Standalone Script
========================================================== */

document.addEventListener("DOMContentLoaded", () => {

    const viewer = document.getElementById("viewer");
    if (!viewer) return;


    /* ======================================================
       REMOVE / CLOSE HOTSPOT
    ====================================================== */

    function closeHotspots() {

        const qrExisting = viewer.querySelector(".qrHotspotImg");
        const hsExisting = viewer.querySelector(".hsHotspotImg");

        if (qrExisting) qrExisting.remove();
        if (hsExisting) hsExisting.remove();

        if (typeof selectedEl !== "undefined") {
            selectedEl = null;
        }
    }


    /* ======================================================
       CREATE HOTSPOT IMAGE
    ====================================================== */

    function createHotspot(src, className) {

        const img = document.createElement("img");

        img.src = src;
        img.className = `draggable overlayPng ${className}`;

        img.style.position = "absolute";
        img.style.width = "190px";
        img.style.zIndex = "1000000";
        img.style.boxShadow = "3px 15px 30px 10px rgba(0, 0, 0, 0.8)";
        img.style.right = "20px";
        img.style.top = "40px";

        viewer.appendChild(img);

        if (typeof enableDragging === "function") {
            enableDragging(img);
        }

        if (typeof selectedEl !== "undefined") {
            selectedEl = img;
        }

        return img;
    }


    /* ======================================================
       QR HOTSPOT
    ====================================================== */

    window.toggleQrHotspot = function() {

        const existing = viewer.querySelector(".qrHotspotImg");

        // If QR is already open, close it.
        if (existing) {

            if (typeof selectedEl !== "undefined" &&
                selectedEl === existing) {
                selectedEl = null;
            }

            existing.remove();
            return;
        }

        // Close HS first.
        const hsExisting = viewer.querySelector(".hsHotspotImg");
        if (hsExisting) hsExisting.remove();

        createHotspot(
            "PerfectlyPracticalEnglish_with_Hotspot.app.jpg",
            "qrHotspotImg"
        );
    };


    /* ======================================================
       HS HOTSPOT
    ====================================================== */

    window.toggleHsHotspot = function() {

        const existing = viewer.querySelector(".hsHotspotImg");

        // If HS is already open, close it.
        if (existing) {

            if (typeof selectedEl !== "undefined" &&
                selectedEl === existing) {
                selectedEl = null;
            }

            existing.remove();
            return;
        }

        // Close QR first.
        const qrExisting = viewer.querySelector(".qrHotspotImg");
        if (qrExisting) qrExisting.remove();

        createHotspot(
            "IEP32_FL3_PALME2746_0!92V2x8.png",
            "hsHotspotImg"
        );
    };


    /* ======================================================
       EXISTING LEFT / RIGHT BUTTONS
       
       The buttons already exist in the HTML:
         #hsLeftBtn
         #hsRightBtn
       
       We do NOT create new buttons.
    ====================================================== */

    const hsLeftBtn = document.getElementById("hsLeftBtn");
    const hsRightBtn = document.getElementById("hsRightBtn");

    if (hsLeftBtn) {
        hsLeftBtn.onclick = window.toggleHsHotspot;
    }

    if (hsRightBtn) {
        hsRightBtn.onclick = window.toggleHsHotspot;
    }


    /* ======================================================
       CLICK OUTSIDE HOTSPOT = CLOSE
    ====================================================== */

    viewer.addEventListener("pointerdown", (e) => {

        if (
            e.target === viewer ||
            e.target.id === "spread" ||
            e.target.id === "centerBar" ||
            e.target.classList.contains("pageImage")
        ) {
            closeHotspots();
        }

    });

});
</script>
