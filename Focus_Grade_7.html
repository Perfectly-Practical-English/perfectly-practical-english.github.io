<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Focus Pages</title>

<style>

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    height:100%;
    overflow:hidden;
    font-family:Arial,sans-serif;
    background:#d0d0d0;
}

/* ==========================
   MAIN LAYOUT
========================== */

#main{
    display:flex;
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 124px; /* Stops the control columns right where the tiles bar begins on load */
}
/* ==========================
   LEFT COLUMN
========================== */

#leftColumn{
    width:90px;
    min-width:90px;
    background:#ececec;
    border-right:1px solid #999;
    display:flex;
    flex-direction:column;
}

/* ==========================
   RIGHT COLUMN
========================== */

#rightColumn{
    width:90px;
    min-width:90px;
    background:#ececec;
    border-left:1px solid #999;
    display:flex;
    flex-direction:column;
}


#clearBoardBtn,
#clearBoardBtnRight{
    height:24px;
    font-size:10px;
    border:none;
    border-bottom:1px solid #999;
    cursor:pointer;
}
#pageList,
#pageListRight{
    flex:1;
    overflow-y:auto;
}


.pageBtn{
    width:100%;
    height:18px;
    border:none;
    border-bottom:1px solid #000;
    font-size:10px;
    cursor:pointer;
    padding:0;
    background:#f7f7f7;
}


.pageBtn.active{
    background:#4a90e2;
    color:white;
}
/* ==========================
   VIEWER
========================== */

#viewer{
    flex:1;
    overflow:hidden;
    background:white;
    position:relative;
    cursor: move;
}


#spread{
    position:absolute;
    top:0;
    left:0;
    height:100%;
    white-space:nowrap;
    font-size:0;
}
/* ==========================
   PAGES
========================== */

.imagePanel{
    display:inline-block;
    height:100%;
}

.imgWrap{
    width:100%;
    height:100%;
    overflow:hidden;
    position:relative;
}

.pageImage{
    display:block;
    height:100%;
    width:auto;
}

/* left page */

.leftPage{

    left:0;

    width:calc(100% + 2px);

    clip-path: inset(
        0px
        14px
        0px
        0
    );
}

/* right page */

.rightPage{

    left:-15px;

    width:calc(100% + 2px);

    clip-path: inset(
        0px
        14px
        0px
        0
    );
}

/* ==========================
   TILES
========================== */

#tilesBar{
    position: fixed;
    left: 0;
    right: 0;
    bottom: 24px;
    height: 100px;
    display: flex;
    flex-direction: column;
    border-top: 1px solid #999;
    background: #ececec;
    z-index: 9998;
    box-sizing: border-box;
}#toggleTiles{

    width:24px;

    border:none;

    border-right:1px solid #999;

    cursor:pointer;

    background:#ececec;

    font-size:12px;

    padding:0;

}

#tiles{

    flex:1;

    height:100%;

    background:white;


    display:flex;
    flex-wrap:wrap;

    gap:2px;

    padding:1px;

    overflow:auto;

    align-content:flex-start;

    justify-content:flex-start;

}
.tile{
    min-width:8ch;
    height:14px;
    line-height:14px;
    font-size:9px;

    padding:0 4px;
    margin:0;

    display:flex;
    align-items:center;
    justify-content:center;

    text-align:center;
    background:#E8D8B5;
    border:1px solid #B99F6B;
    color:#222;

    cursor:pointer;
    white-space:nowrap;
    user-select:none;
}

.tile.selected{
    background:#4a90e2;
    border-color:#2f6fb7;
    color:white;
}

#tilesResizeBar{

    height:8px;

    width:100%;

    background:#999;

    cursor:ns-resize;

    flex-shrink:0;

}




/* ==========================
   DRAGGABLES
========================== */

.draggable {
    position: absolute;
    z-index: 9999;
    cursor: move;
    user-select: none;
    -webkit-user-drag: none;
    touch-action: none;
    transition: none !important;
    animation: none !important;
    filter: none !important;
    transform: none !important;
}
.overlayPng {
    position: absolute;
    width: 140px;
    height: auto;
    background: transparent !important;
    border: none !important;
    padding: 0 !important;
    margin: 0 !important;
    display: block;
    pointer-events: auto;
    object-fit: contain;
}


img {
    -webkit-user-drag: none;
    user-drag: none;
    -webkit-touch-callout: none;
}

#viewer, #spread, .imagePanel, .imgWrap {
    user-select: none;
    -webkit-user-select: none;
    -ms-user-select: none;
}

#centerBar {
    position: absolute;
    top: 0;
    bottom: 0;
    left: 50%;
    width: 35px;
    transform: translateX(-50%);
    pointer-events: none;
    z-index: 10;

    /* solid-ish white, slightly see-through */
    background: rgba(255, 255, 255, 0.85);

    /* soft edge glow instead of transparency */
    box-shadow:
        0 0 10px rgba(255, 255, 255, 0.35),
        0 0 25px rgba(255, 255, 255, 0.15);

    /* subtle edge fade (not full transparency) */
    -webkit-mask-image: linear-gradient(
        to right,
        transparent 0%,
        black 15%,
        black 85%,
        transparent 100%
    );

    mask-image: linear-gradient(
        to right,
        transparent 0%,
        black 15%,
        black 85%,
        transparent 100%
    );
}

.pageImage {
    pointer-events: none;
}



.tileAnchor {
    transform: none !important;
}

.draggable.tile{
    min-width:6ch;
    height:10px;
    font-size:6px;
}


#deleteBtn,
#deleteBtnRight {
    width:100%;
    height:24px;
    font-size:10px;
    border:none;
    border-bottom:1px solid #999;
    cursor:pointer;
    background:#f7f7f7;
}

#scriptBar{

    position:fixed;

    left:0;
    right:0;
    bottom:0;

    height:24px;

    display:flex;
    flex-direction:row;
    align-items:stretch;

}

#scriptResizeBar{

    left:0;

    width:100%;

    height:8px;

    background:#999;

    cursor:ns-resize;

    z-index:10001;

}
#worksheetScript{

    overflow:auto;

#worksheetScript::-webkit-scrollbar{

#downloadTxtBtn{

    font-size:10px;

    border:none;

    border-left:1px solid #999;

    background:#f7f7f7;

    cursor:pointer;

    padding:0;

#downloadTxtBtn:hover{

#scriptBar.expanded{

#viewer{

/* ==========================
   MP3 BUTTONS
========================== */

.mp3Tile{

========================== */

background:#000;

height:24px;

#leftColumn *,
#rightColumn * {

/* Set the default white background for buttons, inputs, selects, and flyouts */

/* Pastel orange when clicked / active */

function(e){

    const file =
    e.target.files[0];

    if(!file) return;

    const reader =
    new FileReader();

    reader.onload =
    function(evt){

        pngData =

        placeMode = "png";
    };

    reader.readAsDataURL(file);
});

function updateTransform(){
spread.style.transform =
    `translate(${panX}px, ${panY}px) scale(${viewerScale})`;
spread.style.transformOrigin = "0 0";
}

/* ==========================
   PAN (CLEAN CAMERA STYLE)
========================== */

let isPanning = false;
let lastX = 0;
let lastY = 0;

viewer.addEventListener("pointerdown", (e) => {

    // Ignore placed overlays
    if(e.target.classList.contains("draggable")){
        return;
    }

    // Ignore placement clicks
    if(placeMode){
        return;
    }

    if(panLocked) return;

    if(e.button !== 0) return;


    isPanning = true;

    lastX = e.clientX;
    lastY = e.clientY;

    viewer.setPointerCapture(e.pointerId);

});


viewer.addEventListener("pointermove", (e) => {
    if (panLocked) return;   // 🔒 ADD THIS LINE
    if (!isPanning) return;


    const dx = e.clientX - lastX;
    const dy = e.clientY - lastY;

    panX += dx;
    panY += dy;

lastX = e.clientX;
lastY = e.clientY;

// ==========================
// CLAMP CAMERA (ADD THIS)
// ==========================

const rect = viewer.getBoundingClientRect();

const contentW = spread.offsetWidth * viewerScale;
const contentH = spread.offsetHeight * viewerScale;

const viewW = rect.width;
const viewH = rect.height;

// X axis clamp
if (contentW <= viewW) {
    panX = (viewW - contentW) / 2;
} else {
    const minX = viewW - contentW;
    const maxX = 0;
    panX = Math.max(minX, Math.min(maxX, panX));
}

// Y axis clamp
if (contentH <= viewH) {
    panY = (viewH - contentH) / 2;
} else {
    const minY = viewH - contentH;
    const maxY = 0;
    panY = Math.max(minY, Math.min(maxY, panY));
}

updateTransform();
}, true);

/* ==========================
   MOUSE WHEEL / TRACKPAD PAN
========================== */

viewer.addEventListener("wheel", function(e){

    if(panLocked) return;

    e.preventDefault();

    panX -= e.deltaX;
    panY -= e.deltaY;

    updateTransform();

},
{
    passive:false
});


viewer.addEventListener("pointerup", (e) => {
    isPanning = false;
    viewer.releasePointerCapture(e.pointerId);
});

</script>

line = line.substring(1).trim();



/*

    ~I1 - filename.png

*/

let imageMatch =

if(imageMatch){

        imageMatch[2].trim();

    /*

    */

    const rect =
    spread.getBoundingClientRect();



    const x =
    (e.clientX - rect.left) / viewerScale;

    /*

else{

        obj.textContent = placeMode.value;


    }


    obj.style.left =

    obj.style.top =
    y + "px";



    spread.appendChild(obj);



    enableDragging(obj);



    selectedEl = obj;


    placeMode = null;


});



/* ==========================
   DRAGGING
========================== */

function enableDragging(el){


    el.addEventListener(
    "pointerdown",
    function(e){


        e.stopPropagation();


        selectedEl = el;



        const rect =
        spread.getBoundingClientRect();



        const offsetX =
        (e.clientX - rect.left) / viewerScale
        - parseFloat(el.style.left);



        const offsetY =
        (e.clientY - rect.top) / viewerScale
        - parseFloat(el.style.top);



        function move(ev){


            el.style.left =
            (
            (ev.clientX - rect.left) / viewerScale
            - offsetX
            )
            + "px";



            el.style.top =
            (
            (ev.clientY - rect.top) / viewerScale
            - offsetY
            )
            + "px";


        }



        function up(){


            window.removeEventListener(
                "pointermove",
                move
            );


            window.removeEventListener(
                "pointerup",
                up
            );


        }



        window.addEventListener(
            "pointermove",
            move
        );


        window.addEventListener(
            "pointerup",
            up
        );


    });


}
/* ==========================
   UNIFIED DELETE ENGINE
========================== */

function deleteSelectedTile() {

});

/* PARSE DATA */

function parseStudents(raw){


    const blocks =
    raw.split(/(?=~)/g);


    const result={};


    blocks.forEach(block=>{


        block=block.trim();


        if(!block.startsWith("~"))
            return;


        const lines =
        block.split("\n")
        .map(x=>x.trim())
        .filter(Boolean);



        const className =
        lines[0]
        .replace("~","")
        .trim();



        result[className]=[];



        for(let i=1;i<lines.length;i++){


            const parts =
            lines[i].split(/\s+/);



            const team =
            parts.shift();



            const name =
            parts.join(" ");



result[className].push({

    team:team,

function shuffle(array){

    return [...array]
    .sort(()=>Math.random()-0.5);

    currentColor = 0;

        tile.style.background =

        nextStudent();

<script>

(function(){

const Wheel={

    overlay:null,
    panel:null,
    canvas:null,
    ctx:null,

    students:[],
    angle:0,

    currentName:null,

    spinning:false,
    queuedName:null,
    size:0,
    radius:0,
    duration:2000
};
/* ==========================
   CREATE WHEEL
========================== */

function createWheel(){

    if(Wheel.overlay) return;


    const style=document.createElement("style");

    style.textContent=`

:root{
--wheel-size:350px;
}

#studentWheelOverlay{

position:fixed;
inset:0;

display:none;

align-items:center;
justify-content:center;

background:transparent;

pointer-events:none;

z-index:999999;

}


#studentWheelPanel{

position:relative;

width:calc(var(--wheel-size) + 120px);
height:calc(var(--wheel-size) + 120px);

cursor:move;

pointer-events:auto;

    touch-action:none;


display:flex;
align-items:center;
justify-content:center;

}
#studentWheelCanvas{

display:block;

width:var(--wheel-size);
height:var(--wheel-size);

transform:none;

background:transparent;

pointer-events:auto;
cursor:pointer;

}`;

document.head.appendChild(style);



Wheel.overlay=document.createElement("div");

Wheel.overlay.id="studentWheelOverlay";



Wheel.panel=document.createElement("div");

Wheel.panel.id="studentWheelPanel";



Wheel.canvas=document.createElement("canvas");

Wheel.canvas.id="studentWheelCanvas";

Wheel.size = parseInt(
    getComputedStyle(document.documentElement)
        .getPropertyValue("--wheel-size")
);

Wheel.radius = Wheel.size / 2 - 10;

const extraSpace = 40;

Wheel.canvas.width = Wheel.size + extraSpace;
Wheel.canvas.height = Wheel.size + extraSpace;
Wheel.ctx =
Wheel.canvas.getContext("2d");
Wheel.panel.appendChild(Wheel.canvas);

Wheel.overlay.appendChild(Wheel.panel);

document.body.appendChild(Wheel.overlay);



/* drag wheel */

let dragging=false;
let ox=0;
let oy=0;


Wheel.panel.addEventListener("pointerdown",e=>{

    // If clicking the center hub, let the click handler handle it instead of dragging
    const canvasRect = Wheel.canvas.getBoundingClientRect();
    const extraSpace = 40;
    const cx = (Wheel.size / 2) + extraSpace / 2;
    const cy = (Wheel.size / 2) + extraSpace / 2;
    const scaleX = Wheel.canvas.width / canvasRect.width;
    const scaleY = Wheel.canvas.height / canvasRect.height;
    const internalX = (e.clientX - canvasRect.left) * scaleX;
    const internalY = (e.clientY - canvasRect.top) * scaleY;
    const dx = internalX - cx;
    const dy = internalY - cy;

    if(Math.sqrt(dx * dx + dy * dy) <= 28){
        return; // Don't initiate drag on center hub
    }

    dragging=true;

    const r=Wheel.panel.getBoundingClientRect();

    ox=e.clientX-r.left;
    oy=e.clientY-r.top;

    Wheel.panel.setPointerCapture(e.pointerId);

});


Wheel.panel.addEventListener("pointermove",e=>{

if(!dragging)return;


Wheel.panel.style.position="fixed";

Wheel.panel.style.left=
(e.clientX-ox)+"px";

Wheel.panel.style.top=
(e.clientY-oy)+"px";


Wheel.panel.style.transform="none";


});


Wheel.panel.addEventListener("pointerup",()=>{

dragging=false;

});



/* Overlay is now click-through.
   Spinner button opens/closes it. */

}



/* ==========================
   LOAD STUDENTS
========================== */

function loadWheelStudents(){

    const className =
        document.querySelector(".classSelect").value;


    Wheel.students =
        studentData[className].map(s => ({...s}));


    /*
        Rearrange students so identical colors
        are spread apart whenever possible.
    */

    const colorGroups = {};

    Wheel.students.forEach(student=>{

        const color = student.color || "#ddd";

        if(!colorGroups[color]){
            colorGroups[color] = [];
        }

        colorGroups[color].push(student);

    });


    const groups = Object.values(colorGroups);


    Wheel.students = [];

    let lastColor = null;


    while(groups.some(g => g.length)){

        // Find the largest remaining group
        groups.sort((a,b)=>b.length-a.length);


        let selected =
            groups.find(g =>
                g.length &&
                (g[0].color || "#ddd") !== lastColor
            );


        // If no different color exists, use whatever remains
        if(!selected){
            selected =
                groups.find(g=>g.length);
        }


        const student =
            selected.shift();


        Wheel.students.push(student);

        lastColor =
            student.color || "#ddd";

    }


    const tile =
        document.querySelector(".studentTile");


    if(tile){

        Wheel.currentName =
            tile.textContent.trim();

    }

}
/* ==========================
   DRAW
========================== */
function drawWheel(){

const ctx = Wheel.ctx;

/* COMPLETE CANVAS RESET */
ctx.setTransform(1,0,0,1,0,0);

ctx.globalAlpha = 1;

ctx.shadowColor = "transparent";
ctx.shadowBlur = 0;
ctx.shadowOffsetX = 0;
ctx.shadowOffsetY = 0;

ctx.clearRect(
    0,
    0,
    Wheel.canvas.width,
    Wheel.canvas.height
);
const extraSpace = 40;

const cx = (Wheel.size/2) + extraSpace/2;
const cy = (Wheel.size/2) + extraSpace/2;

ctx.save();

ctx.shadowColor = "transparent";
ctx.shadowBlur = 0;

const students=Wheel.students;


if(!students.length)return;


const slice=
Math.PI*2/students.length;



students.forEach((s,i)=>{


const start=
Wheel.angle+i*slice;


const end=start+slice;


ctx.beginPath();

ctx.moveTo(cx,cy);

ctx.arc(
cx,
cy,
Wheel.radius,
start,
end
);

ctx.closePath();


ctx.fillStyle =
    s.color || "#ddd";

ctx.fill();


ctx.strokeStyle="#000";

ctx.lineWidth=.25;

ctx.stroke();



const mid=(start+end)/2;


ctx.save();


/* Move the label closer to the rim */

const labelRadius = Wheel.radius - 15; 

// first letter 25px from crust
ctx.translate(

    cx + Math.cos(mid) * labelRadius,

    cy + Math.sin(mid) * labelRadius

);

/* Keep the text vertical relative to its slice */

ctx.rotate(mid + Math.PI);


ctx.fillStyle="#111";

ctx.font = (Wheel.size * 0.035) + "px Arial";
ctx.textAlign="left";

ctx.textBaseline="middle";


ctx.fillText(
    s.name,
    0,
    0
);

ctx.restore();


});

ctx.restore();



/* Soft slice seams */

const fuzzySlice =
    (Math.PI * 2) / Wheel.students.length;


ctx.shadowColor = "rgba(0,0,0,0.35)";
ctx.shadowBlur = 3;

ctx.strokeStyle = "rgba(60,40,15,0.35)";
ctx.lineWidth = 1;


Wheel.students.forEach((s,i)=>{

    const seamAngle =
        Wheel.angle + i * fuzzySlice;


    ctx.beginPath();

    ctx.moveTo(cx,cy);

    ctx.lineTo(
        cx + Math.cos(seamAngle) * Wheel.radius,
        cy + Math.sin(seamAngle) * Wheel.radius
    );

    ctx.stroke();

});


ctx.restore();


/* ==========================
   BRASS METALLIC OUTER RIM
========================== */

ctx.save();

const rimWidth = 10;

const rimGradient = ctx.createRadialGradient(
    cx,
    cy,
    Wheel.radius - rimWidth,
    cx,
    cy,
    Wheel.radius + 5
);

rimGradient.addColorStop(0, "#5c3900");
rimGradient.addColorStop(0.25, "#d8a62a");
rimGradient.addColorStop(0.45, "#fff2a6");
rimGradient.addColorStop(0.65, "#c58a16");
rimGradient.addColorStop(0.85, "#8b5a05");
rimGradient.addColorStop(1, "#3b2400");


ctx.beginPath();

ctx.arc(
    cx,
    cy,
    Wheel.radius,
    0,
    Math.PI * 2
);

ctx.strokeStyle = rimGradient;
ctx.lineWidth = rimWidth;

ctx.stroke();


/* Fine highlight edge */

ctx.beginPath();

ctx.arc(
    cx,
    cy,
    Wheel.radius - rimWidth/2,
    0,
    Math.PI * 2
);

ctx.strokeStyle = "rgba(255,240,150,0.8)";
ctx.lineWidth = 1;

ctx.stroke();


ctx.restore();





/* ==========================
   FUZZY WHEEL FINISHING PASS
========================== */

ctx.save();

ctx.globalAlpha = 1;

/* Soft outer perimeter */

ctx.beginPath();

ctx.arc(
    cx,
    cy,
    Wheel.radius + 3,
    0,
    Math.PI * 2
);

ctx.strokeStyle = "rgba(40,25,5,0.45)";
ctx.lineWidth = 8;
ctx.shadowColor = "rgba(40,25,5,0.65)";
ctx.shadowBlur = 12;

ctx.stroke();


/* Brass glow around rim */

ctx.beginPath();

ctx.arc(
    cx,
    cy,
    Wheel.radius,
    0,
    Math.PI * 2
);

ctx.strokeStyle = "rgba(255,190,50,0.5)";
ctx.lineWidth = 5;
ctx.shadowColor = "rgba(255,190,50,0.8)";
ctx.shadowBlur = 8;

ctx.stroke();

/* pointer */

ctx.beginPath();

ctx.moveTo(cx,35);

ctx.lineTo(cx-10,18);

ctx.lineTo(cx+10,18);

ctx.closePath();

ctx.fillStyle="red";

ctx.fill();


/* Brass cone hub */

const hubX = cx;
const hubY = cy;

ctx.save();

/* Shadow under cone */
ctx.beginPath();
ctx.arc(
    hubX + 3,
    hubY + 5,
    28,
    0,
    Math.PI * 2
);

ctx.fillStyle = "rgba(0,0,0,0.35)";
ctx.fill();


/* Cone body - radial metallic brass */
const brass = ctx.createRadialGradient(
    hubX - 8,
    hubY - 10,
    3,
    hubX,
    hubY,
    30
);

brass.addColorStop(0, "#fff2a6");   // bright brass reflection
brass.addColorStop(0.15, "#ffd34e");
brass.addColorStop(0.35, "#c58a16");
brass.addColorStop(0.65, "#8b5a05");
brass.addColorStop(0.85, "#d8a62a");
brass.addColorStop(1, "#5c3900");


ctx.beginPath();

ctx.arc(
    hubX,
    hubY,
    28,
    0,
    Math.PI * 2
);

ctx.fillStyle = brass;
ctx.fill();


/* Cone rim */
ctx.beginPath();

ctx.arc(
    hubX,
    hubY,
    28,
    0,
    Math.PI * 2
);

ctx.strokeStyle = "#5a3500";
ctx.lineWidth = 2;
ctx.stroke();


/* Top bevel ring */
ctx.beginPath();

ctx.arc(
    hubX,
    hubY,
    20,
    0,
    Math.PI * 2
);

ctx.strokeStyle = "rgba(255,240,150,0.8)";
ctx.lineWidth = 2;
ctx.stroke();


/* Center shine */
ctx.beginPath();

ctx.arc(
    hubX - 7,
    hubY - 8,
    7,
    0,
    Math.PI * 2
);

ctx.fillStyle = "rgba(255,255,220,0.55)";
ctx.fill();


ctx.restore();




}



/* ==========================
   SPIN
========================== */

function spinWheel(){


if(Wheel.spinning){

    return;

}

Wheel.spinning=true;

if(window.startSpinnerSound){
    startSpinnerSound();
}
loadWheelStudents();


if(!Wheel.students.length){

Wheel.spinning=false;
if(window.stopSpinnerSound) stopSpinnerSound();

return;

}



let start=
performance.now();


let startAngle=
Wheel.angle;



const slice =
    (Math.PI * 2) / Wheel.students.length;


// Trigger the control panel selection logic (same as clicking the control panel button or student tile)
const mainGenBtn = document.querySelector("#randomBtn, .random-btn, [data-random-student], #generateBtn, .studentTile");
if(mainGenBtn && typeof mainGenBtn.click === "function" && !mainGenBtn.classList.contains("studentTile")){
    mainGenBtn.click();
} else if(typeof window.nextStudent === "function"){
    window.nextStudent();
}

const tile = document.querySelector(".studentTile");
if(tile){
    Wheel.currentName = tile.textContent.trim();
}



/*
   Aim the CENTER of the student's slice
   at the pointer.
*/

const targetIndex =
    Wheel.students.findIndex(
        s => s.name === Wheel.currentName
    );


if(targetIndex < 0){

    Wheel.spinning=false;
    if(window.stopSpinnerSound) stopSpinnerSound();
    return;

}


const studentAngle =
    (targetIndex * slice) +
    (slice / 2);

const pointerAngle =
    -Math.PI / 2;

/* Angle needed to line the student's slice up
   with the pointer. */
let offset =
    pointerAngle - studentAngle - startAngle;

/* Keep it positive so we never spin backwards. */
offset =
    ((offset % (Math.PI * 2)) + (Math.PI * 2)) %
    (Math.PI * 2);

/* Always spin at least 3 complete turns first. */
const minimumTurns = 7;

let target =
    startAngle +
    (minimumTurns * Math.PI * 2) +
    offset;
function animate(now){


let p=
(now-start)/Wheel.duration;


if(p>1)p=1;


let ease=
1-Math.pow(1-p,5);


Wheel.angle=
startAngle+
(target-startAngle)*ease;


drawWheel();



if(p<1){

requestAnimationFrame(animate);

}

else{

Wheel.spinning=false;

if(window.stopSpinnerSound){
    stopSpinnerSound();
}

/* Advance to the same student
   the wheel just landed on */

loadWheelStudents();

drawWheel();

}
}


requestAnimationFrame(animate);


}


/* ==========================
   SHOW / HIDE
========================== */

function showWheel(){

    createWheel();

    Wheel.overlay.style.display="flex";


    /* Load current student tile as starting position */

    const tile =
        document.querySelector(".studentTile");

    if(tile){

        const name =
            tile.textContent.trim();

        if(name && name !== "Student"){

            Wheel.currentName = name;

        }
        else{

            /*
               No selected student:
               allow spinner to choose normally
            */

            Wheel.currentName = null;

        }

    }


    loadWheelStudents();


    /*
       Align current student with pointer
       when wheel opens.
    */

    const targetIndex =
        Wheel.students.findIndex(
            s => s.name === Wheel.currentName
        );


    if(targetIndex >= 0 && Wheel.students.length){

        const slice =
            (Math.PI * 2) / Wheel.students.length;


        const studentCenter =
            (targetIndex * slice) + (slice / 2);


        /*
           Pointer is at top (-90 degrees)
        */

        Wheel.angle =
            (-Math.PI / 2) - studentCenter;

    }


    drawWheel();

}
function hideWheel(){

if(Wheel.overlay){

Wheel.overlay.style.display="none";

}

}



/* ==========================
   BUTTON
========================== */


function toggleSpinner(){

    if(
        Wheel.overlay &&
        Wheel.overlay.style.display === "flex"
    ){
        hideWheel();
    }
    else{
        showWheel();
    }

}

const leftSpinner =
document.getElementById("spinnerBtn");

if(leftSpinner){
    leftSpinner.onclick = toggleSpinner;
}

const rightSpinner =
document.getElementById("spinnerBtnRight");

if(rightSpinner){
    rightSpinner.onclick = toggleSpinner;
}

/* make available */

window.spinWheel = spinWheel;
window.hideWheel = hideWheel;

/* ---------------------------------------
   BRASS HUB CENTER CLICK HOTSPOT
--------------------------------------- */

document.addEventListener("click", function(e){
    if(!Wheel.overlay || Wheel.overlay.style.display !== "flex") return;
    if(e.target !== Wheel.canvas) return;

    const canvasRect = Wheel.canvas.getBoundingClientRect();
    const extraSpace = 40;
    const cx = (Wheel.size / 2) + extraSpace / 2;
    const cy = (Wheel.size / 2) + extraSpace / 2;

    const scaleX = Wheel.canvas.width / canvasRect.width;
    const scaleY = Wheel.canvas.height / canvasRect.height;
    const internalX = (e.clientX - canvasRect.left) * scaleX;
    const internalY = (e.clientY - canvasRect.top) * scaleY;

    const dx = internalX - cx;
    const dy = internalY - cy;

    // Center hub radius is 28px
    if(Math.sqrt(dx * dx + dy * dy) <= 28){
        e.stopImmediatePropagation();
        e.preventDefault();
        spinWheel();
    }
}, true);

/* ---------------------------------------
   WATCH STUDENT TILE CLICKS
--------------------------------------- */

document.addEventListener("click", function(e){

    if(
        e.target.classList.contains("studentTile")
    ){

        /* BLOCK TILE ADVANCE WHILE SPINNER IS RUNNING */
        if(Wheel.spinning){

            e.stopImmediatePropagation();
            e.preventDefault();

            return;

        }


        if(
            Wheel.overlay &&
            Wheel.overlay.style.display==="flex"
        ){

            setTimeout(()=>{

                loadWheelStudents();

                spinWheel();

            },50);

        }

    }

}, true);
})();

</script>
<script>

/* ==========================
   BREAK TIMER MODAL
========================== */


let breakInterval=null;
let breakRemaining=300;


function openBreakModal(){

    const modal = document.getElementById("breakModal");


    if(modal.style.display === "block"){

        // hide modal
        modal.style.display = "none";

        // optionally stop timer
        clearInterval(breakInterval);
        breakInterval = null;

        return;
    }


    // show modal
    modal.style.display = "block";

    startBreak();

}

function renderBreak(){

    let m=Math.floor(breakRemaining/60);

    let s=String(breakRemaining%60)
        .padStart(2,"0");

    document.getElementById("breakTimer")
        .textContent=`${m}:${s}`;

}

function adjustBreakTime(amount){

    /*
       If timer is finished,
       start a new countdown.
    */

    if(breakRemaining <= 0){

        startBreak(amount);

    }
    else{

        /*
           Add time to current countdown.
        */

        breakRemaining += amount;

        renderBreak();

    }


    /*
       Restart audio whenever + button is clicked.
    */

    if(typeof restartMusicAfterExtension === "function"){

        restartMusicAfterExtension();

    }

}



function startBreak(duration=300){

    clearInterval(breakInterval);


    /*
       Start new countdown duration.
       Works after Time's up.
    */

    breakRemaining = duration;

    renderBreak();


    breakInterval = setInterval(()=>{

        breakRemaining--;

        renderBreak();


        if(breakRemaining <= 0){

            clearInterval(breakInterval);

            breakInterval = null;


            document
            .getElementById("breakTimer")
            .textContent = "Time's up!";


            /*
               Keep value at zero so
               next + click starts a new break.
            */

            breakRemaining = 0;

        }

    },1000);

}

document
.getElementById("breakStart")
.onclick=()=>startBreak();

document
.getElementById("breakPlus")
.onclick=()=>adjustBreakTime(60);


document
.getElementById("breakMinus")
.onclick=()=>adjustBreakTime(-60);



/* ==========================
   DRAGGABLE BREAK MODAL
========================== */

(function(){

let modal=document.getElementById("breakModal");

let dragging=false;

let offsetX=0;
let offsetY=0;


modal.addEventListener("mousedown",e=>{

    dragging=true;

    offsetX=e.clientX-modal.offsetLeft;
    offsetY=e.clientY-modal.offsetTop;

});


document.addEventListener("mousemove",e=>{

    if(!dragging)return;


    modal.style.left=
        (e.clientX-offsetX)+"px";


    modal.style.top=
        (e.clientY-offsetY)+"px";


    modal.style.transform="none";

});


document.addEventListener("mouseup",()=>{

    dragging=false;

});


})();

========================================== */

function initSound(){

    if(PlacementSound.audio)
        return;


    PlacementSound.audio =
    document.createElement("audio");


    PlacementSound.audio.src =
        PlacementSound.file;


    PlacementSound.audio.volume =
        PlacementSound.volume;


    PlacementSound.audio.preload="auto";


    document.body.appendChild(
        PlacementSound.audio
    );

}



/* ==========================================
   PLAY SOUND
========================================== */

function playPlacementSound(){

    initSound();


    PlacementSound.audio.pause();


    PlacementSound.audio.currentTime=0;


    PlacementSound.audio.play()
    .catch(err=>{

        console.log(
            "Placement sound waiting for user interaction"
        );

    });

}



/* ==========================================
   WATCH FOR NEW TILES
========================================== */

function startWatcher(){


    const spread =
        document.getElementById("spread");


    if(!spread)
        return;



    const observer =
    new MutationObserver(function(records){


        records.forEach(record=>{


            record.addedNodes.forEach(node=>{


                if(
                    node.nodeType === 1 &&
                    node.classList.contains("draggable")
                ){

                    playPlacementSound();

                }


            });


        });


    });



    observer.observe(
        spread,
        {
            childList:true
        }
    );


}



/* ==========================================
   START
========================================== */

window.addEventListener(
"DOMContentLoaded",
startWatcher
);



/* expose control */

window.PlacementSound =
    PlacementSound;


})();

<script>
/* ==========================================
   SPINNER MP3 PLAYER
   Standalone
========================================== */

(function () {

    const spinnerSound = new Audio("freesound_community-spinner-sound-36693.mp3");

    spinnerSound.loop = true;
    spinnerSound.preload = "auto";
    spinnerSound.volume = .05;

    let isPlaying = false;

    function startSpinnerSound() {

        if (isPlaying) return;

        isPlaying = true;

        spinnerSound.pause();
        spinnerSound.currentTime = 0;

        const playPromise = spinnerSound.play();

        if (playPromise !== undefined) {
            playPromise.catch(err => {
                console.error("Spinner sound failed:", err);
                isPlaying = false;
            });
        }

    }

    function stopSpinnerSound() {

        if (!isPlaying) return;

        isPlaying = false;

        spinnerSound.pause();
        spinnerSound.currentTime = 0;

    }

    /* Optional: preload once after the first user interaction */
    function unlockAudio() {

        spinnerSound.play()
            .then(() => {
                spinnerSound.pause();
                spinnerSound.currentTime = 0;
            })
            .catch(() => {});

        document.removeEventListener("pointerdown", unlockAudio);
    }

    document.addEventListener("pointerdown", unlockAudio, { once: true });

    window.startSpinnerSound = startSpinnerSound;
    window.stopSpinnerSound = stopSpinnerSound;

})();
</script>

        musicTimer = setInterval(()=>{

        if (mainGenBtn) mainGenBtn.click();
    }
}

// Determines if a background color is dark to automatically adjust text color for contrast
function isColorDark(colorStr) {
    let rgb = colorStr.match(/\d+/g);
    if (!rgb || rgb.length < 3) return false;
    let brightness = (Number(rgb[0]) * 299 + Number(rgb[1]) * 587 + Number(rgb[2]) * 114) / 1000;
    return brightness < 125;
}

// Scans the main page control column / UI for the active student element, updating text and styling color
function updateTmTileFromControlColumn() {
    try {
        const controlCol = document.querySelector("#controlColumn, .control-column, aside, .sidebar") || document.body;
        const candidates = controlCol.querySelectorAll("div, span, h1, h2, h3, h4");
        
        for (let el of candidates) {
            if (el.id === "tmWindow" || el.closest("#tmWindow")) continue;
            
            const idClass = (el.id + " " + el.className).toLowerCase();
            if (idClass.includes("student") || idClass.includes("name") || idClass.includes("display") || idClass.includes("tile")) {
                const text = el.textContent.trim();
                if (text && text.length > 0 && text.length < 35 && !text.includes("Tallyman") && !text.includes("Scoreboard")) {
                    tmTile.textContent = text;
                    
                    // Extract background style/color from the matched student element in the main logic
                    const computed = window.getComputedStyle(el);
                    const bg = computed.backgroundColor;
                    
                    if (bg && bg !== "rgba(0, 0, 0, 0)" && bg !== "transparent") {
                        tmTile.style.background = bg;
                        tmTile.style.color = isColorDark(bg) ? "#ffffff" : "#111111";
                    } else {
                        // Fallback if background is on an inline style attribute
                        const inlineBg = el.style.backgroundColor || el.style.background;
                        if (inlineBg) {
                            tmTile.style.background = inlineBg;
                            tmTile.style.color = isColorDark(inlineBg) ? "#ffffff" : "#111111";
                        }
                    }
                    break;
                }
            }
        }
    } catch(e) {
        // Fail silently to keep application stable
    }
}

// Continuous check to sync name and color instantly

tmTile.addEventListener("click", function() {
    tmTriggerExternalNext();

const tmScores = { Blue:0, Green:0, Orange:0, Red:0 };

function tmAddTally(team){
    tmScores[team]++;
    const area = document.querySelector('.tmTallies[data-team="'+team+'"]');
    if(!area) return;

    let groups = area.querySelectorAll(".tmGroup");
    let group = groups[groups.length-1];

    if(!group || Number(group.dataset.count)>=5){
        group = document.createElement("div");
        group.className = "tmGroup";
        group.dataset.count = 0;
        area.appendChild(group);
    }

    let count = Number(group.dataset.count);
    if(count<4){
        const stick = document.createElement("div");
        stick.className = "tmStick";
        group.appendChild(stick);
    }
    count++;

    if(count===5){
        const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        svg.setAttribute("viewBox", "0 0 20 20");
        svg.innerHTML=`<line x1="2" y1="2" x2="18" y2="18" stroke="#111" stroke-width="2" stroke-linecap="round"/>`;
        group.appendChild(svg);
    }

    group.dataset.count = count;
    document.getElementById("tmScore"+team).textContent = tmScores[team];
}

function tmDeleteTally(team){
    if(tmScores[team]===0) return;
    tmScores[team]--;
    const area = document.querySelector('.tmTallies[data-team="'+team+'"]');
    if(!area) return;

    const groups = area.querySelectorAll(".tmGroup");
    if(!groups.length) return;

    const group = groups[groups.length-1];
    let count = Number(group.dataset.count);

    if(count===5){
        const svg = group.querySelector("svg");
        if(svg) svg.remove();
    } else {
        const sticks = group.querySelectorAll(".tmStick");
        if(sticks.length) sticks[sticks.length-1].remove();
    }

    count--;
    group.dataset.count = count;
    if(count===0){
        group.remove();
    }
    document.getElementById("tmScore"+team).textContent = tmScores[team];
}

function tmResetScores(){
    Object.keys(tmScores).forEach(team=>{
        tmScores[team]=0;
        document.getElementById("tmScore"+team).textContent = 0;
        const area = document.querySelector('.tmTallies[data-team="'+team+'"]');
        if(area) area.innerHTML="";
    });
}

document.querySelectorAll(".tmTallies").forEach(panel=>{
    panel.addEventListener("click", function(){
        tmAddTally(panel.dataset.team);
    });
});

document.querySelectorAll(".tmDelete").forEach(btn=>{
    btn.addEventListener("click", function(e){
        e.stopPropagation();
        tmDeleteTally(btn.dataset.team);
    });

<script>
(function(){

"use strict";

/*========================================
 TALLYMAN AUDIO OBSERVER
 No Tallyman edits required
========================================*/

let count = -1;
let audio = null;

function initAudio(){
    if(!audio){
        audio = new (window.AudioContext || window.webkitAudioContext)();
    }
    if(audio.state==="suspended"){
        audio.resume();
    }
}

/*========================================
 PENCIL SCRATCH
========================================*/

function pencilScratch(){
    initAudio();
    const ctx=audio;
    const duration=.18;

    const buffer = ctx.createBuffer(
        1,
        ctx.sampleRate*duration,
        ctx.sampleRate
    );

    const data = buffer.getChannelData(0);

    for(let i=0;i<data.length;i++){
        data[i]=
        (Math.random()*2-1)
        *
        (1-i/data.length)
        *
        .35;
    }

    const source = ctx.createBufferSource();
    const filter = ctx.createBiquadFilter();
    const gain = ctx.createGain();

    filter.type="bandpass";
    filter.frequency.value=2800;

    gain.gain.value=.35;

    source.buffer=buffer;

    source
    .connect(filter)
    .connect(gain)
    .connect(ctx.destination);

    source.start();
}

/*========================================
 WATCH TALLY STROKES
========================================*/

const observer = new MutationObserver(function(){
    const groups = document.querySelectorAll(".tmGroup");
    let total = 0;

    groups.forEach(group=>{
        total += Number(group.dataset.count || 0);
    });

    if(total !== count){
        // Only trigger scratch if the total is increasing (a tally mark was made)
        if(total > count && count !== -1){
            pencilScratch();
        }
        count = total;
    }
});

function start(){
    const board = document.querySelector("#tmScoreboard");

    if(!board){
        setTimeout(start,500);
        return;
    }

    observer.observe(
        board,
        {
            childList:true,
            subtree:true
        }
    );

    console.log(
        "Tallyman audio observer loaded"
    );
}

start();

})();
</script>

<script>

(function(){

/*==================================================
 TALLYMAN SOUND FX ADD-ON
 Pencil Scratch + Fairy Dust
==================================================*/


const TMSoundFX = {



audio:null,


init:function(){

    if(!this.audio){

        this.audio =
        new (window.AudioContext ||
             window.webkitAudioContext)();

    }


    if(this.audio.state==="suspended"){

        this.audio.resume();

    }

},



/*----------------------------------
 SINGLE PENCIL SCRATCH
----------------------------------*/

pencil:function(){

    this.init();

    const ctx=this.audio;


    const duration=0.22;


    const buffer =
    ctx.createBuffer(
        1,
        ctx.sampleRate * duration,
        ctx.sampleRate
    );


    const data =
    buffer.getChannelData(0);



    for(let i=0;i<data.length;i++){

        const fade =
        1 - (i/data.length);


        data[i] =
        (Math.random()*2-1)
        *
        fade
        *
        0.35;

    }



    const source =
    ctx.createBufferSource();


    const filter =
    ctx.createBiquadFilter();


    const gain =
    ctx.createGain();



    filter.type="bandpass";

    filter.frequency.value=2800;

    filter.Q.value=2.5;



    gain.gain.setValueAtTime(
        0.001,
        ctx.currentTime
    );


    gain.gain.exponentialRampToValueAtTime(
        0.35,
        ctx.currentTime+0.015
    );


    gain.gain.exponentialRampToValueAtTime(
        0.001,
        ctx.currentTime+duration
    );



    source.buffer=buffer;


    source
    .connect(filter)
    .connect(gain)
    .connect(ctx.destination);



    source.start();

},




/*----------------------------------
 FAIRY DUST BLING
----------------------------------*/

fairy:function(){

    this.init();


    const ctx=this.audio;


    const notes=[
        1200,
        1600,
        2200
    ];


    notes.forEach((freq,index)=>{


        const osc =
        ctx.createOscillator();


        const gain =
        ctx.createGain();



        osc.type="sine";


        osc.frequency.value=freq;



        gain.gain.setValueAtTime(
            0.001,
            ctx.currentTime
        );


        gain.gain.exponentialRampToValueAtTime(
            0.18,
            ctx.currentTime+0.02+(index*.04)
        );


        gain.gain.exponentialRampToValueAtTime(
            0.001,
            ctx.currentTime+0.35+(index*.05)
        );



        osc
        .connect(gain)
        .connect(ctx.destination);



        osc.start(
            ctx.currentTime+(index*.04)
        );


        osc.stop(
            ctx.currentTime+0.5
        );


    });

}



};

 WAIT FOR TALLYMAN

let audioCtx = null;



function initAudio(){

    if(!audioCtx){

        audioCtx =
        new (window.AudioContext || window.webkitAudioContext)();

    }


    if(audioCtx.state === "suspended"){

        audioCtx.resume();

    }

}



/* ==========================
   UPDATE DISPLAY
========================== */

function update(){

    let m=Math.floor(seconds/60);

    let s=seconds%60;


    display.textContent =
    String(m).padStart(2,"0")
    +":"
    +String(s).padStart(2,"0");

}



/* ==========================
   ELECTRONIC BUZZER
========================== */

function playBuzzer(){

    if(!audioCtx)
        return;


    const osc =
    audioCtx.createOscillator();


    const gain =
    audioCtx.createGain();


    osc.type="square";

    osc.frequency.value=900;


    gain.gain.setValueAtTime(
        0.3,
        audioCtx.currentTime
    );


    gain.gain.exponentialRampToValueAtTime(
        0.001,
        audioCtx.currentTime + 0.8
    );


    osc.connect(gain);

    gain.connect(audioCtx.destination);


    osc.start();

    osc.stop(
        audioCtx.currentTime + 0.8
    );

}



/* ==========================
   START COUNTDOWN
========================== */

function start(){

    if(interval)
        clearInterval(interval);


    interval=setInterval(()=>{


        seconds--;

        update();


        if(seconds<=0){


            clearInterval(interval);

            interval=null;


            seconds=0;

            update();


            playBuzzer();


        }


    },1000);

}



/* ==========================
   CONTROLS
========================== */


document.getElementById("miniUp")
.onclick=function(){

    initAudio();


    seconds+=60;


    update();


    start();

};



document.getElementById("miniDown")
.onclick=function(){

    initAudio();


    seconds-=60;


    if(seconds<0)
        seconds=0;


    update();


    if(seconds>0)
        start();

};



update();



})();

</script>

<script>
(function() {
  let modalOpen = false;

  const modalContainer = document.getElementById("jellyBeanModalContainer");
  const jarWrapper = document.getElementById("jbJarWrapper");
  const jarContainer = document.getElementById("jbJarContainer");
  const beanCanvas = document.getElementById("jbBeanCanvas");
  const ctx = beanCanvas.getContext("2d");

  const scoreDisplay = document.getElementById("jbScoreDisplay");
  const mouthHotspot = document.getElementById("jbMouthHotspot");
  const jarLid = document.getElementById("jbJarLid");
  const lidHitbox = document.getElementById("jbLidHitbox");

  const saveButton = document.getElementById("jbSaveButton");
  const browseButton = document.getElementById("jbBrowseButton");
  const fileInput = document.getElementById("jbFileInput");
  const classSelect = document.getElementById("jbClassSelect");

  const MAX_BEANS = 350;
  const BEAN_RADIUS = 20.9;

  const jarBounds = {
    left: 135,
    right: 385,
    top: 175,
    bottom: 645
  };

  beanCanvas.width = 520;
  beanCanvas.height = 760;

  let beans = [];
  let score = 0;

  const BEAN_COLORS = [
    { fill: "#E74C3C" },
    { fill: "#F1C40F" },
    { fill: "#E84393" },
    { fill: "#2ECC71" },
    { fill: "#9B59B6" },
    { fill: "#E67E22" },
    { fill: "#3498DB" }
  ];

  function randomBeanColor() {
    return BEAN_COLORS[Math.floor(Math.random() * BEAN_COLORS.length)];
  }

  function updateScore() {
    scoreDisplay.textContent = score;
  }

  function toggleModal() {
    modalOpen = !modalOpen;
    modalContainer.style.display = modalOpen ? "block" : "none";
  }

  function getTargetPosition(index) {
    const maxCols = 6;
    const col = index % maxCols;
    const row = Math.floor(index / maxCols);

    const availableWidth = (jarBounds.right - 10) - (jarBounds.left + 10) - (BEAN_RADIUS * 2);
    const colSpacing = availableWidth / (maxCols - 1);

    const baseTargetX = (jarBounds.left + 10) + BEAN_RADIUS + (col * colSpacing);
    const baseFloor = (jarBounds.bottom - 5) + 15;
    const baseTargetY = baseFloor - BEAN_RADIUS - (row * (BEAN_RADIUS * 1.3));

    const jarCenterX = (jarBounds.left + jarBounds.right) / 2;
    const distanceFromCenter = Math.abs(baseTargetX - jarCenterX);
    const maxDistanceFromCenter = (jarBounds.right - jarBounds.left) / 2;
    const edgeCurveFactor = Math.min(1, distanceFromCenter / maxDistanceFromCenter);
    const edgeLift = (row === 0) ? (edgeCurveFactor * 8) : 0;

    const jitterX = Math.sin(index * 12.9898) * 12;
    const jitterY = Math.cos(index * 78.233) * 6;

    return { 
      targetX: baseTargetX + jitterX, 
      targetY: (baseTargetY - edgeLift) + jitterY 
    };
  }

  function createBean() {
    if (score >= MAX_BEANS) return;

    const { targetX, targetY } = getTargetPosition(beans.length);
    const angleJitter = (Math.sin(beans.length * 43.11) * 0.6) + ((Math.random() - 0.5) * 0.4);

    const bean = {
      x: targetX,
      y: targetY,
      targetX: targetX,
      targetY: targetY,
      angle: angleJitter,
      color: randomBeanColor(),
      alpha: 1,
      removing: false
    };

    beans.push(bean);
    score++;
    updateScore();
  }

  function removeBean() {
    if (score <= 0) return;

    let selectedBean = null;
    for (let i = beans.length - 1; i >= 0; i--) {
      if (!beans[i].removing) {
        selectedBean = beans[i];
        break;
      }
    }

    if (!selectedBean) return;

    selectedBean.removing = true;
    selectedBean.alpha = 1;

    score--;
    updateScore();

    let activeIdx = 0;
    for (const bean of beans) {
      if (!bean.removing) {
        const { targetX, targetY } = getTargetPosition(activeIdx);
        bean.targetX = targetX;
        bean.targetY = targetY;
        bean.x = targetX;
        bean.y = targetY;
        activeIdx++;
      }
    }
  }

function updateBeans() {
    // Instantly remove beans without flying up or moving positions
    beans = beans.filter(b => !b.removing);
  }

  function drawBeans() {
    ctx.clearRect(0, 0, beanCanvas.width, beanCanvas.height);

    for (const bean of beans) {
      ctx.save();
      ctx.globalAlpha = Math.max(0, bean.alpha);
      ctx.translate(bean.x, bean.y);
      ctx.rotate(bean.angle);

      ctx.beginPath();
      ctx.moveTo(-19, -6);
      ctx.bezierCurveTo(-24, -22, 19, -25, 24, -6);
      ctx.bezierCurveTo(28, 11, -4, 25, -19, 15);
      ctx.bezierCurveTo(-26, 9, -24, 0, -19, -6);
      ctx.closePath();

      ctx.fillStyle = bean.color.fill;
      ctx.fill();

      ctx.strokeStyle = "rgba(0, 0, 0, 0.12)";
      ctx.lineWidth = 1.5;
      ctx.stroke();

      ctx.beginPath();
      ctx.ellipse(-5, -9, 9, 3.5, Math.PI / 4, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(255, 255, 255, 0.65)";
      ctx.fill();

      ctx.restore();
    }
  }

  // --- Lid Dragging Logic ---
  let lidDragging = false;
  let lidOffsetX = 0;
  let lidOffsetY = 0;
  let currentLidX = 0;
  let currentLidY = 55;
  let targetLidX = 0;
  let targetLidY = 55;

  lidHitbox.addEventListener("pointerdown", (event) => {
    event.stopPropagation();
    lidDragging = true;
    lidHitbox.setPointerCapture(event.pointerId);

    const containerRect = jarContainer.getBoundingClientRect();
    const lidRect = jarLid.getBoundingClientRect();
    
    lidOffsetX = event.clientX - lidRect.left;
    lidOffsetY = event.clientY - lidRect.top;
    
    targetLidX = lidRect.left - containerRect.left;
    targetLidY = lidRect.top - containerRect.top;
  });

  lidHitbox.addEventListener("pointermove", (event) => {
    if (!lidDragging) return;
    event.stopPropagation();
    const containerRect = jarContainer.getBoundingClientRect();
    targetLidX = event.clientX - containerRect.left - lidOffsetX;
    targetLidY = event.clientY - containerRect.top - lidOffsetY;
  });

  const stopLidDrag = (event) => {
    if (lidDragging) {
      lidDragging = false;
      try { lidHitbox.releasePointerCapture(event.pointerId); } catch (e) {}
    }
  };
  lidHitbox.addEventListener("pointerup", stopLidDrag);
  lidHitbox.addEventListener("pointercancel", stopLidDrag);

  function animate() {
    if (modalOpen) {
      currentLidX += (targetLidX - currentLidX) * 0.25;
      currentLidY += (targetLidY - currentLidY) * 0.25;

      jarLid.style.left = currentLidX + "px";
      jarLid.style.top = currentLidY + "px";
      jarLid.style.margin = "0";

      lidHitbox.style.left = currentLidX + "px";
      lidHitbox.style.top = currentLidY + "px";
      lidHitbox.style.margin = "0";

      updateBeans();
      drawBeans();
    }
    requestAnimationFrame(animate);
  }

  function getDateString() {
    const today = new Date();
    const year = today.getFullYear();
    const month = String(today.getMonth() + 1).padStart(2, "0");
    const day = String(today.getDate()).padStart(2, "0");
    return `${year}-${month}-${day}`;
  }

  saveButton.addEventListener("pointerdown", (e) => {
    e.stopPropagation();
    const selectedClass = classSelect.value;
    const filename = `${selectedClass}_${getDateString()}.txt`;
    const blob = new Blob([score.toString()], { type: "text/plain" });

    const downloadLink = document.createElement("a");
    downloadLink.href = URL.createObjectURL(blob);
    downloadLink.download = filename;
    document.body.appendChild(downloadLink);
    downloadLink.click();
    document.body.removeChild(downloadLink);
    URL.revokeObjectURL(downloadLink.href);
  });

  browseButton.addEventListener("pointerdown", (e) => {
    e.stopPropagation();
    fileInput.click();
  });

  fileInput.addEventListener("change", (event) => {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = (e) => {
      const loadedScore = parseInt(e.target.result.trim());
      if (isNaN(loadedScore) || loadedScore < 0) {
        alert("Invalid score file.");
        return;
      }

      beans = [];
      score = 0;
      updateScore();

      const amountToLoad = Math.min(loadedScore, MAX_BEANS);
      for (let i = 0; i < amountToLoad; i++) {
        createBean();
      }
    };
    reader.readAsText(file);
  });

  // Modal Dragging centered on grab point
  function makeModalDraggable(el) {
    el.onpointerdown = (e) => {
      if (e.target.closest('#jbControls') || e.target.closest('#jbLidHitbox') || e.target.closest('#jbJarLid') || e.target.closest('#jbScoreDisplay') || e.target.closest('#jbMouthHotspot')) {
        return;
      }

      // Initialize positioning using pixel offsets if currently using CSS translate center transform
      const rect = el.getBoundingClientRect();
      if (el.style.transform.includes("translate")) {
        el.style.transform = "none";
        el.style.left = rect.left + "px";
        el.style.top = rect.top + "px";
      }

      const startX = e.clientX;
      const startY = e.clientY;
      const initialLeft = el.offsetLeft;
      const initialTop = el.offsetTop;

      document.onpointermove = (ev) => {
        const deltaX = ev.clientX - startX;
        const deltaY = ev.clientY - startY;
        el.style.left = (initialLeft + deltaX) + "px";
        el.style.top = (initialTop + deltaY) + "px";
      };

      document.onpointerup = () => {
        document.onpointermove = null;
        document.onpointerup = null;
      };
    };
  }

  document.addEventListener("DOMContentLoaded", () => {
    let leftBtn = document.getElementById("leftBtn");
    let rightBtn = document.getElementById("rightBtn");

    if (!leftBtn) {
      leftBtn = document.createElement("button");
      leftBtn.id = "leftBtn";
      leftBtn.textContent = "Jelly Beans";
      leftBtn.style.cssText = "position:fixed; left:10px; top:50%; transform:translateY(-50%); z-index:49999; padding:10px 14px; cursor:pointer;";
      document.body.appendChild(leftBtn);
    } else {
      leftBtn.textContent = "Jelly Beans";
    }

    if (!rightBtn) {
      rightBtn = document.createElement("button");
      rightBtn.id = "rightBtn";
      rightBtn.textContent = "Jelly Beans";
      rightBtn.style.cssText = "position:fixed; right:10px; top:50%; transform:translateY(-50%); z-index:49999; padding:10px 14px; cursor:pointer;";
      document.body.appendChild(rightBtn);
    } else {
      rightBtn.textContent = "Jelly Beans";
    }

    leftBtn.onclick = (e) => {
      e.stopPropagation();
      toggleModal();
    };

    rightBtn.onclick = (e) => {
      e.stopPropagation();
      toggleModal();
    };

    mouthHotspot.addEventListener("pointerdown", (e) => {
      e.stopPropagation();
      createBean();
    });

    scoreDisplay.addEventListener("pointerdown", (e) => {
      e.stopPropagation();
      removeBean();
    });

    makeModalDraggable(jarWrapper);
    updateScore();
    animate();
  });
})();
</script>


<script>

document.addEventListener("DOMContentLoaded", () => {

    // 1. Create and insert the button in the Left Column
    const leftColumn = document.getElementById("leftColumn");
    if (leftColumn) {
        const leftBtn = document.createElement("button");
        leftBtn.id = "ppeLeftBtn";
        leftBtn.textContent = "QR";
        leftBtn.style.cssText = "height:24px; width:100%; font-size:10px; border:none; border-bottom:1px solid #999; background:#f7f7f7; cursor:pointer;";
        
        const jellyBeansLeft = document.getElementById("leftBtn");
        if (jellyBeansLeft) {

            leftColumn.appendChild(leftBtn);

        leftBtn.onclick = togglePpeHotspot;

    // 2. Create and insert the button in the Right Column
    const rightColumn = document.getElementById("rightColumn");

        const rightBtn = document.createElement("button");
        rightBtn.id = "ppeRightBtn";
        rightBtn.textContent = "QR";
        rightBtn.style.cssText = "height:24px; width:100%; font-size:10px; border:none; border-bottom:1px solid #999; background:#f7f7f7; cursor:pointer;";
        
        const jellyBeansRight = document.getElementById("rightBtn");
        if (jellyBeansRight) {
            rightColumn.insertBefore(rightBtn, jellyBeansRight);
        } else {
            rightColumn.appendChild(rightBtn);
        }

        rightBtn.onclick = togglePpeHotspot;
    }

    // 3. Toggle Function: Spawns if missing, removes if already open
    function togglePpeHotspot() {
        const viewer = document.getElementById("viewer");
        if (!viewer) return;

        const existing = viewer.querySelector(".ppeHotspotImg");
        if (existing) {
            if (selectedEl === existing) {
                selectedEl = null;
            }
            existing.remove();
            return; // Exit so it turns off instead of respawning
        }

        const img = document.createElement("img");
        img.src = "PerfectlyPracticalEnglish_with_Hotspot.app.jpg";
        img.className = "draggable overlayPng ppeHotspotImg";
        
        // Fixed dimensions and appearance (keeping your custom tweaks)
        img.style.position = "absolute";
        img.style.width = "190px";
        img.style.zIndex = "10005";
        img.style.boxShadow = "3px 15px 30px 10px rgba(0, 0, 0, 0.8)";
        
        // Fixed positioning from the top-right of the viewport / control column boundary
        img.style.right = "20px";
        img.style.top = "40px";

        viewer.appendChild(img);

        if (typeof enableDragging === "function") {
            enableDragging(img);
        }

        selectedEl = img;
    }

    // 4. Handle clicking off the PPE hotspot image to make it disappear
    const viewer = document.getElementById("viewer");
    if (viewer) {

<!-- ==========================================================
     STANDALONE NEUTRAL GREY FALLING BEAN SYSTEM
     A blurred bean shape that drops in a neutral grey tone
========================================================== -->
<script>
(function() {
  window.addEventListener("DOMContentLoaded", () => {
    const jarContainer = document.getElementById("jbJarContainer");
    const beanCanvas = document.getElementById("jbBeanCanvas");
    const scoreDisplay = document.getElementById("jbScoreDisplay");
    
    if (!jarContainer || !beanCanvas || !scoreDisplay) return;

    // 1. Create standalone cosmetic blur canvas positioned right behind the beans (z-index: 4)
    const blurCanvas = document.createElement("canvas");
    blurCanvas.id = "jbBlurCanvas";
    blurCanvas.width = 520;
    blurCanvas.height = 760;
    blurCanvas.style.cssText = "position:absolute; inset:0; width:100%; height:100%; pointer-events:none; z-index:4;";
    
    beanCanvas.style.zIndex = "3";
    jarContainer.appendChild(blurCanvas);
    const blurCtx = blurCanvas.getContext("2d");

    let impressionisticTrails = [];
    let lastKnownScore = parseInt(scoreDisplay.textContent) || 0;

    const jarBounds = { left: 135, right: 385, top: 175, bottom: 645 };
    const BEAN_RADIUS = 20.9;
    const maxCols = 6;
    
    // Fallback neutral grey color for the dropping bean
    const NEUTRAL_GREY = "#95A5A6";

    function getBeanCoordinates(scoreIndex) {
      const targetIndex = Math.max(0, scoreIndex);
      const col = targetIndex % maxCols;
      const row = Math.floor(targetIndex / maxCols);

      const availableWidth = (jarBounds.right - 10) - (jarBounds.left + 10) - (BEAN_RADIUS * 2);
      const colSpacing = availableWidth / (maxCols - 1);
      const baseTargetX = (jarBounds.left + 10) + BEAN_RADIUS + (col * colSpacing);
      const baseFloor = (jarBounds.bottom - 5) + 15;
      const baseTargetY = baseFloor - BEAN_RADIUS - (row * (BEAN_RADIUS * 1.3));

      const jarCenterX = (jarBounds.left + jarBounds.right) / 2;
      const edgeCurveFactor = Math.min(1, Math.abs(baseTargetX - jarCenterX) / ((jarBounds.right - jarBounds.left) / 2));
      const edgeLift = (row === 0) ? (edgeCurveFactor * 8) : 0;

      return {
        x: baseTargetX + (Math.sin(targetIndex * 12.9898) * 12),
        y: (baseTargetY - edgeLift) + (Math.cos(targetIndex * 78.233) * 6)
      };
    }

    // 2. Monitor score changes and use neutral grey for the falling/rising bean trail
    const observer = new MutationObserver(() => {
      const currentScore = parseInt(scoreDisplay.textContent) || 0;
      if (currentScore === lastKnownScore) return;

      const centerX = (jarBounds.left + jarBounds.right) / 2;
      const startY = jarBounds.top - 15;
      
      const targetScoreIndex = currentScore > lastKnownScore ? currentScore - 1 : currentScore;
      const targetCoord = getBeanCoordinates(targetScoreIndex);
      const endY = targetCoord.y;

      if (currentScore > lastKnownScore) {
        impressionisticTrails.push({
          x: centerX,
          y: startY,
          targetY: endY,
          color: NEUTRAL_GREY,
          alpha: 0.35,
          life: 1.0,
          decay: 0.015
        });
      } else if (currentScore < lastKnownScore) {
        impressionisticTrails.push({
          x: centerX,
          y: endY,
          targetY: startY,
          color: NEUTRAL_GREY,
          alpha: 0.35,
          life: 1.0,
          decay: 0.015
        });
      }

      lastKnownScore = currentScore;
    });

    observer.observe(scoreDisplay, { childList: true, characterData: true, subtree: true });

    // 3. Render the neutral grey blurred bean trail right behind the main beans layer
    function renderBlurTrails() {
      blurCtx.clearRect(0, 0, blurCanvas.width, blurCanvas.height);

      for (let i = impressionisticTrails.length - 1; i >= 0; i--) {
        let trail = impressionisticTrails[i];
        
        trail.y += (trail.targetY - trail.y) * 0.12;
        trail.life -= trail.decay;

        if (trail.life <= 0 || Math.abs(trail.targetY - trail.y) < 1) {
          impressionisticTrails.splice(i, 1);
          continue;
        }

        blurCtx.save();
        blurCtx.globalAlpha = trail.alpha * trail.life;
        
        blurCtx.shadowColor = trail.color;
        blurCtx.shadowBlur = 35;
        
        blurCtx.translate(trail.x, trail.y);

        blurCtx.beginPath();
        blurCtx.moveTo(-19, -6);
        blurCtx.bezierCurveTo(-24, -22, 19, -25, 24, -6);
        blurCtx.bezierCurveTo(28, 11, -4, 25, -19, 15);
        blurCtx.bezierCurveTo(-26, 9, -24, 0, -19, -6);
        blurCtx.closePath();

        blurCtx.fillStyle = trail.color;
        blurCtx.fill();

        blurCtx.restore();
      }

      requestAnimationFrame(renderBlurTrails);
    }

    renderBlurTrails();
  });
})();
</script>
