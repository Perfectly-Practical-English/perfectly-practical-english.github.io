<script>

/* =========================================================
   STANDALONE DOWNLOAD FILENAME INTERCEPTOR
   ---------------------------------------------------------
   Automatically renames outgoing:

   - TXT
   - PNG
   - Audio files

   Filename format:

   Filename_Section_Name_ID_Date_Time_Score_Percent.ext

   Example:

   Teleprompter_Food_and_Cooking_Somchai_Jaidee_12345_
   26-09-2026_14-53-27_8-10_80%.txt

   If no quiz score is available:

   Teleprompter_Food_and_Cooking_Somchai_Jaidee_12345_
   26-09-2026_14-53-27_NA_NA.webm

   Windows-safe:
   - Spaces become underscores
   - Illegal filename characters become underscores
   - Date uses -
   - Time uses -
   - Score uses -
   ========================================================= */


/* =========================================================
   1. CLEAN FILENAME PART
   ========================================================= */

function cleanScoreboardFilenamePart(value) {

    return String(value || '')
        .trim()
        .replace(/\s+/g, '_')
        .replace(/[<>:"/\\|?*]/g, '_')
        .replace(/_+/g, '_')
        .replace(/^_+|_+$/g, '');
}


/* =========================================================
   2. MAKE COMPLETE FILENAME
   ========================================================= */

function makeScoreboardFilename(
    filename,
    sectionName,
    studentName,
    studentId,
    date,
    time,
    score,
    percent,
    extension
) {

    const parts = [
        filename,
        sectionName,
        studentName,
        studentId,
        date,
        time,
        score,
        percent
    ];

    const safeName =
        parts
            .map(cleanScoreboardFilenamePart)
            .filter(Boolean)
            .join('_');

    const safeExtension =
        String(extension || 'txt')
            .replace(/^\./, '')
            .replace(/[<>:"/\\|?*]/g, '');

    return (
        safeName +
        '.' +
        safeExtension
    );
}


/* =========================================================
   3. DATE / TIME
   ========================================================= */

function getScoreboardDateTime() {

    const now = new Date();

    function pad(number) {
        return String(number).padStart(2, '0');
    }

    return {

        date:
            `${pad(now.getDate())}-` +
            `${pad(now.getMonth() + 1)}-` +
            `${now.getFullYear()}`,

        time:
            `${pad(now.getHours())}-` +
            `${pad(now.getMinutes())}-` +
            `${pad(now.getSeconds())}`
    };
}


/* =========================================================
   4. GET CURRENT PAGE FILENAME
   ========================================================= */

function getCurrentDownloadBaseName() {

    let filename =
        window.location.pathname
            .split('/')
            .pop() || 'Teleprompter';

    /*
       Remove the existing extension.

       Example:

       Teleprompter.html
       becomes:

       Teleprompter
    */

    filename =
        filename.replace(
            /\.[^.]+$/,
            ''
        );

    return filename || 'Teleprompter';
}


/* =========================================================
   5. GET CURRENT SECTION NAME
   ========================================================= */

function getCurrentDownloadSectionName() {

    /*
       This is set by the main section selector.
    */

    if (
        window.currentQuizSectionName &&
        String(
            window.currentQuizSectionName
        ).trim()
    ) {

        return String(
            window.currentQuizSectionName
        ).trim();
    }


    /*
       Fallback: try the currently selected
       section from SCRAMBLE_SECTIONS.
    */

    if (
        window.SCRAMBLE_SECTIONS &&
        typeof window.SCRAMBLE_INDEX ===
            'number' &&
        window.SCRAMBLE_SECTIONS[
            window.SCRAMBLE_INDEX
        ]
    ) {

        return (
            window.SCRAMBLE_SECTIONS[
                window.SCRAMBLE_INDEX
            ].name || ''
        );
    }


    return 'Section';
}


/* =========================================================
   6. GET STUDENT ID
   ========================================================= */

function getCurrentStudentId() {

    const input =
        document.getElementById('gsId');

    if (!input) {
        return '';
    }

    return (
        input.value ||
        ''
    ).trim();
}


/* =========================================================
   7. GET STUDENT NAME
   ========================================================= */

function getCurrentStudentName() {

    const studentId =
        getCurrentStudentId();


    /*
       Use the existing ID → student-name
       resolver if available.
    */

    if (
        studentId &&
        typeof window.resolveStudentNameFromId ===
            'function'
    ) {

        const resolved =
            window.resolveStudentNameFromId(
                studentId
            );

        if (
            resolved &&
            String(resolved).trim()
        ) {

            return String(
                resolved
            ).trim();
        }
    }


    /*
       Fallbacks if a name field exists.
    */

    const possibleNameIds = [
        'gsName',
        'studentName',
        'student-name'
    ];

    for (
        const id of possibleNameIds
    ) {

        const element =
            document.getElementById(id);

        if (
            element &&
            String(
                element.value ||
                element.textContent ||
                ''
            ).trim()
        ) {

            return String(
                element.value ||
                element.textContent ||
                ''
            ).trim();
        }
    }


    return 'Student';
}


/* =========================================================
   8. GET CURRENT QUIZ SCORE
   ---------------------------------------------------------
   Looks for the existing MC Quiz Mania scoreboard.

   Existing format:

   filename|section: quiz|name|id|date/time|8/10|80%

   Therefore:

   parts[6] = 8/10
   parts[7] = 80%
   ========================================================= */

function getCurrentQuizScoreData() {

    const scoreElements =
        document.querySelectorAll(
            '.quiz-mania-score-text'
        );

    /*
       Work backwards so the most recently
       displayed scoreboard is used.
    */

    for (
        let i = scoreElements.length - 1;
        i >= 0;
        i--
    ) {

        const text =
            scoreElements[i]
                .textContent
                .trim();

        if (!text) {
            continue;
        }

        const parts =
            text.split('|');

        if (
            parts.length >= 8
        ) {

            const score =
                parts[6].trim();

            const percent =
                parts[7].trim();

            if (
                score &&
                percent
            ) {

                return {
                    score: score,
                    percent: percent
                };
            }
        }
    }


    /*
       No MC quiz score available.

       This is normal for audio recordings
       or other non-quiz downloads.
    */

    return {
        score: 'NA',
        percent: 'NA'
    };
}


/* =========================================================
   9. DETERMINE FILE EXTENSION
   ========================================================= */

function getDownloadExtension(link) {

    const originalName =
        link.getAttribute('download') ||
        '';


    /*
       1. If the download filename already
          contains an extension, use it.
    */

    const match =
        originalName.match(
            /\.([a-zA-Z0-9]+)$/
        );

    if (match) {

        return match[1]
            .toLowerCase();
    }


    /*
       2. Inspect the href when possible.
    */

    const href =
        link.getAttribute('href') ||
        '';


    if (
        href.includes('image/png')
    ) {
        return 'png';
    }

    if (
        href.includes('audio/webm')
    ) {
        return 'webm';
    }

    if (
        href.includes('audio/wav')
    ) {
        return 'wav';
    }

    if (
        href.includes('audio/mpeg')
    ) {
        return 'mp3';
    }

    if (
        href.includes('audio/ogg')
    ) {
        return 'ogg';
    }

    if (
        href.includes('audio/mp4')
    ) {
        return 'm4a';
    }


    /*
       3. If there is no extension at all,
          this app's MediaRecorder uses WebM/Opus
          for recorded audio.

          Therefore use WEBM as the fallback.
    */

    return 'webm';
}
/* =========================================================
   10. SHOULD THIS DOWNLOAD BE INTERCEPTED?
   ========================================================= */

function isRenameableDownload(link) {

    if (!link) {
        return false;
    }

    if (
        !link.hasAttribute('download')
    ) {
        return false;
    }

    const extension =
        getDownloadExtension(link);

const allowedExtensions = [
    'txt',
    'png',
'webm'
];

    return allowedExtensions.includes(
        extension
    );
}


/* =========================================================
   11. BUILD NEW DOWNLOAD FILENAME
   ========================================================= */

function buildInterceptedDownloadFilename(
    link
) {

    const extension =
        getDownloadExtension(link);

    const filename =
        getCurrentDownloadBaseName();

    const sectionName =
        getCurrentDownloadSectionName();

    const studentName =
        getCurrentStudentName();

    const studentId =
        getCurrentStudentId();

    const dateTime =
        getScoreboardDateTime();

    const scoreData =
        getCurrentQuizScoreData();


    const newFilename =
        makeScoreboardFilename(

            filename,

            sectionName,

            studentName,

            studentId,

            dateTime.date,

            dateTime.time,

            scoreData.score,

            scoreData.percent,

            extension
        );


    return newFilename;
}


/* =========================================================
   12. DOWNLOAD INTERCEPTOR
   ---------------------------------------------------------
   Intercepts programmatic and normal clicks on
   TXT, PNG, and WEBM download links.

   This runs immediately before the browser
   performs the actual anchor download.
   ========================================================= */

(function() {

    const originalAnchorClick =
        HTMLAnchorElement.prototype.click;


    HTMLAnchorElement.prototype.click =
        function() {

            const link = this;


            /*
               Only process actual download links.
            */

            if (
                link.hasAttribute('download')
            ) {

                const originalName =
                    link.getAttribute(
                        'download'
                    ) || '';


                const extensionMatch =
                    originalName.match(
                        /\.([a-zA-Z0-9]+)$/
                    );


                if (extensionMatch) {

                    const extension =
                        extensionMatch[1]
                            .toLowerCase();


                    /*
                       Only rename the file types
                       we want to intercept.
                    */

                    const allowedExtensions = [
                        'txt',
                        'png',
                        'webm'
                    ];


                    if (
                        allowedExtensions.includes(
                            extension
                        )
                    ) {

                        const newFilename =
                            buildInterceptedDownloadFilename(
                                link
                            );


                        link.download =
                            newFilename;


                        console.log(
                            'Download renamed:',
                            newFilename
                        );
                    }
                }
            }


            /*
               Now perform the ORIGINAL click.
            */

            return originalAnchorClick.call(
                link
            );
        };


    /*
       Also handle ordinary user clicks
       that do not go through .click().
    */

    document.addEventListener(
        'click',
        function(event) {

            const link =
                event.target.closest(
                    'a[download]'
                );

            if (!link) {
                return;
            }


            const originalName =
                link.getAttribute(
                    'download'
                ) || '';


            const extensionMatch =
                originalName.match(
                    /\.([a-zA-Z0-9]+)$/
                );


            if (!extensionMatch) {
                return;
            }


            const extension =
                extensionMatch[1]
                    .toLowerCase();


            const allowedExtensions = [
                'txt',
                'png',
                'webm'
            ];


            if (
                !allowedExtensions.includes(
                    extension
                )
            ) {
                return;
            }


            const newFilename =
                buildInterceptedDownloadFilename(
                    link
                );


            link.download =
                newFilename;


            console.log(
                'Download renamed:',
                newFilename
            );

        },
        true
    );

})();
/* =========================================================
   13. OPTIONAL GLOBAL HELPER
   ---------------------------------------------------------
   Makes the builder available elsewhere if
   you ever need it.
   ========================================================= */

window.makeScoreboardFilename =
    makeScoreboardFilename;

window.getScoreboardDateTime =

/* =========================================================

console.log(

);

</script>

<script>
(function() {
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playCorrect() { 
        audioCtx.resume().then(() => { 
            const o = audioCtx.createOscillator(); 
            const g = audioCtx.createGain(); 
            o.type = "sine"; 
            o.frequency.setValueAtTime(800, audioCtx.currentTime); 
            g.gain.setValueAtTime(0.4, audioCtx.currentTime); 
            o.connect(g); g.connect(audioCtx.destination); 
            o.start(); o.stop(audioCtx.currentTime + 0.25); 
        }); 
    }

    function playWrong() { 
        audioCtx.resume().then(() => { 
            const o = audioCtx.createOscillator(); 
            const g = audioCtx.createGain(); 
            o.type = "triangle"; 
            o.frequency.setValueAtTime(450, audioCtx.currentTime); 
            o.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.25); 
            g.gain.setValueAtTime(0.4, audioCtx.currentTime); 
            o.connect(g); g.connect(audioCtx.destination); 
            o.start(); o.stop(audioCtx.currentTime + 0.25); 
        }); 
    }

    function normalize(str){ 
        return (str || '').trim().toLowerCase().replace(/\s+/g," "); 
    }

    document.body.addEventListener('change', e => {
        const exercise = e.target.closest('.exercise');
        if (!exercise) return;

        const textInputs = Array.from(exercise.querySelectorAll("input[type='text'], textarea"));
        const selectedInputs = Array.from(exercise.querySelectorAll("input:checked"));

        const userAnswers = textInputs.length 
            ? textInputs.map(i => normalize(i.value)) 
            : selectedInputs.map(i => normalize(i.value));

        const correctAnswers = Array.from(exercise.querySelectorAll('[data-correct]'))
            .map(i => normalize(i.dataset.correct));

        const isCorrect = userAnswers.length > 0 && userAnswers.every(ans => correctAnswers.includes(ans));

        exercise.querySelectorAll('.mc-emoji').forEach(span => span.remove());

        selectedInputs.forEach(inp => {
            const lbl = inp.closest("label");
            if (lbl) {
                const span = document.createElement('span');
                span.className = "mc-emoji";
                span.textContent = isCorrect ? "😊" : "😢";
                lbl.appendChild(span);
            }
        });

        textInputs.forEach(inp => {
            const span = document.createElement('span');
            span.className = "mc-emoji";
            span.textContent = isCorrect ? "😊" : "😢";
            inp.parentNode.insertBefore(span, inp.nextSibling);
        });

        if (isCorrect) playCorrect(); else playWrong();

        if (exercise.dataset.firstResponseLocked) return;
        exercise.dataset.firstResponseLocked = 'true';

        const correctCount = isCorrect ? 1 : 0;
        exercise.dataset.score = correctCount;
        exercise.dataset.percentage = correctCount * 100;
    });

    document.body.addEventListener('click', e => {
        if (!e.target.classList.contains('quiz-submit')) return;
        const sub = e.target.closest('.quiz-subsection');
        if (!sub) return;

        const exercises = sub.querySelectorAll('.exercise');
        let correctCount = 0;
        exercises.forEach(ex => {
            correctCount += Number(ex.dataset.score || 0);
        });

        const totalExercises = exercises.length;
        const percentage = totalExercises > 0 ? Math.round((correctCount / totalExercises) * 100) : 0;

        const board = sub.querySelector('.quiz-scoreboard');
        if (board) {
            const dataEl = board.querySelector('.scoreboard-data');
            const name = sub.querySelector('.quiz-name')?.value || 'Anonymous';
            const id = sub.querySelector('.quiz-id')?.value || 'N/A';
            const section = sub.closest('.section')?.querySelector('h2')?.textContent || 'Guest Section';
            const subsection = sub.dataset.subsection || 'Guest Subsection';
            const now = new Date();
            const pad = n => n.toString().padStart(2,'0');
            const dateString = `${pad(now.getDate())}/${pad(now.getMonth()+1)}/${now.getFullYear()} ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
            const filename = window.location.pathname.split('/').pop();

            const resultText = `${filename}|${section.replace(/:+$/, '').trim()}: ${subsection.replace(/^:+/, '').trim()}|${name}|${id}|${dateString}|${correctCount}/${totalExercises}|${percentage}%`;
            if (dataEl) dataEl.textContent = resultText;

            if (window.saveResult) {
                window.saveResult(resultText);
            }

            board.style.display = 'block';
        }
    });
})();

// 9. SPEECH-TO-TEXT (STT) DICTATION MODULE
// ==========================================
const sttBtn = document.getElementById('sttBtn');

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

if (sttBtn && SpeechRecognition) {

    const recognition =
        new SpeechRecognition();

    recognition.continuous = true;
    recognition.interimResults = false;
    recognition.lang = 'en-US';
    recognition.maxAlternatives = 1;

    let isListening = false;

    /*
     * Store the editor selection before the
     * STT button takes focus.
     */
    let savedRange = null;


    // ------------------------------------------
    // SAVE THE EDITOR CARET
    // ------------------------------------------

    function saveEditorCaret() {

        const editableZone =
            document.getElementById('editableTextZone');

        if (!editableZone) return;

        const selection =
            window.getSelection();

        if (
            !selection ||
            selection.rangeCount === 0
        ) {
            return;
        }

        const range =
            selection.getRangeAt(0);

        if (
            editableZone.contains(
                range.commonAncestorContainer
            )
        ) {

            savedRange =
                range.cloneRange();
        }
    }


    // ------------------------------------------
    // KEEP THE EDITOR CARET WHEN BUTTON
    // IS CLICKED
    // ------------------------------------------

    sttBtn.addEventListener(
        'mousedown',
        function(e) {

            /*
             * Save the current caret before the
             * button can take focus.
             */
            saveEditorCaret();

            /*
             * Prevent the button from taking
             * focus away from the editor.
             */
            e.preventDefault();
        }
    );


    // ------------------------------------------
    // INSERT SPEECH INTO EXISTING EDITOR
    // ------------------------------------------

    function insertSpeech(text) {

        const editableZone =
            document.getElementById('editableTextZone');

        if (!editableZone) return;

        if (!text || !text.trim()) return;


        /*
         * Restore the caret that existed when
         * the STT button was pressed.
         */
        if (!savedRange) {

            /*
             * Do not append to the editor if
             * there is no known caret.
             *
             * This prevents STT from creating
             * unexpected DOM structure or
             * changing line spacing.
             */
            return;
        }


        const selection =
            window.getSelection();

        if (!selection) return;


        const range =
            savedRange.cloneRange();


        /*
         * Make absolutely sure the saved
         * range still belongs to the editor.
         */
        if (
            !editableZone.contains(
                range.commonAncestorContainer
            )
        ) {
            return;
        }


        /*
         * Replace selected text, if any,
         * exactly as normal typing would.
         */
        range.deleteContents();


        /*
         * Insert ONLY a text node.
         *
         * No <div>
         * No <p>
         * No <br>
         * No new .line
         *
         * Therefore the existing line structure
         * and CSS remain untouched.
         */
        const textNode =
            document.createTextNode(
                text.trim() + ' '
            );


        range.insertNode(textNode);


        /*
         * Put the caret immediately after
         * the newly inserted speech.
         */
        range.setStartAfter(textNode);

        range.collapse(true);


        selection.removeAllRanges();

        selection.addRange(range);


        /*
         * Save the new caret so the next
         * speech result continues from here.
         */
        savedRange =
            range.cloneRange();


        /*
         * Update the application's existing
         * text counter / overlay.
         */
        if (
            typeof window.updateTextOverlay ===
            'function'
        ) {

            window.updateTextOverlay();
        }
    }


    // ------------------------------------------
    // SPEECH RESULT
    // ------------------------------------------

    recognition.onresult =
        function(event) {

            let finalTranscript = '';


            for (
                let i = event.resultIndex;
                i < event.results.length;
                i++
            ) {

                if (
                    event.results[i].isFinal
                ) {

                    finalTranscript +=
                        event.results[i][0]
                            .transcript;
                }
            }


            finalTranscript =
                finalTranscript.trim();


            if (!finalTranscript) return;


            insertSpeech(
                finalTranscript
            );
        };


    // ------------------------------------------
    // ERROR
    // ------------------------------------------

    recognition.onerror =
        function(event) {

            console.error(
                'STT Error:',
                event.error
            );


            /*
             * Chrome can report no-speech
             * during normal continuous use.
             */
            if (
                event.error === 'no-speech'
            ) {
                return;
            }


            isListening = false;

            sttBtn.textContent =
                'Start STT';

            sttBtn.classList.remove(
                'recording'
            );
        };


    // ------------------------------------------
    // RECOGNITION ENDED
    // ------------------------------------------

    recognition.onend =
        function() {

            if (isListening) {

                /*
                 * Chrome may stop recognition
                 * after a period of silence.
                 */
                try {

                    recognition.start();

                } catch (e) {

                    /*
                     * Ignore the normal restart
                     * race condition.
                     */
                }

            } else {

                sttBtn.textContent =
                    'STT';

                sttBtn.classList.remove(
                    'recording'
                );
            }
        };


    // ------------------------------------------
    // EXISTING STT BUTTON
    // ------------------------------------------

    sttBtn.addEventListener(
        'click',
        function() {

            if (!isListening) {

                /*
                 * Save the caret one more time
                 * immediately before starting.
                 */
                saveEditorCaret();


                try {

                    recognition.start();

                    isListening =
                        true;

                    sttBtn.textContent =
                        'Off';

                    sttBtn.classList.add(
                        'recording'
                    );

                } catch (err) {

                    console.error(
                        'Failed to start speech recognition:',
                        err
                    );
                }

            } else {

                isListening =
                    false;


                try {

                    recognition.stop();

                } catch (e) {

                    /*
                     * Recognition may already
                     * have stopped.
                     */
                }


                sttBtn.textContent =
                    'Start STT';

                sttBtn.classList.remove(
                    'recording'
                );
            }
        }
    );

} else if (sttBtn) {

    sttBtn.disabled = true;

    sttBtn.title =
        'Speech-to-text is not supported in this browser (try Chrome/Edge).';
}

</script>

<script>



/* =========================================================
   SCOREBOARD-BASED DOWNLOAD FILENAME INTERCEPTOR
   ---------------------------------------------------------
   Reads the ACTUAL scoreboard string and converts it
   directly into a Windows-safe download filename.

   QUIZ:

   filename|section: Quiz|name|id|date/time|8/20|40%

   becomes:

   filename_section_name_id_date_time_8_20_40%.txt


   EDITS:

   filename|section: Edits|name|id|date/time|
   Chars:2493|Sentences:54|Changed:0%

   becomes:

   filename_section_name_id_date_time_
   Chars_2493_Sentences_54_Changed_0%.txt


   The scoreboard is the source of truth.
   ========================================================= */


/* =========================================================
   1. CLEAN FILENAME PART
   ========================================================= */

function cleanScoreboardFilenamePart(value) {

    return String(value || '')
        .trim()
        .replace(/\s+/g, '_')
        .replace(/[<>:"/\\|?*]/g, '_')
        .replace(/_+/g, '_')
        .replace(/^_+|_+$/g, '');
}


/* =========================================================
   2. GET DOWNLOAD EXTENSION
   ========================================================= */

function getDownloadExtension(link) {

    const originalName =
        link.getAttribute('download') || '';


    /*
       First check the existing download filename.
    */

    const match =
        originalName.match(
            /\.([a-zA-Z0-9]+)$/
        );

    if (match) {

        return match[1]
            .toLowerCase();
    }


    /*
       Otherwise inspect the href.
    */

    const href =
        link.getAttribute('href') || '';


    if (
        href.includes('image/png')
    ) {
        return 'png';
    }


    if (
        href.includes('audio/webm')
    ) {
        return 'webm';
    }


    if (
        href.includes('audio/wav')
    ) {
        return 'wav';
    }


    if (
        href.includes('audio/mpeg')
    ) {
        return 'mp3';
    }


    if (
        href.includes('audio/ogg')
    ) {
        return 'ogg';
    }


    if (
        href.includes('audio/mp4')
    ) {
        return 'm4a';
    }


    /*
       Default for MediaRecorder audio.
    */

    return 'webm';
}


/* =========================================================
   3. SHOULD THIS DOWNLOAD BE INTERCEPTED?
   ========================================================= */

function isRenameableDownload(link) {

    if (!link) {
        return false;
    }


    if (
        !link.hasAttribute('download')
    ) {
        return false;
    }


    const extension =
        getDownloadExtension(link);


    const allowedExtensions = [
        'txt',
        'png',
        'webm'
    ];


    return allowedExtensions.includes(
        extension
    );
}


/* =========================================================
   4. GET THE ACTUAL SCOREBOARD STRING
   ---------------------------------------------------------
   Priority:

   1. Quiz scoreboard
   2. Edits scoreboard

   IMPORTANT:

   We do NOT reconstruct the scoreboard.

   We read the exact string already displayed.
   ========================================================= */

function getCurrentScoreboardString() {


    /* -----------------------------------------
       QUIZ SCOREBOARD
       ----------------------------------------- */

    const quizElements =
        document.querySelectorAll(
            '.quiz-mania-score-text'
        );


    for (
        let i = quizElements.length - 1;
        i >= 0;
        i--
    ) {

        const text =
            quizElements[i]
                .textContent
                .trim();


        if (text) {

            return text;
        }
    }


    /* -----------------------------------------
       EDITS SCOREBOARD
       ----------------------------------------- */

    const editMeta =
        document.getElementById(
            'gsScoreMeta'
        );


    if (
        editMeta &&
        editMeta.textContent.trim()
    ) {

        return editMeta
            .textContent
            .trim();
    }


    return '';
}


/* =========================================================
   5. PARSE SCOREBOARD DATE / TIME
   ---------------------------------------------------------
   Input:

   28/09/2026 11:12:47

   Output:

   date = 28-09-2026
   time = 11-12-47
   ========================================================= */

function parseScoreboardDateTime(
    dateTime
) {

    const result = {
        date: '',
        time: ''
    };


    const match =
        String(dateTime || '')
            .trim()
            .match(
                /^(\d{1,2})\/(\d{1,2})\/(\d{4})\s+(\d{1,2}):(\d{2}):(\d{2})$/
            );


    if (!match) {

        result.date =
            cleanScoreboardFilenamePart(
                dateTime
            );

        return result;
    }


    result.date =
        `${match[1].padStart(2, '0')}-` +
        `${match[2].padStart(2, '0')}-` +
        `${match[3]}`;


    result.time =
        `${match[4].padStart(2, '0')}-` +
        `${match[5]}-` +
        `${match[6]}`;


    return result;
}


/* =========================================================
   6. BUILD FILENAME DIRECTLY FROM SCOREBOARD
   ========================================================= */

function buildInterceptedDownloadFilename(
    link
) {

    const extension =
        getDownloadExtension(link);


    /*
       Get the actual scoreboard text.
    */

    const scoreboard =
        getCurrentScoreboardString();


    /*
       If no scoreboard exists,
       keep the original filename.
    */

    if (!scoreboard) {

        return (
            link.getAttribute('download') ||
            'download'
        );
    }


    /*
       Split the scoreboard at pipes.

       Common structure:

       [0] filename
       [1] section
       [2] student name
       [3] student ID
       [4] date/time
    */

    const parts =
        scoreboard
            .split('|')
            .map(
                part => part.trim()
            );


    /*
       -----------------------------------------
       BASIC FIELDS
       -----------------------------------------
    */

    let filename =
        parts[0] ||
        'Teleprompter';


    let section =
        parts[1] ||
        'Section';


    const studentName =
        parts[2] ||
        'Guest';


    const studentId =
        parts[3] ||
        'Guest';


    const dateTime =
        parts[4] ||
        '';


    /*
       Remove original file extension.
    */

    filename =
        filename.replace(
            /\.[^.]+$/,
            ''
        );


    /*
       -----------------------------------------
       DETERMINE SCOREBOARD TYPE
       -----------------------------------------
    */

    const isQuiz =
        /:\s*Quiz\s*$/i.test(
            section
        );


    const isEdits =
        /:\s*Edits\s*$/i.test(
            section
        );


    /*
       Remove:

       : Quiz

       or:

       : Edits

       from the section name.
    */

    section =
        section.replace(
            /\s*:\s*(Quiz|Edits)\s*$/i,
            ''
        );


    /*
       -----------------------------------------
       DATE / TIME
       -----------------------------------------
    */

    const dateTimeParts =
        parseScoreboardDateTime(
            dateTime
        );


/*
       -----------------------------------------
       START BUILDING FILENAME
       -----------------------------------------
    */

    const filenameParts = [
        filename,
        section
    ];

    if (isEdits) {
        filenameParts.push("Edits");
    } else if (isQuiz) {
        filenameParts.push("Quiz");
    }

    filenameParts.push(
        studentName,
        studentId,
        dateTimeParts.date,
        dateTimeParts.time
    );


    /*
       -----------------------------------------
       QUIZ
       -----------------------------------------
    */

    if (isQuiz) {
        const score = parts[5] || 'NA';
        const percent = parts[6] || 'NA';

        filenameParts.push(
            score,
            percent
        );
    }


    /*
       -----------------------------------------
       EDITS
       -----------------------------------------
    */

    if (isEdits) {
        const editFields = parts.slice(5);
        editFields.forEach(field => {
            if (field) {
                filenameParts.push(field);
            }
        });
    }


    /*
       -----------------------------------------
       Guest / OTHER SCOREBOARD
       -----------------------------------------

       If this is neither Quiz nor Edits,
       retain everything after the date/time
       rather than throwing it away.
    */

    if (
        !isQuiz &&
        !isEdits
    ) {

        const remainingFields =
            parts.slice(5);


        remainingFields.forEach(
            field => {

                if (
                    field
                ) {

                    filenameParts.push(
                        field
                    );
                }
            }
        );
    }
    /*
       -----------------------------------------
       MAKE WINDOWS-SAFE FILENAME
       -----------------------------------------
    */

    const safeName =
        filenameParts
            .map(
                cleanScoreboardFilenamePart
            )
            .filter(Boolean)
            .join('_');


    const safeExtension =
        String(extension || 'txt')
            .replace(
                /^\./,
                ''
            )
            .replace(
                /[<>:"/\\|?*]/g,
                ''
            );


    return (
        safeName +
        '.' +
        safeExtension
    );
}


/* =========================================================
   7. INTERCEPT PROGRAMMATIC DOWNLOADS
   ========================================================= */

(function() {

    const originalAnchorClick =
        HTMLAnchorElement.prototype.click;


    HTMLAnchorElement.prototype.click =
        function() {

            const link = this;


            if (
                isRenameableDownload(link)
            ) {

                const newFilename =
                    buildInterceptedDownloadFilename(
                        link
                    );


                link.download =
                    newFilename;


                console.log(
                    'Download renamed:',
                    newFilename
                );
            }


            return originalAnchorClick.call(
                link
            );
        };



    /* =====================================================
       8. INTERCEPT NORMAL USER DOWNLOAD CLICKS
       ===================================================== */

    document.addEventListener(
        'click',
        function(event) {

            const link =
                event.target.closest(
                    'a[download]'
                );


            if (
                !isRenameableDownload(link)
            ) {

                return;
            }


            const newFilename =
                buildInterceptedDownloadFilename(
                    link
                );


            link.download =
                newFilename;


            console.log(
                'Download renamed:',
                newFilename
            );

        },
        true
    );

})();


/* =========================================================
   9. OPTIONAL GLOBAL HELPERS
   ========================================================= */

window.getCurrentScoreboardString =
    getCurrentScoreboardString;


window.buildInterceptedDownloadFilename =
    buildInterceptedDownloadFilename;


/* =========================================================
   10. READY MESSAGE
   ========================================================= */

console.log(
    'Scoreboard-based download filename interceptor loaded.'
);

</script>



<script>
/* =========================================================
   NO-QUIZ MARKER HANDLER
   ========================================================= */

(function () {
    'use strict';

    function isNoQuizText(text) {

        if (!text) return false;

        const lines = String(text)
            .replace(/\r\n/g, '\n')
            .replace(/\r/g, '\n')
            .split('\n');

        for (let i = 0; i < lines.length - 1; i++) {

            if (
                lines[i].trim() === 'BLANK' &&
                lines[i + 1].trim() === '?BLANK'
            ) {
                return true;
            }
        }

        return false;
    }


    function removeNoQuizLines() {

        const zone =
            document.getElementById('editableTextZone');

        if (!zone) return;

        const lines =
            Array.from(
                zone.querySelectorAll('.line')
            );

        for (let i = 0; i < lines.length - 1; i++) {

            if (
                lines[i].textContent.trim() === 'BLANK' &&
                lines[i + 1].textContent.trim() === '?BLANK'
            ) {

                lines[i].remove();
                lines[i + 1].remove();

                break;
            }
        }
    }


    function updateQuizBar(noQuiz) {

        const bar =
            document.getElementById('quizToggleBar');

        if (!bar) return;

        /*
           Only hide/show the existing bar.
           Do not change its text.
           Do not disable it.
           Do not modify its event handlers.
        */

        bar.style.display =
            noQuiz ? 'none' : '';
    }


    /*
       Your existing section loader already fires this
       event after a section has been selected and loaded.
    */

    window.addEventListener(
        'textSectionLoaded',
        function (event) {

            const text =
                event &&
                event.detail &&
                typeof event.detail.sectionText === 'string'
                    ? event.detail.sectionText
                    : '';

            const noQuiz =
                isNoQuizText(text);

            if (noQuiz) {
                removeNoQuizLines();
            }

            updateQuizBar(noQuiz);
        }
    );

})();
</script>

<script>
(function() {
    'use strict';

    const button =
        document.getElementById(
            'standaloneDownloadAudioBtn'
        );

    if (!button) return;


    button.addEventListener(
        'click',
        function() {

            /*
             * Use the existing recording.
             */
            if (
                typeof audioBlob === 'undefined' ||
                !audioBlob
            ) {
                alert('No audio recording available.');
                return;
            }


            /*
             * Create temporary download URL.
             */
            const url =
                URL.createObjectURL(
                    audioBlob
                );


            /*
             * Create download link.
             */
            const link =
                document.createElement('a');

            link.href = url;

            link.download =
                'recorded-audio.webm';


            /*
             * Trigger download.
             */
            link.click();


            /*
             * Clean up.
             */
            setTimeout(
                function() {
                    URL.revokeObjectURL(url);
                },
                100
            );

        }
    );

})();
</script>

<script>
/* ==========================================================================
   CASCADING CHAPTER & VERSE NAVIGATION & TOP-ALIGNMENT MODULE
   ========================================================================== */
document.addEventListener('DOMContentLoaded', () => {
    'use strict';

    const chapterSelect = document.getElementById('chapterSelect');
    const verseSelect = document.getElementById('verseSelect');
    const goBtn = document.getElementById('goBtn');
    const teleEdit = document.getElementById('teleEdit');

    let currentSectionVerseMap = {};

    // 1. PARSE CHAPTERS & VERSES FROM THE ACTIVE TEXT SECTION
    function parseChaptersAndVerses() {
        currentSectionVerseMap = {};
        const editableZone = document.getElementById('editableTextZone') || teleEdit;
        if (!editableZone) return;

        const nodes = Array.from(editableZone.querySelectorAll('.line, p, h3, h4'));
        
        let currentChap = "1";
        currentSectionVerseMap[currentChap] = {};

        nodes.forEach((node) => {
            const text = node.textContent ? node.textContent.trim() : "";
            if (!text) return;

            const chapMatch = text.match(/^chapter\s*[:]?\s*(\d+)/i) || text.match(/^ch\.?\s*(\d+)/i);
            const verseMatch = text.match(/^verse\s*[:]?\s*(\d+)/i) || text.match(/^v\.?\s*(\d+)/i);

            if (chapMatch && chapMatch[1]) {
                currentChap = chapMatch[1];
                if (!currentSectionVerseMap[currentChap]) {
                    currentSectionVerseMap[currentChap] = {};
                }
            }

            if (verseMatch && verseMatch[1]) {
                const verseNum = verseMatch[1];
                currentSectionVerseMap[currentChap][verseNum] = node;
                node.dataset.verseNum = verseNum;
                node.dataset.chapterNum = currentChap;
            }
        });

        if (Object.keys(currentSectionVerseMap["1"]).length === 0) {
            nodes.forEach((node, idx) => {
                currentSectionVerseMap["1"][idx + 1] = node;
            });
        }

        populateChapterDropdown();
    }

    // 2. POPULATE CHAPTER DROPDOWN
    function populateChapterDropdown() {
        if (!chapterSelect) return;
        chapterSelect.innerHTML = '';

        const chapters = Object.keys(currentSectionVerseMap);
        if (chapters.length === 0) {
            chapters.push("1");
            currentSectionVerseMap["1"] = { "1": teleEdit };
        }

        chapters.forEach(chap => {
            const opt = document.createElement('option');
            opt.value = chap;
            opt.textContent = `Chapter ${chap}`;
            chapterSelect.appendChild(opt);
        });

        populateVerseDropdown();
    }

    // 3. POPULATE VERSE DROPDOWN BASED ON SELECTED CHAPTER
    function populateVerseDropdown() {
        if (!verseSelect || !chapterSelect) return;
        verseSelect.innerHTML = '';

        const activeChap = chapterSelect.value;
        const versesObj = currentSectionVerseMap[activeChap] || {};
        const verses = Object.keys(versesObj);

        if (verses.length === 0) {
            verses.push("1");
        }

        verses.forEach(verse => {
            const opt = document.createElement('option');
            opt.value = verse;
            opt.textContent = `Verse ${verse}`;
            verseSelect.appendChild(opt);
        });
    }

    if (chapterSelect) {
        chapterSelect.addEventListener('change', populateVerseDropdown);
    }

    window.addEventListener('textSectionLoaded', () => {
        setTimeout(parseChaptersAndVerses, 100);
    });

    setTimeout(parseChaptersAndVerses, 300);

    // 4. "GO" BUTTON NAVIGATION (Brings target verse precisely to the top)
    if (goBtn) {
        goBtn.addEventListener('click', (e) => {
            e.preventDefault();
            const chap = chapterSelect ? chapterSelect.value : "1";
            const verse = verseSelect ? verseSelect.value : "1";

            const targetNode = currentSectionVerseMap[chap]?.[verse];
            const scrollWrapper = document.getElementById('teleScrollWrapper') || document.getElementById('teleWrapper');

            if (targetNode && scrollWrapper) {
                // Sum up offset tops recursively up to the scroll wrapper for absolute precision
                let topPos = 0;
                let el = targetNode;
                while (el && el !== scrollWrapper && el !== document.body) {
                    topPos += el.offsetTop;
                    el = el.offsetParent;
                }

                // Scroll container so the selected verse sits right at the top (with a 10px safety buffer)
                scrollWrapper.scrollTo({
                    top: Math.max(0, topPos - 10),
                    behavior: 'smooth'
                });

                // Soft highlight effect to make it pop out
                targetNode.style.transition = 'background-color 0.3s ease';
                targetNode.style.backgroundColor = '#dbeafe';
                setTimeout(() => {
                    targetNode.style.backgroundColor = '';
                }, 1800);
            } else {
                console.warn(`Target Chapter ${chap}, Verse ${verse} element could not be located.`);
            }
        });
    }
});
</script>

<script>
/* ==========================================================================
   CASCADING CHAPTER & VERSE NAVIGATION & TOP-ALIGNMENT MODULE
   ========================================================================== */
document.addEventListener('DOMContentLoaded', () => {
    'use strict';

    const chapterSelect = document.getElementById('chapterSelect');
    const verseSelect = document.getElementById('verseSelect');
    const goBtn = document.getElementById('goBtn');
    const teleEdit = document.getElementById('teleEdit');

    let currentSectionVerseMap = {};

    // 1. PARSE CHAPTERS & VERSES FROM THE ACTIVE TEXT SECTION (Enhanced flexibility)
    function parseChaptersAndVerses() {
        currentSectionVerseMap = {};
        const editableZone = document.getElementById('editableTextZone') || teleEdit;
        if (!editableZone) return;

        const nodes = Array.from(editableZone.querySelectorAll('.line, p, h3, h4, span'));
        
        let currentChap = "1";
        currentSectionVerseMap[currentChap] = {};

        nodes.forEach((node) => {
            const text = node.textContent ? node.textContent.trim() : "";
            if (!text) return;

            // Check if node already has explicit dataset attributes
            if (node.dataset.verseNum) {
                const c = node.dataset.chapterNum || currentChap;
                const v = node.dataset.verseNum;
                if (!currentSectionVerseMap[c]) currentSectionVerseMap[c] = {};
                currentSectionVerseMap[c][v] = node;
                return;
            }

            // Flexible regex match for chapters and verses
            const chapMatch = text.match(/^(?:chapter|ch\.?)\s*(\d+)/i);
            const verseMatch = text.match(/^(?:verse|v\.?)\s*(\d+)/i) || text.match(/^(\d+[\.:])\s+/); // matches "1." or "1:" at start

            if (chapMatch && chapMatch[1]) {
                currentChap = chapMatch[1];
                if (!currentSectionVerseMap[currentChap]) {
                    currentSectionVerseMap[currentChap] = {};
                }
            }

            if (verseMatch && verseMatch[1]) {
                const verseNum = verseMatch[1].replace(/[\.:]/g, ''); // clean up punctuation if matched via "1."
                currentSectionVerseMap[currentChap][verseNum] = node;
                node.dataset.verseNum = verseNum;
                node.dataset.chapterNum = currentChap;
            }
        });

        // Fallback: If no explicit chapter/verse markers were found in the text, map sequential nodes as verses for Chapter 1
        let totalVersesFound = Object.values(currentSectionVerseMap).reduce((acc, chapObj) => acc + Object.keys(chapObj).length, 0);
        if (totalVersesFound === 0) {
            currentSectionVerseMap["1"] = {};
            nodes.forEach((node, idx) => {
                const vNum = String(idx + 1);
                currentSectionVerseMap["1"][vNum] = node;
                node.dataset.verseNum = vNum;
                node.dataset.chapterNum = "1";
            });
        }

        populateChapterDropdown();
    }

    // 2. POPULATE CHAPTER DROPDOWN (Defaults to "CH", options are pure numbers)
    function populateChapterDropdown() {
        if (!chapterSelect) return;
        chapterSelect.innerHTML = '';

        const defaultOpt = document.createElement('option');
        defaultOpt.value = "0";
        defaultOpt.textContent = "Subsection";
        chapterSelect.appendChild(defaultOpt);

        const chapters = Object.keys(currentSectionVerseMap);
        chapters.forEach(chap => {
            const opt = document.createElement('option');
            opt.value = chap;
            opt.textContent = chap; // Pure number
            chapterSelect.appendChild(opt);
        });

        populateVerseDropdown();
    }

    // 3. POPULATE VERSE DROPDOWN BASED ON SELECTED CHAPTER (Defaults to "V", populates all verses correctly)
    function populateVerseDropdown() {
        if (!verseSelect || !chapterSelect) return;
        verseSelect.innerHTML = '';

        const defaultOpt = document.createElement('option');
        defaultOpt.value = "0";
        defaultOpt.textContent = "Line Entry";
        verseSelect.appendChild(defaultOpt);

        const allChapters = Object.keys(currentSectionVerseMap);
        let activeChap = chapterSelect.value;
        if (!activeChap || activeChap === "0") {
            activeChap = allChapters[0] || "1";
        }

        const versesObj = currentSectionVerseMap[activeChap] || {};
        const verses = Object.keys(versesObj);

        // If no explicit verses mapped for this chapter, create indices based on node count/fallback
        if (verses.length === 0 && teleEdit) {
            const fallbackNodes = Array.from(teleEdit.querySelectorAll('.line, p, h3, h4'));
            fallbackNodes.forEach((node, idx) => {
                const vNum = String(idx + 1);
                versesObj[vNum] = node;
                verses.push(vNum);
            });
            currentSectionVerseMap[activeChap] = versesObj;
        }

        verses.forEach(verse => {
            const opt = document.createElement('option');
            opt.value = verse;
            opt.textContent = verse; // Pure number
            verseSelect.appendChild(opt);
        });
    }

    if (chapterSelect) {
        chapterSelect.addEventListener('change', populateVerseDropdown);
    }

    window.addEventListener('textSectionLoaded', () => {
        setTimeout(parseChaptersAndVerses, 100);
    });

    setTimeout(parseChaptersAndVerses, 300);

    // 4. "GO" BUTTON NAVIGATION
    if (goBtn) {
        goBtn.addEventListener('click', (e) => {
            e.preventDefault();
            let chap = chapterSelect ? chapterSelect.value : "1";
            let verse = verseSelect ? verseSelect.value : "1";

            if (chap === "0") chap = Object.keys(currentSectionVerseMap)[0] || "1";
            if (verse === "0") verse = "1";

            const targetNode = currentSectionVerseMap[chap]?.[verse];
            const scrollWrapper = document.getElementById('teleScrollWrapper') || document.getElementById('teleWrapper');

            if (targetNode && scrollWrapper) {
                let topPos = 0;
                let el = targetNode;
                while (el && el !== scrollWrapper && el !== document.body) {
                    topPos += el.offsetTop;
                    el = el.offsetParent;
                }

                scrollWrapper.scrollTo({
                    top: Math.max(0, topPos - 10),
                    behavior: 'smooth'
                });

                targetNode.style.transition = 'background-color 0.3s ease';
                targetNode.style.backgroundColor = '#dbeafe';
                setTimeout(() => {
                    targetNode.style.backgroundColor = '';
                }, 1800);
            } else {
                console.warn(`Target Chapter ${chap}, Verse ${verse} element could not be located.`);
            }
        });
    }
});
</script>

<script>
/* =========================================================
   EXPERIMENTAL LINE ENTRY SYSTEM
   ---------------------------------------------------------
   Uses the selected SECTION NAME to identify the title.

   Section title:
       NOT numbered

   A Line Entry is one blank-line-separated block.

   Example:

       This is sentence one.
       This is sentence two.
       This is sentence three.

       This is sentence four.

   becomes:

       1. This is sentence one.
          This is sentence two.
          This is sentence three.

       2. This is sentence four.

   Multiple sentences on one physical line are also treated
   as one Line Entry.

   Blank lines:
       separate Line Entries

   This is experimental and does NOT modify the existing
   Bible/verse system.
   ========================================================= */

(function () {
    'use strict';

    let lineEntryMap = {};


    /* =====================================================
       GET CURRENT SECTION NAME
       ===================================================== */

    function getCurrentSectionName() {

        /* Preferred: the selected section */
        if (
            window.SCRAMBLE_SECTIONS &&
            typeof window.selectedSectionIndex !== 'undefined' &&
            window.selectedSectionIndex >= 0 &&
            window.SCRAMBLE_SECTIONS[
                window.selectedSectionIndex
            ]
        ) {

            return (
                window.SCRAMBLE_SECTIONS[
                    window.selectedSectionIndex
                ].name || ''
            ).trim();
        }


        /* Your main script uses this variable too */
        if (window.currentQuizSectionName) {

            return String(
                window.currentQuizSectionName
            ).trim();
        }


        return '';
    }


    /* =====================================================
       CLEAN TEXT FOR COMPARISON
       ===================================================== */

    function cleanComparisonText(text) {

        return String(text || '')
            .replace(/\u00a0/g, ' ')
            .replace(/^\s*\d+\.\s*/, '')
            .trim()
            .toLowerCase();
    }


    /* =====================================================
       REMOVE ONLY NUMBERS CREATED BY THIS SCRIPT
       ===================================================== */

    function removeExperimentalNumbers(editableZone) {

        editableZone
            .querySelectorAll(
                '[data-experimental-line-number="true"]'
            )
            .forEach(function (number) {

                number.remove();
            });


        editableZone
            .querySelectorAll(
                '.line[data-experimental-line-entry]'
            )
            .forEach(function (line) {

                delete line.dataset.experimentalLineEntry;
            });
    }


    /* =====================================================
       SET UP LINE ENTRIES
       ===================================================== */

    function setupExperimentalLineEntries() {

        const editableZone =
            document.getElementById(
                'editableTextZone'
            );

        const verseSelect =
            document.getElementById(
                'verseSelect'
            );

        if (!editableZone) return;


        const lines =
            Array.from(
                editableZone.querySelectorAll(
                    '.line'
                )
            );

        if (!lines.length) return;


        /* -------------------------------------------------
           Remove our previous numbering
           ------------------------------------------------- */

        removeExperimentalNumbers(
            editableZone
        );


        /* -------------------------------------------------
           Get the actual selected section name
           ------------------------------------------------- */

        const sectionName =
            getCurrentSectionName();


        const cleanSectionName =
            cleanComparisonText(
                sectionName
            );


        let titleLineFound = false;

        let entryNumber = 0;

        lineEntryMap = {};


        /* =================================================
           BUILD BLOCKS

           Consecutive non-blank .line elements belong
           to the same Line Entry.

           A blank .line ends the current block.
           ================================================= */

        let currentBlock = [];


        const blocks = [];


        lines.forEach(function (line) {

            const originalText =
                (line.textContent || '')
                    .replace(/\u00a0/g, ' ')
                    .trim();


            /* ---------------------------------------------
               Blank line = end of current block
               --------------------------------------------- */

            if (!originalText) {

                if (currentBlock.length) {

                    blocks.push(
                        currentBlock
                    );

                    currentBlock = [];
                }

                return;
            }


            /* ---------------------------------------------
               Non-blank line = add to current block
               --------------------------------------------- */

            currentBlock.push(line);
        });


        /* -------------------------------------------------
           Add final block if there is no blank line at
           the end of the text.
           ------------------------------------------------- */

        if (currentBlock.length) {

            blocks.push(
                currentBlock
            );
        }


        /* =================================================
           PROCESS BLOCKS
           ================================================= */

        blocks.forEach(function (block) {

            if (!block.length) return;


            /* ---------------------------------------------
               Determine whether this block is the title
               --------------------------------------------- */

            const firstLineText =
                (block[0].textContent || '')
                    .replace(/\u00a0/g, ' ')
                    .trim();


            const cleanFirstLineText =
                cleanComparisonText(
                    firstLineText
                );


            /*
             * If the first line matches the actual selected
             * section name, this whole block is the title.
             *
             * This also handles an existing section number:
             *
             *     1. The Fox and the Crow
             */

            if (
                cleanSectionName &&
                cleanFirstLineText ===
                    cleanSectionName
            ) {

                titleLineFound = true;

                return;
            }


            /*
             * If we don't have a section name available,
             * fall back to treating the first block as
             * the title.
             *
             * This is only a fallback.
             */

            if (
                !cleanSectionName &&
                !titleLineFound &&
                entryNumber === 0
            ) {

                titleLineFound = true;

                return;
            }


            /* ---------------------------------------------
               This whole block is one Line Entry
               --------------------------------------------- */

            entryNumber++;


            const firstLine =
                block[0];


            const numberSpan =
                document.createElement(
                    'span'
                );


            numberSpan.setAttribute(
                'data-experimental-line-number',
                'true'
            );


            numberSpan.textContent =
                entryNumber + '. ';


            /*
             * Put the number only at the beginning
             * of the first physical line in the block.
             */

            firstLine.insertBefore(
                numberSpan,
                firstLine.firstChild
            );


            /* ---------------------------------------------
               Mark every physical line in the block as
               belonging to this Line Entry.
               --------------------------------------------- */

            block.forEach(function (line) {

                line.dataset.experimentalLineEntry =
                    String(entryNumber);
            });


            /* ---------------------------------------------
               Store the first physical line as the target
               for scrolling.
               --------------------------------------------- */

            lineEntryMap[entryNumber] =
                firstLine;
        });


        /* =================================================
           POPULATE LINE ENTRY SELECTOR
           ================================================= */

        if (verseSelect) {

            verseSelect.innerHTML = '';


            const defaultOption =
                document.createElement(
                    'option'
                );

            defaultOption.value = '';

            defaultOption.textContent =
                'Line Entry';

            verseSelect.appendChild(
                defaultOption
            );


            Object.keys(
                lineEntryMap
            ).forEach(function (number) {

                const option =
                    document.createElement(
                        'option'
                    );

                option.value =
                    number;

                option.textContent =
                    number;

                verseSelect.appendChild(
                    option
                );
            });
        }


        /* -------------------------------------------------
           Store globally for testing
           ------------------------------------------------- */

        window.experimentalLineEntryMap =
            lineEntryMap;


        console.log(
            'Experimental Line Entries:',
            Object.keys(
                lineEntryMap
            ).length
        );
    }


    /* =====================================================
       RUN AFTER TEXT IS LOADED
       ===================================================== */

    window.addEventListener(
        'textSectionLoaded',
        function () {

            setTimeout(
                setupExperimentalLineEntries,
                50
            );
        }
    );


    /* =====================================================
       INITIAL PAGE LOAD
       ===================================================== */

    document.addEventListener(
        'DOMContentLoaded',
        function () {

            setTimeout(
                setupExperimentalLineEntries,
                150
            );
        }
    );


    /* =====================================================
       GO BUTTON
       ===================================================== */

    document.addEventListener(
        'click',
        function (e) {

            const goBtn =
                e.target.closest(
                    '#goBtn'
                );

            if (!goBtn) return;


            const verseSelect =
                document.getElementById(
                    'verseSelect'
                );

            if (!verseSelect) return;


            const selected =
                verseSelect.value;

            if (!selected) return;


            const target =
                lineEntryMap[selected];

            if (!target) return;


            const scrollContainer =
                document.getElementById(
                    'teleScrollWrapper'
                ) ||
                document.getElementById(
                    'teleWrapper'
                );


            if (!scrollContainer) return;


            const containerRect =
                scrollContainer.getBoundingClientRect();

            const targetRect =
                target.getBoundingClientRect();


            const targetTop =
                scrollContainer.scrollTop +
                (
                    targetRect.top -
                    containerRect.top
                ) -

            scrollContainer.scrollTo({

            });

                },
                1000
            );
        }
    );

})();

<script>
(function() {
  'use strict';

  // 1. Inject Styles for Media Viewer Button
  if (!document.getElementById('pureMediaStyles')) {
    const style = document.createElement('style');
    style.id = 'pureMediaStyles';
    style.textContent = `
      .media-view-btn {
        height: 28px;
        padding: 0 10px;
        font-family: inherit;
        font-size: 13px;
        font-weight: 500;
        background: #f1f5f9;
        color: #2563eb;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        white-space: nowrap;
        margin-left: 8px;
      }
      .media-view-btn:hover {
        background: #e2e8f0;
      }
    `;
    document.head.appendChild(style);
  }

  // Listen to section load events to keep index synchronized globally
  window.addEventListener('textSectionLoaded', () => {
    if (window.SCRAMBLE_SECTIONS && window.currentQuizSectionName) {
      const idx = window.SCRAMBLE_SECTIONS.findIndex(s => s.name === window.currentQuizSectionName);
      if (idx >= 0) {
        window.selectedSectionIndex = idx;
        sessionStorage.setItem('mediaSectionIndex', idx);
      }
    }
  });

  // Track clicks on section tiles to update index instantly
  document.addEventListener('click', function(e) {
    const tile = e.target.closest('.section-item');
    if (tile) {
      const container = document.getElementById('sectionListContainer');
      if (container) {
        const items = Array.from(container.querySelectorAll('.section-item'));
        const idx = items.indexOf(tile);
        if (idx >= 0) {
          window.selectedSectionIndex = idx;
          sessionStorage.setItem('mediaSectionIndex', idx);
        }
      }
    }
  }, true);

  // 2. Open Media Logic using synchronized index lookup
  async function openMedia() {
    const modalRoot = document.getElementById('mediaModalRoot');
    const contentArea = document.getElementById('media-modal-body');
    if (!modalRoot || !contentArea) {
      alert("Media modal container elements not found.");
      return;
    }

    contentArea.innerHTML = '<p style="font-size: var(--size-small); color: #666;">Loading asset...</p>';
    modalRoot.classList.add('active');

    // Determine correct index using global template data and fallbacks
    let idx = 0;
    if (window.SCRAMBLE_SECTIONS && window.currentQuizSectionName) {
      const foundIdx = window.SCRAMBLE_SECTIONS.findIndex(s => s.name === window.currentQuizSectionName);
      if (foundIdx >= 0) idx = foundIdx;
    } else if (typeof window.selectedSectionIndex !== 'undefined' && window.selectedSectionIndex >= 0) {
      idx = Number(window.selectedSectionIndex);
    } else if (sessionStorage.getItem('mediaSectionIndex') !== null) {
      idx = Number(sessionStorage.getItem('mediaSectionIndex'));
    }

    const rawScript = document.getElementById('mediaRawText');
    if (!rawScript) {
      contentArea.innerHTML = '<p style="color: red;">Error: #mediaRawText block not found.</p>';
      return;
    }

    const lines = rawScript.textContent.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
    const filename = lines[idx] || lines[0];

    if (!filename) {
      contentArea.innerHTML = `<p style="color: #666;">No media file mapped for section index ${idx}.</p>`;
      return;
    }

    contentArea.innerHTML = '';
    const fileUrl = `./${filename}`;
    const ext = filename.split('.').pop().toLowerCase();

    if (['jpg', 'jpeg', 'png', 'gif', 'webp'].includes(ext)) {
      const img = document.createElement('img');
      img.src = fileUrl;
      contentArea.appendChild(img);
    } else if (['mp4', 'webm', 'ogg'].includes(ext)) {
      const video = document.createElement('video');
      video.src = fileUrl;
      video.controls = true;
      video.autoplay = true;
      contentArea.appendChild(video);
    } else if (ext === 'html') {
      const iframe = document.createElement('iframe');
      iframe.src = fileUrl;
      contentArea.appendChild(iframe);
    } else if (ext === 'txt') {
      try {
        const res = await fetch(fileUrl);
        const text = await res.text();
        const pre = document.createElement('pre');
        pre.textContent = text;
        pre.style.fontFamily = 'monospace';
        pre.style.whiteSpace = 'pre-wrap';
        contentArea.appendChild(pre);
      } catch (err) {
        contentArea.innerHTML = `<p style="color: red;">Could not load text file: ${filename}</p>`;
      }
    } else {
      contentArea.innerHTML = `<p>Unsupported file format: ${ext}</p>`;
    }
  }

  // 3. Button Injection into top-bar-row-1
  function initButton() {
    const row1 = document.querySelector('.top-bar-row-1');
    if (row1 && !row1.querySelector('.media-view-btn')) {
      const btn = document.createElement('button');
      btn.className = 'media-view-btn';
      btn.type = 'button';
      btn.textContent = 'Media';
      btn.addEventListener('click', openMedia);
      row1.appendChild(btn);
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initButton);
  } else {
    initButton();
  }

  setTimeout(initButton, 500);
  setTimeout(initButton, 1500);
})();
</script>

<script>
document.addEventListener("DOMContentLoaded", function () {
  "use strict";

  const toggle = document.getElementById("toolsToggleBar");
  const bar = document.getElementById("toolsButtonBar");
  const rawScript = document.getElementById("toolsRawText");
  const quizToggle = document.getElementById("quizToggleBar");

  if (!toggle || !bar) {
    console.error("TOOLS: Missing toolsToggleBar or toolsButtonBar.");
    return;
  }

  // Mirror the Quiz button styling metrics
  if (quizToggle) {
    const quizComputed = window.getComputedStyle(quizToggle);
    toggle.style.width = quizComputed.width;
    toggle.style.height = quizComputed.height;
    toggle.style.margin = quizComputed.margin;
    toggle.style.padding = quizComputed.padding;
    toggle.style.borderRadius = quizComputed.borderRadius;
    toggle.style.border = quizComputed.border;
    toggle.style.background = quizComputed.background;
    toggle.style.color = quizComputed.color;
    toggle.style.fontFamily = quizComputed.fontFamily;
    toggle.style.fontSize = quizComputed.fontSize;
    toggle.style.fontWeight = quizComputed.fontWeight;
    toggle.style.boxShadow = quizComputed.boxShadow;
  }

  // Force strict centering inside the button itself
  toggle.style.setProperty("display", "flex", "important");
  toggle.style.setProperty("align-items", "center", "important");
  toggle.style.setProperty("justify-content", "center", "important");
  toggle.style.setProperty("box-sizing", "border-box", "important");
  toggle.style.setProperty("margin-left", "auto", "important");
  toggle.style.setProperty("margin-right", "auto", "important");

  bar.innerHTML = "";

  if (rawScript) {
    const lines = rawScript.textContent.split(/\r?\n/).map(l => l.trim()).filter(Boolean);

    lines.forEach(function (line, index) {
      let label = "";
      let filename = "";

      if (line.includes('|')) {
        const parts = line.split('|').map(p => p.trim());
        label = parts[0];
        filename = parts[1];
      } else {
        filename = line;
        let clean = filename.replace(/\.[^/.]+$/, '');
        clean = clean.replace(/^[A-Z]_\d+_/i, '');
        clean = clean.replace(/^Bible_\d+_/i, '');
        clean = clean.replace(/_EFL$/i, '');
        clean = clean.replace(/_/g, ' ');
        label = clean.trim();
      }

      if (!filename) return;

      const button = document.createElement("button");
      button.type = "button";
      
      const itemNum = index + 1;
      button.textContent = `${itemNum}. ${label}`;

      // 4 Columns layout, 8px text, matching button theme
      button.style.cssText = "flex: 0 0 calc(25% - 3px); box-sizing: border-box; padding: 6px 4px; font-size: 8px; font-weight: 500; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; background: linear-gradient(145deg, #ffffff, var(--section-item-default)); color: var(--blue); border: 1px solid var(--input-border-blue); border-radius: 6px; cursor: pointer; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);";

      button.addEventListener("click", function () {
        openToolModal(filename);
      });

      bar.appendChild(button);
    });
  }

  toggle.addEventListener("click", function () {
    const isHidden = getComputedStyle(bar).display === "none" || bar.style.display === "none";
    bar.style.display = isHidden ? "flex" : "none";
    toggle.textContent = isHidden ? "▲ Hide Extra" : "▼ Show Extra";
  });

  window.openToolModal = function (file) {
    const modal = document.getElementById("toolModal");
    const iframe = document.getElementById("toolIframe");

    if (!modal || !iframe) {
      console.error("TOOLS: Modal or iframe missing.");
      return;
    }

    iframe.src = file;
    modal.classList.add("show");
  };

  const backBtn = document.getElementById("modalBackBtn");
  if (backBtn) {
    backBtn.addEventListener("click", function () {
      const modal = document.getElementById("toolModal");
      const iframe = document.getElementById("toolIframe");

      if (iframe) iframe.src = "";
      if (modal) modal.classList.remove("show");
    });
  }
});
</script>
