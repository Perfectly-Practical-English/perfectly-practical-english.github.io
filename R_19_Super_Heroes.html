<script>
/* ==========================================================================
   UNIFIED TEXT & APPLICATION SCRIPT (Refactored & Consolidated)
   ================================================================          */
document.addEventListener('DOMContentLoaded', () => {
    'use strict';

    // ==========================================
    // 1. DOM ELEMENT REFERENCES
    // ==========================================
    const teleEdit = document.getElementById('teleEdit');
    const teleOverlay = document.getElementById('teleOverlay');
    const mainSubmitBtn = document.getElementById('submitBtn');

    // Modal Elements — NEW TILE TOC
    const modal = document.getElementById("sectionModalRoot");
    const openBtn = document.getElementById("sectionSelectorBtn");
    const cancelBtn = document.getElementById("sectionModalClose");
    const confirmBtn = document.getElementById("sectionConfirmBtn");
    const sectionListContainer = document.getElementById("sectionListContainer");

    // Scoreboard Elements
    const gsScoreboard = document.getElementById('gsScoreboard');
    const gsScoreMeta = document.getElementById('gsScoreMeta');
    const gsScoreText = document.getElementById('gsScoreText');
    const copyScoreBtn = document.getElementById('copyScoreBtn');
    const downloadScoreTxtBtn = document.getElementById('downloadScoreTxtBtn');
    const downloadScorePngBtn = document.getElementById('downloadScorePngBtn');

    // User Data Elements
    const gsId = document.getElementById('gsId');
    const gsName = document.getElementById('gsName');

    // Enable Submit only when Student ID is entered
    if (gsId && mainSubmitBtn) {
        mainSubmitBtn.disabled = false;   // <-- enable on load

        gsId.addEventListener('input', () => {
            mainSubmitBtn.disabled = !gsId.value.trim();
        });
    }

    // Audio Elements
    const captureAudioBtn = document.getElementById('captureAudioBtn');
    const copyBlobBtn = document.getElementById('copyBlobBtn');
    const downloadBlobBtn = document.getElementById('downloadBlobBtn');

    // ==========================================
    // 2. INTERNAL STATE
    // ==========================================
    let selectedSectionIndex = -1;
    let pendingSectionIndex = -1;
    let initialText = '';
    let mediaRecorder = null;
    let audioChunks = [];
    let audioBlob = null;

    // Initialize baseline text safely
    setTimeout(() => {
        if (teleEdit) {
            initialText = teleEdit.innerText || teleEdit.textContent || '';
        }
    }, 150);

    if (gsScoreboard) {
        gsScoreboard.style.display = 'none';
    }

    // ==========================================
    // 3. PURE PARSER & UTILITY FUNCTIONS
    // ==========================================
    window.parseSectionsFromRaw = function(raw) {
        const sections = [];
        let current = null;

        raw.split(/\r?\n/).forEach(line => {
            const t = line.trim();
            if (t.startsWith("~")) {
                current = {
                    id: t.slice(1).trim().toLowerCase().replace(/\s+/g, "-"),
                    name: t.slice(1).trim(),
                    text: ""
                };
                sections.push(current);
                return;
            }
            if (current) {
                const cleanLine = line.replace(/~/g, '');
                current.text += cleanLine + "\n";
            }
        });
        return sections;
    };

    window.parseVocabsFromRaw = function(raw) {
        const sections = {};
        let current = null;

        raw.split(/\r?\n/).forEach(line => {
            const t = line.trim();
            if (!t) return;

            if (t.startsWith("~")) {
                current = t.slice(1).trim();
                sections[current] = [];
                return;
            }

            if (current && t.startsWith("•")) {
                const m = t.match(/•\s*([^\s–]+)/);
                if (m) sections[current].push(m[1]);
            }
        });
        return sections;
    };

    function loadRawTextBlocks() {
        const blobs = [];
        const byId = document.getElementById('rawText');
        if (byId && byId.textContent) blobs.push(byId.textContent.trim());
        document.querySelectorAll('script[type="text/plain"].rawText, script[type="text/plain"]').forEach((s) => {
            if (s.id === 'rawText') return;
            if (s.textContent && s.textContent.trim()) blobs.push(s.textContent.trim());
        });
        return blobs.join("\n\n");
    }

    window.cleanSectionText = function(str) {
        if (!str) return "";
        let working = str;
        const first = working.indexOf('~');
        const last = working.lastIndexOf('~');
        if (first !== -1 && last !== -1 && last > first) {
            working = working.slice(first + 1, last);
        }
        const lines = working.split(/\r?\n/);
        const validLines = [];
        for (let line of lines) {
            const trimmed = line.trim();
            if (trimmed === 'QUIZ' || trimmed === 'Quiz') break; 
            validLines.push(line);
        }
        return validLines.join('\n');
    };

    window.calculateFastChangePercentage = function(original, current) {
        if (!original || !current) return 0;
        const getWords = str => str.toLowerCase().match(/\b[a-z0-9'-]+\b/g) || [];
        const origWords = getWords(original);
        const currWords = getWords(current);
        if (origWords.length === 0) return currWords.length > 0 ? 100 : 0;
        
        const origMap = {};
        origWords.forEach(w => origMap[w] = (origMap[w] || 0) + 1);
        
        let matches = 0;
        currWords.forEach(w => {
            if (origMap[w] && origMap[w] > 0) {
                matches++;
                origMap[w]--;
            }
        });
        
        const maxLen = Math.max(origWords.length, currWords.length);
        const similarity = matches / maxLen;
        return Math.max(0, Math.min(100, Math.round((1 - similarity) * 100)));
    };

    // Global helper referenced in multiple scripts
    window.getCurrentTopEditedText = function() {
        const editableZone = document.getElementById('editableTextZone');
        if (!editableZone) return teleEdit ? (teleEdit.innerText || teleEdit.textContent || '') : '';
        const linesArr = Array.from(editableZone.querySelectorAll('.line:not(.spacer)'));
        return linesArr.length > 0 
            ? linesArr.map(line => line.textContent).join('\n') 
            : (editableZone.innerText || editableZone.textContent || '');
    };

    // ==========================================
    // 4. SECTION SETUP & TILE TOC BINDINGS
    // ==========================================
    const rawText = loadRawTextBlocks();
    window.SCRAMBLE_SECTIONS = window.parseSectionsFromRaw(rawText);
    window.SCRAMBLE_INDEX = 0;

    // Build the new tile-based TOC
    if (sectionListContainer && window.SCRAMBLE_SECTIONS.length > 0) {
        sectionListContainer.innerHTML = '';

        window.SCRAMBLE_SECTIONS.forEach((section, index) => {
            const tile = document.createElement('div');

            tile.className = 'section-item';
            tile.textContent = section.name;
            tile.dataset.index = index;
            tile.setAttribute('role', 'button');
            tile.setAttribute('tabindex', '0');

            const selectSection = () => {

                /* Remember the section being considered */
                pendingSectionIndex = index;

                /* Remove selected appearance from all tiles */
                const allTiles =
                    sectionListContainer.querySelectorAll(".section-item");

                allTiles.forEach(tile => {
                    tile.classList.remove("selected");
                });

                /* Keep the clicked tile dark */
                tile.classList.add("selected");
            };

            tile.addEventListener('click', selectSection);

            tile.addEventListener('keydown', e => {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    selectSection();
                }
            });

            sectionListContainer.appendChild(tile);
        });
    }

    // Open TOC
    if (openBtn && modal) {
        openBtn.addEventListener("click", () => {

            /* Start with the currently confirmed section */
            pendingSectionIndex = selectedSectionIndex;

            const allTiles =
                sectionListContainer.querySelectorAll(".section-item");

            allTiles.forEach((tile, index) => {
                tile.classList.toggle(
                    "selected",
                    index === selectedSectionIndex
                );
            });

            modal.style.display = "block";
        });
    }

    // Confirm selected section
    if (confirmBtn && modal) {
        confirmBtn.addEventListener("click", () => {

            if (pendingSectionIndex < 0) return;

            const section =
                window.SCRAMBLE_SECTIONS[pendingSectionIndex];

            if (!section) return;

            /* Confirm the highlighted section */
            selectedSectionIndex = pendingSectionIndex;

            /* Save the actual selected section */
            window.currentQuizSectionText = section.text || '';
            window.currentQuizSectionName = section.name || '';

            /* Load the selected section */
            if (window.loadSectionWithLockedQuiz) {
                window.loadSectionWithLockedQuiz(section.text);
            }

            const editableZone =
                document.getElementById('editableTextZone') ||
                teleEdit;

            if (editableZone) {
                const titleDiv = document.createElement('div');
                titleDiv.className = 'section-title';
                titleDiv.textContent = section.name;

                editableZone.insertBefore(
                    titleDiv,
                    editableZone.firstChild
                );
            }

            window.updateTextOverlay();

            /* Close only after confirmation */
            modal.style.display = "none";
        });
    }

    // Close TOC with X
    if (cancelBtn && modal) {
        cancelBtn.addEventListener("click", () => {
            modal.style.display = "none";
        });
    }

    window.loadSectionWithLockedQuiz = function(sectionText) {
        if (!sectionText || !teleEdit) return;

        let fullText = sectionText;
        const first = sectionText.indexOf('~');
        const last = sectionText.lastIndexOf('~');
        if (first !== -1 && last !== -1 && last > first) {
            fullText = sectionText.slice(first + 1, last);
        }

        window._currentOriginalBaseline = window.cleanSectionText(fullText);

        let activePart = fullText;
        const lines = fullText.split(/\r?\n/);
        for (let i = 0; i < lines.length; i++) {
            const trimmed = lines[i].trim();
            if (trimmed === 'QUIZ' || trimmed === 'Quiz') {
                activePart = lines.slice(0, i).join('\n');
                break;
            }
        }

        teleEdit.innerHTML = '';
        teleEdit.setAttribute('contenteditable', 'false');

        const editableContainer = document.createElement('div');
        editableContainer.id = 'editableTextZone';
        editableContainer.className = 'question-text editable-text-zone';
        editableContainer.setAttribute('contenteditable', 'true');

        activePart.split(/\r?\n/).forEach(line => {
            const p = document.createElement('p');
            p.className = 'line';
            if (line.trim() === '') {
                p.innerHTML = '&nbsp;';
            } else {
                p.textContent = line;
            }
            editableContainer.appendChild(p);
        });
        teleEdit.appendChild(editableContainer);

        window.dispatchEvent(new CustomEvent('textSectionLoaded', { detail: { sectionText: fullText } }));
        window.updateTextOverlay();
    };

    // ==========================================
    // 5. LIVE TELEPROMPTER OVERLAY & TYPING
    // ==========================================
    window.updateTextOverlay = function() {
        const editableZone = document.getElementById('editableTextZone');
        if (!editableZone) return;

        let rawTextContent = "";
        const lineDivs = editableZone.querySelectorAll('.line, p');
        if (lineDivs.length > 0) {
            rawTextContent = Array.from(lineDivs).map(div => div.innerHTML === '&nbsp;' ? '' : div.textContent).join('\n');
        } else {
            rawTextContent = editableZone.innerText || '';
        }
        
        const cleanActiveText = window.cleanSectionText(rawTextContent);
        const s = (cleanActiveText.match(/[.!?]+/g) || []).length;
        const originalBaselineText = window._currentOriginalBaseline || initialText;
        const currentChangeRate = originalBaselineText ? window.calculateFastChangePercentage(originalBaselineText, cleanActiveText) : 0;

        if (teleOverlay) {
            const outputText = `${cleanActiveText.length} chars · ${s} sent · Changed: ${currentChangeRate}%`;
            if (teleOverlay.tagName === 'INPUT' || teleOverlay.tagName === 'TEXTAREA') {
                teleOverlay.value = outputText;
            } else {
                teleOverlay.textContent = outputText;
            }
        }
    };

    document.addEventListener('input', (e) => {
        const editableZone = document.getElementById('editableTextZone');
        if (editableZone && editableZone.contains(e.target)) {
            window.updateTextOverlay();
        }
    });

    // ==========================================
    // 6. SUBMISSION & SCOREBOARD HANDLER
    // ==========================================
    if (mainSubmitBtn) {
        mainSubmitBtn.addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();

            const id = gsId ? gsId.value.trim() || 'Student' : 'Student';
            const name = (window.resolveStudentNameFromId && id !== 'Student') 
                ? window.resolveStudentNameFromId(id) 
                : (gsName ? gsName.value.trim() || 'Guest' : 'Guest');
            
            if (gsName) gsName.value = name;

            const txt = window.getCurrentTopEditedText();
            const cleanText = window.cleanSectionText(txt);
            const chars = cleanText.length;
            const sentenceCount = (cleanText.match(/[.!?]+/g) || []).length;

            let changeRate = 0;
            const baseline = window._currentOriginalBaseline || initialText;
            if (baseline) {
                changeRate = window.calculateFastChangePercentage(baseline, cleanText);
            } else if (initialText.length > 0) {
                const diff = Math.abs(chars - initialText.length);
                changeRate = Math.min(100, Math.round((diff / initialText.length) * 100));
            }

            const now = new Date();
            const pad = n => String(n).padStart(2, '0');

            const dateString =
                `${pad(now.getDate())}/` +
                `${pad(now.getMonth() + 1)}/` +
                `${now.getFullYear()} ` +
                `${pad(now.getHours())}:` +
                `${pad(now.getMinutes())}:` +
                `${pad(now.getSeconds())}`;

            const filename =
                window.location.pathname.split('/').pop() || 'quiz';

            let sectionName = '';

            if (
                window.SCRAMBLE_SECTIONS &&
                selectedSectionIndex >= 0 &&
                window.SCRAMBLE_SECTIONS[selectedSectionIndex]
            ) {
                sectionName =
                    window.SCRAMBLE_SECTIONS[selectedSectionIndex].name || '';
            }

            if (!sectionName) {
                sectionName = document.title || 'Text';
            }

            const metaString =
                `${filename}|` +
                `${sectionName}: Edits|` +
                `${name}|` +
                `${id}|` +
                `${dateString}|` +
                `Chars:${chars}|` +
                `Sentences:${sentenceCount}|` +
                `Changed:${changeRate}%`;

            if (gsScoreMeta) {
                gsScoreMeta.textContent = metaString;
            }

            if (gsScoreText) {
                gsScoreText.textContent = cleanText;
            }

            if (gsScoreboard) {
                gsScoreboard.style.display = 'block';
                gsScoreboard.scrollIntoView({
                    behavior: 'smooth',
                    block: 'start'
                });
            }

            if (teleEdit) {
                teleEdit.setAttribute(
                    'contenteditable',
                    'false'
                );
            }

            const payload =
                `${metaString}\n\n${cleanText}`;

            console.log(
                "SUPABASE PAYLOAD:",
                payload
            );

            if (
                typeof window.saveResult === 'function'
            ) {
                window.saveResult(payload);
            }
        });
    }

    // ==========================================
    // 7. UNIFIED EXPORT HANDLERS (Copy, TXT, PNG)
    // ==========================================
    function sanitizeFilename(name) {
        return name.trim()
            .replace(/[\\/:*?"<>|]+/g, '_')
            .replace(/[\r\n]+/g, '_')
            .slice(0, 200) || 'score';
    }

    function downloadBlob(blob, filename) {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        setTimeout(() => {
            URL.revokeObjectURL(a.href);
            a.remove();
        }, 2000);
    }

    async function downloadScoreAsPNG(text, filename) {
        const wrapper = document.createElement('div');

        wrapper.className = 'png-export-wrapper';

        wrapper.style.width = '794px';
        wrapper.style.boxSizing = 'border-box';
        wrapper.style.padding = '40px';
        wrapper.style.background = '#fff';
        wrapper.style.fontFamily = 'Arial, sans-serif';
        wrapper.style.fontSize = '14px';
        wrapper.style.lineHeight = '1.5';
        wrapper.style.whiteSpace = 'normal';
        wrapper.style.overflowWrap = 'break-word';
        wrapper.style.wordBreak = 'break-word';

        wrapper.innerHTML = text.replace(/\n/g, '<br>');

        document.body.appendChild(wrapper);

        try {
            const canvas = await html2canvas(wrapper, {
                scale: 2,
                backgroundColor: '#fff',
                width: 794
            });

            const blob = await new Promise(res =>
                canvas.toBlob(res, 'image/png')
            );

            downloadBlob(blob, filename);

        } catch (err) {
            console.error(err);
            alert('PNG download failed');

        } finally {
            wrapper.remove();
        }
    }

    function hijackDownloadButton(originalBtn, getScoreText, getFilename, isText) {
        if (!originalBtn) return;
        const newBtn = originalBtn.cloneNode(true);
        originalBtn.parentNode.replaceChild(newBtn, originalBtn);

        newBtn.addEventListener('click', async e => {
            e.preventDefault();
            e.stopImmediatePropagation();

            const scoreText = getScoreText();
            if (!scoreText) {
                alert('No scoreboard data found. Submit first.');
                return;
            }

            const filename = sanitizeFilename(getFilename());
            if (isText) {
                downloadBlob(new Blob([scoreText], { type: 'text/plain' }), filename + '.txt');
            } else {
                await downloadScoreAsPNG(scoreText, filename + '.png');
            }
        }, true);
    }

    // Direct Button Handlers for standard score buttons
    if (copyScoreBtn) {
        copyScoreBtn.addEventListener('click', async () => {
            const meta = gsScoreMeta ? gsScoreMeta.textContent : '';
            const text = gsScoreText ? gsScoreText.textContent : '';
            const fullText = meta ? (meta + "\n\n" + text) : text;

            try {
                await navigator.clipboard.writeText(fullText);
                if (typeof showToast === 'function') showToast('Copied scoreboard text');
                else alert('Scoreboard text copied to clipboard!');
            } catch (e) {
                alert('Copy failed');
            }
        });
    }

    if (downloadScoreTxtBtn) {
        downloadScoreTxtBtn.addEventListener('click', () => {
            const meta = gsScoreMeta ? gsScoreMeta.textContent : '';
            const text = gsScoreText ? gsScoreText.textContent : '';
            const fullText = meta ? (meta + "\n\n" + text) : text;
            if (!fullText.trim()) return;
            downloadBlob(new Blob([fullText], { type: 'text/plain;charset=utf-8' }), 'text-section-scoreboard.txt');
        });
    }

    if (downloadScorePngBtn && typeof html2canvas === 'function') {
        downloadScorePngBtn.addEventListener('click', () => {
            const meta = gsScoreMeta ? gsScoreMeta.textContent : '';
            const text = gsScoreText ? gsScoreText.textContent : '';
            const fullText = meta ? (meta + "\n\n" + text) : text;
            if (!fullText.trim()) return;
            downloadScoreAsPNG(fullText, 'text-section-scoreboard.png');
        });
    }

    // ==========================================
    // 8. AUDIO RECORDING MODULE
    // ==========================================
    if (captureAudioBtn) {
        captureAudioBtn.addEventListener('click', async () => {
            if (!mediaRecorder || mediaRecorder.state === 'inactive') {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];

                    mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
                    mediaRecorder.onstop = () => {
                        audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                        if (downloadBlobBtn) downloadBlobBtn.disabled = false;
                        if (copyBlobBtn) copyBlobBtn.disabled = false;
                    };

                    mediaRecorder.start();
                    captureAudioBtn.textContent = '🛑';
                    captureAudioBtn.classList.add('recording');
                } catch (err) {
                    alert('Microphone access denied or unavailable.');
                }
            } else if (mediaRecorder && mediaRecorder.state === 'recording') {
                mediaRecorder.stop();
                captureAudioBtn.textContent = '🔴';
                captureAudioBtn.classList.remove('recording');
            }
        });
    }

    if (downloadBlobBtn) {
        downloadBlobBtn.addEventListener('click', () => {
            if (!audioBlob) return;
            const url = URL.createObjectURL(audioBlob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'recorded-audio.webm';
            a.click();
            URL.revokeObjectURL(url);
        });
    }

    if (copyBlobBtn) {
        copyBlobBtn.addEventListener('click', async () => {
            if (!audioBlob) return;
            try {
                await navigator.clipboard.write([
                    new ClipboardItem({ 'audio/webm': audioBlob })
                ]);
                alert('Audio recording copied to clipboard!');
            } catch (err) {
                alert('Failed to copy audio to clipboard.');
            }
        });
    }

});
</script>










<script>
(function() {
    'use strict';

    /* =========================================================
       1. MAIN TEXT & WORD HELPERS
       ========================================================= */

    if (typeof window.getWordSet === 'undefined') {
        window.getWordSet = function(str) {
            if (!str) return new Set();
            const words = str.toLowerCase().match(/[\wÀ-ÿ'-]+/g) || [];
            return new Set(words);
        };
    }

    if (typeof window.cleanSectionText === 'undefined') {
        window.cleanSectionText = function(str) {
            if (!str) return "";

            let working = str;

            const first = working.indexOf('~');
            const last = working.lastIndexOf('~');

            if (first !== -1 && last !== -1 && last > first) {
                working = working.slice(first + 1, last);
            }

            const lines = working.split(/\r?\n/);
            const validLines = [];

            for (let line of lines) {
                const trimmed = line.trim();

                if (trimmed === 'QUIZ' || trimmed === 'Quiz') {
                    break;
                }

                validLines.push(line);
            }

            return validLines.join('\n');
        };
    }

    if (typeof window.calculateFastChangePercentage === 'undefined') {
        window.calculateFastChangePercentage = function(original, current) {

            const cleanOrig = window.cleanSectionText(original);
            const cleanCurr = window.cleanSectionText(current);

            const origWords =
                cleanOrig.toLowerCase().match(/[\wÀ-ÿ'-]+/g) || [];

            const currWords =
                cleanCurr.toLowerCase().match(/[\wÀ-ÿ'-]+/g) || [];

            if (origWords.length === 0) {
                return currWords.length > 0 ? 100 : 0;
            }

            const origMap = {};

            origWords.forEach(w => {
                origMap[w] = (origMap[w] || 0) + 1;
            });

            let matches = 0;

            currWords.forEach(w => {
                if (origMap[w] && origMap[w] > 0) {
                    matches++;
                    origMap[w]--;
                }
            });

            const maxLen =
                Math.max(origWords.length, currWords.length);

            const similarity =
                matches / maxLen;

            return Math.max(
                0,
                Math.min(
                    100,
                    Math.round((1 - similarity) * 100)
                )
            );
        };
    }


    /* =========================================================
       2. OVERLAY UPDATER
       ========================================================= */

    window.updateOverlay = function() {

        const teleEdit =
            document.getElementById('teleEdit');

        const teleOverlay =
            document.getElementById('teleOverlay');

        if (!teleEdit) return;

        const editableZone =
            document.getElementById('editableTextZone');

        let rawText = "";

        if (editableZone) {

            const lineDivs =
                editableZone.querySelectorAll('.line, p');

            if (lineDivs.length > 0) {

                const lineTexts =
                    Array.from(lineDivs).map(div => {

                        return div.innerHTML === '&nbsp;'
                            ? ''
                            : div.textContent;
                    });

                rawText =
                    lineTexts.join('\n');

            } else {

                rawText =
                    editableZone.innerText || '';
            }

        } else {

            rawText =
                teleEdit.innerText || '';
        }

        const cleanActiveText =
            typeof window.cleanSectionText === 'function'
                ? window.cleanSectionText(rawText)
                : rawText;

        const s =
            (cleanActiveText.match(/[.!?]+/g) || []).length;

        const charCount =
            cleanActiveText.length;

        let originalBaselineText = "";
        let currentChangeRate = 0;

        if (
            window.SCRAMBLE_SECTIONS &&
            typeof selectedSectionIndex !== 'undefined' &&
            window.SCRAMBLE_SECTIONS[selectedSectionIndex]
        ) {

            originalBaselineText =
                window.SCRAMBLE_SECTIONS[
                    selectedSectionIndex
                ].text || "";

        } else if (window._currentOriginalBaseline) {

            originalBaselineText =
                window._currentOriginalBaseline;
        }

        if (
            originalBaselineText &&
            typeof window.calculateFastChangePercentage === 'function'
        ) {

            currentChangeRate =
                window.calculateFastChangePercentage(
                    originalBaselineText,
                    cleanActiveText
                );
        }

        if (teleOverlay) {

            teleOverlay.textContent =
                `${charCount} chars · ${s} sent · Changed: ${currentChangeRate}%`;
        }
    };


/* =========================================================
   3. QUIZ BUILDER
   
   IMPORTANT:
   The section is NOT selected here.

   The existing main section selector selects the section.
   That section's text is passed into this function.
   This function only extracts the QUIZ portion of that
   already-selected section and places it into
   #quizContentContainer.
   ========================================================= */

window.loadQuizSection = function(sectionText) {

    if (!sectionText) return;

    const quizMain =
        document.getElementById('quizMain');

    const quizContentContainer =
        document.getElementById('quizContentContainer');

    if (
        !quizMain ||
        !quizContentContainer
    ) {
        return;
    }

    let fullText =
        sectionText;

    const first =
        sectionText.indexOf('~');

    const last =
        sectionText.lastIndexOf('~');

    if (
        first !== -1 &&
        last !== -1 &&
        last > first
    ) {

        fullText =
            sectionText.slice(
                first + 1,
                last
            );
    }

    /*
     * Save the selected section's original text
     * for the text-change calculation.
     */
    window._currentOriginalBaseline =
        window.cleanSectionText(fullText);


    /* -----------------------------------------------------
       FIND THE QUIZ PORTION OF THIS SELECTED SECTION
       ----------------------------------------------------- */

    const lines =
        fullText.split(/\r?\n/);

    let quizPart = "";
    let quizStartIndex = -1;

    for (
        let i = 0;
        i < lines.length;
        i++
    ) {

        const trimmed =
            lines[i].trim();

        if (
            trimmed === 'QUIZ' ||
            trimmed === 'Quiz'
        ) {

            quizStartIndex =
                i;

            break;
        }
    }

    if (quizStartIndex !== -1) {

        quizPart =
            lines
                .slice(quizStartIndex)
                .join('\n');
    }


    /* -----------------------------------------------------
       NO QUIZ IN THIS SELECTED SECTION
       ----------------------------------------------------- */

    if (!quizPart) {

        quizContentContainer.innerHTML =
            '<p style="padding: 10px; color: #888;">No quiz available for this section.</p>';

        return;
    }


    /* -----------------------------------------------------
       CLEAR ONLY THE QUIZ CONTENT

       Do NOT clear #quizMain.
       Do NOT destroy the quiz wrapper or scroll wrapper.
       ----------------------------------------------------- */

    quizContentContainer.innerHTML = '';


    /* -----------------------------------------------------
       PARSE QUIZ SUBSECTIONS
       ----------------------------------------------------- */

    const rawQuizLines =
        quizPart.split(/\r?\n/);

    let subSectionsData = [];
    let currentSub = null;

    const SUBSECTION_MARKERS = [
        "Quiz",
        "Concept Quiz",
        "Context Quiz",
        "Comprehension Quiz",
        "Grammar Quiz",
        "Vocabulary Quiz"
    ];

    rawQuizLines.forEach(line => {

        const trimmed =
            line.trim();

        if (
            SUBSECTION_MARKERS.some(
                marker =>
                    trimmed
                        .toLowerCase()
                        .startsWith(
                            marker.toLowerCase()
                        )
            )
        ) {

            currentSub = {
                title: trimmed,
                questions: []
            };

            subSectionsData.push(
                currentSub
            );

        } else if (currentSub) {

            currentSub.questions.push(
                line
            );
        }
    });


    /* -----------------------------------------------------
       FALLBACK IF NO SUBSECTION HEADER WAS FOUND
       ----------------------------------------------------- */

    if (
        subSectionsData.length === 0 &&
        rawQuizLines.length > 0
    ) {

        currentSub = {
            title: 'Comprehension Quiz',
            questions: rawQuizLines
        };

        subSectionsData.push(
            currentSub
        );
    }


    /* -----------------------------------------------------
       BUILD QUIZ HTML
       ----------------------------------------------------- */

    let allSubSectionsHTML = '';
    let qIndex = 0;

    subSectionsData.forEach(sub => {

        const slug =
            sub.title
                .toLowerCase()
                .replace(/\s+/g, '-')
                .replace(/[^\w-]/g, '');

        sub.slug =
            slug;

        let subHTML =
            `<h3 class="parsedSubheader">${sub.title}</h3>`;

        subHTML +=
            `<div class="quiz-subsection" data-subsection="${sub.title}" data-sub-slug="${slug}">`;


        /* -------------------------------------------------
           QUIZ CONTROLS / SCOREBOARD
           ------------------------------------------------- */

        subHTML += `
            <div class="quiz-mania-controls">
                <input
                    type="text"
                    class="quiz-mania-id"
                    placeholder="Student ID"
                    autocomplete="off"
                >

                <button
                    type="button"
                    class="quiz-submit"
                >
                    Submit
                </button>
            </div>

            <div
                class="quiz-mania-scoreboard"
                style="display:none;"
            >
                <pre class="quiz-mania-score-text"></pre>

                <div class="quiz-mania-buttons">
                    <button
                        type="button"
                        class="quiz-mania-copy"
                    >
                        Copy
                    </button>

                    <button
                        type="button"
                        class="quiz-mania-txt"
                    >
                        TXT
                    </button>

                    <button
                        type="button"
                        class="quiz-mania-png"
                    >
                        PNG
                    </button>
                </div>
            </div>
        `;


        /* -------------------------------------------------
           QUESTIONS
           ------------------------------------------------- */

        for (
            let i = 0;
            i < sub.questions.length;
            i++
        ) {

            let line =
                sub.questions[i];


            /* Blank line */

            if (
                line.trim() === ''
            ) {

                subHTML +=
                    `<div class="line quiz-blank-line">&nbsp;</div>`;

                continue;
            }


            /* Only lines beginning with ? are questions */

            if (
                !line.trim().startsWith('?')
            ) {
                continue;
            }


            /* Question text */

            let question =
                line
                    .trim()
                    .replace(
                        /^\?\s*/,
                        ''
                    );


            /* Optional continuation line beginning with - */

            if (
                i + 1 < sub.questions.length &&
                sub.questions[
                    i + 1
                ]
                    .trim()
                    .startsWith('-')
            ) {

                question +=
                    ' ' +
                    sub.questions[
                        i + 1
                    ]
                        .trim()
                        .replace(
                            /^-+\s*/,
                            ''
                        );

                i++;
            }


            /* Answer options */

            const options = [];

            let j =
                i + 1;

            while (
                j < sub.questions.length &&
                sub.questions[j].trim() !== '' &&
                !sub.questions[j].trim().startsWith('?')
            ) {

                options.push(
                    sub.questions[j]
                );

                j++;
            }


            /* Correct answer */

            const correctPipe =
                options
                    .filter(
                        o =>
                            /\|.*?\|/.test(o)
                    )
                    .map(
                        o =>
                            o
                                .replace(/\|/g, '')
                                .trim()
                    )
                    .join('|');


            /* Question container */

            subHTML +=
                `<div class="exercise quiz-exercise" data-correct="${correctPipe}">`;


            subHTML +=
                `<p class="quiz-question-title"><strong>${qIndex + 1}. ${question}</strong></p>`;


            subHTML +=
                `<div class="quiz-options-group">`;


            /* Options */

            options.forEach(
                (opt, oi) => {

                    const clean =
                        opt
                            .replace(/\|/g, '')
                            .trim();

                    const isCorrectOption =
                        /\|.*?\|/.test(opt);

                    subHTML += `
                        <label
                            class="quiz-option-label"
                            data-is-correct="${isCorrectOption}"
                        >
                            <input
                                type="radio"
                                name="q_${slug}_${qIndex}"
                                value="${clean.replace(/"/g, '&quot;')}"
                                data-correct="${correctPipe}"
                            >

                            <span class="option-text">
                                ${String.fromCharCode(65 + oi)}) ${clean}
                            </span>
                        </label>
                    `;
                }
            );


            subHTML +=
                `</div>`;


            subHTML +=
                `<div class="quiz-feedback-box" style="display:none; font-size:0.9em; margin-top:5px;"></div>`;


            subHTML +=
                `</div>`;


            qIndex++;

            i =
                j - 1;
        }


        subHTML +=
            `</div>`;

        allSubSectionsHTML +=
            subHTML;
    });


    /* -----------------------------------------------------
       PUT QUIZ INTO THE EXISTING QUIZ CONTENT CONTAINER
       ----------------------------------------------------- */

    quizContentContainer.innerHTML =
        allSubSectionsHTML;
};
    /* =========================================================
       4. INITIALIZATION & UI LISTENERS
       ========================================================= */

    function initApp() {

        /* -----------------------------------------------------
           QUIZ TOGGLE BAR

           This ONLY shows/hides the quiz belonging to the
           section that was already selected elsewhere.
           
           It does NOT select sections.
           ----------------------------------------------------- */

        document.addEventListener(
            'click',
            (e) => {

                const quizToggleBar =
                    e.target.closest(
                        '#quizToggleBar'
                    );

                if (!quizToggleBar) {
                    return;
                }

                const quizMain =
                    document.getElementById(
                        'quizMain'
                    );

                if (!quizMain) {
                    return;
                }

                const computedStyle =
                    window.getComputedStyle(
                        quizMain
                    );

                const isVisible =
                    computedStyle.display !== 'none';


                if (isVisible) {

                    quizMain.style.setProperty(
                        'display',
                        'none',
                        'important'
                    );

                    quizToggleBar.classList.remove(
                        'active'
                    );

                    quizToggleBar.textContent =
                        '▼ Show Quiz';

                } else {

                    /*
                     * #quizMain is a flex container in the
                     * existing CSS, so restore it as flex.
                     */
                    quizMain.style.setProperty(
                        'display',
                        'flex',
                        'important'
                    );

                    quizToggleBar.classList.add(
                        'active'
                    );

                    quizToggleBar.textContent =
                        '▲ Hide Quiz';
                }
            }
        );


        /* -----------------------------------------------------
           TELEEDIT & METRICS LISTENERS
           ----------------------------------------------------- */

        const teleEditEl =
            document.getElementById(
                'teleEdit'
            );

        if (teleEditEl) {

            teleEditEl.addEventListener(
                'input',
                () => {
                    window.updateOverlay();
                }
            );


            teleEditEl.addEventListener(
                'keydown',
                (e) => {

                    if (e.key !== 'Enter') {
                        return;
                    }

                    const sel =
                        window.getSelection();

                    if (
                        !sel ||
                        sel.rangeCount === 0
                    ) {
                        return;
                    }

                    let node =
                        sel.anchorNode;

                    let inEditable =
                        false;

                    while (
                        node &&
                        node !== teleEditEl
                    ) {

                        if (
                            node &&
                            (
                                node.id ===
                                'editableTextZone' ||

                                node.classList?.contains(
                                    'editable'
                                )
                            )
                        ) {

                            inEditable =
                                true;

                            break;
                        }

                        node =
                            node
                                ? node.parentNode
                                : null;
                    }


                    if (
                        inEditable ||
                        teleEditEl.id === 'teleEdit'
                    ) {

                        e.preventDefault();

                        const range =
                            sel.getRangeAt(0);

                        range.deleteContents();


                        const newP =
                            document.createElement(
                                'p'
                            );

                        newP.className =
                            'line';

                        newP.innerHTML =
                            '&nbsp;';


                        range.insertNode(
                            newP
                        );

                        range.setStartAfter(
                            newP
                        );

                        range.collapse(
                            true
                        );

                        sel.removeAllRanges();

                        sel.addRange(
                            range
                        );

                        window.updateOverlay();
                    }
                }
            );
        }


        /* -----------------------------------------------------
           IMPORTANT:
           Section selection is handled elsewhere.

           There is NO hard-coded section list here.
           There is NO sampleSections array here.
           There is NO second section selector here.
           ----------------------------------------------------- */


        /* -----------------------------------------------------
           SPEED BUTTONS
           ----------------------------------------------------- */

        const speedButtons =
            document.querySelectorAll(
                '.speed-buttons button'
            );

        if (speedButtons) {

            speedButtons.forEach(
                btn => {

                    btn.addEventListener(
                        'click',
                        () => {

                            speedButtons.forEach(
                                b =>
                                    b.classList.remove(
                                        'active'
                                    )
                            );

                            btn.classList.add(
                                'active'
                            );
                        }
                    );
                }
            );
        }


        /* -----------------------------------------------------
           COPY BUTTON TOAST
           ----------------------------------------------------- */

        function showToast(
            message = 'Copied'
        ) {

            const toast =
                document.getElementById(
                    'toast'
                );

            if (!toast) {
                return;
            }

            toast.textContent =
                message;

            toast.classList.add(
                'show'
            );

            setTimeout(
                () => {
                    toast.classList.remove(
                        'show'
                    );
                },
                2000
            );
        }


        const copyBtn =
            document.getElementById(
                'copyBtn'
            );

        const teleEdit =
            document.getElementById(
                'teleEdit'
            );

        if (
            copyBtn &&
            teleEdit
        ) {

            copyBtn.addEventListener(
                'click',
                () => {

                    navigator.clipboard
                        .writeText(
                            teleEdit.innerText
                        )
                        .then(
                            () => {
                                showToast(
                                    'Text Copied!'
                                );
                            }
                        );
                }
            );
        }


        /* -----------------------------------------------------
           INITIAL OVERLAY
           ----------------------------------------------------- */

        window.updateOverlay();
    }


    /* =========================================================
       START APP
       ========================================================= */

    if (
        document.readyState ===
        'loading'
    ) {

        document.addEventListener(
            'DOMContentLoaded',
            initApp
        );

    } else {

        initApp();
    }


    /* =========================================================
       GLOBAL CUSTOM EVENT HOOK

       The EXISTING section loader sends the selected section's
       text here.

       This quiz module then extracts the QUIZ from that same
       section.

       It does NOT select a section.
       ========================================================= */

window.addEventListener(
    'textSectionLoaded',
    function(e) {

        if (
            e &&
            e.detail &&
            e.detail.sectionText
        ) {

            // Keep the exact raw section text
            // available to the quiz scoreboard.
            window.currentRawSectionText =
                e.detail.sectionText;

            window.loadQuizSection(
                e.detail.sectionText
            );
        }
    }
);

})();



</script>

            const quizName =

<script>
(function() {
    'use strict';


    const wrapper =
        document.getElementById('teleScrollWrapper');

    const stage =
        document.getElementById('teleScroll');

    const startBtn =
        document.getElementById('startBtn');

    const repeatBtn =
        document.getElementById('repeatBtn');

    const speedButtons =
        document.querySelectorAll('.speed-buttons button');


    if (!wrapper || !stage) return;


    /* =========================================================
       SCROLLER STATE
       ========================================================= */

    let playing = false;
    let frame = null;

    /*
     * Position of the stage in pixels.
     *
     * This is the ONLY position used by the scroller.
     */
    let position = 0;

    /*
     * Pixels per second.
     */
    let pixelsPerSecond = 8;

    let lastTime = 0;


    /* =========================================================
       GET MAXIMUM POSITION
       ========================================================= */

    function maximumPosition() {

        return Math.max(
            0,
            stage.scrollHeight -
            wrapper.clientHeight
        );
    }


    /* =========================================================
       DRAW
       ========================================================= */

    function draw() {

        stage.style.transform =
            'translate3d(0, -' +
            position +
            'px, 0)';
    }


    /* =========================================================
       ANIMATION
       ========================================================= */

    function animate(timestamp) {

        if (!playing) {
            frame = null;
            return;
        }


        if (!lastTime) {
            lastTime = timestamp;
        }


        const elapsed =
            Math.min(
                timestamp - lastTime,
                50
            ) / 1000;


        lastTime = timestamp;


        /*
         * Continuous movement.
         */
        position +=
            pixelsPerSecond * elapsed;


        const max =
            maximumPosition();


        if (position >= max) {

            position = max;

            draw();

            pause();

            return;
        }


        draw();


        frame =
            requestAnimationFrame(
                animate
            );
    }


    /* =========================================================
       START / PAUSE TOGGLE
       ========================================================= */

    function toggleStart() {

        /*
         * -----------------------------------------------
         * PAUSE
         * -----------------------------------------------
         */

        if (playing) {

            playing = false;


            if (frame !== null) {

                cancelAnimationFrame(frame);

                frame = null;
            }


            lastTime = 0;


            /*
             * IMPORTANT:
             *
             * Leave the transform exactly where it is.
             *
             * Do NOT touch scrollTop.
             * Do NOT remove the transform.
             */
            stage.style.willChange =
                'auto';


            startBtn.textContent =
                'Start';


            return;
        }


        /*
         * -----------------------------------------------
         * START / RESUME
         * -----------------------------------------------
         */

        /*
         * The transform position is authoritative.
         *
         * Do NOT read scrollTop here.
         */
        wrapper.scrollTop = 0;


        stage.style.transition =
            'none';

        stage.style.willChange =
            'transform';


        playing = true;
        lastTime = 0;


        startBtn.textContent =
            'Pause';


        frame =
            requestAnimationFrame(
                animate
            );
    }


    /* =========================================================
       REPEAT
       ========================================================= */

    function repeat() {

        playing = false;


        if (frame !== null) {

            cancelAnimationFrame(frame);

            frame = null;
        }


        lastTime = 0;

        position = 0;


        wrapper.scrollTop = 0;


        stage.style.transform =
            'translate3d(0, 0, 0)';

        stage.style.willChange =
            'auto';


        startBtn.textContent =
            'Start';
    }


    /* =========================================================
       SPEED
       ========================================================= */

    speedButtons.forEach(
        function(button) {

            button.addEventListener(
                'click',
                function() {

                    const text =
                        button.textContent
                            .trim()
                            .toLowerCase();


                    if (
                        text.includes('slow')
                    ) {

                        pixelsPerSecond = 5;

                    } else if (
                        text.includes('medium') ||
                        text.includes('normal')
                    ) {

                        pixelsPerSecond = 8;

                    } else if (
                        text.includes('fast')
                    ) {

                        pixelsPerSecond = 14;
                    }


                    speedButtons.forEach(
                        function(other) {

                            other.classList.remove(
                                'active'
                            );
                        }
                    );


                    button.classList.add(
                        'active'
                    );
                }
            );
        }
    );


    /* =========================================================
       BUTTONS
       ========================================================= */

    startBtn?.addEventListener(
        'click',
        function(event) {

            event.preventDefault();
            event.stopPropagation();

            toggleStart();
        }
    );


    repeatBtn?.addEventListener(
        'click',
        function(event) {

            event.preventDefault();
            event.stopPropagation();

            repeat();
        }
    );


    /* =========================================================
       INITIAL STATE
       ========================================================= */

    stage.style.transform =
        'translate3d(0, 0, 0)';

    stage.style.willChange =
        'auto';

})();
</script>

<script>
(function() {
    const synth = window.speechSynthesis;

    function getMaleVoice() {
        const voices = synth.getVoices();
        if (!voices.length) return null;
        return voices.find(v => v.name.includes("David")) ||
               voices.find(v => v.name === "Microsoft David" && v.lang === "en-US") ||
               voices.find(v => v.name.includes("George") || v.name.includes("Ryan") || v.name.includes("Alex")) ||
               voices.find(v => v.lang.startsWith("en") && v.name.toLowerCase().includes("male")) ||
               voices.find(v => v.lang.startsWith("en")) ||
               voices[0];
    }

    const topAudioBtn = document.getElementById('upperAudioBtn') || 
                        document.getElementById('topAudioBtn') || 
                        document.getElementById('audioBtn');
                        
    const editArea = document.getElementById('teleEdit');

    if (!topAudioBtn) {
        console.warn("Top audio button element not found in the DOM.");
    }

    topAudioBtn?.addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation();
        if (!synth) return;

        // 1. ROBUST UNIVERSAL KILL SWITCH
        // Browsers sometimes get stuck in a "speaking" or "pending" state.
        // We force-cancel multiple times to guarantee speech stops.
        if (synth.speaking || synth.pending || synth.paused) {
            synth.cancel();
            setTimeout(() => synth.cancel(), 50); // Double-tap cancel to force browser reset
            document.querySelectorAll(".reading-active").forEach(el => el.classList.remove("reading-active"));
            return; 
        }

        if (!editArea) return;

        const textToRead = editArea.textContent || editArea.innerText;
        if (!textToRead.trim()) return;

        // Clean up any lingering speech state before starting fresh
        synth.cancel();

        const utter = new SpeechSynthesisUtterance(textToRead);
        
        const voice = getMaleVoice();
        if (voice) {
            utter.voice = voice;
        }
        
        utter.rate = 0.95;
        utter.pitch = 1.0;
        utter.volume = 1.0;

        utter.onstart = () => {
            editArea.classList.add("reading-active");
        };

        utter.onend = () => {
            editArea.classList.remove("reading-active");
        };

        utter.onerror = (err) => {
            console.error("Speech synthesis error:", err);
            editArea.classList.remove("reading-active");
        };

        // Fire speech immediately
        synth.speak(utter);
    });
})();

(function () {
    function cleanSpeechText(text) {
        text = text.replace(/\b\d+:\d+\s*/g, '');
        text = text.replace(/<br\s*\/?>/gi, ' ');
        text = text.replace(/\n+/g, ' ');
        text = text.replace(/\s+\./g, '.');
        text = text.replace(/\.(\S)/g, '. $1');
        text = text.replace(/\s+/g, ' ').trim();
        return text;
    }

    const OriginalUtterance = window.SpeechSynthesisUtterance;
    function PatchedUtterance(text) {
        return new OriginalUtterance(cleanSpeechText(text));
    }
    PatchedUtterance.prototype = OriginalUtterance.prototype;
    window.SpeechSynthesisUtterance = PatchedUtterance;
})();
</script>

<script>
(function() {
    // Wait a brief moment to ensure the original script has initialized
    setTimeout(() => {
        const highlightBtn = document.getElementById("highlightBtn") || document.getElementById("highlightSelected");
        const editor = document.getElementById("teleEdit");
        if (!highlightBtn || !editor) return;

        // Clone the button to strip away the old broken click listener safely
        const newBtn = highlightBtn.cloneNode(true);
        highlightBtn.parentNode.replaceChild(newBtn, highlightBtn);

        newBtn.addEventListener("mousedown", (e) => e.preventDefault());

        newBtn.addEventListener("click", () => {
            const sel = window.getSelection();
            if (!sel.rangeCount || sel.isCollapsed) return;

            const range = sel.getRangeAt(0);
            if (!editor.contains(range.commonAncestorContainer)) return;

            let container = range.commonAncestorContainer;
            if (container.nodeType === 3) container = container.parentNode;
            
            const enclosingHighlight = container.closest(".highlight");

            // 1. UN-HIGHLIGHT LOGIC (Toggle off if inside an existing highlight)
            if (enclosingHighlight) {
                const parent = enclosingHighlight.parentNode;
                while (enclosingHighlight.firstChild) {
                    parent.insertBefore(enclosingHighlight.firstChild, enclosingHighlight);
                }
                enclosingHighlight.remove();
                editor.normalize();
                sel.removeAllRanges();
                return;
            }

            // 2. CHECK INTERSECTING HIGHLIGHTS
            const allHighlights = Array.from(editor.querySelectorAll(".highlight"));
            const intersecting = allHighlights.filter(h => {
                try {
                    return range.intersectsNode(h) || h.contains(range.startContainer) || h.contains(range.endContainer);
                } catch (e) {
                    return false;
                }
            });

            if (intersecting.length > 0) {
                intersecting.forEach(h => {
                    const parent = h.parentNode;
                    if (parent) {
                        while (h.firstChild) {
                            parent.insertBefore(h.firstChild, h);
                        }
                        h.remove();
                    }
                });
                editor.normalize();
                sel.removeAllRanges();
                return;
            }

            // 3. SAFE MULTI-NODE HIGHLIGHT LOGIC (Prevents text deletion across paragraphs)
            try {
                // Try standard surround first if it's within a single text node
                const span = document.createElement("span");
                span.className = "highlight";
                range.surroundContents(span);
            } catch (err) {
                // Multi-node/multi-paragraph safe wrapping algorithm
                const startContainer = range.startContainer;
                const endContainer = range.endContainer;
                const startOffset = range.startOffset;
                const endOffset = range.endOffset;

                // Collect all text nodes contained within the range
                const walker = document.createTreeWalker(
                    range.commonAncestorContainer,
                    NodeFilter.SHOW_TEXT,
                    {
                        acceptNode: function(node) {
                            try {
                                return range.intersectsNode(node) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT;
                            } catch(e) {
                                return NodeFilter.FILTER_REJECT;
                            }
                        }
                    }
                );

                const textNodesToWrap = [];
                let currentNode;
                while (currentNode = walker.nextNode()) {
                    textNodesToWrap.push(currentNode);
                }

                if (textNodesToWrap.length === 0) {
                    // Fallback extract if tree walker misses
                    const span = document.createElement("span");
                    span.className = "highlight";
                    span.appendChild(range.extractContents());
                    range.insertNode(span);
                } else {
                    // Process nodes safely from last to first to avoid index shifting mutations
                    textNodesToWrap.reverse().forEach(node => {
                        let targetNode = node;
                        let startIdx = 0;
                        let endIdx = node.nodeValue.length;

                        if (node === startContainer) {
                            startIdx = startOffset;
                        }
                        if (node === endContainer) {
                            endIdx = endOffset;
                        }

                        if (startIdx < endIdx) {
                            if (startIdx > 0 || endIdx < node.nodeValue.length) {
                                targetNode = node.splitText(startIdx);
                                targetNode.splitText(endIdx - startIdx);
                            }

                            const span = document.createElement("span");
                            span.className = "highlight";
                            targetNode.parentNode.insertBefore(span, targetNode);
                            span.appendChild(targetNode);
                        }
                    });
                }
            }

            editor.normalize();
            sel.removeAllRanges();
        });
    }, 100);
})();
</script>
