<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Game Playground</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    min-height: 100%;
    font-family: Arial, sans-serif;
    background: #f5f0ff;
    color: #333;
}

body {
    padding: 16px;
}

h1 {
    margin: 0 0 16px 0;
    text-align: center;
    font-size: 24px;
    color: #6b3fa0;
}

#editor {
    width: 100%;
    height: 55vh;
    min-height: 300px;
    padding: 12px;
    border: 2px solid #a56bff;
    border-radius: 10px;
    background: white;
    color: #222;
    font-family: monospace;
    font-size: 14px;
    line-height: 1.4;
    resize: none;
    display: block;
}

button {
    width: 100%;
    height: 60px;
    margin-top: 12px;
    border: 0;
    border-radius: 10px;
    font-size: 20px;
    font-weight: bold;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
}

#playButton {
    background: #6b3fa0;
    color: white;
}

#clearButton {
    background: #d8c2ff;
    color: #4b2875;
}

#gameScreen {
    display: none;
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100dvh;
    background: white;
    z-index: 9999;
}

#gameFrame {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
    background: white;
}

#exitButton {
    position: absolute;
    top: 10px;
    right: 10px;
    z-index: 10000;
    width: 44px;
    height: 44px;
    margin: 0;
    padding: 0;
    border-radius: 50%;
    background: rgba(0, 0, 0, 0.65);
    color: white;
    font-size: 22px;
    line-height: 44px;
}

@media (max-width: 600px) {
    body {
        padding: 12px;
    }

    h1 {
        font-size: 22px;
        margin-bottom: 12px;
    }

    #editor {
        height: 62vh;
        min-height: 280px;
        font-size: 13px;
    }
}
</style>
</head>

<body>

<h1>🎮 GAME PLAYGROUND</h1>

<textarea
    id="editor"
    spellcheck="false"
    placeholder="Paste your HTML game here..."></textarea>

<button id="playButton">▶ PLAY GAME</button>

<button id="clearButton">CLEAR</button>


<div id="gameScreen">

    <iframe
        id="gameFrame"
        sandbox="allow-scripts allow-forms allow-modals"
        title="Game">
    </iframe>

    <button id="exitButton" aria-label="Exit game">✕</button>

</div>


<script>

const editor = document.getElementById("editor");
const playButton = document.getElementById("playButton");
const clearButton = document.getElementById("clearButton");
const gameScreen = document.getElementById("gameScreen");
const gameFrame = document.getElementById("gameFrame");
const exitButton = document.getElementById("exitButton");


function cleanCode(code) {

    code = code.trim();

    // Remove Markdown code fences if ChatGPT/Gemini included them.
    code = code.replace(/^```html\s*/i, "");
    code = code.replace(/^```\s*/i, "");
    code = code.replace(/\s*```$/i, "");

    return code.trim();
}


playButton.addEventListener("click", function () {

    const code = cleanCode(editor.value);

    if (!code) {
        alert("Paste your game HTML first.");
        return;
    }

    gameFrame.srcdoc = code;

    gameScreen.style.display = "block";

});


exitButton.addEventListener("click", function () {

    gameFrame.srcdoc = "";

    gameScreen.style.display = "none";

});


clearButton.addEventListener("click", function () {

    editor.value = "";

});


</script>

</body>
</html>
