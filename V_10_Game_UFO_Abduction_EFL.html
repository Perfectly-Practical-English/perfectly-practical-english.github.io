<script>
(function () {
const canvas = document.getElementById("starCanvas");
const ctx = canvas.getContext("2d");

let stars = [];
let t = 0;
const STAR_COUNT = 2000;

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = canvas.offsetHeight;
  createStars();
}

function createStars() {
  stars = [];
  const w = canvas.width;
  const h = canvas.height;
  for (let i = 0; i < STAR_COUNT; i++) {
    stars.push({
      x: (Math.random() * 2 - 0.5) * w,
      y: (Math.random() * 2 - 0.5) * h,
      r: Math.random() * 1.6 + 0.3,
      a: Math.random() * 0.5 + 0.5,
      s: Math.random() * 0.01 + 0.005
    });
  }
}

window.addEventListener("resize", resize);
resize();

function draw() {
  const w = canvas.width;
  const h = canvas.height;
  ctx.clearRect(0, 0, w, h);

  const cx = w / 2;
  const cy = h * 0.42;
  const angle = t * 0.0009;
  const cos = Math.cos(angle);
  const sin = Math.sin(angle);

  ctx.fillStyle = "white";

  for (let i = 0; i < stars.length; i++) {
    const s = stars[i];
    let dx = s.x - cx;
    let dy = s.y - cy;
    const rx = dx * cos - dy * sin;
    const ry = dx * sin + dy * cos;
    const x = cx + rx;
    const y = cy + ry;

    if (x >= -10 && x <= w + 10 && y >= -10 && y <= h + 10) {
      ctx.globalAlpha = s.a;
      ctx.beginPath();
      ctx.arc(x, y, s.r, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  ctx.globalAlpha = 1;
  t += 1;
  requestAnimationFrame(draw);
}

draw();
})();
</script>

  function parseSections(raw) {
    const chunks = raw.split(/\n(?=~+)/);
    return chunks
      .map(chunk => chunk.trim())
      .filter(chunk => chunk.startsWith("~"))
      .map(chunk => {
        const lines = chunk.split("\n");
        const name = lines.shift().replace(/^~+/, "").trim();
        const text = lines.join("\n").trim();
        return { name, text };
      });
  }

  function extractWords(sectionText) {
    return sectionText
      .split("\n")
      .map(line => {
        const match = line.match(/•\s*([^\s–]+)/);
        return match ? match[1] : null;
      })
      .filter(Boolean);
  }

  const sections = parseSections(wordListText);

            idInput.value = "Guest";

          currentSectionName = sec.name;

          btn.textContent = sec.name;
          closeModal();

          if (window.gameStarted && !gameStopped) {
            activeSectionName = sec.name;
            nextWordIndex = 0;
            activeBubbles = [];
            currentTypedWord = null;
          } else {
            startGame();
          }

          typingInput.focus();
        });
        listContainer.appendChild(item);
      });
    }
    modalRoot.style.display = "block";
  }

  function closeModal() {

  let gameStopped = false;

  let nextWordIndex = 0;
  let correctWords = 0;
  let totalWords = 0;

  const popSound = document.getElementById('popSound');
  const typingInput = document.getElementById('typingInput');
  const submitBtn = document.getElementById('submitButton');

  // Helper to generate filename based strictly on scoreboard contents matching format requirements
  function getScoreboardFilename(extension) {
    const text = scoreboardContainer.textContent.trim();
    if (!text) return 'score.' + extension;
    return text.replace(/\|/g, '_').replace(/[:\/]/g, '-') + '.' + extension;
  }

  function getStudentName(id) {

  }

  function brightColor(alpha=0.35) {
    const hue = Math.random()*360;
    return `hsla(${hue},90%,65%,${alpha})`;
  }

  function darkVariant(color) {
    const match = color.match(/hsla\((\d+),\s*(\d+)\%,\s*(\d+)\%,\s*([\d.]+)\)/);
    if(!match) return 'rgba(0,0,0,0.5)';
    const h = match[1], s = match[2], l = Math.max(0, match[3]-35), a = match[4];
    return `hsla(${h},${s}%,${l}%,${a})`;
  }

  class Bubble {
    constructor(word=null) {
      this.word = word;
      this.typedIndex = 0;
      this.exploded = false;
      if(word){
        this.radius = 50 + Math.random()*40;
        this.color = brightColor(0.35);
      } else {
        this.radius = 10 + Math.random()*30;
        this.color = brightColor(0.2);
      }
      this.shadowColor = darkVariant(this.color);
      this.x = canvas.width / 2;
      this.y = canvas.height / 2;
      this.speed = (word ? 0.6 : 0.2) + Math.random()*0.6;
      this.swayAmplitude = (word ? 20 : 10) + Math.random()*20;
      this.swaySpeed = Math.random()*0.02 + 0.01;
      this.swayPhase = Math.random()*Math.PI*2;
    }

    draw() {
      const offsetX = this.word ? 0 : Math.sin(this.swayPhase + this.y*this.swaySpeed) * this.swayAmplitude;

      if(this.word){
        ctx.font = `bold 32px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif`;
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';

        let typed = this.typedIndex || 0;
        let totalWidth = ctx.measureText(this.word).width;
        let startX = this.x + offsetX - totalWidth / 2;

        for(let i = 0; i < this.word.length; i++){
          ctx.fillStyle = i < typed ? 'red' : 'white';
          let char = this.word[i];
          ctx.fillText(char, startX, this.y);
          startX += ctx.measureText(char).width;
        }
        ctx.shadowBlur = 0;
      }
    }

    update() {
      if (!this.word) {
        this.y -= this.speed;
      }
      if(this.y + this.radius < 0) this.exploded = true;
    }
  }

  function spawnNextWord() {
    if (nextWordIndex >= wordList.length) return;
    const bubble = new Bubble(wordList[nextWordIndex]);
    activeBubbles.push(bubble);
    nextWordIndex++;
  }

  function floatBubbles(time) {
    ctx.clearRect(0,0,canvas.width,canvas.height);

    ambientBubbles.forEach(b=>{b.update(); b.draw();});
    ambientBubbles = ambientBubbles.filter(b=>!b.exploded);

    activeBubbles.forEach(bubble=>{bubble.update(); bubble.draw();});
    activeBubbles = activeBubbles.filter(b=>!b.exploded);

    if(!gameStopped && activeBubbles.length === 0) spawnNextWord();

    requestAnimationFrame(floatBubbles);
  }

  function handleTypingInput(e) {
    if(!window.gameStarted || gameStopped) return;
    if(activeBubbles.length === 0) return;

    let wordToType = currentTypedWord;

    if(!wordToType){
      wordToType = activeBubbles.find(b => !b.exploded);
      if(!wordToType) return;
      currentTypedWord = wordToType;
    }

    if(e.inputType === "deleteContentBackward") {
      if(wordToType.typedIndex > 0) {
        wordToType.typedIndex--;
      }
      typingInput.value = "";
      return;
    }

    const key = e.data || e.key;
    if(!key) {
      typingInput.value = "";
      return;
    }

    const lowerKey = key.toLowerCase();
    if(!/^[a-z]$/.test(lowerKey)) {
      typingInput.value = "";
      return;
    }

    const expected = wordToType.word[wordToType.typedIndex]?.toLowerCase();

    if(lowerKey !== expected) {
      typingInput.value = "";
      return;
    }

    wordToType.typedIndex++;

    if(wordToType.typedIndex === wordToType.word.length) {
      explodeWord(wordToType, true);
      abductClosestRandomAnimal();
      currentTypedWord = null;
    }

    typingInput.value = "";
  }

  function explodeWord(bubble, success){
    if(bubble.exploded) return;
    bubble.exploded = true;
    if(success) correctWords++;
  }

  function startGame(){
    if(window.gameStarted) return;

    if (!idInput.value.trim()) {
      idInput.value = "Guest";
    }

    wordList = [...(sectionData.find(s => s.name === currentSectionName)?.words || wordList)];
    activeSectionName = currentSectionName;

    window.gameStarted = true;
    gameStopped = false;

    submitBtn.disabled = false;

    scoreboardContainer.textContent = '';
    scoreButtons.style.display = 'none';

    activeBubbles = [];
    ambientBubbles = [];
    explodingBubbles = [];

    currentTypedWord = null;
    nextWordIndex = 0;
    correctWords = 0;
    totalWords = wordList.length;

    spawnNextWord();
    floatBubbles();
    typingInput.focus();
  }

  function stopGame(){ 
    if(!window.gameStarted || gameStopped) return;
    gameStopped = true;
    window.gameStarted = false;
    submitBtn.disabled = false;
  }

  async function submitResults(){ 
    if(!window.gameStarted && !correctWords && !totalWords) return;
    stopGame();

    const pct = totalWords ? Math.round((correctWords / totalWords) * 100) : 0;
    const pctStr = pct + '%';
    const now = new Date();

    const pad = n => n.toString().padStart(2,'0');
    const dateStr = `${pad(now.getDate())}/${pad(now.getMonth()+1)}/${now.getFullYear()}`;
    const timeStr = `${pad(now.getHours())}:${pad(now.getMinutes())}`;

    let currentFile = window.location.pathname.split('/').pop() || 'unknown.html';
    currentFile = currentFile.split('?')[0].split('#')[0];
    const filenameWithoutExt = currentFile.replace(/\.[^/.]+$/, "");

    const studentId = idInput.value.trim() || 'Guest';
    const studentName = getStudentName(studentId);

    const scoreLine =
      filenameWithoutExt + "|" +
      activeSectionName + "|" +
      studentName + "|" +
      studentId + "|" +
      dateStr + "|" +
      timeStr + "|" +
      correctWords + "/" + totalWords + "|" +
      pctStr;

    scoreboardContainer.textContent = scoreLine;
    scoreButtons.style.display = 'flex';

    try {
      await saveResult(scoreLine);
      console.log("✅ Score uploaded to Supabase");
    } catch(err) {
      console.error("❌ Upload failed:", err);
    }
  }

  submitBtn.addEventListener('click', submitResults);
  typingInput.addEventListener('input', handleTypingInput);

  typingInput.addEventListener('keydown', function(e) {
    if(e.key === "Backspace") {
      e.preventDefault();
      handleTypingInput({ inputType: "deleteContentBackward" });
    }
  });

  canvas.addEventListener('click', ()=>{
    if(window.gameStarted && !gameStopped) typingInput.focus();
  });

    filename = filename.replace(/^[^_]*_/, "");
    const title = filename.replace(/_/g, " ");
    const h1 = document.querySelector("h1");
    if (h1) {
        h1.textContent = title;
    }
});
</script>

<script>
(function(){
const RAW_TEXT = `
How to play...
• Enter your ID number into the ID field — Auto: Your name will automatically populate if registered, and entering your ID unlocks score tracking.
• Click the Select a section. button to choose a vocabulary category from the pop-up menu.
• Click the Instructions button anytime to view the gameplay guide.

• Click Submit to view your final score and percentage — Auto: Your results are compiled into a scoreboard record and logged automatically to the database.
• Use the Copy, Text, or PNG buttons to download or copy your score record.
`;

function parseRawInstructions(text){
  const lines = text.split("\n").map(l => l.trim()).filter(Boolean);
  const html = [];
  lines.forEach(line => {
    if(line === "---"){
      html.push(`<hr>`);
      return;
    }
    if(/^\d+\./.test(line)){
      html.push(`<p>${line}</p>`);
      return;
    }
    if(!/[.!?:]$/.test(line)){
      html.push(`<h3>${line}</h3>`);
      return;
    }
    html.push(`<p>${line}</p>`);
  });
  return html.join("");
}

const instructionsRoot = document.getElementById("instructionsRoot");
const instructionsBackdrop = document.getElementById("instructionsBackdrop");

}

document.addEventListener("keydown", e=>{

    closeModal();
    closeInstructionsModal();
  }
});
})();
</script>

<script>
const ufoContainer = document.getElementById("ufoContainer");
const beam = document.getElementById("beam");
const animalLayer = document.getElementById("animalLayer");

let swayAmplitude = 50;
let swaySpeed = 0.01;
let swayTime = 0;

function animateUFO(){
  if(!ufoContainer) return;
  swayTime++;
  const offsetX = Math.sin(swayTime * swaySpeed) * swayAmplitude;
  ufoContainer.style.left = `calc(50% + ${offsetX}px)`;
  requestAnimationFrame(animateUFO);
}
animateUFO();

let cows = [];
let pendingAbduction = false;

function abductClosestRandomAnimal(){
  if(cows.length === 0) return;
  pendingAbduction = true;
}

const animalPattern = [
  "🐄","🐖","🐓","🐖",
  "🐓","🐄","🐄","🐖",
  "🐓","🐖","🐓","🐄",
  "🐄","🐖","🐓","🐖",
  "🐓","🐄"
];

const spacingPattern = [90,120,140,90];
const cowSpeed = 3;
let trainInProgress = false;

function spawnCowTrain(){
  if(!animalLayer) return;
  trainInProgress = true;
  let trainCows = [];
  let currentX = (window.innerWidth / 2) - 100;

  animalPattern.forEach((emoji,i)=>{
    const cow = document.createElement("div");
    cow.className = "cow";
    cow.style.position = "absolute";
    cow.style.left = `${currentX}px`;
    cow.style.top = `${animalLayer.clientHeight - 200}px`;
    cow.innerHTML = `<span class="cowIcon">${emoji}</span>`;
    animalLayer.appendChild(cow);
    cows.push(cow);
    trainCows.push(cow);

    requestAnimationFrame(() => {
      setTimeout(() => { cow.style.opacity = "1"; }, 50);
    });

    currentX -= spacingPattern[i % spacingPattern.length];
  });

  const moveTrain = setInterval(()=>{
    trainCows.forEach(cow=>{
      if(!animalLayer.contains(cow)) return;
      if(cow.dataset.abducting === "true") return;

      let x = parseFloat(cow.style.left);
      x += cowSpeed;
      cow.style.left = x + "px";

      if(pendingAbduction){
        const ufoRect = ufoContainer.getBoundingClientRect();
        const cowRect = cow.getBoundingClientRect();
        const cowCenter = cowRect.left + cowRect.width / 2;
        const ufoCenter = ufoRect.left + ufoRect.width / 2;

        if(Math.abs(cowCenter - ufoCenter) < 35){
          pendingAbduction = false;
          if(beam) beam.classList.add("beamOn");
          suckCowToUFO(cow);
          setTimeout(()=>{
            if(beam) beam.classList.remove("beamOn");
          },1000);
        }
      }

      if(x > window.innerWidth + 150){
        cow.remove();
        cows = cows.filter(c=>c!==cow);
      }
    });

    if(!trainCows.some(c => animalLayer.contains(c))){
      clearInterval(moveTrain);
      trainInProgress = false;
    }
  },2);
}

function suckCowToUFO(cow){
  cow.dataset.abducting = "true";
  const ufoRect = ufoContainer.getBoundingClientRect();
  const cowRect = cow.getBoundingClientRect();
  const targetX = ufoRect.left + ufoRect.width / 2;
  const targetY = ufoRect.top + ufoRect.height * 0.70;
  const distX = targetX - (cowRect.left + cowRect.width / 2);
  const distY = targetY - (cowRect.top + cowRect.height / 2);

  cow.style.transition = "transform 1.5s linear, opacity 1.2s linear";

  requestAnimationFrame(()=>{
    cow.style.transform = `translateX(-50%) translate(${distX}px, ${distY - 80}px)`;
    cow.style.opacity = "0";
  });

  setTimeout(()=>{
    cow.remove();
    cows = cows.filter(c=>c!==cow);
  },1500);
}

function scheduleNextCow(){
  const delay = 1200 + Math.random()*4000;
  setTimeout(()=>{
    if (window.gameStarted && typeof wordList !== "undefined" && wordList.length > 0){
      if(!trainInProgress){
        spawnCowTrain();
      }
    }
    scheduleNextCow();
  },delay);
}

window.addEventListener("load", scheduleNextCow);
</script>

<script>
(function () {
  const canvas = document.getElementById("groundCanvas");
  const ctx = canvas.getContext("2d");

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener("resize", resize);
  resize();

  let t = 0;

  function noise(x, y, t) {
    return (
      Math.sin(x * 0.008 + t) +
      Math.sin(y * 0.012 + t * 1.2) +
      Math.sin((x + y) * 0.006 - t * 0.7)
    ) / 3;
  }

  function draw() {
    const w = canvas.width;
    const h = canvas.height;
    const img = ctx.createImageData(w, h);
    const d = img.data;
    const groundStart = h * 0.42;
    const featherHeight = h * 0.08;

    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        let blend;
        if (y < groundStart) blend = 0;
        else if (y > groundStart + featherHeight) blend = 1;
        else blend = (y - groundStart) / featherHeight;

        const n = noise(x, y, t) + noise(x * 0.5, y * 0.5, t * 0.9);
        const swirl = Math.sin(n * 4 + y * 0.015);

        const wr = 170, wg = 160, wb = 105;
        const gr = 65, gg = 100, gb = 60;
        const mix = swirl * 0.5 + 0.5;

        const groundR = gr * mix + wr * (1 - mix);
        const groundG = gg * mix + wg * (1 - mix);
        const groundB = gb * mix + wb * (1 - mix);

        const i = (y * w + x) * 4;
        d[i] = groundR;
        d[i + 1] = groundG;
        d[i + 2] = groundB;
        d[i + 3] = 255;
      }
    }

    ctx.putImageData(img, 0, 0);
    t += 0.02;
    requestAnimationFrame(draw);
  }
  draw();
})();
</script>

<script>
(function(){
  const wobbleSettings = {
    maxAngle: 2,
    speed: 0.08,
    randomOffset: true
  };

  function animateAnimalWobble(){
    const animals = document.querySelectorAll(".cow");
    const time = performance.now() * wobbleSettings.speed;

    animals.forEach((animal,index)=>{
      if(animal.dataset.abducting === "true") return;
      const offset = wobbleSettings.randomOffset ? index * 1.7 : 0;
      const angle = Math.sin(time + offset) * wobbleSettings.maxAngle;
      animal.style.transform = `translateX(-50%) rotate(${angle}deg)`;
    });
    requestAnimationFrame(animateAnimalWobble);
  }
  animateAnimalWobble();
})();
</script>

            return "Guest";

        return studentDatabase.get(trimmed) || "Guest";

})();
