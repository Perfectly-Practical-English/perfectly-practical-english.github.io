<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Student Picker Wheel</title>
<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100vh;
    overflow: hidden;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #000000;
    color: #ffffff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 16px;
}

#appHeader {
    width: 100%;
    max-width: 340px;
    display: flex;
    flex-direction: column;
    align-items: center;
    flex-shrink: 0;
}

.classSelect {
    width: 100%;
    height: 42px;
    font-size: 14px;
    font-weight: bold;
    background: #111111;
    color: #ffffff;
    border: 1px solid #444444;
    border-radius: 8px;
    text-align: center;
    text-align-last: center;
    cursor: pointer;
    outline: none;
}

#wheelContainer {
    position: relative;
    width: 100%;
    max-width: 320px;
    aspect-ratio: 1 / 1;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
}

#studentWheelCanvas {
    display: block;
    width: 100%;
    height: 100%;
    aspect-ratio: 1 / 1;
    cursor: pointer;
    touch-action: none;
}

#controlsBar {
    width: 100%;
    max-width: 340px;
    display: flex;
    gap: 10px;
    flex-shrink: 0;
}

.controlBtn {
    flex: 1;
    height: 42px;
    font-size: 14px;
    font-weight: bold;
    background: #1a1a1a;
    color: #ffffff;
    border: 1px solid #444444;
    border-radius: 8px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
}
.controlBtn:active {
    background: #333333;
}

/* Instructions Modal */
#instModal {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.75);
    z-index: 9999;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
}
#instContent {
    background: #ffffff;
    color: #222222;
    width: 100%;
    max-width: 340px;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.5);
}
#instContent h3 {
    margin-top: 0;
    color: #1976d2;
}
#instContent p {
    font-size: 14px;
    line-height: 1.5;
}
.closeBtn {
    background: #1976d2;
    color: white;
    border: none;
    padding: 8px 16px;
    border-radius: 6px;
    font-weight: bold;
    cursor: pointer;
    float: right;
    margin-top: 10px;
}
</style>
</head>
<body>

<div id="appHeader">
    <select class="classSelect">
        <option value="" disabled selected>Select a spinner</option>
        <option value="4colors">4 Colors Mode</option>
    </select>
</div>

<div id="wheelContainer">
    <canvas id="studentWheelCanvas" width="350" height="350"></canvas>
</div>

<div id="controlsBar">
    <button class="controlBtn" id="spinBtn">Spin Wheel</button>
    <button class="controlBtn" id="instructionsBtn">Instructions</button>
</div>

<div id="instModal">
    <div id="instContent">
        <h3>Instructions</h3>
        <p>1. Select <b>4 Colors Mode</b> or a class from the dropdown.<br>
           2. Tap the wheel or <b>Spin Wheel</b> button to spin.</p>
        <button class="closeBtn" id="closeInst">Close</button>
    </div>
</div>

<script>
const RAW_TEXT = `
~11.1	
Blue	Thanawat
Blue	Warawut
Blue	Phawat
Green	Suphajak
Green	Kallapapruek
Green	Soraphat
Orange	Nacharot
Orange	Paphawin
Orange	Pattaradorn
Orange	Theerapith
Red	Thannakorn
Red	Khemmanat
Red	Pannawit
Red	Chatchanok
Purple	Tarzan
~13.2	
Blue	Patiphan
Blue	Katanyu
Blue	Suthimont
Green	Korravit
Green	Machat
Green	Phoomipat
Orange	Ingkrit
Orange	Pachara
Orange	Khanaphot
Orange	Napol
Red	Kannaphat
Red	Natthapakorn
Red	Phurit
Red	Pawarut
Purple	Tarzan
~14.1	
Blue	Krittanart
Blue	Natthanan
Blue	Nanaruchote
Green	Phutthiphat
Green	Boonraksa
Green	Kronpanod
Orange	Phudit
Orange	Dhatsawitt
Orange	Nonthapat
Orange	Chayangkoon
Orange	Punyawee
Red	Yuttanin
Red	Photsawee
Red	Jommanut
Red	Phurarit
Purple	Tarzan
~15.3	
Blue	Akkravich
Blue	Thanakorn
Blue	Punnawatz
Green	Puri
Green	Api Cha
Green	Panyarat
Orange	Nakarin
Orange	Chananon
Orange	Rachchavich
Orange	Phumiphat
Red	Naravich
Red	Preedipat 
Red	Archawin
Red	Worawit
Purple	Tarzan
~16.2	
Blue	Vachirasak
Blue	Chutipan
Blue	Pakornpat
Green	Panpuris
Green	Koonwich
Green	Nutphalod
Green	Jirayu
Orange	Setthawut
Orange	Theerapatch
Orange	Theeraphat
Orange	Pannatat
Red	Thanakrit
Red	Nakhun
Red	Boonpipon
Red	Warawat
Purple	Tarzan
`;

const studentColors = {
    Blue: "#93c5fd",
    Green: "#86efac",
    Orange: "#fdba74",
    Red: "#fca5a5",
    Purple: "#d8b4fe"
};

function parseStudents(raw){
    const blocks = raw.split(/(?=~)/g);
    const result={};
    blocks.forEach(block=>{
        block=block.trim();
        if(!block.startsWith("~")) return;
        const lines = block.split("\n").map(x=>x.trim()).filter(Boolean);
        const className = lines[0].replace(/^~/, "").split("-")[0].trim();
        result[className]=[];
        for(let i=1;i<lines.length;i++){
            const parts = lines[i].split(/\s+/);
            const team = parts.shift();
            const name = parts.join(" ");
            result[className].push({
                name: name,
                team: team,
                color: studentColors[team] || "#ddd"
            });
        }
    });
    return result;
}

const studentData = parseStudents(RAW_TEXT);
const classSelect = document.querySelector(".classSelect");
const canvas = document.getElementById("studentWheelCanvas");
const ctx = canvas.getContext("2d");

let students = [];
let angle = 0;
let spinning = false;
const size = 350;
const radius = 145;
const cx = size / 2;
const cy = size / 2;

function loadClass(cls) {
    if (cls === "4colors" || !studentData[cls]) {
        students = [
            { name: "Blue", color: studentColors.Blue },
            { name: "Green", color: studentColors.Green },
            { name: "Orange", color: studentColors.Orange },
            { name: "Red", color: studentColors.Red }
        ];
    } else {
        students = [...studentData[cls]];
    }
    drawWheel();
}

Object.keys(studentData).forEach(cls => {
    const opt = document.createElement("option");
    opt.value = cls;
    opt.textContent = `Class ${cls}`;
    classSelect.appendChild(opt);
});

classSelect.addEventListener("change", () => {
    loadClass(classSelect.value);
});

function drawWheel() {
    ctx.clearRect(0, 0, size, size);
    if (!students.length) return;
    const slice = (Math.PI * 2) / students.length;

    students.forEach((s, i) => {
        const start = angle + i * slice;
        const end = start + slice;

        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.arc(cx, cy, radius, start, end);
        ctx.closePath();
        ctx.fillStyle = s.color || "#ddd";
        ctx.fill();
        ctx.strokeStyle = "#111";
        ctx.lineWidth = 0.5;
        ctx.stroke();

        ctx.save();
        const mid = (start + end) / 2;
        ctx.translate(cx + Math.cos(mid) * (radius - 35), cy + Math.sin(mid) * (radius - 35));
        ctx.rotate(mid + Math.PI);
        ctx.fillStyle = "#111";
        ctx.font = "bold 11px system-ui, sans-serif";
        ctx.textAlign = "left";
        ctx.textBaseline = "middle";
        ctx.fillText(s.name, 0, 0);
        ctx.restore();
    });

    // Metallic Rim Styling
    ctx.save();
    const rimWidth = 10;
    const rimGradient = ctx.createRadialGradient(cx, cy, radius - rimWidth, cx, cy, radius + 5);
    rimGradient.addColorStop(0, "#5c3900");
    rimGradient.addColorStop(0.25, "#d8a62a");
    rimGradient.addColorStop(0.45, "#fff2a6");
    rimGradient.addColorStop(0.65, "#c58a16");
    rimGradient.addColorStop(0.85, "#8b5a05");
    rimGradient.addColorStop(1, "#3b2400");

    ctx.beginPath();
    ctx.arc(cx, cy, radius, 0, Math.PI * 2);
    ctx.strokeStyle = rimGradient;
    ctx.lineWidth = rimWidth;
    ctx.stroke();
    ctx.restore();

    // Center Brass Hub
    ctx.save();
    const brass = ctx.createRadialGradient(cx - 8, cy - 10, 3, cx, cy, 30);
    brass.addColorStop(0, "#fff2a6");
    brass.addColorStop(0.15, "#ffd34e");
    brass.addColorStop(0.35, "#c58a16");
    brass.addColorStop(0.65, "#8b5a05");
    brass.addColorStop(0.85, "#d8a62a");
    brass.addColorStop(1, "#5c3900");

    ctx.beginPath();
    ctx.arc(cx, cy, 26, 0, Math.PI * 2);
    ctx.fillStyle = brass;
    ctx.fill();
    ctx.strokeStyle = "#5a3500";
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.restore();

    // Top Red Pointer
    ctx.beginPath();
    ctx.moveTo(cx, 32);
    ctx.lineTo(cx - 10, 16);
    ctx.lineTo(cx + 10, 16);
    ctx.closePath();
    ctx.fillStyle = "red";
    ctx.fill();
}

function spinWheel() {
    if (spinning || !students.length) return;
    spinning = true;
    let start = performance.now();
    let startAngle = angle;
    let targetTurns = 7 + Math.random() * 3;
    let targetAngle = startAngle + targetTurns * Math.PI * 2 + Math.random() * Math.PI * 2;
    let duration = 2000;

    function animate(now) {
        let p = (now - start) / duration;
        if (p > 1) p = 1;
        let ease = 1 - Math.pow(1 - p, 5);
        angle = startAngle + (targetAngle - startAngle) * ease;
        drawWheel();

        if (p < 1) {
            requestAnimationFrame(animate);
        } else {
            spinning = false;
        }
    }
    requestAnimationFrame(animate);
}

canvas.addEventListener("click", spinWheel);
document.getElementById("spinBtn").addEventListener("click", spinWheel);

// Initialize with 4 Colors Mode by default on load
loadClass("4colors");

document.getElementById("instructionsBtn").onclick = () => {
    document.getElementById("instModal").style.display = "flex";
};
document.getElementById("closeInst").onclick = () => {
    document.getElementById("instModal").style.display = "none";
};
</script>

<style>
  html, body {
    max-width: 100vw !important;
    overflow-x: hidden !important;
    box-sizing: border-box;
  }
  *, *:before, *:after {
    box-sizing: inherit;
  }
  body {
    padding-left: 12px !important;
    padding-right: 12px !important;
    margin: 0 auto !important;
  }
  img, video, canvas, table {
    max-width: 100% !important;
    height: auto !important;
  }
</style>
<!-- ========================================== -->
<!-- NARROW PHONE LAYOUT SAFETY PATCH (END) -->
<!-- ========================================== -->
</body>
</html>
