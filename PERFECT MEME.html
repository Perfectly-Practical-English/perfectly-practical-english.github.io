                l.scale = saved.scale;
                l.visible = saved.visible;

                // Immune image protection: only update if saved image exists, never delete placed image
                if (saved.img) {
                    ensureLayerCanvas(key);
                    let lCtx = l.img.getContext('2d');
                    lCtx.clearRect(0, 0, canvas.width, canvas.height);
                    lCtx.drawImage(saved.img, 0, 0);
                }
            }
        });
    }

    if (stateObj.penLayer && typeof penLayerCtx !== 'undefined') {
        penLayerCtx.clearRect(0, 0, canvas.width, canvas.height);
        penLayerCtx.drawImage(stateObj.penLayer, 0, 0);
    }
}

function updateUndoRedoButtons() {
    let undoBtn = document.getElementById('btnUndo');
    let redoBtn = document.getElementById('btnRedo');

    if (undoBtn) undoBtn.disabled = (undoStack.length === 0);
    if (redoBtn) redoBtn.disabled = (redoStack.length === 0);
}

// Keyboard shortcuts
window.addEventListener('keydown', (e) => {
    if (e.ctrlKey && !e.shiftKey && e.key.toLowerCase() === 'z') {
        e.preventDefault();
        undo();
    } else if ((e.ctrlKey && e.key.toLowerCase() === 'y') || (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === 'z')) {
        e.preventDefault();
        redo();
    }
});
</script>

<script>

// Sharpen Filter Engine (Gentle Sharpen + Self-Smoothing)
function sharpenActiveLayer() {
    if (activeLayerKey === 'txt' || !layers[activeLayerKey] || !layers[activeLayerKey].img) {
        alert("Please select a valid image layer first.");
        return;
    }
    
    ensureLayerCanvas(activeLayerKey);
    let l = layers[activeLayerKey];
    let lCtx = l.img.getContext('2d');
    
    // Save state for Undo/Redo compatibility
    saveStateSnapshot();
    
    let w = canvas.width;
    let h = canvas.height;
    let imgData = lCtx.getImageData(0, 0, w, h);
    let src = imgData.data;
    let output = lCtx.createImageData(w, h);
    let dst = output.data;
    
    /*
       Gentle sharpening.

       Instead of the aggressive 5,-1,-1,-1,-1 kernel,
       compare each pixel with the average of its four
       neighboring pixels.

       A lower strength gives a cleaner, more natural result.
    */
    const sharpenStrength = 0.55;

    for (let i = 0; i < src.length; i++) {
        dst[i] = src[i];
    }

    for (let y = 1; y < h - 1; y++) {
        for (let x = 1; x < w - 1; x++) {

            const idx = (y * w + x) * 4;

            for (let c = 0; c < 3; c++) {

                const center = src[idx + c];

                const top =
                    src[((y - 1) * w + x) * 4 + c];

                const bottom =
                    src[((y + 1) * w + x) * 4 + c];

                const left =
                    src[(y * w + (x - 1)) * 4 + c];

                const right =
                    src[(y * w + (x + 1)) * 4 + c];

                const average =
                    (top + bottom + left + right) / 4;

                const difference = center - average;

                const sharpened =
                    center + difference * sharpenStrength;

                dst[idx + c] =
                    Math.min(255, Math.max(0, sharpened));
            }
        }
    }

    /*
       Very light self-smoothing.

       This reduces the harsh pixel-to-pixel transitions
       created by sharpening without applying a conventional
       blur to the whole image.

       The original sharpened pixel remains dominant.
    */

    const smoothed = new Uint8ClampedArray(dst);

    const smoothStrength = 0.18;

    for (let y = 1; y < h - 1; y++) {
        for (let x = 1; x < w - 1; x++) {

            const idx = (y * w + x) * 4;

            for (let c = 0; c < 3; c++) {

                const center = dst[idx + c];

                const neighborAverage =
                    (
                        dst[((y - 1) * w + x) * 4 + c] +
                        dst[((y + 1) * w + x) * 4 + c] +
                        dst[(y * w + (x - 1)) * 4 + c] +
                        dst[(y * w + (x + 1)) * 4 + c]
                    ) / 4;

                /*
                   Only pull the sharpened pixel slightly
                   toward its neighbors. This is deliberately
                   much weaker than a blur.
                */
                smoothed[idx + c] =
                    Math.min(
                        255,
                        Math.max(
                            0,
                            center +
                            (neighborAverage - center) * smoothStrength
                        )
                    );
            }
        }
    }

    for (let i = 0; i < dst.length; i++) {
        dst[i] = smoothed[i];
    }

    lCtx.putImageData(output, 0, 0);

    redraw();
    updateUndoRedoButtons();
}

</script>

    RAW_STUDENT_DATA.trim().split('\n').forEach(line => {

        if (id && name) studentDatabase.set(id, name);

    window.resolveStudentNameFromId = function(idInput) {
        if (!idInput) return "Student";
        const trimmed = String(idInput).trim();
        if (/^(x|g|guest)$/i.test(trimmed)) {
            return "Guest";
        }
        return studentDatabase.get(trimmed) || "Guest";
    };
})();
