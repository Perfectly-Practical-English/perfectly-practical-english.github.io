<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Meme Maker</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Aptos', Arial, sans-serif;
            background: #f0f2f5;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { font-size: 1.2rem; margin: 5px 0 8px 0; color: #333; text-align: center; }
        
        .app-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 360px;
            gap: 8px;
        }

        .toolbar {
            background: #fff;
            padding: 8px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            gap: 3px;
            width: 100%;
        }

.toolbar-row {
    display: flex;
    gap: 3px;
    align-items: center;
    justify-content: flex-start;
    width: 100%;
}

.toolbar-row:last-child select,
.toolbar-row:last-child button {
    flex: 1 1 0;
    min-width: 0;
}

.student-id-container {
    flex: 1;
    min-width: 0;
    display: flex;
}

.student-id-container input {
    width: 100%;
    padding: 5px 8px;
    border-radius: 4px;
    font-family: 'Aptos', Arial, sans-serif;
    font-size: 11px;
    line-height: normal;
    border: 1px solid #ccc;
    background: #f8f9fa;
}

.student-id-container input::placeholder {
    font-family: 'Aptos', Arial, sans-serif;
    font-size: 11px;
} 
        button, select, .dropdown-btn {
            padding: 5px 8px;
            border-radius: 4px;
            font-size: 11px;
            border: 1px solid #ccc;
            background: #f8f9fa;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
        }
        button, .dropdown-btn { background: #0078D4; color: white; border: none; }
        button:hover, .dropdown-btn:hover { background: #106ebe; }
        button:active, .dropdown-btn:active { background: #005a9e; }
        button.active, .dropdown-btn.active { background: #107C10 !important; }
        button:disabled { background: #cccccc; cursor: not-allowed; }
        input[type="file"] { display: none; }

        .dropdown {
            position: relative;
            display: inline-block;
            flex: 1;
        }
        .dropdown-btn {
            width: 100%;
            text-align: center;
        }
        .dropdown-btn.layer-active {
            box-shadow: inset 0 0 0 2px #ffaa00;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            background-color: #ffffff;
            min-width: 160px;
            box-shadow: 0px 8px 16px rgba(0,0,0,0.2);
            z-index: 100;
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid #ddd;
        }
        .dropdown-content button, .dropdown-content label {
            color: #333;
            padding: 6px 10px;
            text-align: left;
            background: #f8f9fa;
            border: none;
            width: 100%;
            display: block;
            border-radius: 0;
            cursor: pointer;
            font-size: 11px;
            transition: background 0.15s;
        }
        .dropdown-content button:hover, .dropdown-content label:hover {
            background-color: #e9ecef;
            color: #000;
        }
        .dropdown-content button.flyout-active {
            background-color: #f8f9fa;
            font-weight: bold;
        }
        .dropdown-content button.flyout-active::before {
            content: "✓ ";
            color: #107C10;
            font-weight: bold;
        }

        .dropdown.show .dropdown-content { display: block; }

        .color-palette-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            padding: 8px;
            background: #fff;
        }
        .color-swatch {
            width: 26px;
            height: 26px;
            border-radius: 4px;
            cursor: pointer;
            border: 1px solid rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }
        .color-swatch.white-swatch { border: 1px solid #ccc; background: white; }
        .color-swatch.eraser-swatch { background: #e9ecef; border: 1px dashed #6c757d; font-size: 13px; }

        .canvas-container {
            position: relative;
            width: 360px;
            height: 360px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            border: 2px solid #ccc;
            background: #fff;
            overflow: hidden;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        .text-layer-input {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: transparent;
            border: 1px dashed rgba(0, 120, 212, 0.3);
            color: #ffffff;
            font-family: 'Aptos', Arial, sans-serif;
            font-weight: bold;
            font-size: 26px;
            line-height: 1.3;
            text-align: center;
            resize: none;
            outline: none;
            z-index: 20;
            -webkit-text-stroke: 1px #000000;
            text-shadow: 2px 2px 3px rgba(0,0,0,0.8);
            padding: 20px 10px;
            pointer-events: none;
            display: none;
        }
        .text-layer-input:focus {
            pointer-events: auto;
            border: 1px solid rgba(0, 120, 212, 0.7);
            background: rgba(0, 0, 0, 0.05);
        }
        .text-layer-input::placeholder {
            color: #999999;
            -webkit-text-stroke: 0px transparent;
            text-shadow: none;
            font-weight: normal;
        }

        .instructions {
            font-size: 11px;
            color: #666;
            text-align: center;
            padding: 0 5px;
        }
    </style>
</head>
<body>

<div class="app-container">
        <h1></h1>
        
        <div class="toolbar">
            <div class="toolbar-row">


<div class="student-id-container">
    <input type="text" id="studentIdInput" placeholder="Enter ID..." maxlength="10">
</div>
                <div class="dropdown" id="dropBg">
                    <button class="dropdown-btn layer-active" type="button" id="btnBg" onclick="handleLayerButtonClick('bg')">Layer 1</button>
                    <div class="dropdown-content">
                        <label style="cursor:pointer;">Upload <input type="file" id="bgUpload" accept="image/*" onchange="handleImageUpload(event, 'bg')"></label>
                        <button type="button" id="bgShowBtn" onclick="setLayerVisibility('bg', true)">Show</button>
                        <button type="button" id="bgHideBtn" onclick="setLayerVisibility('bg', false)">Hide</button>
                        <button type="button" onclick="resetLayer('bg')">Reset</button>
                        <button type="button" onclick="deleteLayer('bg')" style="color:red;">Delete</button>
                    </div>
                </div>

                <div class="dropdown" id="dropFg1">
                    <button class="dropdown-btn" type="button" id="btnFg1" onclick="handleLayerButtonClick('fg1')">Layer 2</button>
                    <div class="dropdown-content">
                        <label style="cursor:pointer;">Upload <input type="file" id="fg1Upload" accept="image/*" onchange="handleImageUpload(event, 'fg1')"></label>
                        <button type="button" id="fg1ShowBtn" onclick="setLayerVisibility('fg1', true)">Show</button>
                        <button type="button" id="fg1HideBtn" onclick="setLayerVisibility('fg1', false)">Hide</button>
                        <button type="button" onclick="mergeLayerDown('fg1')">Merge Down</button>
                        <button type="button" onclick="resetLayer('fg1')">Reset</button>
                        <button type="button" onclick="deleteLayer('fg1')" style="color:red;">Delete</button>
                    </div>
                </div>

                <div class="dropdown" id="dropFg2">
                    <button class="dropdown-btn" type="button" id="btnFg2" onclick="handleLayerButtonClick('fg2')">Layer 3</button>
                    <div class="dropdown-content">
                        <label style="cursor:pointer;">Upload <input type="file" id="fg2Upload" accept="image/*" onchange="handleImageUpload(event, 'fg2')"></label>
                        <button type="button" id="fg2ShowBtn" onclick="setLayerVisibility('fg2', true)">Show</button>
                        <button type="button" id="fg2HideBtn" onclick="setLayerVisibility('fg2', false)">Hide</button>
                        <button type="button" onclick="mergeLayerDown('fg2')">Merge Down</button>
                        <button type="button" onclick="resetLayer('fg2')">Reset</button>
                        <button type="button" onclick="deleteLayer('fg2')" style="color:red;">Delete</button>
                    </div>
                </div>

                <div class="dropdown" id="dropTxt">
                    <button class="dropdown-btn" type="button" id="btnTxt" onclick="handleLayerButtonClick('txt')" style="background:#6f42c1;">Text</button>
                    <div class="dropdown-content">
                        <button type="button" id="txtShowBtn" onclick="setLayerVisibility('txt', true)">Show</button>
                        <button type="button" id="txtHideBtn" onclick="setLayerVisibility('txt', false)">Hide</button>
                        <button type="button" id="fontDefaultBtn" onclick="setFontFamily('Aptos, Arial, sans-serif', 'fontDefaultBtn')" class="flyout-active">Default (Aptos)</button>
                        <button type="button" id="fontRobotoBtn" onclick="setFontFamily('Roboto, sans-serif', 'fontRobotoBtn')">Roboto (Android)</button>
                        <button type="button" id="fontSFBtn" onclick="setFontFamily('-apple-system, SF Pro Display, Helvetica, sans-serif', 'fontSFBtn')">SF Pro / Helvetica (iPhone)</button>
                        <button type="button" id="fontImpactBtn" onclick="setFontFamily('Impact, Charcoal, sans-serif', 'fontImpactBtn')">Impact (Meme)</button>
                        <button type="button" id="fontGeorgiaBtn" onclick="setFontFamily('Georgia, serif', 'fontGeorgiaBtn')">Georgia (Serif)</button>
                        <button type="button" onclick="resetTextLayer()">Reset Text</button>
                    </div>
                </div>
            </div>

            <div class="toolbar-row">
                <!-- Pen Tool Dropdown with Balanced 12-Tile Palette & Pen Eraser as Last Tile -->
                <div class="dropdown" id="dropPen">
                    <button class="dropdown-btn" type="button" id="toolPenBtn" onclick="toggleDropdown('dropPen')">Pen</button>
                    <div class="dropdown-content" id="colorPaletteContent" style="padding:0;">
                        <div class="color-palette-grid">
                            <div class="color-swatch white-swatch" data-color="#ffffff" title="White"></div>
                            <div class="color-swatch" style="background:#000000;" data-color="#000000" title="Black"></div>
                            <div class="color-swatch" style="background:#ff4d4d;" data-color="#ff4d4d" title="Red"></div>
                            <div class="color-swatch" style="background:#ffa500;" data-color="#ffa500" title="Orange"></div>
                            <div class="color-swatch" style="background:#ffcc00;" data-color="#ffcc00" title="Yellow"></div>
                            <div class="color-swatch" style="background:#4CAF50;" data-color="#4CAF50" title="Green"></div>
                            <div class="color-swatch" style="background:#b1d7ed;" data-color="#b1d7ed" title="Blue"></div>
                            <div class="color-swatch" style="background:#e1d0f1;" data-color="#e1d0f1" title="Purple"></div>
                            <div class="color-swatch" style="background:#8B4513;" data-color="#8B4513" title="Brown"></div>
                            <div class="color-swatch" style="background:#ffc0cb;" data-color="#ffc0cb" title="Pink"></div>
                            <div class="color-swatch" style="background:#808080;" data-color="#808080" title="Grey"></div>
                            <div class="color-swatch eraser-swatch" data-action="eraser" title="Pen Eraser">🧽</div>
                        </div>
                    </div>
                </div>

                <div class="dropdown" id="dropSelection">
                    <button class="dropdown-btn" type="button" onclick="toggleDropdown('dropSelection')">Select</button>
                    <div class="dropdown-content">
                        <button type="button" id="toolLassoBtn" onclick="setTool('lasso')">Polygonal Lasso</button>
                        <button type="button" id="btnAddPoint" onclick="addCagePoint()">
    + Point <span id="checkAdd" style="color: #107C10; display: none;">✔</span>
</button>
<button type="button" id="btnDeletePoint" onclick="deleteCagePoint()">
    - Point <span id="checkDelete" style="color: #107C10; display: none;">✔</span>
</button>
                        <button type="button" id="toolRectBtn" onclick="setTool('rectangle')">Rectangle Tool</button>
                        <button type="button" id="toolCircleBtn" onclick="setTool('circle')">Circle Tool</button>
                        <button type="button" onclick="executeSelection('interior')">Delete Interior</button>
                        <button type="button" onclick="executeSelection('exterior')">Delete Exterior</button>
                        <button type="button" id="toolRestoreSelectBtn" onclick="setTool('restore')" style="color:#107C10; font-weight:bold;">Restore Brush</button>

<button type="button" onclick="cropToRectangle()" style="color:#107C10; font-weight:bold;">Crop to Selection</button>
                    </div>
                </div>

                <button type="button" id="btnMoveToggle" onclick="toggleMoveMode()">Move</button>

                <div class="dropdown" id="dropEraser">
                    <button class="dropdown-btn" type="button" onclick="toggleDropdown('dropEraser')">Eraser</button>
                    <div class="dropdown-content">
                        <button type="button" id="toolEraserBtn" onclick="setTool('eraser')">Round</button>
                        <button type="button" id="toolSquareEraserBtn" onclick="setTool('squareEraser')">Square</button>
                        <button type="button" id="toolRestoreBtn" onclick="setTool('restore')" style="color:#107C10; font-weight:bold;">Restore Brush</button>
                        <button type="button" id="toolEraserNBtn" onclick="setTool('eraserN')">↑</button>
                        <button type="button" id="toolEraserNEBtn" onclick="setTool('eraserNE')">↗</button>
                        <button type="button" id="toolEraserEBtn" onclick="setTool('eraserE')">→</button>
                        <button type="button" id="toolEraserSEBtn" onclick="setTool('eraserSE')">↘</button>
                        <button type="button" id="toolEraserSBtn" onclick="setTool('eraserS')">↓</button>
                        <button type="button" id="toolEraserSWBtn" onclick="setTool('eraserSW')">↙</button>
                        <button type="button" id="toolEraserWBtn" onclick="setTool('eraserW')">←</button>
                        <button type="button" id="toolEraserNWBtn" onclick="setTool('eraserNW')">↖</button>
                    </div>
                </div>

                <button type="button" id="btnScaleToggle" onclick="toggleScaleMode()">Scale</button>
                <button type="button" id="btnSharpen" onclick="sharpenActiveLayer()" title="Sharpen active layer">Sharp</button>

                <button type="button" id="btnUndo" onclick="undoAction()" style="background: #6c757d;" disabled>↺</button>
                <button type="button" id="btnRedo" onclick="redoAction()" style="background: #6c757d;" disabled>↻</button>
            </div>

            <div class="toolbar-row">
                <select id="fontStyleSelect" onchange="updateTextStyles()" style="font-size:10px;">
                    <option value="normal">Regular</option>
                    <option value="bold" selected>Bold</option>
                    <option value="italic">Italic</option>
                </select>
                
                <select id="fontColorSelect" onchange="updateTextStyles()" style="font-size:10px;">
                    <option value="#ffffff" selected>White</option>
                    <option value="#000000">Black</option>
                    <option value="#ff0000">Red</option>
                    <option value="#0000ff">Blue</option>
                    <option value="#008000">Green</option>
                    <option value="#ffa500">Orange</option>
                    <option value="#ffc0cb">Pink</option>
                    <option value="#ffff00">Yellow</option>
                    <option value="#a52a2a">Brown</option>
                    <option value="#808080">Grey</option>
                </select>

                <select id="outlineColorSelect" onchange="updateTextStyles()" style="font-size:10px;">
                    <option value="#000000" selected>Black Outline</option>
                    <option value="transparent">None</option>
                    <option value="#ffffff">White</option>
                    <option value="#ff0000">Red</option>
                    <option value="#0000ff">Blue</option>
                    <option value="#008000">Green</option>
                    <option value="#ffa500">Orange</option>
                    <option value="#ffc0cb">Pink</option>
                    <option value="#ffff00">Yellow</option>
                    <option value="#a52a2a">Brown</option>
                    <option value="#808080">Grey</option>
                </select>

                <button type="button" onclick="downloadMeme()">Download</button>
            </div>
        </div>

        <div class="canvas-container" id="canvasContainer">
            <canvas id="memeCanvas" width="360" height="360"></canvas>
            <textarea id="memeTextInput" class="text-layer-input" placeholder="Type text here..."></textarea>
        </div>
        
        <div class="instructions" id="instructionText"></div>
    </div>

<!-- 1. Canvas Setup & Core State Variables -->
<script>
const canvas = document.getElementById('memeCanvas');
const ctx = canvas.getContext('2d');
const textInput = document.getElementById('memeTextInput');

let activeLayerKey = 'bg';
let isMoveEnabled = false;
let isScaleEnabled = false;
let currentFontFamily = "'Aptos', Arial, sans-serif";

let penLayerCanvas = document.createElement('canvas');
penLayerCanvas.width = 360;
penLayerCanvas.height = 360;
let penLayerCtx = penLayerCanvas.getContext('2d');

let layers = {
    bg: { img: null, orig: null, backupCanvas: null, x: 0, y: 0, scale: 1, visible: true },
    fg1: { img: null, orig: null, backupCanvas: null, x: 0, y: 0, scale: 1, visible: true },
    fg2: { img: null, orig: null, backupCanvas: null, x: 0, y: 0, scale: 1, visible: false },
    txt: { x: 0, y: 0, visible: false }
};

let globalUndoStack = [];
let globalRedoStack = [];

let currentTool = 'none';
let stylusColor = '#000000';
let stylusSize = 6;

let lassoPoints = [];
let currentMousePos = { x: 0, y: 0 };
let isLassoCompleted = false;
let draggedPointIndex = null;

let isAddPointActive = false;
let isDeletePointActive = false;
let shapeBox = null;
let circleCenter = null; 
let isDrawing = false;
let dragStartX = 0, dragStartY = 0;

let activeTouches = new Map();
let initialPinchDistance = null;
let initialPinchScale = 1;
</script>

<!-- 2. UI & Event Listeners (Dropdowns, Color Swatches, & Text Inputs) -->
<script>
let dashOffset = 0;
setInterval(() => {
    if (currentTool === 'lasso' && lassoPoints.length > 0) {
        dashOffset = (dashOffset - 1) % 16;
        redraw();
    }
}, 50);

document.querySelectorAll('.color-swatch').forEach(swatch => {
    swatch.addEventListener('click', (e) => {
        if (e.target.dataset.action === 'eraser') {
            setTool('penEraser');
            document.getElementById('toolPenBtn').innerText = '🧽';
        } else if (e.target.dataset.color) {
            stylusColor = e.target.dataset.color;
            setTool('pen');
            document.getElementById('toolPenBtn').innerText = 'Pen';
        }
        closeAllDropdowns();
    });
});

textInput.addEventListener('click', () => {
    if (!isMoveEnabled && !isScaleEnabled && activeLayerKey === 'txt') {
        textInput.style.pointerEvents = 'auto';
        textInput.focus();
    }
});

textInput.addEventListener('blur', () => {
    if (activeLayerKey !== 'txt') {
        textInput.style.pointerEvents = 'none';
    }
});

function toggleDropdown(dropdownId) {
    const dropdown = document.getElementById(dropdownId);
    const isOpen = dropdown.classList.contains('show');
    document.querySelectorAll('.dropdown').forEach(d => d.classList.remove('show'));
    if (!isOpen) dropdown.classList.add('show');
}

window.onclick = function(event) {
    if (!event.target.closest('.dropdown')) {
        document.querySelectorAll('.dropdown').forEach(d => d.classList.remove('show'));
    }
}

function closeAllDropdowns() {
    document.querySelectorAll('.dropdown').forEach(d => d.classList.remove('show'));
}
</script>

<!-- 3. Layer & Tool State Management -->
<script>
function deactivateAllTools(except = '') {
    isMoveEnabled = false;
    isScaleEnabled = false;
    draggedPointIndex = null;
    
if (except !== 'tool') currentTool = 'none';
    if (except !== 'shape') shapeBox = null;
    if (except !== 'lasso') {
        lassoPoints = [];
        isLassoCompleted = false;
    }
    document.getElementById('btnMoveToggle').classList.remove('active');
    document.getElementById('btnScaleToggle').classList.remove('active');
    updateFlyoutActiveStates();
}

function updateFlyoutActiveStates() {
    ['bg', 'fg1', 'fg2', 'txt'].forEach(key => {
        let showBtn = document.getElementById(key + 'ShowBtn');
        let hideBtn = document.getElementById(key + 'HideBtn');
        if (showBtn) showBtn.classList.toggle('flyout-active', layers[key].visible);
        if (hideBtn) hideBtn.classList.toggle('flyout-active', !layers[key].visible);
    });

    const tools = ['pen', 'penEraser', 'lasso', 'rectangle', 'circle', 'eraser', 'squareEraser', 'restore', 'eraserN', 'eraserNE', 'eraserE', 'eraserSE', 'eraserS', 'eraserSW', 'eraserW', 'eraserNW'];
    tools.forEach(t => {
        let btnId = 'tool' + t.charAt(0).toUpperCase() + t.slice(1) + 'Btn';
        let btn = document.getElementById(btnId);
        if (btn) btn.classList.toggle('flyout-active', currentTool === t);
    });
}

function handleLayerButtonClick(key) {
    setActiveLayer(key);
    toggleDropdown('drop' + key.charAt(0).toUpperCase() + key.slice(1));
}

function toggleMoveMode() {
    if (isMoveEnabled) {
        deactivateAllTools();
    } else {
        deactivateAllTools();
        isMoveEnabled = true;
        document.getElementById('btnMoveToggle').classList.add('active');
        if (activeLayerKey === 'txt') textInput.style.pointerEvents = 'none';
    }
    redraw();
}

function toggleScaleMode() {
    if (isScaleEnabled) {
        deactivateAllTools();
    } else {
        deactivateAllTools();
        isScaleEnabled = true;
        document.getElementById('btnScaleToggle').classList.add('active');
        if (activeLayerKey === 'txt') textInput.style.pointerEvents = 'none';
    }
    redraw();
}


function setActiveLayer(key) {
    activeLayerKey = key;
    ['bg', 'fg1', 'fg2', 'txt'].forEach(k => {
        let btn = document.getElementById('btn' + k.charAt(0).toUpperCase() + k.slice(1));
        if (btn) btn.classList.toggle('layer-active', k === key);
    });

    deactivateAllTools();

    if (key === 'txt') {
        textInput.style.pointerEvents = 'auto';
        if (layers.txt.visible) textInput.focus();
    } else {
        textInput.style.pointerEvents = 'none';
    }

    updateUndoRedoButtons();
    updateFlyoutActiveStates();
    redraw();
}

function setLayerVisibility(key, isVisible) {
    saveStateSnapshot();
    layers[key].visible = isVisible;
    if (key === 'txt') {
        textInput.style.display = isVisible ? 'block' : 'none';
        if (isVisible) {
            setActiveLayer('txt');
            textInput.focus();
        }
    }
    deactivateAllTools();
    closeAllDropdowns();
    updateFlyoutActiveStates();
    redraw();
}
</script>

<!-- 4. Text Manipulation & Styling -->
<script>
function setFontFamily(fontString, btnId) {
    currentFontFamily = fontString;
    textInput.style.fontFamily = fontString;
    
    ['fontDefaultBtn', 'fontRobotoBtn', 'fontSFBtn', 'fontImpactBtn', 'fontGeorgiaBtn'].forEach(id => {
        let b = document.getElementById(id);
        if (b) b.classList.toggle('flyout-active', id === btnId);
    });
    
    closeAllDropdowns();
    redraw();
}

function resetTextLayer() {
    saveStateSnapshot();
    textInput.value = "";
    layers.txt.x = 0;
    layers.txt.y = 0;
    textInput.style.transform = `translate(0px, 0px)`;
    layers.txt.visible = false;
    textInput.style.display = 'none';
    deactivateAllTools();
    closeAllDropdowns();
    updateFlyoutActiveStates();
    redraw();
}

function updateTextStyles() {
    const fontStyle = document.getElementById('fontStyleSelect').value;
    const fontColor = document.getElementById('fontColorSelect').value;
    const outlineColor = document.getElementById('outlineColorSelect').value;

    textInput.style.color = fontColor;
    textInput.style.fontFamily = currentFontFamily;
    textInput.style.fontStyle = fontStyle === 'italic' ? 'italic' : 'normal';
    textInput.style.fontWeight = fontStyle === 'bold' ? 'bold' : 'normal';

    if (outlineColor !== 'transparent') {
        textInput.style.webkitTextStroke = `1.5px ${outlineColor}`;
    } else {
        textInput.style.webkitTextStroke = '0px transparent';
    }
    redraw();
}
</script>

<!-- 5. History & State Management (Auto-Snapshot Interceptor) -->
<script>
window.globalUndoStack = window.globalUndoStack || [];
window.globalRedoStack = window.globalRedoStack || [];

function ensureLayerCanvas(layerKey) {
    let l = layers[layerKey];
    if (!l || l.img) return;
    let layerCanvas = document.createElement('canvas');
    layerCanvas.width = canvas.width;
    layerCanvas.height = canvas.height;

    let backupCanvas = document.createElement('canvas');
    backupCanvas.width = canvas.width;
    backupCanvas.height = canvas.height;

    l.img = layerCanvas;
    l.backupCanvas = backupCanvas;
    l.x = 0;
    l.y = 0;
    l.scale = 1;
    l.visible = true;
}

function saveStateSnapshot() {
    let snapshot = {
        layers: {
            bg: cloneLayerData(layers.bg),
            fg1: cloneLayerData(layers.fg1),
            fg2: cloneLayerData(layers.fg2),
            txt: { ...layers.txt, value: textInput ? textInput.value : '' }
        },
        penLayer: cloneCanvas(penLayerCanvas),
        activeLayerKey: activeLayerKey
    };
    globalUndoStack.push(snapshot);
    globalRedoStack = []; 
    updateUndoRedoButtons();
    console.log("Snapshot auto-saved! Stack size:", globalUndoStack.length);
}

function cloneLayerData(l) {
    if (!l) return null;
    let clonedImg = null;
    let clonedBackup = null;
    if (l.img) {
        clonedImg = document.createElement('canvas');
        clonedImg.width = canvas.width; clonedImg.height = canvas.height;
        clonedImg.getContext('2d').drawImage(l.img, 0, 0);
    }
    if (l.backupCanvas) {
        clonedBackup = document.createElement('canvas');
        clonedBackup.width = canvas.width; clonedBackup.height = canvas.height;
        clonedBackup.getContext('2d').drawImage(l.backupCanvas, 0, 0);
    }
    return {
        img: clonedImg,
        orig: l.orig || null,
        backupCanvas: clonedBackup,
        x: l.x !== undefined ? l.x : 0,
        y: l.y !== undefined ? l.y : 0,
        scale: l.scale !== undefined ? l.scale : 1,
        visible: l.visible !== undefined ? l.visible : true
    };
}

function cloneCanvas(srcCanvas) {
    let c = document.createElement('canvas');
    c.width = canvas.width; c.height = canvas.height;
    if (srcCanvas && srcCanvas.width > 0 && srcCanvas.height > 0) {
        c.getContext('2d').drawImage(srcCanvas, 0, 0);
    }
    return c;
}

function restoreSnapshot(snapshot) {
    if (!snapshot || !snapshot.layers) return;

    ['bg', 'fg1', 'fg2'].forEach(key => {
        let src = snapshot.layers[key];
        let dest = layers[key];
        if (!src || !dest) return;

        dest.x = src.x;
        dest.y = src.y;
        dest.scale = src.scale;
        dest.visible = src.visible;
        dest.orig = src.orig;

        if (src.img) {
            if (!dest.img) {
                dest.img = document.createElement('canvas');
                dest.img.width = canvas.width; dest.img.height = canvas.height;
            }
            let dCtx = dest.img.getContext('2d');
            dCtx.clearRect(0, 0, canvas.width, canvas.height);
            dCtx.drawImage(src.img, 0, 0);
        } else {
            dest.img = null;
        }

        if (src.backupCanvas) {
            if (!dest.backupCanvas) {
                dest.backupCanvas = document.createElement('canvas');
                dest.backupCanvas.width = canvas.width; dest.backupCanvas.height = canvas.height;
            }
            let bCtx = dest.backupCanvas.getContext('2d');
            bCtx.clearRect(0, 0, canvas.width, canvas.height);
            bCtx.drawImage(src.backupCanvas, 0, 0);
        } else {
            dest.backupCanvas = null;
        }
    });

    if (snapshot.layers.txt) {
        layers.txt = { ...snapshot.layers.txt };
        if (textInput) {
            textInput.value = snapshot.layers.txt.value || "";
            textInput.style.transform = `translate(${layers.txt.x}px, ${layers.txt.y}px)`;
            textInput.style.display = layers.txt.visible ? 'block' : 'none';
        }
    }

    if (snapshot.penLayer && typeof penLayerCtx !== 'undefined') {
        penLayerCtx.clearRect(0, 0, canvas.width, canvas.height);
        penLayerCtx.drawImage(snapshot.penLayer, 0, 0);
    }

    if (snapshot.activeLayerKey) {
        activeLayerKey = snapshot.activeLayerKey;
        if (typeof setActiveLayer === 'function') {
            setActiveLayer(activeLayerKey);
        }
    }
    if (typeof redraw === 'function') redraw();
}

function updateUndoRedoButtons() {
    let btnUndo = document.getElementById('btnUndo');
    let btnRedo = document.getElementById('btnRedo');
    if (btnUndo) btnUndo.disabled = globalUndoStack.length === 0;
    if (btnRedo) btnRedo.disabled = globalRedoStack.length === 0;
}

window.undoAction = function() {
    if (globalUndoStack.length === 0) return;
    let currentSnapshot = {
        layers: {
            bg: cloneLayerData(layers.bg),
            fg1: cloneLayerData(layers.fg1),
            fg2: cloneLayerData(layers.fg2),
            txt: { ...layers.txt, value: textInput ? textInput.value : '' }
        },
        penLayer: cloneCanvas(penLayerCanvas),
        activeLayerKey: activeLayerKey
    };
    globalRedoStack.push(currentSnapshot);

    let previousSnapshot = globalUndoStack.pop();
    restoreSnapshot(previousSnapshot);
    updateUndoRedoButtons();
};

window.redoAction = function() {
    if (globalRedoStack.length === 0) return;
    let currentSnapshot = {
        layers: {
            bg: cloneLayerData(layers.bg),
            fg1: cloneLayerData(layers.fg1),
            fg2: cloneLayerData(layers.fg2),
            txt: { ...layers.txt, value: textInput ? textInput.value : '' }
        },
        penLayer: cloneCanvas(penLayerCanvas),
        activeLayerKey: activeLayerKey
    };
    globalUndoStack.push(currentSnapshot);

    let nextSnapshot = globalRedoStack.pop();
    restoreSnapshot(nextSnapshot);
    updateUndoRedoButtons();
};

// --- AUTOMATIC INTERCEPTORS (No code changes needed in other scripts) ---
window.addEventListener('load', () => {
    // 1. Take initial baseline snapshot
    setTimeout(() => {
        if (globalUndoStack.length === 0) {
            saveStateSnapshot();
        }
    }, 500);

    // 2. Automatically capture snapshot the moment a user starts drawing/interacting on canvas container
    let container = document.getElementById('canvasContainer');
    if (container) {
        let isInteracting = false;
        container.addEventListener('pointerdown', () => {
            if (!isInteracting) {
                saveStateSnapshot();
                isInteracting = true;
            }
        });
        window.addEventListener('pointerup', () => {
            isInteracting = false;
        });
    }

    // 3. Automatically capture snapshot when typing text starts
    if (typeof textInput !== 'undefined' && textInput) {
        textInput.addEventListener('focus', () => {
            saveStateSnapshot();
        }, { once: true }); // triggers once per focus session to avoid spamming
    }
});
</script>

<!-- 6. Image Processing & Layer Operations (High-Resolution Smoothing Fix) -->
<script>
function handleImageUpload(e, layerKey) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(event) {
        const img = new Image();
        img.onload = function() {
            saveStateSnapshot();
            let layerCanvas = document.createElement('canvas');
            layerCanvas.width = canvas.width;
            layerCanvas.height = canvas.height;
            let lCtx = layerCanvas.getContext('2d');

            // --- HIGH-QUALITY RENDERING FIX ---
            lCtx.imageSmoothingEnabled = true;
            lCtx.imageSmoothingQuality = 'high';
            // ----------------------------------

            let hRatio = canvas.width / img.width;
            let vRatio = canvas.height / img.height;
            let scaleRatio = Math.min(hRatio, vRatio);

            let baseW = img.width * scaleRatio;
            let baseH = img.height * scaleRatio;

            let drawX = (canvas.width - baseW) / 2;
            let drawY = (canvas.height - baseH) / 2;
            lCtx.drawImage(img, drawX, drawY, baseW, baseH);

            let backupCanvas = document.createElement('canvas');
            backupCanvas.width = canvas.width;
            backupCanvas.height = canvas.height;
            let bCtx = backupCanvas.getContext('2d');
            
            // Apply smoothing to backup canvas as well
            bCtx.imageSmoothingEnabled = true;
            bCtx.imageSmoothingQuality = 'high';
            bCtx.drawImage(layerCanvas, 0, 0);

            layers[layerKey].orig = img;
            layers[layerKey].img = layerCanvas;
            layers[layerKey].backupCanvas = backupCanvas;
            layers[layerKey].x = 0;
            layers[layerKey].y = 0;
            layers[layerKey].scale = 1;
            layers[layerKey].visible = true;

            setActiveLayer(layerKey);
            closeAllDropdowns();
            updateFlyoutActiveStates();
            updateUndoRedoButtons();
            redraw();
        }
        img.src = event.target.result;
    }
    reader.readAsDataURL(file);
}

function mergeLayerDown(layerKey) {
    let lowerKey = (layerKey === 'fg2') ? 'fg1' : (layerKey === 'fg1' ? 'bg' : null);
    if (!lowerKey) return;

    let upper = layers[layerKey];
    let lower = layers[lowerKey];

    if (!upper.img) {
        alert("No image on this layer to merge.");
        closeAllDropdowns();
        return;
    }

    saveStateSnapshot();
    ensureLayerCanvas(lowerKey);

    let lCtx = lower.img.getContext('2d');
    lCtx.save();
    lCtx.imageSmoothingEnabled = true;
    lCtx.imageSmoothingQuality = 'high';
    lCtx.translate(canvas.width / 2, canvas.height / 2);
    lCtx.scale(upper.scale, upper.scale);
    lCtx.translate(-canvas.width / 2, -canvas.height / 2);
    lCtx.drawImage(upper.img, upper.x, upper.y);
    lCtx.restore();

    if (lower.backupCanvas) {
        let bCtx = lower.backupCanvas.getContext('2d');
        bCtx.imageSmoothingEnabled = true;
        bCtx.imageSmoothingQuality = 'high';
        bCtx.clearRect(0, 0, canvas.width, canvas.height);
        bCtx.drawImage(lower.img, 0, 0);
    }

    upper.img = null;
    upper.orig = null;
    upper.backupCanvas = null;
    upper.x = 0;
    upper.y = 0;
    upper.scale = 1;

    setActiveLayer(lowerKey);
    closeAllDropdowns();
    updateFlyoutActiveStates();
    updateUndoRedoButtons();
    redraw();
}

function resetLayer(layerKey) {
    let l = layers[layerKey];
    if (!l.orig || !l.backupCanvas) return;
    saveStateSnapshot();
    
    let lCtx = l.img.getContext('2d');
    lCtx.imageSmoothingEnabled = true;
    lCtx.imageSmoothingQuality = 'high';
    lCtx.clearRect(0, 0, canvas.width, canvas.height);
    lCtx.drawImage(l.backupCanvas, 0, 0);

    l.x = 0; l.y = 0; l.scale = 1;
    deactivateAllTools();
    closeAllDropdowns();
    updateUndoRedoButtons();
    redraw();
}

function deleteLayer(layerKey) {
    saveStateSnapshot();
    layers[layerKey].img = null;
    layers[layerKey].orig = null;
    layers[layerKey].backupCanvas = null;
    deactivateAllTools();
    closeAllDropdowns();
    updateFlyoutActiveStates();
    updateUndoRedoButtons();
    redraw();
}
</script>
<!-- 7. Drawing Tools, Lasso Cage, & Geometry Helpers -->
<script>
let cagePointCount = 16;

function initPerimeterCage() {
    lassoPoints = [];
    let cx = 180, cy = 180; 
    let radius = 150;       
    
    for (let i = 0; i < cagePointCount; i++) {
        let angle = (i / cagePointCount) * Math.PI * 2;
        let x = cx + radius * Math.cos(angle);
        let y = cy + radius * Math.sin(angle);
        lassoPoints.push({ x: x, y: y });
    }
    isLassoCompleted = true;
}

function addCagePoint() {
    isAddPointActive = true;
    isDeletePointActive = false;
    closeAllDropdowns();
}

function deleteCagePoint() {
    isDeletePointActive = true;
    isAddPointActive = false;
    closeAllDropdowns();
}

function setTool(tool) {
    let wasActive = (currentTool === tool);
    deactivateAllTools();
    if (!wasActive) {
        currentTool = tool;
        if (tool === 'lasso' && lassoPoints.length === 0) {
            initPerimeterCage();
        }
    }
    closeAllDropdowns();
    updateFlyoutActiveStates();
    redraw();
}

function ccw(A, B, C) {
    return (C.y - A.y) * (B.x - A.x) > (B.y - A.y) * (C.x - A.x);
}

function isPointNearSegment(point, a, b, tolerance = 16) {
    const dx = b.x - a.x;
    const dy = b.y - a.y;
    const len2 = dx * dx + dy * dy;
    let t = ((point.x - a.x) * dx + (point.y - a.y) * dy) / len2;
    t = Math.max(0, Math.min(1, t));
    const px = a.x + t * dx;
    const py = a.y + t * dy;
    return Math.hypot(point.x - px, point.y - py) <= tolerance;
}
</script>

<!-- 8. Pointer, Touch, Canvas Events & Polygon Point Tools -->
<script>
function getCanvasCoordinates(e) {
    const rect = canvas.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    return {
        x: (clientX - rect.left) * scaleX,
        y: (clientY - rect.top) * scaleY
    };
}

canvas.addEventListener('wheel', (e) => {
    if (!isScaleEnabled || activeLayerKey === 'txt') return;
    ensureLayerCanvas(activeLayerKey);
    let l = layers[activeLayerKey];

    e.preventDefault();
    let scaleStep = e.deltaY < 0 ? 0.08 : -0.08;
    let newScale = Math.max(0.1, Math.min(10.0, l.scale + scaleStep));
    
    if (newScale !== l.scale) {
        l.scale = newScale;
        redraw();
    }
}, { passive: false });

let lastDrawPos = null;
let hasMoved = false;

canvas.addEventListener('pointerdown', (e) => {
    if (e.pointerType === 'touch') {
        activeTouches.set(e.pointerId, { x: e.clientX, y: e.clientY });
        if (isScaleEnabled && activeTouches.size === 2) {
            let touches = Array.from(activeTouches.values());
            initialPinchDistance = Math.hypot(
                touches[0].x - touches[1].x,
                touches[0].y - touches[1].y
            );

            if (activeLayerKey !== 'txt') {
                ensureLayerCanvas(activeLayerKey);
                initialPinchScale = layers[activeLayerKey].scale;
            }
            return;
        }
    }

    const pos = getCanvasCoordinates(e);

    isDrawing = true;
    dragStartX = pos.x;
    dragStartY = pos.y;
    lastDrawPos = pos;
    hasMoved = false;

    if (activeLayerKey === 'txt') return;

    /*
     * RECTANGLE
     * Existing behavior is unchanged.
     */
    if (currentTool === 'rectangle') {
        saveStateSnapshot();

        shapeBox = {
            x1: pos.x,
            y1: pos.y,
            x2: pos.x,
            y2: pos.y
        };

        circleCenter = null;

    /*
     * CIRCLE
     * The initial pointer position is permanently the CENTER.
     */
    } else if (currentTool === 'circle') {
        saveStateSnapshot();

        circleCenter = {
            x: pos.x,
            y: pos.y
        };

        // Start with a zero-radius circle.
        shapeBox = {
            x1: pos.x,
            y1: pos.y,
            x2: pos.x,
            y2: pos.y
        };

    } else if (currentTool === 'lasso') {
        draggedPointIndex = null;

        for (let i = 0; i < lassoPoints.length; i++) {
            if (Math.hypot(
                pos.x - lassoPoints[i].x,
                pos.y - lassoPoints[i].y
            ) < 16) {
                draggedPointIndex = i;
                break;
            }
        }

        if (isDeletePointActive) {
            if (draggedPointIndex !== null && lassoPoints.length > 4) {
                lassoPoints.splice(draggedPointIndex, 1);
            }

            draggedPointIndex = null;
            redraw();
            return;
        }

        if (
            isAddPointActive &&
            draggedPointIndex === null &&
            lassoPoints.length > 2
        ) {
            for (let i = 0; i < lassoPoints.length; i++) {
                let p1 = lassoPoints[i];
                let p2 = lassoPoints[(i + 1) % lassoPoints.length];

                if (isPointNearSegment(pos, p1, p2, 16)) {
                    lassoPoints.splice(i + 1, 0, {
                        x: pos.x,
                        y: pos.y
                    });
                    break;
                }
            }

            redraw();
            return;
        }

        redraw();
    }
});

canvas.addEventListener('dblclick', () => {
    if (currentTool === 'lasso' && lassoPoints.length > 2) {
        isLassoCompleted = true;
        redraw();
    }
});

canvas.addEventListener('pointermove', (e) => {

    if (activeTouches.has(e.pointerId)) {
        activeTouches.set(e.pointerId, {
            x: e.clientX,
            y: e.clientY
        });

        if (
            isScaleEnabled &&
            activeTouches.size === 2 &&
            initialPinchDistance !== null &&
            activeLayerKey !== 'txt'
        ) {
            let touches = Array.from(activeTouches.values());

            let currentDistance = Math.hypot(
                touches[0].x - touches[1].x,
                touches[0].y - touches[1].y
            );

            let factor = currentDistance / initialPinchDistance;

            ensureLayerCanvas(activeLayerKey);

            let l = layers[activeLayerKey];

            let newScale = Math.max(
                0.1,
                Math.min(10.0, initialPinchScale * factor)
            );

            if (newScale !== l.scale) {
                l.scale = newScale;
                redraw();
            }

            return;
        }
    }

    const pos = getCanvasCoordinates(e);
    currentMousePos = pos;

    if (currentTool === 'lasso') {
        if (draggedPointIndex !== null) {
            lassoPoints[draggedPointIndex] = pos;
            redraw();
            return;
        }

        if (lassoPoints.length > 0 && !isLassoCompleted) {
            redraw();
            return;
        }
    }

    if (!isDrawing) return;

    if (activeLayerKey === 'txt') {
        if (isMoveEnabled) {
            let dx = pos.x - dragStartX;
            let dy = pos.y - dragStartY;

            layers.txt.x += dx;
            layers.txt.y += dy;

            textInput.style.transform =
                `translate(${layers.txt.x}px, ${layers.txt.y}px)`;

            dragStartX = pos.x;
            dragStartY = pos.y;
        }

        return;
    }

    if (
        currentTool === 'pen' ||
        currentTool === 'penEraser' ||
        currentTool === 'eraser' ||
        currentTool === 'squareEraser' ||
        currentTool === 'restore' ||
        currentTool.startsWith('eraser')
    ) {
        let dist = Math.hypot(
            pos.x - lastDrawPos.x,
            pos.y - lastDrawPos.y
        );

        if (!hasMoved && dist > 1.5) {
            hasMoved = true;
            saveStateSnapshot();
        }
    }

    if (
        !hasMoved &&
        (
            currentTool === 'pen' ||
            currentTool === 'penEraser' ||
            currentTool === 'eraser' ||
            currentTool === 'squareEraser' ||
            currentTool === 'restore' ||
            currentTool.startsWith('eraser')
        )
    ) {
        return;
    }

    ensureLayerCanvas(activeLayerKey);
    let l = layers[activeLayerKey];

    if (
        currentTool === 'pen' ||
        currentTool === 'penEraser'
    ) {
        drawPenToLayer(
            lastDrawPos.x,
            lastDrawPos.y,
            pos.x,
            pos.y
        );

        lastDrawPos = pos;

    } else if (
        currentTool === 'eraser' ||
        currentTool === 'squareEraser' ||
        currentTool === 'restore' ||
        currentTool.startsWith('eraser')
    ) {
        if (currentTool === 'restore') {
            restoreAt(pos.x, pos.y);
        } else {
            eraseAt(pos.x, pos.y);
        }

    /*
     * RECTANGLE
     * Original corner-to-corner behavior.
     */
    } else if (
        currentTool === 'rectangle' &&
        shapeBox
    ) {
        shapeBox.x2 = pos.x;
        shapeBox.y2 = pos.y;

    /*
     * CIRCLE
     * The original pointer position remains the CENTER.
     *
     * The radius is the straight-line distance from
     * the center to the current pointer.
     *
     * The bounding box is then created around that center.
     */
    } else if (
        currentTool === 'circle' &&
        shapeBox &&
        circleCenter
    ) {
        let dx = pos.x - circleCenter.x;
        let dy = pos.y - circleCenter.y;

        let radius = Math.hypot(dx, dy);

        shapeBox.x1 = circleCenter.x - radius;
        shapeBox.y1 = circleCenter.y - radius;

        shapeBox.x2 = circleCenter.x + radius;
        shapeBox.y2 = circleCenter.y + radius;

    } else if (isMoveEnabled && l.img) {
        let dx = pos.x - dragStartX;
        let dy = pos.y - dragStartY;

        l.x += dx;
        l.y += dy;

        dragStartX = pos.x;
        dragStartY = pos.y;

    } else if (isScaleEnabled) {
        let dy = pos.y - dragStartY;

        let scaleStep = -dy * 0.015;

        let newScale = Math.max(
            0.1,
            Math.min(10.0, l.scale + scaleStep)
        );

        if (newScale !== l.scale) {
            l.scale = newScale;
        }

        dragStartX = pos.x;
        dragStartY = pos.y;
    }

    redraw();
});

canvas.addEventListener('pointerup', (e) => {
    activeTouches.delete(e.pointerId);

    if (activeTouches.size < 2) {
        initialPinchDistance = null;
    }

    isDrawing = false;
    hasMoved = false;
    draggedPointIndex = null;

    updateUndoRedoButtons();
});

canvas.addEventListener('pointercancel', (e) => {
    activeTouches.delete(e.pointerId);

    initialPinchDistance = null;
    isDrawing = false;
    hasMoved = false;
    draggedPointIndex = null;
});

// Polygon Add/Delete Point Mode Toggles & Checkmark UI
function addCagePoint() {
    isAddPointActive = !isAddPointActive;

    if (isAddPointActive) {
        isDeletePointActive = false;
    }

    updatePointModeUI();
}

function deleteCagePoint() {
    isDeletePointActive = !isDeletePointActive;

    if (isDeletePointActive) {
        isAddPointActive = false;
    }

    updatePointModeUI();
}

function updatePointModeUI() {
    let checkAdd = document.getElementById('checkAdd');
    let checkDelete = document.getElementById('checkDelete');
    let btnAdd = document.getElementById('btnAddPoint');
    let btnDel = document.getElementById('btnDeletePoint');

    if (checkAdd && btnAdd) {
        checkAdd.style.display =
            isAddPointActive ? 'inline' : 'none';

        btnAdd.classList.toggle(
            'active',
            isAddPointActive
        );
    }
    
    if (checkDelete && btnDel) {
        checkDelete.style.display =
            isDeletePointActive ? 'inline' : 'none';

        btnDel.classList.toggle(
            'active',
            isDeletePointActive
        );
    }
}
</script>
<!-- 8A. Selection Center Axes -->
<script>
(() => {
    "use strict";

    function drawSelectionAxes() {
        if (!isDrawing) return;
        if (!shapeBox) return;

        if (currentTool !== "rectangle" && currentTool !== "circle") {
            return;
        }

        const widthSpan = Math.abs(shapeBox.x2 - shapeBox.x1);
        const heightSpan = Math.abs(shapeBox.y2 - shapeBox.y1);

        // Show center axes only when:
        // Circle tool = perfect circle
        // Rectangle tool = perfect square
        const isPerfectShape = Math.abs(widthSpan - heightSpan) <= 1;

        if (!isPerfectShape) {
            return;
        }

        const ctx = canvas.getContext("2d");

        const left = Math.min(shapeBox.x1, shapeBox.x2);
        const right = Math.max(shapeBox.x1, shapeBox.x2);
        const top = Math.min(shapeBox.y1, shapeBox.y2);
        const bottom = Math.max(shapeBox.y1, shapeBox.y2);

        const centerX = (left + right) / 2;
        const centerY = (top + bottom) / 2;

        ctx.save();

        // Match the selection outline exactly
        ctx.strokeStyle = '#0000FF';
        ctx.lineWidth = 2;
        ctx.setLineDash([4, 4]);

        // Horizontal axis
        ctx.beginPath();
        ctx.moveTo(left, centerY);
        ctx.lineTo(right, centerY);
        ctx.stroke();

        // Vertical axis
        ctx.beginPath();
        ctx.moveTo(centerX, top);
        ctx.lineTo(centerX, bottom);
        ctx.stroke();

        ctx.setLineDash([]);
        ctx.restore();
    }

    canvas.addEventListener("pointermove", () => {
        drawSelectionAxes();
    });

    canvas.addEventListener("pointerup", () => {
        if (typeof redraw === "function") {
            redraw();
        }
    });

    canvas.addEventListener("pointercancel", () => {
        if (typeof redraw === "function") {
            redraw();
        }
    });

})();
</script>

<!-- 8B. Selection Grab Handles -->
<script>
(() => {
    "use strict";

    /*
       =========================================================
       SELECTION GRAB HANDLES
       ---------------------------------------------------------
       • Drag a corner handle = resize/stretch selection
       • Circle can become an ellipse
       • Drag inside selection = move entire selection
       • Does not replace the existing selection creation logic
       =========================================================
    */

const HANDLE_SIZE = 8;
const HANDLE_HIT = 14;

    let handleMode = null;
    let handlePointerId = null;
    let handleStartX = 0;
    let handleStartY = 0;
    let handleStartBox = null;

    /* ---------------------------------------------------------
       HANDLE OVERLAY
       --------------------------------------------------------- */

    const overlay = document.createElement("canvas");

    overlay.width = canvas.width;
    overlay.height = canvas.height;

    overlay.style.position = "absolute";
    overlay.style.left = "0";
    overlay.style.top = "0";
    overlay.style.width = "100%";
    overlay.style.height = "100%";
    overlay.style.pointerEvents = "none";
    overlay.style.zIndex = "20";

    const canvasContainer = canvas.parentElement;

    if (canvasContainer) {
        const containerStyle = getComputedStyle(canvasContainer);

        if (containerStyle.position === "static") {
            canvasContainer.style.position = "relative";
        }

        canvasContainer.appendChild(overlay);
    }

    const handleCtx = overlay.getContext("2d");

    /* ---------------------------------------------------------
       COORDINATES
       --------------------------------------------------------- */

    function getSelectionCoordinates(e) {
        const rect = canvas.getBoundingClientRect();

        return {
            x: (e.clientX - rect.left) * (canvas.width / rect.width),
            y: (e.clientY - rect.top) * (canvas.height / rect.height)
        };
    }

    /* ---------------------------------------------------------
       SELECTION BOX
       --------------------------------------------------------- */

    function getBox() {
        if (!shapeBox) return null;

        return {
            left: Math.min(shapeBox.x1, shapeBox.x2),
            right: Math.max(shapeBox.x1, shapeBox.x2),
            top: Math.min(shapeBox.y1, shapeBox.y2),
            bottom: Math.max(shapeBox.y1, shapeBox.y2)
        };
    }

    /* ---------------------------------------------------------
       HANDLE POSITIONS
       --------------------------------------------------------- */

    function getHandles() {
        const box = getBox();

        if (!box) return [];

        return [
            { name: "nw", x: box.left,  y: box.top },
            { name: "ne", x: box.right, y: box.top },
            { name: "sw", x: box.left,  y: box.bottom },
            { name: "se", x: box.right, y: box.bottom }
        ];
    }

    function getHandleAt(pos) {
        const handles = getHandles();

        for (const h of handles) {
            if (
                Math.abs(pos.x - h.x) <= HANDLE_HIT &&
                Math.abs(pos.y - h.y) <= HANDLE_HIT
            ) {
                return h.name;
            }
        }

        return null;
    }

    function pointInsideSelection(pos) {
        const box = getBox();

        if (!box) return false;

        return (
            pos.x >= box.left &&
            pos.x <= box.right &&
            pos.y >= box.top &&
            pos.y <= box.bottom
        );
    }

    /* ---------------------------------------------------------
       DRAW HANDLES
       --------------------------------------------------------- */

    function drawHandles() {
        handleCtx.clearRect(
            0,
            0,
            overlay.width,
            overlay.height
        );

        if (!shapeBox) return;

        if (
            currentTool !== "rectangle" &&
            currentTool !== "circle"
        ) {
            return;
        }

        const handles = getHandles();

        if (!handles.length) return;

        handleCtx.save();

        handleCtx.fillStyle = "#FFFFFF";
        handleCtx.strokeStyle = "#0000FF";
        handleCtx.lineWidth = 2;
        handleCtx.setLineDash([]);

        const half = HANDLE_SIZE / 2;

        handles.forEach(h => {
            handleCtx.beginPath();
            handleCtx.rect(
                h.x - half,
                h.y - half,
                HANDLE_SIZE,
                HANDLE_SIZE
            );
            handleCtx.fill();
            handleCtx.stroke();
        });

        handleCtx.restore();
    }

    /* ---------------------------------------------------------
       KEEP OVERLAY UPDATED
       --------------------------------------------------------- */

    function updateOverlaySize() {
        const rect = canvas.getBoundingClientRect();

        overlay.width = canvas.width;
        overlay.height = canvas.height;

        overlay.style.width = rect.width + "px";
        overlay.style.height = rect.height + "px";
    }

    window.addEventListener("resize", updateOverlaySize);

    function handleOverlayLoop() {
        updateOverlaySize();
        drawHandles();
        requestAnimationFrame(handleOverlayLoop);
    }

    handleOverlayLoop();

    /* ---------------------------------------------------------
       POINTER DOWN
       --------------------------------------------------------- */

    canvas.addEventListener("pointerdown", e => {

        if (
            currentTool !== "rectangle" &&
            currentTool !== "circle"
        ) {
            return;
        }

        if (!shapeBox) return;

        const pos = getSelectionCoordinates(e);

        /* -----------------------------------------------------
           CORNER HANDLE
           ----------------------------------------------------- */

        const handle = getHandleAt(pos);

        if (handle) {

            handleMode = handle;
            handlePointerId = e.pointerId;

            handleStartX = pos.x;
            handleStartY = pos.y;

            handleStartBox = {
                x1: shapeBox.x1,
                y1: shapeBox.y1,
                x2: shapeBox.x2,
                y2: shapeBox.y2
            };

            isDrawing = true;

            e.preventDefault();
            e.stopImmediatePropagation();

            try {
                canvas.setPointerCapture(e.pointerId);
            } catch (_) {}

            return;
        }

        /* -----------------------------------------------------
           INSIDE SELECTION = MOVE
           ----------------------------------------------------- */

        if (pointInsideSelection(pos)) {

            handleMode = "move";
            handlePointerId = e.pointerId;

            handleStartX = pos.x;
            handleStartY = pos.y;

            handleStartBox = {
                x1: shapeBox.x1,
                y1: shapeBox.y1,
                x2: shapeBox.x2,
                y2: shapeBox.y2
            };

            isDrawing = true;

            e.preventDefault();
            e.stopImmediatePropagation();

            try {
                canvas.setPointerCapture(e.pointerId);
            } catch (_) {}

            return;
        }

    }, true);


    /* ---------------------------------------------------------
       POINTER MOVE
       --------------------------------------------------------- */

    canvas.addEventListener("pointermove", e => {

        if (handlePointerId !== e.pointerId) {
            return;
        }

        if (!handleMode || !handleStartBox) {
            return;
        }

        /*
           IMPORTANT:
           Stop the original Section 8 pointermove handler from
           changing shapeBox while the handle system is active.
        */
        e.preventDefault();
        e.stopImmediatePropagation();

        const pos = getSelectionCoordinates(e);

        const dx = pos.x - handleStartX;
        const dy = pos.y - handleStartY;

        const start = handleStartBox;

        /* -----------------------------------------------------
           MOVE ENTIRE SELECTION
           ----------------------------------------------------- */

        if (handleMode === "move") {

            shapeBox.x1 = start.x1 + dx;
            shapeBox.x2 = start.x2 + dx;

            shapeBox.y1 = start.y1 + dy;
            shapeBox.y2 = start.y2 + dy;

            redraw();
            return;
        }

        /* -----------------------------------------------------
           RESIZE FROM CORNER
           ----------------------------------------------------- */

        if (handleMode === "nw") {

            shapeBox.x1 = start.x1 + dx;
            shapeBox.y1 = start.y1 + dy;

        } else if (handleMode === "ne") {

            shapeBox.x2 = start.x2 + dx;
            shapeBox.y1 = start.y1 + dy;

        } else if (handleMode === "sw") {

            shapeBox.x1 = start.x1 + dx;
            shapeBox.y2 = start.y2 + dy;

        } else if (handleMode === "se") {

            shapeBox.x2 = start.x2 + dx;
            shapeBox.y2 = start.y2 + dy;
        }

        /*
           Circle selections are intentionally allowed to change
           width and height independently.

           Therefore:
             circle → ellipse
             ellipse → wider/taller ellipse
        */

        redraw();

    }, true);


    /* ---------------------------------------------------------
       POINTER UP
       --------------------------------------------------------- */

    function finishHandleDrag(e) {

        if (handlePointerId !== e.pointerId) {
            return;
        }

        e.preventDefault();
        e.stopImmediatePropagation();

        handleMode = null;
        handlePointerId = null;
        handleStartBox = null;

        isDrawing = false;

        if (typeof redraw === "function") {
            redraw();
        }

        try {
            canvas.releasePointerCapture(e.pointerId);
        } catch (_) {}
    }

    canvas.addEventListener("pointerup", finishHandleDrag, true);
    canvas.addEventListener("pointercancel", finishHandleDrag, true);

})();
</script>
<!-- 9. Height-Locked Proportional Crop to Selection Action -->
<script>
function cropToRectangle() {
    if (activeLayerKey === 'txt' || !layers[activeLayerKey] || !layers[activeLayerKey].img) {
        alert("Please select a valid image layer first.");
        return;
    }
    
    if (!shapeBox) {
        alert("Please draw a rectangle using the Rectangle Tool first.");
        return;
    }

    let rx = Math.min(shapeBox.x1, shapeBox.x2);
    let ry = Math.min(shapeBox.y1, shapeBox.y2);
    let rw = Math.abs(shapeBox.x2 - shapeBox.x1);
    let rh = Math.abs(shapeBox.y2 - shapeBox.y1);

    if (rw < 5 || rh < 5) {
        alert("Selection box is too small to crop.");
        return;
    }

    ensureLayerCanvas(activeLayerKey);
    let l = layers[activeLayerKey];
    let lCtx = l.img.getContext('2d');

    // Save state for Undo/Redo
    saveStateSnapshot();

    // Copy current layer state to a temporary canvas
    let temp = document.createElement('canvas');
    temp.width = canvas.width;
    temp.height = canvas.height;
    let tCtx = temp.getContext('2d');
    tCtx.drawImage(l.img, 0, 0);

    // Lock scale strictly to height (top-to-bottom canvas fill)
    let scale = canvas.height / rh;
    let destW = rw * scale;
    let destH = canvas.height;
    let destX = (canvas.width - destW) / 2; // Centered horizontally (can be shifted with Move tool)
    let destY = 0;

    // Clear and draw proportionally
    lCtx.clearRect(0, 0, canvas.width, canvas.height);
    lCtx.drawImage(temp, rx, ry, rw, rh, destX, destY, destW, destH);
    
    // Reset layer position/scale so it starts clean at default coordinates
    l.x = 0; 
    l.y = 0; 
    l.scale = 1;

    shapeBox = null;
    redraw();
    updateUndoRedoButtons();
}
</script>

<!-- 10. Pen Drawing & Advanced Eraser Engine (Layer-Bound) -->
<script>
function drawPenToLayer(x1, y1, x2, y2) {
    ensureLayerCanvas(activeLayerKey);
    let l = layers[activeLayerKey];
    let lCtx = l.img.getContext('2d');
    
    lCtx.save();
    
    if (currentTool === 'penEraser') {
        lCtx.globalCompositeOperation = 'destination-out';
        lCtx.strokeStyle = 'rgba(0, 0, 0, 1)';
        lCtx.lineWidth = stylusSize * 2;
        lCtx.lineCap = 'round';
        lCtx.lineJoin = 'round';
        lCtx.beginPath();
        lCtx.moveTo(x1, y1);
        lCtx.lineTo(x2, y2);
        lCtx.stroke();
    } else {
        lCtx.globalCompositeOperation = 'source-over';
        lCtx.strokeStyle = stylusColor;
        lCtx.lineWidth = stylusSize;
        lCtx.lineCap = 'round';
        lCtx.lineJoin = 'round';
        lCtx.beginPath();
        lCtx.moveTo(x1, y1);
        lCtx.lineTo(x2, y2);
        lCtx.stroke();
    }
    
    lCtx.restore();
    redraw();
}

function eraseAt(x, y) {
    ensureLayerCanvas(activeLayerKey);
    let l = layers[activeLayerKey];
    let lCtx = l.img.getContext('2d');
    lCtx.save();
    lCtx.globalCompositeOperation = 'destination-out';
    lCtx.beginPath();

    if (currentTool === 'eraser') {
        let radius = 12;
        let grad = lCtx.createRadialGradient(x, y, 0, x, y, radius);
        grad.addColorStop(0, 'rgba(0, 0, 0, 1)');
        grad.addColorStop(0.5, 'rgba(0, 0, 0, 0.8)');
        grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
        lCtx.fillStyle = grad;
        lCtx.beginPath();
        lCtx.arc(x, y, radius, 0, Math.PI * 2);
        lCtx.fill();
    } else if (currentTool === 'squareEraser') {
        let size = 22;
        let tempCanvas = document.createElement('canvas');
        tempCanvas.width = canvas.width;
        tempCanvas.height = canvas.height;
        let tCtx = tempCanvas.getContext('2d');
        
        tCtx.save();
        tCtx.fillStyle = 'rgba(0, 0, 0, 1)';
        tCtx.fillRect(x - size / 2, y - size / 2, size, size);
        tCtx.restore();

        lCtx.save();
        lCtx.filter = 'blur(1px)';
        lCtx.drawImage(tempCanvas, 0, 0);
        lCtx.restore();
    } else if (currentTool.startsWith('eraser')) {
        let dir = currentTool.replace('eraser', '');
        let length = 30; 
        let halfWidth = 4; 
        
        let tempCanvas = document.createElement('canvas');
        tempCanvas.width = canvas.width;
        tempCanvas.height = canvas.height;
        let tCtx = tempCanvas.getContext('2d');
        
        tCtx.save();
        tCtx.translate(x, y);
        
        switch(dir) {
            case 'N': tCtx.rotate(0); break;
            case 'NE': tCtx.rotate(Math.PI / 4); break;
            case 'E': tCtx.rotate(Math.PI / 2); break;
            case 'SE': tCtx.rotate(3 * Math.PI / 4); break;
            case 'S': tCtx.rotate(Math.PI); break;
            case 'SW': tCtx.rotate(5 * Math.PI / 4); break;
            case 'W': tCtx.rotate(3 * Math.PI / 2); break;
            case 'NW': tCtx.rotate(7 * Math.PI / 4); break;
        }
        
        tCtx.beginPath();
        tCtx.moveTo(0, 0);
        tCtx.lineTo(halfWidth, length);
        tCtx.lineTo(-halfWidth, length);
        tCtx.closePath();

        let wedgeGrad = tCtx.createLinearGradient(0, 0, 0, length);
        wedgeGrad.addColorStop(0, 'rgba(0, 0, 0, 0)');
        wedgeGrad.addColorStop(0.4, 'rgba(0, 0, 0, 0.5)');
        wedgeGrad.addColorStop(0.6, 'rgba(0, 0, 0, 1)');
        wedgeGrad.addColorStop(1, 'rgba(0, 0, 0, 1)');
        
        tCtx.fillStyle = wedgeGrad;
        tCtx.fill();
        tCtx.restore();

        lCtx.save();
        lCtx.filter = 'blur(1.5px)';
        lCtx.drawImage(tempCanvas, 0, 0);
        lCtx.restore();
    }
    
    lCtx.restore();
    redraw();
}
</script>

<!-- 11. Restoration & Selection Execution Tools -->
<script>
function restoreAt(x, y) {
    ensureLayerCanvas(activeLayerKey);
    let l = layers[activeLayerKey];
    if (!l.backupCanvas) return;
    let lCtx = l.img.getContext('2d');
    lCtx.save();
    lCtx.globalCompositeOperation = 'source-over';
    
    let grad = lCtx.createRadialGradient(x, y, 3, x, y, 7.5);
    grad.addColorStop(0, 'rgba(0, 0, 0, 1)');
    grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
    
    lCtx.beginPath();
    lCtx.arc(x, y, 7.5, 0, Math.PI * 2);
    lCtx.fillStyle = grad;
    lCtx.fill();
    
    lCtx.globalCompositeOperation = 'source-in';
    lCtx.drawImage(l.backupCanvas, 0, 0);
    lCtx.restore();
    redraw();
}

function executeSelection(mode) {
    ensureLayerCanvas(activeLayerKey);
    let l = layers[activeLayerKey];
    
    let hasSelection = false;
    if (currentTool === 'rectangle' || currentTool === 'circle') {
        hasSelection = (shapeBox !== null);
    } else if (currentTool === 'lasso') {
        hasSelection = (lassoPoints.length > 2);
    }

    if (!hasSelection) return;

    saveStateSnapshot();
    let lCtx = l.img.getContext('2d');
    lCtx.save();

    let mask = document.createElement('canvas');
    mask.width = canvas.width;
    mask.height = canvas.height;
    let mCtx = mask.getContext('2d');
    
    mCtx.fillStyle = '#ffffff';
    mCtx.beginPath();

    if (currentTool === 'rectangle' && shapeBox) {
        let rx = Math.min(shapeBox.x1, shapeBox.x2);
        let ry = Math.min(shapeBox.y1, shapeBox.y2);
        let rw = Math.abs(shapeBox.x2 - shapeBox.x1);
        let rh = Math.abs(shapeBox.y2 - shapeBox.y1);
        mCtx.rect(rx, ry, rw, rh);
    } else if (currentTool === 'circle' && shapeBox) {
        let rw = Math.abs(shapeBox.x2 - shapeBox.x1);
        let rh = Math.abs(shapeBox.y2 - shapeBox.y1);
        let cx = (shapeBox.x1 + shapeBox.x2) / 2;
        let cy = (shapeBox.y1 + shapeBox.y2) / 2;
        mCtx.ellipse(cx, cy, rw / 2, rh / 2, 0, 0, Math.PI * 2);
    } else if (currentTool === 'lasso' && lassoPoints.length > 2) {
        mCtx.moveTo(lassoPoints[0].x, lassoPoints[0].y);
        for (let i = 1; i < lassoPoints.length; i++) {
            mCtx.lineTo(lassoPoints[i].x, lassoPoints[i].y);
        }
        mCtx.closePath();
    }
    mCtx.fill();

    let blurredMask = document.createElement('canvas');
    blurredMask.width = canvas.width;
    blurredMask.height = canvas.height;
    let bCtx = blurredMask.getContext('2d');
    bCtx.filter = 'blur(4px)';
    bCtx.drawImage(mask, 0, 0);

    if (mode === 'interior') {
        lCtx.globalCompositeOperation = 'destination-out';
        lCtx.drawImage(blurredMask, 0, 0);
    } else {
        lCtx.globalCompositeOperation = 'destination-in';
        lCtx.drawImage(blurredMask, 0, 0);
    }

    lCtx.restore();
    shapeBox = null;
    lassoPoints = [];
    isLassoCompleted = false;
    deactivateAllTools();
    redraw();
    updateUndoRedoButtons();
}
</script>
<!-- 11. Restoration & Selection Execution Tools -->
<script>
function restoreAt(x, y) {
    ensureLayerCanvas(activeLayerKey);
    let l = layers[activeLayerKey];
    if (!l.backupCanvas) return;
    
    let lCtx = l.img.getContext('2d');
    lCtx.save();
    
    // Create a temporary brush mask canvas to isolate the stroke
    let brushMask = document.createElement('canvas');
    brushMask.width = canvas.width;
    brushMask.height = canvas.height;
    let bCtx = brushMask.getContext('2d');
    
    let radius = 12; // Match your intended size consistency
    let grad = bCtx.createRadialGradient(x, y, 1, x, y, radius);
    grad.addColorStop(0, 'rgba(0, 0, 1, 1)');
    grad.addColorStop(1, 'rgba(0, 0, 1, 0)');
    
    bCtx.fillStyle = grad;
    bCtx.beginPath();
    bCtx.arc(x, y, radius, 0, Math.PI * 2);
    bCtx.fill();
    
    // Draw only the backup pixels onto the active layer through the brush mask
    lCtx.globalCompositeOperation = 'source-over';
    
    // Use an intermediate composite trick to paint only the backup pixels within the brush area
    let tempLayerCopy = document.createElement('canvas');
    tempLayerCopy.width = canvas.width;
    tempLayerCopy.height = canvas.height;
    let tCtx = tempLayerCopy.getContext('2d');
    
    // 1. Draw backup image
    tCtx.drawImage(l.backupCanvas, 0, 0);
    // 2. Clip/mask using the brush gradient
    tCtx.globalCompositeOperation = 'destination-in';
    tCtx.drawImage(brushMask, 0, 0);
    
    // 3. Stamp back onto the main layer context cleanly
    lCtx.drawImage(tempLayerCopy, 0, 0);
    
    lCtx.restore();
    redraw();
}
</script>
<!-- 12. Canvas Redraw Engine -->
<script>
function redraw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ['bg', 'fg1', 'fg2'].forEach(key => {
        let l = layers[key];
        if (l.visible && l.img) {
            ctx.save();
            ctx.translate(canvas.width / 2, canvas.height / 2);
            ctx.scale(l.scale, l.scale);
            ctx.translate(-canvas.width / 2, -canvas.height / 2);
            ctx.drawImage(l.img, l.x, l.y);
            ctx.restore();
        }
    });

    ctx.drawImage(penLayerCanvas, 0, 0);

    if (shapeBox) {
        let widthSpan = Math.abs(shapeBox.x2 - shapeBox.x1);
        let heightSpan = Math.abs(shapeBox.y2 - shapeBox.y1);
        let rx = Math.min(shapeBox.x1, shapeBox.x2);
        let ry = Math.min(shapeBox.y1, shapeBox.y2);

        if (widthSpan > 4 && heightSpan > 4) {
            ctx.strokeStyle = '#0000FF'; 
            ctx.lineWidth = 2;
            ctx.setLineDash([4, 4]);

            if (currentTool === 'rectangle') {
                ctx.strokeRect(rx, ry, widthSpan, heightSpan);
            } else if (currentTool === 'circle') {
                let cx = (shapeBox.x1 + shapeBox.x2) / 2;
                let cy = (shapeBox.y1 + shapeBox.y2) / 2;
                let rxRadius = widthSpan / 2;
                let ryRadius = heightSpan / 2;
                ctx.beginPath();
                ctx.ellipse(cx, cy, rxRadius, ryRadius, 0, 0, Math.PI * 2);
                ctx.stroke();
            }
            ctx.setLineDash([]);
        }
    }

    if (currentTool === 'lasso' && lassoPoints.length > 0) {
        ctx.setLineDash([4, 4]);
        ctx.lineDashOffset = dashOffset;
        
        ctx.strokeStyle = '#000000';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(lassoPoints[0].x, lassoPoints[0].y);
        for (let i = 1; i < lassoPoints.length; i++) {
            ctx.lineTo(lassoPoints[i].x, lassoPoints[i].y);
        }
        ctx.closePath();
        ctx.stroke();

        ctx.strokeStyle = '#00FFFF';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        ctx.setLineDash([]);
        ctx.lineDashOffset = 0;

        for (let i = 0; i < lassoPoints.length; i++) {
            ctx.fillStyle = '#000000';
            ctx.beginPath();
            ctx.arc(lassoPoints[i].x, lassoPoints[i].y, 4, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#00FFFF';
            ctx.beginPath();
            ctx.arc(lassoPoints[i].x, lassoPoints[i].y, 2.5, 0, Math.PI * 2);
            ctx.fill();
        }
    }
}
</script>

<!-- 13. Undo / Redo History Management Engine (Single-Click Responsive) -->
<script>
let undoStack = [];
let redoStack = [];
const MAX_HISTORY = 20;

function cloneCanvas(srcCanvas) {
    let c = document.createElement('canvas');
    c.width = canvas.width; 
    c.height = canvas.height;
    if (srcCanvas && (srcCanvas.width > 0 || srcCanvas.height > 0)) {
        try {
            c.getContext('2d').drawImage(srcCanvas, 0, 0);
        } catch (e) {
            console.warn("Canvas clone error", e);
        }
    }
    return c;
}

function captureCurrentState() {
    let state = {
        layers: {},
        penLayer: cloneCanvas(penLayerCanvas)
    };
    ['bg', 'fg1', 'fg2'].forEach(key => {
        let l = layers[key];
        if (l) {
            state.layers[key] = {
                img: l.img ? cloneCanvas(l.img) : null,
                x: l.x,
                y: l.y,
                scale: l.scale,
                visible: l.visible
            };
        }
    });
    return state;
}

function saveStateSnapshot() {
    let currentState = captureCurrentState();
    undoStack.push(currentState);
    
    if (undoStack.length > MAX_HISTORY) {
        undoStack.shift();
    }
    
    // Clear redo stack on any new action
    redoStack = [];
    updateUndoRedoButtons();
}

function undo() {
    if (undoStack.length === 0) return;

    // 1. Capture current modified state and push to redo stack
    let currentState = captureCurrentState();
    redoStack.push(currentState);

    // 2. Pop the previous state from undo stack and restore it
    let prevState = undoStack.pop();
    restoreState(prevState);

    deactivateAllTools();
    redraw();
    updateUndoRedoButtons();
}

function redo() {
    if (redoStack.length === 0) return;

    // 1. Capture current state and push back to undo stack
    let currentState = captureCurrentState();
    undoStack.push(currentState);

    // 2. Pop next state from redo stack and restore it
    let nextState = redoStack.pop();
    restoreState(nextState);

    deactivateAllTools();
    redraw();
    updateUndoRedoButtons();
}

// Global aliases for safety
window.undoAction = undo;
window.redoAction = redo;

function restoreState(stateObj) {
    if (!stateObj) return;

    if (stateObj.layers) {
        Object.keys(stateObj.layers).forEach(key => {
            if (layers[key] && stateObj.layers[key]) {
                let saved = stateObj.layers[key];
                let l = layers[key];
                
                l.x = saved.x;
                l.y = saved.y;
