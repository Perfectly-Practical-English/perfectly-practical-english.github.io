<script>
  (function () {
    'use strict';
    
    // 1. Inject CSS for snug top layout and 2-line initial height
    const styleId = 'snug-tele-tweak-style';
    if (!document.getElementById(styleId)) {
      const style = document.createElement('style');
      style.id = styleId;
      style.innerHTML = `
        body, html {
          margin-top: 0 !important;
          padding-top: 2px !important;
        }
        #gsMain, .tele-wrapper {
          margin-top: 2px !important;
          margin-bottom: 2px !important;
          min-height: 36px !important; /* Exactly ~2 lines tall */
          height: auto;
          max-height: 70vh;
          transition: height 0.3s ease;
        }
        #teleScrollWrapper {
          overflow-y: auto;
          overflow-x: hidden;
          -webkit-overflow-scrolling: touch;
          flex-grow: 1;
          min-height: 0;
          min-width: 0;
          position: relative;
          scrollbar-width: none;
        }
      `;
      document.head.appendChild(style);
    }

    // 2. Auto-resize logic for typing and section loading
    function initAutoResize() {
      const teleEdit = document.getElementById('teleEdit');
      const gsMain = document.getElementById('gsMain');
      const teleWrapper = document.getElementById('teleWrapper');

      if (!teleEdit || !gsMain || !teleWrapper) return;

      const minH = 36; // 2 lines tall
      const maxH = Math.floor(window.innerHeight * 0.7);

      function computeAndApplyHeight() {
        const contentHeight = teleEdit.scrollHeight;
        const targetHeight = (teleEdit.innerText.trim() === '') 
          ? minH 
          : Math.min(Math.max(contentHeight, minH), maxH);

        gsMain.style.height = targetHeight + 'px';
        teleWrapper.style.height = targetHeight + 'px';
      }

      // Initial check on load
      computeAndApplyHeight();

      // Watch for section loading (DOM/text changes) and typing
      const observer = new MutationObserver(computeAndApplyHeight);
      observer.observe(teleEdit, { childList: true, subtree: true, characterData: true });
      
      teleEdit.addEventListener('input', computeAndApplyHeight);
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initAutoResize);
    } else {
      initAutoResize();
    }
  })();
</script>
