<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  body, html { margin: 0; padding: 0; width: 200px; height: 200px; overflow: hidden; background: #e8d3bc; position: relative; font-family: Arial, sans-serif; }

  .banner {
    position: absolute;
    top: 10px; left: 50%;
    transform: translateX(-50%);
    color: #6a4200;
    font-size: 14px;
    font-weight: 800;
    z-index: 20;
    pointer-events: none;
    letter-spacing: 0.8px;
    text-shadow: 0 1px 3px rgba(255,255,255,0.9);
    white-space: nowrap;
  }

  /* Bomber plane path */
  #plane { 
    position: absolute; 
    top: 95px; 
    left: 62px; 
    width: 76px; 
    transform: rotate(-90deg); 
    z-index: 3; 
    animation: planeSway 3.5s ease-in-out infinite alternate; 
  }

  /* Slow falling sentence synchronized with the bomber pass */
  .sentence { 
    position: absolute; 
    font-size: 11px; 
    font-weight: bold; 
    color: #111; 
    text-shadow: 0 0 3px rgba(255,255,255,0.9); 
    z-index: 2; 
    white-space: nowrap; 
    animation: dropExercise 6.5s linear infinite; 
  }

  .blank { 
    display: inline-block; 
    border-bottom: 2px solid #000; 
    min-width: 26px; 
    text-align: center; 
    color: #d9534f; 
    font-weight: bold; 
  }

  .pixel-shard {
    position: absolute;
    width: 7px; height: 7px;
    border-radius: 50%;
    pointer-events: none;
    z-index: 5;
    animation: shardFly 0.7s ease-out forwards;
  }

  @keyframes shardFly {
    0% { transform: translate(0, 0) scale(1); opacity: 1; }
    100% { transform: translate(var(--vx), var(--vy)) scale(0.1); opacity: 0; }
  }

  @keyframes dropExercise {
    0% { top: 30px; left: 14px; opacity: 0; }
    12% { opacity: 1; }
    48% { top: 145px; left: 14px; }
    54% { opacity: 0; }
    100% { top: 230px; opacity: 0; }
  }

  @keyframes planeSway {
    0% { transform: rotate(-90deg) translateX(0); }
    100% { transform: rotate(-90deg) translateX(8px); }
  }
</style>
</head>
<body>
  <div class="banner">Grammar Bomber</div>
  <img id="plane" src="B52.png" alt="B-52">
  
  <div class="sentence" id="execSentence">
    I like to <span class="blank" id="blankWord"></span> pizza.
  </div>

  <script>
    const blankWord = document.getElementById('blankWord');
    
    function runSimulation() {
      // "eat" appears instantly without typing simulation
      blankWord.textContent = "eat";

      setTimeout(() => {
        const startX = 95;
        const startY = 152; /* Explosion target timed precisely as the bomber passes */
        
        document.getElementById('execSentence').style.display = 'none';

        const shardColors = ['#ff4500', '#ffea00', '#ff0000', '#ffffff', '#ff8800', '#ff3300'];
        for (let i = 0; i < 36; i++) {
          const shard = document.createElement('div');
          shard.className = 'pixel-shard';
          shard.style.left = startX + 'px';
          shard.style.top = startY + 'px';
          shard.style.background = shardColors[Math.floor(Math.random() * shardColors.length)];
          
          const angle = Math.random() * Math.PI * 2;
          const speed = 50 + Math.random() * 140;
          shard.style.setProperty('--vx', (Math.cos(angle) * speed) + 'px');
          shard.style.setProperty('--vy', (Math.sin(angle) * speed) + 'px');
          
          document.body.appendChild(shard);
          setTimeout(() => shard.remove(), 700);
        }

        setTimeout(() => {
          const sentenceEl = document.getElementById('execSentence');
          sentenceEl.style.display = 'block';
        }, 2500);

      }, 3150);
    }

    runSimulation();
    setInterval(runSimulation, 6500);
  </script>
</body>
</html>
