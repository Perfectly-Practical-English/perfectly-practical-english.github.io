    const modal = document.getElementById('pAnswerModal');
    const toggleArrow = document.getElementById('pToggleArrow');
    const centerWrapper = document.getElementById('pCenterWrapper');
    const squareClearBtn = document.getElementById('pSquareClearBtn');
    const grabDot = document.getElementById('pGrabDot');

    toggleArrow.addEventListener('click', (e) => {
        e.stopPropagation();
        if (toggleArrow.textContent.includes('◄')) {
            toggleArrow.textContent = '►';
            toggleArrow.style.marginLeft = '4px';
            toggleArrow.style.marginRight = '0';
            modal.insertBefore(grabDot, modal.firstChild);
            modal.insertBefore(squareClearBtn, centerWrapper);
            modal.appendChild(toggleArrow);
        } else {
            toggleArrow.textContent = '◄';
            toggleArrow.style.marginLeft = '0';
            toggleArrow.style.marginRight = '4px';
            modal.insertBefore(toggleArrow, modal.firstChild);
            modal.appendChild(squareClearBtn);
            modal.appendChild(grabDot);
        }
    });

    document.addEventListener('click', (e) => {
        if (e.target.matches('#clearBtn, .clear-btn, [id*="clear"], [class*="clear"]')) {
            if (modal) modal.style.display = 'none';
            pAnswers = [];
            currentIndex = 0;
        }
    });

    let isDragging = false, startX, startY;

    function startDrag(clientX, clientY, target) {
        if (target.tagName === 'BUTTON' || target.tagName === 'TEXTAREA') return;
        isDragging = true;
        startX = clientX - modal.offsetLeft;
        startY = clientY - modal.offsetTop;
    }

    function onDrag(clientX, clientY) {
        if (!isDragging) return;
        modal.style.left = `${clientX - startX}px`;
        modal.style.top = `${clientY - startY}px`;
    }

    function stopDrag() {
        isDragging = false;
    }

    modal.addEventListener('mousedown', (e) => {
        startDrag(e.clientX, e.clientY, e.target);
    });
    document.addEventListener('mousemove', (e) => onDrag(e.clientX, e.clientY));
    document.addEventListener('mouseup', stopDrag);

    modal.addEventListener('touchstart', (e) => {
        if (e.target.tagName === 'BUTTON' || e.target.tagName === 'TEXTAREA') return;
        if (e.touches.length === 1) {
            startDrag(e.touches[0].clientX, e.touches[0].clientY, e.target);
            e.preventDefault();
        }
    }, { passive: false });

    document.addEventListener('touchmove', (e) => {
        if (isDragging && e.touches.length === 1) {
            onDrag(e.touches[0].clientX, e.touches[0].clientY);
            e.preventDefault();
        }
    }, { passive: false });

    document.addEventListener('touchend', stopDrag);

    window.addEventListener('keydown', (e) => {
        if (e.key === 'Delete' || e.key === 'Backspace') {
            if (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'TEXTAREA') return;
            if (modal && getComputedStyle(modal).display !== 'none') {
                modal.style.display = 'none';
                pAnswers = [];
                currentIndex = 0;
            }
        }
    });
})();
</script>

<script>

/* =====================================
   DOWNLOAD SCRIPT TXT (WITH UPLOAD TRACKING)
===================================== */

(function(){

const btn = document.getElementById("downloadTxtBtn");
const field = document.getElementById("worksheetScript");
const txtLoader = document.getElementById("txtLoader");

// Track the filename whenever a file is selected via the "Browse" button
if (txtLoader) {
    txtLoader.addEventListener("change", function(){
        const file = this.files[0];
        if (file) {
            window.lastUploadedFilename = file.name;
        }
    });
}

if(!btn || !field) return;

btn.onclick = function(){
    const blob = new Blob(
        [field.value],
        {type:"text/plain;charset=utf-8"}
    );

    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);

    // Generate International Date (YYYY-MM-DD) and Military Time (HHMM)
    const now = new Date();
    const year = now.getFullYear();
    const month = String(now.getMonth() + 1).padStart(2, "0");
    const day = String(now.getDate()).padStart(2, "0");
    const internationalDate = `${year}-${month}-${day}`;

    const hours = String(now.getHours()).padStart(2, "0");
    const minutes = String(now.getMinutes()).padStart(2, "0");
    const militaryTime = `${hours}${minutes}`;

    // Determine the base name from the browsed file, or fallback to "Worksheet"
    let baseName = "Worksheet";
    if (window.lastUploadedFilename) {
        // Removes the file extension (.txt) so it doesn't duplicate
        baseName = window.lastUploadedFilename.replace(/\.[^/.]+$/, "");
    }

    // Set the final formatted filename
    a.download = `${baseName}_${internationalDate}_${militaryTime}.txt`;

    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);

    URL.revokeObjectURL(a.href);
};

})();

</script>

(function() {
    class AppController {
        constructor() {
            this.colorQueue = ["Blue", "Green", "Orange", "Red"];
            this.currentColorIndex = 0;
            this.initListeners();
        }

        isColorOnlyMode() {
            const classSelect = document.querySelector(".classSelect");
            return !classSelect || !classSelect.value || (typeof studentData !== "undefined" && !studentData[classSelect.value]);
        }

        getActiveColor() {
            return this.colorQueue[this.currentColorIndex];

        nextColor() {

            this.syncAll();

        syncAll() {

            const tmTile = document.getElementById("tmTile");

Orange	Theeraphat
Orange	Pannatat

Red	Boonpipon
Red	Warawat
Purple	Tarzan

`;

const studentColors = {
    Blue:"#93c5fd",
    Green:"#86efac",
    Orange:"#fdba74",
    Red:"#fca5a5"
};

function parseStudents(raw){
    const blocks = raw.split(/(?=~)/g);
    const result={};
    blocks.forEach(block=>{
        block=block.trim();
        if(!block.startsWith("~")) return;
        const lines = block.split("\n").map(x=>x.trim()).filter(Boolean);
        const className = lines[0].replace(/^~/, "").split("-")[0].trim();
        result[className]=[];
        for(let i=1;i<lines.length;i++){
            const parts = lines[i].split(/\s+/);
            const team = parts.shift();
            const name = parts.join(" ");
            result[className].push({
                name:name,
                team:team,
                color:studentColors[team] || "#ddd"
            });
        }
    });
    return result;
}

const studentData = parseStudents(RAW_TEXT);
const classSelectors = document.querySelectorAll(".classSelect");
const studentTiles = document.querySelectorAll(".studentTile");

let colorQueues = {};
let currentColor = 0;
const colorOrder = ["Blue", "Green", "Orange", "Red"];

function shuffle(array){
    return [...array].sort(()=>Math.random()-0.5);
}

function loadClass(className){
    colorQueues = {};
    colorOrder.forEach(color=>{
        if (studentData[className]) {
            colorQueues[color] = shuffle(
                studentData[className].filter(s=>s.team===color)
            );
        } else {
            colorQueues[color] = [];
        }
    });
    currentColor = 0;
}

/* CENTRALIZED SYNCHRONIZED STUDENT UPDATER */
window.setGlobalStudent = function(studentName, studentColor) {
    // 1. Update Student Tiles
    studentTiles.forEach(tile=>{
        tile.textContent = studentName;
        tile.style.background = studentColor;
        tile.style.color = "#111";
    });

    // 2. Update Grab Dot / Student Tab
    const grabDot = document.getElementById("pGrabDot");
    if (grabDot) {
        grabDot.textContent = studentName;
        grabDot.style.setProperty("background-color", studentColor, "important");
        grabDot.style.setProperty("color", "#111", "important");
    }

    // 3. Update Tallyman Tile
    const tmTile = document.getElementById("tmTile");
    if (tmTile) {
        tmTile.textContent = studentName;
        tmTile.style.background = studentColor;
        tmTile.style.color = "#111";
    }

    // 4. Update Wheel State if present
    if (typeof Wheel !== "undefined") {
        Wheel.currentName = studentName;
        if (Wheel.overlay && Wheel.overlay.style.display === "flex") {
            if (typeof drawWheel === "function") drawWheel();
        }
    }
};

function nextStudent(){
    const className = classSelectors[0] ? classSelectors[0].value : "";
    if (!className || !studentData[className]) return;

    const color = colorOrder[currentColor];
    if(!colorQueues[color] || colorQueues[color].length===0){
        colorQueues[color] = shuffle(
            studentData[className].filter(s=>s.team===color)
        );
    }

    const student = colorQueues[color].shift();
    if (student) {
        window.setGlobalStudent(student.name, student.color);
    }

    currentColor = (currentColor+1) % colorOrder.length;
}

Object.keys(studentData).forEach(className=>{
    classSelectors.forEach(select=>{
        const option = document.createElement("option");
        option.value = className;
        option.textContent = className;
        select.appendChild(option);
    });
});

classSelectors.forEach(select=>{
    select.addEventListener("change", function(){
        classSelectors.forEach(other=>{
            other.value = this.value;
        });
        loadClass(this.value);
        nextStudent();
        if(window.updateWheelClass){
            window.updateWheelClass();
        }
    });
});

studentTiles.forEach(tile=>{
    tile.onclick = function(e){
        e.stopPropagation();
        const wheelOverlay = document.getElementById("studentWheelOverlay");
        if (wheelOverlay && wheelOverlay.style.display === "flex" && typeof spinWheel === "function") {
            spinWheel();
        } else {
            nextStudent();
        }
    };
});if(classSelectors.length){
    classSelectors.forEach(select => {
        select.selectedIndex = 0; // Keeps it on the default "Class" option
    });
}
window.nextStudent = nextStudent;

<script>

(function(){

const Wheel={
    overlay:null,
    panel:null,
    canvas:null,
    ctx:null,
    students:[],
    angle:0,
    currentName:null,
    spinning:false,
    size:0,
    radius:0,
    duration:2000
};

function createWheel(){
    if(Wheel.overlay) return;

    const style=document.createElement("style");
    style.textContent=`
:root{
--wheel-size:350px;
}
#studentWheelOverlay{
position:fixed;
inset:0;
display:none;
align-items:center;
justify-content:center;
background:transparent;
pointer-events:none !important;
z-index:100002;
}
#studentWheelPanel {
    position: fixed !important;
    left: calc(645px + (250px - calc(var(--wheel-size) + 120px)) / 2) !important;
    top: 135px !important;
    bottom: auto !important;
    width: calc(var(--wheel-size) + 120px);
    height: calc(var(--wheel-size) + 120px);
    touch-action: none;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: auto !important;
}

Wheel.canvas.addEventListener("pointerdown", e=>{
        const canvasRect = Wheel.canvas.getBoundingClientRect();
        const cx = canvasRect.width / 2;
        const cy = canvasRect.height / 2;
        const localX = e.clientX - canvasRect.left;
        const localY = e.clientY - canvasRect.top;
        const dx = localX - cx;
        const dy = localY - cy;

        // If clicking the brass center hub (radius 28), bypass drag so click-to-spin takes over
        if(Math.sqrt(dx * dx + dy * dy) <= 28){
            return; 
        }

        dragging=true;
        const rect = Wheel.panel.getBoundingClientRect();
        ox = e.clientX - rect.left;
        oy = e.clientY - rect.top;
        e.preventDefault();
    });`;
    document.head.appendChild(style);

    Wheel.overlay=document.createElement("div");
    Wheel.overlay.id="studentWheelOverlay";

    Wheel.panel=document.createElement("div");
    Wheel.panel.id="studentWheelPanel";

    Wheel.canvas=document.createElement("canvas");
    Wheel.canvas.id="studentWheelCanvas";

    Wheel.size = parseInt(
        getComputedStyle(document.documentElement)
            .getPropertyValue("--wheel-size")
    );

    Wheel.radius = Wheel.size / 2 - 10;
    const extraSpace = 40;

    Wheel.canvas.width = Wheel.size + extraSpace;
    Wheel.canvas.height = Wheel.size + extraSpace;
    Wheel.ctx = Wheel.canvas.getContext("2d");
    Wheel.panel.appendChild(Wheel.canvas);
    Wheel.overlay.appendChild(Wheel.panel);
    document.body.appendChild(Wheel.overlay);

    let dragging=false;
    let ox=0;
    let oy=0;

    Wheel.canvas.addEventListener("pointerdown", e=>{
        const canvasRect = Wheel.canvas.getBoundingClientRect();
        const cx = canvasRect.width / 2;
        const cy = canvasRect.height / 2;
        const localX = e.clientX - canvasRect.left;
        const localY = e.clientY - canvasRect.top;
        const dx = localX - cx;
        const dy = localY - cy;

        // If clicking the brass center hub (radius 28), bypass drag so click-to-spin takes over
        if(Math.sqrt(dx * dx + dy * dy) <= 28){
            return; 
        }

        dragging=true;
        const rect = Wheel.panel.getBoundingClientRect();
        ox = e.clientX - rect.left;
        oy = e.clientY - rect.top;
        e.preventDefault();
    });

    document.addEventListener("pointermove", e=>{
        if(!dragging) return;
        Wheel.panel.style.setProperty("position", "fixed", "important");
        Wheel.panel.style.setProperty("left", (e.clientX - ox) + "px", "important");
        Wheel.panel.style.setProperty("top", (e.clientY - oy) + "px", "important");
        Wheel.panel.style.setProperty("bottom", "auto", "important");
        Wheel.panel.style.setProperty("right", "auto", "important");
        Wheel.panel.style.setProperty("transform", "none", "important");
    });

    document.addEventListener("pointerup", e=>{
        if(dragging){
            dragging=false;
        }
    });
}

function loadWheelStudents(){
    const className = document.querySelector(".classSelect").value;
    if(!className || !studentData[className]){
        Wheel.students = [
            { name: "Blue", color: studentColors["Blue"] },
            { name: "Green", color: studentColors["Green"] },
            { name: "Orange", color: studentColors["Orange"] },
            { name: "Red", color: studentColors["Red"] }
        ];
        return;
    }

    Wheel.students = studentData[className].map(s => ({...s}));
    const colorGroups = {};
    Wheel.students.forEach(student=>{
        const color = student.color || "#ddd";
        if(!colorGroups[color]) colorGroups[color] = [];
        colorGroups[color].push(student);
    });

    const groups = Object.values(colorGroups);
    Wheel.students = [];
    let lastColor = null;

    while(groups.some(g => g.length)){
        groups.sort((a,b)=>b.length-a.length);
        let selected = groups.find(g => g.length && (g[0].color || "#ddd") !== lastColor);
        if(!selected) selected = groups.find(g=>g.length);
        const student = selected.shift();
        Wheel.students.push(student);
        lastColor = student.color || "#ddd";
    }

    const tile = document.querySelector(".studentTile");
    if(tile){
        Wheel.currentName = tile.textContent.trim();
    }
}

function drawWheel(){
    const ctx = Wheel.ctx;
    ctx.setTransform(1,0,0,1,0,0);
    ctx.globalAlpha = 1;
    ctx.shadowColor = "transparent";
    ctx.shadowBlur = 0;
    ctx.clearRect(0, 0, Wheel.canvas.width, Wheel.canvas.height);

    const extraSpace = 40;
    const cx = (Wheel.size/2) + extraSpace/2;
    const cy = (Wheel.size/2) + extraSpace/2;

    ctx.save();
    const students=Wheel.students;
    if(!students.length) return;

    const slice = Math.PI*2/students.length;

    students.forEach((s,i)=>{
        const start = Wheel.angle + i * slice;
        const end = start + slice;

        ctx.beginPath();
        ctx.moveTo(cx,cy);
        ctx.arc(cx, cy, Wheel.radius, start, end);
        ctx.closePath();

        ctx.fillStyle = s.color || "#ddd";
        ctx.fill();

        ctx.strokeStyle = "#000";
        ctx.lineWidth = 0.25;
        ctx.stroke();

        const mid = (start + end) / 2;
        ctx.save();
        const labelRadius = Wheel.radius - 15; 
        ctx.translate(cx + Math.cos(mid) * labelRadius, cy + Math.sin(mid) * labelRadius);
        ctx.rotate(mid + Math.PI);
        ctx.fillStyle = "#111";
        ctx.font = (Wheel.size * 0.035) + "px Arial";
        ctx.textAlign = "left";
        ctx.textBaseline = "middle";
        ctx.fillText(s.name, 0, 0);
        ctx.restore();
    });

    ctx.restore();

    ctx.save();
    const rimWidth = 10;
    const rimGradient = ctx.createRadialGradient(cx, cy, Wheel.radius - rimWidth, cx, cy, Wheel.radius + 5);
    rimGradient.addColorStop(0, "#5c3900");
    rimGradient.addColorStop(0.25, "#d8a62a");
    rimGradient.addColorStop(0.45, "#fff2a6");
    rimGradient.addColorStop(0.65, "#c58a16");
    rimGradient.addColorStop(0.85, "#8b5a05");
    rimGradient.addColorStop(1, "#3b2400");

    ctx.beginPath();
    ctx.arc(cx, cy, Wheel.radius, 0, Math.PI * 2);
    ctx.strokeStyle = rimGradient;
    ctx.lineWidth = rimWidth;
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(cx, cy, Wheel.radius - rimWidth/2, 0, Math.PI * 2);
    ctx.strokeStyle = "rgba(255,240,150,0.8)";
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.restore();

    // pointer
    ctx.beginPath();
    ctx.moveTo(cx,35);
    ctx.lineTo(cx-10,18);
    ctx.lineTo(cx+10,18);
    ctx.closePath();
    ctx.fillStyle="red";
    ctx.fill();

    // hub
    const hubX = cx;
    const hubY = cy;
    ctx.save();
    ctx.beginPath();
    ctx.arc(hubX + 3, hubY + 5, 28, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(0,0,0,0.35)";
    ctx.fill();

    const brass = ctx.createRadialGradient(hubX - 8, hubY - 10, 3, hubX, hubY, 30);
    brass.addColorStop(0, "#fff2a6");
    brass.addColorStop(0.15, "#ffd34e");
    brass.addColorStop(0.35, "#c58a16");
    brass.addColorStop(0.65, "#8b5a05");
    brass.addColorStop(0.85, "#d8a62a");
    brass.addColorStop(1, "#5c3900");

    ctx.beginPath();
    ctx.arc(hubX, hubY, 28, 0, Math.PI * 2);
    ctx.fillStyle = brass;
    ctx.fill();

    ctx.beginPath();
    ctx.arc(hubX, hubY, 28, 0, Math.PI * 2);
    ctx.strokeStyle = "#5a3500";
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(hubX, hubY, 20, 0, Math.PI * 2);
    ctx.strokeStyle = "rgba(255,240,150,0.8)";
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(hubX - 7, hubY - 8, 7, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(255,255,220,0.55)";
    ctx.fill();
    ctx.restore();
}

function spinWheel(){
    if(Wheel.spinning) return;
    Wheel.spinning = true;

    if(window.startSpinnerSound) startSpinnerSound();
    loadWheelStudents();

    if(!Wheel.students.length){
        Wheel.spinning = false;
        if(window.stopSpinnerSound) stopSpinnerSound();
        return;
    }

    let start = performance.now();
    let startAngle = Wheel.angle;
    const slice = (Math.PI * 2) / Wheel.students.length;

    const className = document.querySelector(".classSelect").value;
    if (className && studentData[className]) {
        if(typeof window.nextStudent === "function"){
            window.nextStudent();
        }
        const tile = document.querySelector(".studentTile");
        if(tile){
            Wheel.currentName = tile.textContent.trim();
        }
    } else {
        if (window.appController) {
            window.appController.nextColor();
            Wheel.currentName = window.appController.getActiveColor();
        } else {
            Wheel.currentName = "Blue";
        }
    }

    const targetIndex = Wheel.students.findIndex(s => s.name === Wheel.currentName);
    if(targetIndex < 0){
        Wheel.spinning = false;
        if(window.stopSpinnerSound) stopSpinnerSound();
        return;
    }

    const studentAngle = (targetIndex * slice) + (slice / 2);
    const pointerAngle = -Math.PI / 2;
    let offset = pointerAngle - studentAngle - startAngle;
    offset = ((offset % (Math.PI * 2)) + (Math.PI * 2)) % (Math.PI * 2);
    const minimumTurns = 7;
    let target = startAngle + (minimumTurns * Math.PI * 2) + offset;

    function animate(now){
        let p = (now - start) / Wheel.duration;
        if(p > 1) p = 1;
        let ease = 1 - Math.pow(1 - p, 5);
        Wheel.angle = startAngle + (target - startAngle) * ease;
        drawWheel();

        if(p < 1){
            requestAnimationFrame(animate);
        } else {
            Wheel.spinning = false;
            if(window.stopSpinnerSound) stopSpinnerSound();
            loadWheelStudents();
            drawWheel();

            const landingStudent = Wheel.students[targetIndex];
            if (landingStudent) {
                window.setGlobalStudent(landingStudent.name, landingStudent.color);
            }
        }
    }
    requestAnimationFrame(animate);
}

function showWheel(){
    createWheel();
    Wheel.overlay.style.display="flex";
    loadWheelStudents();

    const className = document.querySelector(".classSelect").value;
    if (className && studentData[className]) {
        const tile = document.querySelector(".studentTile");
        const tileName = tile ? tile.textContent.trim() : "";
        if(tileName && tileName !== "Student" && Wheel.students.some(s => s.name === tileName)){
            Wheel.currentName = tileName;
        } else if(Wheel.students.length > 0){
            Wheel.currentName = Wheel.students[0].name;
        }
    } else {
        Wheel.currentName = null;
    }

    const targetIndex = Wheel.students.findIndex(s => s.name === Wheel.currentName);
    if(targetIndex >= 0 && Wheel.students.length){
        const slice = (Math.PI * 2) / Wheel.students.length;
        const studentCenter = (targetIndex * slice) + (slice / 2);
        Wheel.angle = (-Math.PI / 2) - studentCenter;
    }
    drawWheel();
}

function updateWheelClass() {
    if(Wheel.overlay && Wheel.overlay.style.display === "flex"){
        loadWheelStudents();
        const className = document.querySelector(".classSelect").value;
        if (className && studentData[className] && Wheel.students.length > 0) {
            const tile = document.querySelector(".studentTile");
            const tileName = tile ? tile.textContent.trim() : "";
            if(tileName && tileName !== "Student" && Wheel.students.some(s => s.name === tileName)){
                Wheel.currentName = tileName;
            } else {
                Wheel.currentName = Wheel.students[0].name;
            }
            const targetIndex = Wheel.students.findIndex(s => s.name === Wheel.currentName);
            if(targetIndex >= 0){
                const slice = (Math.PI * 2) / Wheel.students.length;
                const studentCenter = (targetIndex * slice) + (slice / 2);
                Wheel.angle = (-Math.PI / 2) - studentCenter;
            }
        }
        drawWheel();
    }
}
window.updateWheelClass = updateWheelClass;

function hideWheel(){
    if(Wheel.overlay){
        Wheel.overlay.style.display="none";
    }
}

function toggleSpinner(){
    if(Wheel.overlay && Wheel.overlay.style.display === "flex"){
        hideWheel();
    } else {
        showWheel();
    }
}

const leftSpinner = document.getElementById("spinnerBtn");
if(leftSpinner) leftSpinner.onclick = toggleSpinner;

const rightSpinner = document.getElementById("spinnerBtnRight");
if(rightSpinner) rightSpinner.onclick = toggleSpinner;

window.spinWheel = spinWheel;
window.hideWheel = hideWheel;

document.addEventListener("click", function(e){
    if(!Wheel.overlay || Wheel.overlay.style.display !== "flex") return;
    if(e.target !== Wheel.canvas) return;

    const canvasRect = Wheel.canvas.getBoundingClientRect();
    const extraSpace = 40;
    const cx = (Wheel.size / 2) + extraSpace / 2;
    const cy = (Wheel.size / 2) + extraSpace / 2;

    const scaleX = Wheel.canvas.width / canvasRect.width;
    const scaleY = Wheel.canvas.height / canvasRect.height;
    const internalX = (e.clientX - canvasRect.left) * scaleX;
    const internalY = (e.clientY - canvasRect.top) * scaleY;
    const dx = internalX - cx;
    const dy = internalY - cy;

    if(Math.sqrt(dx * dx + dy * dy) <= 28){
        e.stopImmediatePropagation();
        e.preventDefault();
        spinWheel();
    }
}, true);

})();

</script>

        spinnerSound.play().catch(err => { isPlaying = false; });

    function stopSpinnerSound() {
        if (!isPlaying) return;
        isPlaying = false;
        spinnerSound.pause();
        spinnerSound.currentTime = 0;
    }

    window.startSpinnerSound = startSpinnerSound;
    window.stopSpinnerSound = stopSpinnerSound;
})();

});const tmScores = { Blue:0, Green:0, Orange:0, Red:0 };

function tmAddTally(team){
  tmScores[team]++;
  const area = document.querySelector('.tmTallies[data-team="'+team+'"]');
  if(!area) return;
  let groups = area.querySelectorAll(".tmGroup");
  let group = groups[groups.length-1];
  if(!group || Number(group.dataset.count)>=5){
    group = document.createElement("div");
    group.className="tmGroup";
    group.dataset.count=0;
    area.appendChild(group);
  }
  let count = Number(group.dataset.count);
  if(count<4){
    const stick = document.createElement("div");
    stick.className="tmStick";
    group.appendChild(stick);
  }
  count++;
  if(count===5){
    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("viewBox", "0 0 20 20");
    svg.innerHTML=`<line x1="1" y1="1" x2="19" y2="19" stroke="#111" stroke-width="2.5" stroke-linecap="round"/>`;
    group.appendChild(svg);
  }
  group.dataset.count=count;
  document.getElementById("tmScore"+team).textContent=tmScores[team];
}

function tmDeleteTally(team){
  if(tmScores[team]===0) return;
  tmScores[team]--;
  const area = document.querySelector('.tmTallies[data-team="'+team+'"]');
  if(!area) return;
  const groups = area.querySelectorAll(".tmGroup");
  if(!groups.length) return;
  const group = groups[groups.length-1];
  let count = Number(group.dataset.count);
  if(count===5){
    const svg = group.querySelector("svg");
    if(svg) svg.remove();
  } else {
    const sticks = group.querySelectorAll(".tmStick");
    if(sticks.length) sticks[sticks.length-1].remove();
  }
  count--;
  group.dataset.count=count;
  if(count===0) group.remove();
  document.getElementById("tmScore"+team).textContent=tmScores[team];
}

function tmResetScores(){
  Object.keys(tmScores).forEach(team=>{

      document.getElementById("tmScore"+team).textContent=0;
      const area = document.querySelector('.tmTallies[data-team="'+team+'"]');
      if(area) area.innerHTML="";
  });
}

<script>
(function() {
  let modalOpen = false;

  const modalContainer = document.getElementById("jellyBeanModalContainer");
  const jarWrapper = document.getElementById("jbJarWrapper");
  const jarContainer = document.getElementById("jbJarContainer");
  const beanCanvas = document.getElementById("jbBeanCanvas");
  const ctx = beanCanvas.getContext("2d");

  const scoreDisplay = document.getElementById("jbScoreDisplay");
  const mouthHotspot = document.getElementById("jbMouthHotspot");
  const jarLid = document.getElementById("jbJarLid");
  const lidHitbox = document.getElementById("jbLidHitbox");

  const saveButton = document.getElementById("jbSaveButton");
  const browseButton = document.getElementById("jbBrowseButton");
  const fileInput = document.getElementById("jbFileInput");
  const classSelect = document.getElementById("jbClassSelect");

  const MAX_BEANS = 50;
  const BEAN_RADIUS = 20.9;

  const jarBounds = { left: 135, right: 385, top: 175, bottom: 645 };

  beanCanvas.width = 520;
  beanCanvas.height = 760;

  let beans = [];
  let score = 0;

  const BEAN_COLORS = [
    { fill: "#E74C3C" },
    { fill: "#F1C40F" },
    { fill: "#E84393" },
    { fill: "#2ECC71" },
    { fill: "#9B59B6" },
    { fill: "#E67E22" },
    { fill: "#3498DB" }
  ];

  function randomBeanColor() {
    return BEAN_COLORS[Math.floor(Math.random() * BEAN_COLORS.length)];
  }

  function updateScore() {
    scoreDisplay.textContent = score;
  }

  function toggleModal() {
    modalOpen = !modalOpen;
    modalContainer.style.display = modalOpen ? "block" : "none";
  }

  function getTargetPosition(index) {
    const maxCols = 6;
    const col = index % maxCols;
    const row = Math.floor(index / maxCols);

    const availableWidth = (jarBounds.right - 10) - (jarBounds.left + 10) - (BEAN_RADIUS * 2);
    const colSpacing = availableWidth / (maxCols - 1);

    const baseTargetX = (jarBounds.left + 10) + BEAN_RADIUS + (col * colSpacing);
    const baseFloor = (jarBounds.bottom - 5) + 15;
    const baseTargetY = baseFloor - BEAN_RADIUS - (row * (BEAN_RADIUS * 1.3));

    const jarCenterX = (jarBounds.left + jarBounds.right) / 2;
    const distanceFromCenter = Math.abs(baseTargetX - jarCenterX);
    const maxDistanceFromCenter = (jarBounds.right - jarBounds.left) / 2;
    const edgeCurveFactor = Math.min(1, distanceFromCenter / maxDistanceFromCenter);
    const edgeLift = (row === 0) ? (edgeCurveFactor * 8) : 0;

    const jitterX = Math.sin(index * 12.9898) * 12;
    const jitterY = Math.cos(index * 78.233) * 6;

    return { 
      targetX: baseTargetX + jitterX, 
      targetY: (baseTargetY - edgeLift) + jitterY 
    };
  }

  function createBean() {
    if (score >= MAX_BEANS) return;

    const { targetX, targetY } = getTargetPosition(beans.length);
    const angleJitter = (Math.sin(beans.length * 43.11) * 0.6) + ((Math.random() - 0.5) * 0.4);

    const bean = {
      x: targetX,
      y: targetY,
      targetX: targetX,
      targetY: targetY,
      angle: angleJitter,
      color: randomBeanColor(),
      alpha: 1,
      removing: false
    };

    beans.push(bean);
    score++;
    updateScore();
  }

  function removeBean() {
    if (score <= 0) return;

    let selectedBean = null;
    for (let i = beans.length - 1; i >= 0; i--) {
      if (!beans[i].removing) {
        selectedBean = beans[i];
        break;
      }
    }

    if (!selectedBean) return;

    selectedBean.removing = true;
    selectedBean.alpha = 1;

    score--;
    updateScore();

    let activeIdx = 0;
    for (const bean of beans) {
      if (!bean.removing) {
        const { targetX, targetY } = getTargetPosition(activeIdx);
        bean.targetX = targetX;
        bean.targetY = targetY;
        bean.x = targetX;
        bean.y = targetY;
        activeIdx++;
      }
    }
  }

  function updateBeans() {
    beans = beans.filter(b => !b.removing);
  }

  function drawBeans() {
    ctx.clearRect(0, 0, beanCanvas.width, beanCanvas.height);

    for (const bean of beans) {
      ctx.save();
      ctx.globalAlpha = Math.max(0, bean.alpha);
      ctx.translate(bean.x, bean.y);
      ctx.rotate(bean.angle);

      ctx.beginPath();
      ctx.moveTo(-19, -6);
      ctx.bezierCurveTo(-24, -22, 19, -25, 24, -6);
      ctx.bezierCurveTo(28, 11, -4, 25, -19, 15);
      ctx.bezierCurveTo(-26, 9, -24, 0, -19, -6);
      ctx.closePath();

      ctx.fillStyle = bean.color.fill;
      ctx.fill();

      ctx.strokeStyle = "rgba(0, 0, 0, 0.12)";
      ctx.lineWidth = 1.5;
      ctx.stroke();

      ctx.beginPath();
      ctx.ellipse(-5, -9, 9, 3.5, Math.PI / 4, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(255, 255, 255, 0.65)";
      ctx.fill();

      ctx.restore();
    }
  }

  let lidDragging = false;
  let lidOffsetX = 0;
  let lidOffsetY = 0;
  let currentLidX = 0;
  let currentLidY = 27.5;
  let targetLidX = 0;
  let targetLidY = 27.5;

  lidHitbox.addEventListener("pointerdown", (event) => {
    event.stopPropagation();
    lidDragging = true;
    lidHitbox.setPointerCapture(event.pointerId);

    const containerRect = jarContainer.getBoundingClientRect();
    const lidRect = jarLid.getBoundingClientRect();
    
    lidOffsetX = event.clientX - lidRect.left;
    lidOffsetY = event.clientY - lidRect.top;
    
    targetLidX = lidRect.left - containerRect.left;
    targetLidY = lidRect.top - containerRect.top;
  });

  lidHitbox.addEventListener("pointermove", (event) => {
    if (!lidDragging) return;
    event.stopPropagation();
    const containerRect = jarContainer.getBoundingClientRect();
    targetLidX = event.clientX - containerRect.left - lidOffsetX;
    targetLidY = event.clientY - containerRect.top - lidOffsetY;
  });

  const stopLidDrag = (event) => {
    if (lidDragging) {
      lidDragging = false;
      try { lidHitbox.releasePointerCapture(event.pointerId); } catch (e) {}
    }
  };
  lidHitbox.addEventListener("pointerup", stopLidDrag);
  lidHitbox.addEventListener("pointercancel", stopLidDrag);

  function animate() {
    if (modalOpen) {
      currentLidX += (targetLidX - currentLidX) * 0.25;
      currentLidY += (targetLidY - currentLidY) * 0.25;

      jarLid.style.left = currentLidX + "px";
      jarLid.style.top = currentLidY + "px";
      jarLid.style.margin = "0";

      lidHitbox.style.left = currentLidX + "px";
      lidHitbox.style.top = currentLidY + "px";
      lidHitbox.style.margin = "0";

      updateBeans();
      drawBeans();
    }
    requestAnimationFrame(animate);
  }

  function getDateString() {
    const today = new Date();
    const year = today.getFullYear();
    const month = String(today.getMonth() + 1).padStart(2, "0");
    const day = String(today.getDate()).padStart(2, "0");
    return `${year}-${month}-${day}`;
  }

  saveButton.addEventListener("pointerdown", async (e) => {
    e.stopPropagation();
    const selectedClass = classSelect.value;
    const filename = `${selectedClass}_${getDateString()}.txt`;
    const content = score.toString();

    try {
      const folderHandle = await window.showDirectoryPicker({ mode: "readwrite" });
      const fileHandle = await folderHandle.getFileHandle(filename, { create: true });
      const writable = await fileHandle.createWritable();
      await writable.write(content);
      await writable.close();
      alert(`Saved: ${filename}`);
    } catch (error) {
      if (error.name !== "AbortError") {
        console.error("Save failed:", error);
        alert("Could not save the file.");
      }
    }
  });

  browseButton.addEventListener("pointerdown", (e) => {
    e.stopPropagation();
    fileInput.click();
  });

  fileInput.addEventListener("change", (event) => {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = (e) => {
      const loadedScore = parseInt(e.target.result.trim());
      if (isNaN(loadedScore) || loadedScore < 0) {
        alert("Invalid score file.");
        return;
      }
      beans = [];
      score = 0;
      updateScore();
      const amountToLoad = Math.min(loadedScore, MAX_BEANS);
      for (let i = 0; i < amountToLoad; i++) {
        createBean();
      }
    };
    reader.readAsText(file);
  });

  function makeModalDraggable(el) {
    el.onpointerdown = (e) => {
      if (e.target.closest('#jbControls') || e.target.closest('#jbLidHitbox') || e.target.closest('#jbJarLid') || e.target.closest('#jbScoreDisplay') || e.target.closest('#jbMouthHotspot')) {
        return;
      }

      const rect = el.getBoundingClientRect();
      if (el.style.transform.includes("translate")) {
        el.style.transform = "none";
        el.style.left = rect.left + "px";
        el.style.top = rect.top + "px";
      }

      const startX = e.clientX;
      const startY = e.clientY;
      const initialLeft = el.offsetLeft;
      const initialTop = el.offsetTop;

      document.onpointermove = (ev) => {
        const deltaX = ev.clientX - startX;
        const deltaY = ev.clientY - startY;
        el.style.left = (initialLeft + deltaX) + "px";
        el.style.top = (initialTop + deltaY) + "px";
      };

      document.onpointerup = () => {
        document.onpointermove = null;
        document.onpointerup = null;
      };
    };
  }

  document.addEventListener("DOMContentLoaded", () => {
    let leftBtn = document.getElementById("leftBtn");
    let rightBtn = document.getElementById("rightBtn");

    if (leftBtn) leftBtn.textContent = "Jelly Beans";
    if (rightBtn) rightBtn.textContent = "Jelly Beans";

    if (leftBtn) leftBtn.onclick = (e) => { e.stopPropagation(); toggleModal(); };
    if (rightBtn) rightBtn.onclick = (e) => { e.stopPropagation(); toggleModal(); };

    mouthHotspot.addEventListener("pointerdown", (e) => {
      e.stopPropagation();
      createBean();
    });

    scoreDisplay.addEventListener("pointerdown", (e) => {
      e.stopPropagation();
      removeBean();
    });

    makeModalDraggable(jarWrapper);
    updateScore();
    animate();
  });
})();
</script>

<!-- ==========================================================
     STANDALONE NEUTRAL GREY FALLING BEAN SYSTEM

<script>
(function() {
  window.addEventListener("DOMContentLoaded", () => {
    const jarContainer = document.getElementById("jbJarContainer");
    const beanCanvas = document.getElementById("jbBeanCanvas");
    const scoreDisplay = document.getElementById("jbScoreDisplay");
    
    if (!jarContainer || !beanCanvas || !scoreDisplay) return;

    const blurCanvas = document.createElement("canvas");
    blurCanvas.id = "jbBlurCanvas";
    blurCanvas.width = 520;
    blurCanvas.height = 760;
    blurCanvas.style.cssText = "position:absolute; inset:0; width:100%; height:100%; pointer-events:none; z-index:4;";
    
    beanCanvas.style.zIndex = "3";
    jarContainer.appendChild(blurCanvas);
    const blurCtx = blurCanvas.getContext("2d");

    let impressionisticTrails = [];
    let lastKnownScore = parseInt(scoreDisplay.textContent) || 0;

    const jarBounds = { left: 135, right: 385, top: 175, bottom: 645 };
    const BEAN_RADIUS = 20.9;
    const maxCols = 6;
    const NEUTRAL_GREY = "#95A5A6";

    function getBeanCoordinates(scoreIndex) {
      const targetIndex = Math.max(0, scoreIndex);
      const col = targetIndex % maxCols;
      const row = Math.floor(targetIndex / maxCols);

      const availableWidth = (jarBounds.right - 10) - (jarBounds.left + 10) - (BEAN_RADIUS * 2);
      const colSpacing = availableWidth / (maxCols - 1);
      const baseTargetX = (jarBounds.left + 10) + BEAN_RADIUS + (col * colSpacing);
      const baseFloor = (jarBounds.bottom - 5) + 15;
      const baseTargetY = baseFloor - BEAN_RADIUS - (row * (BEAN_RADIUS * 1.3));

      const jarCenterX = (jarBounds.left + jarBounds.right) / 2;
      const edgeCurveFactor = Math.min(1, Math.abs(baseTargetX - jarCenterX) / ((jarBounds.right - jarBounds.left) / 2));
      const edgeLift = (row === 0) ? (edgeCurveFactor * 8) : 0;

      return {
        x: baseTargetX + (Math.sin(targetIndex * 12.9898) * 12),
        y: (baseTargetY - edgeLift) + (Math.cos(targetIndex * 78.233) * 6)
      };
    }

    const observer = new MutationObserver(() => {
      const currentScore = parseInt(scoreDisplay.textContent) || 0;
      if (currentScore === lastKnownScore) return;

      const centerX = (jarBounds.left + jarBounds.right) / 2;
      const startY = jarBounds.top - 15;
      
      const targetScoreIndex = currentScore > lastKnownScore ? currentScore - 1 : currentScore;
      const targetCoord = getBeanCoordinates(targetScoreIndex);
      const endY = targetCoord.y;

      if (currentScore > lastKnownScore) {
        impressionisticTrails.push({
          x: centerX,
          y: startY,
          targetY: endY,
          color: NEUTRAL_GREY,
          alpha: 0.35,
          life: 1.0,
          decay: 0.015
        });
      } else if (currentScore < lastKnownScore) {
        impressionisticTrails.push({
          x: centerX,
          y: endY,
          targetY: startY,
          color: NEUTRAL_GREY,
          alpha: 0.35,
          life: 1.0,
          decay: 0.015
        });
      }

      lastKnownScore = currentScore;
    });

    observer.observe(scoreDisplay, { childList: true, characterData: true, subtree: true });

    function renderBlurTrails() {
      blurCtx.clearRect(0, 0, blurCanvas.width, blurCanvas.height);

      for (let i = impressionisticTrails.length - 1; i >= 0; i--) {
        let trail = impressionisticTrails[i];
        trail.y += (trail.targetY - trail.y) * 0.12;
        trail.life -= trail.decay;

        if (trail.life <= 0 || Math.abs(trail.targetY - trail.y) < 1) {
          impressionisticTrails.splice(i, 1);
          continue;
        }

        blurCtx.save();
        blurCtx.globalAlpha = trail.alpha * trail.life;
        blurCtx.shadowColor = trail.color;
        blurCtx.shadowBlur = 35;
        blurCtx.translate(trail.x, trail.y);

        blurCtx.beginPath();
        blurCtx.moveTo(-19, -6);
        blurCtx.bezierCurveTo(-24, -22, 19, -25, 24, -6);
        blurCtx.bezierCurveTo(28, 11, -4, 25, -19, 15);










        blurCtx.bezierCurveTo(-26, 9, -24, 0, -19, -6);
        blurCtx.closePath();

        blurCtx.fillStyle = trail.color;
        blurCtx.fill();

        blurCtx.restore();
      }

      requestAnimationFrame(renderBlurTrails);
    }

    renderBlurTrails();
  });
})();
</script>

<script>
(function(){

"use strict";

/*==================================================
  TALLYMAN SMOOTH DRAG
  (Maintains smooth window dragging without any purple overlays)
==================================================*/

/* Fix window dragging jitter by using requestAnimationFrame and direct transform/style management */
function initSmoothDrag() {
  const win = document.getElementById("tmWindow");
  const handle = document.getElementById("tmDrag");

  if (!win || !handle) return;

  let dragging = false;
  let startX = 0, startY = 0;
  let initialLeft = 0, initialTop = 0;

  handle.addEventListener("mousedown", (e) => {
    dragging = true;
    startX = e.clientX;
    startY = e.clientY;

    const rect = win.getBoundingClientRect();
    initialLeft = rect.left;
    initialTop = rect.top;

    win.style.right = "auto";
    win.style.bottom = "auto";
    win.style.left = initialLeft + "px";
    win.style.top = initialTop + "px";

    e.preventDefault();
  });

  document.addEventListener("mousemove", (e) => {
    if (!dragging) return;

    const dx = e.clientX - startX;
    const dy = e.clientY - startY;

    window.requestAnimationFrame(() => {
      win.style.left = (initialLeft + dx) + "px";
      win.style.top = (initialTop + dy) + "px";
    });
  });

  document.addEventListener("mouseup", () => {
    dragging = false;
  });
}

// Initialize smooth dragging once DOM is ready
if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", initSmoothDrag);
} else {
  setTimeout(initSmoothDrag, 100);
}

console.log("Standalone Smooth Drag Script Loaded");

})();
</script>

const indicator = document.createElement("div");

window.updateSpreadIndicator = function(leftText, rightText) {
    if (leftText && rightText) {
        let cleanLeft = leftText.split('/').pop().replace(/\.[^/.]+$/, "").replace(/[()]/g, "").replace(/^\D+/g, '');
        let cleanRight = rightText.split('/').pop().replace(/\.[^/.]+$/, "").replace(/[()]/g, "").replace(/^\D+/g, '');
        
        if (cleanLeft && cleanRight) {
            indicator.textContent = `Pages ${cleanLeft}–${cleanRight}`;
            indicator.title = `Pages ${cleanLeft}–${cleanRight}`;
        } else {
            let fallbackLeft = leftText.split('/').pop().replace(/\.[^/.]+$/, "").replace(/[()]/g, "");
            let fallbackRight = rightText.split('/').pop().replace(/\.[^/.]+$/, "").replace(/[()]/g, "");
            indicator.textContent = `${fallbackLeft}–${fallbackRight}`;
            indicator.title = `${fallbackLeft} and ${fallbackRight}`;

    `;
    document.head.appendChild(style);

    let notesList = [];
    let activeIndex = 0;

    function parseAndBuildNoteTiles() {
        const scriptArea = document.getElementById('worksheetScript');
        const tilesContainer = document.querySelector('#tilesArea') || document.querySelector('.tiles-container');
        
        if (!tilesContainer) return;

        tilesContainer.querySelectorAll('.standalone-note-tile').forEach(el => el.remove());

        if (!scriptArea || !scriptArea.value) {
            notesList = [];
            return;
        }

        const lines = scriptArea.value.split('\n');
        notesList = [];
        let currentBlock = [];
        let capturing = false;

        lines.forEach(line => {
            let trimmed = line.trim();
            if (/^(~|!)Notes?:/i.test(trimmed)) {
                if (capturing) {
                    notesList.push(currentBlock.join('\n'));
                    currentBlock = [];
                }
                capturing = true;
                let cleanLine = trimmed.replace(/^(~|!)Notes?:\s*/i, '').trim();
                if (cleanLine) currentBlock.push(cleanLine);
            } else if (capturing) {
                if (/^(~|!)[A-Za-z]+:/.test(trimmed)) {
                    capturing = false;
                    if (currentBlock.length > 0) {
                        notesList.push(currentBlock.join('\n'));
                        currentBlock = [];
                    }
                    if (/^(~|!)Notes?:/i.test(trimmed)) {
                        capturing = true;
                        let cleanLine = trimmed.replace(/^(~|!)Notes?:\s*/i, '').trim();
                        if (cleanLine) currentBlock.push(cleanLine);
                    }
                } else {
                    currentBlock.push(line);
                }
            }
        });

        if (capturing && currentBlock.length > 0) {
            notesList.push(currentBlock.join('\n'));
        }

        notesList.forEach((noteContent, idx) => {
            const tile = document.createElement('div');
            tile.className = 'standalone-note-tile';
            
            let previewText = "Note";
            for (let l of noteContent.split('\n')) {
                if (l.trim() !== '') {
                    previewText = l.trim();
                    break;
                }
            }
            
            tile.textContent = previewText.length > 15 ? previewText.substring(0, 15) + '...' : previewText;

            tile.addEventListener('click', (e) => {
                e.stopPropagation();
                activeIndex = idx;

                let modal = document.getElementById('standaloneNoteModal');
                if (!modal) {
                    const modalWrapper = document.createElement('div');
                    modalWrapper.innerHTML = `
                        <div id="standaloneNoteModal" tabindex="0">
                            <div id="standaloneNoteContentRow">
                                <textarea id="standaloneNoteTextarea" placeholder="Note..." spellcheck="false"></textarea>
                            </div>
                            <div id="standaloneNoteGrabHandle" title="Drag Modal"></div>
                        </div>
                    `;
                    document.body.appendChild(modalWrapper);
                    modal = document.getElementById('standaloneNoteModal');

                    document.getElementById('standaloneNoteTextarea').addEventListener('input', (ev) => {
                        if (notesList.length > 0) {
                            notesList[activeIndex] = ev.target.value;
                            ev.target.style.height = 'auto';
                            ev.target.style.height = (ev.target.scrollHeight + 4) + 'px';
                        }
                    });

                    let isDragging = false, startX, startY;
                    modal.addEventListener('mousedown', (ev) => {
                        if (ev.target.tagName === 'TEXTAREA') return;
                        isDragging = true;
                        startX = ev.clientX - modal.offsetLeft;
                        startY = ev.clientY - modal.offsetTop;
                    });
                    document.addEventListener('mousemove', (ev) => {
                        if (!isDragging) return;
                        modal.style.left = `${ev.clientX - startX}px`;
                        modal.style.top = `${ev.clientY - startY}px`;
                    });
                    document.addEventListener('mouseup', () => { isDragging = false; });

                    modal.addEventListener('touchstart', (ev) => {
                        if (ev.target.tagName === 'TEXTAREA') return;
                        if (ev.touches.length === 1) {
                            isDragging = true;
                            startX = ev.touches[0].clientX - modal.offsetLeft;
                            startY = ev.touches[0].clientY - modal.offsetTop;
                            ev.preventDefault();
                        }
                    }, { passive: false });
                    document.addEventListener('touchmove', (ev) => {
                        if (isDragging && ev.touches.length === 1) {
                            modal.style.left = `${ev.touches[0].clientX - startX}px`;
                            modal.style.top = `${ev.touches[0].clientY - startY}px`;
                            ev.preventDefault();
                        }
                    }, { passive: false });
                    document.addEventListener('touchend', () => { isDragging = false; });
                }

                const textarea = document.getElementById('standaloneNoteTextarea');
                const contentRow = document.getElementById('standaloneNoteContentRow');

                textarea.value = notesList[activeIndex];
                contentRow.style.width = '100px';
                textarea.style.height = 'auto';
                textarea.style.height = (textarea.scrollHeight + 4) + 'px';
                contentRow.style.height = 'auto';

                modal.style.display = 'inline-flex';
                modal.focus();
            });

            tilesContainer.appendChild(tile);
        });
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', parseAndBuildNoteTiles);
    } else {
        parseAndBuildNoteTiles();
    }

    const scriptArea = document.getElementById('worksheetScript');
    if (scriptArea) {
        const observer = new MutationObserver(parseAndBuildNoteTiles);
        observer.observe(scriptArea, { characterData: true, subtree: true, attributes: true, childList: true });
        scriptArea.addEventListener('input', parseAndBuildNoteTiles);
        scriptArea.addEventListener('change', parseAndBuildNoteTiles);
    }
})();
</script>

<script>
/* ==========================================
    ROBUST ARROW-DRIVEN STUDENT PICKER & SPINNER SYNC
    Standalone (Queue + Wheel Display Activation)
========================================== */
(function() {
    // 1. Inject custom styles for the student tab grab handle
    const style = document.createElement('style');
    style.textContent = `
        #pGrabDot {
            width: auto !important;
            height: 22px !important;
            background-color: #E8D8B5 !important;
            border: 1px solid #B99F6B !important;
            border-radius: 4px !important;
            padding: 0 8px !important;
            font-size: 11px !important;
            font-family: Arial, sans-serif !important;
            font-weight: bold !important;
            color: #222 !important;
            cursor: pointer !important;
            display: inline-flex !important;
            align-items: center !important;
            justify-content: center !important;
            white-space: nowrap !important;
            user-select: none !important;
            box-sizing: border-box !important;
            margin: 0 4px !important;
        }
        #pGrabDot::after {
            display: none !important;
        }
        #pGrabDot:hover {
            filter: brightness(0.95);
        }
    `;
    document.head.appendChild(style);

    // 2. Synchronize student name and team colors to the grab handle
    function updateStudentTab() {
        const grabDot = document.getElementById('pGrabDot');
        if (!grabDot) return;

        // Get the current student directly from the wheel data.
        // Wheel.students contains { name, team, color } for each student.
        if (window.Wheel && window.Wheel.currentName) {
            const currentStudent = Array.isArray(window.Wheel.students)
                ? window.Wheel.students.find(
                    student => student.name === window.Wheel.currentName
                )
                : null;

            grabDot.textContent = window.Wheel.currentName;

            if (currentStudent && currentStudent.color) {
                grabDot.style.setProperty(
                    'background-color',
                    currentStudent.color,
                    'important'
                );
                grabDot.style.setProperty(
                    'color',
                    '#111',
                    'important'
                );
            }

            return;
        }

        const studentTile = document.querySelector(
            '.studentTile, .selected-student, [data-student], .active-student, .student-item.active'
        );

        const studentSelect = document.querySelector(
            'select.studentSelect, select[name*="student"], select.student-picker'
        );

        let name = null;
        let bgColor = "#E8D8B5";

        if (studentTile) {
            name = studentTile.textContent.trim();
            bgColor =
                studentTile.style.background ||
                studentTile.style.backgroundColor ||
                bgColor;
        } else if (studentSelect && studentSelect.selectedIndex >= 0) {
            name = studentSelect.options[studentSelect.selectedIndex].text.trim();
        }

        if (name) {
            grabDot.textContent = name;

            grabDot.style.setProperty(
                'background-color',
                bgColor,
                'important'
            );

            grabDot.style.setProperty(
                'color',
                '#111',
                'important'
            );
        }
    }

    // 3. Advance the student queue AND force the wheel display/animation state to update
function triggerNamePicker() {
        const wheelOverlay = document.getElementById("studentWheelOverlay");
        if (wheelOverlay && wheelOverlay.style.display === "flex" && typeof spinWheel === "function") {
            spinWheel();
            return;
        }

        let advanced = false;

        // A. Direct programmatic queue advancement
        if (typeof window.nextStudent === 'function') {
            window.nextStudent();
            advanced = true;
        } else if (window.Wheel && typeof window.Wheel.next === 'function') {
            window.Wheel.next();
            advanced = true;
        }

        // B. Cycle through student tiles/rows to update column highlighting
        const studentTiles = Array.from(
            document.querySelectorAll(
                '.studentTile, .student-item, [data-student-id], .picker-student'
            )
        );

        if (studentTiles.length > 0) {
            const activeIndex = studentTiles.findIndex(
                el =>
                    el.classList.contains('active') ||
                    el.classList.contains('selected')
            );

            let nextIndex =
                (activeIndex >= 0)
                    ? (activeIndex + 1) % studentTiles.length
                    : 0;
            
            studentTiles[nextIndex].click();
            advanced = true;
        }

        // C. Fallback dropdown index rotation
        if (!advanced) {
            const studentSelect = document.querySelector(
                'select.studentSelect, select[name*="student"], select.student-picker'
            );

            if (studentSelect && studentSelect.options.length > 0) {
                studentSelect.selectedIndex =
                    (studentSelect.selectedIndex + 1) %
                    studentSelect.options.length;

                studentSelect.dispatchEvent(
                    new Event('change', { bubbles: true })
                );

                advanced = true;
            }
        }

        // D. Force the wheel display / render methods to update their visual slice/pointer if available
        if (window.Wheel && typeof window.Wheel.draw === 'function') {
            window.Wheel.draw();
        } else if (window.Wheel && typeof window.Wheel.update === 'function') {
            window.Wheel.update();
        } else if (typeof window.renderWheel === 'function') {
            window.renderWheel();
        }

        setTimeout(updateStudentTab, 150);
    }

    // 4. Broadly intercept clicks on up/down arrows, chevrons, and answer navigation
    document.addEventListener('click', function(e) {
        if (e.target.closest('#pGrabDot')) return;

        const target = e.target.closest(
            'button, a, [role="button"], div, span, svg, path'
        );

        if (!target) return;

        const text = target.textContent || '';

        const idClass = (
            (target.id || '') + ' ' + 
            (target.className && typeof target.className === 'string'
                ? target.className
                : '') + ' ' + 
            (target.getAttribute('aria-label') || '') + ' ' + 
            (target.getAttribute('title') || '') + ' ' +
            (target.parentElement ? target.parentElement.className : '')
        ).toLowerCase();

        const isArrowAction = 
            idClass.includes('up') || 
            idClass.includes('down') || 
            idClass.includes('chevron') || 
            idClass.includes('arrow') || 
            idClass.includes('next') || 
            idClass.includes('prev') || 
            idClass.includes('inc') || 
            idClass.includes('dec') ||
            text.includes('▲') || text.includes('▼') || 
            text.includes('↑') || text.includes('↓') ||
            text.includes('∧') || text.includes('∨');

        if (isArrowAction) {
            triggerNamePicker();
        }
    }, true);

    // 5. Continuous background sync to keep the grab bar tab updated
    setInterval(updateStudentTab, 400);

})();
</script>

<script>
(function() {
  // Prevent pinch-to-zoom
  function preventPinch(e) {
    if (e.touches.length > 1) e.preventDefault();
  }

  // Prevent double-tap zoom
  let lastTouchTime = 0;
  function preventDoubleTap(e) {
    const now = Date.now();
    if (now - lastTouchTime < 300) {
      e.preventDefault();
    }
    lastTouchTime = now;
  }

  // Block gesture events on iOS
  function preventGesture(e) {
    e.preventDefault();
  }

  document.addEventListener('touchstart', preventPinch, { passive: false });
  document.addEventListener('touchend', preventDoubleTap, { passive: false });
  document.addEventListener('gesturestart', preventGesture, { passive: false });
})();
</script>

    const POP_SOUND_SRC = "data:audio/mp3;base64,SUQ3BAAAAAAAI1RTU0UAAAAPAAADTGF2ZjU4Ljc2LjEwMAD/+5DEAAAAAAAAAAAAAAAAAAAAAAAASW5mbwAAAA8AAAAJAAACPAD4+Pj4+Pj4+Pj4+Pj4+Pj4+Pj4+Pj4+Pj4+Pj4+Pj4+Pj4+Pj4+Pj4+Pj4+Pj4+Pj4+Pj4+Pj4+PgAAAAAADA3TEFNRTMuMTAwA1YAAAAAAAAAABQCJAKkCASCgAADEjw/z4wAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA/+7DzAACf5o/sAZM4AAn3Z8ARJ3AALQ/2fAATmABi1XgATmABg/v/3/+mP/////+6QpD/yMBP//////5AABAApA1qL3I/81MTH4X4f4v91GqM1NTX+H+Khq/1U1Nf91G/1NTUf/3U1NTUf4f9VNTU1NTX4f4v+q/1Nf/u4ww4ARm+3kAhK3oAR9e3cAiU3oA2L64AGi3A4Fk+/544X//5/1f+a1///e//vf/+tf/9f/61////rX/3///e//////0//pD/9v//1L/5oYAAAAEkg/2x0e/7n/9j+/9U/+2x7/3///s2OP/f22OP8f9tbY4/y/9tjj+P/b3OP////x/7bHH/v//////sf22Of8//5/3/A";

    const popAudio = new Audio(POP_SOUND_SRC);

    const canvas = document.createElement("canvas");

    canvas.style.cssText = `

    `;
    document.body.appendChild(canvas);
    const ctx = canvas.getContext("2d");

    }

    /* ==========================================

    const CONFETTI_COLORS = [
        "#f43f5e", "#8b5cf6", "#06b6d4", "#10b981", 
        "#f59e0b", "#ec4899", "#3b82f6", "#eab308",
        "#ff6b6b", "#48dbfb", "#1dd1a1", "#feca57"
    ];

    function createParticles() {
        particles = [];
        const particleCount = 300;

        for (let i = 0; i < particleCount; i++) {
            particles.push({
                x: Math.random() * canvas.width,
                y: -10 - (Math.random() * (canvas.height * 0.5)),
                vx: (Math.random() - 0.5) * 6,
                vy: Math.random() * 3 + 2,
                size: Math.random() * 8 + 5,
                color: CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)],
                rotation: Math.random() * Math.PI * 2,
                rotationSpeed: (Math.random() - 0.5) * 0.12,
                opacity: 1,
                gravity: 0.1,
                drag: 0.99,
                // Each piece starts fading once it passes this vertical threshold
                fadePoint: canvas.height * (0.3 + (Math.random() * 0.4)),
                // Individual fade speed so they fade out at slightly different times
                fadeSpeed: 0.015 + (Math.random() * 0.02)
            });
        }
    }

    function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Flash white screen overlay, then fade out
        if (overlayAlpha > 0) {
            ctx.fillStyle = `rgba(255, 255, 255, ${overlayAlpha})`;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            overlayAlpha -= 0.05; 
        }

        let activeParticles = 0;

        particles.forEach(p => {
            if (p.opacity <= 0) return;
            activeParticles++;

            p.vx *= p.drag;
            p.vy += p.gravity;
            p.x += p.vx;
            p.y += p.vy;
            p.rotation += p.rotationSpeed;

            // Actively fade out the opacity once past the fade point
            if (p.y > p.fadePoint) {
                p.opacity -= p.fadeSpeed;
            }

            ctx.save();
            ctx.globalAlpha = Math.max(0, p.opacity);
            ctx.translate(p.x, p.y);
            ctx.rotate(p.rotation);
            ctx.fillStyle = p.color;
            ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
            ctx.restore();
        });

        if (activeParticles > 0 || overlayAlpha > 0) {
            animationFrameId = requestAnimationFrame(render);
        } else {
            canvas.style.display = "none";
            cancelAnimationFrame(animationFrameId);
            animationFrameId = null;
        }
    }

    function triggerCelebration() {

    const FIREWORK_COLORS = [

    ];

    class FireworkRocket {
        constructor() {
            this.x = Math.random() * (canvas.width * 0.8) + (canvas.width * 0.1);
            this.y = canvas.height;
            this.targetY = Math.random() * (canvas.height * 0.5) + (canvas.height * 0.1); // Explodes in upper half

        update() {

        fireworks = [];

        for (let i = 0; i < 4; i++) {
            setTimeout(() => {
                fireworks.push(new FireworkRocket());
            }, i * 250); // Staggered launches
        }
    }

    function render() {

<script>
(function(){
    "use strict";

    /* ==========================================
       1. BLACKLIST (BL) STATE & CONFIG
    ========================================== */
    let blEnabled = true; // Toggle state: off by default

    const RAW_BLACKLIST_TEXT = `
~16.2

Green Jirayu

Orange Setthawut

Orange Theerapatch

Orange Theeraphat

Orange Pannatat

Red Thanakrit

Red Nakhun

Red Boonpipon

Red Warawat

Purple Tarzan



~15.3

Blue Akkravich

Blue Thanakorn
    `;

    function parseBlacklist(text) {
        const set = new Set();
        text.split(/\r?\n/).forEach(line => {
            let clean = line.trim();
            if (!clean || clean.startsWith("#")) return;
            const parts = clean.split(/\s+/);
            set.add(parts[parts.length - 1].toLowerCase());
        });
        return set;
    }

    let blacklistedNames = parseBlacklist(RAW_BLACKLIST_TEXT);

    /* ==========================================

        modal.style.display = "none";
    };

    });

    function updateButtonStates() {
        const btnLeft = document.getElementById("blLeftBtn");
        const btnRight = document.getElementById("blRightBtn");
        
        [btnLeft, btnRight].forEach(btn => {
            if (!btn) return;
            if (blEnabled) {
                btn.classList.add("active");
                btn.textContent = "BL [ON]";
            } else {
                btn.classList.remove("active");
                btn.textContent = "BL [OFF]";
            }
        });
    }

    function toggleBL() {
        blEnabled = !blEnabled;
        updateButtonStates();
    }

    function injectBLButtons() {
        const leftColumn = document.getElementById("leftColumn");

        if(leftColumn && !document.getElementById("blLeftBtn")) {

    if(document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", injectBLButtons);
    } else {
        injectBLButtons();
    }

    /* ==========================================
       3. BULLETPROOF SELECTION INTERCEPTION
    ========================================== */
    function isBlacklisted(name) {
        if (!blEnabled) return false;
        if (!name) return false;
        const clean = name.toString().trim().toLowerCase();
        for (let b of blacklistedNames) {
            if (clean === b || clean.includes(b)) return true;
        }
        return false;
    }

    // Hook into `nextStudent` to automatically skip blacklisted students in the queue / tab selection
    if (typeof window.nextStudent === "function") {
        const originalNextStudent = window.nextStudent;
        window.nextStudent = function() {
            if (!blEnabled) return originalNextStudent.apply(this, arguments);

            // Run original picker, but if it lands on a blacklisted student, keep spinning/skipping until a valid one is found
            let safety = 0;
            do {
                originalNextStudent.apply(this, arguments);
                safety++;
                // Check current tile name
                const tile = document.querySelector(".studentTile");
                if (!tile || !isBlacklisted(tile.textContent)) break;
            } while (safety < 20);
        };
    }

    // Bulletproof Wheel Interception: Ensures the wheel target / winner is NEVER blacklisted
    setInterval(() => {
        if (!blEnabled) return;

        // 1. If Wheel object is active and picks a winner
        if (typeof Wheel !== "undefined" && Wheel.spinning === false) {
            if (Wheel.currentName && isBlacklisted(Wheel.currentName)) {
                // Force shift to next valid student in queue
                if (typeof window.nextStudent === "function") {
                    window.nextStudent();
                    const tile = document.querySelector(".studentTile");
                    if (tile) Wheel.currentName = tile.textContent.trim();
                }
            }
        }
    }, 100);

})();
</script>

<script>

        const overlay = getSpinnerOverlay();
        return overlay && overlay.style.display === "flex";
    }

    function manageShields() {
        const open = isSpinnerOpen();

        if (open) {
            // 1. Force Spinner Overlay underneath the Answer Unit
            const spinner = getSpinnerOverlay();
            if (spinner) {
                spinner.style.setProperty("z-index", "100000", "important");
            }

            // 2. Ensure Answer Modal sits above the spinner
            const answerModal = document.getElementById("pAnswerModal");
            if (answerModal) {
                answerModal.style.setProperty("position", "absolute", "important");
                answerModal.style.setProperty("z-index", "100001", "important");
            }

            // 3. Tally shields base z-index (under spinner and answer unit)
            const targetZ = 99999;

            if (shields.length === 0) {
                // Create shields on open
                const targets = document.querySelectorAll(".studentTile, #tmTile, #pGrabDot");

                targets.forEach(el => {
                    const rect = el.getBoundingClientRect();
                    if (rect.width === 0 || rect.height === 0) return;

                    const computed = window.getComputedStyle(el);
                    const shield = document.createElement("div");

                    shield.style.position = "fixed";
                    shield.style.left = rect.left + "px";
                    shield.style.top = rect.top + "px";
                    shield.style.width = rect.width + "px";
                    shield.style.height = rect.height + "px";
                    shield.style.pointerEvents = "none"; // Click-through
                    shield.style.display = "flex";
                    shield.style.alignItems = "center";
                    shield.style.justifyContent = "center";
                    shield.style.boxSizing = "border-box";
                    shield.style.borderRadius = computed.borderRadius;

                    // Apply specific styling and z-index per element type
                    if (el.id === "tmTile") {
                        shield.style.background = "#2563eb";
                        shield.style.border = "1px solid #ffffff";
                        shield.style.color = "#ffffff";
                        shield.style.fontFamily = "Arial, sans-serif";
                        shield.style.fontSize = "11px";
                        shield.style.fontWeight = "bold";
                        shield.textContent = "Spin";
                        shield.style.zIndex = targetZ;
                    } else if (el.classList.contains("studentTile")) {
                        shield.style.background = "#000000";
                        shield.style.border = "1px solid #ffffff";
                        shield.style.color = "#ffffff";
                        shield.style.fontFamily = "Arial, sans-serif";
                        shield.style.fontSize = "9px";
                        shield.style.fontWeight = "bold";
                        shield.textContent = "Spin";
                        shield.style.zIndex = targetZ;
                    } else if (el.id === "pGrabDot") {
                        shield.style.background = "#ff0000";
                        shield.style.border = "none";
                        shield.textContent = "";
                        // Put the red grab dot shield ABOVE the answer configuration (100001)

    const dy = e.clientY - startY;

    if (!hasMoved && (Math.abs(dx) > 2 || Math.abs(dy) > 2)) {

      modal.style.setProperty("right", "auto", "important");

      modal.style.setProperty("top", rect.top + "px", "important");
      modal.style.setProperty("height", rect.height + "px", "important");

      modal.style.setProperty("top", (initialTop + (e.clientY - startY)) + "px", "important");
