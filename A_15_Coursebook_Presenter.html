<style>

*{

}

html,body{

/* ==========================
   MAIN LAYOUT
========================== */

#main{
    display:flex;
    position: absolute;
    top: 0;
    left: 0;
    right: 0;

   LEFT COLUMN
========================== */

#leftColumn{
    width:90px;
    min-width:90px;
    background:black !important;
    border-right:1px solid #999;
    display:flex;
    flex-direction:column;
    justify-content:flex-start;
    position: relative;
}

/* ==========================
   RIGHT COLUMN
========================== */

#rightColumn{
    width:90px;
    min-width:90px;
    background:black !important;
    border-left:1px solid #999;
    display:flex;
    flex-direction:column;
    justify-content:flex-start;
    position: relative;
}

#clearBoardBtn,
#clearBoardBtnRight{
    height:24px;
    font-size:10px;
    border:none;
    border-bottom:1px solid #999;
    cursor:pointer;
}

/* ==========================
   UNIT FOLDERS & FLYOUTS
========================== */
.unitFolderContainer {
    position: static;
    width: 100%;
}

.unitFolderBtn {
    width: 100%;
    height: 22px;
    font-size: 9px;
    background: black;
    color: white;
    border: none;
    border-bottom: 1px solid #333;
    cursor: pointer;
    text-align: center;
}

.unitFolderBtn:hover {
    background: #fdfdfd !important;
    color: #111 !important;
}

.spreadFlyout {
    display: none;
    position: absolute;
    left: 90px;
    top: 0;
    width: 140px;
    max-height: calc(100vh - 124px);
    background: black;
    border: 1px solid #555;
    z-index: 20000;
    overflow-y: auto;
    box-shadow: 2px 2px 10px rgba(0,0,0,0.8);
}

#rightColumn .spreadFlyout {
    left: auto;
    right: 90px;
}

.spreadFlyout.active {
    display: flex;
    flex-direction: column;
}

.spreadFlyoutItem {
    padding: 6px 8px;
    font-size: 10px;
    color: white;
    background: black;
    border-bottom: 1px solid #222;
    cursor: pointer;
    text-align: center;
    white-space: nowrap;
}

.spreadFlyoutItem:hover {
    background: #4a90e2 !important;
    color: white !important;
}

/* Unit Grid Layout Container (2 columns) */
.unitGrid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 1px;
    background: #333;
    padding: 1px;
}

/* ==========================
   VIEWER
========================== */

#viewer{
    flex:1;
    overflow:hidden;
    background:black;
    position:relative;
    cursor: move;
    touch-action:none;
}

#spread{
    position:absolute;
    top:0;
    left:0;
    height:100%;
    white-space:nowrap;
    font-size:0;
}

/* ==========================
   PAGES
========================== */

.imagePanel{
    display:inline-block;
    height:100%;
}

.imgWrap{
    width:100%;
    height:100%;
    overflow:hidden;
    position:relative;
    display:flex;
    justify-content:center;
    align-items:center;
}

.pageImage{
    display:block;
    height:100%;
    max-height:100%;
    width:auto;
    object-fit:contain;
    pointer-events: none;
}
.leftPage{
    left:0;
    width:100%;
    clip-path: none;
}

.rightPage{
    left:0;
    width:100%;
    clip-path: none;
}
/* ==========================
   TILES
========================== */

#tilesBar {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 24px;
    height: 8px; /* Loads closed */
    display: flex;
    flex-direction: column;
    border-top: 1px solid #555;
    background: #222; /* Instantly paints the grey bar on first frame */
    z-index: 9998;
    box-sizing: border-box;
    overflow: hidden; /* Keeps the tiles hidden until dragged open */
}
#tiles{
    flex: 1;
    background: black !important;
    display: flex;
    flex-wrap: wrap;
    gap: 2px;
    padding: 4px;
    overflow-y: auto;
    overflow-x: hidden;
    align-content: flex-start;
    justify-content: flex-start;
}
.tile{
    min-width:8ch;
    height:14px;
    line-height:14px;
    font-size:9px;
    padding:0 4px;
    margin:0;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    background:#E8D8B5;
    border:1px solid #B99F6B;
    color:#222;
    cursor:pointer;
    white-space:nowrap;
    user-select:none;
}

.tile.selected{
    background:#4a90e2 !important;
    border-color:#2f6fb7;
    color:white !important;
}

/* Designated Prefix Tile Colors */
.tile[data-prefix="~I"] {
    background: #e74c3c !important;
    border-color: #c0392b !important;
    color: white !important;
}

/* Emoji (~E) -> Orange */
.tile[data-prefix="~E"] {
    background: #e67e22 !important;
    border-color: #d35400 !important;
    color: white !important;
}

.tile[data-prefix="~SP"] {
    background: #2ecc71 !important;
    border-color: #27ae60 !important;
    color: white !important;
}

/* Sound Effects (~SX) -> Green */
.tile[data-prefix="~SX"] {
    background: #2ecc71 !important;
    border-color: #27ae60 !important;
    color: white !important;
}

#tilesResizeBar{
    height: 8px;
    width: 100%;
    background: #999;
    cursor: ns-resize;
    flex-shrink: 0;
    z-index: 10001;
}/* ==========================
   DRAGGABLES
========================== */

.draggable {
    position: absolute;
    z-index: 9999;
    cursor: move;
    user-select: none;
    -webkit-user-drag: none;
    touch-action: none;
    transition: none !important;
    animation: none !important;
    filter: none !important;
    transform: none !important;
}

.overlayPng {
    position: absolute;
    width: 140px;
    height: auto;
    background: transparent !important;
    border: none !important;
    padding: 0 !important;
    margin: 0 !important;
    display: block;
    pointer-events: auto;
    object-fit: contain;
}

img {
    -webkit-user-drag: none;
    -webkit-touch-callout: none;
}

#viewer, #spread, .imagePanel, .imgWrap {
    user-select: none;
    -webkit-user-select: none;
    -ms-user-select: none;
}

#deleteBtn,
#deleteBtnRight {
    width:100%;
    height:24px;
    font-size:10px;
    border:none;
    border-bottom:1px solid #999;
    cursor:pointer;
    background:black;
    color:white;
}

#scriptBar{
    position:fixed;
    left:0;
    right:0;

#scriptResizeBar{

#worksheetScript{

#downloadTxtBtn{

/* --- Inset Control Buttons & Borderless Vignette Panels --- */

/* --- Borderless packed vertical modal panels (200px wide, locked under top controls) --- */
/* --- Borderless packed vertical modal panels --- */
/* ==========================
   VIGNETTE MODAL PANELS & DRAG HANDLE
========================== */

.vignette-modal-panel {
  display: none;
  position: fixed;
  width: 200px;
  top: 25px;
  /* bottom: 48px; Removed so height is controlled strictly by content */
  background: #000;
  border: 1px solid #444;
  z-index: 2147483646;
  flex-direction: column;
  overflow: hidden;
  box-shadow: 0 8px 24px rgba(0,0,0,0.5);
  border-radius: 6px;
  box-sizing: border-box;
}

.vignette-modal-panel.open {
  display: flex;
}
/* Left Panel positioning */
#vignetteLeftModal {
  left: 90px;               /* Sits immediately to the right of #leftColumn (90px wide) */
}

/* Right Panel positioning - Locked flush against the left edge of #rightColumn (90px wide) */
#vignetteRightModal {
  right: 90px;              /* Matches the exact width of #rightColumn */
  left: auto !important;    /* Prevents any script from overriding */
}

/* Distinct Drag Title Bar for precise control */
.vignette-drag-handle {
  height: 24px;
  background: #1a1a1a;
  color: #fff;
  cursor: grab;
  width: 100%;
  flex-shrink: 0;
  border-bottom: 1px solid #444;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: Arial, sans-serif;
  font-size: 10px;
  font-weight: bold;
  letter-spacing: 1px;
  touch-action: none;
  user-select: none;
}
.vignette-drag-handle:active {
  cursor: grabbing;
  background: #333;
}

/* Zero padding, zero margin packed scroll container */
.vignette-scroll-box {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 0;
  margin: 0;
  display: flex;
  flex-direction: column;
  gap: 0;
  scrollbar-width: none;
}

.vignette-scroll-box::-webkit-scrollbar {
  display: none;
}

/* Packed 200px by 200px iframe items with zero borders/margins */
.vignette-card {
  width: 200px;
  height: 200px;
  min-width: 200px;
  min-height: 200px;
  margin: 0;
  padding: 0;
  border: none;
  background: #000;
  display: block;
  position: relative;
  flex-shrink: 0;
}

.vignette-card iframe {
  width: 200px;
  height: 200px;
  border: none;
  margin: 0;
  padding: 0;
  transform: none;          /* No scaling needed; full 200px size */
  pointer-events: auto;     /* Enables direct interaction */
}</style>

timer.id="miniTimer";


timer.innerHTML=`

<span id="miniDown">▼</span>

<span id="miniTimerTime">00:00</span>

<span id="miniUp">▲</span>

`;


document.body.appendChild(timer);



let seconds = 0;

let interval = null;



const display =
document.getElementById("miniTimerTime");



let audioCtx = null;



function initAudio(){

    if(!audioCtx){

        audioCtx =
        new (window.AudioContext || window.webkitAudioContext)();

    }


    if(audioCtx.state === "suspended"){

        audioCtx.resume();

    }

}



/* ==========================
   UPDATE DISPLAY
========================== */

function update(){

    let m=Math.floor(seconds/60);

    let s=seconds%60;


    display.textContent =
    String(m).padStart(2,"0")
    +":"
    +String(s).padStart(2,"0");

}



/* ==========================
   ELECTRONIC BUZZER
========================== */

function playBuzzer(){

    if(!audioCtx)
        return;


    const osc =
    audioCtx.createOscillator();


    const gain =
    audioCtx.createGain();


    osc.type="square";

    osc.frequency.value=900;


    gain.gain.setValueAtTime(
        0.3,
        audioCtx.currentTime
    );


    gain.gain.exponentialRampToValueAtTime(
        0.001,
        audioCtx.currentTime + 0.8
    );


    osc.connect(gain);

    gain.connect(audioCtx.destination);


    osc.start();

    osc.stop(
        audioCtx.currentTime + 0.8
    );

}



/* ==========================
   START COUNTDOWN
========================== */

function start(){

    if(interval)
        clearInterval(interval);


    interval=setInterval(()=>{


        seconds--;

        update();


        if(seconds<=0){


            clearInterval(interval);

            interval=null;


            seconds=0;

            update();


            playBuzzer();


        }


    },1000);

}



/* ==========================
   CONTROLS
========================== */


document.getElementById("miniUp")
.onclick=function(){

    initAudio();


    seconds+=60;


    update();


    start();

};



document.getElementById("miniDown")
.onclick=function(){

    initAudio();


    seconds-=60;


    if(seconds<0)
        seconds=0;


    update();


    if(seconds>0)
        start();

};



update();



})();

</script>

let breakInterval=null;
let breakRemaining=300;


function openBreakModal(){

    const modal = document.getElementById("breakModal");


    if(modal.style.display === "block"){

        // hide modal
        modal.style.display = "none";

        // optionally stop timer
        clearInterval(breakInterval);
        breakInterval = null;

        return;
    }


    // show modal
    modal.style.display = "block";

    startBreak();

}

function renderBreak(){

    let m=Math.floor(breakRemaining/60);

    let s=String(breakRemaining%60)
        .padStart(2,"0");

    document.getElementById("breakTimer")
        .textContent=`${m}:${s}`;

}

function adjustBreakTime(amount){

    /*
       If timer is finished,
       start a new countdown.
    */

    if(breakRemaining <= 0){

        startBreak(amount);

    }
    else{

        /*
           Add time to current countdown.
        */

        breakRemaining += amount;

        renderBreak();

    }


    /*
       Restart audio whenever + button is clicked.
    */

    if(typeof restartMusicAfterExtension === "function"){

        restartMusicAfterExtension();

    }

}



function startBreak(duration=300){

    clearInterval(breakInterval);


    /*
       Start new countdown duration.
       Works after Time's up.
    */

    breakRemaining = duration;

    renderBreak();


    breakInterval = setInterval(()=>{

        breakRemaining--;

        renderBreak();


        if(breakRemaining <= 0){

            clearInterval(breakInterval);

            breakInterval = null;


            document
            .getElementById("breakTimer")
            .textContent = "Time's up!";


            /*
               Keep value at zero so
               next + click starts a new break.
            */

            breakRemaining = 0;

        }

    },1000);

}

.getElementById("breakStart")
.onclick=()=>startBreak();

document
.getElementById("breakPlus")
.onclick=()=>adjustBreakTime(60);


document
.getElementById("breakMinus")

(function(){

let modal=document.getElementById("breakModal");

let dragging=false;

let offsetX=0;
let offsetY=0;

    dragging=true;

    offsetX=e.clientX-modal.offsetLeft;
    offsetY=e.clientY-modal.offsetTop;

    modal.style.left=

    modal.style.top=
        (e.clientY-offsetY)+"px";


    modal.style.transform="none";

});


document.addEventListener("mouseup",()=>{

});

// Automatically generate dynamic page pairs from raw file lists
function generateSpreads(fileList) {
    let focusFiles = [];
    let actImgFiles = [];

    fileList.forEach(file => {
        const upper = file.toUpperCase();
        
        // Filter out standalone placeholder blanks from appearing on their own
        if (upper === "WHITE_BLANK.JPG" || upper === "BLACK_BLANK.JPG") {
            return;
        }

        // Catch ACT or IMG files regardless of parentheses or prefix structure
        if (upper.startsWith("ACT") || upper.startsWith("IMG")) {
            actImgFiles.push(file);
        } else if (upper.startsWith("FOCUS") || upper.includes("(")) {
            focusFiles.push(file);
        }
    });

    let pairs = [];

    // Pair regular sequential files into spreads of 2
    for (let i = 0; i < focusFiles.length; i += 2) {
        if (i + 1 < focusFiles.length) {
            pairs.push([focusFiles[i], focusFiles[i + 1]]);
        } else {
            pairs.push([focusFiles[i], "WHITE_BLANK.jpg"]);
        }
    }

    // Pair ACT or IMG files automatically according to naming indicator (+BLACK / +WHITE)
    actImgFiles.forEach(file => {
        let blankChoice = "WHITE_BLANK.jpg";
        if (file.toUpperCase().includes("+BLACK") || file.toUpperCase().includes("BLACK")) {
            blankChoice = "BLACK_BLANK.jpg";
        }
        pairs.push([file, blankChoice]);
    });

    return pairs;
}

        const flyout = document.createElement("div");

        const unitSpreads = generateSpreads(rawUnitFiles[unitName]);
        unitSpreads.forEach(([leftFile, rightFile]) => {
            const spreadItem = document.createElement("div");
            spreadItem.className = "spreadFlyoutItem";
            
            const cleanLeft = leftFile.replace(/\.[^/.]+$/, "");
            const cleanRight = rightFile.replace(/\.[^/.]+$/, "");
            spreadItem.textContent = `${cleanLeft} - ${cleanRight}`;
            
            spreadItem.onclick = (e) => {
                e.stopPropagation();
                loadSpread(`${unitName}/${leftFile}`, `${unitName}/${rightFile}`);
                document.querySelectorAll(".spreadFlyout").forEach(f => f.classList.remove("active"));
            };
            flyout.appendChild(spreadItem);
        });

        folderBtn.onclick = (e) => {
            e.stopPropagation();
            const isOpen = flyout.classList.contains("active");
            document.querySelectorAll(".spreadFlyout").forEach(f => f.classList.remove("active"));
            if (!isOpen) {
                flyout.style.top = "0px";
                flyout.classList.add("active");
            }
        };

        folderWrapper.appendChild(folderBtn);
        folderWrapper.appendChild(flyout);
        container.appendChild(folderWrapper);
    });
}

}/* ==========================
   FEATURE 5: ZOOM, PAN & CAMERA CLAMPING
========================== */

let viewerScale = 1;
let panX = 0;
let panY = 0;
let panLocked = false;
let isPanning = false;
let lastX = 0;
let lastY = 0;

window.spread = document.getElementById("spread");
const viewer = document.getElementById("viewer");

const zoomSelects = document.querySelectorAll("#zoomSelect, #zoomSelectRight, .zoomSelect");

zoomSelects.forEach(select => {
    select.addEventListener("change", function(){
        viewerScale = Number(this.value);
        zoomSelects.forEach(s => s.value = this.value);
        updateTransform();
    });
});

function updateTransform(){
    if (!spread) return;
    spread.style.transform = `translate(${panX}px, ${panY}px) scale(${viewerScale})`;
    spread.style.transformOrigin = "0 0";
}

if (viewer) {
    viewer.addEventListener("pointerdown", (e) => {
        if(e.target.classList.contains("draggable")) return;
        if(placeMode) return;
        if(panLocked) return;
        if(e.button !== 0) return;

        isPanning = true;
        lastX = e.clientX;
        lastY = e.clientY;
        viewer.setPointerCapture(e.pointerId);
    });

    viewer.addEventListener("pointermove", (e) => {
        if (panLocked) return;
        if (!isPanning) return;

        const dx = e.clientX - lastX;
        const dy = e.clientY - lastY;

        panX += dx;
        panY += dy;

        lastX = e.clientX;
        lastY = e.clientY;

        if (spread) {
            const rect = viewer.getBoundingClientRect();
            const contentW = spread.offsetWidth * viewerScale;
            const contentH = spread.offsetHeight * viewerScale;
            const viewW = rect.width;
            const viewH = rect.height;

            if (contentW <= viewW) {
                panX = (viewW - contentW) / 2;
            } else {
                panX = Math.max(viewW - contentW, Math.min(0, panX));
            }

            if (contentH <= viewH) {
                panY = (viewH - contentH) / 2;
            } else {
                panY = Math.max(viewH - contentH, Math.min(0, panY));
            }
        }

        updateTransform();
    }, true);

viewer.addEventListener("wheel", function(e){
    if(panLocked) return;
    e.preventDefault();

    panX -= e.deltaX;
    panY -= e.deltaY;

    if (spread) {
        const rect = viewer.getBoundingClientRect();
        const contentW = spread.offsetWidth * viewerScale;
        const contentH = spread.offsetHeight * viewerScale;
        const viewW = rect.width;
        const viewH = rect.height;

        // Horizontal boundaries
        if (contentW <= viewW) {
            panX = (viewW - contentW) / 2;
        } else {
            panX = Math.max(
                viewW - contentW,
                Math.min(0, panX)
            );
        }

        // Vertical boundaries
        if (contentH <= viewH) {
            panY = (viewH - contentH) / 2;
        } else {
            panY = Math.max(
                viewH - contentH,
                Math.min(0, panY)
            );
        }
    }

    updateTransform();
}, { passive: false });;

    viewer.addEventListener("pointerup", (e) => {
        isPanning = false;
        if (e.pointerId) {
            try { viewer.releasePointerCapture(e.pointerId); } catch(err) {}
        }
    });
}

/* ==========================
   MAIN BUILD FUNCTION (Sequential)
========================== */

function buildAllTiles() {
    const tileArea = document.getElementById("tiles");
    if (!tileArea) return;

    tileArea.innerHTML = ""; // Clear existing tiles

    const rawInput = document.getElementById("worksheetScript");
    if (!rawInput || !rawInput.value) return;

    let fullText = rawInput.value;
    let lines = fullText.split(/\r?\n/);

    // 1. Find and extract any "Unit ..." line so we can force it to the top
    let unitLineIndex = -1;
    let unitLineText = "";
    
    for (let i = 0; i < lines.length; i++) {
        let l = lines[i].trim();
        if (/^unit\s*\d+/i.test(l) && !l.startsWith("~") && !l.includes("-")) {
            unitLineText = l;
            unitLineIndex = i;
            break;
        }
    }

    // If found, remove it from its current position so we can place it first
    if (unitLineIndex !== -1) {
        lines.splice(unitLineIndex, 1);
    }

    // Helper function to render a single line into a tile
    function renderLineToTile(rawLine) {
        let line = rawLine.trim();
        if (!line) return;

// 1. HANDLE EXTERNAL MP3 FILES (~SP)
        if (/^~SP/i.test(line)) {
            let cleanLine = line.replace(/^~SP/i, "").trim();
            if (cleanLine.startsWith(".")) {
                cleanLine = "P" + cleanLine;
            } else if (/^\d/.test(cleanLine)) {
                cleanLine = "P." + cleanLine;
            }
            cleanLine = cleanLine.replace(/^[-–—]\s*/, "").trim();
            
            let match = cleanLine.match(/^(.+?)\s*[-–—]\s*(.+?\.mp3)\s*$/i);
            let label = match ? match[1].trim() : cleanLine.replace(/\.[^.]+$/, "");
            let file = match ? match[2].trim() : cleanLine;

            const tile = document.createElement("div");
            tile.className = "tile mp3Tile";
            tile.setAttribute("data-prefix", "~SP");
            tile.textContent = label;
            tile.onclick = function() {
                let audioPath = file;
                if (/^[A-Z]:\\/i.test(audioPath)) {
                    audioPath = "file:///" + audioPath.replace(/\\/g, "/");
                }
                window.open(audioPath);
            };
            tileArea.appendChild(tile);
            return;
        }

        // 2. HANDLE INTERNAL TOGGLE-TO-STOP SOUND FILES (~S, ~SX, etc.)
        if (/^~S[A-Za-z0-9]*/i.test(line)) {
            let prefixMatch = line.match(/^~([A-Za-z0-9]+)/i);
            let extractedPrefix = prefixMatch ? "~" + prefixMatch[1].toUpperCase() : "~S";

            let cleanLine = line.replace(/^~S[A-Za-z0-9]*/i, "").trim();
            cleanLine = cleanLine.replace(/^[-–—]\s*/, "").trim();
            
            let buttonMatch = cleanLine.match(/^(.+?)\s*[-–—]\s*(.+?\.(?:mp3|wav|ogg|m4a))\s*$/i);
            
            let label, file;
            if (buttonMatch) {
                label = buttonMatch[1].trim();
                file = buttonMatch[2].trim();
            } else {
                file = cleanLine;
                label = file.replace(/\.[^.]+$/, "");
            }

            const tile = document.createElement("button");
            tile.type = "button";
            tile.className = "tile soundTile";
            tile.setAttribute("data-prefix", extractedPrefix);
            tile.textContent = label;

            tile.onclick = function() {
                const player = getSoundPlayer();

                if (tile.classList.contains("selected") && !player.paused) {
                    player.pause();
                    player.currentTime = 0;
                    tile.classList.remove("selected");
                    return;
                }

                document.querySelectorAll(".soundTile.selected").forEach(t => {
                    t.classList.remove("selected");
                });

                tile.classList.add("selected");

                let audioPath = file;
                if (/^[A-Z]:\\/i.test(audioPath)) {
                    audioPath = "file:///" + audioPath.replace(/\\/g, "/");
                }

                player.pause();
                player.currentTime = 0;
                player.src = audioPath;
                player.load();
                player.play().catch(err => console.log("Sound play error:", err));
            };

            tileArea.appendChild(tile);
            return;
        }

        // 3. HANDLE EMOJI INPUTS (~E)
        if (/^~E/i.test(line)) {
            let cleanLine = line.replace(/^~E/i, "").trim();
            cleanLine = cleanLine.replace(/^[-–—]\s*/, "").trim();

            let emojiMatch = cleanLine.match(/^(.+?)\s*=\s*(\d+(?:px|em|rem)?)$/);
            let emojiChar = emojiMatch ? emojiMatch[1].trim() : cleanLine.split("=")[0].trim();
            let sizeVal = emojiMatch ? emojiMatch[2].trim() : "32px";
            if (/^\d+$/.test(sizeVal)) sizeVal += "px";

            const tile = document.createElement("div");
            tile.className = "tile emojiTile";
            tile.setAttribute("data-prefix", "~E");
            tile.textContent = emojiChar;

            tile.onclick = function() {
                document.querySelectorAll("#tiles .tile").forEach(t => t.classList.remove("selected"));
                tile.classList.add("selected");
                window.placeMode = { 
                    type: "emoji", 
                    value: emojiChar, 
                    size: sizeVal 
                };
                window.selectedEl = null;
            };

            tileArea.appendChild(tile);
            return;
        }

// Handle generic leading tilde tags for text/images if present
        let prefixTag = "";
        if (line.startsWith("~")) {
            // If it's a page reference like ~P.52, only remove the tilde '~', leave 'P.52'
            if (/^~P\./i.test(line)) {
                line = line.replace(/^~/, "").trim();
            } else {
                let matchTag = line.match(/^~([A-Za-z0-9]+)/);
                if (matchTag) prefixTag = "~" + matchTag[1].toUpperCase();
                line = line.replace(/^~[A-Za-z0-9]*/i, "").trim();
            }
        }

        // 4. HANDLE IMAGE INPUTS (~I, ~IA, etc.)
        let imageMatch = line.match(/^([A-Za-z0-9]+)?\s*[-–—]\s*(.+\.(png|jpg|jpeg))$/i);
        if (imageMatch) {
            let filename = imageMatch[2].trim();
            let label = filename.replace(/\.(png|jpg|jpeg)$/i, "").trim();

            const tile = document.createElement("div");
            tile.className = "tile imageTile";
            tile.setAttribute("data-prefix", prefixTag || "~I");
            tile.textContent = label;

            tile.onclick = function() {
                document.querySelectorAll("#tiles .tile").forEach(t => t.classList.remove("selected"));
                tile.classList.add("selected");
                window.placeMode = { type: "image", value: filename };
                window.selectedEl = null;
            };

            tileArea.appendChild(tile);
            return;
        }

        // 5. HANDLE STANDARD TEXT INPUTS (Label before dash, value after dash)
        let dashMatch = line.match(/^(.+?)\s*[-–—]\s*(.+)$/);
        if (dashMatch) {
            let label = dashMatch[1].trim();
            let value = dashMatch[2].trim();

            const tile = document.createElement("div");
            let prefixClass = prefixTag ? " tile-" + prefixTag.replace("~", "").toLowerCase() : "";
            tile.className = "tile" + prefixClass;
            if (prefixTag) tile.setAttribute("data-prefix", prefixTag);
            tile.textContent = label;

            tile.onclick = function() {
                document.querySelectorAll("#tiles .tile").forEach(t => t.classList.remove("selected"));
                tile.classList.add("selected");
                window.placeMode = { type: "text", value: value };
                window.selectedEl = null;
            };

            tileArea.appendChild(tile);
            return;
        }
    }

    // 2. Render the Unit header first if it was found
    if (unitLineText) {
        const tile = document.createElement("div");
        tile.className = "tile headerTile";
        tile.textContent = unitLineText;

        tile.onclick = function() {
            document.querySelectorAll("#tiles .tile").forEach(t => t.classList.remove("selected"));
            tile.classList.add("selected");
            window.placeMode = { type: "text", value: unitLineText };
            window.selectedEl = null;
        };

        tileArea.appendChild(tile);
    }

    // 3. Process Note blocks and sequential lines in their exact relative order
    let inNoteBlock = false;
    let currentNoteLines = [];

    lines.forEach(rawLine => {
        let line = rawLine.trim();

        // Check if we are starting a ~Note block
        if (/^~Note/i.test(line)) {
            if (inNoteBlock && currentNoteLines.length > 0) {
                renderNoteTile(currentNoteLines.join("\n"));
                currentNoteLines = [];
            }
            inNoteBlock = true;
            currentNoteLines.push(line);
            return;
        }

        if (inNoteBlock && line.startsWith("~")) {
            renderNoteTile(currentNoteLines.join("\n"));
            currentNoteLines = [];
            inNoteBlock = false;
        }

        if (inNoteBlock) {
            if (line) currentNoteLines.push(line);
            return;
        }

        renderLineToTile(rawLine);
    });

    if (inNoteBlock && currentNoteLines.length > 0) {
        renderNoteTile(currentNoteLines.join("\n"));
    }

    function renderNoteTile(noteBodyText) {
        let noteContent = "~Note: " + noteBodyText.replace(/^~Note:?\s*/i, "").trim();
        let displayLines = noteBodyText.replace(/^~Note:?\s*/i, "").trim().split(/\r?\n/);
        let label = displayLines[0] ? displayLines[0].trim() : "Note";
        if (label.startsWith("-")) label = label.replace(/^[-–—]\s*/, "").trim();
        if (label.length > 30) label = label.substring(0, 27) + "...";

        const tile = document.createElement("div");
        tile.className = "tile noteTile";
        tile.setAttribute("data-prefix", "~Note");
        tile.textContent = label || "Note";

        tile.onclick = function() {
            document.querySelectorAll("#tiles .tile").forEach(t => t.classList.remove("selected"));
            tile.classList.add("selected");
            if (window.openNoteModal) {
                window.openNoteModal(noteContent);
            }
        };

        tileArea.appendChild(tile);
    }
}/* ==========================
   AUTO-LOAD & LIVE INPUT LISTENERS
========================== */

document.addEventListener("DOMContentLoaded", () => {
    const worksheetInput = document.getElementById("worksheetScript");
    if (worksheetInput) {
        buildAllTiles();
        worksheetInput.addEventListener("input", buildAllTiles);
    }
});

if (typeof viewer !== "undefined" && viewer) {
    viewer.addEventListener("pointerdown", function(e){
        const target = e.target;

        if (target.classList.contains("draggable")) {
            e.stopPropagation();
            window.selectedEl = target;
            window.placeMode = null;
            return;
        }

        if (!window.placeMode) return;

        const rect = spread.getBoundingClientRect();
        const x = (e.clientX - rect.left) / viewerScale;
        const y = (e.clientY - rect.top) / viewerScale;

        let obj;
        if (window.placeMode.type === "image") {
            obj = document.createElement("img");
            obj.src = window.placeMode.value;
            obj.className = "draggable overlayPng";
            obj.style.width = "140px";
        } else if (window.placeMode.type === "emoji") {
            obj = document.createElement("div");
            obj.className = "draggable emojiOverlay";
            obj.textContent = window.placeMode.value;
            obj.style.background = "transparent";
            obj.style.border = "none";
            obj.style.boxShadow = "none";
            obj.style.outline = "none";
            obj.style.fontSize = window.placeMode.size;
            obj.style.display = "inline-block";
            obj.style.lineHeight = "1";
            obj.style.padding = "0";
            obj.style.margin = "0";
            obj.style.userSelect = "none";
        } else {
            obj = document.createElement("div");
            obj.className = "draggable tile tileAnchor placedTile";
            obj.textContent = window.placeMode.value;
        }

        obj.style.left = x + "px";
        obj.style.top = y + "px";
        spread.appendChild(obj);
        enableDragging(obj);

        window.selectedEl = obj;
        window.placeMode = null;
    });
}


/* ==========================
   DRAGGING
========================== */

function enableDragging(el){
    el.addEventListener("pointerdown", function(e){
        e.stopPropagation();
        window.selectedEl = el;

        const rect = spread.getBoundingClientRect();
        const offsetX = (e.clientX - rect.left) / viewerScale - parseFloat(el.style.left);
        const offsetY = (e.clientY - rect.top) / viewerScale - parseFloat(el.style.top);

        function move(ev){
            el.style.left = ((ev.clientX - rect.left) / viewerScale - offsetX) + "px";
            el.style.top = ((ev.clientY - rect.top) / viewerScale - offsetY) + "px";
        }

        function up(){
            window.removeEventListener("pointermove", move);
            window.removeEventListener("pointerup", up);
        }

        window.addEventListener("pointermove", move);
        window.addEventListener("pointerup", up);
    });
}

    // 2. Inject HTML Markup
    const modalHTML = `
        <div id="pAnswerModal" style="display: none;" tabindex="0">

        </div>
    `;
    const div = document.createElement('div');
    div.innerHTML = modalHTML;
    
    const spreadContainer = document.querySelector('#displayArea') || document.body;
    if (spreadContainer !== document.body && getComputedStyle(spreadContainer).position === 'static') {
        spreadContainer.style.position = 'relative';
    }
    spreadContainer.appendChild(div);

    function setupTriggerButtons() {
        const btnIds = ['loadAnswerBtn', 'loadAnswerBtnRight'];
        btnIds.forEach(id => {
            const triggerBtn = document.getElementById(id);
            if (triggerBtn && !triggerBtn.hasAttribute('data-modal-bound')) {
                triggerBtn.setAttribute('data-modal-bound', 'true');
                triggerBtn.addEventListener('click', () => {
                    parsePAnswers();
                    const modal = document.getElementById('pAnswerModal');
                    modal.style.display = 'inline-flex';
                    modal.focus();
                });
            }
        });
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', setupTriggerButtons);
    } else {
        setupTriggerButtons();
    }

    const observer = new MutationObserver(setupTriggerButtons);
    observer.observe(document.body, { childList: true, subtree: true });

    let pAnswers = [];
    let currentIndex = 0; 

    function parsePAnswers() {
        const scriptArea = document.getElementById('worksheetScript');
        if (!scriptArea) {
            pAnswers = [];
            return;
        }
        const lines = scriptArea.value.split('\n');
        pAnswers = [];
        
        let currentBlock = [];
        let capturing = false;

        lines.forEach(line => {
            let trimmed = line.trim();

            if (trimmed.startsWith('~P')) {
                if (capturing) {
                    pAnswers.push(currentBlock.join('\n').trim());
                    currentBlock = [];
                }
                capturing = true;
                let content = trimmed.substring(2).trim();
                if (content.startsWith('.')) {
                    content = content.substring(1).trim();
                }
                currentBlock.push("P. " + content);
            } else if (capturing) {
                if (trimmed.startsWith('~')) {
                    capturing = false;
                    if (currentBlock.length > 0) {
                        pAnswers.push(currentBlock.join('\n').trim());
                        currentBlock = [];
                    }
                    if (trimmed.startsWith('~P')) {
                        capturing = true;
                        let content = trimmed.substring(2).trim();
                        if (content.startsWith('.')) {
                            content = content.substring(1).trim();
                        }
                        currentBlock.push("P. " + content);
                    }
                } else {
                    currentBlock.push(line);
                }
            }
        });

        if (capturing && currentBlock.length > 0) {
            pAnswers.push(currentBlock.join('\n').trim());
        }

        currentIndex = 0;
        updatePModalDisplay();
    }

    function updatePModalDisplay() {
        const bodyEl = document.getElementById('pModalBody');
        const contentRow = document.getElementById('pModalContentRow');
        
        const currentWidth = contentRow.style.width;
        const currentHeight = contentRow.style.height;

        if (pAnswers.length === 0) {
            bodyEl.value = "None found";
        } else {
            bodyEl.value = pAnswers[currentIndex];
        }
        
        if (currentWidth) contentRow.style.width = currentWidth;
        if (currentHeight) contentRow.style.height = currentHeight;
    }

    document.getElementById('pModalBody').addEventListener('input', (e) => {
        if (pAnswers.length > 0) {
            pAnswers[currentIndex] = e.target.value;
        }
    });

document.getElementById('pNextBtn').addEventListener('click', (e) => {
        e.stopPropagation();
        if (pAnswers.length === 0) return;
        currentIndex = (currentIndex + 1) % pAnswers.length;
        updatePModalDisplay();
        
        // Only trigger spinner if the wheel overlay is actually open and visible
        const wheelOverlay = document.getElementById("studentWheelOverlay");
        if (wheelOverlay && wheelOverlay.style.display === "flex" && typeof spinWheel === "function") {

    });

    document.getElementById('pPrevBtn').addEventListener('click', (e) => {
        e.stopPropagation();
        if (pAnswers.length === 0) return;
        currentIndex = (currentIndex - 1 + pAnswers.length) % pAnswers.length;
        updatePModalDisplay();
        
        // Only trigger spinner if the wheel overlay is actually open and visible
        const wheelOverlay = document.getElementById("studentWheelOverlay");
        if (wheelOverlay && wheelOverlay.style.display === "flex" && typeof spinWheel === "function") {
            spinWheel();
        } else if (typeof window.nextStudent === 'function') {
            window.nextStudent();
        }
    });    document.getElementById('pSquareClearBtn').addEventListener('click', (e) => {

        const bodyEl = document.getElementById('pModalBody');

            bodyEl.value = "";
            if (pAnswers.length > 0) {
                pAnswers[currentIndex] = "";

    const modal = document.getElementById('pAnswerModal');
    const toggleArrow = document.getElementById('pToggleArrow');
    const centerWrapper = document.getElementById('pCenterWrapper');
    const squareClearBtn = document.getElementById('pSquareClearBtn');
    const grabDot = document.getElementById('pGrabDot');

    toggleArrow.addEventListener('click', (e) => {
        e.stopPropagation();
        if (toggleArrow.textContent.includes('◄')) {
            toggleArrow.textContent = '►';
            toggleArrow.style.marginLeft = '4px';
            toggleArrow.style.marginRight = '0';
            modal.insertBefore(grabDot, modal.firstChild);
            modal.insertBefore(squareClearBtn, centerWrapper);
            modal.appendChild(toggleArrow);
        } else {
            toggleArrow.textContent = '◄';
            toggleArrow.style.marginLeft = '0';
            toggleArrow.style.marginRight = '4px';
            modal.insertBefore(toggleArrow, modal.firstChild);
            modal.appendChild(squareClearBtn);
            modal.appendChild(grabDot);
        }
    });

    document.addEventListener('click', (e) => {
        if (e.target.matches('#clearBtn, .clear-btn, [id*="clear"], [class*="clear"]')) {
            if (modal) modal.style.display = 'none';
            pAnswers = [];
            currentIndex = 0;
        }
    });

    let isDragging = false, startX, startY;

    function startDrag(clientX, clientY, target) {
        if (target.tagName === 'BUTTON' || target.tagName === 'TEXTAREA') return;
        isDragging = true;
        startX = clientX - modal.offsetLeft;
        startY = clientY - modal.offsetTop;
    }

    function onDrag(clientX, clientY) {
        if (!isDragging) return;
        modal.style.left = `${clientX - startX}px`;
        modal.style.top = `${clientY - startY}px`;
    }

    function stopDrag() {
        isDragging = false;
    }

    modal.addEventListener('mousedown', (e) => {
        startDrag(e.clientX, e.clientY, e.target);
    });
    document.addEventListener('mousemove', (e) => onDrag(e.clientX, e.clientY));
    document.addEventListener('mouseup', stopDrag);

    modal.addEventListener('touchstart', (e) => {
        if (e.target.tagName === 'BUTTON' || e.target.tagName === 'TEXTAREA') return;
        if (e.touches.length === 1) {
            startDrag(e.touches[0].clientX, e.touches[0].clientY, e.target);
            e.preventDefault();
        }
    }, { passive: false });

    document.addEventListener('touchmove', (e) => {
        if (isDragging && e.touches.length === 1) {
            onDrag(e.touches[0].clientX, e.touches[0].clientY);
            e.preventDefault();
        }
    }, { passive: false });

    document.addEventListener('touchend', stopDrag);

    window.addEventListener('keydown', (e) => {
        if (e.key === 'Delete' || e.key === 'Backspace') {
            if (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'TEXTAREA') return;
            if (modal && getComputedStyle(modal).display !== 'none') {
                modal.style.display = 'none';
                pAnswers = [];
                currentIndex = 0;
            }
        }
    });
})();
</script>

<script>

/* =====================================
   DOWNLOAD SCRIPT TXT (WITH UPLOAD TRACKING)
===================================== */

(function(){

const btn = document.getElementById("downloadTxtBtn");
const field = document.getElementById("worksheetScript");
const txtLoader = document.getElementById("txtLoader");

// Track the filename whenever a file is selected via the "Browse" button
if (txtLoader) {
    txtLoader.addEventListener("change", function(){
        const file = this.files[0];
        if (file) {
            window.lastUploadedFilename = file.name;
        }
    });
}

if(!btn || !field) return;

btn.onclick = function(){
    const blob = new Blob(
        [field.value],
        {type:"text/plain;charset=utf-8"}
    );

    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);

    // Generate International Date (YYYY-MM-DD) and Military Time (HHMM)
    const now = new Date();
    const year = now.getFullYear();
    const month = String(now.getMonth() + 1).padStart(2, "0");
    const day = String(now.getDate()).padStart(2, "0");
    const internationalDate = `${year}-${month}-${day}`;

    const hours = String(now.getHours()).padStart(2, "0");
    const minutes = String(now.getMinutes()).padStart(2, "0");
    const militaryTime = `${hours}${minutes}`;

    // Determine the base name from the browsed file, or fallback to "Worksheet"
    let baseName = "Worksheet";
    if (window.lastUploadedFilename) {
        // Removes the file extension (.txt) so it doesn't duplicate
        baseName = window.lastUploadedFilename.replace(/\.[^/.]+$/, "");
    }

    // Set the final formatted filename
    a.download = `${baseName}_${internationalDate}_${militaryTime}.txt`;

    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);

    URL.revokeObjectURL(a.href);
};

})();

</script>

(function() {
    class AppController {
        constructor() {
            this.colorQueue = ["Blue", "Green", "Orange", "Red"];
            this.currentColorIndex = 0;
            this.initListeners();
        }

        isColorOnlyMode() {
            const classSelect = document.querySelector(".classSelect");
            return !classSelect || !classSelect.value || (typeof studentData !== "undefined" && !studentData[classSelect.value]);

        getActiveColor() {

            this.syncAll();

<script>

Orange	Theeraphat
Orange	Pannatat
Red	Thanakrit
Red	Nakhun
Red	Boonpipon
Red	Warawat
Purple	Tarzan

`;

const studentColors = {
    Blue:"#93c5fd",
    Green:"#86efac",
    Orange:"#fdba74",
    Red:"#fca5a5"
};

function parseStudents(raw){
    const blocks = raw.split(/(?=~)/g);
    const result={};
    blocks.forEach(block=>{
        block=block.trim();
        if(!block.startsWith("~")) return;
        const lines = block.split("\n").map(x=>x.trim()).filter(Boolean);
        const className = lines[0].replace(/^~/, "").split("-")[0].trim();
        result[className]=[];
        for(let i=1;i<lines.length;i++){
            const parts = lines[i].split(/\s+/);
            const team = parts.shift();
            const name = parts.join(" ");
            result[className].push({
                name:name,
                team:team,
                color:studentColors[team] || "#ddd"
            });
        }
    });
    return result;
}

const studentData = parseStudents(RAW_TEXT);
const classSelectors = document.querySelectorAll(".classSelect");
const studentTiles = document.querySelectorAll(".studentTile");

let colorQueues = {};
let currentColor = 0;
const colorOrder = ["Blue", "Green", "Orange", "Red"];

function shuffle(array){
    return [...array].sort(()=>Math.random()-0.5);
}

function loadClass(className){
    colorQueues = {};
    colorOrder.forEach(color=>{
        if (studentData[className]) {
            colorQueues[color] = shuffle(
                studentData[className].filter(s=>s.team===color)
            );
        } else {
            colorQueues[color] = [];
        }
    });
    currentColor = 0;
}

/* CENTRALIZED SYNCHRONIZED STUDENT UPDATER */
window.setGlobalStudent = function(studentName, studentColor) {
    // 1. Update Student Tiles
    studentTiles.forEach(tile=>{
        tile.textContent = studentName;
        tile.style.background = studentColor;
        tile.style.color = "#111";
    });

    // 2. Update Grab Dot / Student Tab
    const grabDot = document.getElementById("pGrabDot");
    if (grabDot) {
        grabDot.textContent = studentName;
        grabDot.style.setProperty("background-color", studentColor, "important");
        grabDot.style.setProperty("color", "#111", "important");
    }

    // 3. Update Tallyman Tile
    const tmTile = document.getElementById("tmTile");
    if (tmTile) {
        tmTile.textContent = studentName;
        tmTile.style.background = studentColor;
        tmTile.style.color = "#111";
    }

    // 4. Update Wheel State if present
    if (typeof Wheel !== "undefined") {
        Wheel.currentName = studentName;
        if (Wheel.overlay && Wheel.overlay.style.display === "flex") {
            if (typeof drawWheel === "function") drawWheel();
        }
    }
};

function nextStudent(){
    const className = classSelectors[0] ? classSelectors[0].value : "";
    if (!className || !studentData[className]) return;

    const color = colorOrder[currentColor];
    if(!colorQueues[color] || colorQueues[color].length===0){
        colorQueues[color] = shuffle(
            studentData[className].filter(s=>s.team===color)
        );
    }

    const student = colorQueues[color].shift();
    if (student) {
        window.setGlobalStudent(student.name, student.color);
    }

    currentColor = (currentColor+1) % colorOrder.length;
}

Object.keys(studentData).forEach(className=>{
    classSelectors.forEach(select=>{
        const option = document.createElement("option");
        option.value = className;
        option.textContent = className;
        select.appendChild(option);
    });
});

classSelectors.forEach(select=>{
    select.addEventListener("change", function(){
        classSelectors.forEach(other=>{
            other.value = this.value;
        });
        loadClass(this.value);
        nextStudent();
        if(window.updateWheelClass){
            window.updateWheelClass();
        }
    });
});

studentTiles.forEach(tile=>{
    tile.onclick = function(e){
        e.stopPropagation();
        const wheelOverlay = document.getElementById("studentWheelOverlay");
        if (wheelOverlay && wheelOverlay.style.display === "flex" && typeof spinWheel === "function") {
            spinWheel();
        } else {
            nextStudent();
        }
    };
});if(classSelectors.length){
    classSelectors.forEach(select => {
        select.selectedIndex = 0; // Keeps it on the default "Class" option
    });
}
window.nextStudent = nextStudent;

<script>

(function(){

const Wheel={
    overlay:null,
    panel:null,
    canvas:null,
    ctx:null,
    students:[],
    angle:0,
    currentName:null,
    spinning:false,
    size:0,
    radius:0,
    duration:2000
};

function createWheel(){
    if(Wheel.overlay) return;

    const style=document.createElement("style");
    style.textContent=`
:root{
--wheel-size:350px;
}
#studentWheelOverlay{
position:fixed;
inset:0;
display:none;
align-items:center;
justify-content:center;
background:transparent;
pointer-events:none !important;
z-index:100002;
}
#studentWheelPanel {
    position: fixed !important;
    left: calc(645px + (250px - calc(var(--wheel-size) + 120px)) / 2) !important;
    top: 135px !important;
    bottom: auto !important;
    width: calc(var(--wheel-size) + 120px);
    height: calc(var(--wheel-size) + 120px);
    touch-action: none;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: auto !important;
}

Wheel.canvas.addEventListener("pointerdown", e=>{
        const canvasRect = Wheel.canvas.getBoundingClientRect();
        const cx = canvasRect.width / 2;
        const cy = canvasRect.height / 2;
        const localX = e.clientX - canvasRect.left;
        const localY = e.clientY - canvasRect.top;
        const dx = localX - cx;
        const dy = localY - cy;

        // If clicking the brass center hub (radius 28), bypass drag so click-to-spin takes over
        if(Math.sqrt(dx * dx + dy * dy) <= 28){
            return; 
        }

        dragging=true;
        const rect = Wheel.panel.getBoundingClientRect();
        ox = e.clientX - rect.left;
        oy = e.clientY - rect.top;
        e.preventDefault();
    });`;
    document.head.appendChild(style);

    Wheel.overlay=document.createElement("div");
    Wheel.overlay.id="studentWheelOverlay";

    Wheel.panel=document.createElement("div");
    Wheel.panel.id="studentWheelPanel";

    Wheel.canvas=document.createElement("canvas");
    Wheel.canvas.id="studentWheelCanvas";

    Wheel.size = parseInt(
        getComputedStyle(document.documentElement)
            .getPropertyValue("--wheel-size")
    );

    Wheel.radius = Wheel.size / 2 - 10;
    const extraSpace = 40;

    Wheel.canvas.width = Wheel.size + extraSpace;
    Wheel.canvas.height = Wheel.size + extraSpace;
    Wheel.ctx = Wheel.canvas.getContext("2d");
    Wheel.panel.appendChild(Wheel.canvas);
    Wheel.overlay.appendChild(Wheel.panel);
    document.body.appendChild(Wheel.overlay);

    let dragging=false;
    let ox=0;
    let oy=0;

    Wheel.canvas.addEventListener("pointerdown", e=>{
        const canvasRect = Wheel.canvas.getBoundingClientRect();
        const cx = canvasRect.width / 2;
        const cy = canvasRect.height / 2;
        const localX = e.clientX - canvasRect.left;
        const localY = e.clientY - canvasRect.top;
        const dx = localX - cx;
        const dy = localY - cy;

        // If clicking the brass center hub (radius 28), bypass drag so click-to-spin takes over
        if(Math.sqrt(dx * dx + dy * dy) <= 28){
            return; 
        }

        dragging=true;
        const rect = Wheel.panel.getBoundingClientRect();
        ox = e.clientX - rect.left;
        oy = e.clientY - rect.top;
        e.preventDefault();
    });

    document.addEventListener("pointermove", e=>{
        if(!dragging) return;
        Wheel.panel.style.setProperty("position", "fixed", "important");
        Wheel.panel.style.setProperty("left", (e.clientX - ox) + "px", "important");
        Wheel.panel.style.setProperty("top", (e.clientY - oy) + "px", "important");
        Wheel.panel.style.setProperty("bottom", "auto", "important");
        Wheel.panel.style.setProperty("right", "auto", "important");
        Wheel.panel.style.setProperty("transform", "none", "important");
    });

    document.addEventListener("pointerup", e=>{
        if(dragging){
            dragging=false;
        }
    });
}

function loadWheelStudents(){
    const className = document.querySelector(".classSelect").value;
    if(!className || !studentData[className]){
        Wheel.students = [
            { name: "Blue", color: studentColors["Blue"] },
            { name: "Green", color: studentColors["Green"] },
            { name: "Orange", color: studentColors["Orange"] },
            { name: "Red", color: studentColors["Red"] }
        ];
        return;
    }

    Wheel.students = studentData[className].map(s => ({...s}));
    const colorGroups = {};
    Wheel.students.forEach(student=>{
        const color = student.color || "#ddd";
        if(!colorGroups[color]) colorGroups[color] = [];
        colorGroups[color].push(student);
    });

    const groups = Object.values(colorGroups);
    Wheel.students = [];
    let lastColor = null;

    while(groups.some(g => g.length)){
        groups.sort((a,b)=>b.length-a.length);
        let selected = groups.find(g => g.length && (g[0].color || "#ddd") !== lastColor);
        if(!selected) selected = groups.find(g=>g.length);
        const student = selected.shift();
        Wheel.students.push(student);
        lastColor = student.color || "#ddd";
    }

    const tile = document.querySelector(".studentTile");
    if(tile){
        Wheel.currentName = tile.textContent.trim();
    }
}

function drawWheel(){
    const ctx = Wheel.ctx;
    ctx.setTransform(1,0,0,1,0,0);
    ctx.globalAlpha = 1;
    ctx.shadowColor = "transparent";
    ctx.shadowBlur = 0;
    ctx.clearRect(0, 0, Wheel.canvas.width, Wheel.canvas.height);

    const extraSpace = 40;
    const cx = (Wheel.size/2) + extraSpace/2;
    const cy = (Wheel.size/2) + extraSpace/2;

    ctx.save();
    const students=Wheel.students;
    if(!students.length) return;

    const slice = Math.PI*2/students.length;

    students.forEach((s,i)=>{
        const start = Wheel.angle + i * slice;
        const end = start + slice;

        ctx.beginPath();
        ctx.moveTo(cx,cy);
        ctx.arc(cx, cy, Wheel.radius, start, end);
        ctx.closePath();

        ctx.fillStyle = s.color || "#ddd";
        ctx.fill();

        ctx.strokeStyle = "#000";
        ctx.lineWidth = 0.25;
        ctx.stroke();

        const mid = (start + end) / 2;
        ctx.save();
        const labelRadius = Wheel.radius - 15; 
        ctx.translate(cx + Math.cos(mid) * labelRadius, cy + Math.sin(mid) * labelRadius);
        ctx.rotate(mid + Math.PI);
        ctx.fillStyle = "#111";
        ctx.font = (Wheel.size * 0.035) + "px Arial";
        ctx.textAlign = "left";
        ctx.textBaseline = "middle";
        ctx.fillText(s.name, 0, 0);
        ctx.restore();
    });

    ctx.restore();

    ctx.save();
    const rimWidth = 10;
    const rimGradient = ctx.createRadialGradient(cx, cy, Wheel.radius - rimWidth, cx, cy, Wheel.radius + 5);
    rimGradient.addColorStop(0, "#5c3900");
    rimGradient.addColorStop(0.25, "#d8a62a");
    rimGradient.addColorStop(0.45, "#fff2a6");
    rimGradient.addColorStop(0.65, "#c58a16");
    rimGradient.addColorStop(0.85, "#8b5a05");
    rimGradient.addColorStop(1, "#3b2400");

    ctx.beginPath();
    ctx.arc(cx, cy, Wheel.radius, 0, Math.PI * 2);
    ctx.strokeStyle = rimGradient;
    ctx.lineWidth = rimWidth;
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(cx, cy, Wheel.radius - rimWidth/2, 0, Math.PI * 2);
    ctx.strokeStyle = "rgba(255,240,150,0.8)";
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.restore();

    // pointer
    ctx.beginPath();
    ctx.moveTo(cx,35);
    ctx.lineTo(cx-10,18);
    ctx.lineTo(cx+10,18);
    ctx.closePath();
    ctx.fillStyle="red";
    ctx.fill();

    // hub
    const hubX = cx;
    const hubY = cy;
    ctx.save();
    ctx.beginPath();
    ctx.arc(hubX + 3, hubY + 5, 28, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(0,0,0,0.35)";
    ctx.fill();

    const brass = ctx.createRadialGradient(hubX - 8, hubY - 10, 3, hubX, hubY, 30);
    brass.addColorStop(0, "#fff2a6");
    brass.addColorStop(0.15, "#ffd34e");
    brass.addColorStop(0.35, "#c58a16");
    brass.addColorStop(0.65, "#8b5a05");
    brass.addColorStop(0.85, "#d8a62a");
    brass.addColorStop(1, "#5c3900");

    ctx.beginPath();
    ctx.arc(hubX, hubY, 28, 0, Math.PI * 2);
    ctx.fillStyle = brass;
    ctx.fill();

    ctx.beginPath();
    ctx.arc(hubX, hubY, 28, 0, Math.PI * 2);
    ctx.strokeStyle = "#5a3500";
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(hubX, hubY, 20, 0, Math.PI * 2);
    ctx.strokeStyle = "rgba(255,240,150,0.8)";
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(hubX - 7, hubY - 8, 7, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(255,255,220,0.55)";
    ctx.fill();
    ctx.restore();
}

function spinWheel(){
    if(Wheel.spinning) return;
    Wheel.spinning = true;

    if(window.startSpinnerSound) startSpinnerSound();
    loadWheelStudents();

    if(!Wheel.students.length){
        Wheel.spinning = false;
        if(window.stopSpinnerSound) stopSpinnerSound();
        return;
    }

    let start = performance.now();
    let startAngle = Wheel.angle;
    const slice = (Math.PI * 2) / Wheel.students.length;

    const className = document.querySelector(".classSelect").value;
    if (className && studentData[className]) {
        if(typeof window.nextStudent === "function"){
            window.nextStudent();
        }
        const tile = document.querySelector(".studentTile");
        if(tile){
            Wheel.currentName = tile.textContent.trim();
        }
    } else {
        if (window.appController) {
            window.appController.nextColor();
            Wheel.currentName = window.appController.getActiveColor();
        } else {
            Wheel.currentName = "Blue";
        }
    }

    const targetIndex = Wheel.students.findIndex(s => s.name === Wheel.currentName);
    if(targetIndex < 0){
        Wheel.spinning = false;
        if(window.stopSpinnerSound) stopSpinnerSound();
        return;
    }

    const studentAngle = (targetIndex * slice) + (slice / 2);
    const pointerAngle = -Math.PI / 2;
    let offset = pointerAngle - studentAngle - startAngle;
    offset = ((offset % (Math.PI * 2)) + (Math.PI * 2)) % (Math.PI * 2);
    const minimumTurns = 7;
    let target = startAngle + (minimumTurns * Math.PI * 2) + offset;

    function animate(now){
        let p = (now - start) / Wheel.duration;
        if(p > 1) p = 1;
        let ease = 1 - Math.pow(1 - p, 5);
        Wheel.angle = startAngle + (target - startAngle) * ease;
        drawWheel();

        if(p < 1){
            requestAnimationFrame(animate);
        } else {
            Wheel.spinning = false;
            if(window.stopSpinnerSound) stopSpinnerSound();
            loadWheelStudents();
            drawWheel();

            const landingStudent = Wheel.students[targetIndex];
            if (landingStudent) {
                window.setGlobalStudent(landingStudent.name, landingStudent.color);
            }
        }
    }
    requestAnimationFrame(animate);
}

function showWheel(){
    createWheel();
    Wheel.overlay.style.display="flex";
    loadWheelStudents();

    const className = document.querySelector(".classSelect").value;
    if (className && studentData[className]) {
        const tile = document.querySelector(".studentTile");
        const tileName = tile ? tile.textContent.trim() : "";
        if(tileName && tileName !== "Student" && Wheel.students.some(s => s.name === tileName)){
            Wheel.currentName = tileName;
        } else if(Wheel.students.length > 0){
            Wheel.currentName = Wheel.students[0].name;
        }
    } else {
        Wheel.currentName = null;
    }

    const targetIndex = Wheel.students.findIndex(s => s.name === Wheel.currentName);
    if(targetIndex >= 0 && Wheel.students.length){
        const slice = (Math.PI * 2) / Wheel.students.length;
        const studentCenter = (targetIndex * slice) + (slice / 2);
        Wheel.angle = (-Math.PI / 2) - studentCenter;
    }
    drawWheel();
}

function updateWheelClass() {
    if(Wheel.overlay && Wheel.overlay.style.display === "flex"){
        loadWheelStudents();
        const className = document.querySelector(".classSelect").value;
        if (className && studentData[className] && Wheel.students.length > 0) {
            const tile = document.querySelector(".studentTile");
            const tileName = tile ? tile.textContent.trim() : "";
            if(tileName && tileName !== "Student" && Wheel.students.some(s => s.name === tileName)){
                Wheel.currentName = tileName;
            } else {
                Wheel.currentName = Wheel.students[0].name;
            }
            const targetIndex = Wheel.students.findIndex(s => s.name === Wheel.currentName);
            if(targetIndex >= 0){
                const slice = (Math.PI * 2) / Wheel.students.length;
                const studentCenter = (targetIndex * slice) + (slice / 2);
                Wheel.angle = (-Math.PI / 2) - studentCenter;
            }
        }
        drawWheel();
    }
}
window.updateWheelClass = updateWheelClass;

function hideWheel(){
    if(Wheel.overlay){
        Wheel.overlay.style.display="none";
    }
}

function toggleSpinner(){
    if(Wheel.overlay && Wheel.overlay.style.display === "flex"){
        hideWheel();
    } else {
        showWheel();
    }
}

const leftSpinner = document.getElementById("spinnerBtn");
if(leftSpinner) leftSpinner.onclick = toggleSpinner;

const rightSpinner = document.getElementById("spinnerBtnRight");
if(rightSpinner) rightSpinner.onclick = toggleSpinner;

window.spinWheel = spinWheel;
window.hideWheel = hideWheel;

document.addEventListener("click", function(e){
    if(!Wheel.overlay || Wheel.overlay.style.display !== "flex") return;
    if(e.target !== Wheel.canvas) return;

    const canvasRect = Wheel.canvas.getBoundingClientRect();
    const extraSpace = 40;
    const cx = (Wheel.size / 2) + extraSpace / 2;
    const cy = (Wheel.size / 2) + extraSpace / 2;

    const scaleX = Wheel.canvas.width / canvasRect.width;
    const scaleY = Wheel.canvas.height / canvasRect.height;
    const internalX = (e.clientX - canvasRect.left) * scaleX;
    const internalY = (e.clientY - canvasRect.top) * scaleY;
    const dx = internalX - cx;
    const dy = internalY - cy;

    if(Math.sqrt(dx * dx + dy * dy) <= 28){
        e.stopImmediatePropagation();
        e.preventDefault();
        spinWheel();
    }
}, true);

})();

</script>

        if (!isPlaying) return;
        isPlaying = false;
        spinnerSound.pause();
        spinnerSound.currentTime = 0;
    }

    window.startSpinnerSound = startSpinnerSound;
    window.stopSpinnerSound = stopSpinnerSound;
})();

});const tmScores = { Blue:0, Green:0, Orange:0, Red:0 };

function tmAddTally(team){
  tmScores[team]++;
  const area = document.querySelector('.tmTallies[data-team="'+team+'"]');
  if(!area) return;
  let groups = area.querySelectorAll(".tmGroup");
  let group = groups[groups.length-1];
  if(!group || Number(group.dataset.count)>=5){
    group = document.createElement("div");
    group.className="tmGroup";
    group.dataset.count=0;
    area.appendChild(group);
  }
  let count = Number(group.dataset.count);
  if(count<4){
    const stick = document.createElement("div");
    stick.className="tmStick";
    group.appendChild(stick);
  }
  count++;
  if(count===5){
    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("viewBox", "0 0 20 20");
    svg.innerHTML=`<line x1="1" y1="1" x2="19" y2="19" stroke="#111" stroke-width="2.5" stroke-linecap="round"/>`;
    group.appendChild(svg);
  }
  group.dataset.count=count;
  document.getElementById("tmScore"+team).textContent=tmScores[team];
}

function tmDeleteTally(team){
  if(tmScores[team]===0) return;
  tmScores[team]--;
  const area = document.querySelector('.tmTallies[data-team="'+team+'"]');
  if(!area) return;
  const groups = area.querySelectorAll(".tmGroup");
  if(!groups.length) return;
  const group = groups[groups.length-1];
  let count = Number(group.dataset.count);
  if(count===5){
    const svg = group.querySelector("svg");
    if(svg) svg.remove();
  } else {
    const sticks = group.querySelectorAll(".tmStick");
    if(sticks.length) sticks[sticks.length-1].remove();
  }
  count--;
  group.dataset.count=count;
  if(count===0) group.remove();
  document.getElementById("tmScore"+team).textContent=tmScores[team];
}

      document.getElementById("tmScore"+team).textContent=0;
      const area = document.querySelector('.tmTallies[data-team="'+team+'"]');

<script>
(function() {
  let modalOpen = false;

  const modalContainer = document.getElementById("jellyBeanModalContainer");
  const jarWrapper = document.getElementById("jbJarWrapper");
  const jarContainer = document.getElementById("jbJarContainer");
  const beanCanvas = document.getElementById("jbBeanCanvas");
  const ctx = beanCanvas.getContext("2d");

  const scoreDisplay = document.getElementById("jbScoreDisplay");
  const mouthHotspot = document.getElementById("jbMouthHotspot");
  const jarLid = document.getElementById("jbJarLid");
  const lidHitbox = document.getElementById("jbLidHitbox");

  const saveButton = document.getElementById("jbSaveButton");
  const browseButton = document.getElementById("jbBrowseButton");
  const fileInput = document.getElementById("jbFileInput");
  const classSelect = document.getElementById("jbClassSelect");

  const MAX_BEANS = 50;
  const BEAN_RADIUS = 20.9;

  const jarBounds = { left: 135, right: 385, top: 175, bottom: 645 };

  beanCanvas.width = 520;
  beanCanvas.height = 760;

  let beans = [];
  let score = 0;

  const BEAN_COLORS = [
    { fill: "#E74C3C" },
    { fill: "#F1C40F" },
    { fill: "#E84393" },
    { fill: "#2ECC71" },
    { fill: "#9B59B6" },
    { fill: "#E67E22" },
    { fill: "#3498DB" }
  ];

  function randomBeanColor() {
    return BEAN_COLORS[Math.floor(Math.random() * BEAN_COLORS.length)];
  }

  function updateScore() {
    scoreDisplay.textContent = score;
  }

  function toggleModal() {
    modalOpen = !modalOpen;
    modalContainer.style.display = modalOpen ? "block" : "none";
  }

  function getTargetPosition(index) {
    const maxCols = 6;
    const col = index % maxCols;
    const row = Math.floor(index / maxCols);

    const availableWidth = (jarBounds.right - 10) - (jarBounds.left + 10) - (BEAN_RADIUS * 2);
    const colSpacing = availableWidth / (maxCols - 1);

    const baseTargetX = (jarBounds.left + 10) + BEAN_RADIUS + (col * colSpacing);
    const baseFloor = (jarBounds.bottom - 5) + 15;
    const baseTargetY = baseFloor - BEAN_RADIUS - (row * (BEAN_RADIUS * 1.3));

    const jarCenterX = (jarBounds.left + jarBounds.right) / 2;
    const distanceFromCenter = Math.abs(baseTargetX - jarCenterX);
    const maxDistanceFromCenter = (jarBounds.right - jarBounds.left) / 2;
    const edgeCurveFactor = Math.min(1, distanceFromCenter / maxDistanceFromCenter);
    const edgeLift = (row === 0) ? (edgeCurveFactor * 8) : 0;

    const jitterX = Math.sin(index * 12.9898) * 12;
    const jitterY = Math.cos(index * 78.233) * 6;

    return { 
      targetX: baseTargetX + jitterX, 
      targetY: (baseTargetY - edgeLift) + jitterY 
    };
  }

  function createBean() {
    if (score >= MAX_BEANS) return;

    const { targetX, targetY } = getTargetPosition(beans.length);
    const angleJitter = (Math.sin(beans.length * 43.11) * 0.6) + ((Math.random() - 0.5) * 0.4);

    const bean = {
      x: targetX,
      y: targetY,
      targetX: targetX,
      targetY: targetY,
      angle: angleJitter,
      color: randomBeanColor(),
      alpha: 1,
      removing: false
    };

    beans.push(bean);
    score++;
    updateScore();
  }

  function removeBean() {
    if (score <= 0) return;

    let selectedBean = null;
    for (let i = beans.length - 1; i >= 0; i--) {
      if (!beans[i].removing) {
        selectedBean = beans[i];
        break;
      }
    }

    if (!selectedBean) return;

    selectedBean.removing = true;
    selectedBean.alpha = 1;

    score--;
    updateScore();

    let activeIdx = 0;
    for (const bean of beans) {
      if (!bean.removing) {
        const { targetX, targetY } = getTargetPosition(activeIdx);
        bean.targetX = targetX;
        bean.targetY = targetY;
        bean.x = targetX;
        bean.y = targetY;
        activeIdx++;
      }
    }
  }

  function updateBeans() {
    beans = beans.filter(b => !b.removing);
  }

  function drawBeans() {
    ctx.clearRect(0, 0, beanCanvas.width, beanCanvas.height);

    for (const bean of beans) {
      ctx.save();
      ctx.globalAlpha = Math.max(0, bean.alpha);
      ctx.translate(bean.x, bean.y);
      ctx.rotate(bean.angle);

      ctx.beginPath();
      ctx.moveTo(-19, -6);
      ctx.bezierCurveTo(-24, -22, 19, -25, 24, -6);
      ctx.bezierCurveTo(28, 11, -4, 25, -19, 15);
      ctx.bezierCurveTo(-26, 9, -24, 0, -19, -6);
      ctx.closePath();

      ctx.fillStyle = bean.color.fill;
      ctx.fill();

      ctx.strokeStyle = "rgba(0, 0, 0, 0.12)";
      ctx.lineWidth = 1.5;
      ctx.stroke();

      ctx.beginPath();
      ctx.ellipse(-5, -9, 9, 3.5, Math.PI / 4, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(255, 255, 255, 0.65)";
      ctx.fill();

      ctx.restore();
    }
  }

  let lidDragging = false;
  let lidOffsetX = 0;
  let lidOffsetY = 0;
  let currentLidX = 0;
  let currentLidY = 27.5;
  let targetLidX = 0;
  let targetLidY = 27.5;

  lidHitbox.addEventListener("pointerdown", (event) => {
    event.stopPropagation();
    lidDragging = true;
    lidHitbox.setPointerCapture(event.pointerId);

    const containerRect = jarContainer.getBoundingClientRect();
    const lidRect = jarLid.getBoundingClientRect();
    
    lidOffsetX = event.clientX - lidRect.left;
    lidOffsetY = event.clientY - lidRect.top;
    
    targetLidX = lidRect.left - containerRect.left;
    targetLidY = lidRect.top - containerRect.top;
  });

  lidHitbox.addEventListener("pointermove", (event) => {
    if (!lidDragging) return;
    event.stopPropagation();
    const containerRect = jarContainer.getBoundingClientRect();
    targetLidX = event.clientX - containerRect.left - lidOffsetX;
    targetLidY = event.clientY - containerRect.top - lidOffsetY;
  });

  const stopLidDrag = (event) => {
    if (lidDragging) {
      lidDragging = false;
      try { lidHitbox.releasePointerCapture(event.pointerId); } catch (e) {}
    }
  };
  lidHitbox.addEventListener("pointerup", stopLidDrag);
  lidHitbox.addEventListener("pointercancel", stopLidDrag);

  function animate() {
    if (modalOpen) {
      currentLidX += (targetLidX - currentLidX) * 0.25;
      currentLidY += (targetLidY - currentLidY) * 0.25;

      jarLid.style.left = currentLidX + "px";
      jarLid.style.top = currentLidY + "px";
      jarLid.style.margin = "0";

      lidHitbox.style.left = currentLidX + "px";
      lidHitbox.style.top = currentLidY + "px";
      lidHitbox.style.margin = "0";

      updateBeans();
      drawBeans();
    }
    requestAnimationFrame(animate);
  }

  function getDateString() {
    const today = new Date();
    const year = today.getFullYear();
    const month = String(today.getMonth() + 1).padStart(2, "0");
    const day = String(today.getDate()).padStart(2, "0");
    return `${year}-${month}-${day}`;
  }

  saveButton.addEventListener("pointerdown", async (e) => {
    e.stopPropagation();
    const selectedClass = classSelect.value;
    const filename = `${selectedClass}_${getDateString()}.txt`;
    const content = score.toString();

    try {
      const folderHandle = await window.showDirectoryPicker({ mode: "readwrite" });
      const fileHandle = await folderHandle.getFileHandle(filename, { create: true });
      const writable = await fileHandle.createWritable();
      await writable.write(content);
      await writable.close();
      alert(`Saved: ${filename}`);
    } catch (error) {
      if (error.name !== "AbortError") {
        console.error("Save failed:", error);
        alert("Could not save the file.");
      }
    }
  });

  browseButton.addEventListener("pointerdown", (e) => {
    e.stopPropagation();
    fileInput.click();
  });

  fileInput.addEventListener("change", (event) => {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = (e) => {
      const loadedScore = parseInt(e.target.result.trim());
      if (isNaN(loadedScore) || loadedScore < 0) {
        alert("Invalid score file.");
        return;
      }
      beans = [];
      score = 0;
      updateScore();
      const amountToLoad = Math.min(loadedScore, MAX_BEANS);
      for (let i = 0; i < amountToLoad; i++) {
        createBean();
      }
    };
    reader.readAsText(file);
  });

  function makeModalDraggable(el) {
    el.onpointerdown = (e) => {
      if (e.target.closest('#jbControls') || e.target.closest('#jbLidHitbox') || e.target.closest('#jbJarLid') || e.target.closest('#jbScoreDisplay') || e.target.closest('#jbMouthHotspot')) {
        return;
      }

      const rect = el.getBoundingClientRect();
      if (el.style.transform.includes("translate")) {
        el.style.transform = "none";
        el.style.left = rect.left + "px";
        el.style.top = rect.top + "px";
      }

      const startX = e.clientX;
      const startY = e.clientY;
      const initialLeft = el.offsetLeft;
      const initialTop = el.offsetTop;

      document.onpointermove = (ev) => {
        const deltaX = ev.clientX - startX;
        const deltaY = ev.clientY - startY;
        el.style.left = (initialLeft + deltaX) + "px";
        el.style.top = (initialTop + deltaY) + "px";
      };

      document.onpointerup = () => {
        document.onpointermove = null;
        document.onpointerup = null;
      };
    };
  }

  document.addEventListener("DOMContentLoaded", () => {
    let leftBtn = document.getElementById("leftBtn");
    let rightBtn = document.getElementById("rightBtn");

    if (leftBtn) leftBtn.textContent = "Jelly Beans";
    if (rightBtn) rightBtn.textContent = "Jelly Beans";

    if (leftBtn) leftBtn.onclick = (e) => { e.stopPropagation(); toggleModal(); };
    if (rightBtn) rightBtn.onclick = (e) => { e.stopPropagation(); toggleModal(); };

    mouthHotspot.addEventListener("pointerdown", (e) => {
      e.stopPropagation();
      createBean();
    });

    scoreDisplay.addEventListener("pointerdown", (e) => {
      e.stopPropagation();
      removeBean();
    });

    makeModalDraggable(jarWrapper);
    updateScore();
    animate();
  });
})();
</script>

<!-- ==========================================================
     STANDALONE NEUTRAL GREY FALLING BEAN SYSTEM
