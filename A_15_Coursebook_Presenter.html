<script>
(function() {
  window.addEventListener("DOMContentLoaded", () => {
    const jarContainer = document.getElementById("jbJarContainer");
    const beanCanvas = document.getElementById("jbBeanCanvas");
    const scoreDisplay = document.getElementById("jbScoreDisplay");
    
    if (!jarContainer || !beanCanvas || !scoreDisplay) return;

    const blurCanvas = document.createElement("canvas");
    blurCanvas.id = "jbBlurCanvas";
    blurCanvas.width = 520;
    blurCanvas.height = 760;
    blurCanvas.style.cssText = "position:absolute; inset:0; width:100%; height:100%; pointer-events:none; z-index:4;";
    
    beanCanvas.style.zIndex = "3";
    jarContainer.appendChild(blurCanvas);
    const blurCtx = blurCanvas.getContext("2d");

    let impressionisticTrails = [];
    let lastKnownScore = parseInt(scoreDisplay.textContent) || 0;

    const jarBounds = { left: 135, right: 385, top: 175, bottom: 645 };
    const BEAN_RADIUS = 20.9;
    const maxCols = 6;
    const NEUTRAL_GREY = "#95A5A6";

    function getBeanCoordinates(scoreIndex) {
      const targetIndex = Math.max(0, scoreIndex);
      const col = targetIndex % maxCols;
      const row = Math.floor(targetIndex / maxCols);

      const availableWidth = (jarBounds.right - 10) - (jarBounds.left + 10) - (BEAN_RADIUS * 2);
      const colSpacing = availableWidth / (maxCols - 1);
      const baseTargetX = (jarBounds.left + 10) + BEAN_RADIUS + (col * colSpacing);
      const baseFloor = (jarBounds.bottom - 5) + 15;
      const baseTargetY = baseFloor - BEAN_RADIUS - (row * (BEAN_RADIUS * 1.3));

      const jarCenterX = (jarBounds.left + jarBounds.right) / 2;
      const edgeCurveFactor = Math.min(1, Math.abs(baseTargetX - jarCenterX) / ((jarBounds.right - jarBounds.left) / 2));
      const edgeLift = (row === 0) ? (edgeCurveFactor * 8) : 0;

      return {
        x: baseTargetX + (Math.sin(targetIndex * 12.9898) * 12),
        y: (baseTargetY - edgeLift) + (Math.cos(targetIndex * 78.233) * 6)
      };
    }

    const observer = new MutationObserver(() => {
      const currentScore = parseInt(scoreDisplay.textContent) || 0;
      if (currentScore === lastKnownScore) return;

      const centerX = (jarBounds.left + jarBounds.right) / 2;
      const startY = jarBounds.top - 15;
      
      const targetScoreIndex = currentScore > lastKnownScore ? currentScore - 1 : currentScore;
      const targetCoord = getBeanCoordinates(targetScoreIndex);
      const endY = targetCoord.y;

      if (currentScore > lastKnownScore) {
        impressionisticTrails.push({
          x: centerX,
          y: startY,
          targetY: endY,
          color: NEUTRAL_GREY,
          alpha: 0.35,
          life: 1.0,
          decay: 0.015
        });
      } else if (currentScore < lastKnownScore) {
        impressionisticTrails.push({
          x: centerX,
          y: endY,
          targetY: startY,
          color: NEUTRAL_GREY,
          alpha: 0.35,
          life: 1.0,
          decay: 0.015
        });
      }

      lastKnownScore = currentScore;
    });

    observer.observe(scoreDisplay, { childList: true, characterData: true, subtree: true });

    function renderBlurTrails() {
      blurCtx.clearRect(0, 0, blurCanvas.width, blurCanvas.height);

      for (let i = impressionisticTrails.length - 1; i >= 0; i--) {
        let trail = impressionisticTrails[i];
        trail.y += (trail.targetY - trail.y) * 0.12;
        trail.life -= trail.decay;

        if (trail.life <= 0 || Math.abs(trail.targetY - trail.y) < 1) {
          impressionisticTrails.splice(i, 1);
          continue;
        }

        blurCtx.save();
        blurCtx.globalAlpha = trail.alpha * trail.life;
        blurCtx.shadowColor = trail.color;
        blurCtx.shadowBlur = 35;
        blurCtx.translate(trail.x, trail.y);

        blurCtx.beginPath();
        blurCtx.moveTo(-19, -6);
        blurCtx.bezierCurveTo(-24, -22, 19, -25, 24, -6);
        blurCtx.bezierCurveTo(28, 11, -4, 25, -19, 15);










        blurCtx.bezierCurveTo(-26, 9, -24, 0, -19, -6);
        blurCtx.closePath();

        blurCtx.fillStyle = trail.color;
        blurCtx.fill();

        blurCtx.restore();
      }

      requestAnimationFrame(renderBlurTrails);
    }

    renderBlurTrails();
  });
})();
</script>

<script>
(function(){

"use strict";

/*==================================================
  TALLYMAN SMOOTH DRAG
  (Maintains smooth window dragging without any purple overlays)
==================================================*/

/* Fix window dragging jitter by using requestAnimationFrame and direct transform/style management */
function initSmoothDrag() {
  const win = document.getElementById("tmWindow");
  const handle = document.getElementById("tmDrag");

  if (!win || !handle) return;

  let dragging = false;
  let startX = 0, startY = 0;
  let initialLeft = 0, initialTop = 0;

  handle.addEventListener("mousedown", (e) => {
    dragging = true;
    startX = e.clientX;
    startY = e.clientY;

    const rect = win.getBoundingClientRect();
    initialLeft = rect.left;
    initialTop = rect.top;

    win.style.right = "auto";
    win.style.bottom = "auto";
    win.style.left = initialLeft + "px";
    win.style.top = initialTop + "px";

    e.preventDefault();
  });

  document.addEventListener("mousemove", (e) => {
    if (!dragging) return;

    const dx = e.clientX - startX;
    const dy = e.clientY - startY;

    window.requestAnimationFrame(() => {
      win.style.left = (initialLeft + dx) + "px";
      win.style.top = (initialTop + dy) + "px";
    });
  });

  document.addEventListener("mouseup", () => {
    dragging = false;
  });
}

// Initialize smooth dragging once DOM is ready
if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", initSmoothDrag);
} else {
  setTimeout(initSmoothDrag, 100);
}

console.log("Standalone Smooth Drag Script Loaded");

})();
</script>

        if (cleanLeft && cleanRight) {

        } else {
            let fallbackLeft = leftText.split('/').pop().replace(/\.[^/.]+$/, "").replace(/[()]/g, "");
            let fallbackRight = rightText.split('/').pop().replace(/\.[^/.]+$/, "").replace(/[()]/g, "");
            indicator.textContent = `${fallbackLeft}–${fallbackRight}`;
            indicator.title = `${fallbackLeft} and ${fallbackRight}`;
        }
    } else {
        indicator.textContent = "Pages --";
    }
};

const originalLoadSpread = window.loadSpread;
window.loadSpread = function(leftPath, rightPath) {
    if (typeof originalLoadSpread === "function") {
        originalLoadSpread(leftPath, rightPath);
    }
    window.updateSpreadIndicator(leftPath, rightPath);
};

})();
</script>

    document.head.appendChild(style);

    let notesList = [];
    let activeIndex = 0;

    function parseAndBuildNoteTiles() {
        const scriptArea = document.getElementById('worksheetScript');
        const tilesContainer = document.querySelector('#tilesArea') || document.querySelector('.tiles-container');
        
        if (!tilesContainer) return;

        tilesContainer.querySelectorAll('.standalone-note-tile').forEach(el => el.remove());

        if (!scriptArea || !scriptArea.value) {
            notesList = [];
            return;
        }

        const lines = scriptArea.value.split('\n');
        notesList = [];
        let currentBlock = [];
        let capturing = false;

        lines.forEach(line => {
            let trimmed = line.trim();
            if (/^(~|!)Notes?:/i.test(trimmed)) {
                if (capturing) {
                    notesList.push(currentBlock.join('\n'));
                    currentBlock = [];
                }
                capturing = true;
                let cleanLine = trimmed.replace(/^(~|!)Notes?:\s*/i, '').trim();
                if (cleanLine) currentBlock.push(cleanLine);
            } else if (capturing) {
                if (/^(~|!)[A-Za-z]+:/.test(trimmed)) {
                    capturing = false;
                    if (currentBlock.length > 0) {
                        notesList.push(currentBlock.join('\n'));
                        currentBlock = [];
                    }
                    if (/^(~|!)Notes?:/i.test(trimmed)) {
                        capturing = true;
                        let cleanLine = trimmed.replace(/^(~|!)Notes?:\s*/i, '').trim();
                        if (cleanLine) currentBlock.push(cleanLine);
                    }
                } else {
                    currentBlock.push(line);
                }
            }
        });

        if (capturing && currentBlock.length > 0) {
            notesList.push(currentBlock.join('\n'));
        }

        notesList.forEach((noteContent, idx) => {
            const tile = document.createElement('div');
            tile.className = 'standalone-note-tile';
            
            let previewText = "Note";
            for (let l of noteContent.split('\n')) {
                if (l.trim() !== '') {
                    previewText = l.trim();
                    break;
                }
            }
            
            tile.textContent = previewText.length > 15 ? previewText.substring(0, 15) + '...' : previewText;

            tile.addEventListener('click', (e) => {
                e.stopPropagation();
                activeIndex = idx;

                let modal = document.getElementById('standaloneNoteModal');
                if (!modal) {
                    const modalWrapper = document.createElement('div');
                    modalWrapper.innerHTML = `
                        <div id="standaloneNoteModal" tabindex="0">
                            <div id="standaloneNoteContentRow">
                                <textarea id="standaloneNoteTextarea" placeholder="Note..." spellcheck="false"></textarea>
                            </div>
                            <div id="standaloneNoteGrabHandle" title="Drag Modal"></div>
                        </div>
                    `;
                    document.body.appendChild(modalWrapper);
                    modal = document.getElementById('standaloneNoteModal');

                    document.getElementById('standaloneNoteTextarea').addEventListener('input', (ev) => {
                        if (notesList.length > 0) {
                            notesList[activeIndex] = ev.target.value;
                            ev.target.style.height = 'auto';
                            ev.target.style.height = (ev.target.scrollHeight + 4) + 'px';
                        }
                    });

                    let isDragging = false, startX, startY;
                    modal.addEventListener('mousedown', (ev) => {
                        if (ev.target.tagName === 'TEXTAREA') return;
                        isDragging = true;
                        startX = ev.clientX - modal.offsetLeft;
                        startY = ev.clientY - modal.offsetTop;
                    });
                    document.addEventListener('mousemove', (ev) => {
                        if (!isDragging) return;
                        modal.style.left = `${ev.clientX - startX}px`;
                        modal.style.top = `${ev.clientY - startY}px`;
                    });
                    document.addEventListener('mouseup', () => { isDragging = false; });

                    modal.addEventListener('touchstart', (ev) => {
                        if (ev.target.tagName === 'TEXTAREA') return;
                        if (ev.touches.length === 1) {
                            isDragging = true;
                            startX = ev.touches[0].clientX - modal.offsetLeft;
                            startY = ev.touches[0].clientY - modal.offsetTop;
                            ev.preventDefault();
                        }
                    }, { passive: false });
                    document.addEventListener('touchmove', (ev) => {
                        if (isDragging && ev.touches.length === 1) {
                            modal.style.left = `${ev.touches[0].clientX - startX}px`;
                            modal.style.top = `${ev.touches[0].clientY - startY}px`;
                            ev.preventDefault();
                        }
                    }, { passive: false });
                    document.addEventListener('touchend', () => { isDragging = false; });
                }

                const textarea = document.getElementById('standaloneNoteTextarea');
                const contentRow = document.getElementById('standaloneNoteContentRow');

                textarea.value = notesList[activeIndex];
                contentRow.style.width = '100px';
                textarea.style.height = 'auto';
                textarea.style.height = (textarea.scrollHeight + 4) + 'px';
                contentRow.style.height = 'auto';

                modal.style.display = 'inline-flex';
                modal.focus();
            });

            tilesContainer.appendChild(tile);
        });
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', parseAndBuildNoteTiles);
    } else {
        parseAndBuildNoteTiles();
    }

    const scriptArea = document.getElementById('worksheetScript');
    if (scriptArea) {
        const observer = new MutationObserver(parseAndBuildNoteTiles);
        observer.observe(scriptArea, { characterData: true, subtree: true, attributes: true, childList: true });
        scriptArea.addEventListener('input', parseAndBuildNoteTiles);
        scriptArea.addEventListener('change', parseAndBuildNoteTiles);
    }
})();
</script>

<script>
/* ==========================================
    ROBUST ARROW-DRIVEN STUDENT PICKER & SPINNER SYNC
    Standalone (Queue + Wheel Display Activation)
========================================== */
(function() {
    // 1. Inject custom styles for the student tab grab handle
    const style = document.createElement('style');
    style.textContent = `
        #pGrabDot {
            width: auto !important;
            height: 22px !important;
            background-color: #E8D8B5 !important;
            border: 1px solid #B99F6B !important;
            border-radius: 4px !important;
            padding: 0 8px !important;
            font-size: 11px !important;
            font-family: Arial, sans-serif !important;
            font-weight: bold !important;
            color: #222 !important;
            cursor: pointer !important;
            display: inline-flex !important;
            align-items: center !important;
            justify-content: center !important;
            white-space: nowrap !important;
            user-select: none !important;
            box-sizing: border-box !important;
            margin: 0 4px !important;
        }
        #pGrabDot::after {
            display: none !important;
        }
        #pGrabDot:hover {
            filter: brightness(0.95);
        }
    `;
    document.head.appendChild(style);

    // 2. Synchronize student name and team colors to the grab handle
    function updateStudentTab() {
        const grabDot = document.getElementById('pGrabDot');
        if (!grabDot) return;

        // Get the current student directly from the wheel data.
        // Wheel.students contains { name, team, color } for each student.
        if (window.Wheel && window.Wheel.currentName) {
            const currentStudent = Array.isArray(window.Wheel.students)
                ? window.Wheel.students.find(
                    student => student.name === window.Wheel.currentName
                )
                : null;

            grabDot.textContent = window.Wheel.currentName;

            if (currentStudent && currentStudent.color) {
                grabDot.style.setProperty(
                    'background-color',
                    currentStudent.color,
                    'important'
                );
                grabDot.style.setProperty(
                    'color',
                    '#111',
                    'important'
                );
            }

            return;
        }

        const studentTile = document.querySelector(
            '.studentTile, .selected-student, [data-student], .active-student, .student-item.active'
        );

        const studentSelect = document.querySelector(
            'select.studentSelect, select[name*="student"], select.student-picker'
        );

        let name = null;
        let bgColor = "#E8D8B5";

        if (studentTile) {
            name = studentTile.textContent.trim();
            bgColor =
                studentTile.style.background ||
                studentTile.style.backgroundColor ||
                bgColor;
        } else if (studentSelect && studentSelect.selectedIndex >= 0) {
            name = studentSelect.options[studentSelect.selectedIndex].text.trim();
        }

        if (name) {
            grabDot.textContent = name;

            grabDot.style.setProperty(
                'background-color',
                bgColor,
                'important'
            );

            grabDot.style.setProperty(
                'color',
                '#111',
                'important'
            );
        }
    }

    // 3. Advance the student queue AND force the wheel display/animation state to update
function triggerNamePicker() {
        const wheelOverlay = document.getElementById("studentWheelOverlay");
        if (wheelOverlay && wheelOverlay.style.display === "flex" && typeof spinWheel === "function") {
            spinWheel();
            return;
        }

        let advanced = false;

        // A. Direct programmatic queue advancement
        if (typeof window.nextStudent === 'function') {
            window.nextStudent();
            advanced = true;
        } else if (window.Wheel && typeof window.Wheel.next === 'function') {
            window.Wheel.next();
            advanced = true;
        }

        // B. Cycle through student tiles/rows to update column highlighting
        const studentTiles = Array.from(
            document.querySelectorAll(
                '.studentTile, .student-item, [data-student-id], .picker-student'
            )
        );

        if (studentTiles.length > 0) {
            const activeIndex = studentTiles.findIndex(
                el =>
                    el.classList.contains('active') ||
                    el.classList.contains('selected')
            );

            let nextIndex =
                (activeIndex >= 0)
                    ? (activeIndex + 1) % studentTiles.length
                    : 0;
            
            studentTiles[nextIndex].click();
            advanced = true;
        }

        // C. Fallback dropdown index rotation
        if (!advanced) {
            const studentSelect = document.querySelector(
                'select.studentSelect, select[name*="student"], select.student-picker'
            );

            if (studentSelect && studentSelect.options.length > 0) {
                studentSelect.selectedIndex =
                    (studentSelect.selectedIndex + 1) %
                    studentSelect.options.length;

                studentSelect.dispatchEvent(
                    new Event('change', { bubbles: true })
                );

                advanced = true;
            }
        }

        // D. Force the wheel display / render methods to update their visual slice/pointer if available
        if (window.Wheel && typeof window.Wheel.draw === 'function') {
            window.Wheel.draw();
        } else if (window.Wheel && typeof window.Wheel.update === 'function') {
            window.Wheel.update();
        } else if (typeof window.renderWheel === 'function') {
            window.renderWheel();
        }

        setTimeout(updateStudentTab, 150);
    }

    // 4. Broadly intercept clicks on up/down arrows, chevrons, and answer navigation
    document.addEventListener('click', function(e) {
        if (e.target.closest('#pGrabDot')) return;

        const target = e.target.closest(
            'button, a, [role="button"], div, span, svg, path'
        );

        if (!target) return;

        const text = target.textContent || '';

        const idClass = (
            (target.id || '') + ' ' + 
            (target.className && typeof target.className === 'string'
                ? target.className
                : '') + ' ' + 
            (target.getAttribute('aria-label') || '') + ' ' + 
            (target.getAttribute('title') || '') + ' ' +
            (target.parentElement ? target.parentElement.className : '')
        ).toLowerCase();

        const isArrowAction = 
            idClass.includes('up') || 
            idClass.includes('down') || 
            idClass.includes('chevron') || 
            idClass.includes('arrow') || 
            idClass.includes('next') || 
            idClass.includes('prev') || 
            idClass.includes('inc') || 
            idClass.includes('dec') ||
            text.includes('▲') || text.includes('▼') || 
            text.includes('↑') || text.includes('↓') ||
            text.includes('∧') || text.includes('∨');

        if (isArrowAction) {
            triggerNamePicker();
        }
    }, true);

    // 5. Continuous background sync to keep the grab bar tab updated
    setInterval(updateStudentTab, 400);

})();
</script>

<script>
(function() {
  // Prevent pinch-to-zoom
  function preventPinch(e) {
    if (e.touches.length > 1) e.preventDefault();
  }

  // Prevent double-tap zoom
  let lastTouchTime = 0;
  function preventDoubleTap(e) {
    const now = Date.now();
    if (now - lastTouchTime < 300) {
      e.preventDefault();
    }
    lastTouchTime = now;
  }

  // Block gesture events on iOS
  function preventGesture(e) {
    e.preventDefault();
  }

  document.addEventListener('touchstart', preventPinch, { passive: false });
  document.addEventListener('touchend', preventDoubleTap, { passive: false });
  document.addEventListener('gesturestart', preventGesture, { passive: false });
})();

            particles.push({

                fadePoint: canvas.height * (0.3 + (Math.random() * 0.4)),

                fadeSpeed: 0.015 + (Math.random() * 0.02)
            });
        }
    }

    function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

            p.y += p.vy;

            }

            ctx.save();
            ctx.globalAlpha = Math.max(0, p.opacity);
            ctx.translate(p.x, p.y);
            ctx.rotate(p.rotation);
            ctx.fillStyle = p.color;
            ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);

<script>
(function(){
    "use strict";

    /* ==========================================
       1. BLACKLIST (BL) STATE & CONFIG
    ========================================== */
    let blEnabled = true; // Toggle state: off by default

    const RAW_BLACKLIST_TEXT = `
~16.2

Green Jirayu

Orange Setthawut

Orange Theerapatch

Orange Theeraphat

Orange Pannatat

Red Thanakrit

Red Nakhun

Red Boonpipon

Red Warawat

Purple Tarzan



~15.3

Blue Akkravich

Blue Thanakorn
    `;

    function parseBlacklist(text) {
        const set = new Set();
        text.split(/\r?\n/).forEach(line => {
            let clean = line.trim();
            if (!clean || clean.startsWith("#")) return;
            const parts = clean.split(/\s+/);
            set.add(parts[parts.length - 1].toLowerCase());
        });
        return set;
    }

    let blacklistedNames = parseBlacklist(RAW_BLACKLIST_TEXT);

        modal.style.display = "none";

    });

    function updateButtonStates() {
        const btnLeft = document.getElementById("blLeftBtn");
        const btnRight = document.getElementById("blRightBtn");
        
        [btnLeft, btnRight].forEach(btn => {
            if (!btn) return;
            if (blEnabled) {
                btn.classList.add("active");
                btn.textContent = "BL [ON]";
            } else {
                btn.classList.remove("active");
                btn.textContent = "BL [OFF]";
            }
        });
    }

    function toggleBL() {
        blEnabled = !blEnabled;
        updateButtonStates();
    }

    function injectBLButtons() {

    if(document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", injectBLButtons);
    } else {
        injectBLButtons();
    }

    /* ==========================================
       3. BULLETPROOF SELECTION INTERCEPTION
    ========================================== */
    function isBlacklisted(name) {
        if (!blEnabled) return false;
        if (!name) return false;
        const clean = name.toString().trim().toLowerCase();
        for (let b of blacklistedNames) {
            if (clean === b || clean.includes(b)) return true;
        }
        return false;
    }

    // Hook into `nextStudent` to automatically skip blacklisted students in the queue / tab selection
    if (typeof window.nextStudent === "function") {
        const originalNextStudent = window.nextStudent;
        window.nextStudent = function() {
            if (!blEnabled) return originalNextStudent.apply(this, arguments);

            // Run original picker, but if it lands on a blacklisted student, keep spinning/skipping until a valid one is found
            let safety = 0;
            do {
                originalNextStudent.apply(this, arguments);
                safety++;
                // Check current tile name
                const tile = document.querySelector(".studentTile");
                if (!tile || !isBlacklisted(tile.textContent)) break;
            } while (safety < 20);
        };
    }

    // Bulletproof Wheel Interception: Ensures the wheel target / winner is NEVER blacklisted
    setInterval(() => {
        if (!blEnabled) return;

        // 1. If Wheel object is active and picks a winner
        if (typeof Wheel !== "undefined" && Wheel.spinning === false) {
            if (Wheel.currentName && isBlacklisted(Wheel.currentName)) {
                // Force shift to next valid student in queue
                if (typeof window.nextStudent === "function") {
                    window.nextStudent();
                    const tile = document.querySelector(".studentTile");
                    if (tile) Wheel.currentName = tile.textContent.trim();
                }
            }
        }
    }, 100);

})();

                    shield.style.boxSizing = "border-box";
                    shield.style.borderRadius = computed.borderRadius;

        modal.style.setProperty(

    height:100%;
    overflow:hidden;
    font-family:Arial,sans-serif;
    background:black !important;
}
/* ==========================
   MAIN LAYOUT
========================== */

#main{
    display:flex;
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 48px; /* 24px tilesBar + 24px scriptBar */
}
/* ==========================
   LEFT COLUMN
========================== */

#leftColumn{
    width:90px;
    min-width:90px;
    background:black !important;
    border-right:1px solid #999;
    display:flex;
    flex-direction:column;
    justify-content:flex-start;
    position: relative;
}

/* ==========================
   RIGHT COLUMN
========================== */

#rightColumn{
    width:90px;
    min-width:90px;
    background:black !important;
    border-left:1px solid #999;
    display:flex;
    flex-direction:column;
    justify-content:flex-start;
    position: relative;
}

#clearBoardBtn,
#clearBoardBtnRight{
    height:24px;
    font-size:10px;
    border:none;
    border-bottom:1px solid #999;
    cursor:pointer;
}

/* ==========================
   UNIT FOLDERS & FLYOUTS
========================== */
.unitFolderContainer {
    position: static;
    width: 100%;
}

.unitFolderBtn {
    width: 100%;
    height: 22px;
    font-size: 9px;
    background: black;
    color: white;
    border: none;
    border-bottom: 1px solid #333;
    cursor: pointer;
    text-align: center;
}

.unitFolderBtn:hover {
    background: #fdfdfd !important;
    color: #111 !important;
}

.spreadFlyout {
    display: none;
    position: absolute;
    left: 90px;
    top: 0;
    width: 140px;
    max-height: calc(100vh - 124px);
    background: black;
    border: 1px solid #555;
    z-index: 20000;
    overflow-y: auto;
    box-shadow: 2px 2px 10px rgba(0,0,0,0.8);
}

#rightColumn .spreadFlyout {
    left: auto;
    right: 90px;
}

.spreadFlyout.active {
    display: flex;
    flex-direction: column;
}

.spreadFlyoutItem {
    padding: 6px 8px;
    font-size: 10px;
    color: white;
    background: black;
    border-bottom: 1px solid #222;
    cursor: pointer;
    text-align: center;
    white-space: nowrap;
}

.spreadFlyoutItem:hover {
    background: #4a90e2 !important;
    color: white !important;
}

/* Unit Grid Layout Container (2 columns) */
.unitGrid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 1px;
    background: #333;
    padding: 1px;
}

/* ==========================
   VIEWER
========================== */

#viewer{
    flex:1;
    overflow:hidden;
    background:black;
    position:relative;
    cursor: move;
    touch-action:none;
}

#spread{
    position:absolute;
    top:0;
    left:0;
    height:100%;
    white-space:nowrap;
    font-size:0;
}

/* ==========================
   PAGES
========================== */

.imagePanel{
    display:inline-block;
    height:100%;
}

.imgWrap{
    width:100%;
    height:100%;
    overflow:hidden;
    position:relative;
}

.pageImage{
    display:block;
    height:100%;
    width:auto;
    pointer-events: none;
}

.leftPage{
    left:0;
    width:100%;
    clip-path: none;
}

.rightPage{
    left:0;
    width:100%;
    clip-path: none;
}
/* ==========================
   TILES
========================== */

#tilesBar {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 24px;
    height: 8px; /* Loads closed */
    display: flex;
    flex-direction: column;
    border-top: 1px solid #555;
    background: #222; /* Instantly paints the grey bar on first frame */
    z-index: 9998;
    box-sizing: border-box;
    overflow: hidden; /* Keeps the tiles hidden until dragged open */
}
#tiles{
    flex: 1;
    background: black !important;
    display: flex;
    flex-wrap: wrap;
    gap: 2px;
    padding: 4px;
    overflow-y: auto;
    overflow-x: hidden;
    align-content: flex-start;
    justify-content: flex-start;
}
.tile{
    min-width:8ch;
    height:14px;
    line-height:14px;
    font-size:9px;
    padding:0 4px;
    margin:0;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    background:#E8D8B5;
    border:1px solid #B99F6B;
    color:#222;
    cursor:pointer;
    white-space:nowrap;
    user-select:none;
}

.tile.selected{
    background:#4a90e2 !important;
    border-color:#2f6fb7;
    color:white !important;
}

/* Designated Prefix Tile Colors */
.tile[data-prefix="~I"] {
    background: #e74c3c !important;
    border-color: #c0392b !important;
    color: white !important;
}

/* Emoji (~E) -> Orange */
.tile[data-prefix="~E"] {
    background: #e67e22 !important;
    border-color: #d35400 !important;
    color: white !important;
}

.tile[data-prefix="~SP"] {
    background: #2ecc71 !important;
    border-color: #27ae60 !important;
    color: white !important;
}

/* Sound Effects (~SX) -> Green */
.tile[data-prefix="~SX"] {
    background: #2ecc71 !important;
    border-color: #27ae60 !important;
    color: white !important;
}

#tilesResizeBar{
    height: 8px;
    width: 100%;
    background: #999;
    cursor: ns-resize;
    flex-shrink: 0;
    z-index: 10001;
}/* ==========================
   DRAGGABLES
========================== */

.draggable {
    position: absolute;
    z-index: 9999;
    cursor: move;
    user-select: none;
    -webkit-user-drag: none;
    touch-action: none;
    transition: none !important;
    animation: none !important;
    filter: none !important;
    transform: none !important;
}

.overlayPng {
    position: absolute;
    width: 140px;
    height: auto;
    background: transparent !important;
    border: none !important;
    padding: 0 !important;
    margin: 0 !important;
    display: block;
    pointer-events: auto;
    object-fit: contain;
}

img {
    -webkit-user-drag: none;
    -webkit-touch-callout: none;
}

#viewer, #spread, .imagePanel, .imgWrap {
    user-select: none;
    -webkit-user-select: none;
    -ms-user-select: none;
}

#deleteBtn,
#deleteBtnRight {
    width:100%;
    height:24px;
    font-size:10px;
    border:none;
    border-bottom:1px solid #999;
    cursor:pointer;
    background:black;
    color:white;
}

#scriptBar{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    height:24px;
    display:flex;
    flex-direction:row;
    align-items:stretch;
    border-top:1px solid #999;
    background:black;
    z-index:10000;
}

#scriptResizeBar{
    position:absolute;
    top:-8px;
    left:0;
    width:100%;
    height:8px;
    background:#999;
    cursor:ns-resize;
    z-index:10001;
}

#worksheetScript{
    flex:1;
    height:22px;
    resize:none;
    overflow:auto;
    font:10px Consolas,monospace;
    white-space:pre;
    border:none;
    outline:none;
    background: black !important;
    color: white !important;
    scrollbar-width:none;
}

#worksheetScript::-webkit-scrollbar{
    display:none;
}

#downloadTxtBtn{
    width:32px;
    height:22px;
    font-size:10px;
    border:none;
    border-left:1px solid #999;
    background:black;
    color:white;
    cursor:pointer;
    padding:0;
}

#downloadTxtBtn:hover{
    background:#333;
}

#scriptBar.expanded{
    height:220px;
}

#scriptBar.expanded #worksheetScript{
    height:218px;
}/* ==========================
   BREAK MODAL
========================== */

#breakModal{
    position:absolute;
    width:260px;
    height:180px;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    background:#000;
    border-radius:15px;
    color:white;
    z-index:50000;
    display:none;
    box-shadow: 0 0 30px rgba(0,0,0,.6);
    backdrop-filter:blur(4px);
    cursor:move;
    user-select:none;
}

#breakContent{
    height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
}

#breakContent h1{
    font-size:32px;
    margin:0;
    text-shadow: 0 0 20px black;
}

#breakTimer{
    margin-top:5px;
    font-size:34px;
    color:orange;
    text-shadow: 0 0 15px black;
}

#breakStart{
    margin-top:20px;
    transform:translateY(-15px);
    padding:8px 18px;
    border:none;
    border-radius:8px;
    background:orange;
    font-weight:bold;
    cursor:pointer;
}

.breakControls{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    margin-top:5px;
}

.breakArrow{
    display:flex;
    align-items:center;
    justify-content:center;
    color:orange;
    font-size:24px;
    cursor:pointer;
    user-select:none;
    height:40px;
    transform:translateY(-5px);
}

.breakControls button{
    margin:0;
    padding:8px 10px;
    font-size:12px;
    border:none;
    border-radius:6px;
    background:orange;
    cursor:pointer;
    font-weight:bold;
}

.breakControls button:hover{
    background:#ffb347;
}

.breakArrow:hover{
    color:#ffb347;
}

.spinnerAssembly{
    position: absolute;
    z-index: 5001;
    pointer-events: none;
}

.spinnerButton{
    width: 100%;
    height: 24px;
    font-size: 10px;
    font-family: Arial, sans-serif;
    border: none;
    border-bottom: 1px solid #999;
    background: black;
    color: white;
    cursor: pointer;
    padding: 0;
    pointer-events: auto;
}

#tallymanLeftBtn,
#tallymanRightBtn{
    height:24px;
    width:100%;
    font-size:10px;
    border:none;
    border-bottom:1px solid #999;
    cursor:pointer;
    background:black;
    color:white;
}

#leftColumn *,
#rightColumn * {
    outline: none !important;
    box-shadow: none !important;
}

#leftColumn,
#rightColumn {
    background: black !important;
}

#leftColumn button,
#rightColumn button,
#leftColumn input,
#rightColumn input,
#leftColumn select,
#rightColumn select {
    background: black !important;
    color: white !important;
    border: none !important;
    outline: none !important;
    box-shadow: none !important;
}

#leftColumn button:hover,
#rightColumn button:hover {
    background: #fdfdfd !important;
    color: #111 !important;
}

#leftBtn,
#rightBtn {
    width: 100%;
    height: 24px;
    font-size: 10px;
    border: none;
    border-bottom: 1px solid #999;
    cursor: pointer;
    background: black;
    color: white;
    padding: 0;
}

#loadAnswerBtn, #loadAnswerBtnRight {
    height: 24px;
    width: 100%;
    font-size: 10px;
    border: none;
    border-bottom: 1px solid #999;
    cursor: pointer;
    background-color: black;
    color: white;
}
#loadAnswerBtn:hover, #loadAnswerBtnRight:hover {
    background-color: #333;
}


.tile.mp3Tile {
    background: #4a90e2;
    color: black !important;
}

.tile.soundTile.soundSX {
    background: #4caf50;
    color: black !important;
}

/* Force all tiles, including image and audio titles/text, to be black */
#tiles .tile,
#tiles .tile *,
#tiles .mp3Tile,
#tiles .soundTile,
#tiles .imageTile,
#tiles .emojiTile,
.tile,
.mp3Tile,
.soundTile,
.imageTile,
.emojiTile {
    color: black !important;
}

/* Emoji Tiles (~E) -> White */
.tile.emojiTile[data-prefix="~E"],
.tile[data-prefix="~E"] {
    background: white !important;
    border-color: grey !important;
    color: black !important;
}

/* Image Tiles (~I) -> Pastel Orange */
.tile.imageTile[data-prefix="~I"],
.tile[data-prefix="~I"] {
    background: #f8c471 !important;
    border-color: #f39c12 !important;
    color: black !important;
}

/* Audio Tiles (~P) -> Pastel Green */
.tile[data-prefix="~P"] {
    background: #a9dfbf !important;
    border-color: #52be80 !important;
    color: black !important;
}



/* Audio Path Tiles (~SP) -> Green */
.tile[data-prefix="~SP"] {
    background: #2ecc71 !important;
    border-color: #27ae60 !important;
    color: white !important;
}
/* Sound Effects (~SX) -> Dark Green */
.tile[data-prefix="~SX"],
.tile.soundTile.soundSX {
background: #76d7c4 !important;
    border-color: #45b39d !important;
    color: white !important;
}


/* Purple Note Tile and Modal Styling */
.tile.noteTile {
    background-color: #800080 !important;
    color: white !important;
    border-color: #5e005e !important;
}
.tile.noteTile:hover {
    background-color: #9c1c9c !important;
}
#noteModal {
    position: absolute;
    z-index: 9999;
    top: 150px;
    left: 150px;
    background: #ffffff;
    border: 2px solid #800080;
    padding: 8px;
    border-radius: 12px;
    box-shadow: 0 4px 12px rgba(128,0,128,0.25);
    width: 320px;
    font-family: sans-serif;
    display: none;
    resize: both;
    overflow: hidden;
}
#noteModalHeader {
    display: flex;
    justify-content: space-between;
    align-items: center;
    cursor: move;
    background: #800080;
    color: white;
    padding: 4px 8px;
    border-radius: 6px;
    font-weight: bold;
    font-size: 13px;

}
#noteModalBody {
    width: 100%;

    padding: 6px;
    outline: none;
    resize: none;
    box-sizing: border-box;
    color: #333;
    line-height: 1.4;
    white-space: pre-wrap;
}

/* Hide scrollbars globally for all textareas and scrollable containers while keeping scroll active */
textarea::-webkit-scrollbar,
div::-webkit-scrollbar {
    display: none !important;
}

textarea,
div {
    -ms-overflow-style: none !important;  /* IE and Edge */
    scrollbar-width: none !important;     /* Firefox */
}


/* --- Inset Control Buttons & Borderless Vignette Panels --- */

/* --- Borderless packed vertical modal panels (200px wide, locked under top controls) --- */
/* --- Borderless packed vertical modal panels --- */
/* ==========================
   VIGNETTE MODAL PANELS & DRAG HANDLE
========================== */
/* ==========================
   VIGNETTE MODAL PANELS & TITLE DRAG BAR
========================== */
.vignette-modal-panel {
  display: none;
  position: fixed;
  width: 200px;
  top: 25px;                 /* <--- ADJUST THIS: Change from 75px to 0px (or 2px) to move it all the way to the top */
  bottom: 48px;             /* Stops above the bottom tiles/script bar */
  background: #000;
  border: 1px solid #444;
  z-index: 2147483646;
  flex-direction: column;
  overflow: hidden;
  box-shadow: 0 8px 24px rgba(0,0,0,0.5);
  border-radius: 6px;
}

.vignette-modal-panel.open {
  display: flex;
}

/* Left Panel positioning */
#vignetteLeftModal {
  left: 90px;               /* Sits immediately to the right of #leftColumn (90px wide) */
}

/* Right Panel positioning - Locked flush against the left edge of #rightColumn (90px wide) */
#vignetteRightModal {
  right: 90px;              /* Matches the exact width of #rightColumn */
  left: auto !important;    /* Prevents any script from overriding */
}

/* Distinct Drag Title Bar for precise control */
.vignette-drag-handle {
  height: 24px;
  background: #1a1a1a;
  color: #fff;
  cursor: grab;
  width: 100%;
  flex-shrink: 0;
  border-bottom: 1px solid #444;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: Arial, sans-serif;
  font-size: 10px;
  font-weight: bold;
  letter-spacing: 1px;
  touch-action: none;
  user-select: none;
}
.vignette-drag-handle:active {
  cursor: grabbing;
  background: #333;
}

/* Zero padding, zero margin packed scroll container */
.vignette-scroll-box {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 0;
  margin: 0;
  display: flex;
  flex-direction: column;
  gap: 0;
  scrollbar-width: none;
}

.vignette-scroll-box::-webkit-scrollbar {
  display: none;
}

/* Packed 200px by 200px iframe items with zero borders/margins */
.vignette-card {
  width: 200px;
  height: 200px;
  min-width: 200px;
  min-height: 200px;
  margin: 0;
  padding: 0;
  border: none;
  background: #000;
  display: block;
  position: relative;
  flex-shrink: 0;
}

.vignette-card iframe {
  width: 200px;
  height: 200px;
  border: none;
  margin: 0;
  padding: 0;
  transform: none;          /* No scaling needed; full 200px size */
  pointer-events: auto;     /* Enables direct interaction */
}</style>

/* ==========================
   MINI TIMER STANDALONE
========================== */

(function(){

const style = document.createElement("style");

style.textContent = `

#miniTimer{

    position:fixed;

    top:2px;

    right:92px;

    width:80px;

    height:20px;

    background:#ff9900;

    border:1px solid #cc6600;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:10px;

    font-weight:bold;

    color:black;

    z-index:100000;

    user-select:none;

    font-family:Arial,sans-serif;

}


#miniTimer span{

    cursor:pointer;

    font-size:12px;

    line-height:20px;

    padding:0 3px;

}


#miniTimerTime{

    min-width:25px;

    text-align:center;

}

`;

document.head.appendChild(style);



const timer = document.createElement("div");

timer.id="miniTimer";


timer.innerHTML=`

<span id="miniDown">▼</span>

<span id="miniTimerTime">00:00</span>

<span id="miniUp">▲</span>

`;


document.body.appendChild(timer);



let seconds = 0;

let interval = null;



const display =
document.getElementById("miniTimerTime");



let audioCtx = null;



function initAudio(){

    if(!audioCtx){

        audioCtx =
        new (window.AudioContext || window.webkitAudioContext)();

    }


    if(audioCtx.state === "suspended"){

        audioCtx.resume();

    }

}



/* ==========================
   UPDATE DISPLAY
========================== */

function update(){

    let m=Math.floor(seconds/60);

    let s=seconds%60;


    display.textContent =
    String(m).padStart(2,"0")
    +":"
    +String(s).padStart(2,"0");

}



/* ==========================
   ELECTRONIC BUZZER
========================== */

function playBuzzer(){

    if(!audioCtx)
        return;


    const osc =
    audioCtx.createOscillator();


    const gain =
    audioCtx.createGain();


    osc.type="square";

    osc.frequency.value=900;


    gain.gain.setValueAtTime(
        0.3,
        audioCtx.currentTime
    );


    gain.gain.exponentialRampToValueAtTime(
        0.001,
        audioCtx.currentTime + 0.8
    );


    osc.connect(gain);

    gain.connect(audioCtx.destination);


    osc.start();

    osc.stop(
        audioCtx.currentTime + 0.8
    );

}



/* ==========================
   START COUNTDOWN
========================== */

function start(){

    if(interval)
        clearInterval(interval);


    interval=setInterval(()=>{


        seconds--;

        update();


        if(seconds<=0){


            clearInterval(interval);

            interval=null;


            seconds=0;

            update();


            playBuzzer();


        }


    },1000);

}



/* ==========================
   CONTROLS
========================== */


document.getElementById("miniUp")
.onclick=function(){

    initAudio();


    seconds+=60;


    update();


    start();

};



document.getElementById("miniDown")
.onclick=function(){

    initAudio();


    seconds-=60;


    if(seconds<0)
        seconds=0;


    update();


    if(seconds>0)
        start();

};



update();



})();

</script>

<script>

/* ==========================
   BREAK TIMER MODAL
========================== */


let breakInterval=null;
let breakRemaining=300;


function openBreakModal(){

    const modal = document.getElementById("breakModal");


    if(modal.style.display === "block"){

        // hide modal
        modal.style.display = "none";

        // optionally stop timer
        clearInterval(breakInterval);
        breakInterval = null;

        return;
    }


    // show modal
    modal.style.display = "block";

    startBreak();

}

function renderBreak(){

    let m=Math.floor(breakRemaining/60);

    let s=String(breakRemaining%60)
        .padStart(2,"0");

    document.getElementById("breakTimer")
        .textContent=`${m}:${s}`;

}

function adjustBreakTime(amount){

    /*
       If timer is finished,
       start a new countdown.
    */

    if(breakRemaining <= 0){

        startBreak(amount);

    }
    else{

        /*
           Add time to current countdown.
        */

        breakRemaining += amount;

        renderBreak();

    }


    /*
       Restart audio whenever + button is clicked.
    */

    if(typeof restartMusicAfterExtension === "function"){

        restartMusicAfterExtension();

    }

}



function startBreak(duration=300){

    clearInterval(breakInterval);


    /*
       Start new countdown duration.
       Works after Time's up.
    */

    breakRemaining = duration;

    renderBreak();


    breakInterval = setInterval(()=>{

        breakRemaining--;

        renderBreak();


        if(breakRemaining <= 0){

            clearInterval(breakInterval);

            breakInterval = null;


            document
            .getElementById("breakTimer")
            .textContent = "Time's up!";


            /*
               Keep value at zero so
               next + click starts a new break.
            */

            breakRemaining = 0;

        }

    },1000);

}

document
.getElementById("breakStart")
.onclick=()=>startBreak();

document
.getElementById("breakPlus")
.onclick=()=>adjustBreakTime(60);


document
.getElementById("breakMinus")
.onclick=()=>adjustBreakTime(-60);



/* ==========================
   DRAGGABLE BREAK MODAL
========================== */

(function(){

let modal=document.getElementById("breakModal");

let dragging=false;

let offsetX=0;
let offsetY=0;


modal.addEventListener("mousedown",e=>{

    dragging=true;

    offsetX=e.clientX-modal.offsetLeft;
    offsetY=e.clientY-modal.offsetTop;

});


document.addEventListener("mousemove",e=>{

    if(!dragging)return;


    modal.style.left=
        (e.clientX-offsetX)+"px";


    modal.style.top=
        (e.clientY-offsetY)+"px";


    modal.style.transform="none";

});


document.addEventListener("mouseup",()=>{

    dragging=false;

});


})();

</script>

    breakMusic.loop = true;
    breakMusic.preload = "auto";

        breakMusic.pause();

        breakMusic.currentTime = 0;


        breakMusic.play()
        .then(()=>{

            console.log(
                "Coffee music restarted"
            );

        })
        .catch(err=>{

            console.log(
                "Coffee music blocked:",
                err
            );

        });


        watchBreakTimer();

    }



    function startBreakMusic(){

        if(!breakMusic.paused){
            return;
        }


        playMusicFromStart();

    }



    function restartBreakMusic(){

        /*
           Restart button
        */

        playMusicFromStart();

    }



    function restartMusicAfterExtension(){

        /*
           Up button:
           Timer has already been increased elsewhere.
           We only restart audio.
        */

        playMusicFromStart();

    }



    function stopBreakMusic(){

        breakMusic.pause();

        breakMusic.currentTime = 0;


        clearInterval(musicTimer);

        musicTimer = null;

    }



    function watchBreakTimer(){

        clearInterval(musicTimer);


        musicTimer = setInterval(()=>{


            if(
                typeof breakRemaining !== "undefined" &&
                breakRemaining <= 0
            ){

                stopBreakMusic();

            }


        },500);

    }



    /*
       Existing Break modal connection
    */

    const oldOpenBreakModal =
        window.openBreakModal;


    window.openBreakModal = function(){


        const modal =
            document.getElementById("breakModal");


        if(
            modal &&
            modal.style.display === "block"
        ){

            stopBreakMusic();

        }
        else{

            startBreakMusic();

        }


        oldOpenBreakModal();

    };



    /*
       Global controls
    */

    window.startBreakMusic =
        startBreakMusic;


    window.stopBreakMusic =
        stopBreakMusic;


    window.restartBreakMusic =
        restartBreakMusic;


    window.restartMusicAfterExtension =
        restartMusicAfterExtension;



})();
</script>

// Automatically generate dynamic page pairs from raw file lists
function generateSpreads(fileList) {
    let focusFiles = [];
    let actImgFiles = [];

    fileList.forEach(file => {
        const upper = file.toUpperCase();
        
        // Filter out standalone placeholder blanks from appearing on their own
        if (upper === "WHITE_BLANK.JPG" || upper === "BLACK_BLANK.JPG") {
            return;
        }

        // Catch ACT or IMG files regardless of parentheses or prefix structure
        if (upper.startsWith("ACT") || upper.startsWith("IMG")) {
            actImgFiles.push(file);
        } else if (upper.startsWith("FOCUS") || upper.includes("(")) {
            focusFiles.push(file);
        }
    });

    let pairs = [];

    // Pair regular sequential files into spreads of 2
    for (let i = 0; i < focusFiles.length; i += 2) {
        if (i + 1 < focusFiles.length) {
            pairs.push([focusFiles[i], focusFiles[i + 1]]);
        } else {
            pairs.push([focusFiles[i], "WHITE_BLANK.jpg"]);
        }
    }

    // Pair ACT or IMG files automatically according to naming indicator (+BLACK / +WHITE)
    actImgFiles.forEach(file => {
        let blankChoice = "WHITE_BLANK.jpg";
        if (file.toUpperCase().includes("+BLACK") || file.toUpperCase().includes("BLACK")) {
            blankChoice = "BLACK_BLANK.jpg";
        }
        pairs.push([file, blankChoice]);
    });

    return pairs;
}

function buildUnitFolders(containerId) {

        const folderBtn = document.createElement("button");

        folderBtn.textContent = unitName;

        const flyout = document.createElement("div");
        flyout.className = "spreadFlyout";

        const unitSpreads = generateSpreads(rawUnitFiles[unitName]);
        unitSpreads.forEach(([leftFile, rightFile]) => {
            const spreadItem = document.createElement("div");
            spreadItem.className = "spreadFlyoutItem";
            
            const cleanLeft = leftFile.replace(/\.[^/.]+$/, "");
            const cleanRight = rightFile.replace(/\.[^/.]+$/, "");
            spreadItem.textContent = `${cleanLeft} - ${cleanRight}`;
            
            spreadItem.onclick = (e) => {
                e.stopPropagation();
                loadSpread(`${unitName}/${leftFile}`, `${unitName}/${rightFile}`);
                document.querySelectorAll(".spreadFlyout").forEach(f => f.classList.remove("active"));
            };
            flyout.appendChild(spreadItem);
        });

        folderBtn.onclick = (e) => {
            e.stopPropagation();
            const isOpen = flyout.classList.contains("active");
            document.querySelectorAll(".spreadFlyout").forEach(f => f.classList.remove("active"));
            if (!isOpen) {
                flyout.style.top = "0px";
                flyout.classList.add("active");
            }
        };

        folderWrapper.appendChild(folderBtn);
        folderWrapper.appendChild(flyout);
        container.appendChild(folderWrapper);
    });
}

}/* ==========================
   FEATURE 5: ZOOM, PAN & CAMERA CLAMPING
========================== */

let viewerScale = 1;
let panX = 0;
let panY = 0;
let panLocked = false;
let isPanning = false;
let lastX = 0;
let lastY = 0;

window.spread = document.getElementById("spread");
const viewer = document.getElementById("viewer");

const zoomSelects = document.querySelectorAll("#zoomSelect, #zoomSelectRight, .zoomSelect");

zoomSelects.forEach(select => {
    select.addEventListener("change", function(){
        viewerScale = Number(this.value);
        zoomSelects.forEach(s => s.value = this.value);
        updateTransform();
    });
});

function updateTransform(){
    if (!spread) return;
    spread.style.transform = `translate(${panX}px, ${panY}px) scale(${viewerScale})`;
    spread.style.transformOrigin = "0 0";
}

if (viewer) {
    viewer.addEventListener("pointerdown", (e) => {
        if(e.target.classList.contains("draggable")) return;
        if(placeMode) return;
        if(panLocked) return;
        if(e.button !== 0) return;

        isPanning = true;
        lastX = e.clientX;
        lastY = e.clientY;
        viewer.setPointerCapture(e.pointerId);
    });

    viewer.addEventListener("pointermove", (e) => {
        if (panLocked) return;
        if (!isPanning) return;

        const dx = e.clientX - lastX;
        const dy = e.clientY - lastY;

        panX += dx;
        panY += dy;

        lastX = e.clientX;
        lastY = e.clientY;

        if (spread) {
            const rect = viewer.getBoundingClientRect();
            const contentW = spread.offsetWidth * viewerScale;
            const contentH = spread.offsetHeight * viewerScale;
            const viewW = rect.width;
            const viewH = rect.height;

            if (contentW <= viewW) {
                panX = (viewW - contentW) / 2;
            } else {
                panX = Math.max(viewW - contentW, Math.min(0, panX));
            }

            if (contentH <= viewH) {
                panY = (viewH - contentH) / 2;
            } else {
                panY = Math.max(viewH - contentH, Math.min(0, panY));
            }
        }

        updateTransform();
    }, true);

viewer.addEventListener("wheel", function(e){
    if(panLocked) return;
    e.preventDefault();

    panX -= e.deltaX;
    panY -= e.deltaY;

    if (spread) {
        const rect = viewer.getBoundingClientRect();
        const contentW = spread.offsetWidth * viewerScale;
        const contentH = spread.offsetHeight * viewerScale;
        const viewW = rect.width;
        const viewH = rect.height;

        // Horizontal boundaries
        if (contentW <= viewW) {
            panX = (viewW - contentW) / 2;
        } else {
            panX = Math.max(
                viewW - contentW,
                Math.min(0, panX)
            );
        }

        // Vertical boundaries
        if (contentH <= viewH) {
            panY = (viewH - contentH) / 2;
        } else {
            panY = Math.max(
                viewH - contentH,
                Math.min(0, panY)
            );
        }
    }

    updateTransform();
}, { passive: false });;

    viewer.addEventListener("pointerup", (e) => {
        isPanning = false;
        if (e.pointerId) {
            try { viewer.releasePointerCapture(e.pointerId); } catch(err) {}
        }
    });
}

<script>

====================================================== */

window.placeMode = window.placeMode || null;
window.selectedEl = window.selectedEl || null;

// Global audio element for ~S toggle playback
let globalSoundPlayer = null;

function getSoundPlayer() {
    if (!globalSoundPlayer) {
        globalSoundPlayer = document.createElement("audio");
        globalSoundPlayer.id = "soundPlayer";
        globalSoundPlayer.style.display = "none";
        document.body.appendChild(globalSoundPlayer);
    }
    return globalSoundPlayer;
}

// Unlock audio on first user action
let audioUnlocked = false;
function unlockAudio() {
    audioUnlocked = true;
    document.removeEventListener("pointerdown", unlockAudio);
    document.removeEventListener("keydown", unlockAudio);
}
document.addEventListener("pointerdown", unlockAudio, { once: true });
document.addEventListener("keydown", unlockAudio, { once: true });


/* ==========================
   MAIN BUILD FUNCTION (Sequential)
========================== */

function buildAllTiles() {
    const tileArea = document.getElementById("tiles");
    if (!tileArea) return;

    tileArea.innerHTML = ""; // Clear existing tiles

    const rawInput = document.getElementById("worksheetScript");
    if (!rawInput || !rawInput.value) return;

    let fullText = rawInput.value;
    let lines = fullText.split(/\r?\n/);

    // 1. Find and extract any "Unit ..." line so we can force it to the top
    let unitLineIndex = -1;
    let unitLineText = "";
    
    for (let i = 0; i < lines.length; i++) {
        let l = lines[i].trim();
        if (/^unit\s*\d+/i.test(l) && !l.startsWith("~") && !l.includes("-")) {
            unitLineText = l;
            unitLineIndex = i;
            break;
        }
    }

    // If found, remove it from its current position so we can place it first
    if (unitLineIndex !== -1) {
        lines.splice(unitLineIndex, 1);
    }

    // Helper function to render a single line into a tile
    function renderLineToTile(rawLine) {
        let line = rawLine.trim();
        if (!line) return;

// 1. HANDLE EXTERNAL MP3 FILES (~SP)
        if (/^~SP/i.test(line)) {
            let cleanLine = line.replace(/^~SP/i, "").trim();
            if (cleanLine.startsWith(".")) {
                cleanLine = "P" + cleanLine;
            } else if (/^\d/.test(cleanLine)) {
                cleanLine = "P." + cleanLine;
            }
            cleanLine = cleanLine.replace(/^[-–—]\s*/, "").trim();
            
            let match = cleanLine.match(/^(.+?)\s*[-–—]\s*(.+?\.mp3)\s*$/i);
            let label = match ? match[1].trim() : cleanLine.replace(/\.[^.]+$/, "");
            let file = match ? match[2].trim() : cleanLine;

            const tile = document.createElement("div");
            tile.className = "tile mp3Tile";
            tile.setAttribute("data-prefix", "~SP");
            tile.textContent = label;
            tile.onclick = function() {
                let audioPath = file;
                if (/^[A-Z]:\\/i.test(audioPath)) {
                    audioPath = "file:///" + audioPath.replace(/\\/g, "/");
                }
                window.open(audioPath);
            };
            tileArea.appendChild(tile);
            return;
        }

        // 2. HANDLE INTERNAL TOGGLE-TO-STOP SOUND FILES (~S, ~SX, etc.)
        if (/^~S[A-Za-z0-9]*/i.test(line)) {
            let prefixMatch = line.match(/^~([A-Za-z0-9]+)/i);
            let extractedPrefix = prefixMatch ? "~" + prefixMatch[1].toUpperCase() : "~S";

            let cleanLine = line.replace(/^~S[A-Za-z0-9]*/i, "").trim();
            cleanLine = cleanLine.replace(/^[-–—]\s*/, "").trim();
            
            let buttonMatch = cleanLine.match(/^(.+?)\s*[-–—]\s*(.+?\.(?:mp3|wav|ogg|m4a))\s*$/i);
            
            let label, file;
            if (buttonMatch) {
                label = buttonMatch[1].trim();
                file = buttonMatch[2].trim();
            } else {
                file = cleanLine;
                label = file.replace(/\.[^.]+$/, "");
            }

            const tile = document.createElement("button");
            tile.type = "button";
            tile.className = "tile soundTile";
            tile.setAttribute("data-prefix", extractedPrefix);
            tile.textContent = label;

            tile.onclick = function() {
                const player = getSoundPlayer();

                if (tile.classList.contains("selected") && !player.paused) {
                    player.pause();
                    player.currentTime = 0;
                    tile.classList.remove("selected");
                    return;
                }

                document.querySelectorAll(".soundTile.selected").forEach(t => {
                    t.classList.remove("selected");
                });

                tile.classList.add("selected");

                let audioPath = file;
                if (/^[A-Z]:\\/i.test(audioPath)) {
                    audioPath = "file:///" + audioPath.replace(/\\/g, "/");
                }

                player.pause();
                player.currentTime = 0;
                player.src = audioPath;
                player.load();
                player.play().catch(err => console.log("Sound play error:", err));
            };

            tileArea.appendChild(tile);
            return;
        }

        // 3. HANDLE EMOJI INPUTS (~E)
        if (/^~E/i.test(line)) {
            let cleanLine = line.replace(/^~E/i, "").trim();
            cleanLine = cleanLine.replace(/^[-–—]\s*/, "").trim();

            let emojiMatch = cleanLine.match(/^(.+?)\s*=\s*(\d+(?:px|em|rem)?)$/);
            let emojiChar = emojiMatch ? emojiMatch[1].trim() : cleanLine.split("=")[0].trim();
            let sizeVal = emojiMatch ? emojiMatch[2].trim() : "32px";
            if (/^\d+$/.test(sizeVal)) sizeVal += "px";

            const tile = document.createElement("div");
            tile.className = "tile emojiTile";
            tile.setAttribute("data-prefix", "~E");
            tile.textContent = emojiChar;

            tile.onclick = function() {
                document.querySelectorAll("#tiles .tile").forEach(t => t.classList.remove("selected"));
                tile.classList.add("selected");
                window.placeMode = { 
                    type: "emoji", 
                    value: emojiChar, 
                    size: sizeVal 
                };
                window.selectedEl = null;
            };

            tileArea.appendChild(tile);
            return;
        }

// Handle generic leading tilde tags for text/images if present
        let prefixTag = "";
        if (line.startsWith("~")) {
            // If it's a page reference like ~P.52, only remove the tilde '~', leave 'P.52'
            if (/^~P\./i.test(line)) {
                line = line.replace(/^~/, "").trim();
            } else {
                let matchTag = line.match(/^~([A-Za-z0-9]+)/);
                if (matchTag) prefixTag = "~" + matchTag[1].toUpperCase();
                line = line.replace(/^~[A-Za-z0-9]*/i, "").trim();
            }
        }

        // 4. HANDLE IMAGE INPUTS (~I, ~IA, etc.)
        let imageMatch = line.match(/^([A-Za-z0-9]+)?\s*[-–—]\s*(.+\.(png|jpg|jpeg))$/i);
        if (imageMatch) {
            let filename = imageMatch[2].trim();
            let label = filename.replace(/\.(png|jpg|jpeg)$/i, "").trim();

            const tile = document.createElement("div");
            tile.className = "tile imageTile";
            tile.setAttribute("data-prefix", prefixTag || "~I");
            tile.textContent = label;

            tile.onclick = function() {
                document.querySelectorAll("#tiles .tile").forEach(t => t.classList.remove("selected"));
                tile.classList.add("selected");
                window.placeMode = { type: "image", value: filename };
                window.selectedEl = null;
            };

            tileArea.appendChild(tile);
            return;
        }

        // 5. HANDLE STANDARD TEXT INPUTS (Label before dash, value after dash)
        let dashMatch = line.match(/^(.+?)\s*[-–—]\s*(.+)$/);
        if (dashMatch) {
            let label = dashMatch[1].trim();
            let value = dashMatch[2].trim();

            const tile = document.createElement("div");
            let prefixClass = prefixTag ? " tile-" + prefixTag.replace("~", "").toLowerCase() : "";
            tile.className = "tile" + prefixClass;
            if (prefixTag) tile.setAttribute("data-prefix", prefixTag);
            tile.textContent = label;

            tile.onclick = function() {
                document.querySelectorAll("#tiles .tile").forEach(t => t.classList.remove("selected"));
                tile.classList.add("selected");
                window.placeMode = { type: "text", value: value };
                window.selectedEl = null;
            };

            tileArea.appendChild(tile);
            return;
        }
    }

    // 2. Render the Unit header first if it was found
    if (unitLineText) {
        const tile = document.createElement("div");
        tile.className = "tile headerTile";
        tile.textContent = unitLineText;

        tile.onclick = function() {
            document.querySelectorAll("#tiles .tile").forEach(t => t.classList.remove("selected"));
            tile.classList.add("selected");
            window.placeMode = { type: "text", value: unitLineText };
            window.selectedEl = null;
        };

        tileArea.appendChild(tile);
    }

    // 3. Process Note blocks and sequential lines in their exact relative order
    let inNoteBlock = false;
    let currentNoteLines = [];

    lines.forEach(rawLine => {
        let line = rawLine.trim();

        // Check if we are starting a ~Note block
        if (/^~Note/i.test(line)) {
            if (inNoteBlock && currentNoteLines.length > 0) {
                renderNoteTile(currentNoteLines.join("\n"));
                currentNoteLines = [];
            }
            inNoteBlock = true;
            currentNoteLines.push(line);
            return;
        }

        if (inNoteBlock && line.startsWith("~")) {
            renderNoteTile(currentNoteLines.join("\n"));
            currentNoteLines = [];
            inNoteBlock = false;
        }

        if (inNoteBlock) {
            if (line) currentNoteLines.push(line);
            return;
        }

        renderLineToTile(rawLine);
    });

    if (inNoteBlock && currentNoteLines.length > 0) {
        renderNoteTile(currentNoteLines.join("\n"));
    }

    function renderNoteTile(noteBodyText) {
        let noteContent = "~Note: " + noteBodyText.replace(/^~Note:?\s*/i, "").trim();
        let displayLines = noteBodyText.replace(/^~Note:?\s*/i, "").trim().split(/\r?\n/);
        let label = displayLines[0] ? displayLines[0].trim() : "Note";
        if (label.startsWith("-")) label = label.replace(/^[-–—]\s*/, "").trim();
        if (label.length > 30) label = label.substring(0, 27) + "...";

        const tile = document.createElement("div");
        tile.className = "tile noteTile";
        tile.setAttribute("data-prefix", "~Note");
        tile.textContent = label || "Note";

        tile.onclick = function() {
            document.querySelectorAll("#tiles .tile").forEach(t => t.classList.remove("selected"));
            tile.classList.add("selected");
            if (window.openNoteModal) {
                window.openNoteModal(noteContent);
            }
        };

        tileArea.appendChild(tile);
    }
}/* ==========================
   AUTO-LOAD & LIVE INPUT LISTENERS
========================== */

document.addEventListener("DOMContentLoaded", () => {
    const worksheetInput = document.getElementById("worksheetScript");
    if (worksheetInput) {
        buildAllTiles();
        worksheetInput.addEventListener("input", buildAllTiles);
    }
});


/* ==========================
   PLACE ON SPREAD
========================== */

if (typeof viewer !== "undefined" && viewer) {
    viewer.addEventListener("pointerdown", function(e){
        const target = e.target;

        if (target.classList.contains("draggable")) {
            e.stopPropagation();
            window.selectedEl = target;
            window.placeMode = null;
            return;
        }

        if (!window.placeMode) return;

        const rect = spread.getBoundingClientRect();
        const x = (e.clientX - rect.left) / viewerScale;
        const y = (e.clientY - rect.top) / viewerScale;

        let obj;
        if (window.placeMode.type === "image") {
            obj = document.createElement("img");
            obj.src = window.placeMode.value;
            obj.className = "draggable overlayPng";
            obj.style.width = "140px";
        } else if (window.placeMode.type === "emoji") {
            obj = document.createElement("div");
            obj.className = "draggable emojiOverlay";
            obj.textContent = window.placeMode.value;
            obj.style.background = "transparent";
            obj.style.border = "none";
            obj.style.boxShadow = "none";
            obj.style.outline = "none";
            obj.style.fontSize = window.placeMode.size;
            obj.style.display = "inline-block";
            obj.style.lineHeight = "1";
            obj.style.padding = "0";
            obj.style.margin = "0";
            obj.style.userSelect = "none";
        } else {
            obj = document.createElement("div");
            obj.className = "draggable tile tileAnchor placedTile";
            obj.textContent = window.placeMode.value;
        }

        obj.style.left = x + "px";
        obj.style.top = y + "px";
        spread.appendChild(obj);
        enableDragging(obj);

        window.selectedEl = obj;
        window.placeMode = null;
    });
}


/* ==========================
   DRAGGING
========================== */

function enableDragging(el){
    el.addEventListener("pointerdown", function(e){
        e.stopPropagation();
        window.selectedEl = el;

        const rect = spread.getBoundingClientRect();
        const offsetX = (e.clientX - rect.left) / viewerScale - parseFloat(el.style.left);
        const offsetY = (e.clientY - rect.top) / viewerScale - parseFloat(el.style.top);

        function move(ev){
            el.style.left = ((ev.clientX - rect.left) / viewerScale - offsetX) + "px";
            el.style.top = ((ev.clientY - rect.top) / viewerScale - offsetY) + "px";
        }

        function up(){
            window.removeEventListener("pointermove", move);
            window.removeEventListener("pointerup", up);
        }

        window.addEventListener("pointermove", move);
        window.addEventListener("pointerup", up);
    });
}

    document.head.appendChild(style);

    // 2. Inject HTML Markup
    const modalHTML = `
        <div id="pAnswerModal" style="display: none;" tabindex="0">
            <button id="pToggleArrow" title="Toggle Position">&#9664;</button>
            <div id="pCenterWrapper">
                <button id="pPrevBtn" class="p-modal-btn" title="Previous">&#9650;</button>
                <div id="pModalContentRow">

            <div id="pGrabDot" title="Grab Handle"></div>
        </div>
    `;
    const div = document.createElement('div');
    div.innerHTML = modalHTML;
    
    const spreadContainer = document.querySelector('#displayArea') || document.body;
    if (spreadContainer !== document.body && getComputedStyle(spreadContainer).position === 'static') {
        spreadContainer.style.position = 'relative';
    }
    spreadContainer.appendChild(div);

    function setupTriggerButtons() {
        const btnIds = ['loadAnswerBtn', 'loadAnswerBtnRight'];
        btnIds.forEach(id => {
            const triggerBtn = document.getElementById(id);
            if (triggerBtn && !triggerBtn.hasAttribute('data-modal-bound')) {
                triggerBtn.setAttribute('data-modal-bound', 'true');
                triggerBtn.addEventListener('click', () => {
                    parsePAnswers();
                    const modal = document.getElementById('pAnswerModal');
                    modal.style.display = 'inline-flex';
                    modal.focus();
                });
            }
        });
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', setupTriggerButtons);
    } else {
        setupTriggerButtons();
    }

    const observer = new MutationObserver(setupTriggerButtons);
    observer.observe(document.body, { childList: true, subtree: true });

    let pAnswers = [];
    let currentIndex = 0; 

    function parsePAnswers() {
        const scriptArea = document.getElementById('worksheetScript');
        if (!scriptArea) {
            pAnswers = [];
            return;
        }
        const lines = scriptArea.value.split('\n');
        pAnswers = [];
        
        let currentBlock = [];
        let capturing = false;

        lines.forEach(line => {
            let trimmed = line.trim();

            if (trimmed.startsWith('~P')) {
                if (capturing) {
                    pAnswers.push(currentBlock.join('\n').trim());
                    currentBlock = [];
                }
                capturing = true;
                let content = trimmed.substring(2).trim();
                if (content.startsWith('.')) {
                    content = content.substring(1).trim();
                }
                currentBlock.push("P. " + content);
            } else if (capturing) {
                if (trimmed.startsWith('~')) {
                    capturing = false;
                    if (currentBlock.length > 0) {
                        pAnswers.push(currentBlock.join('\n').trim());
                        currentBlock = [];
                    }
                    if (trimmed.startsWith('~P')) {
                        capturing = true;
                        let content = trimmed.substring(2).trim();
                        if (content.startsWith('.')) {
                            content = content.substring(1).trim();
                        }
                        currentBlock.push("P. " + content);
                    }
                } else {
                    currentBlock.push(line);
                }
            }
        });

        if (capturing && currentBlock.length > 0) {
            pAnswers.push(currentBlock.join('\n').trim());
        }

        currentIndex = 0;
        updatePModalDisplay();
    }

    function updatePModalDisplay() {
        const bodyEl = document.getElementById('pModalBody');
        const contentRow = document.getElementById('pModalContentRow');
        
        const currentWidth = contentRow.style.width;
        const currentHeight = contentRow.style.height;

        if (pAnswers.length === 0) {
            bodyEl.value = "None found";
        } else {
            bodyEl.value = pAnswers[currentIndex];
        }
        
        if (currentWidth) contentRow.style.width = currentWidth;
        if (currentHeight) contentRow.style.height = currentHeight;
    }

    document.getElementById('pModalBody').addEventListener('input', (e) => {
        if (pAnswers.length > 0) {
            pAnswers[currentIndex] = e.target.value;
        }
    });

document.getElementById('pNextBtn').addEventListener('click', (e) => {
        e.stopPropagation();
        if (pAnswers.length === 0) return;
        currentIndex = (currentIndex + 1) % pAnswers.length;
        updatePModalDisplay();
        
        // Only trigger spinner if the wheel overlay is actually open and visible
        const wheelOverlay = document.getElementById("studentWheelOverlay");
        if (wheelOverlay && wheelOverlay.style.display === "flex" && typeof spinWheel === "function") {
            spinWheel();
        } else if (typeof window.nextStudent === 'function') {
            window.nextStudent();
        }
    });

    document.getElementById('pPrevBtn').addEventListener('click', (e) => {
        e.stopPropagation();
        if (pAnswers.length === 0) return;
        currentIndex = (currentIndex - 1 + pAnswers.length) % pAnswers.length;
        updatePModalDisplay();
        
        // Only trigger spinner if the wheel overlay is actually open and visible
        const wheelOverlay = document.getElementById("studentWheelOverlay");
        if (wheelOverlay && wheelOverlay.style.display === "flex" && typeof spinWheel === "function") {

    });    document.getElementById('pSquareClearBtn').addEventListener('click', (e) => {

            if (pAnswers.length > 0) {
                pAnswers[currentIndex] = "";
