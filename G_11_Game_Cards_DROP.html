            position: absolute;
            top: -4px;
            left: 50%;

            height: 0;
            border-left: 4px solid transparent;

            box-shadow: none !important;
            background: transparent !important;
            opacity: 0;

        /* Fall-in animation definition (smooth drop, no bounce) */
        @keyframes fallIntoPlace {
            0% {
                opacity: 0;
                transform: translateY(-40px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Fall-in animation for overlap layout (accounts for absolute centering translation) */
        @keyframes fallIntoPlaceOverlap {
            0% {
                opacity: 0;
                transform: translate(-50%, calc(-50% - 40px));
            }
            100% {
                opacity: 1;
                transform: translate(-50%, -50%);
            }
        }

            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            max-width: 100%;
            max-height: 100%;
            border: none !important;
            outline: none !important;

        function parseRawTextSections(text) {
            const lines = text.split(/\r?\n/);
            let sections = [];
            let currentSectionName = null;
            let currentCards = [];
            
            let currentNum = "1";
            let currentTextLines = [];
            let currentImages = [];
            let layoutMode = "normal";

            function commitCard() {
                if (currentTextLines.length > 0 || currentImages.length > 0) {
                    currentCards.push({
                        num: currentNum,
                        text: currentTextLines.join("\n").trim(),
                        images: [...currentImages],
                        layout: layoutMode
                    });
                }
                currentTextLines = [];
                currentImages = [];
                layoutMode = "normal";
            }

            function commitSection() {
                commitCard();
                if (currentSectionName !== null && currentCards.length > 0) {
                    sections.push({
                        name: currentSectionName,
                        cards: [...currentCards],
                        originalCards: [...currentCards]
                    });
                }
                currentCards = [];
            }

            for (let line of lines) {
                let trimmed = line.trim();
                let sectionMatch = trimmed.match(/^~(.*)$/);
                let numMatch = trimmed.match(/^(\d+)\.\s+(.*)$/);

                if (sectionMatch) {
                    commitSection();
                    currentSectionName = sectionMatch[1].trim();
                } else if (numMatch) {
                    commitCard();
                    currentNum = numMatch[1];
                    currentTextLines = [numMatch[2]];
                } else if (trimmed.startsWith("Show:")) {
                    let imgRef = trimmed.replace("Show:", "").trim();
                    if (imgRef) currentImages.push({ src: imgRef, type: 'show' });
                } else if (trimmed.startsWith("Drop:") || trimmed.startsWith("Add:")) {
                    let imgRef = trimmed.replace(/^(Drop|Add):/, "").trim();
                    if (imgRef) currentImages.push({ src: imgRef, type: 'drop' });
                } else if (trimmed === "!Side-by-side!") {
                    layoutMode = "side-by-side";
                } else if (trimmed === "!Overlap!") {
                    layoutMode = "overlap";
                } else if (currentSectionName !== null) {
                    if (trimmed !== "") {
                        currentTextLines.push(line);
                    } else if (currentTextLines.length > 0) {
                        currentTextLines.push("");
                    }
                }
            }
            commitSection();
            return sections;
        }

        const sectionsData = parseRawTextSections(rawTextSource);
        let activeSectionIndex = null;
        let currentIndex = 0;
        let currentNeedleAngle = 45;
        let isRandomized = false;

        const topicSelect = document.getElementById('topic-select');
        const randomizeBtn = document.getElementById('randomize-btn');
        const backArrowBtn = document.getElementById('back-arrow-btn');
        const cardNumEl = document.getElementById('card-num');
        const cardContentEl = document.getElementById('card-content');
        const cardWorkspace = document.getElementById('card-workspace');
        const visualStack = document.getElementById('visual-stack');
        const floatingSpinner = document.getElementById('floating-spinner-wrapper');
        const spinnerArrow = document.getElementById('spinner-diagonal-arrow');

        const pastelColors = [
            '#FFB3BA', '#FFDFBA', '#FFFFBA', '#BAFFC9', '#BAE1FF', '#E8C5FF', '#FFC5EC'
        ];

        function initTopicSelector() {
            topicSelect.innerHTML = "";

            const placeholderOpt = document.createElement('option');
            placeholderOpt.value = "";
            placeholderOpt.textContent = "Select a topic...";
            placeholderOpt.disabled = true;
            placeholderOpt.selected = true;
            topicSelect.appendChild(placeholderOpt);

            sectionsData.forEach((sec, idx) => {
                const opt = document.createElement('option');
                opt.value = idx;
                opt.textContent = sec.name;
                topicSelect.appendChild(opt);
            });
        }

        function getCurrentDeck() {
            return sectionsData[activeSectionIndex] ? sectionsData[activeSectionIndex].cards : [];
        }

        function renderCurrentCard() {
            if (activeSectionIndex === null) {
                cardNumEl.textContent = "-";
                cardContentEl.textContent = "";
                visualStack.innerHTML = '<div class="placeholder-text">Select a topic to start</div>';
                return;
            }

            const deck = getCurrentDeck();
            if (deck.length === 0) return;
            
            if (currentIndex >= deck.length) currentIndex = 0;
            if (currentIndex < 0) currentIndex = deck.length - 1;
            const card = deck[currentIndex];

            cardNumEl.textContent = `Card ${card.num}`;
            cardContentEl.textContent = card.text;

            const modal = document.getElementById('card-modal');
            modal.style.backgroundColor = pastelColors[currentIndex % pastelColors.length];

            visualStack.innerHTML = "";
            visualStack.className = "image-container";
            if (card.layout === "side-by-side") {
                visualStack.classList.add("side-by-side");
            } else if (card.layout === "overlap") {
                visualStack.classList.add("overlap");
            }

            if (card.images.length === 0) {
                visualStack.innerHTML = '<div class="placeholder-text">No images for this card</div>';
            } else {
                card.images.forEach((item, index) => {
                    const img = document.createElement('img');
                    img.src = item.src;
                    img.className = 'dynamic-img';
                    
                    // If it's a "drop" command OR the very last item in a sequence (auto drop), apply the drop animation
                    if (item.type === 'drop' || index === card.images.length - 1) {
                        img.style.animationDelay = `${index * 0.15}s`;
                    } else {
                        // For prior sequential images, show immediately without waiting for drop
                        img.style.opacity = '1';
                        img.style.visibility = 'visible';
                    }

                    if (img.complete) {
                        img.classList.add('loaded');
                    } else {
                        img.onload = () => {
                            img.classList.add('loaded');
                        };
                    }

                    visualStack.appendChild(img);
                });
            }
        }

        function advanceCard() {
            if (activeSectionIndex === null) return;
            const deck = getCurrentDeck();
            currentIndex = (currentIndex + 1) % deck.length;
            renderCurrentCard();
        }

        function previousCard() {
            if (activeSectionIndex === null) return;
            const deck = getCurrentDeck();
            currentIndex = (currentIndex - 1 + deck.length) % deck.length;
            renderCurrentCard();
        }

        function toggleRandomizeMode() {
            if (activeSectionIndex === null) return;
            const section = sectionsData[activeSectionIndex];
            if (!section) return;

            isRandomized = !isRandomized;

            if (isRandomized) {
                randomizeBtn.textContent = "Sequential";
                for (let i = section.cards.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [section.cards[i], section.cards[j]] = [section.cards[j], section.cards[i]];
                }
            } else {
                randomizeBtn.textContent = "Randomize";
                section.cards = [...section.originalCards];
            }

            currentIndex = 0;
            renderCurrentCard();
        }

        function spinWheel() {
            if (activeSectionIndex === null) return;
            const deck = getCurrentDeck();
            const randomExtraTurns = (Math.floor(Math.random() * 3) + 4) * 360;
            const randomSlice = Math.floor(Math.random() * 360);
            currentNeedleAngle += randomExtraTurns + randomSlice;
            spinnerArrow.style.transform = `translate(-50%, -50%) rotate(${currentNeedleAngle}deg)`;
            
            setTimeout(() => {
                currentIndex = Math.floor(Math.random() * deck.length);
                renderCurrentCard();
            }, 600);
        }

        topicSelect.addEventListener('change', (e) => {
            activeSectionIndex = parseInt(e.target.value, 10);
            currentIndex = 0;
            isRandomized = false;
            randomizeBtn.textContent = "Randomize";
            sectionsData[activeSectionIndex].cards = [...sectionsData[activeSectionIndex].originalCards];
            renderCurrentCard();
        });

        randomizeBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            toggleRandomizeMode();
        });

        backArrowBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            previousCard();
        });

        cardWorkspace.addEventListener('click', advanceCard);
        
        floatingSpinner.addEventListener('click', (e) => {
            e.stopPropagation();
            spinWheel();
        });

        initTopicSelector();
        renderCurrentCard();
    </script>

<script>

(function(){

/* =========================
   RAW INSTRUCTIONS TEXT
========================= */

const RAW_TEXT = `
How to use this page...

• Overview: The Raw Text Parser Card Game allows users to explore interactive card decks and visual stories structured around English sentence structures, essay writing patterns, and reading strategies.

• Topic Selection: Choose a learning module from the Topic Select dropdown menu located at the top-left of the control panel to initialize a card deck.

• Card Navigation: Click anywhere inside the left Card Workspace to advance sequentially through cards in the active deck.

• Previous Card: Click the left-arrow button in the card header to return to the previous card.

• Randomize Mode: Click the Randomize button to shuffle the current card deck randomly, or toggle it back to sequential viewing.

• Spin Wheel: Tap the colorful Floating Spinner icon at the right of the control panel to automatically spin and jump to a random card in the deck.

• Visual Display Area: View dynamic illustrations, side-by-side images, or layered visual stacks corresponding to the active card on the right-hand Image Field panel.

`;


/* =========================
   RAW TEXT PARSER
========================= */

function parseRawInstructions(text){

  const lines = text.split("\n").map(l => l.trim()).filter(Boolean);
  const html = [];

  lines.forEach(line => {

    if(line === "---"){
      html.push(`<hr>`);
      return;
    }

    if(/^\d+\./.test(line)){
      html.push(`<p>${line}</p>`);
      return;
    }

    if(!/[.!?:]$/.test(line)){
      html.push(`<h3>${line}</h3>`);
      return;
    }

    html.push(`<p>${line}</p>`);
  });

  return html.join("");
}


/* =========================
   CREATE STYLE
========================= */

const style = document.createElement("style");

style.textContent = `
#instructionsBtn{
  position: fixed;
  top: 15px;
  left: 15px;
  width: 38px;
  height: 38px;
  padding: 0;
  background: #2e8b57;
  color: #fff;
  border: none;
  border-radius: 50%;
  font-size: 18px;
  font-weight: 600;
  cursor: pointer;
  box-shadow: 0 2px 6px rgba(0,0,0,0.3);

  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.2s, transform 0.2s;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}

#instructionsBtn:hover{
  background: #257047;
  transform: scale(1.05);
}

#instructionsRoot{
  display: none;
  position: fixed;
  inset: 0;
  z-index: 99999;
}

#instructionsBackdrop{
  position: absolute;
  inset: 0;
  background: rgba(0, 0, 0, 0.45);
}

#instructionsModal{
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: min(500px, 92vw);
  max-height: min(80vh, calc(100dvh - 16px));

  border-radius: 12px;

  gap: 10px;
  margin-bottom: 12px;

  font-weight: 700;
  color: #1976d2;
}

  background: none;

}

#instructionsContent{

  flex: 1 1 auto;

  -ms-overflow-style: none;
  font-size: 14px;
  line-height: 1.5;
  font-weight: 400;
  color: #333;
}

#instructionsContent::-webkit-scrollbar{
  display: none;
}

#instructionsContent h3{
  margin-top: 10px;
  margin-bottom: 4px;
  font-size: 15px;
  line-height: 1.3;
  font-weight: 700;
  color: #1976d2;
}

#instructionsContent p{
  margin-bottom: 8px;
  font-weight: 400;
}

  margin: 12px 0;
  border: none;
  border-top: 1px solid #ddd;
}
`;

document.head.appendChild(style);


/* =========================
   CREATE BUTTON
========================= */

const btn = document.createElement("button");
btn.id = "instructionsBtn";
btn.innerHTML = "?";
btn.setAttribute("aria-label", "Instructions");

document.body.appendChild(btn);


/* =========================
   CREATE MODAL
========================= */

const root = document.createElement("div");
root.id = "instructionsRoot";

root.innerHTML = `
<div id="instructionsBackdrop"></div>

<div id="instructionsModal">

  <div id="instructionsHeader">
    <span>Instructions</span>
    <button id="instructionsBack" type="button">✕</button>
  </div>

  <div id="instructionsContent">
    ${parseRawInstructions(RAW_TEXT)}
  </div>

</div>
`;

document.body.appendChild(root);


/* =========================
   SCROLL LOCK
========================= */

const modalContent = document.getElementById("instructionsContent");

modalContent.addEventListener("wheel", e=>{
  e.stopPropagation();
},{passive:false});

modalContent.addEventListener("touchmove", e=>{
  e.stopPropagation();
},{passive:false});


/* =========================
   OPEN / CLOSE
========================= */

function openModal(){
  root.style.display = "block";
  document.body.style.overflow = "hidden";
  document.documentElement.style.overflow = "hidden";
}

function closeModal(){
  root.style.display = "none";
  document.body.style.overflow = "";
  document.documentElement.style.overflow = "";
}

btn.onclick = openModal;

document.getElementById("instructionsBack").onclick = closeModal;
document.getElementById("instructionsBackdrop").onclick = closeModal;

document.addEventListener("keydown", e=>{
  if(e.key === "Escape") closeModal();
});

})();
</script>

<script>
(function() {
  // Prevent pinch-to-zoom
  function preventPinch(e) {
    if (e.touches.length > 1) e.preventDefault();
  }

  // Prevent double-tap zoom
  let lastTouchTime = 0;
  function preventDoubleTap(e) {
    const now = Date.now();
    if (now - lastTouchTime < 300) {
      e.preventDefault();
    }
    lastTouchTime = now;
  }

  // Block gesture events on iOS
  function preventGesture(e) {
    e.preventDefault();
  }

  document.addEventListener('touchstart', preventPinch, { passive: false });
  document.addEventListener('touchend', preventDoubleTap, { passive: false });
  document.addEventListener('gesturestart', preventGesture, { passive: false });
})();
</script>
