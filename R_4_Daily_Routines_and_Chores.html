<script>
(function() {
    // Wait a brief moment to ensure the original script has initialized
    setTimeout(() => {
        const highlightBtn = document.getElementById("highlightBtn") || document.getElementById("highlightSelected");
        const editor = document.getElementById("teleEdit");
        if (!highlightBtn || !editor) return;

        // Clone the button to strip away the old broken click listener safely
        const newBtn = highlightBtn.cloneNode(true);
        highlightBtn.parentNode.replaceChild(newBtn, highlightBtn);

        newBtn.addEventListener("mousedown", (e) => e.preventDefault());

        newBtn.addEventListener("click", () => {
            const sel = window.getSelection();
            if (!sel.rangeCount || sel.isCollapsed) return;

            const range = sel.getRangeAt(0);
            if (!editor.contains(range.commonAncestorContainer)) return;

            let container = range.commonAncestorContainer;
            if (container.nodeType === 3) container = container.parentNode;
            
            const enclosingHighlight = container.closest(".highlight");

            // 1. UN-HIGHLIGHT LOGIC (Toggle off if inside an existing highlight)
            if (enclosingHighlight) {
                const parent = enclosingHighlight.parentNode;
                while (enclosingHighlight.firstChild) {
                    parent.insertBefore(enclosingHighlight.firstChild, enclosingHighlight);
                }
                enclosingHighlight.remove();
                editor.normalize();
                sel.removeAllRanges();
                return;
            }

            // 2. CHECK INTERSECTING HIGHLIGHTS
            const allHighlights = Array.from(editor.querySelectorAll(".highlight"));
            const intersecting = allHighlights.filter(h => {
                try {
                    return range.intersectsNode(h) || h.contains(range.startContainer) || h.contains(range.endContainer);
                } catch (e) {
                    return false;
                }
            });

            if (intersecting.length > 0) {
                intersecting.forEach(h => {
                    const parent = h.parentNode;
                    if (parent) {
                        while (h.firstChild) {
                            parent.insertBefore(h.firstChild, h);
                        }
                        h.remove();
                    }
                });
                editor.normalize();
                sel.removeAllRanges();
                return;
            }

            // 3. SAFE MULTI-NODE HIGHLIGHT LOGIC (Prevents text deletion across paragraphs)
            try {
                // Try standard surround first if it's within a single text node
                const span = document.createElement("span");
                span.className = "highlight";
                range.surroundContents(span);
            } catch (err) {
                // Multi-node/multi-paragraph safe wrapping algorithm
                const startContainer = range.startContainer;
                const endContainer = range.endContainer;
                const startOffset = range.startOffset;
                const endOffset = range.endOffset;

                // Collect all text nodes contained within the range
                const walker = document.createTreeWalker(
                    range.commonAncestorContainer,
                    NodeFilter.SHOW_TEXT,
                    {
                        acceptNode: function(node) {
                            try {
                                return range.intersectsNode(node) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT;
                            } catch(e) {
                                return NodeFilter.FILTER_REJECT;
                            }
                        }
                    }
                );

                const textNodesToWrap = [];
                let currentNode;
                while (currentNode = walker.nextNode()) {
                    textNodesToWrap.push(currentNode);
                }

                if (textNodesToWrap.length === 0) {
                    // Fallback extract if tree walker misses
                    const span = document.createElement("span");
                    span.className = "highlight";
                    span.appendChild(range.extractContents());
                    range.insertNode(span);
                } else {
                    // Process nodes safely from last to first to avoid index shifting mutations
                    textNodesToWrap.reverse().forEach(node => {
                        let targetNode = node;
                        let startIdx = 0;
                        let endIdx = node.nodeValue.length;

                        if (node === startContainer) {
                            startIdx = startOffset;
                        }
                        if (node === endContainer) {
                            endIdx = endOffset;
                        }

                        if (startIdx < endIdx) {
                            if (startIdx > 0 || endIdx < node.nodeValue.length) {
                                targetNode = node.splitText(startIdx);
                                targetNode.splitText(endIdx - startIdx);
                            }

                            const span = document.createElement("span");
                            span.className = "highlight";
                            targetNode.parentNode.insertBefore(span, targetNode);
                            span.appendChild(targetNode);
                        }
                    });
                }
            }

            editor.normalize();
            sel.removeAllRanges();
        });
    }, 100);
})();
</script>

<script>
(function() {
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playCorrect() { 
        audioCtx.resume().then(() => { 
            const o = audioCtx.createOscillator(); 
            const g = audioCtx.createGain(); 
            o.type = "sine"; 
            o.frequency.setValueAtTime(800, audioCtx.currentTime); 
            g.gain.setValueAtTime(0.4, audioCtx.currentTime); 
            o.connect(g); g.connect(audioCtx.destination); 
            o.start(); o.stop(audioCtx.currentTime + 0.25); 
        }); 
    }

    function playWrong() { 
        audioCtx.resume().then(() => { 
            const o = audioCtx.createOscillator(); 
            const g = audioCtx.createGain(); 
            o.type = "triangle"; 
            o.frequency.setValueAtTime(450, audioCtx.currentTime); 
            o.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.25); 
            g.gain.setValueAtTime(0.4, audioCtx.currentTime); 
            o.connect(g); g.connect(audioCtx.destination); 
            o.start(); o.stop(audioCtx.currentTime + 0.25); 
        });

        const correctAnswers = Array.from(exercise.querySelectorAll('[data-correct]'))
            .map(i => normalize(i.dataset.correct));

        const isCorrect = userAnswers.length > 0 && userAnswers.every(ans => correctAnswers.includes(ans));

        exercise.querySelectorAll('.mc-emoji').forEach(span => span.remove());

        selectedInputs.forEach(inp => {
            const lbl = inp.closest("label");
            if (lbl) {
                const span = document.createElement('span');
                span.className = "mc-emoji";
                span.textContent = isCorrect ? "😊" : "😢";
                lbl.appendChild(span);

        textInputs.forEach(inp => {

            span.className = "mc-emoji";
            span.textContent = isCorrect ? "😊" : "😢";
            inp.parentNode.insertBefore(span, inp.nextSibling);
        });

        if (isCorrect) playCorrect(); else playWrong();

        if (exercise.dataset.firstResponseLocked) return;
        exercise.dataset.firstResponseLocked = 'true';

        const correctCount = isCorrect ? 1 : 0;
        exercise.dataset.score = correctCount;
        exercise.dataset.percentage = correctCount * 100;
    });

            correctCount += Number(ex.dataset.score || 0);
        });

        const totalExercises = exercises.length;
        const percentage = totalExercises > 0 ? Math.round((correctCount / totalExercises) * 100) : 0;

<script>

/* =========================================================
   STANDALONE DOWNLOAD FILENAME INTERCEPTOR
   ---------------------------------------------------------
   Automatically renames outgoing:

   - TXT
   - PNG
   - Audio files

   Filename format:

   Filename_Section_Name_ID_Date_Time_Score_Percent.ext

   Example:

   Teleprompter_Food_and_Cooking_Somchai_Jaidee_12345_
   26-09-2026_14-53-27_8-10_80%.txt

   If no quiz score is available:

   Teleprompter_Food_and_Cooking_Somchai_Jaidee_12345_
   26-09-2026_14-53-27_NA_NA.webm

   Windows-safe:
   - Spaces become underscores
   - Illegal filename characters become underscores
   - Date uses -
   - Time uses -
   - Score uses -
   ========================================================= */


/* =========================================================
   1. CLEAN FILENAME PART
   ========================================================= */

function cleanScoreboardFilenamePart(value) {

    return String(value || '')
        .trim()
        .replace(/\s+/g, '_')
        .replace(/[<>:"/\\|?*]/g, '_')
        .replace(/_+/g, '_')
        .replace(/^_+|_+$/g, '');
}


/* =========================================================
   2. MAKE COMPLETE FILENAME
   ========================================================= */

function makeScoreboardFilename(
    filename,
    sectionName,
    studentName,
    studentId,
    date,
    time,
    score,
    percent,
    extension
) {

    const parts = [
        filename,
        sectionName,
        studentName,
        studentId,
        date,
        time,
        score,
        percent
    ];

    const safeName =
        parts
            .map(cleanScoreboardFilenamePart)
            .filter(Boolean)
            .join('_');

    const safeExtension =
        String(extension || 'txt')
            .replace(/^\./, '')
            .replace(/[<>:"/\\|?*]/g, '');

    return (
        safeName +
        '.' +
        safeExtension
    );
}


/* =========================================================
   3. DATE / TIME
   ========================================================= */

function getScoreboardDateTime() {

    const now = new Date();

    function pad(number) {
        return String(number).padStart(2, '0');
    }

    return {

        date:
            `${pad(now.getDate())}-` +
            `${pad(now.getMonth() + 1)}-` +
            `${now.getFullYear()}`,

        time:
            `${pad(now.getHours())}-` +
            `${pad(now.getMinutes())}-` +
            `${pad(now.getSeconds())}`
    };
}


/* =========================================================
   4. GET CURRENT PAGE FILENAME
   ========================================================= */

function getCurrentDownloadBaseName() {

    let filename =
        window.location.pathname
            .split('/')
            .pop() || 'Teleprompter';

    /*
       Remove the existing extension.

       Example:

       Teleprompter.html
       becomes:

       Teleprompter
    */

    filename =
        filename.replace(
            /\.[^.]+$/,
            ''
        );

    return filename || 'Teleprompter';
}


/* =========================================================
   5. GET CURRENT SECTION NAME
   ========================================================= */

function getCurrentDownloadSectionName() {

    /*
       This is set by the main section selector.
    */

    if (
        window.currentQuizSectionName &&
        String(
            window.currentQuizSectionName
        ).trim()
    ) {

        return String(
            window.currentQuizSectionName
        ).trim();
    }


    /*
       Fallback: try the currently selected
       section from SCRAMBLE_SECTIONS.
    */

    if (
        window.SCRAMBLE_SECTIONS &&
        typeof window.SCRAMBLE_INDEX ===
            'number' &&
        window.SCRAMBLE_SECTIONS[
            window.SCRAMBLE_INDEX
        ]
    ) {

        return (
            window.SCRAMBLE_SECTIONS[
                window.SCRAMBLE_INDEX
            ].name || ''
        );
    }


    return 'Section';
}


/* =========================================================
   6. GET STUDENT ID
   ========================================================= */

function getCurrentStudentId() {

    const input =
        document.getElementById('gsId');

    if (!input) {
        return '';
    }

    return (
        input.value ||
        ''
    ).trim();
}


/* =========================================================
   7. GET STUDENT NAME
   ========================================================= */

function getCurrentStudentName() {

    const studentId =
        getCurrentStudentId();


    /*
       Use the existing ID → student-name
       resolver if available.
    */

    if (
        studentId &&
        typeof window.resolveStudentNameFromId ===
            'function'
    ) {

        const resolved =
            window.resolveStudentNameFromId(
                studentId
            );

        if (
            resolved &&
            String(resolved).trim()
        ) {

            return String(
                resolved
            ).trim();
        }
    }


    /*
       Fallbacks if a name field exists.
    */

    const possibleNameIds = [
        'gsName',
        'studentName',
        'student-name'
    ];

    for (
        const id of possibleNameIds
    ) {

        const element =
            document.getElementById(id);

        if (
            element &&
            String(
                element.value ||
                element.textContent ||
                ''
            ).trim()
        ) {

            return String(
                element.value ||
                element.textContent ||
                ''
            ).trim();
        }
    }


    return 'Student';
}


/* =========================================================
   8. GET CURRENT QUIZ SCORE
   ---------------------------------------------------------
   Looks for the existing MC Quiz Mania scoreboard.

   Existing format:

   filename|section: quiz|name|id|date/time|8/10|80%

   Therefore:

   parts[6] = 8/10
   parts[7] = 80%
   ========================================================= */

function getCurrentQuizScoreData() {

    const scoreElements =
        document.querySelectorAll(
            '.quiz-mania-score-text'
        );

    /*
       Work backwards so the most recently
       displayed scoreboard is used.
    */

    for (
        let i = scoreElements.length - 1;
        i >= 0;
        i--
    ) {

        const text =
            scoreElements[i]
                .textContent
                .trim();

        if (!text) {
            continue;
        }

        const parts =
            text.split('|');

        if (
            parts.length >= 8
        ) {

            const score =
                parts[6].trim();

            const percent =
                parts[7].trim();

            if (
                score &&
                percent
            ) {

                return {
                    score: score,
                    percent: percent
                };
            }
        }
    }


    /*
       No MC quiz score available.

       This is normal for audio recordings
       or other non-quiz downloads.
    */

    return {
        score: 'NA',
        percent: 'NA'
    };
}


/* =========================================================
   9. DETERMINE FILE EXTENSION
   ========================================================= */

function getDownloadExtension(link) {

    const originalName =
        link.getAttribute('download') ||
        '';


    /*
       1. If the download filename already
          contains an extension, use it.
    */

    const match =
        originalName.match(
            /\.([a-zA-Z0-9]+)$/
        );

    if (match) {

        return match[1]
            .toLowerCase();
    }


    /*
       2. Inspect the href when possible.
    */

    const href =
        link.getAttribute('href') ||
        '';


    if (
        href.includes('image/png')
    ) {
        return 'png';
    }

    if (
        href.includes('audio/webm')
    ) {
        return 'webm';
    }

    if (
        href.includes('audio/wav')
    ) {
        return 'wav';
    }

    if (
        href.includes('audio/mpeg')
    ) {
        return 'mp3';
    }

    if (
        href.includes('audio/ogg')
    ) {
        return 'ogg';
    }

    if (
        href.includes('audio/mp4')
    ) {
        return 'm4a';
    }


    /*
       3. If there is no extension at all,
          this app's MediaRecorder uses WebM/Opus
          for recorded audio.

          Therefore use WEBM as the fallback.
    */

    return 'webm';
}
/* =========================================================
   10. SHOULD THIS DOWNLOAD BE INTERCEPTED?
   ========================================================= */

function isRenameableDownload(link) {

    if (!link) {
        return false;
    }

    if (
        !link.hasAttribute('download')
    ) {
        return false;
    }

    const extension =
        getDownloadExtension(link);

const allowedExtensions = [
    'txt',
    'png',
'webm'
];

    return allowedExtensions.includes(
        extension
    );
}


/* =========================================================
   11. BUILD NEW DOWNLOAD FILENAME
   ========================================================= */

function buildInterceptedDownloadFilename(
    link
) {

    const extension =
        getDownloadExtension(link);

    const filename =
        getCurrentDownloadBaseName();

    const sectionName =
        getCurrentDownloadSectionName();

    const studentName =
        getCurrentStudentName();

    const studentId =
        getCurrentStudentId();

    const dateTime =
        getScoreboardDateTime();

    const scoreData =
        getCurrentQuizScoreData();


    const newFilename =
        makeScoreboardFilename(

            filename,

            sectionName,

            studentName,

            studentId,

            dateTime.date,

            dateTime.time,

            scoreData.score,

            scoreData.percent,

            extension
        );


    return newFilename;
}


/* =========================================================
   12. DOWNLOAD INTERCEPTOR
   ---------------------------------------------------------
   Intercepts programmatic and normal clicks on
   TXT, PNG, and WEBM download links.

   This runs immediately before the browser
   performs the actual anchor download.
   ========================================================= */

(function() {

    const originalAnchorClick =
        HTMLAnchorElement.prototype.click;


    HTMLAnchorElement.prototype.click =
        function() {

            const link = this;


            /*
               Only process actual download links.
            */

            if (
                link.hasAttribute('download')
            ) {

                const originalName =
                    link.getAttribute(
                        'download'
                    ) || '';


                const extensionMatch =
                    originalName.match(
                        /\.([a-zA-Z0-9]+)$/
                    );


                if (extensionMatch) {

                    const extension =
                        extensionMatch[1]
                            .toLowerCase();


                    /*
                       Only rename the file types
                       we want to intercept.
                    */

                    const allowedExtensions = [
                        'txt',
                        'png',
                        'webm'
                    ];


                    if (
                        allowedExtensions.includes(
                            extension
                        )
                    ) {

                        const newFilename =
                            buildInterceptedDownloadFilename(
                                link
                            );


                        link.download =
                            newFilename;


                        console.log(
                            'Download renamed:',
                            newFilename
                        );
                    }
                }
            }


            /*
               Now perform the ORIGINAL click.
            */

            return originalAnchorClick.call(
                link
            );
        };


    /*
       Also handle ordinary user clicks
       that do not go through .click().
    */

    document.addEventListener(
        'click',
        function(event) {

            const link =
                event.target.closest(
                    'a[download]'
                );

            if (!link) {
                return;
            }


            const originalName =
                link.getAttribute(
                    'download'
                ) || '';


            const extensionMatch =
                originalName.match(
                    /\.([a-zA-Z0-9]+)$/
                );


            if (!extensionMatch) {
                return;
            }


            const extension =
                extensionMatch[1]
                    .toLowerCase();


            const allowedExtensions = [
                'txt',
                'png',
                'webm'
            ];


            if (
                !allowedExtensions.includes(
                    extension
                )
            ) {
                return;
            }


            const newFilename =
                buildInterceptedDownloadFilename(
                    link
                );


            link.download =
                newFilename;


            console.log(
                'Download renamed:',
                newFilename
            );

        },
        true
    );

})();
/* =========================================================
   13. OPTIONAL GLOBAL HELPER
   ---------------------------------------------------------
   Makes the builder available elsewhere if
   you ever need it.
   ========================================================= */

window.makeScoreboardFilename =
    makeScoreboardFilename;

window.getScoreboardDateTime =
    getScoreboardDateTime;


/* =========================================================
   14. READY MESSAGE
   ========================================================= */

console.log(
    'Standalone download filename interceptor loaded.'
);

</script>

<script>
document.getElementById('highlightBtn')?.addEventListener('click', () => {
    const sel = window.getSelection();
    if (!sel.rangeCount || sel.isCollapsed) return;

    const range = sel.getRangeAt(0);
    let container = range.commonAncestorContainer;
    
    if (container.nodeType === Node.TEXT_NODE) {
        container = container.parentNode;
    }

    const existingHighlight = container.closest('.highlight');

    if (existingHighlight) {
        const parent = existingHighlight.parentNode;
        while (existingHighlight.firstChild) {
            parent.insertBefore(existingHighlight.firstChild, existingHighlight);
        }
        parent.removeChild(existingHighlight);
    } else {
        const span = document.createElement('span');
        span.className = 'highlight';
        span.appendChild(range.extractContents());
        range.insertNode(span);
    }
    
    sel.removeAllRanges();
});
</script>

<script>

// ==========================================
// 9. SPEECH-TO-TEXT (STT) DICTATION MODULE
// ==========================================
const sttBtn = document.getElementById('sttBtn');

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

if (sttBtn && SpeechRecognition) {

    const recognition =
        new SpeechRecognition();

    recognition.continuous = true;
    recognition.interimResults = false;
    recognition.lang = 'en-US';
    recognition.maxAlternatives = 1;

    let isListening = false;

    /*
     * Store the editor selection before the
     * STT button takes focus.
     */
    let savedRange = null;


    // ------------------------------------------
    // SAVE THE EDITOR CARET
    // ------------------------------------------

    function saveEditorCaret() {

        const editableZone =
            document.getElementById('editableTextZone');

        if (!editableZone) return;

        const selection =
            window.getSelection();

        if (
            !selection ||
            selection.rangeCount === 0
        ) {
            return;
        }

        const range =
            selection.getRangeAt(0);

        if (
            editableZone.contains(
                range.commonAncestorContainer
            )
        ) {

            savedRange =
                range.cloneRange();
        }
    }


    // ------------------------------------------
    // KEEP THE EDITOR CARET WHEN BUTTON
    // IS CLICKED
    // ------------------------------------------

    sttBtn.addEventListener(
        'mousedown',
        function(e) {

            /*
             * Save the current caret before the
             * button can take focus.
             */
            saveEditorCaret();

            /*
             * Prevent the button from taking
             * focus away from the editor.
             */
            e.preventDefault();
        }
    );


    // ------------------------------------------
    // INSERT SPEECH INTO EXISTING EDITOR
    // ------------------------------------------

    function insertSpeech(text) {

        const editableZone =
            document.getElementById('editableTextZone');

        if (!editableZone) return;

        if (!text || !text.trim()) return;


        /*
         * Restore the caret that existed when
         * the STT button was pressed.
         */
        if (!savedRange) {

            /*
             * Do not append to the editor if
             * there is no known caret.
             *
             * This prevents STT from creating
             * unexpected DOM structure or
             * changing line spacing.
             */
            return;
        }


        const selection =
            window.getSelection();

        if (!selection) return;


        const range =
            savedRange.cloneRange();


        /*
         * Make absolutely sure the saved
         * range still belongs to the editor.
         */
        if (
            !editableZone.contains(
                range.commonAncestorContainer
            )
        ) {
            return;
        }


        /*
         * Replace selected text, if any,
         * exactly as normal typing would.
         */
        range.deleteContents();


        /*
         * Insert ONLY a text node.
         *
         * No <div>
         * No <p>
         * No <br>
         * No new .line
         *
         * Therefore the existing line structure
         * and CSS remain untouched.
         */
        const textNode =
            document.createTextNode(
                text.trim() + ' '
            );


        range.insertNode(textNode);


        /*
         * Put the caret immediately after
         * the newly inserted speech.
         */
        range.setStartAfter(textNode);

        range.collapse(true);


        selection.removeAllRanges();

        selection.addRange(range);


        /*
         * Save the new caret so the next
         * speech result continues from here.
         */
        savedRange =
            range.cloneRange();


        /*
         * Update the application's existing
         * text counter / overlay.
         */
        if (
            typeof window.updateTextOverlay ===
            'function'
        ) {

            window.updateTextOverlay();
        }
    }


    // ------------------------------------------
    // SPEECH RESULT
    // ------------------------------------------

    recognition.onresult =
        function(event) {

            let finalTranscript = '';


            for (
                let i = event.resultIndex;
                i < event.results.length;
                i++
            ) {

                if (
                    event.results[i].isFinal
                ) {

                    finalTranscript +=
                        event.results[i][0]
                            .transcript;
                }
            }


            finalTranscript =
                finalTranscript.trim();


            if (!finalTranscript) return;


            insertSpeech(
                finalTranscript
            );
        };


    // ------------------------------------------
    // ERROR
    // ------------------------------------------

    recognition.onerror =
        function(event) {

            console.error(
                'STT Error:',
                event.error
            );


            /*
             * Chrome can report no-speech
             * during normal continuous use.
             */
            if (
                event.error === 'no-speech'
            ) {
                return;
            }


            isListening = false;

            sttBtn.textContent =
                'Start STT';

            sttBtn.classList.remove(
                'recording'
            );
        };


    // ------------------------------------------
    // RECOGNITION ENDED
    // ------------------------------------------

    recognition.onend =
        function() {

            if (isListening) {

                /*
                 * Chrome may stop recognition
                 * after a period of silence.
                 */
                try {

                    recognition.start();

                } catch (e) {

                    /*
                     * Ignore the normal restart
                     * race condition.
                     */
                }

            } else {

                sttBtn.textContent =
                    'STT';

                sttBtn.classList.remove(
                    'recording'
                );
            }
        };


    // ------------------------------------------
    // EXISTING STT BUTTON
    // ------------------------------------------

    sttBtn.addEventListener(
        'click',
        function() {

            if (!isListening) {

                /*
                 * Save the caret one more time
                 * immediately before starting.
                 */
                saveEditorCaret();


                try {

                    recognition.start();

                    isListening =
                        true;

                    sttBtn.textContent =
                        'Off';

                    sttBtn.classList.add(
                        'recording'
                    );

                } catch (err) {

                    console.error(
                        'Failed to start speech recognition:',
                        err
                    );
                }

            } else {

                isListening =
                    false;


                try {

                    recognition.stop();

                } catch (e) {

                    /*
                     * Recognition may already
                     * have stopped.
                     */
                }


                sttBtn.textContent =
                    'Start STT';

                sttBtn.classList.remove(
                    'recording'
                );
            }
        }
    );

} else if (sttBtn) {

    sttBtn.disabled = true;

    sttBtn.title =
        'Speech-to-text is not supported in this browser (try Chrome/Edge).';
}

</script>

<script>



/* =========================================================
   SCOREBOARD-BASED DOWNLOAD FILENAME INTERCEPTOR
   ---------------------------------------------------------
   Reads the ACTUAL scoreboard string and converts it
   directly into a Windows-safe download filename.

   QUIZ:

   filename|section: Quiz|name|id|date/time|8/20|40%

   becomes:

   filename_section_name_id_date_time_8_20_40%.txt


   EDITS:

   filename|section: Edits|name|id|date/time|
   Chars:2493|Sentences:54|Changed:0%

   becomes:

   filename_section_name_id_date_time_
   Chars_2493_Sentences_54_Changed_0%.txt


   The scoreboard is the source of truth.
   ========================================================= */


/* =========================================================
   1. CLEAN FILENAME PART
   ========================================================= */

function cleanScoreboardFilenamePart(value) {

    return String(value || '')
        .trim()
        .replace(/\s+/g, '_')
        .replace(/[<>:"/\\|?*]/g, '_')
        .replace(/_+/g, '_')
        .replace(/^_+|_+$/g, '');
}


/* =========================================================
   2. GET DOWNLOAD EXTENSION
   ========================================================= */

function getDownloadExtension(link) {

    const originalName =
        link.getAttribute('download') || '';


    /*
       First check the existing download filename.
    */

    const match =
        originalName.match(
            /\.([a-zA-Z0-9]+)$/
        );

    if (match) {

        return match[1]
            .toLowerCase();
    }


    /*
       Otherwise inspect the href.
    */

    const href =
        link.getAttribute('href') || '';


    if (
        href.includes('image/png')
    ) {
        return 'png';
    }


    if (
        href.includes('audio/webm')
    ) {
        return 'webm';
    }


    if (
        href.includes('audio/wav')
    ) {
        return 'wav';
    }


    if (
        href.includes('audio/mpeg')
    ) {
        return 'mp3';
    }


    if (
        href.includes('audio/ogg')
    ) {
        return 'ogg';
    }


    if (
        href.includes('audio/mp4')
    ) {
        return 'm4a';
    }


    /*
       Default for MediaRecorder audio.
    */

    return 'webm';
}


/* =========================================================
   3. SHOULD THIS DOWNLOAD BE INTERCEPTED?
   ========================================================= */

function isRenameableDownload(link) {

    if (!link) {
        return false;
    }


    if (
        !link.hasAttribute('download')
    ) {
        return false;
    }


    const extension =
        getDownloadExtension(link);


    const allowedExtensions = [
        'txt',
        'png',
        'webm'
    ];


    return allowedExtensions.includes(
        extension
    );
}


/* =========================================================
   4. GET THE ACTUAL SCOREBOARD STRING
   ---------------------------------------------------------
   Priority:

   1. Quiz scoreboard
   2. Edits scoreboard

   IMPORTANT:

   We do NOT reconstruct the scoreboard.

   We read the exact string already displayed.
   ========================================================= */

function getCurrentScoreboardString() {


    /* -----------------------------------------
       QUIZ SCOREBOARD
       ----------------------------------------- */

    const quizElements =
        document.querySelectorAll(
            '.quiz-mania-score-text'
        );


    for (
        let i = quizElements.length - 1;
        i >= 0;
        i--
    ) {

        const text =
            quizElements[i]
                .textContent
                .trim();


        if (text) {

            return text;
        }
    }


    /* -----------------------------------------
       EDITS SCOREBOARD
       ----------------------------------------- */

    const editMeta =
        document.getElementById(
            'gsScoreMeta'
        );


    if (
        editMeta &&
        editMeta.textContent.trim()
    ) {

        return editMeta
            .textContent
            .trim();
    }


    return '';
}


/* =========================================================
   5. PARSE SCOREBOARD DATE / TIME
   ---------------------------------------------------------
   Input:

   28/09/2026 11:12:47

   Output:

   date = 28-09-2026
   time = 11-12-47
   ========================================================= */

function parseScoreboardDateTime(
    dateTime
) {

    const result = {
        date: '',
        time: ''
    };


    const match =
        String(dateTime || '')
            .trim()
            .match(
                /^(\d{1,2})\/(\d{1,2})\/(\d{4})\s+(\d{1,2}):(\d{2}):(\d{2})$/
            );


    if (!match) {

        result.date =
            cleanScoreboardFilenamePart(
                dateTime
            );

        return result;
    }


    result.date =
        `${match[1].padStart(2, '0')}-` +
        `${match[2].padStart(2, '0')}-` +
        `${match[3]}`;


    result.time =
        `${match[4].padStart(2, '0')}-` +
        `${match[5]}-` +
        `${match[6]}`;


    return result;
}


/* =========================================================
   6. BUILD FILENAME DIRECTLY FROM SCOREBOARD
   ========================================================= */

function buildInterceptedDownloadFilename(
    link
) {

    const extension =
        getDownloadExtension(link);


    /*
       Get the actual scoreboard text.
    */

    const scoreboard =
        getCurrentScoreboardString();


    /*
       If no scoreboard exists,
       keep the original filename.
    */

    if (!scoreboard) {

        return (
            link.getAttribute('download') ||
            'download'
        );
    }


    /*
       Split the scoreboard at pipes.

       Common structure:

       [0] filename
       [1] section
       [2] student name
       [3] student ID
       [4] date/time
    */

    const parts =
        scoreboard
            .split('|')
            .map(
                part => part.trim()
            );


    /*
       -----------------------------------------
       BASIC FIELDS
       -----------------------------------------
    */

    let filename =
        parts[0] ||
        'Teleprompter';


    let section =
        parts[1] ||
        'Section';


    const studentName =
        parts[2] ||
        'Guest';


    const studentId =
        parts[3] ||
        'Guest';


    const dateTime =
        parts[4] ||
        '';


    /*
       Remove original file extension.
    */

    filename =
        filename.replace(
            /\.[^.]+$/,
            ''
        );


    /*
       -----------------------------------------
       DETERMINE SCOREBOARD TYPE
       -----------------------------------------
    */

    const isQuiz =
        /:\s*Quiz\s*$/i.test(
            section
        );


    const isEdits =
        /:\s*Edits\s*$/i.test(
            section
        );


    /*
       Remove:

       : Quiz

       or:

       : Edits

       from the section name.
    */

    section =
        section.replace(
            /\s*:\s*(Quiz|Edits)\s*$/i,
            ''
        );


    /*
       -----------------------------------------
       DATE / TIME
       -----------------------------------------
    */

    const dateTimeParts =
        parseScoreboardDateTime(
            dateTime
        );


/*
       -----------------------------------------
       START BUILDING FILENAME
       -----------------------------------------
    */

    const filenameParts = [
        filename,
        section
    ];

    if (isEdits) {
        filenameParts.push("Edits");
    } else if (isQuiz) {
        filenameParts.push("Quiz");
    }

    filenameParts.push(
        studentName,
        studentId,
        dateTimeParts.date,
        dateTimeParts.time
    );


    /*
       -----------------------------------------
       QUIZ
       -----------------------------------------
    */

    if (isQuiz) {
        const score = parts[5] || 'NA';
        const percent = parts[6] || 'NA';

        filenameParts.push(
            score,
            percent
        );
    }


    /*
       -----------------------------------------
       EDITS
       -----------------------------------------
    */

    if (isEdits) {
        const editFields = parts.slice(5);
        editFields.forEach(field => {
            if (field) {
                filenameParts.push(field);
            }
        });
    }


    /*
       -----------------------------------------
       Guest / OTHER SCOREBOARD
       -----------------------------------------

       If this is neither Quiz nor Edits,
       retain everything after the date/time
       rather than throwing it away.
    */

    if (
        !isQuiz &&
        !isEdits
    ) {

        const remainingFields =
            parts.slice(5);


        remainingFields.forEach(
            field => {

                if (
                    field
                ) {

                    filenameParts.push(
                        field
                    );
                }
            }
        );
    }
    /*
       -----------------------------------------
       MAKE WINDOWS-SAFE FILENAME
       -----------------------------------------
    */

    const safeName =
        filenameParts
            .map(
                cleanScoreboardFilenamePart
            )
            .filter(Boolean)
            .join('_');


    const safeExtension =
        String(extension || 'txt')
            .replace(
                /^\./,
                ''
            )
            .replace(
                /[<>:"/\\|?*]/g,
                ''
            );


    return (
        safeName +
        '.' +
        safeExtension
    );
}


/* =========================================================
   7. INTERCEPT PROGRAMMATIC DOWNLOADS
   ========================================================= */

(function() {

    const originalAnchorClick =
        HTMLAnchorElement.prototype.click;


    HTMLAnchorElement.prototype.click =
        function() {

            const link = this;


            if (
                isRenameableDownload(link)
            ) {

                const newFilename =
                    buildInterceptedDownloadFilename(
                        link
                    );


                link.download =
                    newFilename;


                console.log(
                    'Download renamed:',
                    newFilename
                );
            }


            return originalAnchorClick.call(
                link
            );
        };



    /* =====================================================
       8. INTERCEPT NORMAL USER DOWNLOAD CLICKS
       ===================================================== */

    document.addEventListener(
        'click',
        function(event) {

            const link =
                event.target.closest(
                    'a[download]'
                );


            if (
                !isRenameableDownload(link)
            ) {

                return;
            }


            const newFilename =
                buildInterceptedDownloadFilename(
                    link
                );


            link.download =
                newFilename;


            console.log(
                'Download renamed:',
                newFilename
            );

        },
        true
    );

})();


/* =========================================================
   9. OPTIONAL GLOBAL HELPERS
   ========================================================= */

    getCurrentScoreboardString;

    buildInterceptedDownloadFilename;


/* =========================================================

);

   ========================================================= */

(function () {
    'use strict';

    function isNoQuizText(text) {

        if (!text) return false;

        const lines = String(text)
            .replace(/\r\n/g, '\n')
            .replace(/\r/g, '\n')
            .split('\n');

        for (let i = 0; i < lines.length - 1; i++) {

            if (
                lines[i].trim() === 'BLANK' &&
                lines[i + 1].trim() === '?BLANK'
            ) {
                return true;
            }
        }

        return false;
    }


    function removeNoQuizLines() {

        const zone =
            document.getElementById('editableTextZone');

        if (!zone) return;

        const lines =
            Array.from(
                zone.querySelectorAll('.line')
            );

        for (let i = 0; i < lines.length - 1; i++) {

            if (
                lines[i].textContent.trim() === 'BLANK' &&
                lines[i + 1].textContent.trim() === '?BLANK'
            ) {

                lines[i].remove();
                lines[i + 1].remove();

                break;
            }
        }
    }


    function updateQuizBar(noQuiz) {

        const bar =
            document.getElementById('quizToggleBar');

        if (!bar) return;

        /*
           Only hide/show the existing bar.
           Do not change its text.
           Do not disable it.
           Do not modify its event handlers.
        */

        bar.style.display =
            noQuiz ? 'none' : '';
    }


    /*
       Your existing section loader already fires this
       event after a section has been selected and loaded.
    */

    window.addEventListener(
        'textSectionLoaded',
        function (event) {

            const text =
                event &&
                event.detail &&
                typeof event.detail.sectionText === 'string'
                    ? event.detail.sectionText
                    : '';

            const noQuiz =
                isNoQuizText(text);

            if (noQuiz) {
                removeNoQuizLines();
            }

            updateQuizBar(noQuiz);
        }
    );

})();

<script>
/* ==========================================================================
   CASCADING CHAPTER & VERSE NAVIGATION & TOP-ALIGNMENT MODULE
   ========================================================================== */
document.addEventListener('DOMContentLoaded', () => {
    'use strict';

    const chapterSelect = document.getElementById('chapterSelect');
    const verseSelect = document.getElementById('verseSelect');
    const goBtn = document.getElementById('goBtn');
    const teleEdit = document.getElementById('teleEdit');

    let currentSectionVerseMap = {};

    // 1. PARSE CHAPTERS & VERSES FROM THE ACTIVE TEXT SECTION
    function parseChaptersAndVerses() {
        currentSectionVerseMap = {};
        const editableZone = document.getElementById('editableTextZone') || teleEdit;
        if (!editableZone) return;

        const nodes = Array.from(editableZone.querySelectorAll('.line, p, h3, h4'));
        
        let currentChap = "1";
        currentSectionVerseMap[currentChap] = {};

        nodes.forEach((node) => {
            const text = node.textContent ? node.textContent.trim() : "";
            if (!text) return;

            const chapMatch = text.match(/^chapter\s*[:]?\s*(\d+)/i) || text.match(/^ch\.?\s*(\d+)/i);
            const verseMatch = text.match(/^verse\s*[:]?\s*(\d+)/i) || text.match(/^v\.?\s*(\d+)/i);

            if (chapMatch && chapMatch[1]) {
                currentChap = chapMatch[1];
                if (!currentSectionVerseMap[currentChap]) {
                    currentSectionVerseMap[currentChap] = {};
                }
            }

            if (verseMatch && verseMatch[1]) {
                const verseNum = verseMatch[1];
                currentSectionVerseMap[currentChap][verseNum] = node;
                node.dataset.verseNum = verseNum;
                node.dataset.chapterNum = currentChap;
            }
        });

        if (Object.keys(currentSectionVerseMap["1"]).length === 0) {
            nodes.forEach((node, idx) => {
                currentSectionVerseMap["1"][idx + 1] = node;
            });
        }

        populateChapterDropdown();
    }

    // 2. POPULATE CHAPTER DROPDOWN
    function populateChapterDropdown() {
        if (!chapterSelect) return;
        chapterSelect.innerHTML = '';

        const chapters = Object.keys(currentSectionVerseMap);
        if (chapters.length === 0) {
            chapters.push("1");
            currentSectionVerseMap["1"] = { "1": teleEdit };
        }

        chapters.forEach(chap => {
            const opt = document.createElement('option');
            opt.value = chap;
            opt.textContent = `Chapter ${chap}`;
            chapterSelect.appendChild(opt);
        });

        populateVerseDropdown();
    }

    // 3. POPULATE VERSE DROPDOWN BASED ON SELECTED CHAPTER
    function populateVerseDropdown() {
        if (!verseSelect || !chapterSelect) return;
        verseSelect.innerHTML = '';

        const activeChap = chapterSelect.value;
        const versesObj = currentSectionVerseMap[activeChap] || {};
        const verses = Object.keys(versesObj);

        if (verses.length === 0) {
            verses.push("1");
        }

        verses.forEach(verse => {
            const opt = document.createElement('option');
            opt.value = verse;
            opt.textContent = `Verse ${verse}`;
            verseSelect.appendChild(opt);
        });
    }

    if (chapterSelect) {
        chapterSelect.addEventListener('change', populateVerseDropdown);
    }

    window.addEventListener('textSectionLoaded', () => {
        setTimeout(parseChaptersAndVerses, 100);
    });

    setTimeout(parseChaptersAndVerses, 300);

    // 4. "GO" BUTTON NAVIGATION (Brings target verse precisely to the top)
    if (goBtn) {
        goBtn.addEventListener('click', (e) => {
            e.preventDefault();
            const chap = chapterSelect ? chapterSelect.value : "1";
            const verse = verseSelect ? verseSelect.value : "1";

            const targetNode = currentSectionVerseMap[chap]?.[verse];
            const scrollWrapper = document.getElementById('teleScrollWrapper') || document.getElementById('teleWrapper');

            if (targetNode && scrollWrapper) {
                // Sum up offset tops recursively up to the scroll wrapper for absolute precision
                let topPos = 0;
                let el = targetNode;
                while (el && el !== scrollWrapper && el !== document.body) {
                    topPos += el.offsetTop;
                    el = el.offsetParent;
                }

                // Scroll container so the selected verse sits right at the top (with a 10px safety buffer)
                scrollWrapper.scrollTo({
                    top: Math.max(0, topPos - 10),
                    behavior: 'smooth'
                });

                // Soft highlight effect to make it pop out
                targetNode.style.transition = 'background-color 0.3s ease';
                targetNode.style.backgroundColor = '#dbeafe';
                setTimeout(() => {
                    targetNode.style.backgroundColor = '';
                }, 1800);
            } else {
                console.warn(`Target Chapter ${chap}, Verse ${verse} element could not be located.`);
            }
        });
    }
});
</script>

<script>
/* ==========================================================================
   CASCADING CHAPTER & VERSE NAVIGATION & TOP-ALIGNMENT MODULE
   ========================================================================== */
document.addEventListener('DOMContentLoaded', () => {
    'use strict';

    const chapterSelect = document.getElementById('chapterSelect');
    const verseSelect = document.getElementById('verseSelect');
    const goBtn = document.getElementById('goBtn');
    const teleEdit = document.getElementById('teleEdit');

    let currentSectionVerseMap = {};

    // 1. PARSE CHAPTERS & VERSES FROM THE ACTIVE TEXT SECTION (Enhanced flexibility)
    function parseChaptersAndVerses() {
        currentSectionVerseMap = {};
        const editableZone = document.getElementById('editableTextZone') || teleEdit;
        if (!editableZone) return;

        const nodes = Array.from(editableZone.querySelectorAll('.line, p, h3, h4, span'));
        
        let currentChap = "1";
        currentSectionVerseMap[currentChap] = {};

        nodes.forEach((node) => {
            const text = node.textContent ? node.textContent.trim() : "";
            if (!text) return;

            // Check if node already has explicit dataset attributes
            if (node.dataset.verseNum) {
                const c = node.dataset.chapterNum || currentChap;
                const v = node.dataset.verseNum;
                if (!currentSectionVerseMap[c]) currentSectionVerseMap[c] = {};
                currentSectionVerseMap[c][v] = node;
                return;
            }

            // Flexible regex match for chapters and verses
            const chapMatch = text.match(/^(?:chapter|ch\.?)\s*(\d+)/i);
            const verseMatch = text.match(/^(?:verse|v\.?)\s*(\d+)/i) || text.match(/^(\d+[\.:])\s+/); // matches "1." or "1:" at start

            if (chapMatch && chapMatch[1]) {
                currentChap = chapMatch[1];
                if (!currentSectionVerseMap[currentChap]) {
                    currentSectionVerseMap[currentChap] = {};
                }
            }

            if (verseMatch && verseMatch[1]) {
                const verseNum = verseMatch[1].replace(/[\.:]/g, ''); // clean up punctuation if matched via "1."
                currentSectionVerseMap[currentChap][verseNum] = node;
                node.dataset.verseNum = verseNum;
                node.dataset.chapterNum = currentChap;
            }
        });

        // Fallback: If no explicit chapter/verse markers were found in the text, map sequential nodes as verses for Chapter 1
        let totalVersesFound = Object.values(currentSectionVerseMap).reduce((acc, chapObj) => acc + Object.keys(chapObj).length, 0);
        if (totalVersesFound === 0) {
            currentSectionVerseMap["1"] = {};
            nodes.forEach((node, idx) => {
                const vNum = String(idx + 1);
                currentSectionVerseMap["1"][vNum] = node;
                node.dataset.verseNum = vNum;
                node.dataset.chapterNum = "1";
            });
        }

        populateChapterDropdown();
    }

    // 2. POPULATE CHAPTER DROPDOWN (Defaults to "CH", options are pure numbers)
    function populateChapterDropdown() {
        if (!chapterSelect) return;
        chapterSelect.innerHTML = '';

        const defaultOpt = document.createElement('option');
        defaultOpt.value = "0";
        defaultOpt.textContent = "Subsection";
        chapterSelect.appendChild(defaultOpt);

        const chapters = Object.keys(currentSectionVerseMap);
        chapters.forEach(chap => {
            const opt = document.createElement('option');
            opt.value = chap;
            opt.textContent = chap; // Pure number
            chapterSelect.appendChild(opt);
        });

        populateVerseDropdown();
    }

    // 3. POPULATE VERSE DROPDOWN BASED ON SELECTED CHAPTER (Defaults to "V", populates all verses correctly)
    function populateVerseDropdown() {
        if (!verseSelect || !chapterSelect) return;
        verseSelect.innerHTML = '';

        const defaultOpt = document.createElement('option');
        defaultOpt.value = "0";
        defaultOpt.textContent = "Line Entry";
        verseSelect.appendChild(defaultOpt);

        const allChapters = Object.keys(currentSectionVerseMap);
        let activeChap = chapterSelect.value;
        if (!activeChap || activeChap === "0") {
            activeChap = allChapters[0] || "1";
        }

        const versesObj = currentSectionVerseMap[activeChap] || {};
        const verses = Object.keys(versesObj);

        // If no explicit verses mapped for this chapter, create indices based on node count/fallback
        if (verses.length === 0 && teleEdit) {
            const fallbackNodes = Array.from(teleEdit.querySelectorAll('.line, p, h3, h4'));
            fallbackNodes.forEach((node, idx) => {
                const vNum = String(idx + 1);
                versesObj[vNum] = node;
                verses.push(vNum);
            });
            currentSectionVerseMap[activeChap] = versesObj;
        }

        verses.forEach(verse => {
            const opt = document.createElement('option');
            opt.value = verse;
            opt.textContent = verse; // Pure number
            verseSelect.appendChild(opt);
        });
    }

    if (chapterSelect) {
        chapterSelect.addEventListener('change', populateVerseDropdown);
    }

    window.addEventListener('textSectionLoaded', () => {
        setTimeout(parseChaptersAndVerses, 100);
    });

    setTimeout(parseChaptersAndVerses, 300);

    // 4. "GO" BUTTON NAVIGATION
    if (goBtn) {
        goBtn.addEventListener('click', (e) => {
            e.preventDefault();
            let chap = chapterSelect ? chapterSelect.value : "1";
            let verse = verseSelect ? verseSelect.value : "1";

            if (chap === "0") chap = Object.keys(currentSectionVerseMap)[0] || "1";
            if (verse === "0") verse = "1";

            const targetNode = currentSectionVerseMap[chap]?.[verse];
            const scrollWrapper = document.getElementById('teleScrollWrapper') || document.getElementById('teleWrapper');

            if (targetNode && scrollWrapper) {
                let topPos = 0;
                let el = targetNode;
                while (el && el !== scrollWrapper && el !== document.body) {
                    topPos += el.offsetTop;
                    el = el.offsetParent;
                }

                scrollWrapper.scrollTo({
                    top: Math.max(0, topPos - 10),
                    behavior: 'smooth'
                });

                targetNode.style.transition = 'background-color 0.3s ease';
                targetNode.style.backgroundColor = '#dbeafe';
                setTimeout(() => {
                    targetNode.style.backgroundColor = '';
                }, 1800);
            } else {
                console.warn(`Target Chapter ${chap}, Verse ${verse} element could not be located.`);
            }
        });
    }
});
</script>

        buttonElement.innerText = 'Copied!';
        setTimeout(() => { buttonElement.innerText = oldText; }, 2000);
    }

    // Helper to copy text and trigger feedback
    function executeCopy(text, buttonElement) {
        navigator.clipboard.writeText(text).then(() => {
            triggerSystemCopyFeedback(buttonElement);
        }).catch(err => {
            console.error('Clipboard error: ', err);
            alert('Failed to copy to clipboard.');
        });
    }

    // Helper to grab text scoreboard data safely
    function getScoreboardText() {
        const activeScoreTextEl = document.querySelector('.quiz-mania-scoreboard[style*="block"] .quiz-mania-score-text, #gsScoreText, pre');
        if (activeScoreTextEl && activeScoreTextEl.innerText.trim()) {
            return activeScoreTextEl.innerText;
        }
        
        const possibleElements = document.querySelectorAll('pre, code, .score-output, .quiz-score-box');
        let text = '';
        possibleElements.forEach(el => {
            if (el.innerText && el.innerText.length > text.length) {
                text = el.innerText;
            }
        });
        return text || document.body.innerText;
    }

    // Button Actions
    function handleGeneralAIClick(e) {
        const scoreText = getScoreboardText();
        const instructions = "Please use the following scoreboard data to create a 6-panel cartoon narrative structured on an A4 landscape layout:\n\n" + scoreText;
        executeCopy(instructions, e.target);
    }

    let activeScoreText = '';
    function handleMusicAIClick(e) {
        activeScoreText = getScoreboardText();
        document.getElementById('standalone-music-modal').style.display = 'flex';
    }

    document.getElementById('sam-cancel-btn').addEventListener('click', () => {
        document.getElementById('standalone-music-modal').style.display = 'none';
    });

    document.getElementById('sam-send-btn').addEventListener('click', () => {
        const genre = document.querySelector('input[name="sam_genre"]:checked').value;
        const vocal = document.querySelector('input[name="sam_vocal"]:checked').value;
        
        let tonePart = '';
        if (!['Classical', 'Reggae'].includes(genre)) {
            const toneInput = document.querySelector('input[name="sam_tone"]:checked');
            if (toneInput) {
                tonePart = `, Tone: ${toneInput.value}`;
            }
        }

        // Appended at the end of the text
        const musicPrompt = activeScoreText + `\n\n[Music Style Request: Genre: ${genre}, Vocals: ${vocal}${tonePart}]`;
        
        document.getElementById('standalone-music-modal').style.display = 'none';
        const musicBtn = document.querySelector('.standalone-music-btn');
        if (musicBtn) {
            executeCopy(musicPrompt, musicBtn);
        }
    });

    // 3. Observer targeting text scoreboard containers while skipping quiz scoreboards
    const observer = new MutationObserver(() => {
        const potentialContainers = document.querySelectorAll('.scoreboard, #scoreDisplay, .score-container, div[id*="score"]');
        
        potentialContainers.forEach(container => {
            if (container.closest('.quiz-scoreboard, .quiz-visual, .quiz-graphic, .quiz-mania-card')) {
                return;
            }

            const buttonsInContainer = container.querySelectorAll('button');
            let hasExportGroup = false;
            
            buttonsInContainer.forEach(btn => {
                const t = btn.innerText.toLowerCase();
                if (t.includes('copy') || t.includes('txt') || t.includes('png') || t.includes('audio') || t.includes('download')) {
                    hasExportGroup = true;
                }
            });

            if (hasExportGroup && !container.querySelector('.standalone-ai-row')) {
                const rowDiv = document.createElement('div');
                rowDiv.className = 'standalone-ai-row';

                const aiBtn = document.createElement('button');
                aiBtn.className = 'standalone-ai-btn';
                aiBtn.innerText = 'AI Visuals';
                aiBtn.addEventListener('click', handleGeneralAIClick);

                const musicBtn = document.createElement('button');
                musicBtn.className = 'standalone-music-btn';
                musicBtn.innerText = 'AI Music';
                musicBtn.addEventListener('click', handleMusicAIClick);

                rowDiv.appendChild(aiBtn);
                rowDiv.appendChild(musicBtn);

                container.appendChild(rowDiv);
            }
        });
    });

    observer.observe(document.body, {
        childList: true,
        subtree: true,
        attributes: true,
        attributeFilter: ['style', 'class']
    });

})();</script>

<script>
/* =========================================================
   EXPERIMENTAL LINE ENTRY SYSTEM
   ---------------------------------------------------------
   Uses the selected SECTION NAME to identify the title.

   Section title:
       NOT numbered

   A Line Entry is one blank-line-separated block.

   Example:

       This is sentence one.
       This is sentence two.
       This is sentence three.

       This is sentence four.

   becomes:

       1. This is sentence one.
          This is sentence two.
          This is sentence three.

       2. This is sentence four.

   Multiple sentences on one physical line are also treated
   as one Line Entry.

   Blank lines:
       separate Line Entries

   This is experimental and does NOT modify the existing
   Bible/verse system.
   ========================================================= */

(function () {
    'use strict';

    let lineEntryMap = {};


    /* =====================================================
       GET CURRENT SECTION NAME
       ===================================================== */

    function getCurrentSectionName() {

        /* Preferred: the selected section */
        if (
            window.SCRAMBLE_SECTIONS &&
            typeof window.selectedSectionIndex !== 'undefined' &&
            window.selectedSectionIndex >= 0 &&
            window.SCRAMBLE_SECTIONS[
                window.selectedSectionIndex
            ]
        ) {

            return (
                window.SCRAMBLE_SECTIONS[
                    window.selectedSectionIndex
                ].name || ''
            ).trim();
        }


        /* Your main script uses this variable too */
        if (window.currentQuizSectionName) {

            return String(
                window.currentQuizSectionName
            ).trim();
        }


        return '';
    }


    /* =====================================================
       CLEAN TEXT FOR COMPARISON
       ===================================================== */

    function cleanComparisonText(text) {

        return String(text || '')
            .replace(/\u00a0/g, ' ')
            .replace(/^\s*\d+\.\s*/, '')
            .trim()
            .toLowerCase();
    }


    /* =====================================================
       REMOVE ONLY NUMBERS CREATED BY THIS SCRIPT
       ===================================================== */

    function removeExperimentalNumbers(editableZone) {

        editableZone
            .querySelectorAll(
                '[data-experimental-line-number="true"]'
            )
            .forEach(function (number) {

                number.remove();
            });


        editableZone
            .querySelectorAll(
                '.line[data-experimental-line-entry]'
            )
            .forEach(function (line) {

                delete line.dataset.experimentalLineEntry;
            });
    }


    /* =====================================================
       SET UP LINE ENTRIES
       ===================================================== */

    function setupExperimentalLineEntries() {

        const editableZone =
            document.getElementById(
                'editableTextZone'
            );

        const verseSelect =
            document.getElementById(
                'verseSelect'
            );

        if (!editableZone) return;


        const lines =
            Array.from(
                editableZone.querySelectorAll(
                    '.line'
                )
            );

        if (!lines.length) return;


        /* -------------------------------------------------
           Remove our previous numbering
           ------------------------------------------------- */

        removeExperimentalNumbers(
            editableZone
        );


        /* -------------------------------------------------
           Get the actual selected section name
           ------------------------------------------------- */

        const sectionName =
            getCurrentSectionName();


        const cleanSectionName =
            cleanComparisonText(
                sectionName
            );


        let titleLineFound = false;

        let entryNumber = 0;

        lineEntryMap = {};


        /* =================================================
           BUILD BLOCKS

           Consecutive non-blank .line elements belong
           to the same Line Entry.

           A blank .line ends the current block.
           ================================================= */

        let currentBlock = [];


        const blocks = [];


        lines.forEach(function (line) {

            const originalText =
                (line.textContent || '')
                    .replace(/\u00a0/g, ' ')
                    .trim();


            /* ---------------------------------------------
               Blank line = end of current block
               --------------------------------------------- */

            if (!originalText) {

                if (currentBlock.length) {

                    blocks.push(
                        currentBlock
                    );

                    currentBlock = [];
                }

                return;
            }


            /* ---------------------------------------------
               Non-blank line = add to current block
               --------------------------------------------- */

            currentBlock.push(line);
        });


        /* -------------------------------------------------
           Add final block if there is no blank line at
           the end of the text.
           ------------------------------------------------- */

        if (currentBlock.length) {

            blocks.push(
                currentBlock
            );
        }


        /* =================================================
           PROCESS BLOCKS
           ================================================= */

        blocks.forEach(function (block) {

            if (!block.length) return;


            /* ---------------------------------------------
               Determine whether this block is the title
               --------------------------------------------- */

            const firstLineText =
                (block[0].textContent || '')
                    .replace(/\u00a0/g, ' ')
                    .trim();


            const cleanFirstLineText =
                cleanComparisonText(
                    firstLineText
                );


            /*
             * If the first line matches the actual selected
             * section name, this whole block is the title.
             *
             * This also handles an existing section number:
             *
             *     1. The Fox and the Crow
             */

            if (
                cleanSectionName &&
                cleanFirstLineText ===
                    cleanSectionName
            ) {

                titleLineFound = true;

                return;
            }


            /*
             * If we don't have a section name available,
             * fall back to treating the first block as
             * the title.
             *
             * This is only a fallback.
             */

            if (
                !cleanSectionName &&
                !titleLineFound &&
                entryNumber === 0
            ) {

                titleLineFound = true;

                return;
            }


            /* ---------------------------------------------
               This whole block is one Line Entry
               --------------------------------------------- */

            entryNumber++;


            const firstLine =
                block[0];


            const numberSpan =
                document.createElement(
                    'span'
                );


            numberSpan.setAttribute(
                'data-experimental-line-number',
                'true'
            );


            numberSpan.textContent =
                entryNumber + '. ';


            /*
             * Put the number only at the beginning
             * of the first physical line in the block.
             */

            firstLine.insertBefore(
                numberSpan,
                firstLine.firstChild
            );


            /* ---------------------------------------------
               Mark every physical line in the block as
               belonging to this Line Entry.
               --------------------------------------------- */

            block.forEach(function (line) {

                line.dataset.experimentalLineEntry =
                    String(entryNumber);
            });


            /* ---------------------------------------------
               Store the first physical line as the target
               for scrolling.
               --------------------------------------------- */

            lineEntryMap[entryNumber] =
                firstLine;
        });


        /* =================================================
           POPULATE LINE ENTRY SELECTOR
           ================================================= */

        if (verseSelect) {

            verseSelect.innerHTML = '';


            const defaultOption =
                document.createElement(
                    'option'
                );

            defaultOption.value = '';

            defaultOption.textContent =
                'Line Entry';

            verseSelect.appendChild(
                defaultOption
            );


            Object.keys(
                lineEntryMap
            ).forEach(function (number) {

                const option =
                    document.createElement(
                        'option'
                    );

                option.value =
                    number;

                option.textContent =
                    number;

                verseSelect.appendChild(
                    option
                );
            });
        }


        /* -------------------------------------------------
           Store globally for testing
           ------------------------------------------------- */

        window.experimentalLineEntryMap =
            lineEntryMap;


        console.log(
            'Experimental Line Entries:',
            Object.keys(
                lineEntryMap
            ).length
        );
    }


    /* =====================================================
       RUN AFTER TEXT IS LOADED
       ===================================================== */

    window.addEventListener(
        'textSectionLoaded',
        function () {

            setTimeout(
                setupExperimentalLineEntries,
                50
            );
        }
    );


    /* =====================================================
       INITIAL PAGE LOAD
       ===================================================== */

    document.addEventListener(
        'DOMContentLoaded',
        function () {

            setTimeout(
                setupExperimentalLineEntries,
                150
            );
        }
    );


    /* =====================================================
       GO BUTTON
       ===================================================== */

    document.addEventListener(
        'click',
        function (e) {

            const goBtn =
                e.target.closest(
                    '#goBtn'
                );

            if (!goBtn) return;


            const verseSelect =
                document.getElementById(
                    'verseSelect'
                );

            if (!verseSelect) return;


            const selected =
                verseSelect.value;

            if (!selected) return;


            const target =
                lineEntryMap[selected];

            if (!target) return;


            const scrollContainer =
                document.getElementById(
                    'teleScrollWrapper'
                ) ||
                document.getElementById(
                    'teleWrapper'
                );


            if (!scrollContainer) return;


            const containerRect =
                scrollContainer.getBoundingClientRect();

            const targetRect =
                target.getBoundingClientRect();


            const targetTop =
                scrollContainer.scrollTop +
                (
                    targetRect.top -
                    containerRect.top
                ) -
                10;


            scrollContainer.scrollTo({

                top: targetTop,

                behavior: 'smooth'
            });


            /* Temporary visual confirmation */

            target.style.outline =
                '3px solid #a56bff';


            setTimeout(
                function () {

                    target.style.outline =
                        '';

                },
                1000
            );
        }
    );

})();
</script>
