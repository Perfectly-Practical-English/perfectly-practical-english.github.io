<script>
(function primeFemaleVoiceOnce() {
    const synth = window.speechSynthesis;
    if (!synth) return;
    let primed = false;

    function tryPrime() {
        if (primed) return;
        const voices = synth.getVoices();
        if (!voices.length) return;

        const femaleVoice =
            voices.find(v => /Aria|Zira|Samantha|Victoria|Moira/i.test(v.name)) ||
            voices.find(v => v.lang && v.lang.startsWith("en")) ||
            voices[0];

        if (!femaleVoice) return;

        const u = new SpeechSynthesisUtterance(" ");
        u.voice = femaleVoice;
        u.volume = 0;
        u.rate = 1;
        u.pitch = 1;

        synth.speak(u);
        primed = true;
    }

    tryPrime();
    synth.onvoiceschanged = tryPrime;
    document.addEventListener("pointerdown", tryPrime, { once: true });
})();

(function () {
    function cleanSpeechText(text) {
        text = text.replace(/\b\d+:\d+\s*/g, '');
        text = text.replace(/<br\s*\/?>/gi, ' ');
        text = text.replace(/\n+/g, ' ');
        text = text.replace(/\s+\./g, '.');
        text = text.replace(/\.(\S)/g, '. $1');
        text = text.replace(/\s+/g, ' ').trim();
        return text;
    }

    const OriginalUtterance = window.SpeechSynthesisUtterance;
    function PatchedUtterance(text) {
        return new OriginalUtterance(cleanSpeechText(text));
    }
    PatchedUtterance.prototype = OriginalUtterance.prototype;
    window.SpeechSynthesisUtterance = PatchedUtterance;
})();
</script>

<!-- =========================================================
     [2] HIGHLIGHT, READ-ALOUD & EMOJI OVERLAYS
     ========================================================= -->
<script>
(function() {
    const synth = window.speechSynthesis;
    let teacherVoice = null;
    let studentVoice = null;

    function loadVoices() {
        const voices = synth.getVoices();
        if (!voices.length) return;

        teacherVoice =
            voices.find(v => v.name.includes("Zira")) ||
            voices.find(v => v.name === "Microsoft Zira" && v.lang === "en-US") ||
            voices.find(v => v.name.includes("Samantha")) ||
            voices.find(v => v.lang.startsWith("en") && v.name.toLowerCase().includes("female")) ||
            voices[0];

        studentVoice =
            voices.find(v => v.name.includes("Aria")) ||
            voices.find(v => v.name === "Microsoft Aria" && v.lang.startsWith("en-GB")) ||
            voices.find(v => v.name.includes("Victoria")) ||
            voices.find(v => v.lang.startsWith("en") && v.name.toLowerCase().includes("female")) ||
            voices[0];
    }

    synth.onvoiceschanged = loadVoices;
    loadVoices();

    // Single-Button Highlight / De-Highlight Toggle
    const highlightBtn = document.getElementById("highlightBtn") || document.getElementById("highlightSelected");
    const editor = document.getElementById("teleEdit");

    highlightBtn?.addEventListener("mousedown", (e) => {
        e.preventDefault();
    });

    highlightBtn?.addEventListener("click", () => {
        const sel = window.getSelection();
        if (!sel.rangeCount || sel.isCollapsed) return;

        const range = sel.getRangeAt(0);
        if (editor && !editor.contains(range.commonAncestorContainer)) return;

        let container = range.commonAncestorContainer;
        if (container.nodeType === 3) container = container.parentNode;
        
        const enclosingHighlight = container.closest(".highlight");

        if (enclosingHighlight) {
            const parent = enclosingHighlight.parentNode;
            while (enclosingHighlight.firstChild) {
                parent.insertBefore(enclosingHighlight.firstChild, enclosingHighlight);
            }
            enclosingHighlight.remove();
            editor.normalize();
            sel.removeAllRanges();
            return;
        }

        const allHighlights = Array.from(editor.querySelectorAll(".highlight"));
        const intersectingHighlights = allHighlights.filter(h => {
            try {
                return range.intersectsNode(h) || h.contains(range.startContainer) || h.contains(range.endContainer);
            } catch (e) {
                return false;
            }
        });

        if (intersectingHighlights.length > 0) {
            intersectingHighlights.forEach(h => {
                const parent = h.parentNode;
                if (parent) {
                    while (h.firstChild) {
                        parent.insertBefore(h.firstChild, h);
                    }
                    h.remove();
                }
            });
            editor.normalize();
            sel.removeAllRanges();
            return;
        }

        try {
            const span = document.createElement("span");
            span.className = "highlight";
            range.surroundContents(span);
        } catch (e) {
            const span = document.createElement("span");
            span.className = "highlight";
            span.appendChild(range.extractContents());
            range.insertNode(span);
        }

        editor.normalize();
        sel.removeAllRanges();
    });

    // Emoji Speech Overlays
    function addSpeechEmojis() {
        const paragraphs = document.querySelectorAll('.question-text p, .line, .sentence, #quizSections p');
        paragraphs.forEach(p => {
            if (p.dataset.speechOverlay) return;
            p.dataset.speechOverlay = '1';

            const text = p.textContent.trim();
            let speaker = null;

            if (/^teacher:/i.test(text)) speaker = 'teacher';
            else if (/^student:/i.test(text)) speaker = 'student';
            else return;

            const emoji = speaker === 'teacher' ? '👩‍🦰' : '👧';
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'speech-emoji-btn';
            btn.title = speaker === 'teacher' ? 'Teacher Speech' : 'Student Speech';
            btn.textContent = emoji + ' ';

            btn.addEventListener('click', () => {
                if (synth.speaking) {
                    synth.cancel();
                    if (typeof clearHighlight === 'function') clearHighlight();
                }

                document.querySelectorAll(".reading-active")
                    .forEach(el => el.classList.remove("reading-active"));

                p.classList.add("reading-active");

                const lineText = text.replace(/^(teacher:|student:)\s*/i, '');
                const utter = new SpeechSynthesisUtterance(lineText);

                if (speaker === 'teacher') {
                    utter.voice = teacherVoice;
                    utter.rate = 0.88;
                    utter.pitch = 1.15;
                    utter.volume = 0.95;
                } else {
                    utter.voice = studentVoice;
                    utter.rate = 0.98;
                    utter.pitch = 1.50;
                    utter.volume = 0.80;
                }

                utter.onend = () => {
                    p.classList.remove("reading-active");
                };

                synth.speak(utter);
            });
            p.insertBefore(btn, p.firstChild);
        });
    }

    addSpeechEmojis();
    setInterval(addSpeechEmojis, 1000);
})();
</script>



<!-- =========================================================
     [1] AUDIO FEEDBACK & SCORING SYSTEM
     ========================================================= -->
<script>
(function() {
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playCorrect() { 
        audioCtx.resume().then(() => { 
            const o = audioCtx.createOscillator(); 
            const g = audioCtx.createGain(); 
            o.type = "sine"; 
            o.frequency.setValueAtTime(800, audioCtx.currentTime); 
            g.gain.setValueAtTime(0.4, audioCtx.currentTime); 
            o.connect(g); g.connect(audioCtx.destination); 
            o.start(); o.stop(audioCtx.currentTime + 0.25); 
        }); 
    }

    function playWrong() { 
        audioCtx.resume().then(() => { 
            const o = audioCtx.createOscillator(); 
            const g = audioCtx.createGain(); 
            o.type = "triangle"; 
            o.frequency.setValueAtTime(450, audioCtx.currentTime); 
            o.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.25); 
            g.gain.setValueAtTime(0.4, audioCtx.currentTime); 
            o.connect(g); g.connect(audioCtx.destination); 
            o.start(); o.stop(audioCtx.currentTime + 0.25); 
        }); 
    }

    function normalize(str){ 
        return (str || '').trim().toLowerCase().replace(/\s+/g," "); 
    }

    document.body.addEventListener('change', e => {
        const exercise = e.target.closest('.exercise');
        if (!exercise) return;

        const textInputs = Array.from(exercise.querySelectorAll("input[type='text'], textarea"));
        const selectedInputs = Array.from(exercise.querySelectorAll("input:checked"));

        const userAnswers = textInputs.length 
            ? textInputs.map(i => normalize(i.value)) 
            : selectedInputs.map(i => normalize(i.value));

        const correctAnswers = Array.from(exercise.querySelectorAll('[data-correct]'))
            .map(i => normalize(i.dataset.correct));

        const isCorrect = userAnswers.length > 0 && userAnswers.every(ans => correctAnswers.includes(ans));

        exercise.querySelectorAll('.mc-emoji').forEach(span => span.remove());

        selectedInputs.forEach(inp => {
            const lbl = inp.closest("label");
            if (lbl) {
                const span = document.createElement('span');
                span.className = "mc-emoji";
                span.textContent = isCorrect ? "😊" : "😢";
                lbl.appendChild(span);
            }
        });

        textInputs.forEach(inp => {
            const span = document.createElement('span');
            span.className = "mc-emoji";
            span.textContent = isCorrect ? "😊" : "😢";
            inp.parentNode.insertBefore(span, inp.nextSibling);
        });

        if (isCorrect) playCorrect(); else playWrong();

        if (exercise.dataset.firstResponseLocked) return;
        exercise.dataset.firstResponseLocked = 'true';

        const correctCount = isCorrect ? 1 : 0;
        exercise.dataset.score = correctCount;
        exercise.dataset.percentage = correctCount * 100;
    });

    document.body.addEventListener('click', e => {
        if (!e.target.classList.contains('quiz-submit')) return;
        const sub = e.target.closest('.quiz-subsection');
        if (!sub) return;

        const exercises = sub.querySelectorAll('.exercise');
        let correctCount = 0;
        exercises.forEach(ex => {
            correctCount += Number(ex.dataset.score || 0);
        });

        const totalExercises = exercises.length;
        const percentage = totalExercises > 0 ? Math.round((correctCount / totalExercises) * 100) : 0;

        const board = sub.querySelector('.quiz-scoreboard');
        if (board) {
            const dataEl = board.querySelector('.scoreboard-data');
            const name = sub.querySelector('.quiz-name')?.value || 'Anonymous';
            const id = sub.querySelector('.quiz-id')?.value || 'N/A';
            const section = sub.closest('.section')?.querySelector('h2')?.textContent || 'Unknown Section';
            const subsection = sub.dataset.subsection || 'Unknown Subsection';
            const now = new Date();
            const pad = n => n.toString().padStart(2,'0');
            const dateString = `${pad(now.getDate())}/${pad(now.getMonth()+1)}/${now.getFullYear()} ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
            const filename = window.location.pathname.split('/').pop();

            const resultText = `${filename}|${section.replace(/:+$/, '').trim()}: ${subsection.replace(/^:+/, '').trim()}|${name}|${id}|${dateString}|${correctCount}/${totalExercises}|${percentage}%`;
            if (dataEl) dataEl.textContent = resultText;

            if (window.saveResult) {
                window.saveResult(resultText);
            }

            board.style.display = 'block';
        }
    });
})();
</script>

<script>
(function() {
    'use strict';

    let scrollInterval = null;
    let isPlaying = false;
    let currentLineIndex = 0;
    let lineIntervalMs = 2500; // Time spent on each line (milliseconds)

    const wrapper = document.getElementById('teleScrollWrapper');
    const editArea = document.getElementById('teleEdit');
    const startBtn = document.getElementById('startBtn') || document.getElementById('telePlayBtn');
    const stopBtn = document.getElementById('stopBtn');
    const repeatBtn = document.getElementById('repeatBtn');
    const speedButtons = document.querySelectorAll('.speed-buttons button');

    function scrollToLine(index) {
        if (!wrapper || !editArea) return;
        const lines = editArea.querySelectorAll('.line');
        if (lines.length === 0) return;

        if (index >= lines.length) {
            stopPrompter();
            return;
        }

        const targetLine = lines[index];
        wrapper.scrollTo({
            top: targetLine.offsetTop - wrapper.offsetTop - 20,
            behavior: 'smooth'
        });
    }

    function startPrompter() {
        if (!wrapper || isPlaying) return;
        const lines = editArea.querySelectorAll('.line');
        if (lines.length === 0) return;

        isPlaying = true;
        if (startBtn) startBtn.textContent = 'Pause';

        scrollToLine(currentLineIndex);

        scrollInterval = setInterval(() => {
            currentLineIndex++;
            scrollToLine(currentLineIndex);
        }, lineIntervalMs);
    }

    function stopPrompter() {
        if (scrollInterval) {
            clearInterval(scrollInterval);
            scrollInterval = null;
        }
        isPlaying = false;
        if (startBtn) startBtn.textContent = 'Play';
    }

    // 1. Speed Button Integration
    speedButtons.forEach(btn => {
        btn.addEventListener('click', () => {
            speedButtons.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            const val = parseInt(btn.dataset.speed || btn.textContent, 10);
            if (!isNaN(val)) {
                lineIntervalMs = val > 20 ? val : 3500 / val;
            }

            if (isPlaying) {
                stopPrompter();
                startPrompter();
            }
        });
    });

    // 2. Play / Pause Control
    startBtn?.addEventListener('click', () => {
        if (isPlaying) {
            stopPrompter();
        } else {
            startPrompter();
        }
    });

    // 3. Stop Control
    stopBtn?.addEventListener('click', stopPrompter);

    // 4. Repeat / Reset to Top Control
    repeatBtn?.addEventListener('click', () => {
        stopPrompter();
        currentLineIndex = 0;
        if (wrapper) {
            wrapper.scrollTo({
                top: 0,
                behavior: 'smooth'
            });
        }
    });

    // 5. Reset line index when typing or loading new sections
    editArea?.addEventListener('input', () => {
        if (isPlaying) stopPrompter();
        currentLineIndex = 0;
    });

    const originalLoadByIndex = window.loadSectionByIndex;
    if (typeof originalLoadByIndex === 'function') {
        window.loadSectionByIndex = function(index) {
            stopPrompter();
            currentLineIndex = 0;
            originalLoadByIndex(index);
        };
    }
})();
</script>

<script>
(function(){
  'use strict';

  /* =========================
     RAW INSTRUCTIONS TEXT
  ========================= */
  const RAW_TEXT = `
How to use this page...

1. Enter Name and ID.
2. Select a category.
3. Click Start to begin.
4. Write or edit in the text field.
5. Select from the suggested word bank.
6. Click Start to start the Teleprompter Feature.
7. Adjust the speed with the bars numbered 1-5.
8. You can Start, Stop and Repeat the teleprompter text.
9. You can convert your speech to text with STT.
10. You can record your speech with the red Record button.
8. Click Submit to find options to save your work.
9. Copy or download your text.
10. Download your audio.
  `;

  /* =========================
     RAW TEXT PARSER
  ========================= */
  function parseRawInstructions(text){
    const lines = text.split("\n").map(l => l.trim()).filter(Boolean);
    const html = [];

    lines.forEach(line => {
      if(line === "---"){
        html.push(`<hr>`);
        return;
      }
      if(/^\d+\./.test(line)){
        html.push(`<p>${line}</p>`);
        return;
      }
      if(!/[.!?:]$/.test(line)){
        html.push(`<h3>${line}</h3>`);
        return;
      }
      html.push(`<p>${line}</p>`);
    });

    return html.join("");
  }

  /* =========================
     CREATE BUTTON
  ========================= */
  const btn = document.createElement("button");
  btn.id = "instructionsBtn";
  btn.textContent = "Instructions";

  const targetContainer = document.querySelector("footer") || document.body;
  targetContainer.appendChild(btn);

  /* =========================
     CREATE MODAL
  ========================= */
  const root = document.createElement("div");
  root.id = "instructionsRoot";

  root.innerHTML = `
    <div id="instructionsBackdrop"></div>
    <div id="instructionsModal">
      <div id="instructionsHeader">
        <button id="instructionsBack">←</button>
        <span id="instructionsTitle">Instructions</span>
      </div>
      <div id="instructionsContent">
        ${parseRawInstructions(RAW_TEXT)}
      </div>
    </div>
  `;

  document.body.appendChild(root);

  /* =========================
     SCROLL LOCK
  ========================= */
  const modalContent = document.getElementById("instructionsContent");

  modalContent.addEventListener("wheel", e => {
    e.stopPropagation();
  }, { passive: false });

  modalContent.addEventListener("touchmove", e => {
    e.stopPropagation();
  }, { passive: false });

  /* =========================
     OPEN / CLOSE
  ========================= */
  function openModal(){
    root.style.display = "block";
    document.body.style.overflow = "hidden";
    document.documentElement.style.overflow = "hidden";
  }

  function closeModal(){
    root.style.display = "none";
    document.body.style.overflow = "";
    document.documentElement.style.overflow = "";
  }

  btn.onclick = openModal;
  document.getElementById("instructionsBack").onclick = closeModal;
  document.getElementById("instructionsBackdrop").onclick = closeModal;

  document.addEventListener("keydown", e => {
    if(e.key === "Escape") closeModal();
  });

  /* =========================
     DYNAMIC BODY PADDING FOR BUTTON
  ========================= */
  function adjustBodyPadding(){
    const btnHeight = btn.offsetHeight - 25; 
    document.body.style.paddingBottom = `${btnHeight}px`;
  }

  adjustBodyPadding();
  window.addEventListener("resize", adjustBodyPadding);

})();
</script>

<!-- 1. MOBILE TOUCH & GESTURE GUARD -->
<script>
(function() {
  'use strict';
  function preventPinch(e) { if (e.touches.length > 1) e.preventDefault(); }
  let lastTouchTime = 0;
  function preventDoubleTap(e) {
    const now = Date.now();
    if (now - lastTouchTime < 300) e.preventDefault();
    lastTouchTime = now;
  }
  function preventGesture(e) { e.preventDefault(); }

  document.addEventListener('touchstart', preventPinch, { passive: false });
  document.addEventListener('touchend', preventDoubleTap, { passive: false });
  document.addEventListener('gesturestart', preventGesture, { passive: false });
})();
</script>
