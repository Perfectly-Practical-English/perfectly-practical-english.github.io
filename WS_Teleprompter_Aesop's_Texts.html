<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Teleprompter</title>
<script defer src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<style>
:root {
  --bg: #f7fdfb;
  --blue: #1976d2;
  --border-thickness: 10px;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  height: 100%;
  background: var(--bg);
  font-family: Arial, Helvetica, sans-serif;
  color: #222;
  overflow-y: auto;
  overflow-x: hidden;
  scrollbar-width: none;
}

html::-webkit-scrollbar,
body::-webkit-scrollbar {
  display: none;
}

body {
  padding: 50px;
  padding-left: calc(50px + env(safe-area-inset-left));
  padding-right: calc(50px + env(safe-area-inset-right));
  padding-bottom: calc(50px + env(safe-area-inset-bottom));
}

.container {
  max-width: 900px;
  margin: 0 auto;
  padding: 10px 12px 12px;
}

@media (max-width: 700px) {
  body {
    padding: 8px;
    padding-left: calc(8px + env(safe-area-inset-left));
    padding-right: calc(8px + env(safe-area-inset-right));
    padding-bottom: calc(8px + env(safe-area-inset-bottom));
  }

  .container {
    max-width: 100%;
    padding: 10px 8px 8px;
  }
}

.header {
  text-align: center;
  font-size: 20px;
  color: var(--blue);
  font-weight: 700;
  margin-bottom: 3px;
}

.top-bar {
  display: flex;
  gap: 6px;
  flex-wrap: nowrap;
  overflow-x: auto;
  margin-bottom: 6px;
  -webkit-overflow-scrolling: touch;
}

input[type="text"] {
  height: 36px;
  padding: 0 8px;
  border: 1px solid #cfe2f7;
  border-radius: 6px;
  font-size: 14px;
}

#gsName,
#gsId,
#nameField,
#idField {
  flex: 0 0 140px;
  min-width: 80px;
}

button {
  height: 36px;
  padding: 0 10px;
  font-size: 14px;
  background: #1976d2;
  color: #fff;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  transition: 0.12s;
}

button:hover:not(:disabled) {
  background: #1565c0;
}

button:disabled {
  background: #9fbfe4;
  cursor: not-allowed;
}

/* =========================================================
   TEXT PANEL + COLLAPSIBLE QUIZ PANEL
   ========================================================= */

#gsMain {
  display: flex;
  gap: 6px;
  height: 70vh;
  min-height: 360px;
}

#gsWordBank {
  display: none !important;
}

/* ---------- Quiz Toggle Bar ---------- */

.quiz-toggle-bar {
  width: 100%;
  height: 40px;
  margin-top: 10px;
  margin-bottom: 0;
  border: none;
  border-radius: 6px;
  background: #1976d2;
  color: #fff;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  transition: 0.12s;
}

.quiz-toggle-bar:hover {
  background: #1565c0;
}

/* ---------- Hidden Quiz Panel ---------- */

#quizMain {
  display: none;
  gap: 6px;
  height: 70vh;
  min-height: 360px;
  margin-top: 10px;
  flex-direction: column;
}

#quizWrapper {
  width: 100%;
}

/* ---------- Quiz Scroll Area ---------- */

#quizScrollWrapper {
  overflow-y: scroll;
  -webkit-overflow-scrolling: touch;
  flex-grow: 1;
  position: relative;
  scrollbar-width: none;
}

#quizScrollWrapper::-webkit-scrollbar {
  display: none;
}

/* ---------- Quiz Content ---------- */

#quizContentContainer {
  padding: 14px;
  white-space: normal;
  overflow-wrap: break-word;
  word-break: break-word;
}

.tele-wrapper {
  width: 100%;
  height: 100%;
  border: 1px solid #ccc;
  border-radius: 6px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  background: #fff;
  position: relative;
}

#teleScrollWrapper {
  overflow-y: scroll;
  -webkit-overflow-scrolling: touch;
  flex-grow: 1;
  position: relative;
  scrollbar-width: none;
}

#teleScrollWrapper::-webkit-scrollbar {
  display: none;
}

#teleScroll {
  position: relative;
  top: 0;
  transition: top 0.2s linear;
}

/* =========================================================
   STANDARD, CLEAN TELEPROMPTER & TEXT TYPOGRAPHY
   ========================================================= */

.tele-edit,
.tele-edit .line,
.line,
#gsScoreText,
.quiz-container,
#quizContentContainer {
  font-family: Arial, Helvetica, sans-serif !important;
  font-size: 16px !important;
  line-height: 1.6 !important;
  font-weight: normal !important;
  color: #333 !important;
}

.tele-edit {
  padding: 14px !important;
  white-space: pre-wrap !important;
  overflow-wrap: break-word;
  word-break: break-word;
  min-height: 100px;
  outline: none;
}

.tele-edit .line,
.line {
  display: block !important;
  margin: 0 !important;
  padding: 0 !important;
  min-height: 1.6em !important;
  white-space: pre-wrap !important;
  word-break: break-word;
}

.tele-edit.empty::before {
  color: #aaa;
  content: attr(data-placeholder);
  pointer-events: none;
  white-space: pre-wrap;
}

.tele-overlay {
  position: absolute;
  bottom: 12px;
  right: 12px;
  background: rgba(255, 255, 255, 0.95);
  padding: 6px 10px;
  border-radius: 6px;
  font-family: monospace;
  font-size: 12px;
  pointer-events: none;
  z-index: 10;
  user-select: none;
}

/* =========================================================
   MAIN TEXT SCOREBOARD
   ========================================================= */

.scoreboard {
  display: none;
  font-family: monospace;
  font-size: 14px;
  background: #fff;
  border-radius: 6px;
  padding: 12px;
  margin-top: 12px;
  border: 1px solid #ddd;
  max-width: 100%;
  overflow-y: auto;
}

#gsScoreboard {
  display: none;
}

#gsScoreboard .text,
.scoreboard .text {
  white-space: pre-wrap;
  word-break: break-word;
  min-height: 120px;
  border: 1px solid #ccc;
  padding: 8px;
  border-radius: 6px;
  resize: vertical;
}

.controls {
  display: flex;
  gap: 6px;
  margin-top: 8px;
  margin-bottom: 10px;
}

.controls .left {
  display: flex;
  gap: 6px;
}

.controls .right {
  margin-left: auto;
  display: flex;
  gap: 6px;
}

#speechBtn {
  width: 60px;
  height: 36px;
  background: #1976d2;
  border-radius: 6px;
  border: none;
  cursor: pointer;
  color: #fff;
}

#speechBtn.recording {
  background: #e53935;
}

#captureAudioBtn {
  width: 60px;
  height: 36px;
  background: #39FF14;
  border-radius: 6px;
  border: none;
  cursor: pointer;
  color: #000;
}

#captureAudioBtn.recording {
  background: #e53935;
}

.speed-buttons {
  display: flex;
  gap: 4px;
  margin-bottom: 12px;
  flex-wrap: wrap;
}

.speed-buttons button {
  flex: 1 1 auto;
  background: #bbb;
  font-weight: 700;
}

.speed-buttons button.active {
  background: #1976d2;
  color: #fff;
}

#green-border {
  position: fixed;
  inset: 0;
  border: 10px solid #39FF14;
  box-sizing: border-box;
  z-index: 9999;
  pointer-events: none;
  background: transparent;
}

.toast {
  position: fixed;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--blue);
  color: #fff;
  padding: 10px 14px;
  border-radius: 6px;
  display: none;
  z-index: 10000;
}

#copyrightSection {
  margin-top: 10px;
  text-align: left;
  padding: 0;
  font-size: 8px;
}

.formRow {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: nowrap;
  overflow-x: auto;
  margin-bottom: 10px;
}

.formRow button {
  height: 34px;
  line-height: 34px;
}

/* Modal */

.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.45);
  z-index: 5000;
  justify-content: center;
  align-items: center;
}

.modal.show {
  display: flex;
}

.modal-content {
  width: min(500px, 92vw);
  max-height: 80vh;
  overflow-y: auto;
  background: #fff;
  border-radius: 12px;
  padding: 18px;
  box-sizing: border-box;
}

.modal-content h3 {
  margin-bottom: 12px;
  color: #1976d2;
}

#sectionRadioList {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-bottom: 16px;
}

#sectionRadioList label {
  display: flex;
  gap: 10px;
  align-items: flex-start;
  padding: 8px;
  border-radius: 6px;
  cursor: pointer;
}

#sectionRadioList label:hover {
  background: #eef6ff;
}

.modal-buttons {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  margin-top: 15px;
}

.modal-buttons button {
  flex: 1;
}

#sectionWheelContainer {
  height: 34px;
  min-width: 130px;
  max-width: 220px;
  border: 1px solid #bbb;
  border-radius: 8px;
  padding: 0 12px;
  background: #fff;
  display: flex;
  align-items: center;
  flex-wrap: nowrap;
}

#sectionWheelContainer:hover {
  border-color: #999;
}

#sectionWheelContainer:focus-within {
  border-color: #4a90e2;
  box-shadow: 0 0 0 2px rgba(74, 144, 226, 0.2);
}

#sectionWheelContainer .wheel {
  width: 100%;
  min-width: 250px;
  max-width: 100%;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  line-height: 1;
  display: flex;
  align-items: center;
  font-size: 12px;
}

#sectionWheelContainer .wheel.placeholder {
  color: #aaa;
  font-style: italic;
}

/* States & Highlights */

.reading-active {
  background-color: #ffff00 !important;
  scroll-margin-top: 120px;
  transition: background-color 0.4s ease;
}

.highlight {
  background-color: #ffff00;
  color: #000000;
}

.word {
  cursor: pointer;
  color: inherit;
}

.word:hover {
  background-color: rgba(26, 115, 232, 0.2);
}

.sentence {
  font-size: 14px;
  line-height: 1.4;
  color: #333;
}

body.teleprompter-mode #openSectionModal {
  display: none !important;
}

.question-text {
  margin-top: -5px;
}

.question-text:focus {
  outline: none;
  box-shadow: none;
}

/* =========================================================
   NORMALIZED & READABLE QUIZ SECTION STYLING
   ========================================================= */

#quizSections {
  width: 100%;
  margin: 0;
  padding: 12px;
  box-sizing: border-box;
  background: #ffffff !important;
  border-radius: 6px;
  border: 1px solid #ccc;
  font-family: Arial, Helvetica, sans-serif;
  color: #333;
  white-space: normal;
}

#quizSections .exercise {
  margin-bottom: 12px;
  padding: 0;
  background: none;
  border: none;
}

#quizSections .exercise p {
  font-size: 15px;
  font-weight: 400 !important;
  color: #111;
  margin: 0 0 6px;
  line-height: 1.5;
  white-space: normal;
}

#quizSections label {
  display: flex;
  align-items: center;
  gap: 6px;
  margin: 0 0 6px;
  cursor: pointer;
  font-size: 14px;
  line-height: 1.5;
  white-space: normal;
}

/* ---------- Legacy Quiz Scoreboard ---------- */

.quiz-scoreboard {
  width: 100%;
  box-sizing: border-box;
  margin: 8px 0 12px;
  padding: 6px;
  border: 1px solid #9aaed1;
  border-radius: 6px;
  background: #f9f9f9;
  font-family: monospace;
  font-size: 12px;
}

.scoreboard-data {
  margin: 0;
  white-space: pre-wrap;
  word-break: break-word;
}

.scoreboard-buttons {
  margin-top: 6px;
  display: flex;
  gap: 6px;
}

/*
   Do NOT use [class*="quiz"] here.
   It also matches .quiz-mania-scoreboard.
*/

.quiz,
.quiz-container {
  margin: 0;
  padding: 0;
}

.section-title {
  font-weight: bold;
  margin-bottom: 2px;
}

.export-render-canvas {
  background: #fff;
  color: #000;
  padding: 20px;
  font-family: monospace;
  font-size: 16px;
  line-height: 1.4;
  white-space: pre-wrap;
  position: absolute;
  left: -99999px;
  top: 0;
  width: 900px;
  box-sizing: border-box;
}

.toast {
  display: none;
}

.toast.show {
  display: block;
}

.speech-unsupported {
  opacity: 0.6;
  pointer-events: none;
}

.quiz-export-wrapper {
  white-space: pre-wrap;
  font-family: monospace;
  padding: 15px;
  background-color: #fff;
  color: #000;
  position: fixed;
  left: -9999px;
  top: 0;
  width: 900px;
  box-sizing: border-box;
}

/* =========================================
   INSTRUCTIONS MODAL & BUTTON STYLES
   ========================================= */

#instructionsBtn {
  position: relative;
  display: inline-block;
  margin: 20px auto 10px;
  padding: 10px 16px;
  background: #2e8b57;
  color: #fff;
  border: none;
  border-radius: 6px;
  font-weight: 600;
  cursor: pointer;
  box-shadow: 0 4px 8px rgba(0, 0, 0, 0.6);
  z-index: 99998;
}

#instructionsBtn:hover {
  background: #257047;
}

#instructionsRoot {
  position: fixed;
  inset: 0;
  display: none;
  z-index: 99999;
}

#instructionsBackdrop {
  position: absolute;
  inset: 0;
  background: rgba(0, 0, 0, 0.35);
}

#instructionsModal {
  position: absolute;
  top: 25px;
  left: 50%;
  transform: translateX(-50%);
  width: min(650px, 90vw);
  max-height: 90vh;
  background: #fff;
  border-radius: 10px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

#instructionsHeader {
  padding: 12px 16px;
  border-bottom: 1px solid #ddd;
  display: flex;
  align-items: center;
  gap: 10px;
}

#instructionsTitle {
  color: #1976d2;
  font-weight: 600;
  font-size: 1.1em;
}

#instructionsBack {
  border: none;
  background: none;
  font-size: 20px;
  cursor: pointer;
  color: #1976d2;
  font-weight: 600;
}

#instructionsContent {
  padding: 2px 18px 18px;
  overflow-y: auto;
  line-height: 1.6;
  scrollbar-width: none;
  -ms-overflow-style: none;
}

#instructionsContent::-webkit-scrollbar {
  display: none;
}

#instructionsContent h3 {
  color: #1976d2;
  margin: 12px 0 4px;
  font-weight: 600;
}

#instructionsContent p {
  margin: 4px 0;
}

#instructionsContent hr {
  margin: 12px 0;
}

.png-export-wrapper {
  white-space: pre-wrap;
  font-family: monospace;
  padding: 10px;
  background-color: #fff;
  color: #000;
}

/* =========================================
   QUIZ COMPONENT STYLES
   ========================================= */

.editable-text-zone {
  outline: none;
}

.quiz-wrapper {
  margin-top: 25px;
  border-top: 2px dashed #ccc;
  padding-top: 15px;
}

.quiz-toggle-btn {
  padding: 6px 14px;
  cursor: pointer;
  background: #007bff;
  color: white;
  border: none;
  border-radius: 4px;
  font-weight: bold;
  margin-bottom: 12px;
}

.quiz-toggle-btn.active {
  background: #6c757d;
}

.quiz-content-container {
  display: block;
  background: transparent;
  padding: 0;
  border: none;
  border-radius: 0;
  font-family: Arial, Helvetica, sans-serif !important;
  font-size: 16px !important;
  line-height: 1.6 !important;
  white-space: pre-wrap !important;
}

.quiz-line-item {
  display: block !important;
  margin: 0 !important;
  padding: 0 !important;
  font-family: Arial, Helvetica, sans-serif !important;
  font-size: 16px !important;
  line-height: 1.6 !important;
  font-weight: normal !important;
  color: #333 !important;
  min-height: 1.6em !important;
  white-space: pre-wrap !important;
  word-break: break-word !important;
}

.quiz-sections-container {
  display: block;
  background: rgba(0, 0, 0, 0.02);
  padding: 12px;
  border-radius: 6px;
  border: 1px solid #e0e0e0;
}

.quiz-top-controls {
  margin-bottom: 10px;
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}

.quiz-id-input {
  padding: 4px;
  border: 1px solid #ccc;
  border-radius: 4px;
}

.quiz-submit-btn {
  padding: 4px 10px;
  cursor: pointer;
}

.quiz-blank-line {
  min-height: 1.6em !important;
}

.quiz-exercise {
  margin-bottom: 4px !important;
}

.quiz-question-title {
  margin: 0 0 1px !important;
  line-height: 1 !important;
}

.quiz-option-label {
  margin: 0 0 1px 10px !important;
  line-height: 1 !important;
  display: block;
}

/* =========================================
   SPEECH & HIGHLIGHT STYLES
   ========================================= */

.reading-active {
  background-color: #fff9c4 !important;
  transition: background-color 0.4s ease;
}

.speech-emoji-btn {
  all: unset;
  cursor: pointer;
  font-size: 14px;
  display: inline;
  margin: 0;
  padding: 0;
  line-height: 1;
  vertical-align: baseline;
}

.mc-emoji {
  margin-left: 8px;
}

/* =========================================================
   MC QUIZ MANIA — SEPARATE SCOREBOARD
   ========================================================= */

.quiz-mania-controls {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 8px 0;
}

.quiz-mania-id {
  width: 180px;
  box-sizing: border-box;
  padding: 6px 8px;
}

.quiz-mania-controls button,
.quiz-mania-buttons button {
  height: 36px !important;
  padding: 0 10px !important;
  font-size: 14px !important;
  font-family: Arial, Helvetica, sans-serif !important;
  font-weight: normal !important;
  line-height: normal !important;
  background: #1976d2 !important;
  color: #fff !important;
  border: none !important;
  border-radius: 6px !important;
  cursor: pointer !important;
  transition: 0.12s !important;
  box-sizing: border-box !important;
}

.quiz-mania-controls button:hover,
.quiz-mania-buttons button:hover {
  background: #1565c0 !important;
}

/* ---------- MC Quiz Scoreboard ---------- */

.quiz-mania-scoreboard {
  display: none;
  width: 100%;
  box-sizing: border-box;
  margin: 8px 0 12px;
  padding: 10px;
  border: 1px solid #9aaed1;
  border-radius: 6px;
  background: #f9f9f9;
  font-family: monospace;
  font-size: 14px;
}

.quiz-mania-score-text {
  display: block;
  width: 100%;
  margin: 0 0 8px;
  padding: 10px;
  white-space: pre-wrap;
  overflow-wrap: break-word;
  word-break: break-word;
  font-family: monospace;
  font-size: 14px;
  line-height: 1.4;
  background: #fff;
  color: #000;
  border: 1px solid #ccc;
  border-radius: 6px;
}

.quiz-mania-buttons {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 6px;
}
</style>

</head>
<body>

<div id="green-border"></div>

<div id="layout">
  <div class="container">

    <!-- TOP BAR -->
    <div class="top-bar">
      <input id="gsId" type="text" placeholder="ID">

      <!-- Section Button -->
      <button id="openSectionModal" type="button">Section</button>
    </div>

    <!-- SECTION SELECTION MODAL -->
    <div id="sectionModal" class="modal">
      <div class="modal-content" style="position: relative;">

        <h3>Select a Section</h3>

        <div id="sectionRadioList"></div>

        <div class="modal-buttons">
          <button id="cancelSectionModal" type="button">
            Cancel
          </button>

          <button id="confirmSectionSelection" type="button">
            Load Section
          </button>
        </div>

      </div>
    </div>

    <!-- PLAYBACK CONTROLS & SPEED BUTTONS -->
    <div class="formRow">

      <button id="startBtn">Start</button>
      <button id="stopBtn">Stop</button>
      <button id="repeatBtn">Repeat</button>

      <div
        class="speed-buttons"
        role="tablist"
        aria-label="Speed"
        style="display:inline-flex; gap:4px; margin:0; vertical-align:middle;">

        <button data-speed="4000">Slow</button>
        <button data-speed="3000" class="active">Medium</button>
        <button data-speed="2000">Fast</button>

      </div>

    </div>

    <!-- RECORDING & UTILITY CONTROLS -->
    <div class="formRow">

      <button id="highlightBtn" title="Toggle Highlight">
        Highlight
      </button>

<button id="teleCopyBtn" type="button" title="Copy Selected Text">Copy</button>

      <button id="SpeeaudioBtn" title="Play Audio">
        Audio
      </button>

<button id="sttBtn" title="Start/Stop speech">STT</button>

      <button id="captureAudioBtn" title="Start/Stop audio">
        🔴
      </button>

      <button id="submitBtn" disabled>
        Submit
      </button>

    </div>

    <!-- =====================================================
         TEXT PANEL
         ===================================================== -->
    <div id="gsMain">

      <div id="teleWrapper" class="tele-wrapper">

        <div id="teleScrollWrapper">

          <div id="teleScroll">

            <div
              id="teleEdit"
              class="tele-edit question-text"
              contenteditable="true"
              data-placeholder="Type or paste your text here..."></div>

          </div>

        </div>

      </div>

    </div>

    <!-- TEXT METRICS -->
    <div class="tele-overlay" id="teleOverlay">
      0 chars · 0 sent · Changed: 0%
    </div>

    <!-- =====================================================
         QUIZ TOGGLE BAR
         ===================================================== -->
    <button id="quizToggleBar" class="quiz-toggle-bar" type="button">
      ▼ Show Quiz
    </button>

    <!-- =====================================================
         QUIZ PANEL (Hidden Until Toggle)

  // --- LOAD RAW TEXT FOR EDITOR ---
  // Target both class="rawText" and id="rawText" to ensure compatibility
  const editorScripts = document.querySelectorAll('script[type="text/plain"].rawText, script[type="text/plain"]#rawText');

    const readingText = await resolveRaw(parts[0]);
    
    if (teleEdit) {

    if (parts[1] && typeof window.parseQuiz === 'function') {

  const wordScripts = document.querySelectorAll('script[type="text/plain"].wordBank');

    function sanitizeFilename(name) {
        return name.trim()
            .replace(/[\\/:*?"<>|]+/g, '_')
            .replace(/[\r\n]+/g, '_')
            .slice(0, 200) || 'score';
    }

    function downloadBlob(blob, filename) {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        setTimeout(() => {
            URL.revokeObjectURL(a.href);
            a.remove();
        }, 2000);
    }

    async function downloadScoreAsPNG(text, filename) {
        const wrapper = document.createElement('div');
        wrapper.className = 'png-export-wrapper';
        wrapper.innerHTML = text.replace(/\n/g, '<br>');
        document.body.appendChild(wrapper);

        try {
            const canvas = await html2canvas(wrapper, { scale: 2, backgroundColor: '#fff' });
            const blob = await new Promise(res => canvas.toBlob(res, 'image/png'));
            downloadBlob(blob, filename);
        } catch (err) {
            console.error(err);
            alert('PNG download failed');
        } finally {
            wrapper.remove();
        }
    }

    function hijackDownloadButton(originalBtn, getScoreText, getFilename, isText) {
        if (!originalBtn) return;
        const newBtn = originalBtn.cloneNode(true);
        originalBtn.parentNode.replaceChild(newBtn, originalBtn);

        newBtn.addEventListener('click', async e => {
            e.preventDefault();
            e.stopImmediatePropagation();

            const scoreText = getScoreText();
            if (!scoreText) {
                alert('No scoreboard data found. Submit first.');
                return;
            }

            const filename = sanitizeFilename(getFilename());
            if (isText) {
                downloadBlob(new Blob([scoreText], { type: 'text/plain' }), filename + '.txt');
            } else {
                await downloadScoreAsPNG(scoreText, filename + '.png');

        }, true);

        });

    // ==========================================

    if (captureAudioBtn) {
        captureAudioBtn.addEventListener('click', async () => {
            if (!mediaRecorder || mediaRecorder.state === 'inactive') {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];

                    mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
                    mediaRecorder.onstop = () => {
                        audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                        if (downloadBlobBtn) downloadBlobBtn.disabled = false;
                        if (copyBlobBtn) copyBlobBtn.disabled = false;
                    };

                    mediaRecorder.start();
                    captureAudioBtn.textContent = 'Stop Recording';
                    captureAudioBtn.classList.add('recording');
                } catch (err) {
                    alert('Microphone access denied or unavailable.');
                }
            } else if (mediaRecorder && mediaRecorder.state === 'recording') {
                mediaRecorder.stop();
                captureAudioBtn.textContent = 'Record Audio';
                captureAudioBtn.classList.remove('recording');
            }
        });
    }

    if (downloadBlobBtn) {
        downloadBlobBtn.addEventListener('click', () => {
            if (!audioBlob) return;
            const url = URL.createObjectURL(audioBlob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'recorded-audio.webm';
            a.click();
            URL.revokeObjectURL(url);
        });
    }

if (copyBlobBtn) {
        copyBlobBtn.addEventListener('click', async () => {
            if (!audioBlob) return;
            try {
                await navigator.clipboard.write([new ClipboardItem({ 'audio/webm': audioBlob })]);
                alert('Audio recording copied to clipboard!');
            } catch (err) {
                alert('Failed to copy audio to clipboard.');
            }
        });
    }

<script>
(function() {
    'use strict';

    /* =========================================================
       1. MAIN TEXT & WORD HELPERS
       ========================================================= */

    if (typeof window.getWordSet === 'undefined') {
        window.getWordSet = function(str) {
            if (!str) return new Set();
            const words = str.toLowerCase().match(/[\wÀ-ÿ'-]+/g) || [];
            return new Set(words);
        };
    }

    if (typeof window.cleanSectionText === 'undefined') {
        window.cleanSectionText = function(str) {
            if (!str) return "";

            let working = str;

            const first = working.indexOf('~');
            const last = working.lastIndexOf('~');

            if (first !== -1 && last !== -1 && last > first) {
                working = working.slice(first + 1, last);
            }

            const lines = working.split(/\r?\n/);
            const validLines = [];

            for (let line of lines) {
                const trimmed = line.trim();

                if (trimmed === 'QUIZ' || trimmed === 'Quiz') {
                    break;
                }

                validLines.push(line);
            }

            return validLines.join('\n');
        };
    }

    if (typeof window.calculateFastChangePercentage === 'undefined') {
        window.calculateFastChangePercentage = function(original, current) {

            const cleanOrig = window.cleanSectionText(original);
            const cleanCurr = window.cleanSectionText(current);

            const origWords =
                cleanOrig.toLowerCase().match(/[\wÀ-ÿ'-]+/g) || [];

            const currWords =
                cleanCurr.toLowerCase().match(/[\wÀ-ÿ'-]+/g) || [];

            if (origWords.length === 0) {
                return currWords.length > 0 ? 100 : 0;
            }

            const origMap = {};

            origWords.forEach(w => {
                origMap[w] = (origMap[w] || 0) + 1;
            });

            let matches = 0;

            currWords.forEach(w => {
                if (origMap[w] && origMap[w] > 0) {
                    matches++;
                    origMap[w]--;
                }
            });

            const maxLen =
                Math.max(origWords.length, currWords.length);

            const similarity =
                matches / maxLen;

            return Math.max(
                0,
                Math.min(
                    100,
                    Math.round((1 - similarity) * 100)
                )
            );
        };
    }


    /* =========================================================
       2. OVERLAY UPDATER
       ========================================================= */

    window.updateOverlay = function() {

        const teleEdit =
            document.getElementById('teleEdit');

        const teleOverlay =
            document.getElementById('teleOverlay');

        if (!teleEdit) return;

        const editableZone =
            document.getElementById('editableTextZone');

        let rawText = "";

        if (editableZone) {

            const lineDivs =
                editableZone.querySelectorAll('.line, p');

            if (lineDivs.length > 0) {

                const lineTexts =
                    Array.from(lineDivs).map(div => {

                        return div.innerHTML === '&nbsp;'
                            ? ''
                            : div.textContent;
                    });

                rawText =
                    lineTexts.join('\n');

            } else {

                rawText =
                    editableZone.innerText || '';
            }

        } else {

            rawText =
                teleEdit.innerText || '';
        }

        const cleanActiveText =
            typeof window.cleanSectionText === 'function'
                ? window.cleanSectionText(rawText)
                : rawText;

        const s =
            (cleanActiveText.match(/[.!?]+/g) || []).length;

        const charCount =
            cleanActiveText.length;

        let originalBaselineText = "";
        let currentChangeRate = 0;

        if (
            window.SCRAMBLE_SECTIONS &&
            typeof selectedSectionIndex !== 'undefined' &&
            window.SCRAMBLE_SECTIONS[selectedSectionIndex]
        ) {

            originalBaselineText =
                window.SCRAMBLE_SECTIONS[
                    selectedSectionIndex
                ].text || "";

        } else if (window._currentOriginalBaseline) {

            originalBaselineText =
                window._currentOriginalBaseline;
        }

        if (
            originalBaselineText &&
            typeof window.calculateFastChangePercentage === 'function'
        ) {

            currentChangeRate =
                window.calculateFastChangePercentage(
                    originalBaselineText,
                    cleanActiveText
                );
        }

        if (teleOverlay) {

            teleOverlay.textContent =
                `${charCount} chars · ${s} sent · Changed: ${currentChangeRate}%`;
        }
    };


/* =========================================================
   3. QUIZ BUILDER
   
   IMPORTANT:
   The section is NOT selected here.

   The existing main section selector selects the section.
   That section's text is passed into this function.
   This function only extracts the QUIZ portion of that
   already-selected section and places it into
   #quizContentContainer.
   ========================================================= */

window.loadQuizSection = function(sectionText) {

    if (!sectionText) return;

    const quizMain =
        document.getElementById('quizMain');

    const quizContentContainer =
        document.getElementById('quizContentContainer');

    if (
        !quizMain ||
        !quizContentContainer
    ) {
        return;
    }

    let fullText =
        sectionText;

    const first =
        sectionText.indexOf('~');

    const last =
        sectionText.lastIndexOf('~');

    if (
        first !== -1 &&
        last !== -1 &&
        last > first
    ) {

        fullText =
            sectionText.slice(
                first + 1,
                last
            );
    }

    /*
     * Save the selected section's original text
     * for the text-change calculation.
     */
    window._currentOriginalBaseline =
        window.cleanSectionText(fullText);


    /* -----------------------------------------------------
       FIND THE QUIZ PORTION OF THIS SELECTED SECTION
       ----------------------------------------------------- */

    const lines =
        fullText.split(/\r?\n/);

    let quizPart = "";
    let quizStartIndex = -1;

    for (
        let i = 0;
        i < lines.length;
        i++
    ) {

        const trimmed =
            lines[i].trim();

        if (
            trimmed === 'QUIZ' ||
            trimmed === 'Quiz'
        ) {

            quizStartIndex =
                i;

            break;
        }
    }

    if (quizStartIndex !== -1) {

        quizPart =
            lines
                .slice(quizStartIndex)
                .join('\n');
    }


    /* -----------------------------------------------------
       NO QUIZ IN THIS SELECTED SECTION
       ----------------------------------------------------- */

    if (!quizPart) {

        quizContentContainer.innerHTML =
            '<p style="padding: 10px; color: #888;">No quiz available for this section.</p>';

        return;
    }


    /* -----------------------------------------------------
       CLEAR ONLY THE QUIZ CONTENT

       Do NOT clear #quizMain.
       Do NOT destroy the quiz wrapper or scroll wrapper.
       ----------------------------------------------------- */

    quizContentContainer.innerHTML = '';


    /* -----------------------------------------------------
       PARSE QUIZ SUBSECTIONS
       ----------------------------------------------------- */

    const rawQuizLines =
        quizPart.split(/\r?\n/);

    let subSectionsData = [];
    let currentSub = null;

    const SUBSECTION_MARKERS = [
        "Quiz",
        "Concept Quiz",
        "Context Quiz",
        "Comprehension Quiz",
        "Grammar Quiz",
        "Vocabulary Quiz"
    ];

    rawQuizLines.forEach(line => {

        const trimmed =
            line.trim();

        if (
            SUBSECTION_MARKERS.some(
                marker =>
                    trimmed
                        .toLowerCase()
                        .startsWith(
                            marker.toLowerCase()
                        )
            )
        ) {

            currentSub = {
                title: trimmed,
                questions: []
            };

            subSectionsData.push(
                currentSub
            );

        } else if (currentSub) {

            currentSub.questions.push(
                line
            );
        }
    });


    /* -----------------------------------------------------
       FALLBACK IF NO SUBSECTION HEADER WAS FOUND
       ----------------------------------------------------- */

    if (
        subSectionsData.length === 0 &&
        rawQuizLines.length > 0
    ) {

        currentSub = {
            title: 'Comprehension Quiz',
            questions: rawQuizLines
        };

        subSectionsData.push(
            currentSub
        );
    }


    /* -----------------------------------------------------
       BUILD QUIZ HTML
       ----------------------------------------------------- */

    let allSubSectionsHTML = '';
    let qIndex = 0;

    subSectionsData.forEach(sub => {

        const slug =
            sub.title
                .toLowerCase()
                .replace(/\s+/g, '-')
                .replace(/[^\w-]/g, '');

        sub.slug =
            slug;

        let subHTML =
            `<h3 class="parsedSubheader">${sub.title}</h3>`;

        subHTML +=
            `<div class="quiz-subsection" data-subsection="${sub.title}" data-sub-slug="${slug}">`;


        /* -------------------------------------------------
           QUIZ CONTROLS / SCOREBOARD
           ------------------------------------------------- */

        subHTML += `
            <div class="quiz-mania-controls">
                <input
                    type="text"
                    class="quiz-mania-id"
                    placeholder="Student ID"
                    autocomplete="off"
                >

                <button
                    type="button"
                    class="quiz-submit"
                >
                    Submit
                </button>
            </div>

            <div
                class="quiz-mania-scoreboard"
                style="display:none;"
            >
                <pre class="quiz-mania-score-text"></pre>

                <div class="quiz-mania-buttons">
                    <button
                        type="button"
                        class="quiz-mania-copy"
                    >
                        Copy
                    </button>

                    <button
                        type="button"
                        class="quiz-mania-txt"
                    >
                        TXT
                    </button>

                    <button
                        type="button"
                        class="quiz-mania-png"
                    >
                        PNG
                    </button>
                </div>
            </div>
        `;


        /* -------------------------------------------------
           QUESTIONS
           ------------------------------------------------- */

        for (
            let i = 0;
            i < sub.questions.length;
            i++
        ) {

            let line =
                sub.questions[i];


            /* Blank line */

            if (
                line.trim() === ''
            ) {

                subHTML +=
                    `<div class="line quiz-blank-line">&nbsp;</div>`;

                continue;
            }


            /* Only lines beginning with ? are questions */

            if (
                !line.trim().startsWith('?')
            ) {
                continue;
            }


            /* Question text */

            let question =
                line
                    .trim()
                    .replace(
                        /^\?\s*/,
                        ''
                    );


            /* Optional continuation line beginning with - */

            if (
                i + 1 < sub.questions.length &&
                sub.questions[
                    i + 1
                ]
                    .trim()
                    .startsWith('-')
            ) {

                question +=
                    ' ' +
                    sub.questions[
                        i + 1
                    ]
                        .trim()
                        .replace(
                            /^-+\s*/,
                            ''
                        );

                i++;
            }


            /* Answer options */

            const options = [];

            let j =
                i + 1;

            while (
                j < sub.questions.length &&
                sub.questions[j].trim() !== '' &&
                !sub.questions[j].trim().startsWith('?')
            ) {

                options.push(
                    sub.questions[j]
                );

                j++;
            }


            /* Correct answer */

            const correctPipe =
                options
                    .filter(
                        o =>
                            /\|.*?\|/.test(o)
                    )
                    .map(
                        o =>
                            o
                                .replace(/\|/g, '')
                                .trim()
                    )
                    .join('|');


            /* Question container */

            subHTML +=
                `<div class="exercise quiz-exercise" data-correct="${correctPipe}">`;


            subHTML +=
                `<p class="quiz-question-title"><strong>${qIndex + 1}. ${question}</strong></p>`;


            subHTML +=
                `<div class="quiz-options-group">`;


            /* Options */

            options.forEach(
                (opt, oi) => {

                    const clean =
                        opt
                            .replace(/\|/g, '')
                            .trim();

                    const isCorrectOption =
                        /\|.*?\|/.test(opt);

                    subHTML += `
                        <label
                            class="quiz-option-label"
                            data-is-correct="${isCorrectOption}"
                        >
                            <input
                                type="radio"
                                name="q_${slug}_${qIndex}"
                                value="${clean.replace(/"/g, '&quot;')}"
                                data-correct="${correctPipe}"
                            >

                            <span class="option-text">
                                ${String.fromCharCode(65 + oi)}) ${clean}
                            </span>
                        </label>
                    `;
                }
            );


            subHTML +=
                `</div>`;


            subHTML +=
                `<div class="quiz-feedback-box" style="display:none; font-size:0.9em; margin-top:5px;"></div>`;


            subHTML +=
                `</div>`;


            qIndex++;

            i =
                j - 1;
        }


        subHTML +=
            `</div>`;

        allSubSectionsHTML +=
            subHTML;
    });


    /* -----------------------------------------------------
       PUT QUIZ INTO THE EXISTING QUIZ CONTENT CONTAINER
       ----------------------------------------------------- */

    quizContentContainer.innerHTML =
        allSubSectionsHTML;
};
    /* =========================================================

           This ONLY shows/hides the quiz belonging to the

        document.addEventListener(
            'click',
            (e) => {

                const quizToggleBar =

                    return;
                }

                const quizMain =
                    document.getElementById(
                        'quizMain'
                    );

                if (!quizMain) {
                    return;
                }

                const computedStyle =
                    window.getComputedStyle(
                        quizMain
                    );

                const isVisible =
                    computedStyle.display !== 'none';


                if (isVisible) {

                    quizMain.style.setProperty(
                        'display',
                        'none',
                        'important'
                    );

                    quizToggleBar.classList.remove(
                        'active'
                    );

                    quizToggleBar.textContent =
                        '▼ Show Quiz';

                } else {

                    /*
                     * #quizMain is a flex container in the
                     * existing CSS, so restore it as flex.
                     */
                    quizMain.style.setProperty(
                        'display',
                        'flex',
                        'important'
                    );

                    quizToggleBar.classList.add(
                        'active'
                    );

                    quizToggleBar.textContent =
                        '▲ Hide Quiz';
                }
            }
        );


        /* -----------------------------------------------------
           TELEEDIT & METRICS LISTENERS
           ----------------------------------------------------- */

        const teleEditEl =
            document.getElementById(
                'teleEdit'
            );

        if (teleEditEl) {

            teleEditEl.addEventListener(
                'input',
                () => {
                    window.updateOverlay();
                }
            );


            teleEditEl.addEventListener(
                'keydown',
                (e) => {

                    if (e.key !== 'Enter') {
                        return;
                    }

                    const sel =
                        window.getSelection();

                    if (
                        !sel ||
                        sel.rangeCount === 0
                    ) {
                        return;
                    }

                    let node =
                        sel.anchorNode;

                    let inEditable =
                        false;

                    while (
                        node &&
                        node !== teleEditEl
                    ) {

                        if (
                            node &&
                            (
                                node.id ===
                                'editableTextZone' ||

                                node.classList?.contains(
                                    'editable'
                                )
                            )
                        ) {

                            inEditable =
                                true;

                            break;
                        }

                        node =
                            node
                                ? node.parentNode
                                : null;
                    }


                    if (
                        inEditable ||
                        teleEditEl.id === 'teleEdit'
                    ) {

                        e.preventDefault();

                        const range =
                            sel.getRangeAt(0);

                        range.deleteContents();


                        const newP =
                            document.createElement(
                                'p'
                            );

                        newP.className =
                            'line';

                        newP.innerHTML =
                            '&nbsp;';


                        range.insertNode(
                            newP
                        );

                        range.setStartAfter(
                            newP
                        );

                        range.collapse(
                            true
                        );

                        sel.removeAllRanges();

                        sel.addRange(
                            range
                        );

                        window.updateOverlay();
                    }
                }
            );
        }


        /* -----------------------------------------------------
           IMPORTANT:
           Section selection is handled elsewhere.

           There is NO hard-coded section list here.
           There is NO sampleSections array here.
           There is NO second section selector here.
           ----------------------------------------------------- */


        /* -----------------------------------------------------
           SPEED BUTTONS
           ----------------------------------------------------- */

        const speedButtons =
            document.querySelectorAll(
                '.speed-buttons button'
            );

        if (speedButtons) {

            speedButtons.forEach(
                btn => {

                    btn.addEventListener(
                        'click',
                        () => {

                            speedButtons.forEach(
                                b =>
                                    b.classList.remove(
                                        'active'
                                    )
                            );

                            btn.classList.add(
                                'active'
                            );
                        }
                    );
                }
            );
        }


        /* -----------------------------------------------------
           COPY BUTTON TOAST
           ----------------------------------------------------- */

        function showToast(
            message = 'Copied'
        ) {

            const toast =
                document.getElementById(
                    'toast'
                );

            if (!toast) {
                return;
            }

            toast.textContent =
                message;

            toast.classList.add(
                'show'
            );

            setTimeout(
                () => {
                    toast.classList.remove(
                        'show'
                    );
                },
                2000
            );
        }


        const copyBtn =
            document.getElementById(
                'copyBtn'
            );

        const teleEdit =
            document.getElementById(
                'teleEdit'
            );

        if (
            copyBtn &&
            teleEdit
        ) {

            copyBtn.addEventListener(
                'click',
                () => {

                    navigator.clipboard
                        .writeText(
                            teleEdit.innerText
                        )
                        .then(
                            () => {
                                showToast(
                                    'Text Copied!'
                                );
                            }
                        );
                }
            );
        }


        /* -----------------------------------------------------
           INITIAL OVERLAY
           ----------------------------------------------------- */

        window.updateOverlay();
    }


    /* =========================================================
       START APP
       ========================================================= */

    if (
        document.readyState ===
        'loading'
    ) {

        document.addEventListener(
            'DOMContentLoaded',
            initApp
        );

    } else {

        initApp();
    }


    /* =========================================================
       GLOBAL CUSTOM EVENT HOOK

       The EXISTING section loader sends the selected section's
       text here.

       This quiz module then extracts the QUIZ from that same
       section.

       It does NOT select a section.

window.addEventListener(
    'textSectionLoaded',
    function(e) {

            // Keep the exact raw section text

            window.currentRawSectionText =
                e.detail.sectionText;

            window.loadQuizSection(
                e.detail.sectionText
            );
        }
    }
);

})();



</script>

<script>
(function() {
    'use strict';
    const RAW_STUDENT_DATA = `
        55555|David
        55551|Matthew
        12345|Sarah
    `;
    const studentDatabase = new Map();
    RAW_STUDENT_DATA.trim().split('\n').forEach(line => {
        const [id, name] = line.split('|').map(s => s ? s.trim() : '');
        if (id && name) studentDatabase.set(id, name);

    window.resolveStudentNameFromId = function(idInput) {
        if (!idInput) return "Student";
        const trimmed = String(idInput).trim();
        if (/^(x|g|guest)$/i.test(trimmed)) {
            return "Guest";
        }
        return studentDatabase.get(trimmed) || "Student";
    };
})();

<script>
(function primeFemaleVoiceOnce() {
    const synth = window.speechSynthesis;
    if (!synth) return;
    let primed = false;

    function tryPrime() {
        if (primed) return;
        const voices = synth.getVoices();
        if (!voices.length) return;

        const femaleVoice =
            voices.find(v => /Aria|Zira|Samantha|Victoria|Moira/i.test(v.name)) ||
            voices.find(v => v.lang && v.lang.startsWith("en")) ||
            voices[0];

        if (!femaleVoice) return;

        const u = new SpeechSynthesisUtterance(" ");
        u.voice = femaleVoice;
        u.volume = 0;
        u.rate = 1;
        u.pitch = 1;

        synth.speak(u);
        primed = true;
    }

    tryPrime();
    synth.onvoiceschanged = tryPrime;
    document.addEventListener("pointerdown", tryPrime, { once: true });
})();

(function () {
    function cleanSpeechText(text) {
        text = text.replace(/\b\d+:\d+\s*/g, '');
        text = text.replace(/<br\s*\/?>/gi, ' ');
        text = text.replace(/\n+/g, ' ');
        text = text.replace(/\s+\./g, '.');
        text = text.replace(/\.(\S)/g, '. $1');
        text = text.replace(/\s+/g, ' ').trim();
        return text;
    }

    const OriginalUtterance = window.SpeechSynthesisUtterance;
    function PatchedUtterance(text) {
        return new OriginalUtterance(cleanSpeechText(text));
    }
    PatchedUtterance.prototype = OriginalUtterance.prototype;
    window.SpeechSynthesisUtterance = PatchedUtterance;
})();
</script>

<!-- =========================================================
     [2] HIGHLIGHT, READ-ALOUD & EMOJI OVERLAYS
     ========================================================= -->
<script>
(function() {
    const synth = window.speechSynthesis;
    let teacherVoice = null;
    let studentVoice = null;

    function loadVoices() {
        const voices = synth.getVoices();
        if (!voices.length) return;

        teacherVoice =
            voices.find(v => v.name.includes("Zira")) ||
            voices.find(v => v.name === "Microsoft Zira" && v.lang === "en-US") ||
            voices.find(v => v.name.includes("Samantha")) ||
            voices.find(v => v.lang.startsWith("en") && v.name.toLowerCase().includes("female")) ||
            voices[0];

        studentVoice =
            voices.find(v => v.name.includes("Aria")) ||
            voices.find(v => v.name === "Microsoft Aria" && v.lang.startsWith("en-GB")) ||
            voices.find(v => v.name.includes("Victoria")) ||
            voices.find(v => v.lang.startsWith("en") && v.name.toLowerCase().includes("female")) ||
            voices[0];
    }

    synth.onvoiceschanged = loadVoices;
    loadVoices();

    // Single-Button Highlight / De-Highlight Toggle
    const highlightBtn = document.getElementById("highlightBtn") || document.getElementById("highlightSelected");
    const editor = document.getElementById("teleEdit");

    highlightBtn?.addEventListener("mousedown", (e) => {
        e.preventDefault();
    });

    highlightBtn?.addEventListener("click", () => {
        const sel = window.getSelection();
        if (!sel.rangeCount || sel.isCollapsed) return;

        const range = sel.getRangeAt(0);
        if (editor && !editor.contains(range.commonAncestorContainer)) return;

        let container = range.commonAncestorContainer;
        if (container.nodeType === 3) container = container.parentNode;
        
        const enclosingHighlight = container.closest(".highlight");

        if (enclosingHighlight) {
            const parent = enclosingHighlight.parentNode;
            while (enclosingHighlight.firstChild) {
                parent.insertBefore(enclosingHighlight.firstChild, enclosingHighlight);
            }
            enclosingHighlight.remove();
            editor.normalize();
            sel.removeAllRanges();
            return;
        }

        const allHighlights = Array.from(editor.querySelectorAll(".highlight"));
        const intersectingHighlights = allHighlights.filter(h => {
            try {
                return range.intersectsNode(h) || h.contains(range.startContainer) || h.contains(range.endContainer);
            } catch (e) {
                return false;
            }
        });

        if (intersectingHighlights.length > 0) {
            intersectingHighlights.forEach(h => {
                const parent = h.parentNode;
                if (parent) {
                    while (h.firstChild) {
                        parent.insertBefore(h.firstChild, h);
                    }
                    h.remove();
                }
            });
            editor.normalize();
            sel.removeAllRanges();
            return;
        }

        try {
            const span = document.createElement("span");
            span.className = "highlight";
            range.surroundContents(span);
        } catch (e) {
            const span = document.createElement("span");
            span.className = "highlight";
            span.appendChild(range.extractContents());
            range.insertNode(span);
        }

        editor.normalize();
        sel.removeAllRanges();
    });

    // Emoji Speech Overlays
    function addSpeechEmojis() {
        const paragraphs = document.querySelectorAll('.question-text p, .line, .sentence, #quizSections p');
        paragraphs.forEach(p => {
            if (p.dataset.speechOverlay) return;
            p.dataset.speechOverlay = '1';

            const text = p.textContent.trim();
            let speaker = null;

            if (/^teacher:/i.test(text)) speaker = 'teacher';
            else if (/^student:/i.test(text)) speaker = 'student';
            else return;

            const emoji = speaker === 'teacher' ? '👩‍🦰' : '👧';
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'speech-emoji-btn';
            btn.title = speaker === 'teacher' ? 'Teacher Speech' : 'Student Speech';
            btn.textContent = emoji + ' ';

            btn.addEventListener('click', () => {
                if (synth.speaking) {
                    synth.cancel();
                    if (typeof clearHighlight === 'function') clearHighlight();
                }

                document.querySelectorAll(".reading-active")
                    .forEach(el => el.classList.remove("reading-active"));

                p.classList.add("reading-active");

                const lineText = text.replace(/^(teacher:|student:)\s*/i, '');
                const utter = new SpeechSynthesisUtterance(lineText);

                if (speaker === 'teacher') {
                    utter.voice = teacherVoice;
                    utter.rate = 0.88;
                    utter.pitch = 1.15;
                    utter.volume = 0.95;
                } else {
                    utter.voice = studentVoice;
                    utter.rate = 0.98;
                    utter.pitch = 1.50;
                    utter.volume = 0.80;
                }

                utter.onend = () => {
                    p.classList.remove("reading-active");
                };

                synth.speak(utter);
            });
            p.insertBefore(btn, p.firstChild);
        });
    }

    addSpeechEmojis();
    setInterval(addSpeechEmojis, 1000);

<script>
(function() {
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playCorrect() { 
        audioCtx.resume().then(() => { 
            const o = audioCtx.createOscillator(); 
            const g = audioCtx.createGain(); 
            o.type = "sine"; 
            o.frequency.setValueAtTime(800, audioCtx.currentTime); 
            g.gain.setValueAtTime(0.4, audioCtx.currentTime); 
            o.connect(g); g.connect(audioCtx.destination); 
            o.start(); o.stop(audioCtx.currentTime + 0.25); 
        }); 
    }

    function playWrong() { 
        audioCtx.resume().then(() => { 
            const o = audioCtx.createOscillator(); 
            const g = audioCtx.createGain(); 
            o.type = "triangle"; 
            o.frequency.setValueAtTime(450, audioCtx.currentTime); 
            o.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.25); 
            g.gain.setValueAtTime(0.4, audioCtx.currentTime); 
            o.connect(g); g.connect(audioCtx.destination); 
            o.start(); o.stop(audioCtx.currentTime + 0.25); 
        }); 
    }

    function normalize(str){ 
        return (str || '').trim().toLowerCase().replace(/\s+/g," "); 
    }

    document.body.addEventListener('change', e => {
        const exercise = e.target.closest('.exercise');
        if (!exercise) return;

        const textInputs = Array.from(exercise.querySelectorAll("input[type='text'], textarea"));
        const selectedInputs = Array.from(exercise.querySelectorAll("input:checked"));

        const userAnswers = textInputs.length 
            ? textInputs.map(i => normalize(i.value)) 
            : selectedInputs.map(i => normalize(i.value));

        const correctAnswers = Array.from(exercise.querySelectorAll('[data-correct]'))
            .map(i => normalize(i.dataset.correct));

        const isCorrect = userAnswers.length > 0 && userAnswers.every(ans => correctAnswers.includes(ans));

        exercise.querySelectorAll('.mc-emoji').forEach(span => span.remove());

        selectedInputs.forEach(inp => {
            const lbl = inp.closest("label");
            if (lbl) {
                const span = document.createElement('span');
                span.className = "mc-emoji";
                span.textContent = isCorrect ? "😊" : "😢";
                lbl.appendChild(span);
            }
        });

        textInputs.forEach(inp => {
            const span = document.createElement('span');
            span.className = "mc-emoji";
            span.textContent = isCorrect ? "😊" : "😢";
            inp.parentNode.insertBefore(span, inp.nextSibling);
        });

        if (isCorrect) playCorrect(); else playWrong();

        if (exercise.dataset.firstResponseLocked) return;
        exercise.dataset.firstResponseLocked = 'true';

        const correctCount = isCorrect ? 1 : 0;
        exercise.dataset.score = correctCount;
        exercise.dataset.percentage = correctCount * 100;
    });

    document.body.addEventListener('click', e => {
        if (!e.target.classList.contains('quiz-submit')) return;
        const sub = e.target.closest('.quiz-subsection');
        if (!sub) return;

        const exercises = sub.querySelectorAll('.exercise');
        let correctCount = 0;
        exercises.forEach(ex => {
            correctCount += Number(ex.dataset.score || 0);
        });

        const totalExercises = exercises.length;
        const percentage = totalExercises > 0 ? Math.round((correctCount / totalExercises) * 100) : 0;

        const board = sub.querySelector('.quiz-scoreboard');
        if (board) {
            const dataEl = board.querySelector('.scoreboard-data');
            const name = sub.querySelector('.quiz-name')?.value || 'Anonymous';
            const id = sub.querySelector('.quiz-id')?.value || 'N/A';
            const section = sub.closest('.section')?.querySelector('h2')?.textContent || 'Unknown Section';
            const subsection = sub.dataset.subsection || 'Unknown Subsection';
            const now = new Date();
            const pad = n => n.toString().padStart(2,'0');
            const dateString = `${pad(now.getDate())}/${pad(now.getMonth()+1)}/${now.getFullYear()} ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
            const filename = window.location.pathname.split('/').pop();

            const resultText = `${filename}|${section.replace(/:+$/, '').trim()}: ${subsection.replace(/^:+/, '').trim()}|${name}|${id}|${dateString}|${correctCount}/${totalExercises}|${percentage}%`;
            if (dataEl) dataEl.textContent = resultText;

            if (window.saveResult) {
                window.saveResult(resultText);
            }

            board.style.display = 'block';
        }
    });
})();
</script>

<script>
document.getElementById('highlightBtn')?.addEventListener('click', () => {
    const sel = window.getSelection();
    if (!sel.rangeCount || sel.isCollapsed) return;

    const range = sel.getRangeAt(0);
    let container = range.commonAncestorContainer;
    
    if (container.nodeType === Node.TEXT_NODE) {
        container = container.parentNode;
    }

    const existingHighlight = container.closest('.highlight');

    if (existingHighlight) {
        const parent = existingHighlight.parentNode;
        while (existingHighlight.firstChild) {
            parent.insertBefore(existingHighlight.firstChild, existingHighlight);
        }
        parent.removeChild(existingHighlight);
    } else {
        const span = document.createElement('span');
        span.className = 'highlight';
        span.appendChild(range.extractContents());
        range.insertNode(span);
    }
    
    sel.removeAllRanges();
});
</script>


<script>
(function() {
    'use strict';

    let scrollInterval = null;
    let isPlaying = false;
    let currentLineIndex = 0;
    let lineIntervalMs = 2500; // Time spent on each line (milliseconds)

    const wrapper = document.getElementById('teleScrollWrapper');
    const editArea = document.getElementById('teleEdit');
    const startBtn = document.getElementById('startBtn') || document.getElementById('telePlayBtn');
    const stopBtn = document.getElementById('stopBtn');
    const repeatBtn = document.getElementById('repeatBtn');
    const speedButtons = document.querySelectorAll('.speed-buttons button');

    function scrollToLine(index) {
        if (!wrapper || !editArea) return;
        const lines = editArea.querySelectorAll('.line');
        if (lines.length === 0) return;

        if (index >= lines.length) {
            stopPrompter();
            return;
        }

        const targetLine = lines[index];
        wrapper.scrollTo({
            top: targetLine.offsetTop - wrapper.offsetTop - 20,
            behavior: 'smooth'
        });
    }

    function startPrompter() {
        if (!wrapper || isPlaying) return;
        const lines = editArea.querySelectorAll('.line');
        if (lines.length === 0) return;

        isPlaying = true;
        if (startBtn) startBtn.textContent = 'Pause';

        scrollToLine(currentLineIndex);

        scrollInterval = setInterval(() => {
            currentLineIndex++;
            scrollToLine(currentLineIndex);
        }, lineIntervalMs);
    }

    function stopPrompter() {
        if (scrollInterval) {
            clearInterval(scrollInterval);
            scrollInterval = null;
        }
        isPlaying = false;
        if (startBtn) startBtn.textContent = 'Play';
    }

    // 1. Speed Button Integration
    speedButtons.forEach(btn => {
        btn.addEventListener('click', () => {
            speedButtons.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            const val = parseInt(btn.dataset.speed || btn.textContent, 10);
            if (!isNaN(val)) {
                lineIntervalMs = val > 20 ? val : 3500 / val;
            }

            if (isPlaying) {
                stopPrompter();
                startPrompter();
            }
        });
    });

    // 2. Play / Pause Control
    startBtn?.addEventListener('click', () => {
        if (isPlaying) {
            stopPrompter();
        } else {
            startPrompter();
        }
    });

    // 3. Stop Control
    stopBtn?.addEventListener('click', stopPrompter);

    // 4. Repeat / Reset to Top Control
    repeatBtn?.addEventListener('click', () => {
        stopPrompter();
        currentLineIndex = 0;
        if (wrapper) {
            wrapper.scrollTo({
                top: 0,
                behavior: 'smooth'
            });
        }
    });

    // 5. Reset line index when typing or loading new sections
    editArea?.addEventListener('input', () => {
        if (isPlaying) stopPrompter();
        currentLineIndex = 0;
    });

    const originalLoadByIndex = window.loadSectionByIndex;
    if (typeof originalLoadByIndex === 'function') {
        window.loadSectionByIndex = function(index) {
            stopPrompter();
            currentLineIndex = 0;
            originalLoadByIndex(index);
        };
    }
})();
</script>

<script>
(function(){

  /* =========================
     RAW INSTRUCTIONS TEXT
  ========================= */
  const RAW_TEXT = `
How to use this page...

1. Enter Name and ID.
2. Select a category.
3. Click Start to begin.
4. Write or edit in the text field.
5. Select from the suggested word bank.
6. Click Start to start the Teleprompter Feature.

8. Click Submit to find options to save your work.
9. Copy or download your text.
10. Download your audio.
  `;

  /* =========================
     RAW TEXT PARSER
  ========================= */
  function parseRawInstructions(text){
    const lines = text.split("\n").map(l => l.trim()).filter(Boolean);
    const html = [];

    lines.forEach(line => {
      if(line === "---"){
        html.push(`<hr>`);
        return;
      }
      if(/^\d+\./.test(line)){
        html.push(`<p>${line}</p>`);
        return;
      }
      if(!/[.!?:]$/.test(line)){
        html.push(`<h3>${line}</h3>`);
        return;
      }
      html.push(`<p>${line}</p>`);
    });

    return html.join("");
  }

  /* =========================
     CREATE BUTTON
  ========================= */
  const btn = document.createElement("button");
  btn.id = "instructionsBtn";
  btn.textContent = "Instructions";

  const targetContainer = document.querySelector("footer") || document.body;
  targetContainer.appendChild(btn);

  /* =========================
     CREATE MODAL
  ========================= */
  const root = document.createElement("div");
  root.id = "instructionsRoot";

  root.innerHTML = `
    <div id="instructionsBackdrop"></div>
    <div id="instructionsModal">
      <div id="instructionsHeader">
        <button id="instructionsBack">←</button>
        <span id="instructionsTitle">Instructions</span>
      </div>
      <div id="instructionsContent">
        ${parseRawInstructions(RAW_TEXT)}
      </div>
    </div>
  `;

  document.body.appendChild(root);

  /* =========================
     SCROLL LOCK
  ========================= */
  const modalContent = document.getElementById("instructionsContent");

  modalContent.addEventListener("wheel", e => {
    e.stopPropagation();
  }, { passive: false });

  modalContent.addEventListener("touchmove", e => {
    e.stopPropagation();
  }, { passive: false });

  /* =========================
     OPEN / CLOSE
  ========================= */
  function openModal(){
    root.style.display = "block";
    document.body.style.overflow = "hidden";
    document.documentElement.style.overflow = "hidden";
  }

  function closeModal(){
    root.style.display = "none";
    document.body.style.overflow = "";
    document.documentElement.style.overflow = "";
  }

  btn.onclick = openModal;
  document.getElementById("instructionsBack").onclick = closeModal;
  document.getElementById("instructionsBackdrop").onclick = closeModal;

  document.addEventListener("keydown", e => {
    if(e.key === "Escape") closeModal();
  });

  /* =========================
     DYNAMIC BODY PADDING FOR BUTTON
  ========================= */
  function adjustBodyPadding(){
    const btnHeight = btn.offsetHeight - 25; 
    document.body.style.paddingBottom = `${btnHeight}px`;
  }

  adjustBodyPadding();
  window.addEventListener("resize", adjustBodyPadding);

})();
