<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Teleprompter</title>
<script defer src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
:root {
  --bg: #f7fdfb;
  --blue: #1976d2;
  --border-thickness: 10px;
}

* { 
  box-sizing: border-box; 
  margin: 0; 
  padding: 0; 
}

html, body {
  height: 100%;
  background: var(--bg);
  font-family: Arial, Helvetica, sans-serif;
  color: #222;
  overflow-y: auto;
  overflow-x: hidden;
  scrollbar-width: none;
}

html::-webkit-scrollbar,
body::-webkit-scrollbar {
  display: none;
}

body {
  padding: 50px;
  padding-left: calc(50px + env(safe-area-inset-left));
  padding-right: calc(50px + env(safe-area-inset-right));
  padding-bottom: calc(50px + env(safe-area-inset-bottom));
}

.container {
  max-width: 900px;
  margin: 0 auto;
  padding: 10px 12px 12px 12px;
}

@media (max-width: 700px) {
  body {
    padding: 8px;
    padding-left: calc(8px + env(safe-area-inset-left));
    padding-right: calc(8px + env(safe-area-inset-right));
    padding-bottom: calc(8px + env(safe-area-inset-bottom));
  }
  .container {
    max-width: 100%;
    padding: 10px 8px 8px 8px;
  }
}

.header {
  text-align: center;
  font-size: 20px;
  color: var(--blue);
  font-weight: 700;
  margin-bottom: 3px;
}

.top-bar {
  display: flex;
  gap: 6px;
  flex-wrap: nowrap;
  overflow-x: auto;
  margin-bottom: 6px;
  -webkit-overflow-scrolling: touch;
}

input[type="text"] { 
  height: 36px; 
  padding: 0 8px; 
  border: 1px solid #cfe2f7; 
  border-radius: 6px; 
  font-size: 14px; 
}

#gsName, #gsId, #nameField, #idField { 
  flex: 0 0 140px; 
  min-width: 80px; 
}

button { 
  height: 36px; 
  padding: 0 10px; 
  font-size: 14px; 
  background: #1976d2; 
  color: #fff; 
  border: none; 
  border-radius: 6px; 
  cursor: pointer; 
  transition: 0.12s; 
}

button:hover:not(:disabled) { background: #1565c0; }
button:disabled { background: #9fbfe4; cursor: not-allowed; }

#gsMain { display: flex; gap: 6px; height: 70vh; min-height: 360px; }
#gsWordBank { display: none !important; }

.tele-wrapper { 
  width: 100%; 
  height: 100%; 
  border: 1px solid #ccc; 
  border-radius: 6px; 
  overflow: hidden; 
  display: flex; 
  flex-direction: column; 
  background: #fff; 
  position: relative; 
}

#teleScrollWrapper {
  overflow-y: scroll;
  -webkit-overflow-scrolling: touch;
  flex-grow: 1;
  position: relative;
  scrollbar-width: none;
}
#teleScrollWrapper::-webkit-scrollbar { display: none; }

#teleScroll { position: relative; top: 0; transition: top 0.2s linear; }

/* =========================================================
   STANDARD, CLEAN TELEPROMPTER & TEXT TYPOGRAPHY
   ========================================================= */
.tele-edit,
.tele-edit .line,
.line,
#gsScoreText,
.quiz-container,
#quizContentContainer {
  font-family: Arial, Helvetica, sans-serif !important;
  font-size: 16px !important;
  line-height: 1.6 !important;
  font-weight: normal !important;
  color: #333 !important;
}

.tele-edit {
  padding: 14px !important;
  white-space: pre-wrap !important;
  overflow-wrap: break-word;
  word-break: break-word;
  min-height: 100px;
  outline: none;
}

.tele-edit .line,
.line {
  display: block !important;
  margin: 0 !important;
  padding: 0 !important;
  min-height: 1.6em !important;
  white-space: pre-wrap !important;
  word-break: break-word;
}

.tele-edit.empty::before { 
  color: #aaa; 
  content: attr(data-placeholder); 
  pointer-events: none; 
  white-space: pre-wrap; 
}

.tele-overlay { 
  position: absolute; 
  bottom: 12px; 
  right: 12px; 
  background: rgba(255,255,255,0.95); 
  padding: 6px 10px; 
  border-radius: 6px; 
  font-family: monospace; 
  font-size: 12px; 
  pointer-events: none; 
  z-index: 10; 
  user-select: none; 
}

.scoreboard { 
  display: none; 
  font-family: monospace; 
  font-size: 14px; 
  background: #fff; 
  border-radius: 6px; 
  padding: 12px; 
  margin-top: 12px; 
  border: 1px solid #ddd; 
  max-width: 100%; 
  overflow-y: auto; 
}

.scoreboard .text { 
  white-space: pre-wrap; 
  word-break: break-word; 
  min-height: 120px; 
  border: 1px solid #ccc; 
  padding: 8px; 
  border-radius: 6px; 
  resize: vertical; 
}

.controls { display: flex; gap: 6px; margin-top: 8px; margin-bottom: 10px; }
.controls .left { display: flex; gap: 6px; }
.controls .right { margin-left: auto; display: flex; gap: 6px; }

#speechBtn { width: 60px; height: 36px; background: #1976d2; border-radius: 6px; border: none; cursor: pointer; color: #fff; }
#speechBtn.recording { background: #e53935; }
#captureAudioBtn { width: 60px; height: 36px; background: #39FF14; border-radius: 6px; border: none; cursor: pointer; color: #000; }
#captureAudioBtn.recording { background: #e53935; }

.speed-buttons { display: flex; gap: 4px; margin-bottom: 12px; flex-wrap: wrap; }
.speed-buttons button { flex: 1 1 auto; background: #bbb; font-weight: 700; }
.speed-buttons button.active { background: #1976d2; color: #fff; }

#green-border { position: fixed; inset: 0; border: 10px solid #39FF14; box-sizing: border-box; z-index: 9999; pointer-events: none; background: transparent; }
.toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: var(--blue); color: #fff; padding: 10px 14px; border-radius: 6px; display: none; z-index: 10000; }

#copyrightSection { margin-top: 10px; text-align: left; padding: 0; font-size: 8px; }

.formRow { display: flex; align-items: center; gap: 6px; flex-wrap: nowrap; overflow-x: auto; margin-bottom: 10px; }
.formRow button { height: 34px; line-height: 34px; }

/* Modal */
.modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 5000; justify-content: center; align-items: center; }
.modal.show { display: flex; }
.modal-content { width: min(500px, 92vw); max-height: 80vh; overflow-y: auto; background: #fff; border-radius: 12px; padding: 18px; box-sizing: border-box; }
.modal-content h3 { margin-bottom: 12px; color: #1976d2; }

#sectionRadioList { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
#sectionRadioList label { display: flex; gap: 10px; align-items: flex-start; padding: 8px; border-radius: 6px; cursor: pointer; }
#sectionRadioList label:hover { background: #eef6ff; }

.modal-buttons { display: flex; justify-content: flex-end; gap: 8px; margin-top: 15px; }
.modal-buttons button { flex: 1; }

#sectionWheelContainer {
  height: 34px;
  min-width: 130px;
  max-width: 220px;
  border: 1px solid #bbb;
  border-radius: 8px;
  padding: 0 12px;
  background: #fff;
  display: flex;
  align-items: center;
  flex-wrap: nowrap;
}
#sectionWheelContainer:hover { border-color: #999; }
#sectionWheelContainer:focus-within { border-color: #4a90e2; box-shadow: 0 0 0 2px rgba(74, 144, 226, 0.2); }
#sectionWheelContainer .wheel {
  width: 100%;
  min-width: 250px;
  max-width: 100%;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  line-height: 1;
  display: flex;
  align-items: center;
  font-size: 12px;
}
#sectionWheelContainer .wheel.placeholder { color: #aaa; font-style: italic; }

/* States & Highlights */
.reading-active { background-color: #ffff00 !important; scroll-margin-top: 120px; transition: background-color 0.4s ease; }
.highlight { background-color: #ffff00; color: #000000; }
.word { cursor: pointer; color: inherit; }
.word:hover { background-color: rgba(26,115,232,0.2); }
.sentence { font-size: 14px; line-height: 1.4; color: #333; }

body.teleprompter-mode #openSectionModal { display: none !important; }
.question-text { margin-top: -5px; }
.question-text:focus { outline: none; box-shadow: none; }

/* =========================================================
   NORMALIZED & READABLE QUIZ SECTION STYLING
   ========================================================= */
#quizSections {
  width: 100%;
  margin: 0;
  padding: 12px;
  box-sizing: border-box;
  background: #ffffff !important;
  border-radius: 6px;
  border: 1px solid #ccc;
  font-family: Arial, Helvetica, sans-serif;
  color: #333;
  white-space: normal;
}

#quizSections .exercise {
  margin-bottom: 12px;
  padding: 0;
  background: none;
  border: none;
}

#quizSections .exercise p {
  font-size: 15px;
  font-weight: 400 !important;
  color: #111;
  margin: 0 0 6px 0;
  line-height: 1.5;
  white-space: normal;
}

#quizSections label {
  display: flex;
  align-items: center;
  gap: 6px;
  margin: 0 0 6px 0;
  cursor: pointer;
  font-size: 14px;
  line-height: 1.5;
  white-space: normal;
}

.quiz-scoreboard {
  width: 100%;
  box-sizing: border-box;
  margin-bottom: 12px;
  padding: 6px;
  border: 1px solid #9aaed1;
  border-radius: 6px;
  background: #f9f9f9;
  font-family: monospace;
  font-size: 12px;
}

.scoreboard-data { margin: 0; white-space: pre-wrap; }
.scoreboard-buttons { margin-top: 6px; display: flex; gap: 6px; }

.quiz, .quiz-container, [class*="quiz"] {
  margin: 0;
  padding: 0;
}


.section-title {
  font-weight: bold;
  margin-bottom: 2px;
}

/* Add this to your CSS file to clean up the PNG export wrapper */
.export-render-canvas {
  background: #fff;
  color: #000;
  padding: 20px;
  font-family: monospace;
  font-size: 16px;
  line-height: 1.4;
  white-space: pre-wrap;
  position: absolute;
  left: -99999px;
  top: 0;
  width: 900px;
  box-sizing: border-box;
}

/* Toast and unsupported styling handled via CSS */
.toast {
  display: none;
}
.toast.show {
  display: block;
}
.speech-unsupported {
  opacity: 0.6;
  pointer-events: none;
}

/* Move canvas wrapper styles to CSS for better maintenance */
.quiz-export-wrapper {
  white-space: pre-wrap;
  font-family: monospace;
  padding: 15px;
  background-color: #fff;
  color: #000;
  position: fixed;
  left: -9999px;
  top: 0;
  width: 900px;
  box-sizing: border-box;
}


/* =========================================
   INSTRUCTIONS MODAL & BUTTON STYLES (Move to CSS)
   ========================================= */
#instructionsBtn {
  position: relative;
  display: inline-block;
  margin: 20px auto 10px auto;
  padding: 10px 16px;
  background: #2e8b57;
  color: #fff;
  border: none;
  border-radius: 6px;
  font-weight: 600;
  cursor: pointer;
  box-shadow: 0 4px 8px rgba(0,0,0,0.6);
  z-index: 99998;
}

#instructionsBtn:hover {
  background: #257047;
}

#instructionsRoot {
  position: fixed;
  inset: 0;
  display: none;
  z-index: 99999;
}

#instructionsBackdrop {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,.35);
}

#instructionsModal {
  position: absolute;
  top: 25px;
  left: 50%;
  transform: translateX(-50%);
  width: min(650px, 90vw);
  max-height: 90vh;
  background: #fff;
  border-radius: 10px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

#instructionsHeader {
  padding: 12px 16px;
  border-bottom: 1px solid #ddd;
  display: flex;
  align-items: center;
  gap: 10px;
}

#instructionsTitle {
  color: #1976d2;
  font-weight: 600;
  font-size: 1.1em;
}

#instructionsBack {
  border: none;
  background: none;
  font-size: 20px;
  cursor: pointer;
  color: #1976d2;
  font-weight: 600;
}

#instructionsContent {
  padding: 2px 18px 18px 18px;
  overflow-y: auto;
  line-height: 1.6;
  scrollbar-width: none;
  -ms-overflow-style: none;
}

#instructionsContent::-webkit-scrollbar {
  display: none;
}

#instructionsContent h3 {
  color: #1976d2;
  margin: 12px 0 4px 0;
  font-weight: 600;
}

#instructionsContent p {
  margin: 4px 0;
}

#instructionsContent hr {
  margin: 12px 0;
}

/* CSS helper class for PNG export wrapper */
.png-export-wrapper {
  white-space: pre-wrap;
  font-family: monospace;
  padding: 10px;
  background-color: #fff;
  color: #000;
}


/* =========================================
   QUIZ COMPONENT STYLES (Move to CSS)
   ========================================= */
.editable-text-zone {
  outline: none;
}

.quiz-wrapper {
  margin-top: 25px;
  border-top: 2px dashed #ccc;
  padding-top: 15px;
}

.quiz-toggle-btn {
  padding: 6px 14px;
  cursor: pointer;
  background: #007bff;
  color: white;
  border: none;
  border-radius: 4px;
  font-weight: bold;
  margin-bottom: 12px;
}

.quiz-toggle-btn.active {
  background: #6c757d;
}

.quiz-content-container {
  display: none;
  background: rgba(0,0,0,0.02);
  padding: 12px;
  border-radius: 6px;
  border: 1px solid #e0e0e0;
  font-family: Arial, Helvetica, sans-serif !important;
  font-size: 16px !important;
  line-height: 1.6 !important;
  white-space: pre-wrap !important;
}

.quiz-line-item {
  display: block !important;
  margin: 0 !important;
  padding: 0 !important;
  font-family: Arial, Helvetica, sans-serif !important;
  font-size: 16px !important;
  line-height: 1.6 !important;
  font-weight: normal !important;
  color: #333 !important;
  min-height: 1.6em !important;
  white-space: pre-wrap !important;
  word-break: break-word !important;
}

/* =========================================
   UI & QUIZ COMPONENT STYLES (Move to CSS)
   ========================================= */
.editable-text-zone {
    outline: none;
}

.quiz-wrapper {
    margin-top: 25px;
    border-top: 2px dashed #ccc;
    padding-top: 15px;
}

.quiz-toggle-btn {
    padding: 6px 14px;
    cursor: pointer;
    background: #007bff;
    color: white;
    border: none;
    border-radius: 4px;
    font-weight: bold;
    margin-bottom: 12px;
}

.quiz-toggle-btn.active {
    background: #6c757d;
}

.quiz-sections-container {
    display: none;
    background: rgba(0,0,0,0.02);
    padding: 12px;
    border-radius: 6px;
    border: 1px solid #e0e0e0;
}

.quiz-top-controls {
    margin-bottom: 10px;
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
}

.quiz-id-input {
    padding: 4px;
    border: 1px solid #ccc;
    border-radius: 4px;
}

.quiz-submit-btn {
    padding: 4px 10px;
    cursor: pointer;
}

.quiz-scoreboard {
    display: none;
    width: 100%;
    margin-bottom: 12px;
    padding: 6px;
    border: 1px solid #9aaed1;
    border-radius: 6px;
    background: #f9f9f9;
    font-family: monospace;
    font-size: 12px;
}

.scoreboard-data {
    margin: 0;
    white-space: pre-wrap;
}

.scoreboard-buttons {
    margin-top: 6px;
    display: flex;
    gap: 6px;
}

.quiz-blank-line {
    min-height: 1.6em !important;
}

.quiz-exercise {
    margin-bottom: 4px !important;
}

.quiz-question-title {
    margin: 0 0 1px 0 !important;
    line-height: 1.0 !important;
}

.quiz-option-label {
    margin: 0 0 1px 10px !important;
    line-height: 1.0 !important;
    display: block;
}


/* =========================================
   SPEECH & HIGHLIGHT STYLES (Move to CSS)
   ========================================= */
.reading-active {
    background-color: #fff9c4 !important;
    transition: background-color 0.4s ease;
}

.speech-emoji-btn {
    all: unset;
    cursor: pointer;
    font-size: 14px;
    display: inline;
    margin: 0;
    padding: 0;
    line-height: 1;
    vertical-align: baseline;
}


/* =========================================
   QUIZ FEEDBACK & HIGHLIGHT STYLES (Move to CSS)
   ========================================= */
.mc-emoji {
    margin-left: 8px;
}


/* =========================================================
   MC QUIZ MANIA — SEPARATE SCOREBOARD
   ========================================================= */

.quiz-mania-controls {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 8px 0;
}

.quiz-mania-id {
    width: 180px;
    box-sizing: border-box;
    padding: 6px 8px;
}

/* Match the standard buttons exactly */
.quiz-mania-controls button,
.quiz-mania-buttons button {
    height: 36px !important;
    padding: 0 10px !important;
    font-size: 14px !important;
    font-family: Arial, Helvetica, sans-serif !important;
    font-weight: normal !important;
    line-height: normal !important;
    background: #1976d2 !important;
    color: #fff !important;
    border: none !important;
    border-radius: 6px !important;
    cursor: pointer !important;
    transition: 0.12s !important;
    box-sizing: border-box !important;
}

.quiz-mania-controls button:hover,
.quiz-mania-buttons button:hover {
    background: #1565c0 !important;
}

.quiz-mania-scoreboard {
    display: none;
    margin: 8px 0;
    padding: 10px;
    box-sizing: border-box;
}

.quiz-mania-score-text {
    margin: 0 0 8px 0;
    padding: 10px;
    white-space: pre-wrap;
    word-break: break-word;
    font-family: monospace;
    font-size: 14px;
    line-height: 1.4;
    background: #fff;
    color: #000;
}

.quiz-mania-buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
}
</style>
</head>
<body>

<div id="green-border"></div>

<div id="layout">
  <div class="container">

    <!-- TOP BAR -->
    <div class="top-bar">
      <input id="gsId" type="text" placeholder="ID">

      <!-- Section / Quiz Button -->
      <button id="openSectionModal" type="button">Section</button>
    </div>


    <!-- SECTION SELECTION MODAL -->
    <div id="sectionModal" class="modal">
      <div class="modal-content" style="position: relative;">

        <h3>Select a Section</h3>

        <div id="sectionRadioList"></div>

        <div class="modal-buttons">
          <button
            id="cancelSectionModal"
            type="button">
            Cancel
          </button>

          <button
            id="confirmSectionSelection"
            type="button">
            Load Section
          </button>
        </div>

      </div>
    </div>


    <!-- PLAYBACK CONTROLS & SPEED BUTTONS -->
    <div class="formRow">

      <button id="startBtn">Start</button>
      <button id="stopBtn">Stop</button>
      <button id="repeatBtn">Repeat</button>

      <div
        class="speed-buttons"
        role="tablist"
        aria-label="Speed"
        style="display: inline-flex; gap: 4px; margin: 0; vertical-align: middle;">

        <button data-speed="4000">Slow</button>
        <button data-speed="3000" class="active">Medium</button>
        <button data-speed="2000">Fast</button>

      </div>

    </div>


    <!-- RECORDING & UTILITY CONTROLS -->
    <div class="formRow">

      <button
        id="highlightBtn"
        title="Toggle Highlight">
        Highlight
      </button>

      <button
        id="copyBtn"
        title="Copy Selected Text">
        Copy
      </button>

      <button
        id="audioBtn"
        title="Play Audio">
        Audio
      </button>

      <button
        id="speechBtn"
        title="Start/Stop speech">
        STT
      </button>

      <button
        id="captureAudioBtn"
        title="Start/Stop audio">
        🔴
      </button>

      <button
        id="submitBtn"
        disabled>
        Submit
      </button>

    </div>


    <!-- TELEPROMPTER VIEWPORT -->
    <div id="gsMain">

      <div
        id="teleWrapper"
        class="tele-wrapper">

        <div id="teleScrollWrapper">

          <div id="teleScroll">

            <div
              id="teleEdit"
              class="tele-edit question-text"
              contenteditable="true"
              data-placeholder="Type or paste your text here..."
            ></div>

          </div>

        </div>

      </div>

    </div>


    <!-- METRICS OVERLAY -->
    <div
      class="tele-overlay"
      id="teleOverlay">
      0 chars · 0 sent · Changed: 0%
    </div>

  </div>


  <!-- =====================================================
       GLOBAL / TEXT ACTIVITY SCOREBOARD
       ===================================================== -->
  <div
    id="gsScoreboard"
    class="scoreboard"
    aria-live="polite">

    <div id="gsScoreMeta"></div>

    <div
      id="gsScoreText"
      class="text"
      contenteditable="true">
    </div>

    <div
      class="global-scoreboard-buttons"
      style="margin-top:10px;">

      <button id="copyScoreBtn">
        Copy
      </button>

      <button id="downloadScoreTxtBtn">
        TXT
      </button>

      <button id="downloadScorePngBtn">
        PNG
      </button>

      <button id="downloadBlobBtn">
        ↓ Audio
      </button>

    </div>

  </div>


  <!-- COPYRIGHT FOOTER -->
  <section
    id="copyrightSection"
    class="copyrightSection">

    <div class="footer-note copyright">
      © 2026 Perfectly Practical English™. All rights reserved.
    </div>

  </section>

</div>


<!-- GLOBAL NOTIFICATIONS / MEASURE HELPERS -->

<div
  id="toast"
  class="toast">
  Copied
</div>

<div
  id="measure"
  aria-hidden="true">
</div>
<script>
  // Modal Cancel Button
  document.getElementById('cancelSectionModal').addEventListener('click', () => {
    document.getElementById('sectionModal').classList.remove('show');
  });

  // Helper Toast Function
  function showToast(message, duration = 2000) {
    const toast = document.getElementById('toast');
    if (toast) {
      toast.textContent = message;
      toast.style.display = 'block';
      setTimeout(() => {
        toast.style.display = 'none';
      }, duration);
    }
  }

  // Copy Selected Text Button
  document.getElementById('copyBtn').addEventListener('click', () => {
    const selectedText = window.getSelection().toString();
    if (!selectedText) {

document.addEventListener('DOMContentLoaded', () => {
    'use strict';

    // ==========================================

    const teleOverlay = document.getElementById('teleOverlay');
