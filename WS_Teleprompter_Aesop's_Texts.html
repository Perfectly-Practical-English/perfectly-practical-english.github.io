    const modal = document.getElementById("sectionModal");
    const openBtn = document.getElementById("openSectionModal");
    const cancelBtn = document.getElementById("cancelSectionModal");
    const confirmBtn = document.getElementById("confirmSectionSelection");
    const radioList = document.getElementById("sectionRadioList");

    // Scoreboard Elements
    const gsScoreboard = document.getElementById('gsScoreboard');
    const gsScoreMeta = document.getElementById('gsScoreMeta');
    const gsScoreText = document.getElementById('gsScoreText');
    const copyScoreBtn = document.getElementById('copyScoreBtn');
    const downloadScoreTxtBtn = document.getElementById('downloadScoreTxtBtn');
    const downloadScorePngBtn = document.getElementById('downloadScorePngBtn');

    // User Data Elements
// User Data Elements
const gsId = document.getElementById('gsId');
const gsName = document.getElementById('gsName');

// Enable Submit only when Student ID is entered
if (gsId && mainSubmitBtn) {
    mainSubmitBtn.disabled = !gsId.value.trim();

    gsId.addEventListener('input', () => {
        mainSubmitBtn.disabled = !gsId.value.trim();
    });
}

    // Audio Elements
    const captureAudioBtn = document.getElementById('captureAudioBtn');
    const copyBlobBtn = document.getElementById('copyBlobBtn');
    const downloadBlobBtn = document.getElementById('downloadBlobBtn');

    // ==========================================
    // 2. INTERNAL STATE
    // ==========================================
    let selectedSectionIndex = -1;
    let initialText = '';
    let mediaRecorder = null;
    let audioChunks = [];
    let audioBlob = null;

    // Initialize baseline text safely
    setTimeout(() => {
        if (teleEdit) {
            initialText = teleEdit.innerText || teleEdit.textContent || '';
        }
    }, 150);

    if (gsScoreboard) {
        gsScoreboard.style.display = 'none';
    }

    // ==========================================
    // 3. PURE PARSER & UTILITY FUNCTIONS
    // ==========================================
    window.parseSectionsFromRaw = function(raw) {
        const sections = [];
        let current = null;

        raw.split(/\r?\n/).forEach(line => {
            const t = line.trim();
            if (t.startsWith("~")) {
                current = {
                    id: t.slice(1).trim().toLowerCase().replace(/\s+/g, "-"),
                    name: t.slice(1).trim(),
                    text: ""
                };
                sections.push(current);
                return;
            }
            if (current) {
                const cleanLine = line.replace(/~/g, '');
                current.text += cleanLine + "\n";
            }
        });
        return sections;
    };

    window.parseVocabsFromRaw = function(raw) {
        const sections = {};
        let current = null;

        raw.split(/\r?\n/).forEach(line => {
            const t = line.trim();
            if (!t) return;

            if (t.startsWith("~")) {
                current = t.slice(1).trim();
                sections[current] = [];
                return;
            }

            if (current && t.startsWith("•")) {
                const m = t.match(/•\s*([^\s–]+)/);
                if (m) sections[current].push(m[1]);
            }
        });
        return sections;
    };

    function loadRawTextBlocks() {
        const blobs = [];
        const byId = document.getElementById('rawText');
        if (byId && byId.textContent) blobs.push(byId.textContent.trim());
        document.querySelectorAll('script[type="text/plain"].rawText, script[type="text/plain"]').forEach((s) => {
            if (s.id === 'rawText') return;
            if (s.textContent && s.textContent.trim()) blobs.push(s.textContent.trim());
        });
        return blobs.join("\n\n");
    }

    window.cleanSectionText = function(str) {
        if (!str) return "";
        let working = str;
        const first = working.indexOf('~');
        const last = working.lastIndexOf('~');
        if (first !== -1 && last !== -1 && last > first) {
            working = working.slice(first + 1, last);
        }
        const lines = working.split(/\r?\n/);
        const validLines = [];
        for (let line of lines) {
            const trimmed = line.trim();
            if (trimmed === 'QUIZ' || trimmed === 'Quiz') break; 
            validLines.push(line);
        }
        return validLines.join('\n');
    };

    window.calculateFastChangePercentage = function(original, current) {
        if (!original || !current) return 0;
        const getWords = str => str.toLowerCase().match(/\b[a-z0-9'-]+\b/g) || [];
        const origWords = getWords(original);
        const currWords = getWords(current);
        if (origWords.length === 0) return currWords.length > 0 ? 100 : 0;
        
        const origMap = {};
        origWords.forEach(w => origMap[w] = (origMap[w] || 0) + 1);
        
        let matches = 0;
        currWords.forEach(w => {
            if (origMap[w] && origMap[w] > 0) {
                matches++;
                origMap[w]--;
            }
        });
        
        const maxLen = Math.max(origWords.length, currWords.length);
        const similarity = matches / maxLen;
        return Math.max(0, Math.min(100, Math.round((1 - similarity) * 100)));
    };

    // Global helper referenced in multiple scripts
    window.getCurrentTopEditedText = function() {
        const editableZone = document.getElementById('editableTextZone');
        if (!editableZone) return teleEdit ? (teleEdit.innerText || teleEdit.textContent || '') : '';
        const linesArr = Array.from(editableZone.querySelectorAll('.line:not(.spacer)'));
        return linesArr.length > 0 
            ? linesArr.map(line => line.textContent).join('\n') 
            : (editableZone.innerText || editableZone.textContent || '');
    };

    // ==========================================
    // 4. SECTION SETUP & MODAL BINDINGS
    // ==========================================
    const rawText = loadRawTextBlocks();
    window.SCRAMBLE_SECTIONS = window.parseSectionsFromRaw(rawText);
    window.SCRAMBLE_INDEX = 0;

    if (radioList && window.SCRAMBLE_SECTIONS.length > 0) {
        radioList.innerHTML = ''; 
        window.SCRAMBLE_SECTIONS.forEach((section, index) => {
            const label = document.createElement("label");
            label.innerHTML = `
                <input type="radio" name="sectionChoice" value="${index}">
                <span>${section.name}</span>
            `;
            radioList.appendChild(label);
        });
    }

    if (openBtn && modal && radioList) {
        openBtn.addEventListener("click", () => {
            modal.classList.add("show");
            const current = radioList.querySelector(`input[value="${selectedSectionIndex}"]`);
            if (current) current.checked = true;
        });
    }

    if (cancelBtn && modal) {
        cancelBtn.addEventListener("click", () => {
            modal.classList.remove("show");
        });
    }

    if (confirmBtn && modal && radioList) {
        confirmBtn.addEventListener("click", () => {
            const choice = radioList.querySelector('input[name="sectionChoice"]:checked');
            if (!choice) return;

            selectedSectionIndex = Number(choice.value);
            const section = window.SCRAMBLE_SECTIONS[selectedSectionIndex];

            modal.classList.remove("show");

            if (section && window.loadSectionWithLockedQuiz) {
                window.loadSectionWithLockedQuiz(section.text);
            }
          
            const editableZone = document.getElementById('editableTextZone') || teleEdit;
            if (editableZone && section) {
                const titleDiv = document.createElement('div');
                titleDiv.className = 'section-title';
                titleDiv.textContent = section.name;
                editableZone.insertBefore(titleDiv, editableZone.firstChild);
            }

            window.updateTextOverlay();
        });
    }

    if (modal) {
        modal.addEventListener("click", (e) => {
            if (e.target === modal) {
                modal.classList.remove("show");
            }
        });
    }

    window.loadSectionWithLockedQuiz = function(sectionText) {
        if (!sectionText || !teleEdit) return;

        let fullText = sectionText;
        const first = sectionText.indexOf('~');
        const last = sectionText.lastIndexOf('~');
        if (first !== -1 && last !== -1 && last > first) {
            fullText = sectionText.slice(first + 1, last);
        }

        window._currentOriginalBaseline = window.cleanSectionText(fullText);

        let activePart = fullText;
        const lines = fullText.split(/\r?\n/);
        for (let i = 0; i < lines.length; i++) {
            const trimmed = lines[i].trim();
            if (trimmed === 'QUIZ' || trimmed === 'Quiz') {
                activePart = lines.slice(0, i).join('\n');
                break;
            }
        }

        teleEdit.innerHTML = '';
        teleEdit.setAttribute('contenteditable', 'false');

        const editableContainer = document.createElement('div');
        editableContainer.id = 'editableTextZone';
        editableContainer.className = 'question-text editable-text-zone';
        editableContainer.setAttribute('contenteditable', 'true');

        activePart.split(/\r?\n/).forEach(line => {
            const p = document.createElement('p');
            p.className = 'line';
            if (line.trim() === '') {
                p.innerHTML = '&nbsp;';
            } else {
                p.textContent = line;
            }
            editableContainer.appendChild(p);
        });
        teleEdit.appendChild(editableContainer);

        window.dispatchEvent(new CustomEvent('textSectionLoaded', { detail: { sectionText: fullText } }));
        window.updateTextOverlay();
    };

    // ==========================================
    // 5. LIVE TELEPROMPTER OVERLAY & TYPING
    // ==========================================
    window.updateTextOverlay = function() {
        const editableZone = document.getElementById('editableTextZone');
        if (!editableZone) return;

        let rawTextContent = "";
        const lineDivs = editableZone.querySelectorAll('.line, p');
        if (lineDivs.length > 0) {
            rawTextContent = Array.from(lineDivs).map(div => div.innerHTML === '&nbsp;' ? '' : div.textContent).join('\n');
        } else {
            rawTextContent = editableZone.innerText || '';
        }
        
        const cleanActiveText = window.cleanSectionText(rawTextContent);
        const s = (cleanActiveText.match(/[.!?]+/g) || []).length;
        const originalBaselineText = window._currentOriginalBaseline || initialText;
        const currentChangeRate = originalBaselineText ? window.calculateFastChangePercentage(originalBaselineText, cleanActiveText) : 0;

        if (teleOverlay) {
            const outputText = `${cleanActiveText.length} chars · ${s} sent · Changed: ${currentChangeRate}%`;
            if (teleOverlay.tagName === 'INPUT' || teleOverlay.tagName === 'TEXTAREA') {
                teleOverlay.value = outputText;
            } else {
                teleOverlay.textContent = outputText;
            }
        }
    };

    document.addEventListener('input', (e) => {
        const editableZone = document.getElementById('editableTextZone');
        if (editableZone && editableZone.contains(e.target)) {
            window.updateTextOverlay();
        }
    });

    // ==========================================
    // 6. SUBMISSION & SCOREBOARD HANDLER
    // ==========================================
    if (mainSubmitBtn) {
        mainSubmitBtn.addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();

            const id = gsId ? gsId.value.trim() || 'Unknown' : 'Unknown';
            const name = (window.resolveStudentNameFromId && id !== 'Unknown') 
                ? window.resolveStudentNameFromId(id) 
                : (gsName ? gsName.value.trim() || 'Unknown' : 'Unknown');
            
            if (gsName) gsName.value = name;

            const txt = window.getCurrentTopEditedText();
            const cleanText = window.cleanSectionText(txt);
            const chars = cleanText.length;
            const sentenceCount = (cleanText.match(/[.!?]+/g) || []).length;

            let changeRate = 0;
            const baseline = window._currentOriginalBaseline || initialText;
            if (baseline) {
                changeRate = window.calculateFastChangePercentage(baseline, cleanText);
            } else if (initialText.length > 0) {
                const diff = Math.abs(chars - initialText.length);
                changeRate = Math.min(100, Math.round((diff / initialText.length) * 100));
            }

            const metaString = `ID: ${id} | Name: ${name} | Chars: ${chars} | Sentences: ${sentenceCount} | Changed: ${changeRate}%`;

            if (gsScoreMeta) gsScoreMeta.innerHTML = `<strong>ID:</strong> ${id} | <strong>Name:</strong> ${name} | <strong>Chars:</strong> ${chars} | <strong>Sentences:</strong> ${sentenceCount} | <strong>Changed:</strong> ${changeRate}%`;
            if (gsScoreText) gsScoreText.textContent = cleanText;

            if (gsScoreboard) {
                gsScoreboard.style.display = 'block';
                gsScoreboard.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }

            if (teleEdit) {
                teleEdit.setAttribute('contenteditable', 'false');
            }

            const payload = `${metaString}\n\n${cleanText}`;
            console.log("SUPABASE PAYLOAD:", payload);
            if (typeof window.saveResult === 'function') {
                window.saveResult(payload);
            }
        });
    }

    // ==========================================
    // 7. UNIFIED EXPORT HANDLERS (Copy, TXT, PNG)
    // ==========================================
    function sanitizeFilename(name) {
        return name.trim()
            .replace(/[\\/:*?"<>|]+/g, '_')
            .replace(/[\r\n]+/g, '_')
            .slice(0, 200) || 'score';
    }

    function downloadBlob(blob, filename) {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        setTimeout(() => {
            URL.revokeObjectURL(a.href);
            a.remove();
        }, 2000);
    }

    async function downloadScoreAsPNG(text, filename) {
        const wrapper = document.createElement('div');
        wrapper.className = 'png-export-wrapper';
        wrapper.innerHTML = text.replace(/\n/g, '<br>');
        document.body.appendChild(wrapper);

        try {
            const canvas = await html2canvas(wrapper, { scale: 2, backgroundColor: '#fff' });
            const blob = await new Promise(res => canvas.toBlob(res, 'image/png'));
            downloadBlob(blob, filename);
        } catch (err) {
            console.error(err);
            alert('PNG download failed');
        } finally {
            wrapper.remove();
        }
    }

    function hijackDownloadButton(originalBtn, getScoreText, getFilename, isText) {
        if (!originalBtn) return;
        const newBtn = originalBtn.cloneNode(true);
        originalBtn.parentNode.replaceChild(newBtn, originalBtn);

        newBtn.addEventListener('click', async e => {
            e.preventDefault();
            e.stopImmediatePropagation();

            const scoreText = getScoreText();
            if (!scoreText) {
                alert('No scoreboard data found. Submit first.');
                return;
            }

            const filename = sanitizeFilename(getFilename());
            if (isText) {
                downloadBlob(new Blob([scoreText], { type: 'text/plain' }), filename + '.txt');
            } else {
                await downloadScoreAsPNG(scoreText, filename + '.png');
            }
        }, true);
    }

    // Direct Button Handlers for standard score buttons
    if (copyScoreBtn) {
        copyScoreBtn.addEventListener('click', async () => {
            const meta = gsScoreMeta ? gsScoreMeta.textContent : '';
            const text = gsScoreText ? gsScoreText.textContent : '';
            const fullText = meta ? (meta + "\n\n" + text) : text;

            try {
                await navigator.clipboard.writeText(fullText);
                if (typeof showToast === 'function') showToast('Copied scoreboard text');
                else alert('Scoreboard text copied to clipboard!');
            } catch (e) {
                alert('Copy failed');
            }
        });
    }

    if (downloadScoreTxtBtn) {
        downloadScoreTxtBtn.addEventListener('click', () => {
            const meta = gsScoreMeta ? gsScoreMeta.textContent : '';
            const text = gsScoreText ? gsScoreText.textContent : '';
            const fullText = meta ? (meta + "\n\n" + text) : text;
            if (!fullText.trim()) return;
            downloadBlob(new Blob([fullText], { type: 'text/plain;charset=utf-8' }), 'text-section-scoreboard.txt');
        });
    }

    if (downloadScorePngBtn && typeof html2canvas === 'function') {
        downloadScorePngBtn.addEventListener('click', () => {
            const meta = gsScoreMeta ? gsScoreMeta.textContent : '';
            const text = gsScoreText ? gsScoreText.textContent : '';
            const fullText = meta ? (meta + "\n\n" + text) : text;
            if (!fullText.trim()) return;
            downloadScoreAsPNG(fullText, 'text-section-scoreboard.png');
        });
    }


    // ==========================================
    // 8. AUDIO RECORDING MODULE
    // ==========================================
    if (captureAudioBtn) {
        captureAudioBtn.addEventListener('click', async () => {
            if (!mediaRecorder || mediaRecorder.state === 'inactive') {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];

                    mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
                    mediaRecorder.onstop = () => {
                        audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                        if (downloadBlobBtn) downloadBlobBtn.disabled = false;
                        if (copyBlobBtn) copyBlobBtn.disabled = false;
                    };

                    mediaRecorder.start();
                    captureAudioBtn.textContent = 'Stop Recording';
                    captureAudioBtn.classList.add('recording');
                } catch (err) {
                    alert('Microphone access denied or unavailable.');
                }
            } else if (mediaRecorder && mediaRecorder.state === 'recording') {
                mediaRecorder.stop();
                captureAudioBtn.textContent = 'Record Audio';
                captureAudioBtn.classList.remove('recording');
            }
        });
    }

    if (downloadBlobBtn) {
        downloadBlobBtn.addEventListener('click', () => {
            if (!audioBlob) return;
            const url = URL.createObjectURL(audioBlob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'recorded-audio.webm';
            a.click();
            URL.revokeObjectURL(url);
        });
    }

if (copyBlobBtn) {
        copyBlobBtn.addEventListener('click', async () => {
            if (!audioBlob) return;
            try {
                await navigator.clipboard.write([new ClipboardItem({ 'audio/webm': audioBlob })]);
                alert('Audio recording copied to clipboard!');
            } catch (err) {
                alert('Failed to copy audio to clipboard.');
            }
        });
    }

    // ==========================================
    // 9. SPEECH-TO-TEXT (STT) DICTATION MODULE
    // ==========================================
    const sttBtn = document.getElementById('sttBtn'); 
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (sttBtn) {
        if (!SpeechRecognition) {
            sttBtn.disabled = true;
            sttBtn.title = "Speech-to-text is not supported in this browser (try Chrome/Edge).";
        } else {
            const recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = 'en-US';

            let isListening = false;

            recognition.onresult = (event) => {
                let interimTranscript = '';
                let finalTranscript = '';

                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) {
                        finalTranscript += event.results[i][0].transcript;
                    } else {
                        interimTranscript += event.results[i][0].transcript;
                    }
                }

                const editableZone = document.getElementById('editableTextZone') || teleEdit;
                if (editableZone) {
                    const currentText = editableZone.innerText || '';
                    editableZone.textContent = currentText + " " + (finalTranscript || interimTranscript);
                    
                    if (typeof window.updateTextOverlay === 'function') {
                        window.updateTextOverlay();
                    }
                }
            };

            recognition.onerror = (event) => {
                console.error("STT Error:", event.error);
                sttBtn.textContent = 'Start STT';
                sttBtn.classList.remove('recording');
                isListening = false;
            };

            recognition.onend = () => {
                if (isListening) {
                    try { recognition.start(); } catch(e) {}
                } else {
                    sttBtn.textContent = 'Start STT';
                    sttBtn.classList.remove('recording');
                }
            };

            sttBtn.addEventListener('click', () => {
                if (!isListening) {
                    try {
                        recognition.start();
                        sttBtn.textContent = 'Stop STT';
                        sttBtn.classList.add('recording');
                        isListening = true;
                    } catch (err) {
                        console.error("Failed to start speech recognition:", err);
                        alert("Microphone permission denied or speech recognition failed to start.");
                    }
                } else {
                    isListening = false;
                    recognition.stop();
                    sttBtn.textContent = 'Start STT';
                    sttBtn.classList.remove('recording');
                }
            });
        }
    }

}); 
</script>

















<script>
(function() {
    'use strict';


    /* =========================================================
       1. MC QUIZ MANIA
       ========================================================= */

    if (typeof window.getWordSet === 'undefined') {

        window.getWordSet = function(str) {

            if (!str) return new Set();

            const words =
                str.toLowerCase()
                    .match(/[\wÀ-ÿ'-]+/g) || [];

            return new Set(words);
        };
    }


    if (typeof window.cleanSectionText === 'undefined') {

        window.cleanSectionText = function(str) {

            if (!str) return "";

            let working = str;

            const first =
                working.indexOf('~');

            const last =
                working.lastIndexOf('~');

            if (
                first !== -1 &&
                last !== -1 &&
                last > first
            ) {
                working =
                    working.slice(
                        first + 1,
                        last
                    );
            }

            const lines =
                working.split(/\r?\n/);

            const validLines = [];

            for (let line of lines) {

                const trimmed =
                    line.trim();

                if (
                    trimmed === 'QUIZ' ||
                    trimmed === 'Quiz'
                ) {
                    break;
                }

                validLines.push(line);
            }

            return validLines.join('\n');
        };
    }


    if (
        typeof window.calculateFastChangePercentage ===
        'undefined'
    ) {

        window.calculateFastChangePercentage =
            function(original, current) {

                const cleanOrig =
                    window.cleanSectionText(
                        original
                    );

                const cleanCurr =
                    window.cleanSectionText(
                        current
                    );

                const origWords =
                    cleanOrig
                        .toLowerCase()
                        .match(
                            /[\wÀ-ÿ'-]+/g
                        ) || [];

                const currWords =
                    cleanCurr
                        .toLowerCase()
                        .match(
                            /[\wÀ-ÿ'-]+/g
                        ) || [];

                if (origWords.length === 0) {
                    return currWords.length > 0
                        ? 100
                        : 0;
                }

                const origMap = {};

                origWords.forEach(w => {
                    origMap[w] =
                        (origMap[w] || 0) + 1;
                });

                let matches = 0;

                currWords.forEach(w => {

                    if (
                        origMap[w] &&
                        origMap[w] > 0
                    ) {
                        matches++;
                        origMap[w]--;
                    }
                });

                const maxLen =
                    Math.max(
                        origWords.length,
                        currWords.length
                    );

                const similarity =
                    matches / maxLen;

                return Math.max(
                    0,
                    Math.min(
                        100,
                        Math.round(
                            (1 - similarity) * 100
                        )
                    )
                );
            };
    }


    /* =========================================================
       2. OVERLAY UPDATER
       ========================================================= */

    window.updateOverlay = function() {

        const teleEdit =
            document.getElementById(
                'teleEdit'
            );

        const teleOverlay =
            document.getElementById(
                'teleOverlay'
            );

        if (!teleEdit) return;


        const editableZone =
            document.getElementById(
                'editableTextZone'
            );

        let rawText = "";


        if (editableZone) {

            const lineDivs =
                editableZone.querySelectorAll(
                    '.line, p'
                );

            if (lineDivs.length > 0) {

                const lineTexts =
                    Array.from(
                        lineDivs
                    ).map(div => {

                        return div.innerHTML ===
                            '&nbsp;'
                            ? ''
                            : div.textContent;
                    });

                rawText =
                    lineTexts.join('\n');

            } else {

                rawText =
                    editableZone.innerText || '';
            }

        }


        const cleanActiveText =
            typeof window.cleanSectionText ===
            'function'
                ? window.cleanSectionText(
                    rawText
                )
                : rawText;


        const s =
            (
                cleanActiveText.match(
                    /[.!?]+/g
                ) || []
            ).length;


        let originalBaselineText = "";
        let currentChangeRate = 0;


        if (
            window.SCRAMBLE_SECTIONS &&
            typeof selectedSectionIndex !==
                'undefined' &&
            window.SCRAMBLE_SECTIONS[
                selectedSectionIndex
            ]
        ) {

            const section =
                window.SCRAMBLE_SECTIONS[
                    selectedSectionIndex
                ];

            originalBaselineText =
                section.text || "";

        } else if (
            window._currentOriginalBaseline
        ) {

            originalBaselineText =
                window._currentOriginalBaseline;
        }


        if (
            originalBaselineText &&
            typeof window.calculateFastChangePercentage ===
                'function'
        ) {

            currentChangeRate =
                window.calculateFastChangePercentage(
                    originalBaselineText,
                    cleanActiveText
                );

        } else {

            currentChangeRate = 0;
        }


        if (teleOverlay) {

            teleOverlay.textContent =
                `${cleanActiveText.length} chars · ` +
                `${s} sent · ` +
                `Changed: ${currentChangeRate}%`;
        }
    };


    /* =========================================================
       3. DOM BUILDER & SECTION LOADER
       ========================================================= */

    window.loadQuizSection = function(sectionText) {

        if (!sectionText) return;


        const teleEdit =
            document.getElementById(
                'teleEdit'
            );

        if (!teleEdit) return;


        let fullText =
            sectionText;


        const first =
            sectionText.indexOf('~');

        const last =
            sectionText.lastIndexOf('~');


        if (
            first !== -1 &&
            last !== -1 &&
            last > first
        ) {

            fullText =
                sectionText.slice(
                    first + 1,
                    last
                );
        }


        window._currentOriginalBaseline =
            window.cleanSectionText(
                fullText
            );


        const lines =
            fullText.split(/\r?\n/);


        let quizPart = "";
        let quizStartIndex = -1;


        for (
            let i = 0;
            i < lines.length;
            i++
        ) {

            const trimmed =
                lines[i].trim();

            if (
                trimmed === 'QUIZ' ||
                trimmed === 'Quiz'
            ) {

                quizStartIndex = i;
                break;
            }
        }


        if (quizStartIndex !== -1) {

            quizPart =
                lines
                    .slice(quizStartIndex)
                    .join('\n');
        }


        if (!quizPart) return;


        const quizWrapper =
            document.createElement(
                'div'
            );

        quizWrapper.id =
            'quizWrapper';

        quizWrapper.className =
            'quiz-wrapper';


        const quizBtn =
            document.createElement(
                'button'
            );

        quizBtn.id =
            'toggleQuizBtn';

        quizBtn.className =
            'quiz-toggle-btn';

        quizBtn.type =
            'button';

        quizBtn.textContent =
            'Toggle Quiz';


        const quizContent =
            document.createElement(
                'div'
            );

        quizContent.id =
            'quizSections';

        quizContent.className =
            'section quiz-sections-container';

        quizContent.style.display =
            'none';


        const rawQuizLines =
            quizPart.split(/\r?\n/);


        let subSectionsData = [];

        let currentSub = null;


        const SUBSECTION_MARKERS = [
            "Quiz",
            "Concept Quiz",
            "Context Quiz",
            "Comprehension Quiz",
            "Grammar Quiz",
            "Vocabulary Quiz"
        ];


        rawQuizLines.forEach(line => {

            const trimmed =
                line.trim();


            if (
                SUBSECTION_MARKERS.some(
                    marker =>
                        trimmed
                            .toLowerCase()
                            .startsWith(
                                marker.toLowerCase()
                            )
                )
            ) {

                currentSub = {
                    title: trimmed,
                    questions: []
                };

                subSectionsData.push(
                    currentSub
                );

            } else if (currentSub) {

                currentSub.questions.push(
                    line
                );
            }
        });


        if (
            subSectionsData.length === 0 &&
            rawQuizLines.length > 0
        ) {

            currentSub = {
                title: 'Comprehension Quiz',
                questions: rawQuizLines
            };

            subSectionsData.push(
                currentSub
            );
        }


        subSectionsData.forEach(sub => {

            const slug =
                sub.title
                    .toLowerCase()
                    .replace(/\s+/g, '-')
                    .replace(/[^\w-]/g, '');


            sub.slug =
                slug;


            let subHTML =
                `<h3 class="parsedSubheader">${sub.title}</h3>`;


            subHTML +=
                `<div class="quiz-subsection" ` +
                `data-subsection="${sub.title}" ` +
                `data-sub-slug="${slug}">`;


            /* =================================================
               MC QUIZ MANIA CONTROLS

               IMPORTANT:
               These classes are intentionally unique.

               They do NOT use:
               .quiz-submit
               .quiz-submit-btn
               .quiz-scoreboard
               .scoreboard-data
               .score-copy
               .score-txt
               .score-png
               ================================================= */

            subHTML += `
                <div class="quiz-mania-controls">

                    <input
                        type="text"
                        class="quiz-mania-id"
                        placeholder="Student ID"
                        autocomplete="off">

                    <button
                        type="button"
                        class="quiz-mania-submit">
                        Submit
                    </button>

                </div>

                <div
                    class="quiz-mania-scoreboard"
                    style="display:none;">

                    <pre
                        class="quiz-mania-score-text"></pre>

                    <div class="quiz-mania-buttons">

                        <button
                            type="button"
                            class="quiz-mania-copy">
                            Copy
                        </button>

                        <button
                            type="button"
                            class="quiz-mania-txt">
                            TXT
                        </button>

                        <button
                            type="button"
                            class="quiz-mania-png">
                            PNG
                        </button>

                    </div>

                </div>
            `;


            let qIndex = 0;


            for (
                let i = 0;
                i < sub.questions.length;
                i++
            ) {

                let line =
                    sub.questions[i];


                if (line.trim() === '') {

                    subHTML +=
                        `<div class="line quiz-blank-line">&nbsp;</div>`;

                    continue;
                }


                if (
                    !line.trim().startsWith('?')
                ) {
                    continue;
                }


                let question =
                    line
                        .trim()
                        .replace(
                            /^\?\s*/,
                            ''
                        );


                if (
                    i + 1 <
                        sub.questions.length &&
                    sub.questions[i + 1]
                        .trim()
                        .startsWith('-')
                ) {

                    question +=
                        ' ' +
                        sub.questions[i + 1]
                            .trim()
                            .replace(
                                /^-+\s*/,
                                ''
                            );

                    i++;
                }


                const options = [];

                let j =
                    i + 1;


                while (
                    j <
                        sub.questions.length &&
                    sub.questions[j]
                        .trim() !== '' &&
                    !sub.questions[j]
                        .trim()
                        .startsWith('?')
                ) {

                    options.push(
                        sub.questions[j]
                    );

                    j++;
                }


                const correctPipe =
                    options
                        .filter(
                            o =>
                                /\|.*?\|/.test(o)
                        )
                        .map(
                            o =>
                                o
                                    .replace(
                                        /\|/g,
                                        ''
                                    )
                                    .trim()
                        )
                        .join('|');


                subHTML +=
                    `<div class="exercise quiz-exercise" ` +
                    `data-correct="${correctPipe}">`;


                subHTML +=
                    `<p class="quiz-question-title">` +
                    `<strong>${qIndex + 1}. ${question}</strong>` +
                    `</p>`;


                subHTML +=
                    `<div class="quiz-options-group">`;


                options.forEach((opt, oi) => {

                    const clean =
                        opt
                            .replace(
                                /\|/g,
                                ''
                            )
                            .trim();


                    const isCorrectOption =
                        /\|.*?\|/.test(opt);


                    subHTML += `
                        <label
                            class="quiz-option-label"
                            data-is-correct="${isCorrectOption}">

                            <input
                                type="radio"
                                name="q_${slug}_${qIndex}"
                                value="${clean.replace(/"/g, '&quot;')}"
                                data-correct="${correctPipe}">

                            <span class="option-text">
                                ${String.fromCharCode(65 + oi)}) ${clean}
                            </span>

                        </label>
                    `;
                });


                subHTML +=
                    `</div>`;


                subHTML +=
                    `<div
                        class="quiz-feedback-box"
                        style="display:none; font-size:0.9em; margin-top:5px;">
                    </div>`;


                subHTML +=
                    `</div>`;


                qIndex++;

                i =
                    j - 1;
            }


            subHTML +=
                `</div>`;


            quizContent.insertAdjacentHTML(
                'beforeend',
                subHTML
            );
        });


        quizBtn.onclick =
            function() {

                if (
                    quizContent.style.display ===
                        'none' ||
                    !quizContent.style.display
                ) {

                    quizContent.style.display =
                        'block';

                    quizBtn.textContent =
                        'Hide Quiz';

                    quizBtn.classList.add(
                        'active'
                    );

                } else {

                    quizContent.style.display =
                        'none';

                    quizBtn.textContent =
                        'Toggle Quiz';

                    quizBtn.classList.remove(
                        'active'
                    );
                }
            };


        quizWrapper.appendChild(
            quizBtn
        );

        quizWrapper.appendChild(
            quizContent
        );


        teleEdit.appendChild(
            quizWrapper
        );
    };


    window.loadSectionWithLockedQuiz =
        function(sectionText) {

            const teleEdit =
                document.getElementById(
                    'teleEdit'
                );


            if (
                !sectionText ||
                !teleEdit
            ) {
                return;
            }


            let fullText =
                sectionText;


            const first =
                sectionText.indexOf('~');

            const last =
                sectionText.lastIndexOf('~');


            if (
                first !== -1 &&
                last !== -1 &&
                last > first
            ) {

                fullText =
                    sectionText.slice(
                        first + 1,
                        last
                    );
            }


            window._currentOriginalBaseline =
                window.cleanSectionText(
                    fullText
                );


            let activePart =
                fullText;


            const lines =
                fullText.split(/\r?\n/);


            let quizStartIndex = -1;


            for (
                let i = 0;
                i < lines.length;
                i++
            ) {

                const trimmed =
                    lines[i].trim();


                if (
                    trimmed === 'QUIZ' ||
                    trimmed === 'Quiz'
                ) {

                    quizStartIndex = i;
                    break;
                }
            }


            if (quizStartIndex !== -1) {

                activePart =
                    lines
                        .slice(
                            0,
                            quizStartIndex
                        )
                        .join('\n');
            }


            teleEdit.innerHTML =
                '';

            teleEdit.setAttribute(
                'contenteditable',
                'false'
            );


            /* Main Editable Reading/Writing Zone */

            const editableContainer =
                document.createElement(
                    'div'
                );

            editableContainer.id =
                'editableTextZone';

            editableContainer.className =
                'question-text editable-text-zone';

            editableContainer.setAttribute(
                'contenteditable',
                'true'
            );


            activePart
                .split(/\r?\n/)
                .forEach(line => {

                    const p =
                        document.createElement(
                            'p'
                        );

                    p.className =
                        'line';


                    if (
                        line.trim() === ''
                    ) {

                        p.innerHTML =
                            '&nbsp;';

                    } else {

                        p.textContent =
                            line;
                    }


                    editableContainer.appendChild(
                        p
                    );
                });


            teleEdit.appendChild(
                editableContainer
            );


            /* Build & attach interactive quiz section */

            window.loadQuizSection(
                sectionText
            );


            window.updateOverlay();
        };


    /* =========================================================
       4. EVENT LISTENERS & HOOK INTEGRATION
       ========================================================= */

    function initListeners() {

        const teleEditEl =
            document.getElementById(
                'teleEdit'
            );


        if (!teleEditEl) return;


        teleEditEl.addEventListener(
            'input',
            () => {
                window.updateOverlay();
            }
        );


        teleEditEl.addEventListener(
            'keydown',
            (e) => {

                if (e.key === 'Enter') {

                    const sel =
                        window.getSelection();


                    if (
                        sel &&
                        sel.rangeCount > 0
                    ) {

                        let node =
                            sel.anchorNode;

                        let inEditable =
                            false;


                        while (
                            node &&
                            node !== teleEditEl
                        ) {

                            if (
                                node &&
                                node.id ===
                                    'editableTextZone'
                            ) {

                                inEditable =
                                    true;

                                break;
                            }


                            node =
                                node
                                    ? node.parentNode
                                    : null;
                        }


                        if (inEditable) {

                            e.preventDefault();


                            const range =
                                sel.getRangeAt(0);


                            range.deleteContents();


                            const newP =
                                document.createElement(
                                    'p'
                                );

                            newP.className =
                                'line';


                            range.insertNode(
                                newP
                            );


                            range.setStartAfter(
                                newP
                            );

                            range.collapse(
                                true
                            );


                            sel.removeAllRanges();

                            sel.addRange(
                                range
                            );


                            window.updateOverlay();

                        } else {

                            e.preventDefault();
                        }
                    }
                }
            }
        );
    }


    if (
        document.readyState ===
        'loading'
    ) {

        document.addEventListener(
            'DOMContentLoaded',
            initListeners
        );

    } else {

        initListeners();
    }


    /* =========================================================
       GLOBAL CUSTOM EVENT HOOK RECEIVER
       ========================================================= */

    window.addEventListener(
        'textSectionLoaded',
        function(e) {

            if (
                e &&
                e.detail &&
                e.detail.sectionText
            ) {

                window.loadQuizSection(
                    e.detail.sectionText
                );
            }
        }
    );


    /* =========================================================
       5. MC QUIZ MANIA — SUBMISSION & SCOREBOARD

       COMPLETELY SEPARATE FROM GLOBAL SCOREBOARD

       FIRST SUBMISSION ONLY

       The quiz remains playable after submission.
       Only the first recorded result is preserved.
       ========================================================= */

    document.addEventListener(
        'click',
        function(e) {

            /* -------------------------------------------------
               ONLY MC QUIZ MANIA SUBMIT BUTTONS
               ------------------------------------------------- */

            const quizSubmitBtn =
                e.target.closest(
                    '.quiz-mania-submit'
                );


            if (!quizSubmitBtn) {
                return;
            }


            const subsection =
                quizSubmitBtn.closest(
                    '.quiz-subsection'
                );


            if (!subsection) {
                return;
            }


            e.preventDefault();
            e.stopPropagation();


            /* -------------------------------------------------
               FIRST SUBMISSION ONLY
               ------------------------------------------------- */

            if (
                subsection.dataset.firstSubmitted ===
                'true'
            ) {

                return;
            }


            /* -------------------------------------------------
               STUDENT ID
               ------------------------------------------------- */

            const studentIdInput =
                subsection.querySelector(
                    '.quiz-mania-id'
                );


            const studentId =
                studentIdInput &&
                studentIdInput.value.trim()
                    ? studentIdInput.value.trim()
                    : '';


            /* -------------------------------------------------
               RESOLVE STUDENT NAME

               Uses the separate Student Data Registry:

               window.resolveStudentNameFromId(id)
               ------------------------------------------------- */

            let studentName =
                'Student';


            if (
                typeof window.resolveStudentNameFromId ===
                'function'
            ) {

                studentName =
                    window.resolveStudentNameFromId(
                        studentId
                    );
            }


            /* -------------------------------------------------
               CALCULATE SCORE
               ------------------------------------------------- */

            const exercises =
                subsection.querySelectorAll(
                    '.quiz-exercise'
                );


            let score = 0;

            const total =
                exercises.length;


            exercises.forEach(ex => {

                const correctVal =
                    ex.getAttribute(
                        'data-correct'
                    ) || '';


                const selectedRadio =
                    ex.querySelector(
                        'input[type="radio"]:checked'
                    );


                const selectedVal =
                    selectedRadio
                        ? selectedRadio.value
                        : '';


                if (
                    selectedVal ===
                    correctVal
                ) {

                    score++;
                }
            });


            const percentage =
                total > 0
                    ? Math.round(
                        (score / total) * 100
                    )
                    : 0;


            /* -------------------------------------------------
               DATE / TIME
               ------------------------------------------------- */

            const now =
                new Date();


            const pad =
                n =>
                    String(n)
                        .padStart(
                            2,
                            '0'
                        );


            const dateString =
                `${pad(now.getDate())}/` +
                `${pad(now.getMonth() + 1)}/` +
                `${now.getFullYear()} ` +
                `${pad(now.getHours())}:` +
                `${pad(now.getMinutes())}:` +
                `${pad(now.getSeconds())}`;


            /* -------------------------------------------------
               FILE NAME
               ------------------------------------------------- */

            let filename =
                window.location.pathname
                    .split('/')
                    .pop();


            if (!filename) {
                filename =
                    'Quiz.html';
            }


            /* -------------------------------------------------
               CURRENT SECTION NAME
               ------------------------------------------------- */

            let sectionName =
                '';


            if (
                window.SCRAMBLE_SECTIONS &&
                typeof selectedSectionIndex !==
                    'undefined' &&
                window.SCRAMBLE_SECTIONS[
                    selectedSectionIndex
                ]
            ) {

                const currentSection =
                    window.SCRAMBLE_SECTIONS[
                        selectedSectionIndex
                    ];


                sectionName =
                    currentSection.name ||
                    '';
            }


            /* -------------------------------------------------
               FALLBACK: SECTION H2
               ------------------------------------------------- */

            if (!sectionName) {

                const sectionHeading =
                    subsection
                        .closest('.section')
                        ?.querySelector('h2');


                if (sectionHeading) {

                    sectionName =
                        sectionHeading
                            .textContent
                            .trim();
                }
            }


            /* -------------------------------------------------
               FALLBACK: PAGE H1
               ------------------------------------------------- */

            if (!sectionName) {

                const pageHeading =
                    document.querySelector(
                        'h1'
                    );


                if (pageHeading) {

                    sectionName =
                        pageHeading
                            .textContent
                            .trim();
                }
            }


            /* -------------------------------------------------
               FALLBACK: DOCUMENT TITLE
               ------------------------------------------------- */

            if (!sectionName) {

                sectionName =
                    document.title
                        .replace(
                            /\.(html?|php)$/i,
                            ''
                        )
                        .trim();
            }


            if (!sectionName) {

                sectionName =
                    'Quiz';
            }


            /* -------------------------------------------------
               QUIZ NAME
               ------------------------------------------------- */

            const quizName =
                subsection.getAttribute(
                    'data-subsection'
                ) || 'Quiz';


            /* -------------------------------------------------
               CLEAN PIPE-DELIMITED FIELDS
               ------------------------------------------------- */

            const cleanField =
                value =>
                    String(value || '')
                        .replace(
                            /\|/g,
                            '/'
                        )
                        .replace(
                            /\r?\n/g,
                            ' '
                        )
                        .trim();


            /* -------------------------------------------------
               FINAL COMPACT RESULT

               Example:

               Rabbit_Hole.html|The Rabbit Hole: Quiz 1|David|55555|26/09/2026 15:32:11|18/20|90%
               ------------------------------------------------- */

            const resultText =
                `${cleanField(filename)}|` +
                `${cleanField(sectionName)}: ${cleanField(quizName)}|` +
                `${cleanField(studentName)}|` +
                `${cleanField(studentId)}|` +
                `${dateString}|` +
                `${score}/${total}|` +
                `${percentage}%`;


            /* -------------------------------------------------
               MC QUIZ MANIA SCOREBOARD
               ------------------------------------------------- */

            const quizScoreboard =
                subsection.querySelector(
                    '.quiz-mania-scoreboard'
                );


            const scoreText =
                subsection.querySelector(
                    '.quiz-mania-score-text'
                );


            if (
                !quizScoreboard ||
                !scoreText
            ) {

                return;
            }


            /* -------------------------------------------------
               DISPLAY FIRST RESULT
               ------------------------------------------------- */

            scoreText.textContent =
                resultText;


            quizScoreboard.style.display =
                'block';


            /* -------------------------------------------------
               COPY
               ------------------------------------------------- */

            const copyBtn =
                subsection.querySelector(
                    '.quiz-mania-copy'
                );


            if (copyBtn) {

                copyBtn.onclick =
                    async function(ev) {

                        ev.preventDefault();
                        ev.stopPropagation();


                        const savedResult =
                            subsection.dataset.firstResult ||
                            resultText;


                        try {

                            await navigator.clipboard.writeText(
                                savedResult
                            );


                            alert(
                                'Quiz scoreboard copied to clipboard!'
                            );

                        } catch (err) {

                            alert(
                                'Unable to copy scoreboard.'
                            );
                        }
                    };
            }


            /* -------------------------------------------------
               DOWNLOAD TXT
               ------------------------------------------------- */

            const txtBtn =
                subsection.querySelector(
                    '.quiz-mania-txt'
                );


            if (txtBtn) {

                txtBtn.onclick =
                    function(ev) {

                        ev.preventDefault();
                        ev.stopPropagation();


                        const savedResult =
                            subsection.dataset.firstResult ||
                            resultText;


                        const blob =
                            new Blob(
                                [savedResult],
                                {
                                    type:
                                        'text/plain;charset=utf-8'
                                }
                            );


                        const url =
                            URL.createObjectURL(
                                blob
                            );


                        const a =
                            document.createElement(
                                'a'
                            );


                        a.href =
                            url;


                        a.download =
                            `${
                                subsection.getAttribute(
                                    'data-sub-slug'
                                ) || 'quiz'
                            }-scoreboard.txt`;


                        document.body.appendChild(
                            a
                        );


                        a.click();


                        a.remove();


                        URL.revokeObjectURL(
                            url
                        );
                    };
            }


            /* -------------------------------------------------
               DOWNLOAD PNG

               The visible scoreboard is NOT captured.

               A temporary element containing ONLY the
               recorded result is created instead.
               ------------------------------------------------- */

            const pngBtn =
                subsection.querySelector(
                    '.quiz-mania-png'
                );


            if (
                pngBtn &&
                typeof html2canvas ===
                    'function'
            ) {

                pngBtn.onclick =
                    function(ev) {

                        ev.preventDefault();
                        ev.stopPropagation();


                        const savedResult =
                            subsection.dataset.firstResult ||
                            resultText;


                        /* -------------------------------------
                           CREATE TEMPORARY CAPTURE ELEMENT
                           ------------------------------------- */

                        const capture =
                            document.createElement(
                                'div'
                            );


                        capture.textContent =
                            savedResult;


                        Object.assign(
                            capture.style,
                            {
                                position: 'fixed',
                                left: '-10000px',
                                top: '0',

                                display:
                                    'inline-block',

                                boxSizing:
                                    'border-box',

                                padding: '10px',
                                margin: '0',

                                background:
                                    '#ffffff',

                                color:
                                    '#000000',

                                fontFamily:
                                    'monospace',

                                fontSize:
                                    '14px',

                                lineHeight:
                                    '1.4',

                                whiteSpace:
                                    'pre',

                                width:
                                    'max-content',

                                maxWidth:
                                    'none',

                                border:
                                    '0'
                            }
                        );


                        document.body.appendChild(
                            capture
                        );


                        /* -------------------------------------
                           CAPTURE ONLY RESULT ELEMENT
                           ------------------------------------- */

                        html2canvas(
                            capture,
                            {
                                backgroundColor:
                                    '#ffffff',

                                scale:
                                    2
                            }
                        )
                        .then(
                            canvas => {

                                const link =
                                    document.createElement(
                                        'a'
                                    );


                                link.download =
                                    `${
                                        subsection.getAttribute(
                                            'data-sub-slug'
                                        ) || 'quiz'
                                    }-scoreboard.png`;


                                link.href =
                                    canvas.toDataURL(
                                        'image/png'
                                    );


                                document.body.appendChild(
                                    link
                                );


                                link.click();


                                link.remove();


                                capture.remove();
                            }
                        )
                        .catch(
                            err => {

                                capture.remove();


                                console.error(
                                    'MC Quiz PNG export failed:',
                                    err
                                );
                            }
                        );
                    };
            }


            /* -------------------------------------------------
               SAVE FIRST RESULT

               This is the permanent recorded result for
               this quiz subsection.

               The quiz itself remains completely playable.
               ------------------------------------------------- */

            subsection.dataset.firstSubmitted =
                'true';


            subsection.dataset.firstResult =
                resultText;

        }
    );


    /* =========================================================
       6. SAFE HOOK FOR LOADING SECTIONS BY INDEX
       ========================================================= */

    const originalLoad =
        window.loadSectionByIndex;


    window.loadSectionByIndex =
        function(index) {

            if (
                typeof selectedSectionIndex !==
                'undefined'
            ) {

                selectedSectionIndex =
                    index;
            }


            const section =
                window.SCRAMBLE_SECTIONS
                    ? window.SCRAMBLE_SECTIONS[
                        index
                    ]
                    : null;


            if (!section) {

                if (
                    typeof originalLoad ===
                    'function'
                ) {

                    originalLoad(
                        index
                    );
                }

                return;
            }


            window.loadSectionWithLockedQuiz(
                section.text
            );


            if (
                typeof renderVocabForSection ===
                'function'
            ) {

                renderVocabForSection(
                    section.name
                );
            }


            if (
                typeof currentLineIndex !==
                'undefined'
            ) {

                currentLineIndex = 0;
            }


            if (
                typeof teleScrollWrapper !==
                    'undefined' &&
                teleScrollWrapper
            ) {

                teleScrollWrapper.scrollTop =
                    0;
            }


            window.updateOverlay();
        };

})();
</script>
