<script>
/* =========================================
   UNIVERSAL RAW TEXT RESOLVER (PER BLOCK)
   ========================================= */
document.addEventListener('DOMContentLoaded', async () => {
  const teleEdit = document.getElementById('teleEdit');
  const gsWordBank = document.getElementById('gsWordBank');

  // --- LOAD RAW TEXT FOR EDITOR ---
  const editorScripts = document.querySelectorAll('script[type="text/plain"].rawText');
  for (const s of editorScripts) {
    const text = await resolveRaw(s.textContent.trim());
    teleEdit.innerText += text + "\n\n";
  }

  // --- LOAD WORDS FOR WORD BANK ---
  const wordScripts = document.querySelectorAll('script[type="text/plain"].wordBank');
  for (const s of wordScripts) {
    const words = (await resolveRaw(s.textContent.trim())).split('\n').filter(Boolean);
    words.forEach(word => {
      const sp = document.createElement('span');
      sp.className = 'word-tile';
      sp.textContent = word;
      sp.addEventListener('click', ()=> handleWordInsert(teleEdit, word));
      gsWordBank.appendChild(sp);
    });
  }

  // Initial overlay and placeholder
  if (window.rebuildLinesFromSource) window.rebuildLinesFromSource(teleEdit.innerText);
});
</script>

<script id="rawText" type="text/plain">

~ 1. The Fox and the Crow

On an early afternoon, during the summer, the crow sat on a branch and frequently looked left and right, cautiously, for she had just stolen a piece of meat.

There is a fox nearby, a clever animal who always wanders through these woods and is often smarter than those birds that ignore danger.

While the crow was sitting quietly on the branch and holding the meat in her beak, the fox, who had already planned to cleverly trick her, began approaching slowly.

He has been watching this crow for days, and he has noticed her vanity, and decided yesterday to use his own charm to steal her food.

He said, “Your feathers are stunning, aren't they? And your beauty is unmatched, isn’t it?” and then he asked, “Can your voice match your looks, my dear crow?”

The fox is now complimenting her endlessly and finally said he would be thrilled to hear her sing if she would be so kind.

He wondered whether she were going to sing now, for the entire forest, saying the animals will surely call her the Queen of Birds.

The crow would indeed love to be so admired, and at the thought she might become famous, felt she ought to prove herself.

The fox exclaimed again, “What a marvelous voice you must have! Oh! I wish I could hear it,” and so then the crow opened her beak, and the meat fell to the hungry fox.

If you listen to flattery, you may lose what you value — so think carefully before you act.

Be cautious of flattery and think before you act!

Do not trust flatterers.~

~ 2. The Hare and the Tortoise

Early one morning, during the spring, in the clearing where the animals often gathered, the Hare mocked the Tortoise’s slow steps.

There is a Hare who always boasts of being faster than that slow creature who moves carefully, and a Tortoise who rarely speaks, but is more patient than most animals.

While the Hare was laughing loudly at her speed, the Tortoise, who had already decided to challenge him, calmly suggested racing to the big tree.

They have been preparing for the race all week, the Fox has marked the course, and they started together yesterday to settle the challenge.

The Tortoise said, “My pace is steady, and I will win,” and asked, “Do you think your speed is enough, Hare?” — It is, isn’t it?

The Hare is now teasing her again, and later said he could beat her easily if she would just agree to start right away.

He said he was going to nap and then sprint, and wondered whether she would even make it halfway before he caught up.

The Tortoise would rather be slow and steady, knowing she might still win; she believes you must finish what you start, and it's necessary to keep moving.

The Hare cried, “What a surprise!” when he saw the Tortoise at the finish line, and said, “I wish I hadn’t slept!” — but she had already won and was resting.

If you underestimate others, you might lose unexpectedly — so never stop trying, and always respect your opponents.

Stay consistent and never underestimate determination!

Slow and steady wins the race.~

~ 3. The Lion in Love

Long ago, in the middle of the forest, a Lion often visited a nearby village and once demanded a woodcutter’s daughter in marriage.

There is a woodcutter who usually works near the trees, a Lion that roars loudly, and this daughter is more cautious than other girls.

While the Lion was speaking boldly to the father, the man had already thought of a way to discourage him by removing his threat.

He has been pretending to agree, has explained his condition, and told the Lion to remove his claws and teeth to marry his daughter.

The woodcutter said his daughter’s fear was strong and asked, “Would you really give up your strength for love?” — “This is wise, isn’t it?”

The father is pretending to be kind and later said the Lion could win her heart if he would prove he was gentle.

He said he was going to allow the marriage soon and wondered whether the Lion would return without his claws.

The Lion would rather lose his power than his bride, thinking he might win her, though he knew he must accept the deal because it was necessary.

The Lion cried, “What a trick this was!” and said, “I wish I hadn’t trusted him,” but the woodcutter laughed, and chased him away with a stick.

If you give up your strength for someone unworthy, you may lose more than you gain — Protect your power, and don’t be deceived by flattery.

Never sacrifice your power for those who do not truly accept you!

Love can tame the wildest nature.~

~ 4. The Mice in Council

In the past, the Mice frequently held councils at night to discuss important matters, and one day they decided to meet to address the problem of their enemy, the Cat.

There are several Mice, the ones who often gather for these councils, and the Cat, which is always dangerous, is their main enemy. This time, the cleverest Mouse was chosen as the leader.

While the Mice were discussing the best strategy, the Cat had already prowled around their holes many times, and they were wondering how to warn themselves without being caught.

The Mice have been debating for hours about what to do. They have already realized that something must be done, and they decided that to tie a bell to the Cat might be the best idea.

One Mouse said, “We must do this for our safety!” Another asked, “How will we get close enough to the Cat?” The first replied, “It’s not easy, but we must try,” don’t you think?

The leader is suggesting that the Mice should try to bell the Cat, as they are capable of coming together for this risky task.

The Mice are going to discuss the plan more thoroughly, and they will decide who among them is going to bell the Cat. They also wondered whether they could succeed in doing so.

The Mice would rather face a different threat than the Cat, but they know they must find a solution to avoid being eaten. The situation could be dangerous, but they must act quickly.

“I wish we could be braver,” one Mouse said, and added, “What if we fail?” But none of them dared to take the risk, and finally, they gave up.

If you think too much about the risks without acting, you will lose the opportunity — take action rather than waiting forever.

Do not make plans you are not willing to carry out!

It is easy to propose impossible remedies.~

~ 5. The Town Mouse and Country Mouse

One day, a Country Mouse invited his friend, the Town Mouse, to visit him and share his humble meal. In the morning, they sat together on the bare plough-lands, eating wheat-stalks and roots pulled up from the hedgerow.

There are two mice: the Country Mouse and the Town Mouse. The Town Mouse is always surrounded by luxury, while the Country Mouse frequently enjoys a simpler life in the country. This contrast made them both unique in their own way.

While they were eating their simple meal, the Town Mouse began to complain about the Country Mouse’s life. When he had tasted the wheat-stalks and roots, he said, “You live like the ants!” The Country Mouse didn’t know how to respond, but he started to think about his friend’s invitation.

The Country Mouse has been living simply for a long time, but now he thought he might like to see how the Town Mouse lived. They have both visited each other’s homes before, but the Country Mouse decided to go with his friend to the town.

The Town Mouse said, “If you come with me, you will have an ample share of my dainties!” The Country Mouse replied, “Will I really?” He was a little hesitant but wanted to try. “Sure,” said the Town Mouse, “it’s my treat!”

The Town Mouse is offering more food and says, “You can enjoy the best of everything here.” He was hoping the Country Mouse would stay longer and enjoy the feast.

The Town Mouse said, “You will come with me to town tomorrow, won’t you?” The Country Mouse wondered whether he should stay or leave immediately, and whether he would be safe in the city.

The Country Mouse would rather stay in his own comfortable, quiet home, where he feels safe. He could not see the appeal of the luxury with so many risks involved.

“I wish I had stayed home!” exclaimed the Country Mouse. “I feel so afraid of all these dangers here!” But, just as they were about to eat, they heard a loud noise and ran away to hide.

If you choose luxury at the cost of safety, you might end up losing your peace of mind. Stick to what makes you happy and don’t try to impress others.

Be content with what you have, and do not envy the lives of others!

Better a simple life in peace than luxury with danger.~

~ 6. The Shepherd's Boy and Wolf

One afternoon, while the sun was shining brightly, a Shepherd-boy was watching his flock of sheep near a small village. At that time, he often cried out, "Wolf! Wolf!" to amuse himself, though he was sometimes bored.

There is a Shepherd-boy who watches his sheep every day. The Wolf, on the other hand, is a dangerous animal who is often seen in nearby forests. This boy, although very mischievous, is used to his quiet life.

While the Shepherd-boy was taking care of the sheep, he was crying out loudly for help. When the villagers rushed to his aid, he laughed at them. He had been doing this trick for some time, and it had been amusing to him.

The Shepherd-boy had been playing with the villagers for several days before he realized the consequences. Now, when he saw the Wolf approaching, he shouted in terror. The villagers have heard his cries before, but they weren’t willing to trust him this time.

The Shepherd-boy shouted, "Please come and help me; the Wolf is killing the sheep!" But when the villagers arrived, they said, “You’ve tricked us too many times, boy.” “Are you sure this time?” they asked. “You always joke around.”

The Shepherd-boy was pleading desperately, “Please, help me! Can you not hear the sheep screaming?” But the villagers, hearing the commotion, could not bring themselves to believe him anymore.

The Shepherd-boy said, “I will never lie again!” The villagers were discussing what they were going to do about the situation. "How will we trust him now?" one of them wondered aloud.

The Shepherd-boy would rather never face the Wolf again, but he realized it was too late. He now understands that honesty is more important than joking, and that he must take responsibility for his actions.

I wish I had never lied! the Shepherd-boy cried as the Wolf began attacking his sheep. "Why did I have to trick them so many times?" he thought, filled with regret.

If you lie too many times, no one will believe you when you really need help. Always tell the truth, and others will trust you when it matters.

Always tell the truth, or no one will believe you in times of need!

Liars are not believed even when they tell the truth.~

~ 7. The Dancing Monkeys

One day, a prince had some trained monkeys that performed at his court. Every week, they would put on their show for the nobility. In the past, these monkeys had been trained diligently, but today, something unexpected happened.

There are several monkeys, and there is a prince who enjoys showcasing their talent. These monkeys are natural mimics, which makes them very effective in learning human-like movements. The prince often presents them in front of his courtiers. This makes him proud, as he has trained them better than any other.

While the monkeys were dancing on stage, they were moving gracefully in their costumes. When a mischievous courtier had decided to disrupt their performance, he took a handful of nuts from his pocket and threw them onto the stage. The monkeys, naturally, forgot their dancing and became wild, grabbing the nuts instead of performing.

The audience has been enjoying the monkeys’ dancing performances for a long time. They have seen the monkeys put on shows countless times, and each time, they applauded them. However, today, something unexpected happened. The monkeys, who were supposed to dance, began to fight over the nuts instead.

The prince, seeing the monkeys act out of character, asked the courtier, “Why did you do that?” The courtier, with a sly grin, replied, “I wanted to see how they would behave without their training.” “You’ve ruined the show!” the prince exclaimed.

The prince was speaking to the courtier, trying to understand why he had acted that way. “Can you please stop causing trouble?” the prince asked. “It is possible to enjoy the show without disrupting it.”

The prince said that in the future, he will make sure to keep the monkeys away from any distractions. “I wonder if we can prevent something like this from happening again,” he asked. “The show is going to be more controlled from now on,” he added.

The prince would like to keep his shows entertaining without distractions. It is necessary to ensure that the monkeys are not distracted again. They might perform better if they are left to focus on their dancing rather than outside interruptions.

“I wish you hadn’t ruined the show,” the prince exclaimed angrily. “But look what has happened!” The audience laughed loudly as the monkeys continued to fight for the nuts, and the spectacle quickly turned into chaos. “Now we have no performance at all!” he added.

If you act out of mischief, you might spoil something enjoyable for everyone. Always think before you act.

Never expect appearances to change true instincts!

Nature cannot be truly changed.~

~ 8. The Lion and the Mouse

One day, a lion was sleeping peacefully in the forest. In the morning, as he rested, a small mouse ran across his face, waking him up. Every time the lion slept, he never expected such an interruption.

A lion and a mouse live in the forest. There are other animals, but these two are special. The lion is strong, while the mouse is small and quick. The lion always roars loudly, whereas the mouse tends to run quietly.

While the lion was sleeping, the mouse ran across his face. When the lion had woken up, he caught the mouse in anger. The mouse, however, began pleading for his life, saying that he might help the lion in the future.

The lion has been sleeping for hours. He has never expected to be interrupted by such a small creature. After the lion let the mouse go, he hoped that the mouse would repay his kindness someday.

The mouse said to the lion, “If you spare my life, I will repay your kindness one day.” The lion laughed and let him go, saying, “Why should I expect anything from you?” But the mouse’s words stayed with him.

The mouse was pleading, saying, “I can help you in the future. Please spare me.” The lion, though surprised, was listening to the mouse’s words, but he didn’t think that such a small creature could make a difference.

After the lion was freed, the mouse said he was going to repay the lion’s kindness someday. He asked if the lion ever thought that the mouse could help him.

The lion would rather not have needed any help, but he realized that even a small mouse might be able to do something big. He had to let the mouse go, as he believed in giving others a chance.

When the lion was trapped by hunters, the mouse heard his roar. The mouse exclaimed, “I wish I could have helped you sooner!” Then, he gnawed the ropes and freed the lion. “See,” said the mouse, “I told you I could help!”

If you help others, they will remember your kindness. Don’t judge others by their size or appearance; even a small creature can make a big difference.

Never underestimate the power of kindness!

Kindness is never wasted.~

/* =========================================
   SECTION PARSER (RAW TEXT → SECTIONS)
   ========================================= */

function parseSectionsFromRaw(raw) {
  const sections = [];
  let current = null;

  raw.split(/\r?\n/).forEach(line => {
    const t = line.trim();
    if (!t) return;

    if (t.startsWith("~")) {
      current = {
        id: t.slice(1).trim().toLowerCase().replace(/\s+/g, "-"),
        name: t.slice(1).trim(),
        text: ""
      };
      sections.push(current);
      return;
    }

    if (current) {
      current.text += line + "\n";
    }
  });

  return sections;
}
function parseVocabSections(raw) {
  const sections = {};
  let current = null;

  raw.split(/\r?\n/).forEach(line => {
    const t = line.trim();
    if (!t) return;

    if (t.startsWith("~")) {
      current = t.slice(1).trim();
      sections[current] = [];
      return;
    }

    if (current && t.startsWith("•")) {
      const m = t.match(/•\s*([^\s–]+)/);
      if (m) sections[current].push(m[1]);
    }
  });

  return sections;
}

function parseVocabText(rawText) {

    .map(line => {
      const match = line.match(/•\s*([^\s–<]+)/); // capture word after bullet, before space, dash, or <br>

      return null;
    })

  /* -------------------------
     CARET & INSERT helpers
     ------------------------- */
  function insertTextAtCaretIntoElement(el, text){
    if(!el) return;
    if(el instanceof HTMLInputElement || el instanceof HTMLTextAreaElement){
      const start = el.selectionStart || 0;
      const end = el.selectionEnd || 0;
      const val = el.value || '';
      el.value = val.slice(0,start) + text + val.slice(end);
      const pos = start + text.length;
      el.setSelectionRange(pos,pos);
      el.focus();
      el.dispatchEvent(new Event('input',{bubbles:true}));
      return;
    }
    el.focus();
    const sel = window.getSelection();
    if(!sel || !sel.rangeCount){
      el.appendChild(document.createTextNode(text));
      placeCaretAtEnd(el);
      el.dispatchEvent(new Event('input',{bubbles:true}));
      return;
    }
    const range = sel.getRangeAt(0);
    range.deleteContents();
    const tn = document.createTextNode(text);
    range.insertNode(tn);
    range.setStartAfter(tn);
    range.collapse(true);
    sel.removeAllRanges();
    sel.addRange(range);
    el.dispatchEvent(new Event('input',{bubbles:true}));
  }

  function placeCaretAtEnd(el){
    el.focus();
    if(typeof window.getSelection !== 'undefined' && typeof document.createRange !== 'undefined'){
      const range = document.createRange();
      range.selectNodeContents(el);
      range.collapse(false);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
    }
  }

  function getCaretCharacterOffsetWithin(element) {
    let caretOffset = 0;
    const sel = window.getSelection();
    if(sel.rangeCount > 0) {
      const range = sel.getRangeAt(0);
      const preRange = range.cloneRange();
      preRange.selectNodeContents(element);
      preRange.setEnd(range.startContainer, range.startOffset);
      caretOffset = preRange.toString().length;
    }
    return caretOffset;
  }

  /* -------------------------
     LINE SPLITTING / WRAPPING / WIDOW BALANCING
     ------------------------- */
  function willWrap(candidate){
    if(!candidate) return false;
    const style = getComputedStyle(teleEdit);
    measure.style.fontSize = style.fontSize;
    measure.style.fontFamily = style.fontFamily;
    measure.style.fontWeight = style.fontWeight;
    measure.style.letterSpacing = style.letterSpacing;
    measure.style.padding = style.padding;
    measure.textContent = candidate;
    return measure.scrollWidth > teleScrollWrapper.clientWidth - 6;
  }

  function splitIntoSentences(paragraph){
    const s = paragraph.trim();
    if(!s) return [];
    const re = /[^.!?]+[.!?]+["')\]]*|[^.!?]+$/g;
    const matches = s.match(re);
    if(!matches) return [s];
    return matches.map(sentence=>{
      sentence = sentence.trim();
      if(!sentence) return '';
      return sentence.charAt(0).toUpperCase() + sentence.slice(1);
    });
  }

  function balanceWidows(linesArray){
    if(linesArray.length < 2) return;
    for(let i=0;i<linesArray.length-1;i++){
      const words = linesArray[i].trim().split(/\s+/).filter(Boolean);
      const nextWords = linesArray[i+1].trim().split(/\s+/).filter(Boolean);
      if(words.length>2 && nextWords.length<=1){
        const move = words.pop();
        linesArray[i] = words.join(' ');
        linesArray[i+1] = move + (linesArray[i+1] ? " " + linesArray[i+1] : "");
      }
    }
    for(let k=linesArray.length-1;k>=0;k--){
      if(!linesArray[k].trim()) linesArray.splice(k,1);
    }
  }

  function breakLongSentence(sentence){
    if(!willWrap(sentence)) return [sentence];
    const tokensRaw = sentence.split(/([,;:—–])/g);
    const clauses = [];
    for(let i=0;i<tokensRaw.length;i++){
      const t = tokensRaw[i];
      if(!t) continue;
      if(/^[,;:—–]$/.test(t) && clauses.length){
        clauses[clauses.length-1] += t;
      } else {
        clauses.push(t);
      }
    }
    const out = [];
    let current = "";
    for(let i=0;i<clauses.length;i++){
      const c = clauses[i].trim();
      if(!c) continue;
      const attempt = current ? current + " " + c : c;
      if(!willWrap(attempt)) current = attempt;
      else {
        if(current) out.push(current);
        current = c;
      }
    }
    if(current) out.push(current);

    for(let i=0;i<out.length;i++){
      while(willWrap(out[i])){
        const words = out[i].split(" ");
        let line = "";
        let j=0;
        for(; j<words.length; j++){
          const test = line ? line + " " + words[j] : words[j];
          if(willWrap(test)) break;
          line = test;
        }
        const remainder = words.slice(j).join(" ");
        out[i] = line;
        if(remainder) out.splice(i+1,0,remainder);
      }
    }

    for(let k=1;k<out.length;k++){
      const prev = out[k-1].trim();
      if(prev && !/[.!?]$/.test(prev)) out[k] = out[k].charAt(0).toUpperCase() + out[k].slice(1);
    }

    balanceWidows(out);
    return out;
  }

  function paragraphToLines(p){
    const sentences = splitIntoSentences(p);
    const final = [];
    sentences.forEach(s=>{
      if(!s.trim()) return;
      final.push(...breakLongSentence(s));
    });
    return final;
  }

  /* caret save / restore for contenteditable */
  function saveCaretPosition(container){
    const sel = window.getSelection();
    if(!sel.rangeCount) return null;
    const range = sel.getRangeAt(0);
    const preSelectionRange = range.cloneRange();
    preSelectionRange.selectNodeContents(container);
    preSelectionRange.setEnd(range.startContainer, range.startOffset);
    return preSelectionRange.toString().length;
  }

  function restoreCaretPosition(container, chars){
    container.focus();
    const sel = window.getSelection();
    sel.removeAllRanges();
    let nodeStack = [container], node, charIndex = 0, range = document.createRange();
    while(nodeStack.length){
      node = nodeStack.pop();
      if(node.nodeType === 3){
        const nextCharIndex = charIndex + node.length;
        if(chars <= nextCharIndex){
          range.setStart(node, chars - charIndex);
          range.collapse(true);
          sel.addRange(range);
          return true;
        }
        charIndex = nextCharIndex;
      } else {
        let i = node.childNodes.length - 1;
        while(i >= 0){ nodeStack.push(node.childNodes[i]); i--; }
      }
    }
    return false;
  }

 function rebuildLinesFromSource(src){

  function saveScroll(){
    const sel = window.getSelection();
    let caretOffset = 0;
    if(sel.rangeCount){
      const range = sel.getRangeAt(0);
      const preRange = range.cloneRange();
      preRange.selectNodeContents(teleEdit);
      preRange.setEnd(range.startContainer, range.startOffset);
      caretOffset = preRange.toString().length;
    }
    const scrollFraction = teleScrollWrapper.scrollTop / Math.max(teleEdit.scrollHeight - teleScrollWrapper.clientHeight, 1);
    return { caretOffset, scrollFraction };
  }

  function restoreScroll(state){
    if(!state) return;
    restoreCaret(state.caretOffset);
    const scrollTop = state.scrollFraction * (teleEdit.scrollHeight - teleScrollWrapper.clientHeight);
    teleScrollWrapper.scrollTop = scrollTop;
  }

  function restoreCaret(chars){
    teleEdit.focus();
    const sel = window.getSelection();
    sel.removeAllRanges();
    let nodeStack = [teleEdit], node, charIndex = 0, range = document.createRange();
    while(nodeStack.length){
      node = nodeStack.pop();
      if(node.nodeType === 3){
        const nextCharIndex = charIndex + node.length;
        if(chars <= nextCharIndex){
          range.setStart(node, chars - charIndex);
          range.collapse(true);
          sel.addRange(range);
          return;
        }
        charIndex = nextCharIndex;
      } else {
        for(let i=node.childNodes.length-1;i>=0;i--) nodeStack.push(node.childNodes[i]);
      }
    }
  }
}

<script>
(function() {
  const teleEdit = document.getElementById('teleEdit');
  const teleScrollWrapper = document.getElementById('teleScrollWrapper');
  const teleOverlay = document.getElementById('teleOverlay');

function loadSectionByIndex(index) {
  const section = window.SCRAMBLE_SECTIONS[index];
  if (!section) return;

  // Load section text
  teleEdit.innerText = section.text.trim();
  rebuildLinesFromSource(teleEdit.innerText);

  // Load vocab
  renderVocabForSection(section.name);

  // Reset state
  currentLineIndex = 0;
  teleScrollWrapper.scrollTop = 0;

  updateOverlay();
  updatePlaceholder();
}


  // Save scroll relative to caret
  function saveScroll() {
    const sel = window.getSelection();
    if (!sel.rangeCount) return teleScrollWrapper.scrollTop;
    const range = sel.getRangeAt(0);
    const preRange = range.cloneRange();
    preRange.selectNodeContents(teleEdit);
    preRange.setEnd(range.startContainer, range.startOffset);
    const caretOffset = preRange.toString().length;

    const totalText = teleEdit.innerText.length;
    const scrollFraction = teleScrollWrapper.scrollTop / Math.max(teleEdit.scrollHeight - teleScrollWrapper.clientHeight, 1);
    return { caretOffset, scrollFraction };
  }

  function restoreScroll(state) {
    if (!state) return;
    restoreCaret(state.caretOffset);
    const scrollTop = state.scrollFraction * (teleEdit.scrollHeight - teleScrollWrapper.clientHeight);
    teleScrollWrapper.scrollTop = scrollTop;
  }

  function restoreCaret(chars) {
    teleEdit.focus();
    const sel = window.getSelection();
    sel.removeAllRanges();
    let nodeStack = [teleEdit], node, charIndex = 0, range = document.createRange();
    while (nodeStack.length) {
      node = nodeStack.pop();
      if (node.nodeType === 3) {
        const nextCharIndex = charIndex + node.length;
        if (chars <= nextCharIndex) {
          range.setStart(node, chars - charIndex);
          range.collapse(true);
          sel.addRange(range);
          return;
        }
        charIndex = nextCharIndex;
      } else {
        for (let i = node.childNodes.length - 1; i >= 0; i--) nodeStack.push(node.childNodes[i]);
      }
    }
  }

  function rebuildLinesPreserveScroll(src) {
    const state = saveScroll();
    teleEdit.innerHTML = '';

    const paragraphs = src.split(/\n/);
    paragraphs.forEach(p => {
      const div = document.createElement('div');
      div.className = 'line';
      div.textContent = p || "\u200B"; // keep empty lines visible
      teleEdit.appendChild(div);
    });

    restoreScroll(state);
  }

  // Patch word insert to use scroll-preserving rebuild
  document.querySelectorAll('.word-tile').forEach(tile => {
    tile.addEventListener('click', () => {
      const word = tile.textContent;
      const caretOffset = getCaretCharacterOffset(teleEdit);
      const charBefore = teleEdit.innerText[caretOffset - 1] || '';
      const prefix = (charBefore === '' || charBefore === ' ' || charBefore === '\n') ? '' : ' ';
      insertTextAtCaret(teleEdit, prefix + word + ' ');
      updateOverlay();

      // Rebuild lines after insertion (optional, debounce if many words)
      rebuildLinesPreserveScroll(teleEdit.innerText);
    });
  });

  function insertTextAtCaret(el, text) {
    el.focus();
    const sel = window.getSelection();
    if (!sel || !sel.rangeCount) {
      el.appendChild(document.createTextNode(text));
      placeCaretAtEnd(el);
      return;
    }
    const range = sel.getRangeAt(0);
    range.deleteContents();
    const tn = document.createTextNode(text);
    range.insertNode(tn);
    range.setStartAfter(tn);
    range.collapse(true);
    sel.removeAllRanges();
    sel.addRange(range);
  }

  function placeCaretAtEnd(el) {
    el.focus();
    const range = document.createRange();
    range.selectNodeContents(el);
    range.collapse(false);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }

  function getCaretCharacterOffset(element) {
    let caretOffset = 0;
    const sel = window.getSelection();
    if (sel.rangeCount > 0) {
      const range = sel.getRangeAt(0);
      const preRange = range.cloneRange();
      preRange.selectNodeContents(element);
      preRange.setEnd(range.startContainer, range.startOffset);
      caretOffset = preRange.toString().length;
    }
    return caretOffset;
  }

  function updateOverlay() {
    const t = teleEdit.innerText || '';
    const s = (t.match(/[.!?]+/g) || []).length;
    teleOverlay.textContent = `${t.length} chars · ${s} sent`;
  }
})();

safeInsert(activeSpeechTarget, finalText + " ");

</script>

    if (e.touches.length > 1) e.preventDefault();

  let lastTouchTime = 0;
  function preventDoubleTap(e) {
    const now = Date.now();
    if (now - lastTouchTime < 300) {
      e.preventDefault();
    }

  // Block gesture events on iOS
  function preventGesture(e) {
    e.preventDefault();
  }

  document.addEventListener('touchstart', preventPinch, { passive: false });
  document.addEventListener('touchend', preventDoubleTap, { passive: false });
  document.addEventListener('gesturestart', preventGesture, { passive: false });
})();
