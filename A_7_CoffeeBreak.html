<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Coffee Break Timer & Music Player</title>
<style>
*{box-sizing:border-box;}
html,body{
    margin:0;
    height:100%;
    overflow:hidden;
    font-family:Arial,sans-serif;
    background:black;
    color:white;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
}
#breakModal{
    width:280px;
    background:#111;
    border:2px solid orange;
    border-radius:15px;
    color:white;
    padding:20px;
    box-shadow: 0 0 30px rgba(255,165,0,0.3);
    text-align:center;
}
#breakContent h1{
    font-size:24px;
    margin:0 0 10px 0;
    color:orange;
}
#breakTimer{
    font-size:42px;
    color:orange;
    font-weight:bold;
    margin:10px 0 20px 0;
}
.breakControls{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
}
.breakArrow{
    color:orange;
    font-size:24px;
    cursor:pointer;
    user-select:none;
}
.breakArrow:hover{
    color:#ffb347;
}
.breakControls button{
    padding:8px 16px;
    font-size:14px;
    border:none;
    border-radius:6px;
    background:orange;
    color:black;
    cursor:pointer;
    font-weight:bold;
}
.breakControls button:hover{
    background:#ffb347;
}
#instructionBtn {
    margin-top: 20px;
    background: transparent;
    border: 1px solid #555;
    color: #aaa;
    padding: 4px 10px;
    font-size: 11px;
    cursor: pointer;
    border-radius: 4px;
}
#instructionBtn:hover {
    color: white;
    border-color: white;
}
</style>
</head>
<body>

<div id="breakModal">
    <div id="breakContent">
        <h1>A Brief Pause</h1>
        <div id="breakTimer">5:00</div>
        <div class="breakControls">
            <span id="breakMinus" class="breakArrow" title="Subtract 1 Min">▼</span>
            <button id="breakStart">Restart</button>
            <span id="breakPlus" class="breakArrow" title="Add 1 Min">▲</span>
        </div>
    </div>
</div>

<button id="instructionBtn">Instructions</button>

<script>
let breakInterval = null;
let breakRemaining = 300;
let audioCtx = null;

function initAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === "suspended") {
        audioCtx.resume();
    }
}

function playBuzzer() {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = "square";
    osc.frequency.value = 900;
    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.8);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.8);
}

function renderBreak() {
    let m = Math.floor(breakRemaining / 60);
    let s = String(breakRemaining % 60).padStart(2, "0");
    document.getElementById("breakTimer").textContent = `${m}:${s}`;
}

function adjustBreakTime(amount) {
    initAudio();
    if (breakRemaining <= 0) {
        startBreak(amount > 0 ? amount : 300);
    } else {
        breakRemaining += amount;
        if (breakRemaining < 0) breakRemaining = 0;
        renderBreak();
    }
}

function startBreak(duration = 300) {
    initAudio();
    clearInterval(breakInterval);
    breakRemaining = duration;
    renderBreak();

    breakInterval = setInterval(() => {
        breakRemaining--;
        renderBreak();
        if (breakRemaining <= 0) {
            clearInterval(breakInterval);
            breakInterval = null;
            document.getElementById("breakTimer").textContent = "Time's up!";
            playBuzzer();
            breakRemaining = 0;
        }
    }, 1000);
}

document.getElementById("breakStart").onclick = () => startBreak(300);
document.getElementById("breakPlus").onclick = () => adjustBreakTime(60);
document.getElementById("breakMinus").onclick = () => adjustBreakTime(-60);

// Initial render
renderBreak();
</script>

<!-- INSTRUCTIONS MODAL -->
<div id="instModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.8); z-index:9999; align-items:center; justify-content:center;">
    <div style="background:#111; color:white; border:1px solid orange; width:90%; max-width:360px; padding:20px; border-radius:10px; font-family:sans-serif;">
        <h3 style="margin-top:0; color:orange;">Instructions</h3>
        <p style="font-size:13px; line-height:1.4;">Use the ▲ and ▼ arrows to adjust the countdown timer by 1-minute intervals. Click <b>Restart</b> to reset the break timer.</p>
        <button id="closeInst" style="background:orange; color:black; border:none; padding:6px 12px; border-radius:4px; cursor:pointer; font-weight:bold; float:right;">Close</button>
    </div>
</div>
<script>
document.getElementById("instructionBtn").onclick = () => document.getElementById("instModal").style.display = "flex";
document.getElementById("closeInst").onclick = () => document.getElementById("instModal").style.display = "none";

console.log(`© ${new Date().getFullYear()} Coffee Break Timer - Standalone Edition`);
</script>
</body>
</html>
