<script>
(function() {
    'use strict';
    const RAW_STUDENT_DATA = `
        55555|David
        55551|Matthew
        12345|Sarah
    `;
    const studentDatabase = new Map();
    RAW_STUDENT_DATA.trim().split('\n').forEach(line => {
        const [id, name] = line.split('|').map(s => s ? s.trim() : '');
        if (id && name) studentDatabase.set(id, name);
    });

    window.resolveStudentNameFromId = function(idInput) {
        if (!idInput) return "Guest";
        const trimmed = String(idInput).trim();
        if (/^(x|g|guest)$/i.test(trimmed)) {
            return "Guest";
        }
        return studentDatabase.get(trimmed) || "Guest";
    };
})();
</script>

<script>
// Flexible parser: supports both old verbose and simple "word - definition" lines
function parseVocabInput(input) {
  const lines = input.split("\n").map(l => l.trim()).filter(l => l.length > 0);
  const result = [];
  let currentWord = null;
  let currentDef = "";

  lines.forEach(line => {
    if (/^[•*-]/.test(line)) {
      if (currentWord) result.push({ word: currentWord, definition: currentDef.trim() });
      const match = line.match(/^[•*-]\s*(.+?)\s*(?:–|—|-)\s*(.+)/);
      if (match) { currentWord = match[1].trim(); currentDef = match[2].trim(); }
      else { currentWord = line.replace(/^[•*-]\s*/, ""); currentDef = ""; }
    } 
    else if (/\s[-–—]\s/.test(line)) {
      if (currentWord) {
        result.push({
          word: currentWord,
          definition: currentDef.trim()
        });
      }

      const match = line.match(/^(.+?)\s[-–—]\s(.+)$/);
      if (match) {
        currentWord = match[1].trim();
        currentDef = match[2].trim();
      }
    }
    else { 
      currentDef = currentDef ? currentDef + "<br/>" + line : line;
    }
  });
  if (currentWord) result.push({ word: currentWord, definition: currentDef.trim() });
  return result;
}

<script>
/* SECTION → FLASHCARD BRIDGE & MODAL SELECTOR LOGIC */
let vocabPairs = [];
let currentSectionName = "No Section";

(function () {
  function parseSections(raw) {
    const chunks = raw.split(/\n(?=~+)/);
    return chunks
      .map(chunk => chunk.trim())
      .filter(chunk => chunk.startsWith("~"))
      .map(chunk => {
        const lines = chunk.split("\n");
        const name = lines.shift().replace(/^~+/, "").trim();
        const text = lines.join("\n").trim();
        return { name, text };
      });
  }

  const sections = parseSections(window.__RAW_SECTION_TEXT__);
  
  window.getSelectedSectionName = () => currentSectionName;
  window.getSelectedSectionText = () => {
    const found = sections.find(s => s.name === currentSectionName);
    return found ? found.text : "";
  };

  const btn = document.getElementById("sectionSelectorBtn");
  const modalRoot = document.getElementById("sectionModalRoot");
  const modalBackdrop = document.getElementById("sectionModalBackdrop");
  const modalClose = document.getElementById("sectionModalClose");
  const listContainer = document.getElementById("sectionListContainer");

  function openModal() {
    listContainer.innerHTML = "";
    if (sections.length === 0) {
      listContainer.innerHTML = "<div style='padding:10px; text-align:center; color:#666;'>No categories found.</div>";
    } else {
      sections.forEach(sec => {
        const item = document.createElement("div");
        item.className = "section-item";
        item.textContent = sec.name;
        item.addEventListener("click", () => {
          currentSectionName = sec.name;
          btn.textContent = sec.name;
          closeModal();
          
          vocabPairs = parseVocabInput(sec.text);
          if (typeof studentSentences !== "undefined") {
            studentSentences = Array(vocabPairs.length).fill("");
          }
          if (typeof flashcardIndex !== "undefined") {
            flashcardIndex = 0;
          }
          if (typeof renderVocabList === "function") renderVocabList();
          if (typeof updateFlashcard === "function") updateFlashcard();
        });
        listContainer.appendChild(item);
      });
    }
    modalRoot.style.display = "block";
  }

  function closeModal() {
    modalRoot.style.display = "none";
  }

  if (btn) btn.addEventListener("click", openModal);
  if (modalClose) modalClose.addEventListener("click", closeModal);
  if (modalBackdrop) modalBackdrop.addEventListener("click", closeModal);

  // Initialize cleanly on load without auto-selecting the first category
  window.addEventListener("DOMContentLoaded", () => {
    currentSectionName = "No Section";
    btn.textContent = "Select a section";
    vocabPairs = [];
    if (typeof renderVocabList === "function") renderVocabList();
    if (typeof updateFlashcard === "function") updateFlashcard();
  });
})();
</script>

<script>
let studentSentences = [];
let flashcardIndex = 0;

const flashcard = document.getElementById('flashcard');
const front = flashcard.querySelector('.front');
const back = flashcard.querySelector('.back');
const exampleInput = document.getElementById('exampleInput');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const finishBtn = document.getElementById('finishBtn');
const idEl = document.getElementById('studentId');
const scoreboard = document.getElementById('scoreboard');
const scoreOutput = document.getElementById('scoreOutput');
const vocabList = document.getElementById('vocabList');
const vocabHeader = document.getElementById('vocabHeader');

function renderVocabList() {
  vocabList.innerHTML = vocabPairs.map(p =>
    `<li class="read-line">${p.word}: ${p.definition}</li>`
  ).join('');
}

vocabHeader.addEventListener('click', () => {
  vocabList.style.display = vocabList.style.display === 'none' ? 'block' : 'none';
});

function updateFlashcard() {
  if (!vocabPairs.length) {
    front.textContent = "Select a section to begin.";
    back.innerHTML = "Click 'Section' above";
    return;
  }

  front.textContent = vocabPairs[flashcardIndex].word;
  back.innerHTML = vocabPairs[flashcardIndex].definition;
  exampleInput.value = studentSentences[flashcardIndex] || '';

  prevBtn.style.display = flashcardIndex === 0 ? "none" : "inline-block";
  nextBtn.textContent =
    flashcardIndex === vocabPairs.length - 1 ? "Finish" : "Next";

  flashcard.classList.remove('flipped');
}

function checkInputs() {
  finishBtn.style.display = 'inline-block';
}

flashcard.addEventListener('click', () => flashcard.classList.toggle('flipped'));
exampleInput.addEventListener('input', () =>
  studentSentences[flashcardIndex] = exampleInput.value.trim()
);

idEl.addEventListener('input', checkInputs);

prevBtn.addEventListener('click', () => {
  if (flashcardIndex > 0) {
    flashcardIndex--;
    updateFlashcard();
  }
});

nextBtn.addEventListener('click', () => {
  if (!vocabPairs.length) return;
  studentSentences[flashcardIndex] = exampleInput.value.trim();

  if (flashcardIndex < vocabPairs.length - 1) {
    flashcardIndex++;
    updateFlashcard();
  } else {
    showScoreboard();
  }
});

function showScoreboard() {
  const rawId = idEl.value.trim();
  const sid = rawId || 'N/A';
  const resolvedName = window.resolveStudentNameFromId ? window.resolveStudentNameFromId(rawId) : "Guest";
  
  const now = new Date();
  const formattedDate =
    `${String(now.getDate()).padStart(2,'0')}/` +
    `${String(now.getMonth()+1).padStart(2,'0')}/` +
    `${now.getFullYear()} ` +
    `${String(now.getHours()).padStart(2,'0')}:` +
    `${String(now.getMinutes()).padStart(2,'0')}:` +
    `${String(now.getSeconds()).padStart(2,'0')}`;

  const fileName = window.location.pathname.split('/').pop() || 'unknown.html';
  const sectionName = window.getSelectedSectionName ? window.getSelectedSectionName() : "No Section";

  // Data string containing Name right before ID
  let output = `${fileName}|${sectionName}|${resolvedName}|${sid}|${formattedDate}`;

  // Collect only sentences that have actual user responses
  const sentenceLines = [];
  vocabPairs.forEach((p, i) => {
    const sentence = (studentSentences[i] || "").trim();
    if (sentence) {
      sentenceLines.push(`${i+1}. ${sentence}`);
    }
  });

  // Append sentences only if at least one response exists
  if (sentenceLines.length > 0) {
    output += "\n\n" + sentenceLines.join("\n");
  }

  scoreOutput.textContent = output;
  scoreboard.style.display = 'block';

  window.saveResult?.(output);
}

document.getElementById('copyBtn').addEventListener('click', () => 
  navigator.clipboard.writeText(scoreOutput.textContent).then(() => alert('Copied!'))
); 

document.getElementById('downloadTextBtn').addEventListener('click', () => {
  const rawId = idEl.value.trim() || 'N/A';
  const resolvedName = window.resolveStudentNameFromId ? window.resolveStudentNameFromId(rawId) : "Guest";
  const sectionName = window.getSelectedSectionName ? window.getSelectedSectionName() : "NoSection";
  const downloadFileName = `${resolvedName}_${rawId}_${sectionName.replace(/\s+/g, '_')}.txt`;

  const blob = new Blob([scoreOutput.textContent], {type: 'text/plain'}); 
  const a = document.createElement('a'); 
  a.href = URL.createObjectURL(blob); 
  a.download = downloadFileName; 
  a.click();
});

document.getElementById('downloadPngBtn').addEventListener('click', () => {
  const rawId = idEl.value.trim() || 'N/A';
  const resolvedName = window.resolveStudentNameFromId ? window.resolveStudentNameFromId(rawId) : "Guest";
  const sectionName = window.getSelectedSectionName ? window.getSelectedSectionName() : "NoSection";
  const downloadFileName = `${resolvedName}_${rawId}_${sectionName.replace(/\s+/g, '_')}.png`;

  const btnGroup = document.getElementById('scoreBtns'); 
  btnGroup.style.display = 'none';
  html2canvas(scoreboard).then(canvas => { 
    btnGroup.style.display = 'flex'; 
    const link = document.createElement('a'); 
    link.download = downloadFileName; 
    link.href = canvas.toDataURL('image/png'); 
    link.click(); 
  });
});
</script>
