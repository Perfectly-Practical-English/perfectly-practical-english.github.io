<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Badly Illustrated: The Ant &amp; The Grasshopper</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; 
    padding: 0;
    width: 100%;
    height: 100%;
    background: #e9e1c8; 
    color: #211d19;
    font-family: "Courier New", monospace;
    overflow: hidden !important;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .frame {
    position: relative;
    width: 100%;
    height: 100%;
    max-width: 100%;
    max-height: 100%;
    aspect-ratio: 1 / 1;
    background: #e9e1c8;
    overflow: hidden;
  }
  canvas { 
    display: block; 
    width: 100%; 
    height: 100%; 
    object-fit: contain;
  }
</style>
</head>
<body>

  <div class="frame">
    <canvas id="scene" width="500" height="500"
      aria-label="A looping, hand-drawn cartoon of the ant and the grasshopper"></canvas>
  </div>

<script>
(() => {
  const canvas = document.getElementById("scene");
  const ctx = canvas.getContext("2d");

  const W = 500, H = 500;
  const duration = 18000;
  let start = performance.now();
  let raf = 0;

  function line(points, width=5, color="#211d19") {
    ctx.beginPath();
    ctx.moveTo(points[0][0], points[0][1]);
    for (let i=1; i<points.length; i++) {
      const [x,y] = points[i];
      const [px,py] = points[i-1];
      const mx=(px+x)/2, my=(py+y)/2;
      ctx.quadraticCurveTo(px,py,mx,my);
    }
    const last=points[points.length-1];
    ctx.lineTo(last[0],last[1]);
    ctx.lineWidth=width;
    ctx.strokeStyle=color;
    ctx.lineCap="round";
    ctx.lineJoin="round";
    ctx.stroke();
  }

  function scribbleText(text, x, y, size, angle=0) {
    ctx.save();
    ctx.translate(x,y);
    ctx.rotate(angle);
    ctx.font=`900 ${size}px "Courier New", monospace`;
    ctx.lineWidth=2;
    ctx.strokeStyle="#211d19";
    ctx.fillStyle="#211d19";
    ctx.strokeText(text,0,0);
    ctx.fillText(text,0,0);
    ctx.restore();
  }

  function wobbleEllipse(x,y,rx,ry,fill,seed=0) {
    ctx.save();
    ctx.translate(x,y);
    ctx.beginPath();
    for(let i=0;i<=24;i++) {
      const a=i/24*Math.PI*2;
      const wobble=1+0.035*Math.sin(i*2.7+seed)+0.018*Math.cos(i*4.1+seed);
      const px=Math.cos(a)*rx*wobble;
      const py=Math.sin(a)*ry*wobble;
      if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
    }
    ctx.closePath();
    ctx.fillStyle=fill;
    ctx.fill();
    ctx.lineWidth=5;
    ctx.strokeStyle="#211d19";
    ctx.lineJoin="round";
    ctx.stroke();
    ctx.restore();
  }

  function background(t, isWinter) {
    ctx.fillStyle = isWinter ? "#d8e2dc" : "#e9e1c8";
    ctx.fillRect(0, 0, W, H);

    if (!isWinter) {
      wobbleEllipse(400, 80, 28, 26, "#f4df4c", 2);
      line([[370, 45], [360, 35]], 4);
      line([[430, 48], [442, 37]], 4);
      
      ctx.beginPath();
      ctx.moveTo(0, 260);
      ctx.quadraticCurveTo(120, 210, 250, 250);
      ctx.quadraticCurveTo(380, 200, 500, 245);
      ctx.lineTo(500, 500); ctx.lineTo(0, 500); ctx.closePath();
      ctx.fillStyle = "#a9bc70"; ctx.fill();
      line([[0, 260], [120, 210], [250, 250], [380, 200], [500, 245]], 5);

      ctx.beginPath();
      ctx.moveTo(0, 340);
      ctx.quadraticCurveTo(250, 320, 500, 345);
      ctx.lineTo(500, 500); ctx.lineTo(0, 500); ctx.closePath();
      ctx.fillStyle = "#c98a55"; ctx.fill();
      line([[0, 340], [250, 320], [500, 345]], 5);
    } else {
      ctx.beginPath();
      ctx.moveTo(0, 270);
      ctx.quadraticCurveTo(150, 230, 300, 265);
      ctx.quadraticCurveTo(420, 240, 500, 260);
      ctx.lineTo(500, 500); ctx.lineTo(0, 500); ctx.closePath();
      ctx.fillStyle = "#cfd8dc"; ctx.fill();
      line([[0, 270], [300, 265], [500, 260]], 5, "#211d19");

      ctx.fillStyle = "#eceff1";
      ctx.fillRect(0, 340, 500, 160);
      line([[0, 340], [500, 340]], 5, "#211d19");

      for(let i=0; i<15; i++) {
        let sx = (i * 37 + t * 0.05) % 500;
        let sy = (i * 23 + t * 0.08) % 320;
        ctx.fillStyle = "#ffffff";
        ctx.beginPath(); ctx.arc(sx, sy, 3, 0, Math.PI*2); ctx.fill();
        ctx.strokeStyle = "#211d19"; ctx.lineWidth = 1.5; ctx.stroke();
      }
    }

    if (isWinter) {
      ctx.fillStyle = "#b08968";
      ctx.fillRect(340, 220, 120, 120);
      ctx.lineWidth = 5; ctx.strokeStyle = "#211d19";
      ctx.strokeRect(340, 220, 120, 120);

      ctx.beginPath();
      ctx.moveTo(330, 220); ctx.lineTo(400, 150); ctx.lineTo(470, 220);
      ctx.closePath();
      ctx.fillStyle = "#dda15e"; ctx.fill(); ctx.stroke();

      wobbleEllipse(400, 270, 18, 18, "#f4df4c", 1);

      ctx.fillStyle = "#99582a";
      ctx.fillRect(425, 170, 20, 40);
      ctx.strokeRect(425, 170, 20, 40);
      line([[435, 160], [445, 140], [430, 120]], 3, "rgba(33,29,25,0.4)");
    }

    const g = ctx.createRadialGradient(250, 245, 125, 250, 245, 350);
    g.addColorStop(0, "rgba(35,27,20,0)");
    g.addColorStop(.72, "rgba(35,27,20,0.025)");
    g.addColorStop(1, "rgba(35,27,20,0.32)");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }

  function drawAnt(x, y, t, hasLeaf) {
    ctx.save();
    ctx.translate(x, y);
    const bob = Math.sin(t * 0.03) * 3;
    ctx.translate(0, -bob);

    wobbleEllipse(-12, -15, 8, 10, "#9c6644", 1);
    wobbleEllipse(0, -18, 10, 12, "#9c6644", 2);
    wobbleEllipse(14, -14, 12, 14, "#9c6644", 3);

    wobbleEllipse(26, -18, 8, 8, "#9c6644", 4);
    line([[28, -25], [35, -34]], 3);
    line([[32, -25], [41, -31]], 3);

    line([[-5, -6], [-8, 4], [-14, 6]], 3);
    line([[2, -6], [4, 5], [10, 6]], 3);
    line([[12, -6], [18, 4], [25, 5]], 3);

    if (hasLeaf) {
      ctx.fillStyle = "#588157";
      ctx.beginPath();
      ctx.moveTo(14, -26);
      ctx.quadraticCurveTo(35, -55, 60, -30);
      ctx.quadraticCurveTo(40, -10, 14, -26);
      ctx.closePath();
      ctx.fill();
      ctx.lineWidth = 4; ctx.strokeStyle = "#211d19"; ctx.stroke();
      line([[14, -26], [48, -32]], 3);
    }
    ctx.restore();
  }

  function drawGrasshopper(x, y, t, shivering) {
    ctx.save();
    ctx.translate(x, y);
    const shiver = shivering ? (Math.random() * 4 - 2) : Math.sin(t * 0.015) * 2;
    ctx.translate(shiver, 0);

    wobbleEllipse(0, -22, 12, 24, "#52b788", 1);
    wobbleEllipse(10, -45, 12, 11, "#52b788", 2);
    wobbleEllipse(15, -48, 4, 5, "#fffaf0", 1);
    wobbleEllipse(16, -48, 1.5, 2, "#211d19", 1);

    line([[14, -55], [24, -68]], 3);
    line([[18, -54], [31, -62]], 3);

    line([[-6, -15], [-22, -32], [-14, -5]], 5);

    if (!shivering) {
      line([[5, -28], [22, -22]], 4);
      line([[18, -32], [28, -12]], 2);
      scribbleText("♪", 32, -35, 18, 0.2);
    } else {
      scribbleText("brrr", -15, -60, 16, -0.1);
    }
    ctx.restore();
  }

  function draw(t) {
    const phase = t / duration;
    const isWinter = phase > 0.5;

    background(t, isWinter);

    let antX, hopperX;

    if (phase < 0.5) {
      const p = phase / 0.5;
      antX = 60 + p * 250;
      hopperX = 380;
      drawGrasshopper(hopperX, 360, t, false);
      drawAnt(antX, 365, t, true);

      if (p > 0.2 && p < 0.8) {
        scribbleText("fiddle-dee-dee~", 320, 280, 14, -0.1);
      }
    } else {
      const p = (phase - 0.5) / 0.5;
      antX = 390;
      hopperX = 220 - p * 30;

      drawAnt(antX, 365, t, false);
      drawGrasshopper(hopperX, 360, t, true);
    }
  }

  function frame(now) {
    const t = (now - start) % duration;
    draw(t);
    raf = requestAnimationFrame(frame);
  }

  function resizeCanvas() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const rect = canvas.getBoundingClientRect();
    canvas.width = Math.round(rect.width * dpr);
    canvas.height = Math.round(rect.height * dpr);
    ctx.setTransform(canvas.width / W, 0, 0, canvas.height / H, 0, 0);
    draw(((performance.now() - start) % duration));
  }
  window.addEventListener("resize", resizeCanvas);
  resizeCanvas();
  raf = requestAnimationFrame(frame);
})();
</script>
</body>
</html>
