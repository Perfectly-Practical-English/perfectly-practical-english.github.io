<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Control Panel</title>

<style>

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    display: flex;
    background: white;
}

/* LEFT LAUNCHER */
#launcherFrame {

    width: 390px;
    min-width: 390px;

    height: 100vh;

    border: none;

    background: #d8c2ff;
}


/* RIGHT INDEX */
#indexFrame {

    flex: 1;

    height: 100vh;

    border: none;

    background: white;
}


</style>

</head>


<body>


<iframe
    id="launcherFrame"
    src="A_Launcher.html">
</iframe>


<iframe
    id="indexFrame"
    src="index.html">
</iframe>

<script>

(function () {
    // ===== CONFIG =====
    const QR_IMAGE_URL = "PerfectlyPracticalEnglish_with_Hotspot.app.jpg"; // <-- Change to your PNG
    const BUTTON_SIZE = 20;
    const MODAL_MAX_SIZE = "80vw";

    if (document.getElementById("qrToggleButton")) return;

    // Button
    const button = document.createElement("button");
    button.id = "qrToggleButton";

    Object.assign(button.style, {
        position: "fixed",
        right: "2px",
        bottom: "2px",
        width: BUTTON_SIZE + "px",
        height: BUTTON_SIZE + "px",
        borderRadius: "50%",
        border: "1px solid #2f6d2f",
        background: "#6cbf43", // dollar-bill green
        padding: "0",
        margin: "0",
        overflow: "hidden",
        cursor: "pointer",
        zIndex: "2147483647",
        boxShadow: "0 0 4px rgba(0,0,0,.4)"
    });

    const thumb = document.createElement("img");
    thumb.src = QR_IMAGE_URL;
    thumb.alt = "QR";
    Object.assign(thumb.style, {
        width: "100%",
        height: "100%",
        objectFit: "cover",
        pointerEvents: "none"
    });

    button.appendChild(thumb);

    // Modal
    const overlay = document.createElement("div");

    Object.assign(overlay.style, {
        position: "fixed",
        inset: "0",
        display: "none",
        justifyContent: "center",
        alignItems: "center",
        background: "rgba(0,0,0,.45)",
        zIndex: "2147483647"
    });

    const img = document.createElement("img");
    img.src = QR_IMAGE_URL;
    img.alt = "QR Code";

    Object.assign(img.style, {
        maxWidth: MODAL_MAX_SIZE,
        maxHeight: "80vh",
        background: "#fff",
        padding: "12px",
        borderRadius: "8px",
        boxShadow: "0 8px 30px rgba(0,0,0,.5)"
    });

    overlay.appendChild(img);

    let open = false;

    function toggle() {
        open = !open;
        overlay.style.display = open ? "flex" : "none";
    }

    button.addEventListener("click", function (e) {
        e.stopPropagation();
        toggle();
    });

    overlay.addEventListener("click", function (e) {
        if (e.target === overlay) {
            open = false;
            overlay.style.display = "none";
        }
    });

    document.body.appendChild(button);
    document.body.appendChild(overlay);
})();
</script>



</body>
</html>
