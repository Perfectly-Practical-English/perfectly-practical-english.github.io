<!DOCTYPE html>
<html>
<head>
<title>New Control Panel</title>

<style>
html, body {
    margin:0;
    min-height:100%;
    overflow-y:auto;
    overflow-x:hidden;

    scrollbar-width:none;
    -ms-overflow-style:none;
}

body::-webkit-scrollbar {
    display:none;
}
.wrapper {
    display:flex;
    height:100vh;
}

.wrapper {
    display:flex;
    height:100vh;
}

.panel {
    height:100%;
    overflow:auto;
    scrollbar-width:none;
    -ms-overflow-style:none;
}

.panel::-webkit-scrollbar {
    display:none;
}

#leftPanel {
    flex:0 0 28%;
}

#rightPanel {
    flex:1 1 auto;
    overflow:auto;
}

#leftFrame {
    width:100%;
    height:calc(100% + 110px);
    border:0;
}

#rightFrame {
    width:100%;
    height:calc(100% + 110px);
    border:0;
}

/* keep scrolling, hide nothing here *//* Small triangular back buttons */
.back

{
    position:absolute;
    top:10px;
    left:10px;
    width:0;
    height:0;
    border-top:10px solid transparent;
    border-bottom:10px solid transparent;
    border-right:16px solid #555;
    cursor:pointer;
    z-index:20;
}

.back:hover {
    border-right-color:black;
}

<script>
(function () {

    const COLOR = "#6b3fa0";   // Same dark purple as PPE text
    const SIZE  = 18;          // Triangle size
    const OFFSET = 3;          // Distance from top/left

    document.querySelectorAll("iframe").forEach(frame => {

        // Make sure the iframe's parent can position children
        const parent = frame.parentElement;
        if (getComputedStyle(parent).position === "static") {
            parent.style.position = "relative";
        }

        const btn = document.createElement("button");

        btn.innerHTML = "◀";

        Object.assign(btn.style,{
            position:"absolute",
            top:OFFSET+"px",
            left:OFFSET+"px",
            width:SIZE+"px",
            height:SIZE+"px",

            padding:"0",
            margin:"0",

            border:"none",
            background:"transparent",

            color:COLOR,
            fontSize:"16px",
            fontWeight:"700",
            lineHeight:"1",

            cursor:"pointer",
            zIndex:"99999"
        });

        btn.title = "Back";

        btn.onclick = function(e){
            e.preventDefault();

            try{
                frame.contentWindow.history.back();
            }catch(err){
                console.log("Cannot access iframe history.", err);
            }
        };

        parent.appendChild(btn);

    });

})();
</script>

<script>
  const borderDiv = document.createElement('div');
  borderDiv.style.position = 'fixed';
  borderDiv.style.inset = '0';
  borderDiv.style.border = '10px solid #39FF14';
  borderDiv.style.boxSizing = 'border-box';
  borderDiv.style.zIndex = '9999';
  borderDiv.style.pointerEvents = 'none';
  borderDiv.style.backgroundColor = 'transparent';
  document.body.appendChild(borderDiv);
</script>

<script>

(function () {
    // ===== CONFIG =====
    const QR_IMAGE_URL = "PerfectlyPracticalEnglish_with_Hotspot.app.jpg"; // <-- Change to your PNG
    const BUTTON_SIZE = 20;
    const MODAL_MAX_SIZE = "80vw";

    if (document.getElementById("qrToggleButton")) return;

    // Button
    const button = document.createElement("button");
    button.id = "qrToggleButton";

    Object.assign(button.style, {
        position: "fixed",
        right: "2px",
        bottom: "2px",
        width: BUTTON_SIZE + "px",
        height: BUTTON_SIZE + "px",
        borderRadius: "50%",
        border: "1px solid #2f6d2f",
        background: "#6cbf43", // dollar-bill green
        padding: "0",
        margin: "0",
        overflow: "hidden",
        cursor: "pointer",
        zIndex: "2147483647",
        boxShadow: "0 0 4px rgba(0,0,0,.4)"
    });

    const thumb = document.createElement("img");
    thumb.src = QR_IMAGE_URL;
    thumb.alt = "QR";
    Object.assign(thumb.style, {
        width: "100%",
        height: "100%",
        objectFit: "cover",
        pointerEvents: "none"
    });

    button.appendChild(thumb);

    // Modal
    const overlay = document.createElement("div");

    Object.assign(overlay.style, {
        position: "fixed",
        inset: "0",
        display: "none",
        justifyContent: "center",
        alignItems: "center",
        background: "rgba(0,0,0,.45)",
        zIndex: "2147483647"
    });

    const img = document.createElement("img");
    img.src = QR_IMAGE_URL;
    img.alt = "QR Code";

    Object.assign(img.style, {
        maxWidth: MODAL_MAX_SIZE,
        maxHeight: "80vh",
        background: "#fff",
        padding: "12px",
        borderRadius: "8px",
        boxShadow: "0 8px 30px rgba(0,0,0,.5)"
    });

    overlay.appendChild(img);

    let open = false;

    function toggle() {
        open = !open;
        overlay.style.display = open ? "flex" : "none";
    }

    button.addEventListener("click", function (e) {
        e.stopPropagation();
        toggle();
    });

    overlay.addEventListener("click", function (e) {
        if (e.target === overlay) {
            open = false;
            overlay.style.display = "none";
        }
    });

    document.body.appendChild(button);
    document.body.appendChild(overlay);
})();
</script>



</body>
</html>
