<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Control Panel</title>

<style>

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    display: flex;
    background: white;
}

/* LEFT LAUNCHER */
#launcherFrame {

    width: 390px;
    min-width: 390px;

    height: 100vh;

    border: none;

    background: #d8c2ff;
}


/* RIGHT INDEX */
#indexFrame {

    flex: 1;

    height: 100vh;

    border: none;

    background: white;
}


</style>

</head>


<body>


<iframe
    id="launcherFrame"
    src="A_Launcher.html">
</iframe>


<iframe
    id="indexFrame"
    src="index.html">
</iframe>

<script>

const launcherFrame = document.getElementById("launcherFrame");
const indexFrame = document.getElementById("indexFrame");


// Two-way communication bridge
window.addEventListener("message", function(e){

    if(e.source === launcherFrame.contentWindow){

        indexFrame.contentWindow.postMessage(
            e.data,
            "*"
        );

    }


    if(e.source === indexFrame.contentWindow){

        launcherFrame.contentWindow.postMessage(
            e.data,
            "*"
        );

    }

});


(function () {

</script>

</body>
</html>
