<style>
:root {
  --bg: #f7fdfb;
  --blue: #1976d2;
  --border-thickness: 10px;
}
* { box-sizing: border-box; margin:0; padding:0; }
html,body{
  height:100%;
  background:var(--bg);
  font-family:Arial,Helvetica,sans-serif;
  color:#222;

  overflow-y: auto;     /* allow scrolling */
  overflow-x: hidden;   /* prevent sideways scroll */

  scrollbar-width: none;        /* Firefox */
}
html::-webkit-scrollbar,
body::-webkit-scrollbar {
  display: none;                /* Chrome/Safari */
}
/* Desktop (unchanged) */
body{
  padding:50px;
  padding-left:calc(50px + env(safe-area-inset-left));
  padding-right:calc(50px + env(safe-area-inset-right));
  padding-bottom:calc(50px + env(safe-area-inset-bottom));
}


/* --- MOBILE FIX HERE --- */
/* BASE CONTAINER (put this BEFORE media queries) */
.container {
  max-width: 900px;
  margin: 0 auto;

  padding-top: 10px;
  padding-right: 12px;
  padding-bottom: 12px;
  padding-left: 12px;
}

/* MOBILE */
@media (max-width: 700px) {
  body{
    padding: 8px;
    padding-left: calc(8px + env(safe-area-inset-left));
    padding-right: calc(8px + env(safe-area-inset-right));
    padding-bottom: calc(8px + env(safe-area-inset-bottom));
  }

  .container{
    max-width: 100%;
padding-top: 10px;
padding-right: 8px;
padding-bottom: 8px;
padding-left: 8px;  }
}

/* DESKTOP */
@media (min-width: 701px) {
  body{
    padding: 50px;
    padding-left: calc(50px + env(safe-area-inset-left));
    padding-right: calc(50px + env(safe-area-inset-right));
    padding-bottom: calc(50px + env(safe-area-inset-bottom));
  }
}

.header{
  text-align: center;
  font-size: 20px;
  color: var(--blue);
  font-weight: 700;
  margin-bottom: 3px;
}
.top-bar {
  display: flex;
  gap: 6px;
  flex-wrap: nowrap;
  overflow-x: auto;          /* allows scroll instead of wrapping */
  margin-bottom: 6px;
  -webkit-overflow-scrolling: touch;
}

input[type="text"]{ height:36px; padding:0 8px; border:1px solid #cfe2f7; border-radius:6px; font-size:14px; }
#gsName,#gsId,#nameField,#idField{ flex:0 0 140px; min-width:80px; }

button{ height:36px; padding:0 10px; font-size:14px; background:#1976d2; color:#fff; border:none; border-radius:6px; cursor:pointer; transition:0.12s; }
button:hover:not(:disabled){ background:#1565c0; }
button:disabled{ background:#9fbfe4; cursor:not-allowed; }

#gsMain{ display:flex; gap:6px; height:70vh; min-height:360px; }
#gsWordBank{
  flex: 0 0 110px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 8px;
  border: 1px solid #9aaed1;
  border-radius: 8px;
  background: #eaf6ff;

  /* ENABLE scrolling */
  overflow-y: auto;
  -webkit-overflow-scrolling: touch; /* smooth mobile scroll */

  /* HIDE scrollbar (Chrome/Safari/Edge) */
}
#gsWordBank::-webkit-scrollbar{
  display: none;
}

/* HIDE scrollbar (Firefox) */
#gsWordBank{
  scrollbar-width: none;
}
.word-tile{
  display: block;
  padding: 6px 8px;          /* slightly tighter */
  border: 1px solid #1976d2;
  border-radius: 6px;
  cursor: pointer;
  background: #eaf6ff;
  white-space: normal;
  word-break: break-word;
  user-select: none;

  font-size: 12px;           /* 🔥 this is the key line */
  line-height: 1.25;         /* keeps tiles compact */
}
.word-tile:hover{ background:#d0edff; }

.tele-wrapper{ width:100%; height:100%; border:1px solid #ccc; border-radius:6px; overflow:hidden; display:flex; flex-direction:column; background:#fff; position:relative; }
#teleScrollWrapper {
  overflow-y: auto;                 /* allow vertical scrolling */
  overflow-x: hidden;               /* never horizontal */
  flex-grow: 1;
  position: relative;

  scrollbar-width: none;            /* Firefox */
  -ms-overflow-style: none;         /* old Edge */
}

#teleScrollWrapper::-webkit-scrollbar {
  display: none;                    /* Chrome / Safari / iOS */
}

#teleScroll{ position:relative; top:0; transition: top 0.2s linear; }
.tele-edit{ padding:14px; font-size:18px; line-height:1.6; white-space:pre-wrap; overflow-wrap:break-word; word-break:break-word; min-height:100px; outline:none; }
.tele-edit .line {
  min-height: 1.6em; /* Forces blank lines to take up a full row instead of collapsing */
}
.tele-edit.empty::before{ color:#aaa; content:attr(data-placeholder); pointer-events:none; white-space:pre-wrap; }
.tele-overlay{ position:absolute; bottom:12px; right:12px; background:rgba(255,255,255,0.95); padding:6px 10px; border-radius:6px; font-family:monospace; font-size:12px; pointer-events:none; z-index:10; user-select:none; }

.scoreboard{ display:none; font-family:monospace; font-size:14px; background:#fff; border-radius:6px; padding:12px; margin-top:12px; border:1px solid #ddd; max-width:100%; overflow-y:auto; }
.scoreboard .text{ white-space:pre-wrap; word-break:break-word; min-height:120px; border:1px solid #ccc; padding:8px; border-radius:6px; resize:vertical; }

.controls{ display:flex; gap:6px; margin-top:8px; margin-bottom:10px; }
.controls .left{ display:flex; gap:6px; }
.controls .right{ margin-left:auto; display:flex; gap:6px; }

#speechBtn{ width:60px; height:36px; background:#1976d2; border-radius:6px; border:none; cursor:pointer; color:#fff; }
#speechBtn.recording{ background:#e53935; }
#captureAudioBtn{ width:60px; height:36px; background:#39FF14; border-radius:6px; border:none; cursor:pointer; color:#000; }
#captureAudioBtn.recording{ background:#e53935; }

.speed-buttons{ display:flex; gap:4px; margin-bottom:12px; flex-wrap:wrap; }
.speed-buttons button{ flex:1 1 auto; background:#bbb; font-weight:700; }
.speed-buttons button.active{ background:#1976d2; color:#fff; }

#green-border{ position:fixed; inset:0; border:10px solid #39FF14; box-sizing:border-box; z-index:9999; pointer-events:none; background:transparent; }

.toast{ position:fixed; top:20px; left:50%; transform:translateX(-50%); background:var(--blue); color:#fff; padding:10px 14px; border-radius:6px; display:none; z-index:10000; }

#measure{ position:absolute; visibility:hidden; white-space:nowrap; left:-99999px; top:-99999px; padding:14px; font-size:18px; line-height:1.6; font-family:Arial,Helvetica,sans-serif; }

@media(max-width:600px){

        <button data-speed="2000">Fast</button>
      </div>

    <!-- RECORDING & UTILITY CONTROLS -->
    <div class="formRow">
      <button id="highlightBtn" title="Toggle Highlight">Highlight</button>

      <button id="copyBtn" title="Copy Selected Text" onclick="
        const selectedText = window.getSelection().toString();
        if (!selectedText) {
          showToast('Please select text first');
          return;
        }
        navigator.clipboard.writeText(selectedText).then(() => {
          const toast = document.getElementById('toast');
          if(toast) { 
            toast.textContent = 'Copied selection';
            toast.style.display = 'block'; 
            setTimeout(() => toast.style.display = 'none', 2000); 
          }
        });
      ">Copy</button>
      
      <button id="audioBtn" title="Play Audio" onclick="
        const text = document.getElementById('teleEdit')?.innerText || '';
        if(text.trim() && 'speechSynthesis' in window) {
          if(window.speechSynthesis.speaking) { window.speechSynthesis.cancel(); return; }
          window.speechSynthesis.speak(new SpeechSynthesisUtterance(text));
        }
      ">Audio</button>

      <button id="speechBtn" title="Start/Stop speech">STT</button>
      <button id="captureAudioBtn" title="Start/Stop audio">🔴</button>
      <button id="submitBtn" disabled>Submit</button>

<script>
/* =========================================
   UNIVERSAL RAW TEXT RESOLVER (PER BLOCK)
   ========================================= */
document.addEventListener('DOMContentLoaded', async () => {
  const teleEdit = document.getElementById('teleEdit');
  const gsWordBank = document.getElementById('gsWordBank');

  // --- LOAD RAW TEXT FOR EDITOR ---
  const editorScripts = document.querySelectorAll('script[type="text/plain"].rawText');
  for (const s of editorScripts) {
    const text = await resolveRaw(s.textContent.trim());
    teleEdit.innerText += text + "\n\n";
  }

  // --- LOAD WORDS FOR WORD BANK ---
  const wordScripts = document.querySelectorAll('script[type="text/plain"].wordBank');
  for (const s of wordScripts) {
    const words = (await resolveRaw(s.textContent.trim())).split('\n').filter(Boolean);
    words.forEach(word => {
      const sp = document.createElement('span');
      sp.className = 'word-tile';
      sp.textContent = word;
      sp.addEventListener('click', ()=> handleWordInsert(teleEdit, word));
      gsWordBank.appendChild(sp);
    });
  }

  // Initial overlay and placeholder
  if (window.rebuildLinesFromSource) window.rebuildLinesFromSource(teleEdit.innerText);
});
</script>

<script>
/* =========================================
   SECTION PARSER (RAW TEXT → SECTIONS)
   ========================================= */

function parseSectionsFromRaw(raw) {
  const sections = [];
  let current = null;

  raw.split(/\r?\n/).forEach(line => {
    const t = line.trim();

    if (t.startsWith("~")) {
      current = {
        id: t.slice(1).trim().toLowerCase().replace(/\s+/g, "-"),
        name: t.slice(1).trim(),
        text: ""
      };
      sections.push(current);
      return;
    }

    if (current) {
      // Strip tildes from the line data, but KEEP blank lines (don't return early on empty t)
      const cleanLine = line.replace(/~/g, '');
      current.text += cleanLine + "\n";
    }
  });

  return sections;
}
function parseVocabSections(raw) {
  const sections = {};
  let current = null;

  raw.split(/\r?\n/).forEach(line => {

      } else {

    let current = "";
    for(let i=0;i<clauses.length;i++){
      const c = clauses[i].trim();
      if(!c) continue;
      const attempt = current ? current + " " + c : c;
      if(!willWrap(attempt)) current = attempt;
      else {
        if(current) out.push(current);
        current = c;
      }

  function calculateFastChangePercentage(original, current) {

      origSet.forEach(word => {

      return Math.max(0, Math.min(100, Math.round((1 - similarity) * 100)));

  // Prevent pinch-to-zoom
  function preventPinch(e) {
    if (e.touches.length > 1) e.preventDefault();
  }

  // Prevent double-tap zoom
  let lastTouchTime = 0;
  function preventDoubleTap(e) {
    const now = Date.now();
    if (now - lastTouchTime < 300) {
      e.preventDefault();
    }
    lastTouchTime = now;
  }

  // Block gesture events on iOS
  function preventGesture(e) {
    e.preventDefault();
  }

  document.addEventListener('touchstart', preventPinch, { passive: false });
  document.addEventListener('touchend', preventDoubleTap, { passive: false });
  document.addEventListener('gesturestart', preventGesture, { passive: false });
})();

        let fullText = sectionText;
        const first = sectionText.indexOf('~');
        const last = sectionText.lastIndexOf('~');
        if (first !== -1 && last !== -1 && last > first) {
            fullText = sectionText.slice(first + 1, last);
        }

        let activePart = fullText;
        let quizPart = "";
        const lines = fullText.split(/\r?\n/);
        let quizStartIndex = -1;

        for (let i = 0; i < lines.length; i++) {
            const trimmed = lines[i].trim();
            if (trimmed === 'QUIZ' || trimmed === 'Quiz') {
                quizStartIndex = i;
                break;
            }
        }

        if (quizStartIndex !== -1) {
            activePart = lines.slice(0, quizStartIndex).join('\n');
            quizPart = lines.slice(quizStartIndex).join('\n');
        }

        teleEdit.innerHTML = '';
        teleEdit.setAttribute('contenteditable', 'false');

        // 1. Main Editable Reading/Writing Zone (with full paragraph/sentence classes for speech/highlighting)
        const editableContainer = document.createElement('div');
        editableContainer.id = 'editableTextZone';
        editableContainer.className = 'question-text'; // Matches original speech selection containers
        editableContainer.setAttribute('contenteditable', 'true');
        editableContainer.style.cssText = 'outline: none; min-height: 50px;';

        activePart.split(/\r?\n/).forEach(line => {
            const p = document.createElement('p');
            p.className = 'line';
            if (line.trim() === '') {
                p.innerHTML = '&nbsp;';
            } else {
                p.textContent = line;
            }
            editableContainer.appendChild(p);
        });
        teleEdit.appendChild(editableContainer);

        // 2. Separate Quiz Container with Toggle Button & Original Quiz Parsing Logic
        if (quizPart) {
            const quizWrapper = document.createElement('div');
            quizWrapper.id = 'quizWrapper';
            quizWrapper.style.cssText = 'margin-top: 25px; border-top: 2px dashed #ccc; padding-top: 15px;';

            const quizBtn = document.createElement('button');
            quizBtn.id = 'toggleQuizBtn';
            quizBtn.type = 'button';
            quizBtn.textContent = 'Toggle Quiz';
            quizBtn.style.cssText = 'padding: 6px 14px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 4px; font-weight: bold; margin-bottom: 12px;';

            const quizContent = document.createElement('div');
            quizContent.id = 'quizSections'; // Matches your interactive quiz event listener target
            quizContent.className = 'section';
            quizContent.style.cssText = 'display: none; background: rgba(0,0,0,0.02); padding: 12px; border-radius: 6px; border: 1px solid #e0e0e0;';

            const quizLines = quizPart.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
            let subSectionsData = [];
            let currentSub = null;
            const SUBSECTION_MARKERS = ["Quiz", "Concept Quiz", "Context Quiz", "Comprehension Quiz", "Grammar Quiz", "Vocabulary Quiz"];

            quizLines.forEach(line => {
                if (SUBSECTION_MARKERS.some(marker => line.toLowerCase().startsWith(marker.toLowerCase()))) {
                    currentSub = { title: line, questions: [] };
                    subSectionsData.push(currentSub);
                } else if (currentSub) {
                    currentSub.questions.push(line);
                }
            });

            if (subSectionsData.length === 0 && quizLines.length > 0) {
                currentSub = { title: 'Comprehension Quiz', questions: quizLines };
                subSectionsData.push(currentSub);
            }

            subSectionsData.forEach(sub => {
                const slug = sub.title.toLowerCase().replace(/\s+/g, '-').replace(/[^\w-]/g, '');
                sub.slug = slug;

                let subHTML = `<h3 class="parsedSubheader">${sub.title}</h3>`;
                subHTML += `<div class="quiz-subsection" data-subsection="${sub.title}" data-sub-slug="${slug}">`;
                subHTML += `
                    <div class="top-controls" style="margin-bottom: 10px; display: flex; gap: 6px; flex-wrap: wrap;">
                        <input type="text" class="quiz-name" placeholder="Name" style="padding: 4px; border: 1px solid #ccc; border-radius: 4px;">
                        <input type="text" class="quiz-id" placeholder="ID" style="padding: 4px; border: 1px solid #ccc; border-radius: 4px;">
                        <button type="button" class="quiz-submit" style="padding: 4px 10px; cursor: pointer;">Submit</button>
                    </div>
                    <div class="quiz-scoreboard" style="display:none; width:100%; margin-bottom:12px; padding:6px; border:1px solid #9aaed1; border-radius:6px; background:#f9f9f9; font-family:monospace; font-size:12px;">
                        <pre class="scoreboard-data" style="margin:0; white-space:pre-wrap;"></pre>
                        <div class="scoreboard-buttons" style="margin-top:6px; display:flex; gap:6px;">
                            <button type="button" class="score-copy">Copy</button>
                            <button type="button" class="score-txt">TXT</button>
                            <button type="button" class="score-png">PNG</button>
                        </div>
                    </div>
                `;

                sub.questions = sub.questions.map(l => l.trim()).filter(Boolean);
                let qIndex = 0;

                for (let i = 0; i < sub.questions.length; i++) {
                    let line = sub.questions[i];
                    if (!line.startsWith('?')) continue;

                    let question = line.replace(/^\?\s*/, '');
                    if (i + 1 < sub.questions.length && sub.questions[i + 1].startsWith('-')) {
                        question += ' ' + sub.questions[i + 1].replace(/^-+\s*/, '');
                        i++;
                    }

                    const options = [];
                    let j = i + 1;
                    while (j < sub.questions.length && !sub.questions[j].startsWith('?')) {
                        options.push(sub.questions[j]);
                        j++;
                    }

                    const correctPipe = options
                        .filter(o => /\|.*?\|/.test(o))
                        .map(o => o.replace(/\|/g, '').trim())
                        .join('|');

                    subHTML += `<div class="exercise" data-correct="${correctPipe}" style="margin-bottom: 10px;">`;
                    subHTML += `<p><strong>${qIndex + 1}. ${question}</strong></p>`;

                    options.forEach((opt, oi) => {
                        const clean = opt.replace(/\|/g, '').trim();
                        subHTML += `
                            <label style="cursor: pointer; display: block; margin-left: 10px;">
                                <input type="radio" name="q_${slug}_${qIndex}" value="${clean}" data-correct="${correctPipe}">
                                ${String.fromCharCode(65 + oi)}) ${clean}
                            </label>
                        `;
                    });

                    subHTML += `</div>`;
                    qIndex++;
                    i = j - 1;
                }

                subHTML += `</div>`;
                quizContent.insertAdjacentHTML('beforeend', subHTML);
            });

            quizBtn.onclick = function() {
                if (quizContent.style.display === 'none') {
                    quizContent.style.display = 'block';
                    quizBtn.textContent = 'Hide Quiz';
                    quizBtn.style.background = '#6c757d';
                } else {
                    quizContent.style.display = 'none';
                    quizBtn.textContent = 'Toggle Quiz';
                    quizBtn.style.background = '#007bff';
                }
            };

            quizWrapper.appendChild(quizBtn);
            quizWrapper.appendChild(quizContent);
            teleEdit.appendChild(quizWrapper);
        }

        window.updateOverlay();
    };

    window.updateOverlay = function() {
        if (typeof teleEdit === 'undefined' || !teleEdit) return;

        const editableZone = document.getElementById('editableTextZone');
        let rawText = "";
        if (editableZone) {
            const lineDivs = editableZone.querySelectorAll('.line, p');
            if (lineDivs.length > 0) {
                const lineTexts = Array.from(lineDivs).map(div => {
                    return div.innerHTML === '&nbsp;' ? '' : div.textContent;
                });
                rawText = lineTexts.join('\n');
            } else {
                rawText = editableZone.innerText || '';
            }
        }
        
        const cleanActiveText = window.cleanSectionText(rawText);
        const s = (cleanActiveText.match(/[.!?]+/g) || []).length;

        let originalBaselineText = "";
        let currentChangeRate = 0;

        if (window.SCRAMBLE_SECTIONS && typeof selectedSectionIndex !== 'undefined' && window.SCRAMBLE_SECTIONS[selectedSectionIndex]) {
            const section = window.SCRAMBLE_SECTIONS[selectedSectionIndex];
            originalBaselineText = window.cleanSectionText(section.text || "");
        }

        if (originalBaselineText) {
            currentChangeRate = window.calculateFastChangePercentage(originalBaselineText, cleanActiveText);
        } else {
            currentChangeRate = 0;
        }

        if (typeof teleOverlay !== 'undefined' && teleOverlay) {
            teleOverlay.textContent = `${cleanActiveText.length} chars · ${s} sent · Changed: ${currentChangeRate}%`;
        }
    };

    if (typeof teleEdit !== 'undefined' && teleEdit) {
        teleEdit.addEventListener('input', () => {
            window.updateOverlay();
        });

        teleEdit.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const sel = window.getSelection();
                if (sel && sel.rangeCount > 0) {
                    let node = sel.anchorNode;
                    let inEditable = false;
                    while (node && node !== teleEdit) {
                        if (node.id === 'editableTextZone') {
                            inEditable = true;
                            break;
                        }
                        node = node.parentNode;
                    }
                    if (inEditable) {
                        e.preventDefault();
                        const range = sel.getRangeAt(0);
                        range.deleteContents();
                        
                        const newP = document.createElement('p');
                        newP.className = 'line';
                        newP.innerHTML = '&nbsp;';
                        
                        range.insertNode(newP);
                        range.setStartAfter(newP);
                        range.collapse(true);
                        sel.removeAllRanges();
                        sel.addRange(range);
                        window.updateOverlay();
                    } else {
                        e.preventDefault();
                    }
                }
            }
        });
    }

    if (typeof window.loadSectionByIndex === 'function') {
        window.loadSectionByIndex = function(index) {
            selectedSectionIndex = index;
            const section = window.SCRAMBLE_SECTIONS[index];
            if (!section) return;
            
            window.loadSectionWithLockedQuiz(section.text);
            if (typeof renderVocabForSection === 'function') renderVocabForSection(section.name);
            if (typeof currentLineIndex !== 'undefined') currentLineIndex = 0;
            if (typeof teleScrollWrapper !== 'undefined' && teleScrollWrapper) teleScrollWrapper.scrollTop = 0;
            window.updateOverlay();
        };
    }
})();
</script>

<script>
(function () {
    function cleanSpeechText(text) {
        text = text.replace(/\b\d+:\d+\s*/g, '');
        text = text.replace(/<br\s*\/?>/gi, ' ');
        text = text.replace(/\n+/g, ' ');
        text = text.replace(/\s+\./g, '.');
        text = text.replace(/\.(\S)/g, '. $1');
        text = text.replace(/\s+/g, ' ').trim();
        return text;
    }

    const OriginalUtterance = window.SpeechSynthesisUtterance;
    function PatchedUtterance(text) {
        return new OriginalUtterance(cleanSpeechText(text));
    }
    PatchedUtterance.prototype = OriginalUtterance.prototype;
    window.SpeechSynthesisUtterance = PatchedUtterance;
})();
</script>

const highlightBtn = document.getElementById("highlightBtn") || document.getElementById("highlightSelected");

  const sel = window.getSelection();
  if (!sel.rangeCount || sel.isCollapsed) return;

  const range = sel.getRangeAt(0);
  if (editor && !editor.contains(range.commonAncestorContainer)) return;

  // 1. Check if the selection is directly inside an existing highlight span
  let container = range.commonAncestorContainer;
  if (container.nodeType === 3) container = container.parentNode;
  
  const enclosingHighlight = container.closest(".highlight");

  if (enclosingHighlight) {
    // UNHIGHLIGHT: Unwrap the existing highlight
    const parent = enclosingHighlight.parentNode;
    while (enclosingHighlight.firstChild) {
      parent.insertBefore(enclosingHighlight.firstChild, enclosingHighlight);
    }
    enclosingHighlight.remove();
    editor.normalize();
    sel.removeAllRanges();
    return;
  }

  // 2. Check if the selection intersects any other highlights
  const allHighlights = Array.from(editor.querySelectorAll(".highlight"));
  const intersectingHighlights = allHighlights.filter(h => {
    try {
      return range.intersectsNode(h) || h.contains(range.startContainer) || h.contains(range.endContainer);
    } catch (e) {
      return false;
    }
  });

  if (intersectingHighlights.length > 0) {
    // UNHIGHLIGHT: Unwrap all intersecting highlights
    intersectingHighlights.forEach(h => {
      const parent = h.parentNode;
      if (parent) {
        while (h.firstChild) {
          parent.insertBefore(h.firstChild, h);
        }
        h.remove();
      }
    });
    editor.normalize();
    sel.removeAllRanges();
    return;
  }

  // 3. OTHERWISE: Create a new highlight
  try {
    const span = document.createElement("span");
    span.className = "highlight";
    range.surroundContents(span);
  } catch (e) {
    // Fallback for complex selections spanning multiple node boundaries
    const span = document.createElement("span");
    span.className = "highlight";
    span.appendChild(range.extractContents());
    range.insertNode(span);
  }

  editor.normalize();
  sel.removeAllRanges();
});

<!-- =========================================================
     [4] AUDIO FEEDBACK & SCORING SYSTEM (FULL ORIGINAL LOGIC)
     ========================================================= -->
<script>
(function() {
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playCorrect() { 
        audioCtx.resume().then(() => { 
            const o = audioCtx.createOscillator(); 
            const g = audioCtx.createGain(); 
            o.type = "sine"; 
            o.frequency.setValueAtTime(800, audioCtx.currentTime); 
            g.gain.setValueAtTime(0.4, audioCtx.currentTime); 
            o.connect(g); g.connect(audioCtx.destination); 
            o.start(); o.stop(audioCtx.currentTime + 0.25); 
        }); 
    }

    function playWrong() { 
        audioCtx.resume().then(() => { 
            const o = audioCtx.createOscillator(); 
            const g = audioCtx.createGain(); 
            o.type = "triangle"; 
            o.frequency.setValueAtTime(450, audioCtx.currentTime); 
            o.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.25); 
            g.gain.setValueAtTime(0.4, audioCtx.currentTime); 
            o.connect(g); g.connect(audioCtx.destination); 
            o.start(); o.stop(audioCtx.currentTime + 0.25); 
        }); 
    }

    function normalize(str){ 
        return (str || '').trim().toLowerCase().replace(/\s+/g," "); 
    }

    document.body.addEventListener('change', e => {
        const exercise = e.target.closest('.exercise');
        if (!exercise) return;

        const textInputs = Array.from(exercise.querySelectorAll("input[type='text'], textarea"));
        const selectedInputs = Array.from(exercise.querySelectorAll("input:checked"));

        const userAnswers = textInputs.length 
            ? textInputs.map(i => normalize(i.value)) 
            : selectedInputs.map(i => normalize(i.value));

        const correctAnswers = Array.from(exercise.querySelectorAll('[data-correct]'))
            .map(i => normalize(i.dataset.correct));

        const isCorrect = userAnswers.length > 0 && userAnswers.every(ans => correctAnswers.includes(ans));

        exercise.querySelectorAll('.mc-emoji').forEach(span => span.remove());

        selectedInputs.forEach(inp => {
            const lbl = inp.closest("label");
            if (lbl) {
                const span = document.createElement('span');
                span.className = "mc-emoji";
                span.style.marginLeft = "8px";
                span.textContent = isCorrect ? "😊" : "😢";
                lbl.appendChild(span);
            }
        });

        textInputs.forEach(inp => {
            const span = document.createElement('span');
            span.className = "mc-emoji";
            span.style.marginLeft = "8px";
            span.textContent = isCorrect ? "😊" : "😢";
            inp.parentNode.insertBefore(span, inp.nextSibling);
        });

        if (isCorrect) playCorrect(); else playWrong();

        if (exercise.dataset.firstResponseLocked) return;
        exercise.dataset.firstResponseLocked = 'true';

        const correctCount = isCorrect ? 1 : 0;
        exercise.dataset.score = correctCount;
        exercise.dataset.percentage = correctCount * 100;
    });

    document.body.addEventListener('click', e => {
        if (!e.target.classList.contains('quiz-submit')) return;
        const sub = e.target.closest('.quiz-subsection');
        if (!sub) return;

        const exercises = sub.querySelectorAll('.exercise');
        let correctCount = 0;
        exercises.forEach(ex => {
            correctCount += Number(ex.dataset.score || 0);
        });

        const totalExercises = exercises.length;
        const percentage = totalExercises > 0 ? Math.round((correctCount / totalExercises) * 100) : 0;

        const board = sub.querySelector('.quiz-scoreboard');
        if (board) {
            const dataEl = board.querySelector('.scoreboard-data');
            const name = sub.querySelector('.quiz-name')?.value || 'Anonymous';
            const id = sub.querySelector('.quiz-id')?.value || 'N/A';
            const section = sub.closest('.section')?.querySelector('h2')?.textContent || 'Unknown Section';
            const subsection = sub.dataset.subsection || 'Unknown Subsection';
            const now = new Date();
            const pad = n => n.toString().padStart(2,'0');
            const dateString = `${pad(now.getDate())}/${pad(now.getMonth()+1)}/${now.getFullYear()} ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
            const filename = window.location.pathname.split('/').pop();

            const resultText = `${filename}|${section.replace(/:+$/, '').trim()}: ${subsection.replace(/^:+/, '').trim()}|${name}|${id}|${dateString}|${correctCount}/${totalExercises}|${percentage}%`;
            if (dataEl) dataEl.textContent = resultText;

            if (window.saveResult) {
                window.saveResult(resultText);
            }

            board.style.display = 'block';
        }
    });
})();
</script>
