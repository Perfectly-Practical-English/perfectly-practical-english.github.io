<!DOCTYPE html>

<meta charset="UTF-8" />

<style>
  body {
    margin: 0;
    background: #d8c2ff; /* slightly darker + richer purple */
    font-family: sans-serif;
    overflow: hidden;
  }

:root {
  --tile-size: 60px;
  --gap-size: 6px;
}

  /* Wrapper for scaling */
.grid-wrapper {
    width: 100vw;
    height: calc(100vh - 70px);
    overflow: hidden;
}

  /* 5x5 GRID */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, var(--tile-size));
  gap: var(--gap-size);

  padding: var(--gap-size);

  justify-content: start;
  align-content: start;

  width: 100vw;
  height: 100vh;

  overflow: auto;
}
  /* SQUARE TILE */
.tile {
  width: 60px;
  height: 60px;

  background: #a56bff;

  border-radius: 18px;

  display: flex;
  align-items: center;
  justify-content: center;

  text-decoration: none;
  flex-shrink: 0;
}

.tile:active {
  opacity: 0.9;
  box-shadow: 0 0 0 3px rgba(255,255,255,0.3);
}

  /* CENTERED ICON */
.tile img,
.tile span {
  width: 60px;
  height: 60px;
  font-size: 60px;
}

.tile span {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 60%;
  height: 60%;
}

.flip {
  transform: scaleX(-1);
}


.title {
  margin: 0;
  padding: 8px var(--gap-size) 4px;  /* aligns with the grid */
  text-align: left;

  font-size: 1.5rem;
  font-weight: 700;
  line-height: 1.1;

  color: #6b3fa0;    /* medium dark purple */

  flex-shrink: 0;
}

.copyright {
  padding: 6px var(--gap-size) 10px;
  text-align: left;

  color: #6b3fa0;      /* Same as the title */
  font-size: 10px;
  font-weight: 400;
}

</style>
</head>

<script>
document.addEventListener("DOMContentLoaded", () => {

  const targets = [
    { parent:"#layout", content:"#layout", gap:-30 },
    { parent:"#tocContainer", content:"#tocContainer", gap:-20 },
    { parent:"#quizModal", content:"#quizModalContent", gap:-30 }
  ];

  const copyrightHTML = `
    <section class="copyrightSection">
      <div class="footer-note copyright">
        © <span class="auto-year"></span> Perfectly Practical English™. All rights reserved.
      </div>
<div id="visitor-count">Visits: loading...</div>

    </section>
  `;

  function insertCopyright(parent){
    if (!parent.querySelector(":scope > .copyrightSection")) {
      parent.insertAdjacentHTML("beforeend", copyrightHTML);
    }
  }

  function adjust(parent, content, desiredGap){

    const copyright = parent.querySelector(".copyrightSection");
    const last = content.lastElementChild;

    if (!copyright || !last) return;

    const lastBottom = last.getBoundingClientRect().bottom;
    const copyTop = copyright.getBoundingClientRect().top;

    const currentGap = copyTop - lastBottom;
    const adjust = currentGap - desiredGap;

    copyright.style.marginTop = (-adjust - 5) + "px";
  }

  function update(){

    targets.forEach(t => {

      const parent = document.querySelector(t.parent);
      const content = document.querySelector(t.content);

      if (!parent || !content) return;

      insertCopyright(parent);
      adjust(parent, content, t.gap);

    });

  }

  // set year
  document.querySelectorAll(".auto-year").forEach(el=>{
    el.textContent = new Date().getFullYear();
  });

  update();

  window.addEventListener("resize", update);

});
</script>

const items = rawData
  .trim()
  .split("\n")
  .map(line => {
    const [icon, page] = line.split("|").map(s => s.trim());
    return { icon, page };
  });

const grid = document.getElementById("grid");

items.forEach(item => {
  const a = document.createElement("a");
  a.className = "tile";
  a.href = item.page;
a.target = "_blank";


if (item.icon.includes(".png") || item.icon.includes("file://") || item.icon.includes("http")) {
  const img = document.createElement("img");
  img.src = item.icon;
  a.appendChild(img);
} else {
  const span = document.createElement("span");
  span.textContent = item.icon;
  span.style.fontSize = "2.5rem";
  span.style.lineHeight = "1";

  if (item.icon === "🐢") {
    span.classList.add("flip");
  }

  a.appendChild(span);
}

grid.appendChild(a);
});
</script>

<script>
(function () {

    const QR_IMAGE_URL = "PerfectlyPracticalEnglish_with_Hotspot.app.jpg";

    const grid = document.getElementById("grid");
    if (!grid) return;

    // Create launcher tile
    const tile = document.createElement("a");
    tile.href = "#";
    tile.className = "tile";
    tile.title = "Show QR Code";

    const span = document.createElement("span");
    span.textContent = "▦";
span.style.color = "#00E676";
    span.style.fontSize = "2.5rem";
    span.style.lineHeight = "1";

    tile.appendChild(span);
    grid.appendChild(tile);

    // Modal overlay
    const overlay = document.createElement("div");

    Object.assign(overlay.style, {
        position: "fixed",
        inset: "0",
        display: "none",
        justifyContent: "center",
        alignItems: "center",
        background: "rgba(0,0,0,.45)",
        zIndex: "2147483647"
    });

    const img = document.createElement("img");
    img.src = QR_IMAGE_URL;
    img.alt = "QR Code";

    Object.assign(img.style, {
        maxWidth: "80vw",
        maxHeight: "80vh",
        background: "#fff",
        padding: "12px",
        borderRadius: "8px",
        boxShadow: "0 8px 30px rgba(0,0,0,.5)",
        cursor: "pointer"
    });

    overlay.appendChild(img);
    document.body.appendChild(overlay);

    let open = false;

    function closeQR() {
        open = false;
        overlay.style.display = "none";
    }

    function toggleQR() {
        open = !open;
        overlay.style.display = open ? "flex" : "none";
    }

    // Open / toggle from tile
    tile.addEventListener("click", function (e) {
        e.preventDefault();
        toggleQR();
    });

    // Click outside image closes it
    overlay.addEventListener("click", function (e) {
        if (e.target === overlay) {
            closeQR();
        }
    });

    // Click image ALSO closes it (your requirement)
    img.addEventListener("click", function () {
        closeQR();
    });

})();
</script>
