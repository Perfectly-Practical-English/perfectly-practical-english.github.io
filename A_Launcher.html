<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Launcher</title>

<style>
  body {
    margin: 0;
    background: #d8c2ff; /* slightly darker + richer purple */
    font-family: sans-serif;
    overflow: hidden;
  }

:root {
  --tile-size: 60px;
  --gap-size: 6px;
}

  /* Wrapper for scaling */
  .grid-wrapper {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
  }

  /* 5x5 GRID */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, var(--tile-size));
  gap: var(--gap-size);

  padding: var(--gap-size);

  justify-content: start;
  align-content: start;

  width: 100vw;
  height: 100vh;

  overflow: auto;
}
  /* SQUARE TILE */
.tile {
  width: 60px;
  height: 60px;

  background: #a56bff;

  border-radius: 18px;

  display: flex;
  align-items: center;
  justify-content: center;

  text-decoration: none;
  flex-shrink: 0;
}

.tile:active {
  opacity: 0.9;
  box-shadow: 0 0 0 3px rgba(255,255,255,0.3);
}

  /* CENTERED ICON */
.tile img,
.tile span {
  width: 60px;
  height: 60px;
  font-size: 60px;
}

.tile span {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 60%;
  height: 60%;
}

.flip {
  transform: scaleX(-1);
}

</style>
</head>

<body>

<div class="grid-wrapper">
  <div class="grid" id="grid"></div>
</div>

<script>
const rawData = `


📖 | file:///C:/Users/User/Documents/Focus_Book_Pages/!Focus.html
🪑 | A_Seating_Chart_Optimum.html
📋 | A_Lesson_Agenda.html
🔎 | index.html
🌐 | https://perfectly-practical-english.github.io/
♠️ | V_Flash_Cards_Grade_7.html
💣 | V_Game_Word_Bombs_Grade_7.html
🫧 | V_Game_Bubbles_Grade_7.html
👾 | V_Game_Hyperspace_Word_Attack_Grade_7.html
🌸 | V_Game_Kaleidoscope_Grade_7.html
🌪️ | V_Game_Twister_Grade_7.html
🛸 | V_Game_UFO_Abduction_Grade_7.html
🟰 | V_Vocabulary_Tiles_Grade_7.html
🔠 | V_Word_Search_EFL.html
💬 | G_Parts_of_Speech_Grade_7.html
🔀 | G_Word_Scramble_Grade_7.html
🚀 | G_Game_Asteroids_Grade_7.html
✈ | G_Game_B-52_Stratofortress_Grade_7.html
🐒 | G_Game_Coconuts_Grade_7.html
👻 | G_Game_Haunted_House_Grade_7.html
⬆️ | G_Game_Sentence_Up_Grade_7.html
🍱 | G_Game_Sushi_Bar_Grade_7.html
🐜 | G_Game_Ants_Grade_7.html
🚗 | G_Game_Cars_Grade_7.html
〰️ | G_Game_Adverbs of Frequency.html
III | Tallyman.html
🛠️ | R_A_Basic_English_Toolkit.html
🦊 | R_Davids_Grammar_Fables_by_Aesop.html
📝 | W_Gamma_Food_Product_OPPO.html
🧱 | W_Word_Wall_Words_Only_Offline.html
😊 | RJ_Joke_Book.html
🔊 | file:///C:/Users/User/Documents/Focus Lessons/Audio/
⚠️ | file:///C:/Users/User/Documents/Gate Duty Thurs 16 July Fri 17 July 2026 - 2027
🎟️ | A_Digital Hall Pass.html
☕ | A_Break_Time.html
🕒 | A_Clock.html
📆 | A_My_Calendar.html
⌚ | A_My_Schedule.html




`;

const items = rawData
  .trim()
  .split("\n")
  .map(line => {
    const [icon, page] = line.split("|").map(s => s.trim());
    return { icon, page };
  });

const grid = document.getElementById("grid");

items.forEach(item => {
  const a = document.createElement("a");
  a.className = "tile";
  a.href = item.page;
a.target = "_blank";


if (item.icon.includes(".png") || item.icon.includes("file://") || item.icon.includes("http")) {
  const img = document.createElement("img");
  img.src = item.icon;
  a.appendChild(img);
} else {
  const span = document.createElement("span");
  span.textContent = item.icon;
  span.style.fontSize = "2.5rem";
  span.style.lineHeight = "1";

  if (item.icon === "🐢") {
    span.classList.add("flip");
  }

  a.appendChild(span);
}

grid.appendChild(a);
});
</script>

</body>
</html>
