<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Discussion Responses</title>

<style>
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: Arial, sans-serif;
    background: #fff;
    color: #111;
    overflow: hidden;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 10px;
  }

  .container {
    width: 100%;
    max-width: 800px;
    display: flex;
    flex-direction: column;
    height: 100%;
  }

  .headerRow {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }

  h1 {
    font-size: 20px;
    margin: 0;
    color: #222;
  }

  .downloadGroup {
    display: flex;
    gap: 6px;
    align-items: center;
  }

  #classSelect, #downloadBtn {
    padding: 6px 10px;
    font-size: 14px;
    border-radius: 6px;
    border: 1px solid #aaa;
  }

  #classSelect {
    background: #fff;
    cursor: pointer;
  }

  #downloadBtn {
    background: #007aff;
    color: white;
    border: none;
    cursor: pointer;
  }

  #downloadBtn:hover {
    background: #005bb5;
  }

  /* THREAD DISPLAY */
  #thread {
    flex: 1;
    height: 85vh;
    overflow-y: auto;
    border: 2px solid #39FF14;
    border-radius: 6px;
    padding: 12px;
    background: #fafafa;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .post {
    border-bottom: 1px solid #ddd;
    padding: 8px 0;
  }

  .postHeader {
    display: flex;
    justify-content: space-between;
    font-size: 14px;
    color: #444;
  }

  .postName {
    font-weight: bold;
    color: #222;
  }

  .postBody {
    font-size: 16px;
    margin-top: 4px;
    white-space: pre-wrap;
  }

  /* CLEAN SCROLLBAR */
  #thread::-webkit-scrollbar {
    width: 8px;
  }

  #thread::-webkit-scrollbar-thumb {
    background: #39FF14;
    border-radius: 10px;
  }
</style>
</head>

<body>

<div class="container">
  <div class="headerRow">
    <h1>Live Class Thread</h1>
    <div class="downloadGroup">
      <select id="classSelect">
        <option value="Select Class">Select Class</option>
        <option value="11.1">11.1</option>
        <option value="13.2">13.2</option>
        <option value="14.1">14.1</option>
        <option value="15.3">15.3</option>
        <option value="16.2">16.2</option>
      </select>
      <button id="downloadBtn">Save</button>
    </div>
  </div>
  <div id="thread"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const supabaseClient = supabase.createClient(
  "https://etwwriloppklhhkmswpr.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV0d3dyaWxvcHBrbGhoa21zd3ByIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg1NDM3NTcsImV4cCI6MjA5NDExOTc1N30.rmquTqYW6WqS7jZUbHM_gWecka3jkiWzYb14eJ10hpQ"
);

const thread = document.getElementById("thread");
const classSelect = document.getElementById("classSelect");
const downloadBtn = document.getElementById("downloadBtn");

let allPostsData = [];

/* RENDER */
function renderPost(p) {
  const div = document.createElement("div");
  div.className = "post";

  const header = document.createElement("div");
  header.className = "postHeader";

  const name = document.createElement("span");
  name.className = "postName";
  name.textContent = `${p.name} (${p.student_id})`;

  const time = document.createElement("span");
  time.textContent = p.time;

  header.appendChild(name);
  header.appendChild(time);

  const body = document.createElement("div");
  body.className = "postBody";
  body.textContent = p.message;

  div.appendChild(header);
  div.appendChild(body);

  thread.appendChild(div);
  thread.scrollTop = thread.scrollHeight;
}

/* LOAD THREAD */
async function loadThread() {
  const { data, error } = await supabaseClient
    .from("instant_input")
    .select("entry")
    .order("created_at", { ascending: true });

  if (error) {
    console.error("Load error:", error);
    return;
  }

  allPostsData = data;
  thread.innerHTML = "";

  for (const row of data) {
    try {
      const post = typeof row.entry === 'string' ? JSON.parse(row.entry) : row.entry;
      renderPost(post);
    } catch (e) {
      console.warn("Bad row:", row.entry);
    }
  }
}

/* DOWNLOAD HANDLER */
downloadBtn.onclick = () => {
  if (allPostsData.length === 0) {
    alert("No posts available to download.");
    return;
  }

  let fileContent = "";
  for (const row of allPostsData) {
    try {
      const p = typeof row.entry === 'string' ? JSON.parse(row.entry) : row.entry;
      fileContent += `[${p.time}] ${p.name} (${p.student_id}):\n${p.message}\n\n----------------------------------------\n\n`;
    } catch (e) {
      // Skip invalid rows
    }
  }

  const selectedClass = classSelect.value.replace(/\s+/g, '');
  const dateStr = new Date().toISOString().slice(0, 10);
  const filename = `${selectedClass}_${dateStr}.txt`;

  const blob = new Blob([fileContent], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
};

/* INIT & REALTIME SUBSCRIPTION */
loadThread();

supabaseClient
  .channel('public:instant_input')
  .on(
    'postgres_changes',
    { event: 'INSERT', schema: 'public', table: 'instant_input' },
    (payload) => {
      try {
        allPostsData.push(payload.new);
        const post = typeof payload.new.entry === 'string' ? JSON.parse(payload.new.entry) : payload.new.entry;
        renderPost(post);
      } catch (e) {
        console.warn("Realtime parse error:", e);
      }
    }
  )
  .subscribe();
</script>

</body>
</html>
