// --- Natural Starfield ---
const canvas = document.getElementById('terrainCanvas');
const ctx = canvas.getContext('2d');

function resizeCanvas() {
  canvas.width = canvas.clientWidth;
  canvas.height = canvas.clientHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

const stars = [];
const starCount = 500; // Dense, rich starfield

for (let i = 0; i < starCount; i++) {
  // Create natural size distribution (mostly small, few large)
  let rand = Math.random();
  let size, alpha, speedMultiplier;

  if (rand < 0.70) {
    // 70% Small, distant stars
    size = Math.random() * 0.8 + 0.6; // 0.6 to 1.4px
    alpha = Math.random() * 0.4 + 0.3; // Dimmer
    speedMultiplier = 0.3;
  } else if (rand < 0.92) {
    // 22% Medium stars
    size = Math.random() * 1.0 + 1.5; // 1.5 to 2.5px
    alpha = Math.random() * 0.4 + 0.6; // Moderately bright
    speedMultiplier = 0.6;
  } else {
    // 8% Large, bright foreground stars
    size = Math.random() * 1.5 + 2.5; // 2.5 to 4.0px
    alpha = 1.0; // Fully bright
    speedMultiplier = 1.0;
  }

  stars.push({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    size: size,
    alpha: alpha,
    speed: speedMultiplier
  });
}

function drawStarfield() {
  ctx.fillStyle = 'black';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  for (let s of stars) {
    // Increased base speed multiplier from 0.4 to 1.2 for faster movement
    s.x -= 1.2 * s.speed; 
    
    if (s.x < 0) {
      s.x = canvas.width;
      s.y = Math.random() * canvas.height;
    }

    ctx.fillStyle = `rgba(255, 255, 255, ${s.alpha})`;
    
    if (s.size > 2) {
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.size / 2, 0, Math.PI * 2);
      ctx.fill();
    } else {
      ctx.fillRect(s.x, s.y, s.size, s.size);
    }
  }
  requestAnimationFrame(drawStarfield);
}drawStarfield();

    const lines = sectionText
      .split("\n")
      .map(s => s.trim())
      .filter(line => line && line.includes("|"));

    // Divide entries into fixed groups of 3
    const groups = [];
    for (let i = 0; i < lines.length; i += 3) {
      const group = lines.slice(i, i + 3);
      if (group.length > 0) groups.push(group);
    }

    const generatedQuestions = [];
    groups.forEach((group, groupIndex) => {
      group.forEach((entryLine, itemIndex) => {
        // Skip question generation for Entry 21 (3rd item in Group 7, if present)
        if (groupIndex === 6 && itemIndex === 2) return;

        const match = entryLine.match(/\|([^\|]+)\|/);
        const correctAnswer = match ? match[1] : "";

        // Distractors exclusively from the other entries in the same group
        let distractors = group
          .filter((_, idx) => idx !== itemIndex)
          .map(e => {
            const m = e.match(/\|([^\|]+)\|/);
            return m ? m[1] : "";
          })
          .filter(Boolean);

        // If the group is short (e.g., last group with only 2 items), borrow an extra distractor from the first group
        if (distractors.length < 2 && groups.length > 0) {
          const firstGroup = groups[0];
          for (const g1Entry of firstGroup) {
            const m1 = g1Entry.match(/\|([^\|]+)\|/);

              distractors.push(m1[1]);

        choices.sort(() => Math.random() - 0.5);

          choices: choices
        });
      });

      .map(chunk => {
        const lines = chunk.split("\n");
        const name = lines.shift().replace(/^~+/, "").trim();
        const text = lines.join("\n").trim();
        const words = [];
        text.split("\n").forEach(line => {
          const matches = line.match(/\|(.+?)\|/g);
          if (matches) {
            matches.forEach(m => words.push(m.replace(/\|/g, "")));
          }
        });
        return { name, text, words: [...new Set(words)] };
      });
  }

  sectionData = parseSections(window.__RAW_SECTION_TEXT__);

  let currentSectionName = 'No Section';
  let wordList = [];

  const btn = document.getElementById("sectionSelectorBtn");
  const modalRoot = document.getElementById("sectionModalRoot");
  const modalBackdrop = document.getElementById("sectionModalBackdrop");
  const modalClose = document.getElementById("sectionModalClose");
  const listContainer = document.getElementById("sectionListContainer");

  function openModal() {
    listContainer.innerHTML = "";
    if (sectionData.length === 0) {
      listContainer.innerHTML = "<div style='padding:10px; text-align:center; color:#666;'>No categories found.</div>";
    } else {
      sectionData.forEach((sec, index) => {
        const item = document.createElement("div");
        item.className = "section-item";
        item.textContent = sec.name;
        item.addEventListener("click", () => {
          currentSectionName = sec.name;
          wordList = sec.words;
          btn.textContent = sec.name;
          closeModal();
          rebuildMCPool(sec.text);
          window.dispatchEvent(new CustomEvent("sectionchange", {
            detail: {
              index: index + 1,
              name: sec.name,
              text: sec.text
            }
          }));
          startGame();
        });
        listContainer.appendChild(item);
      });
    }
    modalRoot.style.display = "block";
  }

  function closeModal() {
    modalRoot.style.display = "none";
  }

  if (btn) btn.addEventListener("click", openModal);
  if (modalClose) modalClose.addEventListener("click", closeModal);
  if (modalBackdrop) modalBackdrop.addEventListener("click", closeModal);

  window.getSelectedSectionText = function () {
    const sec = sectionData.find(s => s.name === currentSectionName);
    return sec ? sec.text : "";
  };
})();

<script>
let sentences = [];
let contentReady = false;
window.sentences = sentences;
let allCorrectAnswers = [];
let mcOptionCount = 8;

(async () => {
  try {
    const raw = await resolveRaw(wordListSource);

})();

const gameArea=document.getElementById('gameArea');
const typedDisplay=document.getElementById('typedDisplay');
const mcButtonsContainer=document.getElementById('mcButtonsContainer');

const submitBtn=document.getElementById('submitBtn');
const idInput=document.getElementById('idInput');
const scoreboardContainer=document.getElementById('scoreboardContainer');
const scoreButtons=document.getElementById('scoreButtons');
const popSound=document.getElementById('popSound');
const plane=document.getElementById('plane');

let activeSentences=[], dropInterval=null, dropTickTime=25, gameStarted=false;
let totalWords=0, correctWords=0, nextSentenceIndex=0;
let planeY=gameArea.clientHeight/2, driftFrame=0;
const rocketLeftOffset = 10*3.78;

// --- Student Name Matching Script ---
function getStudentName(id) {
  if (typeof window.resolveStudentNameFromId === "function") {
    return window.resolveStudentNameFromId(id);
  }
  const cleanId = (id || "").trim();
  if (!cleanId) return "Student Unknown";

}

// --- Plane & Laser Burst ---
function spawnPlaneBurst(){
  const planeRect = plane.getBoundingClientRect();
  const gaRect = gameArea.getBoundingClientRect();
  const startX = planeRect.right - gaRect.left - 5;
  const startY = planeRect.top - gaRect.top + planeRect.height/3;
  const laserLength = 200;
  const numDots = 25;

  for(let i=0;i<numDots;i++){
    setTimeout(()=>{
      const dot = document.createElement('div');
      dot.textContent = '-';
      dot.style.position = 'absolute';
      dot.style.color = 'white';
      dot.style.fontSize = '18px';
      dot.style.left = startX + (laserLength/numDots)*i + 'px';
      dot.style.top = startY + 'px';
      dot.style.opacity = 1;
      dot.style.transition = 'all 0.3s linear';
      dot.style.zIndex = 4;
      gameArea.appendChild(dot);

      setTimeout(()=>{dot.style.opacity=0;},100);
      setTimeout(()=>{if(dot.parentNode) dot.parentNode.removeChild(dot);},400);
    }, i*10);
  }
}

// --- Spawn Sentences (Robust & Pre-wrapped) ---
function spawnSentence(item){
  if(!item) return;
  
  let text = '';
  let choices = null;
  let correct = '';

  // Handle both structured question objects and raw string lines
  if (typeof item === 'object' && item.text) {
    text = item.text;
    choices = item.choices;
    correct = item.correct;
  } else if (typeof item === 'string') {
    text = item;
    const match = text.match(/\|([^\|]+)\|/);
    correct = match ? match[1] : '';
    let distractors = allCorrectAnswers.filter(a => a !== correct);
    choices = [correct, distractors[0] || 'A', distractors[1] || 'B'];
    choices.sort(() => Math.random() - 0.5);
  }

const span = document.createElement('span'); 
  span.className = 'sentence'; 
  
  // Replace '#' with a space to unify text smoothly
  const cleanText = text.replace(/#/g, ' ').trim();
  const parts = cleanText.split(/\|(.+?)\|/);
  
  let blanks = [];
  for(let i = 0; i < parts.length; i++) {
    if(i % 2 === 0) {
      if(parts[i]) {
        span.appendChild(document.createTextNode(parts[i]));
      }
    } else {
      const b = document.createElement('span'); 
      b.className = 'blank';
      b.dataset.answer = parts[i]; 
      b.innerHTML = '&nbsp;'.repeat(10); 
      blanks.push({elem: b, answered: false});
      span.appendChild(b);
    }
  }


gameArea.appendChild(span);
  const containerWidth = gameArea.clientWidth || 800;
  const containerHeight = gameArea.clientHeight || 400;
  
  // Constrain vertical range safely within the top half of the game area (leaving room for buttons)
  const minY = 20;
  const maxY = Math.max(minY, containerHeight * 0.4 - 40);
  span.style.top = (Math.random() * (maxY - minY) + minY) + 'px';

const rocketRightEdge = 130;
  const maxAllowedWidth = containerWidth - rocketRightEdge - 20;
  const sentenceWidth = Math.min(360, maxAllowedWidth);
  span.style.maxWidth = sentenceWidth + 'px';

  const targetX = rocketRightEdge + Math.max(10, (containerWidth - rocketRightEdge - sentenceWidth) / 2);

  let startX = containerWidth + 10;
  span.style.left = startX + 'px';

activeSentences.push({
    span,
    x: startX,
    targetX: targetX,
    state: 'sliding',
    freezeTimer: 500, // ~12 seconds display time before timing out
    blanks,
    finished: false
  });

  requestAnimationFrame(() => {
    span.style.opacity = '1';
  });
  generateMCButtons(choices, correct);
}
function generateMCButtons(choices, correct) {
    mcButtonsContainer.innerHTML = '';

    const row1 = document.createElement('div');
    row1.style.display = 'flex';
    row1.style.justifyContent = 'center';
    row1.style.gap = '10px';
    row1.style.width = '100%';

    choices.forEach((choice) => {
        const btn = document.createElement('button');
        btn.textContent = choice;
        btn.dataset.used = 'false';
        btn.onclick = () => handleMCAnswer(choice, correct, btn);
        row1.appendChild(btn);
    });

    mcButtonsContainer.appendChild(row1);
    mcButtonsContainer.style.display = 'flex';
    mcButtonsContainer.style.flexDirection = 'column';
    mcButtonsContainer.style.alignItems = 'center';

    unifyMCButtonWidths();
}
// --- MC Answer ---
function handleMCAnswer(selected, correct, btn) {
    const targetSentence = activeSentences.find(s => !s.finished && s.state !== 'fading');
    if (!targetSentence) return;
    const blank = targetSentence.blanks[0];

    typedDisplay.textContent = selected;

    if (!blank.answered) {
        blank.answered = true;

        if (selected === correct) {
            btn.style.backgroundColor = 'green';
            blank.elem.textContent = correct;

            spawnPlaneBurst();
            popSound.currentTime = 0;
            popSound.play().catch(() => {});

            correctWords++;

            const spanRect = targetSentence.span.getBoundingClientRect();
            const gaRect = gameArea.getBoundingClientRect();
            plane.style.display = 'block';
            planeY = spanRect.top - gaRect.top + spanRect.height / 2;
            plane.style.top = planeY - plane.offsetHeight / 2 + 'px';

            // Clear buttons immediately so next question can load cleanly
            mcButtonsContainer.innerHTML = '';
            targetSentence.state = 'fading';
            targetSentence.span.style.opacity = '0';

            // Hold answered sentence in place before fully removing it
            setTimeout(() => {
                targetSentence.finished = true;
                typedDisplay.textContent = '';
                if (targetSentence.span.parentNode) {
                    targetSentence.span.parentNode.removeChild(targetSentence.span);
                }

                if (nextSentenceIndex >= sentences.length &&
                    activeSentences.filter(s => !s.finished).length === 0) {
                    accelerateRocketExit();
                }
            }, 2500);

        } else {
            btn.style.backgroundColor = 'red';
            typedDisplay.textContent = '✗';
            setTimeout(() => typedDisplay.textContent = '', 500);
        }
    } else {
        if (selected === correct) {
            btn.style.backgroundColor = 'green';
            blank.elem.textContent = correct;
        } else {
            btn.style.backgroundColor = 'red';
        }
    }
}// --- Rocket exit after last sentence ---
function accelerateRocketExit(){
  let speed = 2;
  const exitInterval = setInterval(()=>{
    let left = parseFloat(plane.style.left);
    left += speed;
    speed *= 1.05;
    plane.style.left = left+'px';
    if(left > gameArea.clientWidth){
      clearInterval(exitInterval);
    }
  },20);
}

// --- Drop Sentences (Slide, Freeze/Timeout, Fade) ---
function dropSentences(){
  if(!gameStarted) return;
  const gaRect = gameArea.getBoundingClientRect();

  activeSentences.forEach(s => {
    if(s.finished) return;

    if(s.state === 'sliding') {
      s.x += (s.targetX - s.x) * 0.1;
      if(Math.abs(s.targetX - s.x) < 1) {
        s.x = s.targetX;
        s.state = 'frozen';
      }
      s.span.style.left = s.x + 'px';
    } 
    else if(s.state === 'frozen') {
      s.freezeTimer--;
      if(s.freezeTimer <= 0) {
        s.state = 'fading';
        s.span.style.opacity = '0';
        mcButtonsContainer.innerHTML = ''; // Clear buttons when timing out
      }
    } 
    else if(s.state === 'fading') {
      if(!s.fadeTimeoutSet) {
        s.fadeTimeoutSet = true;
        setTimeout(() => {
          s.finished = true;
          if(s.span.parentNode) s.span.parentNode.removeChild(s.span);
          mcButtonsContainer.innerHTML = '';

          if (nextSentenceIndex >= sentences.length &&
              activeSentences.filter(st => !st.finished).length === 0) {
              accelerateRocketExit();
          }
        }, 2000); // Matches the 2.0s CSS fade transition
      }
    }
  });

  activeSentences = activeSentences.filter(s => !s.finished);

  if(nextSentenceIndex < sentences.length && !activeSentences.some(s => !s.finished)) {
    spawnSentence(sentences[nextSentenceIndex]);
    nextSentenceIndex++;
  }

if(activeSentences.length > 0) {
    const target = activeSentences[0];
    const rect = target.span.getBoundingClientRect();
    const sentenceY = rect.top - gaRect.top + rect.height / 2;
    planeY += (sentenceY - planeY) * 0.1;
  } else {
    planeY += Math.sin(driftFrame / 10) * 2;
  }
  driftFrame++;
  plane.style.top = planeY - plane.offsetHeight / 2 + 'px';
}

// Override spawn condition in dropSentences loop to strictly enforce 1 active sentence at a time
function dropSentences(){
  if(!gameStarted) return;
  const gaRect = gameArea.getBoundingClientRect();

  activeSentences.forEach(s => {
    if(s.finished) return;

    if(s.state === 'sliding') {
      s.x += (s.targetX - s.x) * 0.1;
      if(Math.abs(s.targetX - s.x) < 1) {
        s.x = s.targetX;
        s.state = 'frozen';
      }
      s.span.style.left = s.x + 'px';
    } 
    else if(s.state === 'frozen') {
      s.freezeTimer--;
      if(s.freezeTimer <= 0) {
        s.state = 'fading';
        s.span.style.opacity = '0';
        mcButtonsContainer.innerHTML = '';
      }
    } 
    else if(s.state === 'fading') {
      if(!s.fadeTimeoutSet) {
        s.fadeTimeoutSet = true;
        setTimeout(() => {
          s.finished = true;
          if(s.span.parentNode) s.span.parentNode.removeChild(s.span);
          mcButtonsContainer.innerHTML = '';

          if (nextSentenceIndex >= sentences.length &&
              activeSentences.filter(st => !st.finished).length === 0) {
              accelerateRocketExit();
          }
        }, 2000);
      }
    }
  });

  activeSentences = activeSentences.filter(s => !s.finished);

  // Strictly enforce only ONE active sentence on screen at any time
  if(nextSentenceIndex < sentences.length && activeSentences.length === 0) {
    spawnSentence(sentences[nextSentenceIndex]);
    nextSentenceIndex++;
  }

  if(activeSentences.length > 0) {
    const target = activeSentences[0];
    const rect = target.span.getBoundingClientRect();
    const sentenceY = rect.top - gaRect.top + rect.height / 2;
    planeY += (sentenceY - planeY) * 0.1;
  } else {
    planeY += Math.sin(driftFrame / 10) * 2;
  }
  driftFrame++;
  plane.style.top = planeY - plane.offsetHeight / 2 + 'px';
}

function getScoreboardFilename(extension) {

// --- Game Controls ---
function startGame() {

function submitResults() {

<script>
class AsteroidZSwoosh {
    constructor() {
        this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        const bufferSize = 2 * this.audioCtx.sampleRate;
        const noiseBuffer = this.audioCtx.createBuffer(1, bufferSize, this.audioCtx.sampleRate);
        const data = noiseBuffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
            data[i] = Math.random() * 2 - 1;
        }

        this.noise = this.audioCtx.createBufferSource();
        this.noise.buffer = noiseBuffer;
        this.noise.loop = true;

        this.filter = this.audioCtx.createBiquadFilter();
        this.filter.type = 'lowpass';
        this.filter.frequency.value = 1200;

        this.gainNode = this.audioCtx.createGain();
        this.gainNode.gain.value = 0;

        this.noise.connect(this.filter);
        this.filter.connect(this.gainNode);
        this.gainNode.connect(this.audioCtx.destination);

        this.noise.start();
        this.maxGain = 0.2;
    }

    start() {
        if (this.audioCtx.state === 'suspended') {
            this.audioCtx.resume();
        }
        const now = this.audioCtx.currentTime;
        this.gainNode.gain.cancelScheduledValues(now);
        this.gainNode.gain.setValueAtTime(this.gainNode.gain.value, now);
        this.gainNode.gain.linearRampToValueAtTime(this.maxGain, now + 0.1);
    }

    stop() {
        const now = this.audioCtx.currentTime;
        this.gainNode.gain.cancelScheduledValues(now);
        this.gainNode.gain.setValueAtTime(this.gainNode.gain.value, now);
        this.gainNode.gain.linearRampToValueAtTime(0, now + 1);
    }

    setFrequency(freq) {
        this.filter.frequency.setValueAtTime(
            freq,
            this.audioCtx.currentTime
        );
    }
}

const swoosh = new AsteroidZSwoosh();

function unifyMCButtonWidths() {
    const allBtns = mcButtonsContainer.querySelectorAll('button');
    let maxWidth = 0;

    allBtns.forEach(btn => {
        btn.style.width = 'auto';
        const w = btn.offsetWidth;
        if (w > maxWidth) maxWidth = w;
    });

    allBtns.forEach(btn => {
        btn.style.width = maxWidth + 'px';
    });

    // Automatically set blank width to match the maximum answer/button width
    activeSentences.forEach(s => {
        if (!s.finished && s.blanks) {
            s.blanks.forEach(b => {
                b.elem.style.width = maxWidth + 'px';
            });
        }
    });
}</script>

    if (now - lastTouchTime < 300) {
      e.preventDefault();
    }
    lastTouchTime = now;
  }
  function preventGesture(e) {
    e.preventDefault();
  }

  document.addEventListener('touchstart', preventPinch, { passive: false });
  document.addEventListener('touchend', preventDoubleTap, { passive: false });
  document.addEventListener('gesturestart', preventGesture, { passive: false });
})();
</script>

<script>
(function() {
    'use strict';

    let pdfModePrimed = false;

    // =========================================================
    // 1. PDF TEXT FITTER
    // =========================================================
    window.fitPdfTextToColumns = function(container) {
        const MIN_FONT_SIZE = 9.5;
        const MAX_FONT_SIZE = 10;
        const STEP = 0.1;

        const testContainer = container.cloneNode(true);
        testContainer.style.cssText += `
            position: absolute !important;
            left: -10000px !important;
            top: 0 !important;
            visibility: hidden !important;
            pointer-events: none !important;
        `;
        document.body.appendChild(testContainer);

        const testColumns = testContainer.querySelectorAll('.pdf-page > div > div');
        const originalColumns = container.querySelectorAll('.pdf-page > div > div');

        testContainer.getBoundingClientRect();

        testColumns.forEach((testColumn, index) => {
            const originalColumn = originalColumns[index];
            if (!originalColumn) return;

            let fontSize = MAX_FONT_SIZE;

            function applyFontSize(column, size) {
                column.style.setProperty('font-size', size + 'pt', 'important');
                column.querySelectorAll('*').forEach(element => {
                    element.style.setProperty('font-size', size + 'pt', 'important');
                });
            }

            function contentOverflows() {
                return testColumn.scrollHeight > testColumn.clientHeight + 1;
            }

            applyFontSize(testColumn, fontSize);

            while (contentOverflows() && fontSize > MIN_FONT_SIZE) {
                fontSize = Math.max(MIN_FONT_SIZE, Math.round((fontSize - STEP) * 10) / 10);
                applyFontSize(testColumn, fontSize);
                testColumn.getBoundingClientRect();
            }

            applyFontSize(originalColumn, fontSize);
        });

        testContainer.remove();
    };

    // =========================================================
    // 2. PDF CLEANUP: REMOVE BLANK TRAILING PAGES
    // =========================================================
    async function removeTrailingBlankPDFPages(pdfBlob) {
        const pdfjs = window.pdfjsLib;
        const PDFDocument = window.PDFLib.PDFDocument;

        if (!pdfjs || !PDFDocument) {
            throw new Error("PDF cleanup libraries failed to load.");
        }

        pdfjs.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        const buffer = await pdfBlob.arrayBuffer();
        const pdfjsData = new Uint8Array(buffer.slice(0));
        const pdf = await pdfjs.getDocument({ data: pdfjsData }).promise;
        const totalPages = pdf.numPages;
        const blankPages = [];

        for (let pageNum = totalPages; pageNum >= 1; pageNum--) {
            const page = await pdf.getPage(pageNum);
            const viewport = page.getViewport({ scale: 0.75 });
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d', { willReadFrequently: true });

            canvas.width = Math.ceil(viewport.width);
            canvas.height = Math.ceil(viewport.height);
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            await page.render({ canvasContext: ctx, viewport: viewport, background: '#ffffff' }).promise;
            const pixels = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
            let visiblePixels = 0;

            for (let i = 0; i < pixels.length; i += 4) {
                if (pixels[i] < 245 || pixels[i + 1] < 245 || pixels[i + 2] < 245) {
                    visiblePixels++;
                    if (visiblePixels > 10) break;
                }
            }

            if (visiblePixels <= 10) {
                blankPages.push(pageNum - 1);
            } else {
                break;
            }
            canvas.width = 0;
            canvas.height = 0;
        }

        await pdf.destroy();

        if (blankPages.length === 0 || blankPages.length >= totalPages) {
            return pdfBlob;
        }

        const editablePDF = await PDFDocument.load(buffer.slice(0));
        blankPages.forEach(pageIndex => editablePDF.removePage(pageIndex));
        const cleanedBytes = await editablePDF.save();

        return new Blob([cleanedBytes], { type: 'application/pdf' });
    }

    // =========================================================
    // 3. UI BUTTON INJECTION & LIST INDEX TAGGING
    // =========================================================
    function injectPdfButtonDirectly() {
        const header = document.getElementById('sectionModalHeader');
        if (!header) return;

        const listContainer = document.getElementById('sectionListContainer');
        if (listContainer) {
            const items = listContainer.querySelectorAll('.section-item');
            items.forEach((item, idx) => {
                if (!item.hasAttribute('data-index')) {
                    item.setAttribute('data-index', idx);
                }
            });
        }

        if (header.querySelector('.pdf-header-toggle')) return;

        const pdfBtn = document.createElement('button');
        pdfBtn.type = 'button';
        pdfBtn.className = 'pdf-header-toggle';
        pdfBtn.innerHTML = '↓ PDF: <strong>OFF</strong>';
        pdfBtn.style.cssText = `
            background: #e2e8f0;
            color: #1e293b;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            padding: 3px 8px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            margin-left: auto;
            margin-right: 8px;
            display: inline-flex;
            align-items: center;
            box-sizing: border-box;
            transition: all 0.2s ease;
        `;

        const closeBtn = document.getElementById('sectionModalClose');
        if (closeBtn) {
            header.insertBefore(pdfBtn, closeBtn);
        } else {
            header.appendChild(pdfBtn);
        }

        pdfBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            pdfModePrimed = !pdfModePrimed;
            if (pdfModePrimed) {
                pdfBtn.style.background = '#dbeafe';
                pdfBtn.style.borderColor = '#3b82f6';
                pdfBtn.style.color = '#1e40af';
                pdfBtn.innerHTML = '↓ PDF: <strong style="color: #1d4ed8;">ACTIVE</strong>';
            } else {
                resetPdfButton(pdfBtn);
            }
        });
    }

    function resetPdfButton(pdfBtn) {
        pdfBtn.style.background = '#e2e8f0';
        pdfBtn.style.borderColor = '#cbd5e1';
        pdfBtn.style.color = '#1e293b';
        pdfBtn.innerHTML = '↓ PDF: <strong>OFF</strong>';
    }

    // =========================================================
    // 4. UNIVERSAL SECTION RESOLVER & EXPORT HANDLER
    // =========================================================
    function parseRawSectionsUniversal(rawText) {
        if (!rawText) return [];
        const chunks = rawText.split(/\n(?=~+)/);
        return chunks
            .map(chunk => chunk.trim())
            .filter(chunk => chunk.startsWith("~"))
            .map(chunk => {
                const lines = chunk.split("\n");
                const name = lines.shift().replace(/^~+/, "").trim();
                const text = lines.join("\n").trim();
                return { name, text };
            });
    }

    document.addEventListener('click', (e) => {
        const item = e.target.closest('.section-item');
        if (!item || !pdfModePrimed) return;

        e.preventDefault();
        e.stopPropagation();

        let index = parseInt(item.getAttribute('data-index'), 10);
        if (isNaN(index)) {
            const listContainer = document.getElementById('sectionListContainer');
            if (listContainer) {
                index = Array.from(listContainer.children).indexOf(item);
            }
        }

        let section = null;
        if (!isNaN(index) && index >= 0) {
            if (window.SCRAMBLE_SECTIONS && window.SCRAMBLE_SECTIONS[index]) {
                section = window.SCRAMBLE_SECTIONS[index];
            } else if (typeof sectionData !== 'undefined' && sectionData[index]) {
                section = sectionData[index];
            } else if (window.__RAW_SECTION_TEXT__) {
                const parsed = parseRawSectionsUniversal(window.__RAW_SECTION_TEXT__);
                section = parsed[index];
            }
        }

        if (!section) {
            alert("Could not locate section data for PDF export.");
            return;
        }

        exportFullWorksheetToPDF(section);

        pdfModePrimed = false;
        const pdfBtn = document.querySelector('.pdf-header-toggle');
        if (pdfBtn) resetPdfButton(pdfBtn);

        const modalRoot = document.getElementById('sectionModalRoot');
        if (modalRoot) modalRoot.style.display = 'none';
    }, true);

    // =========================================================
    // 5. BUILD & EXPORT WORKFLOW (EXACT MATCHED 20-ITEM PARSING)
    // =========================================================
    function exportFullWorksheetToPDF(section) {
        let rawFilename = window.location.pathname.split('/').pop() || 'file.html';
        let cleanFilename = rawFilename
            .replace(/\.html$/i, '')
            .replace(/^[a-zA-Z0-9]+[_\-]*/, '')
            .replace(/^[\d\-_]+/, '')
            .replace(/_/g, ' ');

        const exportContainer = document.createElement('div');
        exportContainer.className = 'pdf-export-canvas';
        exportContainer.style.cssText = 'width: 210mm; background: #ffffff; box-sizing: border-box;';

        const questionElements = [];

        let fullText = section.text || '';
        const lines = fullText.split(/\r?\n/).map(l => l.trim()).filter(l => l.length > 0);

        // Replicate the game's exact line-grouping logic to match the 20 active questions
        const filteredLines = lines.filter(line => line && line.includes("|"));
        const groups = [];
        for (let i = 0; i < filteredLines.length; i += 3) {
            const group = filteredLines.slice(i, i + 3);
            if (group.length > 0) groups.push(group);
        }

        const sectionAnswers = [];
        filteredLines.forEach(line => {
            const match = line.match(/\|([^|]+)\|/);
            if (match) sectionAnswers.push(match[1]);
        });
        const uniqueAnswers = [...new Set(sectionAnswers)];

        let qCount = 1;
        groups.forEach((group, groupIndex) => {
            group.forEach((entryLine, itemIndex) => {
                // Skip the 21st item to match game behavior exactly
                if (groupIndex === 6 && itemIndex === 2) return;

                const match = entryLine.match(/\|([^|]+)\|/);
                if (!match) return;

                const correctAnswer = match[1];
                const sentenceText = entryLine.replace(/\|([^|]+)\|/g, '<strong>_____</strong>');

                let distractors = uniqueAnswers.filter(a => a !== correctAnswer);
                distractors.sort(() => Math.random() - 0.5);
                
                let choices = [correctAnswer, distractors[0] || 'A', distractors[1] || 'B', distractors[2] || 'C'];
                choices = [...new Set(choices)].slice(0, 4);
                choices.sort(() => Math.random() - 0.5);

                const exDiv = document.createElement('div');
                exDiv.className = 'quiz-exercise';
                exDiv.style.cssText = 'font-size: 10pt; margin-bottom: 14px; page-break-inside: avoid; break-inside: avoid;';

                let qHtml = `<strong>${qCount}.</strong> ${sentenceText}<div style="font-size: 10pt; margin-left: 12px; margin-top: 3px;">`;
                choices.forEach((choice, optIdx) => {
                    const letter = String.fromCharCode(65 + optIdx);
                    qHtml += `<span style="display: inline-block; margin-right: 12px;">${letter}) ${choice}</span>`;
                });
                qHtml += `</div>`;

                exDiv.innerHTML = qHtml;
                questionElements.push(exDiv);
                qCount++;
            });
        });

        const currentYear = new Date().getFullYear();
        const infoDiv = document.createElement('div');
        infoDiv.style.cssText = 'margin-bottom: 12px; font-size: 10pt; page-break-inside: avoid;';
        infoDiv.innerHTML = `
            <div style="font-size: 10pt; font-weight: bold; color: #444; margin-bottom: 1px;">Perfectly Practical Printables</div>
            <div style="font-size: 10pt; color: #666; margin-bottom: 1px;">PerfectlyPracticalEnglish@outlook.com</div>
            <div style="font-size: 10pt; color: #666; margin-bottom: 4px;">&copy; ${currentYear} Perfectly Practical English</div>

            <div style="font-size: 10pt; line-height: 1.4; margin-bottom: 8px;">
                <div>Name ____________________</div>
                <div>ID ____________________</div>
                <div>Date ____________________</div>
            </div>

            <h2 style="font-size: 10pt; color: #1976d2; margin-bottom: 2px; padding-bottom: 0;">${cleanFilename}</h2>
            <h2 style="font-size: 10pt; color: #1976d2; margin-bottom: 4px; padding-bottom: 2px;">${section.name}</h2>
        `;

        const EXERCISES_PER_COLUMN = 10;
        const exerciseChunks = [];
        for (let i = 0; i < questionElements.length; i += EXERCISES_PER_COLUMN) {
            exerciseChunks.push(questionElements.slice(i, i + EXERCISES_PER_COLUMN));
        }

        const pages = [];
        let p1_col1 = [infoDiv];
        let p1_col2 = [];

        if (exerciseChunks.length > 0) {
            p1_col1 = p1_col1.concat(exerciseChunks[0] || []);
        }
        if (exerciseChunks.length > 1) {
            p1_col2 = p1_col2.concat(exerciseChunks[1] || []);
        }

        pages.push({ col1: p1_col1, col2: p1_col2 });

        let chunkIdx = 2;
        while (chunkIdx < exerciseChunks.length) {
            let c1 = exerciseChunks[chunkIdx] || [];
            let c2 = exerciseChunks[chunkIdx + 1] || [];
            pages.push({ col1: c1, col2: c2 });
            chunkIdx += 2;
        }

        pages.forEach((pageData) => {
            const pageDiv = document.createElement('div');
            pageDiv.className = 'pdf-page';
            pageDiv.style.cssText = `
                width: 210mm;
                height: 297mm;
                padding: 6.35mm;
                box-sizing: border-box;
                position: relative;
                background: #ffffff;
                overflow: hidden;
            `;

            const flexWrapper = document.createElement('div');
            flexWrapper.style.cssText = 'display: flex; gap: 6mm; width: 197mm; height: 282mm; box-sizing: border-box; overflow: hidden;';

            const col1Div = document.createElement('div');
            col1Div.style.cssText = 'width: 95.5mm; height: 282mm; max-height: 282mm; overflow: hidden; box-sizing: border-box; font-size: 10pt; line-height: 1.35;';
            if (pageData.col1) {
                pageData.col1.forEach(el => col1Div.appendChild(el.cloneNode(true)));
            }
            flexWrapper.appendChild(col1Div);

            const col2Div = document.createElement('div');
            col2Div.style.cssText = 'width: 95.5mm; height: 282mm; max-height: 282mm; overflow: hidden; box-sizing: border-box; font-size: 10pt; line-height: 1.35;';
            if (pageData.col2) {
                pageData.col2.forEach(el => col2Div.appendChild(el.cloneNode(true)));
            }
            flexWrapper.appendChild(col2Div);

            pageDiv.appendChild(flexWrapper);
            exportContainer.appendChild(pageDiv);
        });

        if (typeof window.fitPdfTextToColumns === 'function') {
            window.fitPdfTextToColumns(exportContainer);
        }

        document.body.appendChild(exportContainer);

        const opt = {
            margin: 0,
            filename: `EFL_Worksheet_${section.name.replace(/[^a-zA-Z0-9]/g, '_')}.pdf`,
            image: { type: 'jpeg', quality: 0.98 },
            html2canvas: { scale: 2, useCORS: true, letterRendering: true },
            pagebreak: { mode: [] },
            jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait', putOnlyUsedFonts: true, floatPrecision: 16 }
        };

        html2pdf()
            .set(opt)
            .from(exportContainer)
            .outputPdf('blob')
            .then(async pdfBlob => {
                const cleanedPDF = await removeTrailingBlankPDFPages(pdfBlob);
                const downloadURL = URL.createObjectURL(cleanedPDF);
                const downloadLink = document.createElement('a');

                downloadLink.href = downloadURL;
                downloadLink.download = opt.filename;
                document.body.appendChild(downloadLink);
                downloadLink.click();
                downloadLink.remove();

                setTimeout(() => URL.revokeObjectURL(downloadURL), 1000);
                exportContainer.remove();
            })
            .catch(err => {
                console.error("PDF Generation Error:", err);
                exportContainer.remove();
                alert("PDF ERROR:\n\n" + (err.message || err.toString()));
            });
    }

    document.addEventListener('click', (e) => {
        if (e.target.closest('#sectionSelectorBtn')) {
            setTimeout(injectPdfButtonDirectly, 50);
            setTimeout(injectPdfButtonDirectly, 200);
        }
    });

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', injectPdfButtonDirectly);
    } else {
        injectPdfButtonDirectly();
    }

    setInterval(injectPdfButtonDirectly, 500);

})();
</script>

        const listContainer = document.getElementById('sectionListContainer');
        if (listContainer && !listContainer.dataset.bannerListenerAttached) {
            listContainer.dataset.bannerListenerAttached = 'true';
            listContainer.addEventListener('click', (e) => {
                const item = e.target.closest('.section-item');
                if (item) {
                    window.__sampleAutoStarted = true;
                    stopAsteroidsSample();
                    const banner = document.getElementById('wordBombsLayoutSampleBanner');
                    if (banner) banner.remove();
                }
            });
        }

        setTimeout(() => {
            if (!window.__sampleAutoStarted) {
                sampleExerciseIndex = 0;
                startSampleAsteroidEngine();
            }
        }, 300);
    }

    function startSampleAsteroidEngine() {
        if (window.__sampleAutoStarted || sampleActive) return;
        sampleActive = true;

        const gameArea = document.getElementById('gameArea');
        const mcButtonsContainer = document.getElementById('mcButtonsContainer');
        if (!gameArea || !mcButtonsContainer) return;

        // Create persistent fake sample rocket ONCE so it never gets removed during the infinite loop
        let samplePlane = document.getElementById('samplePlane');
        if (!samplePlane) {
            samplePlane = document.createElement('div');
            samplePlane.id = 'samplePlane';
            samplePlane.textContent = '🚀';
            samplePlane.style.cssText = `
                position: absolute;
                left: 50px;
                font-size: 50px;
                user-select: none;
                pointer-events: none;
                z-index: 4;
                transform: rotate(45deg);
            `;
            gameArea.appendChild(samplePlane);
        }

        let planeY = 220;
        samplePlane.style.top = (planeY - 25) + 'px';
        samplePlane.style.display = 'block';

        function loadNextExercise() {
            if (window.__sampleAutoStarted) return;

            // Loop index back to 0 infinitely after reaching the end of the 3 exercises
            if (sampleExerciseIndex >= sampleExercises.length) {
                sampleExerciseIndex = 0;
            }

            const currentEx = sampleExercises[sampleExerciseIndex];

            // Create sentence matching game DOM structure
            const span = document.createElement('span');
            span.className = 'sentence';
            span.style.opacity = '1';
            span.style.maxWidth = '360px';

            if (currentEx.before) {
                span.appendChild(document.createTextNode(currentEx.before));
            }
            
            const blank = document.createElement('span');
            blank.className = 'blank';
            blank.dataset.answer = currentEx.answer;
            blank.innerHTML = '&nbsp;'.repeat(Math.max(6, currentEx.answer.length * 4));
            span.appendChild(blank);
            
            if (currentEx.after) {
                span.appendChild(document.createTextNode(currentEx.after));
            }
            gameArea.appendChild(span);

            // Position sentence lower in the game area (below the banner)
            const containerWidth = gameArea.clientWidth || 800;
            const containerHeight = gameArea.clientHeight || 400;
            const minY = 120;
            const maxY = Math.min(containerHeight - 80, 280);
            const targetY = Math.random() * (maxY - minY) + minY;
            span.style.top = targetY + 'px';

            const rocketRightEdge = 130;
            const sentenceWidth = Math.min(360, containerWidth - rocketRightEdge - 20);
            const targetX = rocketRightEdge + Math.max(10, (containerWidth - rocketRightEdge - sentenceWidth) / 2);
            let currentX = containerWidth + 10;
            span.style.left = currentX + 'px';

            sampleSentenceObj = {
                span: span,
                blank: blank,
                correct: currentEx.answer,
                x: currentX,
                targetX: targetX,
                state: 'sliding',
                answered: false
            };

            // Generate 3 choices (1 correct + 2 custom distractors)
            let choices = [currentEx.answer];
            const pool = ['a', 'an', 'the', 'a lot of', 'some', 'several'];
            while (choices.length < 3) {
                const rand = pool[Math.floor(Math.random() * pool.length)];
                if (!choices.includes(rand)) {
                    choices.push(rand);
                }
            }
            choices.sort(() => Math.random() - 0.5);

            mcButtonsContainer.innerHTML = '';
            const row1 = document.createElement('div');
            row1.style.display = 'flex';
            row1.style.justifyContent = 'center';
            row1.style.gap = '10px';
            row1.style.width = '100%';

            choices.forEach((choice) => {
                const btn = document.createElement('button');
                btn.textContent = choice;
                btn.type = 'button';
                btn.onclick = () => {
                    if (window.__sampleAutoStarted || !sampleSentenceObj || sampleSentenceObj.answered) return;

                    if (choice === currentEx.answer) {
                        sampleSentenceObj.answered = true;
                        btn.style.backgroundColor = 'green';
                        blank.textContent = currentEx.answer;

                        // Play sound effect with safe fallback
                        const popSound = document.getElementById('popSound');
                        if (popSound) {
                            try {
                                popSound.currentTime = 0;
                                popSound.play().catch(() => {});
                            } catch (e) {}
                        }

                        // Trigger laser burst simulation
                        const gaRect = gameArea.getBoundingClientRect();
                        const planeRect = samplePlane.getBoundingClientRect();
                        const startX = planeRect.right - gaRect.left - 5;
                        const startY = planeRect.top - gaRect.top + planeRect.height / 3;
                        for (let i = 0; i < 20; i++) {
                            setTimeout(() => {
                                if (window.__sampleAutoStarted) return;
                                const dot = document.createElement('div');
                                dot.textContent = '-';
                                dot.style.cssText = `position:absolute; color:white; font-size:18px; left:${startX + i * 8}px; top:${startY}px; z-index:4; opacity:1; transition:all 0.2s linear;`;
                                gameArea.appendChild(dot);
                                setTimeout(() => { dot.style.opacity = 0; }, 50);
                                setTimeout(() => { if (dot.parentNode) dot.parentNode.removeChild(dot); }, 200);
                            }, i * 10);
                        }

                        const spanRect = span.getBoundingClientRect();
                        planeY = spanRect.top - gaRect.top + spanRect.height / 2;
                        samplePlane.style.top = (planeY - 25) + 'px';

                        // Advance index for the next exercise in the cycle
                        sampleExerciseIndex++;

                        setTimeout(() => {
                            if (window.__sampleAutoStarted) return;
                            mcButtonsContainer.innerHTML = '';
                            span.style.opacity = '0';
                            setTimeout(() => {
                                if (window.__sampleAutoStarted) return;
                                if (span.parentNode) span.parentNode.removeChild(span);
                                loadNextExercise(); // Immediately load next exercise while keeping rocket visible!
                            }, 1000);
                        }, 500);
                    } else {
                        btn.style.backgroundColor = 'red';
                        setTimeout(() => { btn.style.backgroundColor = ''; }, 500);
                    }
                };
                row1.appendChild(btn);
            });

            mcButtonsContainer.appendChild(row1);
            mcButtonsContainer.style.display = 'flex';
            mcButtonsContainer.style.flexDirection = 'column';
            mcButtonsContainer.style.alignItems = 'center';
        }

        // Start the first exercise
        loadNextExercise();

        function sampleLoop() {
            if (window.__sampleAutoStarted || !sampleSentenceObj) return;

            const s = sampleSentenceObj;
            if (s.state === 'sliding') {
                s.x += (s.targetX - s.x) * 0.1;
                if (Math.abs(s.targetX - s.x) < 1) {
                    s.x = s.targetX;
                    s.state = 'frozen';
                }
                s.span.style.left = s.x + 'px';
            }

            const gaRect = gameArea.getBoundingClientRect();
            const rect = s.span.getBoundingClientRect();
            const sentenceY = rect.top - gaRect.top + rect.height / 2;
            planeY += (sentenceY - planeY) * 0.1;
            samplePlane.style.top = (planeY - 25) + 'px';

            sampleAnimFrame = requestAnimationFrame(sampleLoop);
        }

        sampleAnimFrame = requestAnimationFrame(sampleLoop);
    }

    function stopAsteroidsSample() {
        sampleActive = false;
        window.__sampleAutoStarted = true;
        if (sampleAnimFrame) {
            cancelAnimationFrame(sampleAnimFrame);
            sampleAnimFrame = null;
        }
        if (sampleSentenceObj && sampleSentenceObj.span && sampleSentenceObj.span.parentNode) {
            sampleSentenceObj.span.parentNode.removeChild(sampleSentenceObj.span);
            sampleSentenceObj = null;
        }
        const mcButtonsContainer = document.getElementById('mcButtonsContainer');
        if (mcButtonsContainer) {
            mcButtonsContainer.innerHTML = '';
        }

        const samplePlane = document.getElementById('samplePlane');
        if (samplePlane) {
            samplePlane.remove();
        }
    }

    if (document.readyState === 'loading') {
        window.addEventListener('DOMContentLoaded', initAsteroidsSample);
    } else {
        initAsteroidsSample();
    }
})();
</script>
