// --- Natural Starfield ---
const canvas = document.getElementById('terrainCanvas');
const ctx = canvas.getContext('2d');

function resizeCanvas() {
  canvas.width = canvas.clientWidth;
  canvas.height = canvas.clientHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

const stars = [];
const starCount = 500; // Dense, rich starfield

for (let i = 0; i < starCount; i++) {
  // Create natural size distribution (mostly small, few large)
  let rand = Math.random();
  let size, alpha, speedMultiplier;

  if (rand < 0.70) {
    // 70% Small, distant stars
    size = Math.random() * 0.8 + 0.6; // 0.6 to 1.4px
    alpha = Math.random() * 0.4 + 0.3; // Dimmer
    speedMultiplier = 0.3;
  } else if (rand < 0.92) {
    // 22% Medium stars
    size = Math.random() * 1.0 + 1.5; // 1.5 to 2.5px
    alpha = Math.random() * 0.4 + 0.6; // Moderately bright
    speedMultiplier = 0.6;
  } else {
    // 8% Large, bright foreground stars
    size = Math.random() * 1.5 + 2.5; // 2.5 to 4.0px
    alpha = 1.0; // Fully bright
    speedMultiplier = 1.0;
  }

  stars.push({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    size: size,
    alpha: alpha,
    speed: speedMultiplier
  });
}

function drawStarfield() {
  ctx.fillStyle = 'black';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  for (let s of stars) {
    // Increased base speed multiplier from 0.4 to 1.2 for faster movement
    s.x -= 1.2 * s.speed; 
    
    if (s.x < 0) {
      s.x = canvas.width;
      s.y = Math.random() * canvas.height;
    }

    ctx.fillStyle = `rgba(255, 255, 255, ${s.alpha})`;
    
    if (s.size > 2) {
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.size / 2, 0, Math.PI * 2);
      ctx.fill();
    } else {
      ctx.fillRect(s.x, s.y, s.size, s.size);
    }
  }
  requestAnimationFrame(drawStarfield);
}drawStarfield();

<script>
/* =========================================
   DROPDOWN MODAL SECTION SELECTOR
   ========================================= */

(function () {
  let sectionData = [];
  window.sectionAnswerPool = [];

  function rebuildMCPool(sectionText) {
    window.sectionAnswerPool = sectionText
      .split("\n")
      .map(line => {
        const m = line.match(/\|([^|]+)\|/);
        return m ? m[1] : null;
      })
      .filter(Boolean);
  }

  function parseSections(raw) {
    const chunks = raw.split(/\n(?=~+)/);
    return chunks
      .map(chunk => chunk.trim())
      .filter(chunk => chunk.startsWith("~"))
      .map(chunk => {
        const lines = chunk.split("\n");
        const name = lines.shift().replace(/^~+/, "").trim();
        const text = lines.join("\n").trim();
        const words = [];
        text.split("\n").forEach(line => {
          const matches = line.match(/\|(.+?)\|/g);
          if (matches) {
            matches.forEach(m => words.push(m.replace(/\|/g, "")));
          }
        });
        return { name, text, words: [...new Set(words)] };
      });
  }

  sectionData = parseSections(window.__RAW_SECTION_TEXT__);

  let currentSectionName = 'No Section';
  let wordList = [];

  const btn = document.getElementById("sectionSelectorBtn");
  const modalRoot = document.getElementById("sectionModalRoot");

  const modalClose = document.getElementById("sectionModalClose");
  const listContainer = document.getElementById("sectionListContainer");

  function openModal() {
    listContainer.innerHTML = "";
    if (sectionData.length === 0) {
      listContainer.innerHTML = "<div style='padding:10px; text-align:center; color:#666;'>No categories found.</div>";
    } else {
      sectionData.forEach((sec, index) => {
        const item = document.createElement("div");
        item.className = "section-item";
        item.textContent = sec.name;
        item.addEventListener("click", () => {
          currentSectionName = sec.name;
          wordList = sec.words;
          btn.textContent = sec.name;
          closeModal();
          rebuildMCPool(sec.text);
          window.dispatchEvent(new CustomEvent("sectionchange", {
            detail: {
              index: index + 1,
              name: sec.name,
              text: sec.text
            }
          }));
          startGame();
        });
        listContainer.appendChild(item);
      });
    }
    modalRoot.style.display = "block";
  }

  function closeModal() {
    modalRoot.style.display = "none";
  }

  if (btn) btn.addEventListener("click", openModal);
  if (modalClose) modalClose.addEventListener("click", closeModal);
  if (modalBackdrop) modalBackdrop.addEventListener("click", closeModal);

  window.getSelectedSectionText = function () {
    const sec = sectionData.find(s => s.name === currentSectionName);
    return sec ? sec.text : "";
  };
})();
</script>

<script>
let sentences = [];
let contentReady = false;
window.sentences = sentences;
let allCorrectAnswers = [];
let mcOptionCount = 8;

(async () => {

const gameArea=document.getElementById('gameArea');

let activeSentences=[], dropInterval=null, dropTickTime=25, gameStarted=false;

let planeY=gameArea.clientHeight/2, driftFrame=0;
const rocketLeftOffset = 10*3.78;

// --- Student Name Matching Script ---
function getStudentName(id) {

    return window.resolveStudentNameFromId(id);
  }
  const cleanId = (id || "").trim();
  if (!cleanId) return "Student Unknown";

}

// --- Plane & Laser Burst ---
function spawnPlaneBurst(){
  const planeRect = plane.getBoundingClientRect();
  const gaRect = gameArea.getBoundingClientRect();
  const startX = planeRect.right - gaRect.left - 5;
  const startY = planeRect.top - gaRect.top + planeRect.height/3;
  const laserLength = 200;
  const numDots = 25;

  for(let i=0;i<numDots;i++){
    setTimeout(()=>{
      const dot = document.createElement('div');
      dot.textContent = '-';
      dot.style.position = 'absolute';
      dot.style.color = 'white';
      dot.style.fontSize = '18px';

      dot.style.zIndex = 4;
      gameArea.appendChild(dot);

      setTimeout(()=>{dot.style.opacity=0;},100);
      setTimeout(()=>{if(dot.parentNode) dot.parentNode.removeChild(dot);},400);
    }, i*10);
  }
}

// --- Spawn Sentences (Robust & Pre-wrapped) ---
function spawnSentence(item){
  if(!item) return;
  
  let text = '';
  let choices = null;
  let correct = '';

  // Handle both structured question objects and raw string lines
  if (typeof item === 'object' && item.text) {
    text = item.text;
    choices = item.choices;
    correct = item.correct;
  } else if (typeof item === 'string') {
    text = item;
    const match = text.match(/\|([^\|]+)\|/);
    correct = match ? match[1] : '';
    let distractors = allCorrectAnswers.filter(a => a !== correct);
    choices = [correct, distractors[0] || 'A', distractors[1] || 'B'];
    choices.sort(() => Math.random() - 0.5);
  }

const span = document.createElement('span'); 
  span.className = 'sentence'; 
  
  // Replace '#' with a space to unify text smoothly
  const cleanText = text.replace(/#/g, ' ').trim();
  const parts = cleanText.split(/\|(.+?)\|/);
  
  let blanks = [];
  for(let i = 0; i < parts.length; i++) {
    if(i % 2 === 0) {
      if(parts[i]) {
        span.appendChild(document.createTextNode(parts[i]));
      }
    } else {
      const b = document.createElement('span'); 
      b.className = 'blank';
      b.dataset.answer = parts[i]; 
      b.innerHTML = '&nbsp;'.repeat(10); 
      blanks.push({elem: b, answered: false});
      span.appendChild(b);
    }
  }


gameArea.appendChild(span);
  const containerWidth = gameArea.clientWidth || 800;
  const containerHeight = gameArea.clientHeight || 400;
  
  // Constrain vertical range safely within the top half of the game area (leaving room for buttons)
  const minY = 20;
  const maxY = Math.max(minY, containerHeight * 0.4 - 40);
  span.style.top = (Math.random() * (maxY - minY) + minY) + 'px';

const rocketRightEdge = 130;
  const maxAllowedWidth = containerWidth - rocketRightEdge - 20;
  const sentenceWidth = Math.min(360, maxAllowedWidth);
  span.style.maxWidth = sentenceWidth + 'px';

  const targetX = rocketRightEdge + Math.max(10, (containerWidth - rocketRightEdge - sentenceWidth) / 2);

  let startX = containerWidth + 10;
  span.style.left = startX + 'px';

activeSentences.push({
    span,
    x: startX,
    targetX: targetX,
    state: 'sliding',
    freezeTimer: 500, // ~12 seconds display time before timing out
    blanks,
    finished: false
  });

  requestAnimationFrame(() => {
    span.style.opacity = '1';
  });
  generateMCButtons(choices, correct);
}
function generateMCButtons(choices, correct) {
    mcButtonsContainer.innerHTML = '';

    const row1 = document.createElement('div');
    row1.style.display = 'flex';
    row1.style.justifyContent = 'center';

    row1.style.width = '100%';

    choices.forEach((choice) => {
        const btn = document.createElement('button');

    mcButtonsContainer.style.display = 'flex';
    mcButtonsContainer.style.flexDirection = 'column';
    mcButtonsContainer.style.alignItems = 'center';

    unifyMCButtonWidths();
}
// --- MC Answer ---
function handleMCAnswer(selected, correct, btn) {
    const targetSentence = activeSentences.find(s => !s.finished && s.state !== 'fading');
    if (!targetSentence) return;
    const blank = targetSentence.blanks[0];

    typedDisplay.textContent = selected;

    if (!blank.answered) {
        blank.answered = true;

        if (selected === correct) {
            btn.style.backgroundColor = 'green';
            blank.elem.textContent = correct;

            spawnPlaneBurst();
            popSound.currentTime = 0;
            popSound.play().catch(() => {});

            correctWords++;

            const spanRect = targetSentence.span.getBoundingClientRect();
            const gaRect = gameArea.getBoundingClientRect();
            plane.style.display = 'block';
            planeY = spanRect.top - gaRect.top + spanRect.height / 2;
            plane.style.top = planeY - plane.offsetHeight / 2 + 'px';

            // Clear buttons immediately so next question can load cleanly
            mcButtonsContainer.innerHTML = '';
            targetSentence.state = 'fading';
            targetSentence.span.style.opacity = '0';

            // Hold answered sentence in place before fully removing it
            setTimeout(() => {
                targetSentence.finished = true;
                typedDisplay.textContent = '';
                if (targetSentence.span.parentNode) {
                    targetSentence.span.parentNode.removeChild(targetSentence.span);
                }

                if (nextSentenceIndex >= sentences.length &&
                    activeSentences.filter(s => !s.finished).length === 0) {
                    accelerateRocketExit();
                }
            }, 2500);

        } else {
            btn.style.backgroundColor = 'red';
            typedDisplay.textContent = '✗';
            setTimeout(() => typedDisplay.textContent = '', 500);
        }
    } else {
        if (selected === correct) {
            btn.style.backgroundColor = 'green';
            blank.elem.textContent = correct;
        } else {
            btn.style.backgroundColor = 'red';
        }
    }
}// --- Rocket exit after last sentence ---
function accelerateRocketExit(){
  let speed = 2;
  const exitInterval = setInterval(()=>{
    let left = parseFloat(plane.style.left);
    left += speed;
    speed *= 1.05;
    plane.style.left = left+'px';
    if(left > gameArea.clientWidth){
      clearInterval(exitInterval);
    }
  },20);
}

// --- Drop Sentences (Slide, Freeze/Timeout, Fade) ---
function dropSentences(){
  if(!gameStarted) return;
  const gaRect = gameArea.getBoundingClientRect();

  activeSentences.forEach(s => {
    if(s.finished) return;

    if(s.state === 'sliding') {
      s.x += (s.targetX - s.x) * 0.1;
      if(Math.abs(s.targetX - s.x) < 1) {
        s.x = s.targetX;
        s.state = 'frozen';
      }
      s.span.style.left = s.x + 'px';
    } 
    else if(s.state === 'frozen') {
      s.freezeTimer--;
      if(s.freezeTimer <= 0) {
        s.state = 'fading';
        s.span.style.opacity = '0';
        mcButtonsContainer.innerHTML = ''; // Clear buttons when timing out
      }
    } 
    else if(s.state === 'fading') {
      if(!s.fadeTimeoutSet) {
        s.fadeTimeoutSet = true;
        setTimeout(() => {
          s.finished = true;
          if(s.span.parentNode) s.span.parentNode.removeChild(s.span);
          mcButtonsContainer.innerHTML = '';

          if (nextSentenceIndex >= sentences.length &&
              activeSentences.filter(st => !st.finished).length === 0) {
              accelerateRocketExit();
          }
        }, 2000); // Matches the 2.0s CSS fade transition
      }
    }
  });

  activeSentences = activeSentences.filter(s => !s.finished);

  if(nextSentenceIndex < sentences.length && !activeSentences.some(s => !s.finished)) {
    spawnSentence(sentences[nextSentenceIndex]);
    nextSentenceIndex++;
  }

if(activeSentences.length > 0) {
    const target = activeSentences[0];
    const rect = target.span.getBoundingClientRect();
    const sentenceY = rect.top - gaRect.top + rect.height / 2;
    planeY += (sentenceY - planeY) * 0.1;
  } else {
    planeY += Math.sin(driftFrame / 10) * 2;
  }
  driftFrame++;
  plane.style.top = planeY - plane.offsetHeight / 2 + 'px';
}

// Override spawn condition in dropSentences loop to strictly enforce 1 active sentence at a time
function dropSentences(){
  if(!gameStarted) return;
  const gaRect = gameArea.getBoundingClientRect();

  activeSentences.forEach(s => {
    if(s.finished) return;

    if(s.state === 'sliding') {
      s.x += (s.targetX - s.x) * 0.1;
      if(Math.abs(s.targetX - s.x) < 1) {
        s.x = s.targetX;
        s.state = 'frozen';
      }
      s.span.style.left = s.x + 'px';

    else if(s.state === 'frozen') {
      s.freezeTimer--;
      if(s.freezeTimer <= 0) {
        s.state = 'fading';
        s.span.style.opacity = '0';
        mcButtonsContainer.innerHTML = '';
      }
    } 
    else if(s.state === 'fading') {
      if(!s.fadeTimeoutSet) {
        s.fadeTimeoutSet = true;
        setTimeout(() => {
          s.finished = true;
          if(s.span.parentNode) s.span.parentNode.removeChild(s.span);
          mcButtonsContainer.innerHTML = '';

          if (nextSentenceIndex >= sentences.length &&
              activeSentences.filter(st => !st.finished).length === 0) {
              accelerateRocketExit();
          }
        }, 2000);
      }
    }
  });

  activeSentences = activeSentences.filter(s => !s.finished);

  // Strictly enforce only ONE active sentence on screen at any time
  if(nextSentenceIndex < sentences.length && activeSentences.length === 0) {
    spawnSentence(sentences[nextSentenceIndex]);
    nextSentenceIndex++;
  }

  if(activeSentences.length > 0) {
    const target = activeSentences[0];
    const rect = target.span.getBoundingClientRect();
    const sentenceY = rect.top - gaRect.top + rect.height / 2;
    planeY += (sentenceY - planeY) * 0.1;
  } else {
    planeY += Math.sin(driftFrame / 10) * 2;
  }
  driftFrame++;
  plane.style.top = planeY - plane.offsetHeight / 2 + 'px';
}

<script>
class AsteroidZSwoosh {
    constructor() {
        this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        const bufferSize = 2 * this.audioCtx.sampleRate;
        const noiseBuffer = this.audioCtx.createBuffer(1, bufferSize, this.audioCtx.sampleRate);
        const data = noiseBuffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
            data[i] = Math.random() * 2 - 1;
        }

        this.noise = this.audioCtx.createBufferSource();
        this.noise.buffer = noiseBuffer;
        this.noise.loop = true;

        this.filter = this.audioCtx.createBiquadFilter();
        this.filter.type = 'lowpass';
        this.filter.frequency.value = 1200;

        this.gainNode = this.audioCtx.createGain();
        this.gainNode.gain.value = 0;

        this.noise.connect(this.filter);
        this.filter.connect(this.gainNode);
        this.gainNode.connect(this.audioCtx.destination);

        this.noise.start();
        this.maxGain = 0.2;
    }

    start() {
        if (this.audioCtx.state === 'suspended') {
            this.audioCtx.resume();
        }
        const now = this.audioCtx.currentTime;
        this.gainNode.gain.cancelScheduledValues(now);
        this.gainNode.gain.setValueAtTime(this.gainNode.gain.value, now);
        this.gainNode.gain.linearRampToValueAtTime(this.maxGain, now + 0.1);
    }

    stop() {
        const now = this.audioCtx.currentTime;
        this.gainNode.gain.cancelScheduledValues(now);
        this.gainNode.gain.setValueAtTime(this.gainNode.gain.value, now);
        this.gainNode.gain.linearRampToValueAtTime(0, now + 1);
    }

    setFrequency(freq) {
        this.filter.frequency.setValueAtTime(
            freq,
            this.audioCtx.currentTime
        );
    }
}

const swoosh = new AsteroidZSwoosh();

function unifyMCButtonWidths() {
    const allBtns = mcButtonsContainer.querySelectorAll('button');
    let maxWidth = 0;

    allBtns.forEach(btn => {
        btn.style.width = 'auto';
        const w = btn.offsetWidth;
        if (w > maxWidth) maxWidth = w;
    });

    allBtns.forEach(btn => {
        btn.style.width = maxWidth + 'px';
    });

    // Automatically set blank width to match the maximum answer/button width
    activeSentences.forEach(s => {
        if (!s.finished && s.blanks) {
            s.blanks.forEach(b => {
                b.elem.style.width = maxWidth + 'px';
            });
        }
    });
}</script>

function openModal(){
  root.style.display="block";
  document.body.style.overflow="hidden";
  document.documentElement.style.overflow="hidden";
}

function closeModal(){
  root.style.display="none";
  document.body.style.overflow="";
  document.documentElement.style.overflow="";
}

btn.onclick = openModal;
document.getElementById("instructionsBack").onclick = closeModal;
document.getElementById("instructionsBackdrop").onclick = closeModal;

document.addEventListener("keydown", e=>{
  if(e.key==="Escape") closeModal();
});

<script>
(function() {
  function preventPinch(e) {
    if (e.touches.length > 1) e.preventDefault();
  }
  let lastTouchTime = 0;
  function preventDoubleTap(e) {
    const now = Date.now();
    if (now - lastTouchTime < 300) {
      e.preventDefault();
    }
    lastTouchTime = now;
  }
  function preventGesture(e) {
    e.preventDefault();
  }

  document.addEventListener('touchstart', preventPinch, { passive: false });
  document.addEventListener('touchend', preventDoubleTap, { passive: false });
  document.addEventListener('gesturestart', preventGesture, { passive: false });
})();
</script>

window.saveResult = async function saveResult(text) {
  if (!supabaseClient) {
    console.error("❌ No Supabase client");
    return;
  }

  let cleaned;
  try {
    cleaned = (typeof text === "string") ? text : JSON.stringify(text);
    cleaned = cleaned.replace(/\s+/g, " ").trim();
  } catch (err) {
    console.error("❌ Normalize error:", err);
    return;
  }

  if (!cleaned) return;
  if (cleaned === lastUploadedScore) return;
  lastUploadedScore = cleaned;

  const { data, error } = await supabaseClient
    .from("scoreboard_raw")
    .insert([{ result_text: cleaned }])
    .select();

  if (error) {
    console.error("❌ INSERT FAILED FULL ERROR:", error);
    return;
  }
  console.log("✅ INSERT SUCCESS:", data);
};
</script>


<!-- 3. STUDENT DATA REGISTRYMODULE -->
<script>
(function() {
    'use strict';
    const RAW_STUDENT_DATA = `
        55555|David
        55551|Matthew
        12345|Sarah
    `;
    const studentDatabase = new Map();
    RAW_STUDENT_DATA.trim().split('\n').forEach(line => {
        const [id, name] = line.split('|').map(s => s ? s.trim() : '');
        if (id && name) studentDatabase.set(id, name);
    });

    window.resolveStudentNameFromId = function(idInput) {
        if (!idInput) return "Student";
        const trimmed = String(idInput).trim();
        if (/^(x|g|guest)$/i.test(trimmed)) {
            return "Guest";
        }
        return studentDatabase.get(trimmed) || "Guest";
    };
})();

</script>
